es: [164]\nstatus: \"imported\"\n---\n\n# 周術期薬剤師連携と指導ツールの導入によるハイリスク薬指導料 1 算定向上への取り組み\n\n- 演題番号: P1-34-7\n- 演題名: 周術期薬剤師連携と指導ツールの導入によるハイリスク薬指導料 1 算定向上への取り組み\n- 所属施設: NHO 熊本医療センター 薬剤部\n- 筆頭演者: 黒川 雄太（くろかわ ゆうた）\n- 筆頭演者の所属: NHO 熊本医療センター 薬剤部\n- 演者名: 黒川 雄太（くろかわ ゆうた）、 三角 紳博（みすみ のぶひろ）、 小園 亜希（こぞの あき）、 齋藤 巨樹（さいとう おおき）、 橋本 崇広（はしもと たかひろ）、 山田 政典（やまだ まさのり）、 田代 早紀（たしろ さき）、 木村 修徳（きむら よしのり）、 濱崎 翔平（はまさき しょうへい）、 中尾 佳世（なかお かよ）、 平木 麻衣（ひらき まい）、 水田 康裕（みずた やすひろ）、 本多 成美（ほんだ なるみ）、 江口 遥菜（えぐち はるな）、 春口 麻衣子（はるぐち まいこ）、 友永 さわ（ともなが さわ）\n- 原本: [PDF 164ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=164>)\n- 冊子ページ: 408\n\n## 抄録本文\n\n### 目的\n\n当院では薬剤管理指導料 1 の実施率の増加が停滞しており、その要因の一つとして術中使用薬剤の情報が病棟薬剤師による確認に限界があることが挙げられた。そこで、術中薬を含む周術期ハイリスク薬の確実な把握を目的に、外来・手術室・病棟を連携する「術前薬剤管理記録」ツールを作成した。本ツールを用いた体制構築が、薬剤管理指導料 1 の算定率向上に寄与するかを検討した。\n\n### 方法\n\n対象は 2025 年 4 月から 2026 年 3 月に全身麻酔を施行した 2399 例とした。2025 年 10 月に導入した本ツールは、入院前常用薬・術前中止薬・アレルギー歴・麻酔管理加算申請情報を管理し、全身麻酔（全麻）症例における術中使用薬の抽出する仕組みを備える。本ツールを用いて手術室薬剤師が全麻症例のスクリーニングを行い、病棟薬剤師へ情報を視覚的に共有・伝達して術後指導へ繋げる体制を構築した。導入前後で薬剤管理指導料 1 の算定件数・算定率の変化を検証した。\n\n### 結果\n\n全麻症例に対する算定率は、導入前 24.9％（306/1229 例）から導入後 68.0％（796/1170 例）へ上昇した。術中薬以外のハイリスク薬による算定は前後で大きな変動を認めなかった（297 件から 307 件）。術中薬を含む算定は 9 件から 489 件へと著明に増加した。\n\n### 考察\n\n術中薬以外の算定に変動がないことから、算定向上は本ツール導入による術中薬の把握精度向上によるものと考える。周術期における薬剤関連リスクは術後合併症の原因となり得るが、薬剤師の継続的介入が適正化に寄与すると報告されている。本取り組みは、術中薬を含む周術期薬剤情報の共有が可能となり、病棟の業務負荷を増やすことなく周術期薬物管理を強化する、実用性の高い運用体制と言える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 周術期の情報を集約する指導ツールと薬剤師間連携を、全身麻酔2,399例で評価。\n- 薬剤管理指導料1の算定率が24.9％から68.0％へ上昇。術中薬を含めた情報共有と指導内容の整備に注目できる。\n\n", "rec_grade": "B", "rec_perspective": "周術期連携・指導料算定", "rec_reason": "全身麻酔2,399例を対象に、外来・手術室・病棟をつなぐ「術前薬剤管理記録」ツールで術中ハイリスク薬を可視化。薬剤管理指導料1算定率を24.9%→68.0%へ飛躍的に向上。"}, {"id": "P1-38-1", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-38", "session_name": "がん薬物療法・タルラタマブ・薬剤師外来", "title": "アロマターゼ阻害薬使用患者における骨密度測定の現状と実施率向上への取り組み", "authors": "平野 裕也（ひらの ゆうや） 1、 上原 智博（うえはら ともひろ） 1、 谷口 潤（たにぐち じゅん） 1、 寺島 明日香（てらしま あすか） 2、 鎌田 華音（かまだ かのん） 3、 蔵下 要（くらした かなめ） 4", "first_author": "平野 裕也（ひらの ゆうや） 1", "affiliations": "1 NHO 沖縄病院 薬剤科、2 NHO 熊本医療センター 放射線科、3 NHO 沖縄病院 放射線科、 4 NHO 沖縄病院 乳腺外科", "first_affiliation": "NHO 沖縄病院 薬剤科", "printed_pages": "414", "pdf_pages": "170", "features": ["アロマターゼ阻害薬使用患者の骨密度検査の未実施を拾い、薬剤師から検査依頼につなげる取り組み。", "実施率は18％から31％へ上昇したが未実施も残る。検査対象の抽出方法と継続的な受検支援が聴講ポイント。"], "issues": [], "sections": [{"heading": "目的", "content": "国立病院機構の「臨床評価指標 Ver.5」における「アロマターゼ阻害薬（以下、AI）処方患者に対する骨密度測定の実施率」の項目において、沖縄病院（以下、当院）は目標値の 80％に達していない現状であった。AI の代表的な副作用として骨粗鬆症が挙げられ、乳腺診療ガイドライン 2022 年版においても、定期的な骨密度の評価を行い、骨折のリスクに応じて骨粗鬆症治療薬を使用することが推奨されている。AI による副作用早期発見による薬物療法の質の向上のため、骨密度測定の現状調査及び実施率向上への取り組みを行ったので報告する。"}, {"heading": "方法", "content": "当院で AI 処方のある患者を対象とした。2025 年 4 月 1 日〜2025 年8 月 31 日を実施率向上の取組前期間とし、DEXA 法による腰椎撮影による骨塩定量検査（以下、骨密度検査）未実施の患者を抽出した。2025 年 9 月を取組期間とし、検査未実施の患者に対して検査実施依頼をかけた。2025 年 10 月 1 日〜2026 年 3 月 31 日を取組後期間として、骨密度測定の実施率を取組前後で比較した。"}, {"heading": "結果", "content": "取組前期間において、骨密度測定実施率は 18％（n=38）であった。検査依頼を行った結果、骨密度検査実施率は 31％（n=32）であり 13％増加した。"}, {"heading": "考察", "content": "今回の取り組みで検査実施率が上昇したことから、検査実施の啓発に貢献できたと考えられる。今後は取り組み期間を延長するとともに、AI 服用による骨粗鬆症リスクの高い患者に対する治療の有無も含めた調査を行い、適切な医療の提供に努めたい。"}], "body_text": "### 目的\n\n国立病院機構の「臨床評価指標 Ver.5」における「アロマターゼ阻害薬（以下、AI）処方患者に対する骨密度測定の実施率」の項目において、沖縄病院（以下、当院）は目標値の 80％に達していない現状であった。AI の代表的な副作用として骨粗鬆症が挙げられ、乳腺診療ガイドライン 2022 年版においても、定期的な骨密度の評価を行い、骨折のリスクに応じて骨粗鬆症治療薬を使用することが推奨されている。AI による副作用早期発見による薬物療法の質の向上のため、骨密度測定の現状調査及び実施率向上への取り組みを行ったので報告する。\n\n### 方法\n\n当院で AI 処方のある患者を対象とした。2025 年 4 月 1 日〜2025 年8 月 31 日を実施率向上の取組前期間とし、DEXA 法による腰椎撮影による骨塩定量検査（以下、骨密度検査）未実施の患者を抽出した。2025 年 9 月を取組期間とし、検査未実施の患者に対して検査実施依頼をかけた。2025 年 10 月 1 日〜2026 年 3 月 31 日を取組後期間として、骨密度測定の実施率を取組前後で比較した。\n\n### 結果\n\n取組前期間において、骨密度測定実施率は 18％（n=38）であった。検査依頼を行った結果、骨密度検査実施率は 31％（n=32）であり 13％増加した。\n\n### 考察\n\n今回の取り組みで検査実施率が上昇したことから、検査実施の啓発に貢献できたと考えられる。今後は取り組み期間を延長するとともに、AI 服用による骨粗鬆症リスクの高い患者に対する治療の有無も含めた調査を行い、適切な医療の提供に努めたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-38-1\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [170]\nstatus: \"imported\"\n---\n\n# アロマターゼ阻害薬使用患者における骨密度測定の現状と実施率向上への取り組み\n\n- 演題番号: P1-38-1\n- 演題名: アロマターゼ阻害薬使用患者における骨密度測定の現状と実施率向上への取り組み\n- 所属施設: 1 NHO 沖縄病院 薬剤科、2 NHO 熊本医療センター 放射線科、3 NHO 沖縄病院 放射線科、 4 NHO 沖縄病院 乳腺外科\n- 筆頭演者: 平野 裕也（ひらの ゆうや） 1\n- 筆頭演者の所属: NHO 沖縄病院 薬剤科\n- 演者名: 平野 裕也（ひらの ゆうや） 1、 上原 智博（うえはら ともひろ） 1、 谷口 潤（たにぐち じゅん） 1、 寺島 明日香（てらしま あすか） 2、 鎌田 華音（かまだ かのん） 3、 蔵下 要（くらした かなめ） 4\n- 原本: [PDF 170ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=170>)\n- 冊子ページ: 414\n\n## 抄録本文\n\n### 目的\n\n国立病院機構の「臨床評価指標 Ver.5」における「アロマターゼ阻害薬（以下、AI）処方患者に対する骨密度測定の実施率」の項目において、沖縄病院（以下、当院）は目標値の 80％に達していない現状であった。AI の代表的な副作用として骨粗鬆症が挙げられ、乳腺診療ガイドライン 2022 年版においても、定期的な骨密度の評価を行い、骨折のリスクに応じて骨粗鬆症治療薬を使用することが推奨されている。AI による副作用早期発見による薬物療法の質の向上のため、骨密度測定の現状調査及び実施率向上への取り組みを行ったので報告する。\n\n### 方法\n\n当院で AI 処方のある患者を対象とした。2025 年 4 月 1 日〜2025 年8 月 31 日を実施率向上の取組前期間とし、DEXA 法による腰椎撮影による骨塩定量検査（以下、骨密度検査）未実施の患者を抽出した。2025 年 9 月を取組期間とし、検査未実施の患者に対して検査実施依頼をかけた。2025 年 10 月 1 日〜2026 年 3 月 31 日を取組後期間として、骨密度測定の実施率を取組前後で比較した。\n\n### 結果\n\n取組前期間において、骨密度測定実施率は 18％（n=38）であった。検査依頼を行った結果、骨密度検査実施率は 31％（n=32）であり 13％増加した。\n\n### 考察\n\n今回の取り組みで検査実施率が上昇したことから、検査実施の啓発に貢献できたと考えられる。今後は取り組み期間を延長するとともに、AI 服用による骨粗鬆症リスクの高い患者に対する治療の有無も含めた調査を行い、適切な医療の提供に努めたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- アロマターゼ阻害薬使用患者の骨密度検査の未実施を拾い、薬剤師から検査依頼につなげる取り組み。\n- 実施率は18％から31％へ上昇したが未実施も残る。検査対象の抽出方法と継続的な受検支援が聴講ポイント。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-38-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-38", "session_name": "がん薬物療法・タルラタマブ・薬剤師外来", "title": "タルラタマブ投与によりサイトカイン放出症候群（CRS）を発症した症例報告", "authors": "石本 綾（いしもと あや） 1、 金岡 樹輝（かなおか しげき） 1、 平吹 真理子（ひらぶき まりこ） 1、 桃井 祥制（ももい よしのり） 1、 山岸 佳代（やまぎし かよ） 1、 高田 慎也（たかだ しんや） 2、 菊地 実（きくち みのる） 3", "first_author": "石本 綾（いしもと あや） 1", "affiliations": "1 NHO 北海道医療センター 薬剤科、2 NHO 北海道がんセンター 薬剤科、 3 NHO 旭川医療センター 薬剤科", "first_affiliation": "NHO 北海道医療センター 薬剤科", "printed_pages": "415", "pdf_pages": "171", "features": ["タルラタマブ投与後のCRSについて、発症時期とステロイド・トシリズマブ使用経過を症例で提示。", "初回投与直後以外の経過も含めた観察と重症度評価が参考となる。各症例の判断根拠と連絡体制を確認したい。"], "issues": [], "sections": [{"heading": "はじめに", "content": "進行または再発小細胞肺がんで使用されるタルラタマブは、骨髄抑制や味覚障害などの他にサイトカイン放出症候群（以下 CRS）や免疫エフェクター細胞関連神経毒性症候群（以下 ICANS）などの特徴的な副作用が起こることがある。そのため投与中は一般的な副作用の他に CRS 等に対する管理が求められている。今回当院において患者 7 名にタルラタマブを使用し、うち 5 名に CRS 等の副作用を発症した症例を経験したので報告する。"}, {"heading": "症例", "content": "症例 160 代男性。投与 1 コース目 Day1 夜間に発熱を認めアセトアミノフェン、デキサメタゾンを投与し解熱を確認した。Day17 呼吸状態の悪化、微熱の継続がみられ G2 のCRS としてデキサメタゾン、トシリズマブが投与された。症例 260 代男性。投与 1 コース目 Day1 夜間に発熱、SPO2 軽度低下がみられ、アセトアミノフェン、デキサメタゾンを投与し解熱と SPO2 の回復を確認した。Day2 再度、発熱を認めたためアセトアミノフェン投与するも解熱せずトシリズマブが投与された。"}, {"heading": "考察", "content": "タルラタマブの投与において CRS を中心に様々な副作用を経験した。CRS はタルラタマブ投与例において約半数程度で生じると報告されており、特に 1 コース目 Day1，Day8 の投与 24 時間以内に起こりやすいとされている。当院でも半数以上で CRS が発生し発生時期についても報告と同様であった。AE対策として事前に解熱剤やステロイド等 CRS 対策薬の準備や他職種間での情報共有が必須であると考え、カンファレンスにてディスカッションを行い、CRS 発症時にも遅延なく対処することができた。今後タルラタマブ初回導入時には特に、多職種間で情報共有を密に行いCRS 発生時に迅速に対応できるよう連携していきたいと考える。"}], "body_text": "### はじめに\n\n進行または再発小細胞肺がんで使用されるタルラタマブは、骨髄抑制や味覚障害などの他にサイトカイン放出症候群（以下 CRS）や免疫エフェクター細胞関連神経毒性症候群（以下 ICANS）などの特徴的な副作用が起こることがある。そのため投与中は一般的な副作用の他に CRS 等に対する管理が求められている。今回当院において患者 7 名にタルラタマブを使用し、うち 5 名に CRS 等の副作用を発症した症例を経験したので報告する。\n\n### 症例\n\n症例 160 代男性。投与 1 コース目 Day1 夜間に発熱を認めアセトアミノフェン、デキサメタゾンを投与し解熱を確認した。Day17 呼吸状態の悪化、微熱の継続がみられ G2 のCRS としてデキサメタゾン、トシリズマブが投与された。症例 260 代男性。投与 1 コース目 Day1 夜間に発熱、SPO2 軽度低下がみられ、アセトアミノフェン、デキサメタゾンを投与し解熱と SPO2 の回復を確認した。Day2 再度、発熱を認めたためアセトアミノフェン投与するも解熱せずトシリズマブが投与された。\n\n### 考察\n\nタルラタマブの投与において CRS を中心に様々な副作用を経験した。CRS はタルラタマブ投与例において約半数程度で生じると報告されており、特に 1 コース目 Day1，Day8 の投与 24 時間以内に起こりやすいとされている。当院でも半数以上で CRS が発生し発生時期についても報告と同様であった。AE対策として事前に解熱剤やステロイド等 CRS 対策薬の準備や他職種間での情報共有が必須であると考え、カンファレンスにてディスカッションを行い、CRS 発症時にも遅延なく対処することができた。今後タルラタマブ初回導入時には特に、多職種間で情報共有を密に行いCRS 発生時に迅速に対応できるよう連携していきたいと考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-38-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [171]\nstatus: \"imported\"\n---\n\n# タルラタマブ投与によりサイトカイン放出症候群（CRS）を発症した症例報告\n\n- 演題番号: P1-38-2\n- 演題名: タルラタマブ投与によりサイトカイン放出症候群（CRS）を発症した症例報告\n- 所属施設: 1 NHO 北海道医療センター 薬剤科、2 NHO 北海道がんセンター 薬剤科、 3 NHO 旭川医療センター 薬剤科\n- 筆頭演者: 石本 綾（いしもと あや） 1\n- 筆頭演者の所属: NHO 北海道医療センター 薬剤科\n- 演者名: 石本 綾（いしもと あや） 1、 金岡 樹輝（かなおか しげき） 1、 平吹 真理子（ひらぶき まりこ） 1、 桃井 祥制（ももい よしのり） 1、 山岸 佳代（やまぎし かよ） 1、 高田 慎也（たかだ しんや） 2、 菊地 実（きくち みのる） 3\n- 原本: [PDF 171ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=171>)\n- 冊子ページ: 415\n\n## 抄録本文\n\n### はじめに\n\n進行または再発小細胞肺がんで使用されるタルラタマブは、骨髄抑制や味覚障害などの他にサイトカイン放出症候群（以下 CRS）や免疫エフェクター細胞関連神経毒性症候群（以下 ICANS）などの特徴的な副作用が起こることがある。そのため投与中は一般的な副作用の他に CRS 等に対する管理が求められている。今回当院において患者 7 名にタルラタマブを使用し、うち 5 名に CRS 等の副作用を発症した症例を経験したので報告する。\n\n### 症例\n\n症例 160 代男性。投与 1 コース目 Day1 夜間に発熱を認めアセトアミノフェン、デキサメタゾンを投与し解熱を確認した。Day17 呼吸状態の悪化、微熱の継続がみられ G2 のCRS としてデキサメタゾン、トシリズマブが投与された。症例 260 代男性。投与 1 コース目 Day1 夜間に発熱、SPO2 軽度低下がみられ、アセトアミノフェン、デキサメタゾンを投与し解熱と SPO2 の回復を確認した。Day2 再度、発熱を認めたためアセトアミノフェン投与するも解熱せずトシリズマブが投与された。\n\n### 考察\n\nタルラタマブの投与において CRS を中心に様々な副作用を経験した。CRS はタルラタマブ投与例において約半数程度で生じると報告されており、特に 1 コース目 Day1，Day8 の投与 24 時間以内に起こりやすいとされている。当院でも半数以上で CRS が発生し発生時期についても報告と同様であった。AE対策として事前に解熱剤やステロイド等 CRS 対策薬の準備や他職種間での情報共有が必須であると考え、カンファレンスにてディスカッションを行い、CRS 発症時にも遅延なく対処することができた。今後タルラタマブ初回導入時には特に、多職種間で情報共有を密に行いCRS 発生時に迅速に対応できるよう連携していきたいと考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- タルラタマブ投与後のCRSについて、発症時期とステロイド・トシリズマブ使用経過を症例で提示。\n- 初回投与直後以外の経過も含めた観察と重症度評価が参考となる。各症例の判断根拠と連絡体制を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-38-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-38", "session_name": "がん薬物療法・タルラタマブ・薬剤師外来", "title": "タルラタマブ導入における多職種連携", "authors": "寺内 涼音（てらうち すずね）、 藤井 大和（ふじい やまと）、 野崎 美紀（のざき みき）、水 津 智樹（すいず ともき）、 宮部 貴識（みやべ たかし）", "first_author": "寺内 涼音（てらうち すずね）", "affiliations": "NHO 大阪刀根山医療センター 薬剤部", "first_affiliation": "NHO 大阪刀根山医療センター 薬剤部", "printed_pages": "415", "pdf_pages": "171", "features": ["タルラタマブ導入時に、対策薬の在庫、レジメン・セット処方、病棟配置を多職種で整備。", "4例の経験中に重症例を含み、迅速な薬剤投与や処方漏れ防止を報告。導入前準備の具体的な分担に学べる。"], "issues": [], "sections": [{"heading": "目的", "content": "タルラタマブは「がん化学療法後に増悪した小細胞肺癌」に対して承認された最新の抗がん薬である。重大な副作用としてサイトカイン放出症候群（CRS）が報告されており、急速に重症化し致死的となる可能性が考えられる。タルラタマブ導入に際し、緊急時対応を含めた適正使用体制の構築を目的として、当院では薬剤部を中心に多職種と連携して取り組みを行ったため報告する。"}, {"heading": "方法", "content": "薬剤部では、タルラタマブに関する部内勉強会を実施し、CRS 発現時に使用するトシリズマブ（TCZ）の院内在庫数を見直した。また、呼吸器腫瘍内科と協働し、タルラタマブのレジメンや CRS 発現時のセット処方を作成した。さらに看護部と連携し、投与ルートの材質確認や TCZ 投与後の infusion reaction 対策として病棟配置薬の見直し等を行った。"}, {"heading": "結果", "content": "当院では 2025 年 7 月より 4 例に投与を行い、1 例で意識障害やてんかんを伴う Grade4（CTCAE ver.5.0）の CRS を認めたが、運用に基づき TCZ やデキサメタゾンの迅速な投与が可能であった。薬剤師の介入により TCZ の処方漏れ防止や副作用確認の情報共有が行われ、CRS の早期発見に繋がった。"}, {"heading": "考察", "content": "薬剤部が多職種と連携することで、タルラタマブの適正使用体制を構築できたと考える。一方、初回導入時は各職種の業務が煩雑となり、セット処方や副作用確認の漏れが生じる可能性がある。そのため、病棟薬剤師の積極的な介入が、タルラタマブの安全かつ適正な使用に繋がると示唆された。肺がん治療は更に複雑化していくと予想されるため、今後も多職種との緻密な連携が必要であると考える。"}], "body_text": "### 目的\n\nタルラタマブは「がん化学療法後に増悪した小細胞肺癌」に対して承認された最新の抗がん薬である。重大な副作用としてサイトカイン放出症候群（CRS）が報告されており、急速に重症化し致死的となる可能性が考えられる。タルラタマブ導入に際し、緊急時対応を含めた適正使用体制の構築を目的として、当院では薬剤部を中心に多職種と連携して取り組みを行ったため報告する。\n\n### 方法\n\n薬剤部では、タルラタマブに関する部内勉強会を実施し、CRS 発現時に使用するトシリズマブ（TCZ）の院内在庫数を見直した。また、呼吸器腫瘍内科と協働し、タルラタマブのレジメンや CRS 発現時のセット処方を作成した。さらに看護部と連携し、投与ルートの材質確認や TCZ 投与後の infusion reaction 対策として病棟配置薬の見直し等を行った。\n\n### 結果\n\n当院では 2025 年 7 月より 4 例に投与を行い、1 例で意識障害やてんかんを伴う Grade4（CTCAE ver.5.0）の CRS を認めたが、運用に基づき TCZ やデキサメタゾンの迅速な投与が可能であった。薬剤師の介入により TCZ の処方漏れ防止や副作用確認の情報共有が行われ、CRS の早期発見に繋がった。\n\n### 考察\n\n薬剤部が多職種と連携することで、タルラタマブの適正使用体制を構築できたと考える。一方、初回導入時は各職種の業務が煩雑となり、セット処方や副作用確認の漏れが生じる可能性がある。そのため、病棟薬剤師の積極的な介入が、タルラタマブの安全かつ適正な使用に繋がると示唆された。肺がん治療は更に複雑化していくと予想されるため、今後も多職種との緻密な連携が必要であると考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-38-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [171]\nstatus: \"imported\"\n---\n\n# タルラタマブ導入における多職種連携\n\n- 演題番号: P1-38-3\n- 演題名: タルラタマブ導入における多職種連携\n- 所属施設: NHO 大阪刀根山医療センター 薬剤部\n- 筆頭演者: 寺内 涼音（てらうち すずね）\n- 筆頭演者の所属: NHO 大阪刀根山医療センター 薬剤部\n- 演者名: 寺内 涼音（てらうち すずね）、 藤井 大和（ふじい やまと）、 野崎 美紀（のざき みき）、水 津 智樹（すいず ともき）、 宮部 貴識（みやべ たかし）\n- 原本: [PDF 171ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=171>)\n- 冊子ページ: 415\n\n## 抄録本文\n\n### 目的\n\nタルラタマブは「がん化学療法後に増悪した小細胞肺癌」に対して承認された最新の抗がん薬である。重大な副作用としてサイトカイン放出症候群（CRS）が報告されており、急速に重症化し致死的となる可能性が考えられる。タルラタマブ導入に際し、緊急時対応を含めた適正使用体制の構築を目的として、当院では薬剤部を中心に多職種と連携して取り組みを行ったため報告する。\n\n### 方法\n\n薬剤部では、タルラタマブに関する部内勉強会を実施し、CRS 発現時に使用するトシリズマブ（TCZ）の院内在庫数を見直した。また、呼吸器腫瘍内科と協働し、タルラタマブのレジメンや CRS 発現時のセット処方を作成した。さらに看護部と連携し、投与ルートの材質確認や TCZ 投与後の infusion reaction 対策として病棟配置薬の見直し等を行った。\n\n### 結果\n\n当院では 2025 年 7 月より 4 例に投与を行い、1 例で意識障害やてんかんを伴う Grade4（CTCAE ver.5.0）の CRS を認めたが、運用に基づき TCZ やデキサメタゾンの迅速な投与が可能であった。薬剤師の介入により TCZ の処方漏れ防止や副作用確認の情報共有が行われ、CRS の早期発見に繋がった。\n\n### 考察\n\n薬剤部が多職種と連携することで、タルラタマブの適正使用体制を構築できたと考える。一方、初回導入時は各職種の業務が煩雑となり、セット処方や副作用確認の漏れが生じる可能性がある。そのため、病棟薬剤師の積極的な介入が、タルラタマブの安全かつ適正な使用に繋がると示唆された。肺がん治療は更に複雑化していくと予想されるため、今後も多職種との緻密な連携が必要であると考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- タルラタマブ導入時に、対策薬の在庫、レジメン・セット処方、病棟配置を多職種で整備。\n- 4例の経験中に重症例を含み、迅速な薬剤投与や処方漏れ防止を報告。導入前準備の具体的な分担に学べる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-38-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-38", "session_name": "がん薬物療法・タルラタマブ・薬剤師外来", "title": "Tarlatamab 対策セットの運用と多職種連携", "authors": "矢島 克海（やじま かつみ） 1、 菅原 彩（すがわら さやか） 1、 吉川 至（よしかわ いたる） 1、菊 池 教大（きくち のりひろ） 2", "first_author": "矢島 克海（やじま かつみ） 1", "affiliations": "1 NHO 霞ヶ浦医療センター 薬剤部、2 NHO 霞ヶ浦医療センター 呼吸器内科", "first_affiliation": "NHO 霞ヶ浦医療センター 薬剤部", "printed_pages": "415", "pdf_pages": "171", "features": ["タルラタマブ対策セットを、医師・看護師の評価と看護師の経験年数別分析から検証。", "物品の所在と副作用Grade表が支持され、若手の不安軽減にも着目。セットの内容・更新体制が導入の参考となる。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "夜間・休日に医師・薬剤師が不在となる施設では、新規薬剤導入時の安全性確保と看護師の初期対応負担が課題となる。当院では Tarlatamab 導入に際し、Grade 評価表・投与管理票・初期対応薬剤・ドクターコール基準を統合した「対策セット」を多職種協働で整備した。今回、対策セットの有用性と職種間・経験年数間での評価差を検証したので報告する。"}, {"heading": "方法", "content": "無記名アンケートを実施し、医師 4 件、看護師 22 件の回答を得た。各職種にリッカート尺度を利用した職種共通設問と自由記載 2 題、看護師には経験年数・配属先、メリット項目の複数選択を設定した。"}, {"heading": "結果", "content": "医師は全 6 設問で中央値 5、肯定率 75〜100％。看護師も全項目で肯定率 64〜84％と高評価を示し、Grade 評価表によるドクターコール円滑化が支持された。メリット選択では「物品所在の明確化」73％、「副作用 Grade 表」68％が上位であった。看護師サブ解析では経験 4 年以下群が不安軽減・多職種連携で最も高評価を示し、在庫体制・投与時間管理・展開汎用化で経験年数による評価差を認めた。外来看護師は Grade 評価表を病棟より高く評価する一方、初期対応への不安軽減の評価は相対的に低かった。自由記載では「経験の浅い担当者でも対応しやすい」「定期的アップデートが必要」との声が得られた。"}, {"heading": "考察", "content": "対策セットは職種を越えて支持され、特に経験年数 4 年目までの看護師における業務負担や不安の軽減と、外来看護師において判断支援に寄与する可能性が示された。一方で初期対応への心理的不安は残存しており、薬剤・副作用情報の迅速共有が今後の課題である。"}], "body_text": "### 背景・目的\n\n夜間・休日に医師・薬剤師が不在となる施設では、新規薬剤導入時の安全性確保と看護師の初期対応負担が課題となる。当院では Tarlatamab 導入に際し、Grade 評価表・投与管理票・初期対応薬剤・ドクターコール基準を統合した「対策セット」を多職種協働で整備した。今回、対策セットの有用性と職種間・経験年数間での評価差を検証したので報告する。\n\n### 方法\n\n無記名アンケートを実施し、医師 4 件、看護師 22 件の回答を得た。各職種にリッカート尺度を利用した職種共通設問と自由記載 2 題、看護師には経験年数・配属先、メリット項目の複数選択を設定した。\n\n### 結果\n\n医師は全 6 設問で中央値 5、肯定率 75〜100％。看護師も全項目で肯定率 64〜84％と高評価を示し、Grade 評価表によるドクターコール円滑化が支持された。メリット選択では「物品所在の明確化」73％、「副作用 Grade 表」68％が上位であった。看護師サブ解析では経験 4 年以下群が不安軽減・多職種連携で最も高評価を示し、在庫体制・投与時間管理・展開汎用化で経験年数による評価差を認めた。外来看護師は Grade 評価表を病棟より高く評価する一方、初期対応への不安軽減の評価は相対的に低かった。自由記載では「経験の浅い担当者でも対応しやすい」「定期的アップデートが必要」との声が得られた。\n\n### 考察\n\n対策セットは職種を越えて支持され、特に経験年数 4 年目までの看護師における業務負担や不安の軽減と、外来看護師において判断支援に寄与する可能性が示された。一方で初期対応への心理的不安は残存しており、薬剤・副作用情報の迅速共有が今後の課題である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-38-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [171]\nstatus: \"imported\"\n---\n\n# Tarlatamab 対策セットの運用と多職種連携\n\n- 演題番号: P1-38-4\n- 演題名: Tarlatamab 対策セットの運用と多職種連携\n- 所属施設: 1 NHO 霞ヶ浦医療センター 薬剤部、2 NHO 霞ヶ浦医療センター 呼吸器内科\n- 筆頭演者: 矢島 克海（やじま かつみ） 1\n- 筆頭演者の所属: NHO 霞ヶ浦医療センター 薬剤部\n- 演者名: 矢島 克海（やじま かつみ） 1、 菅原 彩（すがわら さやか） 1、 吉川 至（よしかわ いたる） 1、菊 池 教大（きくち のりひろ） 2\n- 原本: [PDF 171ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=171>)\n- 冊子ページ: 415\n\n## 抄録本文\n\n### 背景・目的\n\n夜間・休日に医師・薬剤師が不在となる施設では、新規薬剤導入時の安全性確保と看護師の初期対応負担が課題となる。当院では Tarlatamab 導入に際し、Grade 評価表・投与管理票・初期対応薬剤・ドクターコール基準を統合した「対策セット」を多職種協働で整備した。今回、対策セットの有用性と職種間・経験年数間での評価差を検証したので報告する。\n\n### 方法\n\n無記名アンケートを実施し、医師 4 件、看護師 22 件の回答を得た。各職種にリッカート尺度を利用した職種共通設問と自由記載 2 題、看護師には経験年数・配属先、メリット項目の複数選択を設定した。\n\n### 結果\n\n医師は全 6 設問で中央値 5、肯定率 75〜100％。看護師も全項目で肯定率 64〜84％と高評価を示し、Grade 評価表によるドクターコール円滑化が支持された。メリット選択では「物品所在の明確化」73％、「副作用 Grade 表」68％が上位であった。看護師サブ解析では経験 4 年以下群が不安軽減・多職種連携で最も高評価を示し、在庫体制・投与時間管理・展開汎用化で経験年数による評価差を認めた。外来看護師は Grade 評価表を病棟より高く評価する一方、初期対応への不安軽減の評価は相対的に低かった。自由記載では「経験の浅い担当者でも対応しやすい」「定期的アップデートが必要」との声が得られた。\n\n### 考察\n\n対策セットは職種を越えて支持され、特に経験年数 4 年目までの看護師における業務負担や不安の軽減と、外来看護師において判断支援に寄与する可能性が示された。一方で初期対応への心理的不安は残存しており、薬剤・副作用情報の迅速共有が今後の課題である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- タルラタマブ対策セットを、医師・看護師の評価と看護師の経験年数別分析から検証。\n- 物品の所在と副作用Grade表が支持され、若手の不安軽減にも着目。セットの内容・更新体制が導入の参考となる。\n\n", "rec_grade": "B", "rec_perspective": "新規抗がん薬・安全管理", "rec_reason": "小細胞肺がん新薬タルラタマブのCRS/ICANS対策として「Grade評価表・投与管理票・初期対応薬・コール基準」統合セットを構築。看護師経験年数・配属別の評価差まで検証。"}, {"id": "P1-38-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-38", "session_name": "がん薬物療法・タルラタマブ・薬剤師外来", "title": "タルラタマブの導入患者における使用状況について", "authors": "佃 美穂（つくだ みほ）", "first_author": "佃 美穂（つくだ みほ）", "affiliations": "NHO 岩国医療センター 薬剤部", "first_affiliation": "NHO 岩国医療センター 薬剤部", "printed_pages": "415", "pdf_pages": "171", "features": ["タルラタマブ導入9例について、CRS・ICANSとその対処、入院期間を含む実臨床での使用状況を報告。", "重症有害事象を含む少数例の経験として、発現時期や対応薬、監視体制を確認したい。発現率の一般化には限界がある。"], "issues": [], "sections": [{"heading": "背景", "content": "再発小細胞肺がんに対しタルラタマブは 2 次治療以降で推奨されている。本剤はサイトカイン放出症候群（以下 CRS）、免疫エフェクター細胞関連神経毒性症候群（以下ICANS）、間質性肺炎などの有害事象が報告されており、迅速かつ適切な対応が必要である。当院では導入にあたり運用整備体制を構築している。この度、実臨床での実態調査を行ったため報告する。"}, {"heading": "方法", "content": "2025 年 4 月〜2026 年 4 月にタルラタマブを投与した患者を対象に、電子カルテを用いて後方視的に調査した。CRS と ICANS は適正使用ガイドを用い、その他は CTCAE ver5.0 に基づき評価した。"}, {"heading": "結果", "content": "対象は 9 例（男性 7 例、女性 2 例）、各中央値は年齢 70 歳（62-79）、PS1（0-3）、前治療数 3 レジメン（2-6）、入院期間は 18 日（4-27）であった。CRS は 6 例（Grade1：3 例、Grade2：2 例、Grade4：1 例）、ICANSは 3 例（Grade1：1 例、Grade2：1 例、Grade4：1 例）に認めた。有害事象が発現したうち、ステロイドは 6 例、トシリズマブは 3 例投与した。調査期間での間質性肺炎の新規発症は認めなかったが、既往 2 例中 1 例で増悪を認めた。投与回数中央値は 6 回、休薬例は認めなかった。"}, {"heading": "考察", "content": "本調査により当院におけるタルラタマブの使用実態が明らかとなった。CRS の発現時期は適正使用ガイドと同様の傾向を示していた一方、1 サイクル目でのICANS 発症した症例も認め、早期より注意し経過確認していく必要があると考える。今後は、症例を集積し有害事象のリスク因子解析なども検討していきたい。"}], "body_text": "### 背景\n\n再発小細胞肺がんに対しタルラタマブは 2 次治療以降で推奨されている。本剤はサイトカイン放出症候群（以下 CRS）、免疫エフェクター細胞関連神経毒性症候群（以下ICANS）、間質性肺炎などの有害事象が報告されており、迅速かつ適切な対応が必要である。当院では導入にあたり運用整備体制を構築している。この度、実臨床での実態調査を行ったため報告する。\n\n### 方法\n\n2025 年 4 月〜2026 年 4 月にタルラタマブを投与した患者を対象に、電子カルテを用いて後方視的に調査した。CRS と ICANS は適正使用ガイドを用い、その他は CTCAE ver5.0 に基づき評価した。\n\n### 結果\n\n対象は 9 例（男性 7 例、女性 2 例）、各中央値は年齢 70 歳（62-79）、PS1（0-3）、前治療数 3 レジメン（2-6）、入院期間は 18 日（4-27）であった。CRS は 6 例（Grade1：3 例、Grade2：2 例、Grade4：1 例）、ICANSは 3 例（Grade1：1 例、Grade2：1 例、Grade4：1 例）に認めた。有害事象が発現したうち、ステロイドは 6 例、トシリズマブは 3 例投与した。調査期間での間質性肺炎の新規発症は認めなかったが、既往 2 例中 1 例で増悪を認めた。投与回数中央値は 6 回、休薬例は認めなかった。\n\n### 考察\n\n本調査により当院におけるタルラタマブの使用実態が明らかとなった。CRS の発現時期は適正使用ガイドと同様の傾向を示していた一方、1 サイクル目でのICANS 発症した症例も認め、早期より注意し経過確認していく必要があると考える。今後は、症例を集積し有害事象のリスク因子解析なども検討していきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-38-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [171]\nstatus: \"imported\"\n---\n\n# タルラタマブの導入患者における使用状況について\n\n- 演題番号: P1-38-5\n- 演題名: タルラタマブの導入患者における使用状況について\n- 所属施設: NHO 岩国医療センター 薬剤部\n- 筆頭演者: 佃 美穂（つくだ みほ）\n- 筆頭演者の所属: NHO 岩国医療センター 薬剤部\n- 演者名: 佃 美穂（つくだ みほ）\n- 原本: [PDF 171ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=171>)\n- 冊子ページ: 415\n\n## 抄録本文\n\n### 背景\n\n再発小細胞肺がんに対しタルラタマブは 2 次治療以降で推奨されている。本剤はサイトカイン放出症候群（以下 CRS）、免疫エフェクター細胞関連神経毒性症候群（以下ICANS）、間質性肺炎などの有害事象が報告されており、迅速かつ適切な対応が必要である。当院では導入にあたり運用整備体制を構築している。この度、実臨床での実態調査を行ったため報告する。\n\n### 方法\n\n2025 年 4 月〜2026 年 4 月にタルラタマブを投与した患者を対象に、電子カルテを用いて後方視的に調査した。CRS と ICANS は適正使用ガイドを用い、その他は CTCAE ver5.0 に基づき評価した。\n\n### 結果\n\n対象は 9 例（男性 7 例、女性 2 例）、各中央値は年齢 70 歳（62-79）、PS1（0-3）、前治療数 3 レジメン（2-6）、入院期間は 18 日（4-27）であった。CRS は 6 例（Grade1：3 例、Grade2：2 例、Grade4：1 例）、ICANSは 3 例（Grade1：1 例、Grade2：1 例、Grade4：1 例）に認めた。有害事象が発現したうち、ステロイドは 6 例、トシリズマブは 3 例投与した。調査期間での間質性肺炎の新規発症は認めなかったが、既往 2 例中 1 例で増悪を認めた。投与回数中央値は 6 回、休薬例は認めなかった。\n\n### 考察\n\n本調査により当院におけるタルラタマブの使用実態が明らかとなった。CRS の発現時期は適正使用ガイドと同様の傾向を示していた一方、1 サイクル目でのICANS 発症した症例も認め、早期より注意し経過確認していく必要があると考える。今後は、症例を集積し有害事象のリスク因子解析なども検討していきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- タルラタマブ導入9例について、CRS・ICANSとその対処、入院期間を含む実臨床での使用状況を報告。\n- 重症有害事象を含む少数例の経験として、発現時期や対応薬、監視体制を確認したい。発現率の一般化には限界がある。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-38-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-38", "session_name": "がん薬物療法・タルラタマブ・薬剤師外来", "title": "外来がん化学療法における末梢神経障害治療薬に対する薬剤師介入状況と処方状況について", "authors": "林 成美（はやし なるみ）、 合原 嘉寿（ごうはら よしひさ）、 田代 愛（たしろ あい）、東 島 幸道（ひがしじま こうどう）、 鈴田 浩孝（すずた ひろたか）", "first_author": "林 成美（はやし なるみ）", "affiliations": "NHO 嬉野医療センター 薬剤部", "first_affiliation": "NHO 嬉野医療センター 薬剤部", "printed_pages": "416", "pdf_pages": "172", "features": ["外来化学療法の末梢神経障害への薬剤師介入を、重症度と痛み・しびれ・睡眠のNRSで評価。", "しびれ感は改善傾向だがp＝0.051で有意差に至らない。小規模群の比較として、症状別の評価方法に注目したい。"], "issues": [], "sections": [{"heading": "目的", "content": "化学療法における末梢神経障害（CIPN）は早期介入が必要と考える。当院では外来がん化学療法施行中の患者において、診察前薬剤師面談を実施し有害事象の評価を行っている。しかし CIPN の評価方法と処方との関連性は確立されたものはない。そこで本研究では、CTCAE と NRS による CIPN の評価状況と CIPN 治療薬の処方状況の関連性および薬剤師の処方への介入状況について調査した。"}, {"heading": "方法", "content": "2025 年 1 月〜12 月にがん薬物療法体制充実加算のため介入した患者 681 例を対象とした。そのうち CIPN に対する処方提案 22件のうち実際に処方・増量された介入あり群 17 件と、処方提案なく CIPN 治療薬が処方された介入なし群 51 件について、Grade と疼痛（1）、しびれ感（2）、睡眠障害（3）の NRSについて調査した。"}, {"heading": "結果", "content": "介入あり群では治療開始前の Grade 中央値は 2（1-2）、NRS 中央値は（1）0（0-1.5）、（2）4（2.5-7.5）、（3）0（0-0）であった。治療開始後の Grade中央値は 1（1-1.25）、NRS 中央値は（1）0（0-0）、（2）2.5（1.75-4.25）、（3）0（0-0）であり、しびれ感の NRS 中央値は低下傾向を示した（p=0.051）。介入なし群では治療開始前の Grade 中央値は 1（1-2）、NRS 中央値は（1）0（0-0）、（2）2.5（1.75-4.25）、（3）0（0-0）であった。治療開始後の Grade 中央値は 1（1-2）、NRS 中央値は（1）0（0-0）、（2）3（1-5）、（3）0（0-0）であった。"}, {"heading": "考察", "content": "介入あり群では治療開始前の Grade、しびれ感の NRS が高いことから治療の必要な患者に介入できたと考える。また、治療開始後はGrade、しびれの NRS 中央値の低下がみられたことから、適切な副作用管理に寄与できており薬剤師介入の有用性が示された。今後も継続的な調査を通じて治療の必要な患者への早期介入に寄与していきたい。"}], "body_text": "### 目的\n\n化学療法における末梢神経障害（CIPN）は早期介入が必要と考える。当院では外来がん化学療法施行中の患者において、診察前薬剤師面談を実施し有害事象の評価を行っている。しかし CIPN の評価方法と処方との関連性は確立されたものはない。そこで本研究では、CTCAE と NRS による CIPN の評価状況と CIPN 治療薬の処方状況の関連性および薬剤師の処方への介入状況について調査した。\n\n### 方法\n\n2025 年 1 月〜12 月にがん薬物療法体制充実加算のため介入した患者 681 例を対象とした。そのうち CIPN に対する処方提案 22件のうち実際に処方・増量された介入あり群 17 件と、処方提案なく CIPN 治療薬が処方された介入なし群 51 件について、Grade と疼痛（1）、しびれ感（2）、睡眠障害（3）の NRSについて調査した。\n\n### 結果\n\n介入あり群では治療開始前の Grade 中央値は 2（1-2）、NRS 中央値は（1）0（0-1.5）、（2）4（2.5-7.5）、（3）0（0-0）であった。治療開始後の Grade中央値は 1（1-1.25）、NRS 中央値は（1）0（0-0）、（2）2.5（1.75-4.25）、（3）0（0-0）であり、しびれ感の NRS 中央値は低下傾向を示した（p=0.051）。介入なし群では治療開始前の Grade 中央値は 1（1-2）、NRS 中央値は（1）0（0-0）、（2）2.5（1.75-4.25）、（3）0（0-0）であった。治療開始後の Grade 中央値は 1（1-2）、NRS 中央値は（1）0（0-0）、（2）3（1-5）、（3）0（0-0）であった。\n\n### 考察\n\n介入あり群では治療開始前の Grade、しびれ感の NRS が高いことから治療の必要な患者に介入できたと考える。また、治療開始後はGrade、しびれの NRS 中央値の低下がみられたことから、適切な副作用管理に寄与できており薬剤師介入の有用性が示された。今後も継続的な調査を通じて治療の必要な患者への早期介入に寄与していきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-38-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [172]\nstatus: \"imported\"\n---\n\n# 外来がん化学療法における末梢神経障害治療薬に対する薬剤師介入状況と処方状況について\n\n- 演題番号: P1-38-6\n- 演題名: 外来がん化学療法における末梢神経障害治療薬に対する薬剤師介入状況と処方状況について\n- 所属施設: NHO 嬉野医療センター 薬剤部\n- 筆頭演者: 林 成美（はやし なるみ）\n- 筆頭演者の所属: NHO 嬉野医療センター 薬剤部\n- 演者名: 林 成美（はやし なるみ）、 合原 嘉寿（ごうはら よしひさ）、 田代 愛（たしろ あい）、東 島 幸道（ひがしじま こうどう）、 鈴田 浩孝（すずた ひろたか）\n- 原本: [PDF 172ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=172>)\n- 冊子ページ: 416\n\n## 抄録本文\n\n### 目的\n\n化学療法における末梢神経障害（CIPN）は早期介入が必要と考える。当院では外来がん化学療法施行中の患者において、診察前薬剤師面談を実施し有害事象の評価を行っている。しかし CIPN の評価方法と処方との関連性は確立されたものはない。そこで本研究では、CTCAE と NRS による CIPN の評価状況と CIPN 治療薬の処方状況の関連性および薬剤師の処方への介入状況について調査した。\n\n### 方法\n\n2025 年 1 月〜12 月にがん薬物療法体制充実加算のため介入した患者 681 例を対象とした。そのうち CIPN に対する処方提案 22件のうち実際に処方・増量された介入あり群 17 件と、処方提案なく CIPN 治療薬が処方された介入なし群 51 件について、Grade と疼痛（1）、しびれ感（2）、睡眠障害（3）の NRSについて調査した。\n\n### 結果\n\n介入あり群では治療開始前の Grade 中央値は 2（1-2）、NRS 中央値は（1）0（0-1.5）、（2）4（2.5-7.5）、（3）0（0-0）であった。治療開始後の Grade中央値は 1（1-1.25）、NRS 中央値は（1）0（0-0）、（2）2.5（1.75-4.25）、（3）0（0-0）であり、しびれ感の NRS 中央値は低下傾向を示した（p=0.051）。介入なし群では治療開始前の Grade 中央値は 1（1-2）、NRS 中央値は（1）0（0-0）、（2）2.5（1.75-4.25）、（3）0（0-0）であった。治療開始後の Grade 中央値は 1（1-2）、NRS 中央値は（1）0（0-0）、（2）3（1-5）、（3）0（0-0）であった。\n\n### 考察\n\n介入あり群では治療開始前の Grade、しびれ感の NRS が高いことから治療の必要な患者に介入できたと考える。また、治療開始後はGrade、しびれの NRS 中央値の低下がみられたことから、適切な副作用管理に寄与できており薬剤師介入の有用性が示された。今後も継続的な調査を通じて治療の必要な患者への早期介入に寄与していきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 外来化学療法の末梢神経障害への薬剤師介入を、重症度と痛み・しびれ・睡眠のNRSで評価。\n- しびれ感は改善傾向だがp＝0.051で有意差に至らない。小規模群の比較として、症状別の評価方法に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-38-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-38", "session_name": "がん薬物療法・タルラタマブ・薬剤師外来", "title": "近畿中央呼吸器センターの外来がん薬物療法における薬剤師外来の実態と医療経済効果の推計", "authors": "八瀬 恵理子（やせ えりこ）、 宮崎 美佳（みやざき みか）、 篠原 莉奈（しのはら りな）、 山口 絢香（やまぐち あやか）、 丸山 直岳（まるやま なおたけ）、桶 本 幸（おけもと ゆき）", "first_author": "八瀬 恵理子（やせ えりこ）", "affiliations": "NHO 近畿中央呼吸器センター 薬剤部", "first_affiliation": "NHO 近畿中央呼吸器センター 薬剤部", "printed_pages": "416", "pdf_pages": "172", "features": ["外来がん薬物療法での処方提案採用率・症状改善と、推定副作用回避効果・診療報酬を併記。", "経済効果の推計と実際の算定収益を分けて読める。介入が症状改善につながる具体例と評価方法が参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "近畿中央呼吸器センター（以下、当院）では、2014 年から薬剤師外来を開設し、外来がん薬物療法における医師の診察前面談を実施してきた。その実態を調査し、有用性について医療経済効果から検討した。"}, {"heading": "方法", "content": "当院で外来通院によるがん薬物療法を受けた患者のうち、2024 年 4 月から 2025 年 7 月までに薬剤師外来を利用した全ての患者を対象とし、診療録を後方視的に調査した。医療経済効果の推計には医薬品医療機器総合機構の医薬品副作用被害救済給付支給金額と件数を用いた。"}, {"heading": "結果", "content": "調査期間中に外来でがん薬物療法を受けた全患者 562 例のうち、薬剤師外来で介入した症例は 104 例で、のべ 594 件に介入した。がん薬物療法の副作用に関する処方提案は 81 件で、うち 69 件が採用されていた。処方提案による副作用の変化を CTCAE で評価したところ、10 件で Grade 変化を伴う症状改善があり、その医療経済効果は 1,192,596 円と推計された。132 件に診療報酬上の加算を算定しており、内訳はがん患者指導管理料ハが 53 件、連携充実加算が 5 件、がん薬物療法体制充実加算が 74 件であった。がん患者指導管理料ハの算定上限のため算定不可となった介入が 183 件あり、診療報酬上の収益は 187,500 円であった。"}, {"heading": "考察", "content": "薬剤師の処方提案に基づいたがん薬物療法の副作用の重篤化回避による潜在的な医療費の削減効果が明らかとなった。外来がん薬物療法における薬剤師の介入は医療経済効果からも有用性が示された。"}], "body_text": "### 目的\n\n近畿中央呼吸器センター（以下、当院）では、2014 年から薬剤師外来を開設し、外来がん薬物療法における医師の診察前面談を実施してきた。その実態を調査し、有用性について医療経済効果から検討した。\n\n### 方法\n\n当院で外来通院によるがん薬物療法を受けた患者のうち、2024 年 4 月から 2025 年 7 月までに薬剤師外来を利用した全ての患者を対象とし、診療録を後方視的に調査した。医療経済効果の推計には医薬品医療機器総合機構の医薬品副作用被害救済給付支給金額と件数を用いた。\n\n### 結果\n\n調査期間中に外来でがん薬物療法を受けた全患者 562 例のうち、薬剤師外来で介入した症例は 104 例で、のべ 594 件に介入した。がん薬物療法の副作用に関する処方提案は 81 件で、うち 69 件が採用されていた。処方提案による副作用の変化を CTCAE で評価したところ、10 件で Grade 変化を伴う症状改善があり、その医療経済効果は 1,192,596 円と推計された。132 件に診療報酬上の加算を算定しており、内訳はがん患者指導管理料ハが 53 件、連携充実加算が 5 件、がん薬物療法体制充実加算が 74 件であった。がん患者指導管理料ハの算定上限のため算定不可となった介入が 183 件あり、診療報酬上の収益は 187,500 円であった。\n\n### 考察\n\n薬剤師の処方提案に基づいたがん薬物療法の副作用の重篤化回避による潜在的な医療費の削減効果が明らかとなった。外来がん薬物療法における薬剤師の介入は医療経済効果からも有用性が示された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-38-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [172]\nstatus: \"imported\"\n---\n\n# 近畿中央呼吸器センターの外来がん薬物療法における薬剤師外来の実態と医療経済効果の推計\n\n- 演題番号: P1-38-7\n- 演題名: 近畿中央呼吸器センターの外来がん薬物療法における薬剤師外来の実態と医療経済効果の推計\n- 所属施設: NHO 近畿中央呼吸器センター 薬剤部\n- 筆頭演者: 八瀬 恵理子（やせ えりこ）\n- 筆頭演者の所属: NHO 近畿中央呼吸器センター 薬剤部\n- 演者名: 八瀬 恵理子（やせ えりこ）、 宮崎 美佳（みやざき みか）、 篠原 莉奈（しのはら りな）、 山口 絢香（やまぐち あやか）、 丸山 直岳（まるやま なおたけ）、桶 本 幸（おけもと ゆき）\n- 原本: [PDF 172ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=172>)\n- 冊子ページ: 416\n\n## 抄録本文\n\n### 目的\n\n近畿中央呼吸器センター（以下、当院）では、2014 年から薬剤師外来を開設し、外来がん薬物療法における医師の診察前面談を実施してきた。その実態を調査し、有用性について医療経済効果から検討した。\n\n### 方法\n\n当院で外来通院によるがん薬物療法を受けた患者のうち、2024 年 4 月から 2025 年 7 月までに薬剤師外来を利用した全ての患者を対象とし、診療録を後方視的に調査した。医療経済効果の推計には医薬品医療機器総合機構の医薬品副作用被害救済給付支給金額と件数を用いた。\n\n### 結果\n\n調査期間中に外来でがん薬物療法を受けた全患者 562 例のうち、薬剤師外来で介入した症例は 104 例で、のべ 594 件に介入した。がん薬物療法の副作用に関する処方提案は 81 件で、うち 69 件が採用されていた。処方提案による副作用の変化を CTCAE で評価したところ、10 件で Grade 変化を伴う症状改善があり、その医療経済効果は 1,192,596 円と推計された。132 件に診療報酬上の加算を算定しており、内訳はがん患者指導管理料ハが 53 件、連携充実加算が 5 件、がん薬物療法体制充実加算が 74 件であった。がん患者指導管理料ハの算定上限のため算定不可となった介入が 183 件あり、診療報酬上の収益は 187,500 円であった。\n\n### 考察\n\n薬剤師の処方提案に基づいたがん薬物療法の副作用の重篤化回避による潜在的な医療費の削減効果が明らかとなった。外来がん薬物療法における薬剤師の介入は医療経済効果からも有用性が示された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 外来がん薬物療法での処方提案採用率・症状改善と、推定副作用回避効果・診療報酬を併記。\n- 経済効果の推計と実際の算定収益を分けて読める。介入が症状改善につながる具体例と評価方法が参考となる。\n\n", "rec_grade": "C", "rec_perspective": "薬剤師外来・経済評価", "rec_reason": "外来がん介入594件（処方提案採用69/81件）において、CTCAE Grade改善を伴う医療経済効果（約119万円）と加算算定上限による未算定183件の実態を可視化。"}, {"id": "P1-38-8", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-38", "session_name": "がん薬物療法・タルラタマブ・薬剤師外来", "title": "多職種連携によるセツキシマブ サロタロカンナトリウムを用いた光免疫療法導入の取り組み", "authors": "江嶌 梨帆（えじま りほ） 1、 松藤 敬佑（まつふじ けいすけ） 1、 小園 晃生（こぞの あきお） 1、 松尾 待池（まつお だいち） 2、 遠藤 明日香（えんどう あすか） 3、 古関 美香（こせき みか） 3、 平池 美香子（ひらいけ みかこ） 1、 橋本 未雷（はしもと みらい） 1、 小山田 純治（おやまだ じゅんじ） 1、 田中 藤信（たなか ふじのぶ） 4", "first_author": "江嶌 梨帆（えじま りほ） 1", "affiliations": "1 NHO 長崎医療センター 薬剤部、2 NHO 九州医療センター 薬剤部、 3 NHO 長崎医療センター 看護部、4 NHO 長崎医療センター 耳鼻咽喉科", "first_affiliation": "NHO 長崎医療センター 薬剤部", "printed_pages": "416", "pdf_pages": "172", "features": ["光免疫療法の導入を、調製から投与・照射までの時間管理、照度・遮光、患者移動まで多職種で設計。", "1例への実施経験として、部署間の手順統一と患者指導が具体的。新規治療を安全に導入する準備過程に学べる。"], "issues": [], "sections": [{"heading": "目的", "content": "セツキシマブ サロタロカンナトリウム（Cmab S）を用いた光免疫療法は切除不能な局所進行又は局所再発頭頸部癌に対する新規治療である。本治療は光反応性を有するCmab S の投与後、レーザ光照射により腫瘍細胞を選択的に傷害する治療であり、従来と異なる安全対策が必要である。今回、長崎医療センターにおいて、多職種と連携し、本治療の導入を行ったので、その取り組みについて報告する。"}, {"heading": "取り組み", "content": "医師、薬剤師、病棟・手術室看護師を中心とした多職種で協議を行い、1．レジメン作成、2．投与からレーザ光照射までの時間管理および薬剤払い出しフローの作成、3．薬剤調製室・病室・患者移動経路の照度設定と環境整備、4．患者指導用資料の作成、5．レーザ光照射機器の準備、6．レーザ光照射時の安全対策を行った。また、各部署の運用マニュアルを作成した。"}, {"heading": "結果", "content": "本治療を局所再発頭頸部癌の 1 症例に対して実施した。Cmab S 投与当日は、照度条件及び遮光管理を遵守し、設定時間内の調製・払い出し、投与を行うことができた。Cmab S 投与終了から 27 時間後にレーザ光照射を実施した。各職種による説明・指導の患者理解は良好で、遮光管理を遵守でき、光線過敏症の発現も認めなかった。"}, {"heading": "考察", "content": "多職種による運用マニュアルの整備により、薬剤の適正使用と医療安全の確保ができた。薬剤特性を踏まえた院内運用体制の構築には、多職種の関与が重要であると考えられる。本治療は症例数が限られているため、今後症例の蓄積を通じて運用の妥当性や課題を検討し、さらなる改善を図っていきたい。"}], "body_text": "### 目的\n\nセツキシマブ サロタロカンナトリウム（Cmab S）を用いた光免疫療法は切除不能な局所進行又は局所再発頭頸部癌に対する新規治療である。本治療は光反応性を有するCmab S の投与後、レーザ光照射により腫瘍細胞を選択的に傷害する治療であり、従来と異なる安全対策が必要である。今回、長崎医療センターにおいて、多職種と連携し、本治療の導入を行ったので、その取り組みについて報告する。\n\n### 取り組み\n\n医師、薬剤師、病棟・手術室看護師を中心とした多職種で協議を行い、1．レジメン作成、2．投与からレーザ光照射までの時間管理および薬剤払い出しフローの作成、3．薬剤調製室・病室・患者移動経路の照度設定と環境整備、4．患者指導用資料の作成、5．レーザ光照射機器の準備、6．レーザ光照射時の安全対策を行った。また、各部署の運用マニュアルを作成した。\n\n### 結果\n\n本治療を局所再発頭頸部癌の 1 症例に対して実施した。Cmab S 投与当日は、照度条件及び遮光管理を遵守し、設定時間内の調製・払い出し、投与を行うことができた。Cmab S 投与終了から 27 時間後にレーザ光照射を実施した。各職種による説明・指導の患者理解は良好で、遮光管理を遵守でき、光線過敏症の発現も認めなかった。\n\n### 考察\n\n多職種による運用マニュアルの整備により、薬剤の適正使用と医療安全の確保ができた。薬剤特性を踏まえた院内運用体制の構築には、多職種の関与が重要であると考えられる。本治療は症例数が限られているため、今後症例の蓄積を通じて運用の妥当性や課題を検討し、さらなる改善を図っていきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-38-8\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [172]\nstatus: \"imported\"\n---\n\n# 多職種連携によるセツキシマブ サロタロカンナトリウムを用いた光免疫療法導入の取り組み\n\n- 演題番号: P1-38-8\n- 演題名: 多職種連携によるセツキシマブ サロタロカンナトリウムを用いた光免疫療法導入の取り組み\n- 所属施設: 1 NHO 長崎医療センター 薬剤部、2 NHO 九州医療センター 薬剤部、 3 NHO 長崎医療センター 看護部、4 NHO 長崎医療センター 耳鼻咽喉科\n- 筆頭演者: 江嶌 梨帆（えじま りほ） 1\n- 筆頭演者の所属: NHO 長崎医療センター 薬剤部\n- 演者名: 江嶌 梨帆（えじま りほ） 1、 松藤 敬佑（まつふじ けいすけ） 1、 小園 晃生（こぞの あきお） 1、 松尾 待池（まつお だいち） 2、 遠藤 明日香（えんどう あすか） 3、 古関 美香（こせき みか） 3、 平池 美香子（ひらいけ みかこ） 1、 橋本 未雷（はしもと みらい） 1、 小山田 純治（おやまだ じゅんじ） 1、 田中 藤信（たなか ふじのぶ） 4\n- 原本: [PDF 172ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=172>)\n- 冊子ページ: 416\n\n## 抄録本文\n\n### 目的\n\nセツキシマブ サロタロカンナトリウム（Cmab S）を用いた光免疫療法は切除不能な局所進行又は局所再発頭頸部癌に対する新規治療である。本治療は光反応性を有するCmab S の投与後、レーザ光照射により腫瘍細胞を選択的に傷害する治療であり、従来と異なる安全対策が必要である。今回、長崎医療センターにおいて、多職種と連携し、本治療の導入を行ったので、その取り組みについて報告する。\n\n### 取り組み\n\n医師、薬剤師、病棟・手術室看護師を中心とした多職種で協議を行い、1．レジメン作成、2．投与からレーザ光照射までの時間管理および薬剤払い出しフローの作成、3．薬剤調製室・病室・患者移動経路の照度設定と環境整備、4．患者指導用資料の作成、5．レーザ光照射機器の準備、6．レーザ光照射時の安全対策を行った。また、各部署の運用マニュアルを作成した。\n\n### 結果\n\n本治療を局所再発頭頸部癌の 1 症例に対して実施した。Cmab S 投与当日は、照度条件及び遮光管理を遵守し、設定時間内の調製・払い出し、投与を行うことができた。Cmab S 投与終了から 27 時間後にレーザ光照射を実施した。各職種による説明・指導の患者理解は良好で、遮光管理を遵守でき、光線過敏症の発現も認めなかった。\n\n### 考察\n\n多職種による運用マニュアルの整備により、薬剤の適正使用と医療安全の確保ができた。薬剤特性を踏まえた院内運用体制の構築には、多職種の関与が重要であると考えられる。本治療は症例数が限られているため、今後症例の蓄積を通じて運用の妥当性や課題を検討し、さらなる改善を図っていきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 光免疫療法の導入を、調製から投与・照射までの時間管理、照度・遮光、患者移動まで多職種で設計。\n- 1例への実施経験として、部署間の手順統一と患者指導が具体的。新規治療を安全に導入する準備過程に学べる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-38-9", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-38", "session_name": "がん薬物療法・タルラタマブ・薬剤師外来", "title": "薬剤関連甲状腺機能低下症の実態解析：FAERS 解析と単施設後ろ向きコホート研究", "authors": "鳥海 真也（とりうみ しんや） 1,4、 森川 あづみ（もりかわ あづみ） 2、 白倉 綾乃（しらくら あやの） 1、 稲岡 宏亮（いなおか こうすけ） 1、 大場 麻帆（おおば まほ） 1、酒 井 侑希（さかい ゆき） 1、 山口 裕子（やまぐち ひろこ） 1、 市東 永三子（しとう えみこ） 1、 岡田 美晴（おかだ みはる） 1、 栗原 陽介（くりはら ようすけ） 1、 下川 享明（しもかわ こうめい） 1、 田中 阿利人（たなか ありひと） 3、 荒木 規仁（あらき のりと） 3、 河合 治（かわい おさむ） 3、 植沢 芳広（うえさわ よしひろ） 4", "first_author": "鳥海 真也（とりうみ しんや） 1,4", "affiliations": "1 NHO 神奈川病院 薬剤部、2 NHO 神奈川病院 看護部、3 NHO 神奈川病院 呼吸器内科、 4 明治薬科大学 医療分子解析学研究室", "first_affiliation": "NHO 神奈川病院 薬剤部 / 明治薬科大学 医療分子解析学研究室", "printed_pages": "416", "pdf_pages": "172", "features": ["FAERSのシグナル検出と単施設の肺癌患者コホートを組み合わせ、薬剤関連甲状腺機能低下症を検討。", "補充療法34例に加え検査未実施例の存在を指摘。シグナルと因果関係を区別し、検査の実施体制を考える材料となる。"], "issues": [], "sections": [{"heading": "背景", "content": "免疫チェックポイント阻害薬（ICIs）の普及に伴い、免疫関連有害事象（irAEs）としての甲状腺機能低下症の重要性が高まっている。甲状腺機能低下症は倦怠感や食欲低下など非特異的症状を呈し、発見の遅れが治療継続や患者 QOL に影響を及ぼす可能性がある。本研究では、FDA Adverse Event Reporting System（FAERS）および単施設カルテ調査を用いて、薬剤関連甲状腺機能低下症を評価した。"}, {"heading": "方法", "content": "FAERS データベースに報告された抗悪性腫瘍薬関連の甲状腺機能低下症有害事象を対象に、報告オッズ比（ROR）によるシグナル検出を実施した。さらに、2014 年 9 月から 2026 年 3 月までに当院で肺癌薬物療法を施行された患者を対象に後ろ向きカルテ調査を行い、甲状腺機能低下症の発症状況、治療介入、および甲状腺機能モニタリング状況を検討した。"}, {"heading": "結果", "content": "FAERS 解析では、ICIs やチロシンキナーゼ阻害薬を含む複数の抗悪性腫瘍薬で甲状腺機能低下症のシグナルが認められた。カルテ調査では、肺癌薬物療法中にレボチロキシン補充療法が実施されていた症例は34 例（男性 24 例、女性 10 例）であり、全体の 5.8％であった。また、一部症例では定期的な甲状腺機能検査が未実施であった。"}, {"heading": "考察", "content": "FAERS 解析により、ICIs および分子標的薬における甲状腺機能低下症のシグナルが確認され、カルテ調査においても実臨床上重要な有害事象であることが示された。甲状腺機能低下症は早期発見と適切なホルモン補充療法により治療継続が可能であり、定期的な甲状腺機能モニタリングが重要である。本研究は、自発報告データベースと実臨床データを組み合わせて評価することで、薬剤関連甲状腺機能低下症の臨床的重要性を示した。"}], "body_text": "### 背景\n\n免疫チェックポイント阻害薬（ICIs）の普及に伴い、免疫関連有害事象（irAEs）としての甲状腺機能低下症の重要性が高まっている。甲状腺機能低下症は倦怠感や食欲低下など非特異的症状を呈し、発見の遅れが治療継続や患者 QOL に影響を及ぼす可能性がある。本研究では、FDA Adverse Event Reporting System（FAERS）および単施設カルテ調査を用いて、薬剤関連甲状腺機能低下症を評価した。\n\n### 方法\n\nFAERS データベースに報告された抗悪性腫瘍薬関連の甲状腺機能低下症有害事象を対象に、報告オッズ比（ROR）によるシグナル検出を実施した。さらに、2014 年 9 月から 2026 年 3 月までに当院で肺癌薬物療法を施行された患者を対象に後ろ向きカルテ調査を行い、甲状腺機能低下症の発症状況、治療介入、および甲状腺機能モニタリング状況を検討した。\n\n### 結果\n\nFAERS 解析では、ICIs やチロシンキナーゼ阻害薬を含む複数の抗悪性腫瘍薬で甲状腺機能低下症のシグナルが認められた。カルテ調査では、肺癌薬物療法中にレボチロキシン補充療法が実施されていた症例は34 例（男性 24 例、女性 10 例）であり、全体の 5.8％であった。また、一部症例では定期的な甲状腺機能検査が未実施であった。\n\n### 考察\n\nFAERS 解析により、ICIs および分子標的薬における甲状腺機能低下症のシグナルが確認され、カルテ調査においても実臨床上重要な有害事象であることが示された。甲状腺機能低下症は早期発見と適切なホルモン補充療法により治療継続が可能であり、定期的な甲状腺機能モニタリングが重要である。本研究は、自発報告データベースと実臨床データを組み合わせて評価することで、薬剤関連甲状腺機能低下症の臨床的重要性を示した。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-38-9\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [172]\nstatus: \"imported\"\n---\n\n# 薬剤関連甲状腺機能低下症の実態解析：FAERS 解析と単施設後ろ向きコホート研究\n\n- 演題番号: P1-38-9\n- 演題名: 薬剤関連甲状腺機能低下症の実態解析：FAERS 解析と単施設後ろ向きコホート研究\n- 所属施設: 1 NHO 神奈川病院 薬剤部、2 NHO 神奈川病院 看護部、3 NHO 神奈川病院 呼吸器内科、 4 明治薬科大学 医療分子解析学研究室\n- 筆頭演者: 鳥海 真也（とりうみ しんや） 1,4\n- 筆頭演者の所属: NHO 神奈川病院 薬剤部 / 明治薬科大学 医療分子解析学研究室\n- 演者名: 鳥海 真也（とりうみ しんや） 1,4、 森川 あづみ（もりかわ あづみ） 2、 白倉 綾乃（しらくら あやの） 1、 稲岡 宏亮（いなおか こうすけ） 1、 大場 麻帆（おおば まほ） 1、酒 井 侑希（さかい ゆき） 1、 山口 裕子（やまぐち ひろこ） 1、 市東 永三子（しとう えみこ） 1、 岡田 美晴（おかだ みはる） 1、 栗原 陽介（くりはら ようすけ） 1、 下川 享明（しもかわ こうめい） 1、 田中 阿利人（たなか ありひと） 3、 荒木 規仁（あらき のりと） 3、 河合 治（かわい おさむ） 3、 植沢 芳広（うえさわ よしひろ） 4\n- 原本: [PDF 172ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=172>)\n- 冊子ページ: 416\n\n## 抄録本文\n\n### 背景\n\n免疫チェックポイント阻害薬（ICIs）の普及に伴い、免疫関連有害事象（irAEs）としての甲状腺機能低下症の重要性が高まっている。甲状腺機能低下症は倦怠感や食欲低下など非特異的症状を呈し、発見の遅れが治療継続や患者 QOL に影響を及ぼす可能性がある。本研究では、FDA Adverse Event Reporting System（FAERS）および単施設カルテ調査を用いて、薬剤関連甲状腺機能低下症を評価した。\n\n### 方法\n\nFAERS データベースに報告された抗悪性腫瘍薬関連の甲状腺機能低下症有害事象を対象に、報告オッズ比（ROR）によるシグナル検出を実施した。さらに、2014 年 9 月から 2026 年 3 月までに当院で肺癌薬物療法を施行された患者を対象に後ろ向きカルテ調査を行い、甲状腺機能低下症の発症状況、治療介入、および甲状腺機能モニタリング状況を検討した。\n\n### 結果\n\nFAERS 解析では、ICIs やチロシンキナーゼ阻害薬を含む複数の抗悪性腫瘍薬で甲状腺機能低下症のシグナルが認められた。カルテ調査では、肺癌薬物療法中にレボチロキシン補充療法が実施されていた症例は34 例（男性 24 例、女性 10 例）であり、全体の 5.8％であった。また、一部症例では定期的な甲状腺機能検査が未実施であった。\n\n### 考察\n\nFAERS 解析により、ICIs および分子標的薬における甲状腺機能低下症のシグナルが確認され、カルテ調査においても実臨床上重要な有害事象であることが示された。甲状腺機能低下症は早期発見と適切なホルモン補充療法により治療継続が可能であり、定期的な甲状腺機能モニタリングが重要である。本研究は、自発報告データベースと実臨床データを組み合わせて評価することで、薬剤関連甲状腺機能低下症の臨床的重要性を示した。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- FAERSのシグナル検出と単施設の肺癌患者コホートを組み合わせ、薬剤関連甲状腺機能低下症を検討。\n- 補充療法34例に加え検査未実施例の存在を指摘。シグナルと因果関係を区別し、検査の実施体制を考える材料となる。\n\n", "rec_grade": "B", "rec_perspective": "ファーマコビジランス", "rec_reason": "FAERSでのRORシグナル検出と、自施設の肺がん薬物療法患者コホート（レボチロキシン補充34例・5.8%）を組み合わせ、検査未実施症例の課題も含めて実証したハイブリッド研究。"}, {"id": "P1-45-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-45", "session_name": "医療情報スキル・人材育成", "title": "事務職員の医療情報における必要スキル 人事異動を踏まえての事例考察", "authors": "加藤 瑛一（かとう ひでかず） 1、 宮本 将志（みやもと まさし） 2", "first_author": "加藤 瑛一（かとう ひでかず） 1", "affiliations": "1 NHO 長良医療センター 薬剤部、2 NHO 静岡てんかん・神経医療センター 管理課", "first_affiliation": "NHO 長良医療センター 薬剤部", "printed_pages": "429", "pdf_pages": "185", "features": ["薬剤部所属の筆頭演者が、事務職員の医療情報教育を人事異動・システム更新に伴う必要技能の変遷から考察。", "IPAのスキル標準を参照し、仮想化・ネットワーク知識の重要性を提示。医療情報担当者の育成や引継ぎに関心がある人向け。"], "issues": [], "sections": [{"heading": "概要", "content": "病院において医療情報システムやネットワークは院内 SE や診療情報管理士などの病院採用の職種がそれぞれの方面から支えている。このなかで事務職員は、異動による病院規模の変化や、管理企画といった配属部署により担う役割の変化を受けつつも、他の情報に関与するスタッフとの調整を行う必要があり、様々な情報技術に対する理解を要するが、具体的に必要とされるスキルは明確ではない。今回、2017 年に発表した一般事務職員を情報担当者として育成した一例から、異動や Hospnet 更新等の影響を受けつつも継続して行った教育および必要スキルの変遷について IPA の策定するスキル標準等を踏まえて考察した。"}, {"heading": "結果", "content": "病院規模や SE の配置状況により ITSS レベル 1-3 相当の技能が求められた。4 期Hospnet への切り替えを契機に、サーバー実機の構築やアプリケーション開発などの必要性は薄れつつあるが、仮想化やネットワークに関する知識は必要性が増している。IT 人材の整備が進む中、現実に要求されるスキルに対応した医療機関におけるキャリアフレームワークの定義が望まれる。"}], "body_text": "### 概要\n\n病院において医療情報システムやネットワークは院内 SE や診療情報管理士などの病院採用の職種がそれぞれの方面から支えている。このなかで事務職員は、異動による病院規模の変化や、管理企画といった配属部署により担う役割の変化を受けつつも、他の情報に関与するスタッフとの調整を行う必要があり、様々な情報技術に対する理解を要するが、具体的に必要とされるスキルは明確ではない。今回、2017 年に発表した一般事務職員を情報担当者として育成した一例から、異動や Hospnet 更新等の影響を受けつつも継続して行った教育および必要スキルの変遷について IPA の策定するスキル標準等を踏まえて考察した。\n\n### 結果\n\n病院規模や SE の配置状況により ITSS レベル 1-3 相当の技能が求められた。4 期Hospnet への切り替えを契機に、サーバー実機の構築やアプリケーション開発などの必要性は薄れつつあるが、仮想化やネットワークに関する知識は必要性が増している。IT 人材の整備が進む中、現実に要求されるスキルに対応した医療機関におけるキャリアフレームワークの定義が望まれる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-45-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [185]\nstatus: \"imported\"\n---\n\n# 事務職員の医療情報における必要スキル 人事異動を踏まえての事例考察\n\n- 演題番号: P1-45-2\n- 演題名: 事務職員の医療情報における必要スキル 人事異動を踏まえての事例考察\n- 所属施設: 1 NHO 長良医療センター 薬剤部、2 NHO 静岡てんかん・神経医療センター 管理課\n- 筆頭演者: 加藤 瑛一（かとう ひでかず） 1\n- 筆頭演者の所属: NHO 長良医療センター 薬剤部\n- 演者名: 加藤 瑛一（かとう ひでかず） 1、 宮本 将志（みやもと まさし） 2\n- 原本: [PDF 185ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=185>)\n- 冊子ページ: 429\n\n## 抄録本文\n\n### 概要\n\n病院において医療情報システムやネットワークは院内 SE や診療情報管理士などの病院採用の職種がそれぞれの方面から支えている。このなかで事務職員は、異動による病院規模の変化や、管理企画といった配属部署により担う役割の変化を受けつつも、他の情報に関与するスタッフとの調整を行う必要があり、様々な情報技術に対する理解を要するが、具体的に必要とされるスキルは明確ではない。今回、2017 年に発表した一般事務職員を情報担当者として育成した一例から、異動や Hospnet 更新等の影響を受けつつも継続して行った教育および必要スキルの変遷について IPA の策定するスキル標準等を踏まえて考察した。\n\n### 結果\n\n病院規模や SE の配置状況により ITSS レベル 1-3 相当の技能が求められた。4 期Hospnet への切り替えを契機に、サーバー実機の構築やアプリケーション開発などの必要性は薄れつつあるが、仮想化やネットワークに関する知識は必要性が増している。IT 人材の整備が進む中、現実に要求されるスキルに対応した医療機関におけるキャリアフレームワークの定義が望まれる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 薬剤部所属の筆頭演者が、事務職員の医療情報教育を人事異動・システム更新に伴う必要技能の変遷から考察。\n- IPAのスキル標準を参照し、仮想化・ネットワーク知識の重要性を提示。医療情報担当者の育成や引継ぎに関心がある人向け。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-51-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-51", "session_name": "調剤室業務改善・製剤請求・PBPM", "title": "電子カルテの処置オーダを用いた製剤請求による業務効率化", "authors": "横山 晋一郎（よこやま しんいちろう）、 平川 理紗（ひらかわ りさ）、 藤原 純平（ふじわら じゅんぺい）、 高橋 弘季（たかはし ひろき）、 瀬戸口 由（せとぐち ゆき）、 橋詰 宏美（はしづめ ひろみ）、 南山 啓吾（みなみやま けいご）", "first_author": "横山 晋一郎（よこやま しんいちろう）", "affiliations": "NHO 敦賀医療センター 薬剤部", "first_affiliation": "NHO 敦賀医療センター 薬剤部", "printed_pages": "444", "pdf_pages": "200", "features": ["既存の電子カルテ処置オーダを製剤請求へ転用し、部署別請求とリアルタイム集計を実現する工夫。", "紙帳票・データ入力の削減と操作教育の課題を併記。追加システム導入を伴わない業務設計として参考になる。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "敦賀医療センターでは各部署に配置している薬剤の一括請求を紙媒体で運用していた。流れとしては、各部署にて請求用紙を記入後、薬剤部へ用紙を提出し、その後手入力でデータベース化・集計を行った後で、払い出しを行っていた。しかし、従来の運用では記載漏れや転記ミス、帳票管理の煩雑さが課題であった。これらの問題を解決し業務効率化を図るため、電子カルテの処置オーダを活用した配置薬剤請求のペーパーレス化と業務効率化を実施したので報告する。"}, {"heading": "方法", "content": "電子カルテの処置オーダ機能内に製剤請求専用のオーダセットを構築した。さらに、デモ患者のカルテを各部署の名称に変更し製剤請求用カルテとし、そのカルテを用いて各部署が請求時に処置入力する運用とした。請求情報は薬剤部で電子的に集約・確認できる仕組みとし、試験導入を開始した。導入後で職員の業務負担感について聞き取り調査を行った。"}, {"heading": "結果", "content": "電子化により請求内容のリアルタイム把握が可能となり、紙帳票の回収や保管業務が不要となった。データベース化にかかる時間が減少し、請求処理時間の短縮を認めた。また、職員への聞き取り調査においても業務効率および利便性の向上が示された。一方で、電子カルテ操作に関する教育の必要性が課題として挙げられた。"}, {"heading": "考察", "content": "電子カルテの既存機能を活用することで、新規システム導入を伴わず追加コストなく、製剤請求の効率化とペーパーレス化を実現できた。今後は運用の標準化と教育体制の強化を進め、さらなる業務改善につなげていく必要がある。"}], "body_text": "### 背景・目的\n\n敦賀医療センターでは各部署に配置している薬剤の一括請求を紙媒体で運用していた。流れとしては、各部署にて請求用紙を記入後、薬剤部へ用紙を提出し、その後手入力でデータベース化・集計を行った後で、払い出しを行っていた。しかし、従来の運用では記載漏れや転記ミス、帳票管理の煩雑さが課題であった。これらの問題を解決し業務効率化を図るため、電子カルテの処置オーダを活用した配置薬剤請求のペーパーレス化と業務効率化を実施したので報告する。\n\n### 方法\n\n電子カルテの処置オーダ機能内に製剤請求専用のオーダセットを構築した。さらに、デモ患者のカルテを各部署の名称に変更し製剤請求用カルテとし、そのカルテを用いて各部署が請求時に処置入力する運用とした。請求情報は薬剤部で電子的に集約・確認できる仕組みとし、試験導入を開始した。導入後で職員の業務負担感について聞き取り調査を行った。\n\n### 結果\n\n電子化により請求内容のリアルタイム把握が可能となり、紙帳票の回収や保管業務が不要となった。データベース化にかかる時間が減少し、請求処理時間の短縮を認めた。また、職員への聞き取り調査においても業務効率および利便性の向上が示された。一方で、電子カルテ操作に関する教育の必要性が課題として挙げられた。\n\n### 考察\n\n電子カルテの既存機能を活用することで、新規システム導入を伴わず追加コストなく、製剤請求の効率化とペーパーレス化を実現できた。今後は運用の標準化と教育体制の強化を進め、さらなる業務改善につなげていく必要がある。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-51-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [200]\nstatus: \"imported\"\n---\n\n# 電子カルテの処置オーダを用いた製剤請求による業務効率化\n\n- 演題番号: P1-51-4\n- 演題名: 電子カルテの処置オーダを用いた製剤請求による業務効率化\n- 所属施設: NHO 敦賀医療センター 薬剤部\n- 筆頭演者: 横山 晋一郎（よこやま しんいちろう）\n- 筆頭演者の所属: NHO 敦賀医療センター 薬剤部\n- 演者名: 横山 晋一郎（よこやま しんいちろう）、 平川 理紗（ひらかわ りさ）、 藤原 純平（ふじわら じゅんぺい）、 高橋 弘季（たかはし ひろき）、 瀬戸口 由（せとぐち ゆき）、 橋詰 宏美（はしづめ ひろみ）、 南山 啓吾（みなみやま けいご）\n- 原本: [PDF 200ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=200>)\n- 冊子ページ: 444\n\n## 抄録本文\n\n### 背景・目的\n\n敦賀医療センターでは各部署に配置している薬剤の一括請求を紙媒体で運用していた。流れとしては、各部署にて請求用紙を記入後、薬剤部へ用紙を提出し、その後手入力でデータベース化・集計を行った後で、払い出しを行っていた。しかし、従来の運用では記載漏れや転記ミス、帳票管理の煩雑さが課題であった。これらの問題を解決し業務効率化を図るため、電子カルテの処置オーダを活用した配置薬剤請求のペーパーレス化と業務効率化を実施したので報告する。\n\n### 方法\n\n電子カルテの処置オーダ機能内に製剤請求専用のオーダセットを構築した。さらに、デモ患者のカルテを各部署の名称に変更し製剤請求用カルテとし、そのカルテを用いて各部署が請求時に処置入力する運用とした。請求情報は薬剤部で電子的に集約・確認できる仕組みとし、試験導入を開始した。導入後で職員の業務負担感について聞き取り調査を行った。\n\n### 結果\n\n電子化により請求内容のリアルタイム把握が可能となり、紙帳票の回収や保管業務が不要となった。データベース化にかかる時間が減少し、請求処理時間の短縮を認めた。また、職員への聞き取り調査においても業務効率および利便性の向上が示された。一方で、電子カルテ操作に関する教育の必要性が課題として挙げられた。\n\n### 考察\n\n電子カルテの既存機能を活用することで、新規システム導入を伴わず追加コストなく、製剤請求の効率化とペーパーレス化を実現できた。今後は運用の標準化と教育体制の強化を進め、さらなる業務改善につなげていく必要がある。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 既存の電子カルテ処置オーダを製剤請求へ転用し、部署別請求とリアルタイム集計を実現する工夫。\n- 紙帳票・データ入力の削減と操作教育の課題を併記。追加システム導入を伴わない業務設計として参考になる。\n\n", "rec_grade": "B", "rec_perspective": "既存電カル活用・コストゼロDX", "rec_reason": "追加費用ゼロで電子カルテの処置オーダと部署別デモ患者カルテを組み合わせ、各部署の配置薬請求をペーパーレス・リアルタイム集計化した実践的アイデア。"}, {"id": "P1-51-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-51", "session_name": "調剤室業務改善・製剤請求・PBPM", "title": "業務改善計画〜費用をかけずにできることからはじめてみました〜", "authors": "相庭 芹菜（あいば せりな）、紺 野 柚希（こんの ゆずき）、 矢田 充男（やた みつお）、 吉田 和美（よしだ かずみ）", "first_author": "相庭 芹菜（あいば せりな）", "affiliations": "NHO 岩手病院 薬剤科", "first_affiliation": "NHO 岩手病院 薬剤科", "printed_pages": "444", "pdf_pages": "200", "features": ["既存の散薬ロボットも含めて業務を整理し、助手への移管、物品配置、作業動線を見直す改善報告。", "作業スペースと視認性の改善が中心。大きな投資を前提としない環境整備と、効果の測定方法に注目したい。"], "issues": [], "sections": [{"heading": "はじめに", "content": "当院は病床数 250 床うち重症心身障害児病床が 150 床を占め、日々の業務は調剤が中心となっているのが現状である。薬剤師の増員を図りたいところではあるが、管内における欠員および当院の経営状況等も勘案すると現時点においては困難な状況である。厚生労働省医薬・生活衛生局総務課長通知において、「調剤業務のあり方」が示されているところではあるが、薬剤師の対物業務から対人業務へのシフトをより進めるために、「費用をかけずにできること」を検討することとした。"}, {"heading": "方法", "content": "当院においては散薬調剤ロボット（Elen-01）導入により散薬調剤の一部をロボットに移行するタスクシフトを行っていたためその点も含め業務の流れを整理し、薬剤師業務の中から薬剤助手等への移行可能な業務の抽出を行った。また、薬剤科内の限られたスペースを有効活用するため、「整理・整頓・清掃・清潔・躾」の 5S 活動の一環として不要物品の整理・廃棄および作業環境の整備を行い、作業スペースの確保、物品配置および動線の見直しを行った。"}, {"heading": "結果", "content": "環境整備および物品配置の改善により作業スペースが確保され物品の視認性が向上したことにより作業の円滑化が認められた。また、動線の見直しにより作業の効率化が認められた。"}, {"heading": "考察", "content": "業務環境が整備されたことで効率的な業務遂行に寄与したと考えられる。また、業務の整理はタスクシフト・シェアを推進する上での基盤となり得ることが考えられる。"}], "body_text": "### はじめに\n\n当院は病床数 250 床うち重症心身障害児病床が 150 床を占め、日々の業務は調剤が中心となっているのが現状である。薬剤師の増員を図りたいところではあるが、管内における欠員および当院の経営状況等も勘案すると現時点においては困難な状況である。厚生労働省医薬・生活衛生局総務課長通知において、「調剤業務のあり方」が示されているところではあるが、薬剤師の対物業務から対人業務へのシフトをより進めるために、「費用をかけずにできること」を検討することとした。\n\n### 方法\n\n当院においては散薬調剤ロボット（Elen-01）導入により散薬調剤の一部をロボットに移行するタスクシフトを行っていたためその点も含め業務の流れを整理し、薬剤師業務の中から薬剤助手等への移行可能な業務の抽出を行った。また、薬剤科内の限られたスペースを有効活用するため、「整理・整頓・清掃・清潔・躾」の 5S 活動の一環として不要物品の整理・廃棄および作業環境の整備を行い、作業スペースの確保、物品配置および動線の見直しを行った。\n\n### 結果\n\n環境整備および物品配置の改善により作業スペースが確保され物品の視認性が向上したことにより作業の円滑化が認められた。また、動線の見直しにより作業の効率化が認められた。\n\n### 考察\n\n業務環境が整備されたことで効率的な業務遂行に寄与したと考えられる。また、業務の整理はタスクシフト・シェアを推進する上での基盤となり得ることが考えられる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-51-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [200]\nstatus: \"imported\"\n---\n\n# 業務改善計画〜費用をかけずにできることからはじめてみました〜\n\n- 演題番号: P1-51-5\n- 演題名: 業務改善計画〜費用をかけずにできることからはじめてみました〜\n- 所属施設: NHO 岩手病院 薬剤科\n- 筆頭演者: 相庭 芹菜（あいば せりな）\n- 筆頭演者の所属: NHO 岩手病院 薬剤科\n- 演者名: 相庭 芹菜（あいば せりな）、紺 野 柚希（こんの ゆずき）、 矢田 充男（やた みつお）、 吉田 和美（よしだ かずみ）\n- 原本: [PDF 200ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=200>)\n- 冊子ページ: 444\n\n## 抄録本文\n\n### はじめに\n\n当院は病床数 250 床うち重症心身障害児病床が 150 床を占め、日々の業務は調剤が中心となっているのが現状である。薬剤師の増員を図りたいところではあるが、管内における欠員および当院の経営状況等も勘案すると現時点においては困難な状況である。厚生労働省医薬・生活衛生局総務課長通知において、「調剤業務のあり方」が示されているところではあるが、薬剤師の対物業務から対人業務へのシフトをより進めるために、「費用をかけずにできること」を検討することとした。\n\n### 方法\n\n当院においては散薬調剤ロボット（Elen-01）導入により散薬調剤の一部をロボットに移行するタスクシフトを行っていたためその点も含め業務の流れを整理し、薬剤師業務の中から薬剤助手等への移行可能な業務の抽出を行った。また、薬剤科内の限られたスペースを有効活用するため、「整理・整頓・清掃・清潔・躾」の 5S 活動の一環として不要物品の整理・廃棄および作業環境の整備を行い、作業スペースの確保、物品配置および動線の見直しを行った。\n\n### 結果\n\n環境整備および物品配置の改善により作業スペースが確保され物品の視認性が向上したことにより作業の円滑化が認められた。また、動線の見直しにより作業の効率化が認められた。\n\n### 考察\n\n業務環境が整備されたことで効率的な業務遂行に寄与したと考えられる。また、業務の整理はタスクシフト・シェアを推進する上での基盤となり得ることが考えられる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 既存の散薬ロボットも含めて業務を整理し、助手への移管、物品配置、作業動線を見直す改善報告。\n- 作業スペースと視認性の改善が中心。大きな投資を前提としない環境整備と、効果の測定方法に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-51-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-51", "session_name": "調剤室業務改善・製剤請求・PBPM", "title": "調剤室の業務効率化の取り組み〜入院支援業務に関わる電話削減〜", "authors": "金森 敏伸（かなもり としのぶ）、 鈴木 亮平（すずき りょうへい）、 小山 一子（こやま いちこ）、竹 内 正紀（たけうち まさき）", "first_author": "金森 敏伸（かなもり としのぶ）", "affiliations": "NHO 三重中央医療センター 薬剤部", "first_affiliation": "NHO 三重中央医療センター 薬剤部", "printed_pages": "445", "pdf_pages": "201", "features": ["入院支援担当専用PHSへの連絡経路変更で、調剤室の電話取り次ぎを減らす取り組み。", "対応件数が108件から1件／月となり約5時間の削減を推計。中断の多い業務の連絡設計として応用を考えられる。"], "issues": [], "sections": [{"heading": "目的", "content": "三重中央医療センター薬剤部の入院支援業務に関わる連絡は、入院支援担当看護師から調剤室担当者に電話連絡が入り、調剤室担当者が入院支援担当薬剤師へ電話で伝達していた。この運用は、人員が限られている調剤室担当者の業務負担や電話取り次ぎによる伝達漏れ等の情報共有の不備が課題となっていた。そこで、入院支援担当薬剤師専用 PHS を導入し、運用変更を行うことで、調剤室の業務効率化の取り組みを行ったので報告する。"}, {"heading": "方法", "content": "2025 年 10 月より、入院支援担当薬剤師は、入院支援業務に関する連絡を入院支援担当専用 PHS で受け取り、他の業務等の理由で対応できない場合のみ調剤室担当者が電話の取り次ぎを行う運用へ変更した。そこで、取り組み前後 1 ヶ月間の入院支援担当看護師からの電話対応者及び電話対応件数を集計した。また、1 ヶ月の調剤室の電話対応削減時間を電話 1 回につき 3 分の削減（実測値平均）とし算出した。"}, {"heading": "結果", "content": "取り組み前の調剤室担当者の対応件数は 108 件/月、取り組み後の調剤室担当者の対応件数は 1 件/月、入院支援担当薬剤師の対応件数は 98 件/月であった。調剤室の電話対応削減時間は約 5 時間/月であった。"}, {"heading": "考察", "content": "調剤室での入院支援業務に関する電話対応を削減する取り組みにより、調剤室担当者の業務負担や電話取り次ぎによる情報伝達の不備を軽減し、業務効率化を行うことが出来た。限られた人員で調剤室の業務を円滑に遂行するためには、今回の取り組みは有用であったと考えられる。"}], "body_text": "### 目的\n\n三重中央医療センター薬剤部の入院支援業務に関わる連絡は、入院支援担当看護師から調剤室担当者に電話連絡が入り、調剤室担当者が入院支援担当薬剤師へ電話で伝達していた。この運用は、人員が限られている調剤室担当者の業務負担や電話取り次ぎによる伝達漏れ等の情報共有の不備が課題となっていた。そこで、入院支援担当薬剤師専用 PHS を導入し、運用変更を行うことで、調剤室の業務効率化の取り組みを行ったので報告する。\n\n### 方法\n\n2025 年 10 月より、入院支援担当薬剤師は、入院支援業務に関する連絡を入院支援担当専用 PHS で受け取り、他の業務等の理由で対応できない場合のみ調剤室担当者が電話の取り次ぎを行う運用へ変更した。そこで、取り組み前後 1 ヶ月間の入院支援担当看護師からの電話対応者及び電話対応件数を集計した。また、1 ヶ月の調剤室の電話対応削減時間を電話 1 回につき 3 分の削減（実測値平均）とし算出した。\n\n### 結果\n\n取り組み前の調剤室担当者の対応件数は 108 件/月、取り組み後の調剤室担当者の対応件数は 1 件/月、入院支援担当薬剤師の対応件数は 98 件/月であった。調剤室の電話対応削減時間は約 5 時間/月であった。\n\n### 考察\n\n調剤室での入院支援業務に関する電話対応を削減する取り組みにより、調剤室担当者の業務負担や電話取り次ぎによる情報伝達の不備を軽減し、業務効率化を行うことが出来た。限られた人員で調剤室の業務を円滑に遂行するためには、今回の取り組みは有用であったと考えられる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-51-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [201]\nstatus: \"imported\"\n---\n\n# 調剤室の業務効率化の取り組み〜入院支援業務に関わる電話削減〜\n\n- 演題番号: P1-51-6\n- 演題名: 調剤室の業務効率化の取り組み〜入院支援業務に関わる電話削減〜\n- 所属施設: NHO 三重中央医療センター 薬剤部\n- 筆頭演者: 金森 敏伸（かなもり としのぶ）\n- 筆頭演者の所属: NHO 三重中央医療センター 薬剤部\n- 演者名: 金森 敏伸（かなもり としのぶ）、 鈴木 亮平（すずき りょうへい）、 小山 一子（こやま いちこ）、竹 内 正紀（たけうち まさき）\n- 原本: [PDF 201ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=201>)\n- 冊子ページ: 445\n\n## 抄録本文\n\n### 目的\n\n三重中央医療センター薬剤部の入院支援業務に関わる連絡は、入院支援担当看護師から調剤室担当者に電話連絡が入り、調剤室担当者が入院支援担当薬剤師へ電話で伝達していた。この運用は、人員が限られている調剤室担当者の業務負担や電話取り次ぎによる伝達漏れ等の情報共有の不備が課題となっていた。そこで、入院支援担当薬剤師専用 PHS を導入し、運用変更を行うことで、調剤室の業務効率化の取り組みを行ったので報告する。\n\n### 方法\n\n2025 年 10 月より、入院支援担当薬剤師は、入院支援業務に関する連絡を入院支援担当専用 PHS で受け取り、他の業務等の理由で対応できない場合のみ調剤室担当者が電話の取り次ぎを行う運用へ変更した。そこで、取り組み前後 1 ヶ月間の入院支援担当看護師からの電話対応者及び電話対応件数を集計した。また、1 ヶ月の調剤室の電話対応削減時間を電話 1 回につき 3 分の削減（実測値平均）とし算出した。\n\n### 結果\n\n取り組み前の調剤室担当者の対応件数は 108 件/月、取り組み後の調剤室担当者の対応件数は 1 件/月、入院支援担当薬剤師の対応件数は 98 件/月であった。調剤室の電話対応削減時間は約 5 時間/月であった。\n\n### 考察\n\n調剤室での入院支援業務に関する電話対応を削減する取り組みにより、調剤室担当者の業務負担や電話取り次ぎによる情報伝達の不備を軽減し、業務効率化を行うことが出来た。限られた人員で調剤室の業務を円滑に遂行するためには、今回の取り組みは有用であったと考えられる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 入院支援担当専用PHSへの連絡経路変更で、調剤室の電話取り次ぎを減らす取り組み。\n- 対応件数が108件から1件／月となり約5時間の削減を推計。中断の多い業務の連絡設計として応用を考えられる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-51-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-51", "session_name": "調剤室業務改善・製剤請求・PBPM", "title": "院外処方せんの疑義照会簡素化プロトコル適用拡大による業務効率化の検討", "authors": "早川 奏子（はやかわ かなこ） 1、 大沼 明日香（おおぬま あすか） 1、工 藤 慎也（くどう しんや） 1、 坂内 英樹（ばんない ひでき） 1、 熊谷 学（くまがい まなぶ） 1、 三上 祥博（みかみ よしひろ） 2", "first_author": "早川 奏子（はやかわ かなこ） 1", "affiliations": "1 NHO 山形病院 薬剤科、2 NHO 仙台西多賀病院 薬剤部", "first_affiliation": "NHO 山形病院 薬剤科", "printed_pages": "445", "pdf_pages": "201", "features": ["疑義照会簡素化の適用拡大を、照会内容・件数と保険薬局側の利用状況から評価。", "適用22件と残薬調整の増加を報告。項目追加だけでなく、薬局への周知・使いやすさがどう影響するかを確認したい。"], "issues": [], "sections": [{"heading": "目的", "content": "NHO 山形病院（以下、当院）では疑義照会について薬剤科が窓口となり、医師への問い合わせと保険薬局への回答を行っている。2024 年 12 月から医師・薬剤師間で院外処方せんの疑義照会簡素化プロトコル（以下、プロトコル）を導入し、2025 年 11 月から合意した保険薬局へプロトコル適用を拡大した。これにより、保険薬局は合意範囲内であれば当院へ事後報告を行うことで、処方医へ確認せず調剤が可能となった。今回、プロトコル適用拡大により薬剤師業務・患者負担変化の検証を目的とし、疑義照会の分析と保険薬局へアンケート調査を行ったので報告する。"}, {"heading": "方法", "content": "プロトコル適用拡大前後の 2025 年 6 月〜2026 年 3 月を調査期間とした。保険薬局からの疑義照会件数、プロトコル適用件数、疑義照会項目、対応時間を集計した。また、保険薬局へプロトコル利用率、満足度、患者待ち時間の変化・改善点についてアンケート調査をした。"}, {"heading": "結果", "content": "プロトコル導入前（2025 年 6 月〜2025 年 10 月）の疑義照会件数は 150 件、プロトコル導入後（2025 年 11 月〜2026 年 3 月）の疑義照会件数は 126 件、プロトコル適用件数は 22 件（15％）であった。疑義照会項目について、プロトコル適用項目は残薬調整、規格変更、剤形変更、先発品への変更の順に多かった。残薬調整は導入前に比べ、導入後の件数は 4 倍となった。"}, {"heading": "考察", "content": "プロトコル拡大により、疑義照会が簡素化され薬剤科の業務負担が軽減された。また、保険薬局においてプロトコルに残薬調整が含まれたため、残薬調整を行いやすくなり、患者への薬学的ケアの充実につながったと推察される。今回の結果を踏まえ、プロトコルの充実化および疑義照会のさらなる簡素化を目指していきたい。"}], "body_text": "### 目的\n\nNHO 山形病院（以下、当院）では疑義照会について薬剤科が窓口となり、医師への問い合わせと保険薬局への回答を行っている。2024 年 12 月から医師・薬剤師間で院外処方せんの疑義照会簡素化プロトコル（以下、プロトコル）を導入し、2025 年 11 月から合意した保険薬局へプロトコル適用を拡大した。これにより、保険薬局は合意範囲内であれば当院へ事後報告を行うことで、処方医へ確認せず調剤が可能となった。今回、プロトコル適用拡大により薬剤師業務・患者負担変化の検証を目的とし、疑義照会の分析と保険薬局へアンケート調査を行ったので報告する。\n\n### 方法\n\nプロトコル適用拡大前後の 2025 年 6 月〜2026 年 3 月を調査期間とした。保険薬局からの疑義照会件数、プロトコル適用件数、疑義照会項目、対応時間を集計した。また、保険薬局へプロトコル利用率、満足度、患者待ち時間の変化・改善点についてアンケート調査をした。\n\n### 結果\n\nプロトコル導入前（2025 年 6 月〜2025 年 10 月）の疑義照会件数は 150 件、プロトコル導入後（2025 年 11 月〜2026 年 3 月）の疑義照会件数は 126 件、プロトコル適用件数は 22 件（15％）であった。疑義照会項目について、プロトコル適用項目は残薬調整、規格変更、剤形変更、先発品への変更の順に多かった。残薬調整は導入前に比べ、導入後の件数は 4 倍となった。\n\n### 考察\n\nプロトコル拡大により、疑義照会が簡素化され薬剤科の業務負担が軽減された。また、保険薬局においてプロトコルに残薬調整が含まれたため、残薬調整を行いやすくなり、患者への薬学的ケアの充実につながったと推察される。今回の結果を踏まえ、プロトコルの充実化および疑義照会のさらなる簡素化を目指していきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-51-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [201]\nstatus: \"imported\"\n---\n\n# 院外処方せんの疑義照会簡素化プロトコル適用拡大による業務効率化の検討\n\n- 演題番号: P1-51-7\n- 演題名: 院外処方せんの疑義照会簡素化プロトコル適用拡大による業務効率化の検討\n- 所属施設: 1 NHO 山形病院 薬剤科、2 NHO 仙台西多賀病院 薬剤部\n- 筆頭演者: 早川 奏子（はやかわ かなこ） 1\n- 筆頭演者の所属: NHO 山形病院 薬剤科\n- 演者名: 早川 奏子（はやかわ かなこ） 1、 大沼 明日香（おおぬま あすか） 1、工 藤 慎也（くどう しんや） 1、 坂内 英樹（ばんない ひでき） 1、 熊谷 学（くまがい まなぶ） 1、 三上 祥博（みかみ よしひろ） 2\n- 原本: [PDF 201ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=201>)\n- 冊子ページ: 445\n\n## 抄録本文\n\n### 目的\n\nNHO 山形病院（以下、当院）では疑義照会について薬剤科が窓口となり、医師への問い合わせと保険薬局への回答を行っている。2024 年 12 月から医師・薬剤師間で院外処方せんの疑義照会簡素化プロトコル（以下、プロトコル）を導入し、2025 年 11 月から合意した保険薬局へプロトコル適用を拡大した。これにより、保険薬局は合意範囲内であれば当院へ事後報告を行うことで、処方医へ確認せず調剤が可能となった。今回、プロトコル適用拡大により薬剤師業務・患者負担変化の検証を目的とし、疑義照会の分析と保険薬局へアンケート調査を行ったので報告する。\n\n### 方法\n\nプロトコル適用拡大前後の 2025 年 6 月〜2026 年 3 月を調査期間とした。保険薬局からの疑義照会件数、プロトコル適用件数、疑義照会項目、対応時間を集計した。また、保険薬局へプロトコル利用率、満足度、患者待ち時間の変化・改善点についてアンケート調査をした。\n\n### 結果\n\nプロトコル導入前（2025 年 6 月〜2025 年 10 月）の疑義照会件数は 150 件、プロトコル導入後（2025 年 11 月〜2026 年 3 月）の疑義照会件数は 126 件、プロトコル適用件数は 22 件（15％）であった。疑義照会項目について、プロトコル適用項目は残薬調整、規格変更、剤形変更、先発品への変更の順に多かった。残薬調整は導入前に比べ、導入後の件数は 4 倍となった。\n\n### 考察\n\nプロトコル拡大により、疑義照会が簡素化され薬剤科の業務負担が軽減された。また、保険薬局においてプロトコルに残薬調整が含まれたため、残薬調整を行いやすくなり、患者への薬学的ケアの充実につながったと推察される。今回の結果を踏まえ、プロトコルの充実化および疑義照会のさらなる簡素化を目指していきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 疑義照会簡素化の適用拡大を、照会内容・件数と保険薬局側の利用状況から評価。\n- 適用22件と残薬調整の増加を報告。項目追加だけでなく、薬局への周知・使いやすさがどう影響するかを確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-57-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-57", "session_name": "がん治験安全管理・術後疼痛因子", "title": "がん領域治験における薬剤部薬剤師参画と治験使用薬関連インシデントの10 年間の検討", "authors": "松木 奈緒子（まつき なおこ）、 松尾 尚美（まつお なおみ）、 青木 孝喜（あおき たかよし）、 前田 祐香（まえだ ゆか）、 藤田 強記（ふじた つよき）、 尾崎 紗緒理（おざき さおり）、 藤原 顕弘（ふじはら あきひろ）、 上田 和明（うえだ かずあき）、 中川 武裕（なかがわ たけひろ）、 松元 俊博（まつもと としひろ）、 山口 正史（やまぐち まさふみ）、 江崎 泰斗（えさき たいと）", "first_author": "松木 奈緒子（まつき なおこ）", "affiliations": "NHO 九州がんセンター 薬剤部", "first_affiliation": "NHO 九州がんセンター 薬剤部", "printed_pages": "458", "pdf_pages": "214", "features": ["がん領域治験の薬剤部参画を背景に、治験使用薬の在庫不足・調剤・交付のインシデントを長期に追跡。", "薬剤部への移行前後で報告件数の大きな変化がない点も示す。治験数や複雑性を踏まえた評価と役割分担が論点となる。"], "issues": [], "sections": [{"heading": "背景", "content": "がん領域の治験は治験使用薬の調剤から交付まで複雑であり、従来は治験薬剤師が中心となって対応してきた。しかし治験件数の増加に伴い業務負担が増大したため、当院では2015 年度に調剤・治験薬管理表記録・抗がん剤無菌調製・監査を段階的に薬剤部へ移行し、2016 年度より一部の例外を除き薬剤部薬剤師が治験薬業務を担う体制へ完全移行した。薬剤部移行後の治験使用薬関連インシデントについて、10 年間のデータを用いてその発生動向と特徴を検討した。"}, {"heading": "方法", "content": "2011〜2025 年度に当院で実施した治験を対象とし、治験使用薬の在庫不足、調剤関連過誤（調剤、調製、監査）、交付に関連するインシデントをデータベースより後方的に抽出した。"}, {"heading": "結果", "content": "2015、2016 年度は治験使用薬の在庫不足が各 2 件であった。2017 年度は調剤関連が 1 件、2018 年度は在庫不足 2 件・調剤関連 1 件、2019年度は報告がなかった。2020 年度は調剤関連 1 件・交付漏れ 1 件、2021 年度は調剤関連2 件・在庫不足 1 件、2022 年度は調剤関連 3 件・在庫不足 1 件、2023 年度は調剤関連 1件・在庫不足 2 件、2024 年度は調剤関連 1 件・在庫不足 1 件、2025 年度は調剤関連 1 件であった。薬剤部移行後も移行前と比較して報告件数に大きな変化はなかった。"}, {"heading": "考察", "content": "薬剤部移行後、誤ったまま投与した事例を 4 件認めたが、各事例に対する原因分析と再発防止策の実施により、業務手順および管理体制の見直しにつなげることができた。薬剤部薬剤師参画下においても、継続的な改善により、増加する治験件数に対応可能な体制構築が示唆され、当体制は有用であると考える。"}], "body_text": "### 背景\n\nがん領域の治験は治験使用薬の調剤から交付まで複雑であり、従来は治験薬剤師が中心となって対応してきた。しかし治験件数の増加に伴い業務負担が増大したため、当院では2015 年度に調剤・治験薬管理表記録・抗がん剤無菌調製・監査を段階的に薬剤部へ移行し、2016 年度より一部の例外を除き薬剤部薬剤師が治験薬業務を担う体制へ完全移行した。薬剤部移行後の治験使用薬関連インシデントについて、10 年間のデータを用いてその発生動向と特徴を検討した。\n\n### 方法\n\n2011〜2025 年度に当院で実施した治験を対象とし、治験使用薬の在庫不足、調剤関連過誤（調剤、調製、監査）、交付に関連するインシデントをデータベースより後方的に抽出した。\n\n### 結果\n\n2015、2016 年度は治験使用薬の在庫不足が各 2 件であった。2017 年度は調剤関連が 1 件、2018 年度は在庫不足 2 件・調剤関連 1 件、2019年度は報告がなかった。2020 年度は調剤関連 1 件・交付漏れ 1 件、2021 年度は調剤関連2 件・在庫不足 1 件、2022 年度は調剤関連 3 件・在庫不足 1 件、2023 年度は調剤関連 1件・在庫不足 2 件、2024 年度は調剤関連 1 件・在庫不足 1 件、2025 年度は調剤関連 1 件であった。薬剤部移行後も移行前と比較して報告件数に大きな変化はなかった。\n\n### 考察\n\n薬剤部移行後、誤ったまま投与した事例を 4 件認めたが、各事例に対する原因分析と再発防止策の実施により、業務手順および管理体制の見直しにつなげることができた。薬剤部薬剤師参画下においても、継続的な改善により、増加する治験件数に対応可能な体制構築が示唆され、当体制は有用であると考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-57-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [214]\nstatus: \"imported\"\n---\n\n# がん領域治験における薬剤部薬剤師参画と治験使用薬関連インシデントの10 年間の検討\n\n- 演題番号: P1-57-4\n- 演題名: がん領域治験における薬剤部薬剤師参画と治験使用薬関連インシデントの10 年間の検討\n- 所属施設: NHO 九州がんセンター 薬剤部\n- 筆頭演者: 松木 奈緒子（まつき なおこ）\n- 筆頭演者の所属: NHO 九州がんセンター 薬剤部\n- 演者名: 松木 奈緒子（まつき なおこ）、 松尾 尚美（まつお なおみ）、 青木 孝喜（あおき たかよし）、 前田 祐香（まえだ ゆか）、 藤田 強記（ふじた つよき）、 尾崎 紗緒理（おざき さおり）、 藤原 顕弘（ふじはら あきひろ）、 上田 和明（うえだ かずあき）、 中川 武裕（なかがわ たけひろ）、 松元 俊博（まつもと としひろ）、 山口 正史（やまぐち まさふみ）、 江崎 泰斗（えさき たいと）\n- 原本: [PDF 214ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=214>)\n- 冊子ページ: 458\n\n## 抄録本文\n\n### 背景\n\nがん領域の治験は治験使用薬の調剤から交付まで複雑であり、従来は治験薬剤師が中心となって対応してきた。しかし治験件数の増加に伴い業務負担が増大したため、当院では2015 年度に調剤・治験薬管理表記録・抗がん剤無菌調製・監査を段階的に薬剤部へ移行し、2016 年度より一部の例外を除き薬剤部薬剤師が治験薬業務を担う体制へ完全移行した。薬剤部移行後の治験使用薬関連インシデントについて、10 年間のデータを用いてその発生動向と特徴を検討した。\n\n### 方法\n\n2011〜2025 年度に当院で実施した治験を対象とし、治験使用薬の在庫不足、調剤関連過誤（調剤、調製、監査）、交付に関連するインシデントをデータベースより後方的に抽出した。\n\n### 結果\n\n2015、2016 年度は治験使用薬の在庫不足が各 2 件であった。2017 年度は調剤関連が 1 件、2018 年度は在庫不足 2 件・調剤関連 1 件、2019年度は報告がなかった。2020 年度は調剤関連 1 件・交付漏れ 1 件、2021 年度は調剤関連2 件・在庫不足 1 件、2022 年度は調剤関連 3 件・在庫不足 1 件、2023 年度は調剤関連 1件・在庫不足 2 件、2024 年度は調剤関連 1 件・在庫不足 1 件、2025 年度は調剤関連 1 件であった。薬剤部移行後も移行前と比較して報告件数に大きな変化はなかった。\n\n### 考察\n\n薬剤部移行後、誤ったまま投与した事例を 4 件認めたが、各事例に対する原因分析と再発防止策の実施により、業務手順および管理体制の見直しにつなげることができた。薬剤部薬剤師参画下においても、継続的な改善により、増加する治験件数に対応可能な体制構築が示唆され、当体制は有用であると考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- がん領域治験の薬剤部参画を背景に、治験使用薬の在庫不足・調剤・交付のインシデントを長期に追跡。\n- 薬剤部への移行前後で報告件数の大きな変化がない点も示す。治験数や複雑性を踏まえた評価と役割分担が論点となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-57-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-57", "session_name": "がん治験安全管理・術後疼痛因子", "title": "肩関節鏡視下腱板断裂修復術後に持続斜角筋間腕神経叢ブロックを使用した患者における術後疼痛にかかわる因子の検討", "authors": "坂田 秀（さかた しゅう）、 矢島 克海（やじま かつみ）、 菅原 彩（すがわら さやか）、 吉川 至（よしかわ いたる）", "first_author": "坂田 秀（さかた しゅう）", "affiliations": "NHO 霞ヶ浦医療センター 薬剤部", "first_affiliation": "NHO 霞ヶ浦医療センター 薬剤部", "printed_pages": "458", "pdf_pages": "214", "features": ["腱板修復術後に持続神経ブロックを受けた205例で、疼痛関連因子を順序ロジスティック回帰で探索。", "検討因子はいずれも統計学的に有意ではない。予測因子を確定した研究とは区別し、疼痛の評価方法やモデル設定を確認したい。"], "issues": [], "sections": [{"heading": "緒言", "content": "肩関節鏡視下腱板断裂修復術（ARCR）は肩腱板断裂に対する外科的治療法であり、術後疼痛管理は課題である。疼痛には個人差があり多因子の関与が示唆されるが、ARCR 後疼痛の関連因子を検討した報告は少ない。今回、術後疼痛に関連する臨床的因子を Numer-ical Rating Scale（NRS）を用いて検討した。"}, {"heading": "方法", "content": "2021 年 1 月 1 日から 2026 年 3 月31 日に当院で ARCR 施行後、持続斜角筋間腕神経叢ブロックを施行した 205 例を対象とした。診療録及び当院診療データベースから、患者背景、麻酔時間、術後疼痛、鎮痛薬使用状況、合併症、検査値等 24 項目を収集した。除外基準は慢性的オピオイド使用患者、および認知機能障害等により NRS 評価が困難な患者とした。目的変数は術後 3 日間の NRS 最高値を 4 群に分類したものとし、順序ロジスティック回帰分析で検討した。"}, {"heading": "結果", "content": "順序ロジスティック回帰分析の結果、T-BIL（p=0.291, 95％ CI：0.67-3.96）、年齢（p=0.078,95％ CI：0.94-1.00）、麻酔時間（p=0.271, 95％ CI：0.98-1.00）、ジクロフェナク坐剤使用（p=0.236, 95％ CI：0.68-5.03）、ALT（p=0.170, 95％ CI：0.96-1.01）、喫煙歴（p=0.182, 95％ CI：0.38-1.20）であり、いずれも有意な関連は認めなかった。"}, {"heading": "考察", "content": "本研究では症例数が限られ推定の不確実性は大きかったが、年齢は術後疼痛と正の関連、麻酔時間および ALT は負の関連を示した。年齢は術後疼痛の予測因子となる可能性が示唆された一方、麻酔時間は手術侵襲指標の未調整、ALT は対象患者の偏りの影響を受けた可能性がある。先行研究では術前禁煙期間が術後病態に影響する可能性が示されているが、本研究では喫煙歴の有無のみで評価したため、禁煙患者の影響が含まれた可能性がある。"}], "body_text": "### 緒言\n\n肩関節鏡視下腱板断裂修復術（ARCR）は肩腱板断裂に対する外科的治療法であり、術後疼痛管理は課題である。疼痛には個人差があり多因子の関与が示唆されるが、ARCR 後疼痛の関連因子を検討した報告は少ない。今回、術後疼痛に関連する臨床的因子を Numer-ical Rating Scale（NRS）を用いて検討した。\n\n### 方法\n\n2021 年 1 月 1 日から 2026 年 3 月31 日に当院で ARCR 施行後、持続斜角筋間腕神経叢ブロックを施行した 205 例を対象とした。診療録及び当院診療データベースから、患者背景、麻酔時間、術後疼痛、鎮痛薬使用状況、合併症、検査値等 24 項目を収集した。除外基準は慢性的オピオイド使用患者、および認知機能障害等により NRS 評価が困難な患者とした。目的変数は術後 3 日間の NRS 最高値を 4 群に分類したものとし、順序ロジスティック回帰分析で検討した。\n\n### 結果\n\n順序ロジスティック回帰分析の結果、T-BIL（p=0.291, 95％ CI：0.67-3.96）、年齢（p=0.078,95％ CI：0.94-1.00）、麻酔時間（p=0.271, 95％ CI：0.98-1.00）、ジクロフェナク坐剤使用（p=0.236, 95％ CI：0.68-5.03）、ALT（p=0.170, 95％ CI：0.96-1.01）、喫煙歴（p=0.182, 95％ CI：0.38-1.20）であり、いずれも有意な関連は認めなかった。\n\n### 考察\n\n本研究では症例数が限られ推定の不確実性は大きかったが、年齢は術後疼痛と正の関連、麻酔時間および ALT は負の関連を示した。年齢は術後疼痛の予測因子となる可能性が示唆された一方、麻酔時間は手術侵襲指標の未調整、ALT は対象患者の偏りの影響を受けた可能性がある。先行研究では術前禁煙期間が術後病態に影響する可能性が示されているが、本研究では喫煙歴の有無のみで評価したため、禁煙患者の影響が含まれた可能性がある。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-57-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [214]\nstatus: \"imported\"\n---\n\n# 肩関節鏡視下腱板断裂修復術後に持続斜角筋間腕神経叢ブロックを使用した患者における術後疼痛にかかわる因子の検討\n\n- 演題番号: P1-57-5\n- 演題名: 肩関節鏡視下腱板断裂修復術後に持続斜角筋間腕神経叢ブロックを使用した患者における術後疼痛にかかわる因子の検討\n- 所属施設: NHO 霞ヶ浦医療センター 薬剤部\n- 筆頭演者: 坂田 秀（さかた しゅう）\n- 筆頭演者の所属: NHO 霞ヶ浦医療センター 薬剤部\n- 演者名: 坂田 秀（さかた しゅう）、 矢島 克海（やじま かつみ）、 菅原 彩（すがわら さやか）、 吉川 至（よしかわ いたる）\n- 原本: [PDF 214ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=214>)\n- 冊子ページ: 458\n\n## 抄録本文\n\n### 緒言\n\n肩関節鏡視下腱板断裂修復術（ARCR）は肩腱板断裂に対する外科的治療法であり、術後疼痛管理は課題である。疼痛には個人差があり多因子の関与が示唆されるが、ARCR 後疼痛の関連因子を検討した報告は少ない。今回、術後疼痛に関連する臨床的因子を Numer-ical Rating Scale（NRS）を用いて検討した。\n\n### 方法\n\n2021 年 1 月 1 日から 2026 年 3 月31 日に当院で ARCR 施行後、持続斜角筋間腕神経叢ブロックを施行した 205 例を対象とした。診療録及び当院診療データベースから、患者背景、麻酔時間、術後疼痛、鎮痛薬使用状況、合併症、検査値等 24 項目を収集した。除外基準は慢性的オピオイド使用患者、および認知機能障害等により NRS 評価が困難な患者とした。目的変数は術後 3 日間の NRS 最高値を 4 群に分類したものとし、順序ロジスティック回帰分析で検討した。\n\n### 結果\n\n順序ロジスティック回帰分析の結果、T-BIL（p=0.291, 95％ CI：0.67-3.96）、年齢（p=0.078,95％ CI：0.94-1.00）、麻酔時間（p=0.271, 95％ CI：0.98-1.00）、ジクロフェナク坐剤使用（p=0.236, 95％ CI：0.68-5.03）、ALT（p=0.170, 95％ CI：0.96-1.01）、喫煙歴（p=0.182, 95％ CI：0.38-1.20）であり、いずれも有意な関連は認めなかった。\n\n### 考察\n\n本研究では症例数が限られ推定の不確実性は大きかったが、年齢は術後疼痛と正の関連、麻酔時間および ALT は負の関連を示した。年齢は術後疼痛の予測因子となる可能性が示唆された一方、麻酔時間は手術侵襲指標の未調整、ALT は対象患者の偏りの影響を受けた可能性がある。先行研究では術前禁煙期間が術後病態に影響する可能性が示されているが、本研究では喫煙歴の有無のみで評価したため、禁煙患者の影響が含まれた可能性がある。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 腱板修復術後に持続神経ブロックを受けた205例で、疼痛関連因子を順序ロジスティック回帰で探索。\n- 検討因子はいずれも統計学的に有意ではない。予測因子を確定した研究とは区別し、疼痛の評価方法やモデル設定を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-64-1", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-64", "session_name": "感染症・抗菌薬/抗真菌薬TDM・HIV連携", "title": "当院でテジゾリドの長期投与を行った 2 例", "authors": "富永 桃花（とみなが ももか）、 新田 亮（にった りょう）、 松谷 拓海（まつたに たくみ）、 宮城 和代（みやぎ かずよ）、 村津 圭治（むらつ けいじ）、 田邨 保之（たむら やすし）、 河合 実（かわい みのる）", "first_author": "富永 桃花（とみなが ももか）", "affiliations": "NHO 大阪医療センター 薬剤部", "first_affiliation": "NHO 大阪医療センター 薬剤部", "printed_pages": "473", "pdf_pages": "229", "features": ["テジゾリドを長期間使用した人工関節周囲感染疑いの2例を、血小板・ヘモグロビンの推移とともに報告。", "自覚症状だけでなく血液検査の変化を追う点が参考となる。少数症例として投与継続判断と監視方法に注目したい。"], "issues": [], "sections": [{"heading": "背景", "content": "抗メチシリン耐性黄色ブドウ球菌（MRSA）薬であるテジゾリド（TZD）は、同オキサゾリジノン薬であるリネゾリド（LZD）と比較し、長期投与時の血小板減少や貧血、胃腸障害、末梢神経障害などの発現が少ないとされる。しかし、国内での長期投与報告は現状少ない。今回、当院において TZD を長期投与した 2 例を経験したため報告する。"}, {"heading": "症例1", "content": "80 歳代男性。MRSA による左人工関節周囲感染を疑い、LZD が投与されていたが、効果不良のため TZD へ変更、再置換術の前 60 日間、後 45 日間投与された。投与開始時の Plt：19.7×10^4/μL、Hgb：8.9g/dL であり、投与 41 日目に Plt：14.7×10^4/μL、Hgb：7.5 g/dL まで低下したが、いずれも TZD 投与終了時には改善に至った。また、投与中には、胃腸症状や末梢神経障害などの自覚症状は認めなかった。"}, {"heading": "症例2", "content": "80 歳代女性。MRSAによる左人工関節周囲感染を疑い、TZD が 45 日間投与された。投与開始時の Plt：35.7×10^4/μL、Hgb：8.4g/dL であったが、投与 22 日目に Plt：12.3×10^4/μL、投与 43日目に Hgb：8.0 g/dL まで低下したものの、自覚症状は認めず、経過観察下で投与継続が可能であった。"}, {"heading": "考察", "content": "本症例では、血球減少や消化器症状等による治療の中断なく、TZDの長期投与が可能であった。また、投与中止に至らなかったものの、重度の貧血が認められたことから、血球減少に対する継続的な検査値モニタリングが重要と考えられた。TZD の長期投与時の安全性については、今後も症例集積を行い検討の追加が必要である。"}], "body_text": "### 背景\n\n抗メチシリン耐性黄色ブドウ球菌（MRSA）薬であるテジゾリド（TZD）は、同オキサゾリジノン薬であるリネゾリド（LZD）と比較し、長期投与時の血小板減少や貧血、胃腸障害、末梢神経障害などの発現が少ないとされる。しかし、国内での長期投与報告は現状少ない。今回、当院において TZD を長期投与した 2 例を経験したため報告する。\n\n### 症例1\n\n80 歳代男性。MRSA による左人工関節周囲感染を疑い、LZD が投与されていたが、効果不良のため TZD へ変更、再置換術の前 60 日間、後 45 日間投与された。投与開始時の Plt：19.7×10^4/μL、Hgb：8.9g/dL であり、投与 41 日目に Plt：14.7×10^4/μL、Hgb：7.5 g/dL まで低下したが、いずれも TZD 投与終了時には改善に至った。また、投与中には、胃腸症状や末梢神経障害などの自覚症状は認めなかった。\n\n### 症例2\n\n80 歳代女性。MRSAによる左人工関節周囲感染を疑い、TZD が 45 日間投与された。投与開始時の Plt：35.7×10^4/μL、Hgb：8.4g/dL であったが、投与 22 日目に Plt：12.3×10^4/μL、投与 43日目に Hgb：8.0 g/dL まで低下したものの、自覚症状は認めず、経過観察下で投与継続が可能であった。\n\n### 考察\n\n本症例では、血球減少や消化器症状等による治療の中断なく、TZDの長期投与が可能であった。また、投与中止に至らなかったものの、重度の貧血が認められたことから、血球減少に対する継続的な検査値モニタリングが重要と考えられた。TZD の長期投与時の安全性については、今後も症例集積を行い検討の追加が必要である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-64-1\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [229]\nstatus: \"imported\"\n---\n\n# 当院でテジゾリドの長期投与を行った 2 例\n\n- 演題番号: P1-64-1\n- 演題名: 当院でテジゾリドの長期投与を行った 2 例\n- 所属施設: NHO 大阪医療センター 薬剤部\n- 筆頭演者: 富永 桃花（とみなが ももか）\n- 筆頭演者の所属: NHO 大阪医療センター 薬剤部\n- 演者名: 富永 桃花（とみなが ももか）、 新田 亮（にった りょう）、 松谷 拓海（まつたに たくみ）、 宮城 和代（みやぎ かずよ）、 村津 圭治（むらつ けいじ）、 田邨 保之（たむら やすし）、 河合 実（かわい みのる）\n- 原本: [PDF 229ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=229>)\n- 冊子ページ: 473\n\n## 抄録本文\n\n### 背景\n\n抗メチシリン耐性黄色ブドウ球菌（MRSA）薬であるテジゾリド（TZD）は、同オキサゾリジノン薬であるリネゾリド（LZD）と比較し、長期投与時の血小板減少や貧血、胃腸障害、末梢神経障害などの発現が少ないとされる。しかし、国内での長期投与報告は現状少ない。今回、当院において TZD を長期投与した 2 例を経験したため報告する。\n\n### 症例1\n\n80 歳代男性。MRSA による左人工関節周囲感染を疑い、LZD が投与されていたが、効果不良のため TZD へ変更、再置換術の前 60 日間、後 45 日間投与された。投与開始時の Plt：19.7×10^4/μL、Hgb：8.9g/dL であり、投与 41 日目に Plt：14.7×10^4/μL、Hgb：7.5 g/dL まで低下したが、いずれも TZD 投与終了時には改善に至った。また、投与中には、胃腸症状や末梢神経障害などの自覚症状は認めなかった。\n\n### 症例2\n\n80 歳代女性。MRSAによる左人工関節周囲感染を疑い、TZD が 45 日間投与された。投与開始時の Plt：35.7×10^4/μL、Hgb：8.4g/dL であったが、投与 22 日目に Plt：12.3×10^4/μL、投与 43日目に Hgb：8.0 g/dL まで低下したものの、自覚症状は認めず、経過観察下で投与継続が可能であった。\n\n### 考察\n\n本症例では、血球減少や消化器症状等による治療の中断なく、TZDの長期投与が可能であった。また、投与中止に至らなかったものの、重度の貧血が認められたことから、血球減少に対する継続的な検査値モニタリングが重要と考えられた。TZD の長期投与時の安全性については、今後も症例集積を行い検討の追加が必要である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- テジゾリドを長期間使用した人工関節周囲感染疑いの2例を、血小板・ヘモグロビンの推移とともに報告。\n- 自覚症状だけでなく血液検査の変化を追う点が参考となる。少数症例として投与継続判断と監視方法に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-64-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-64", "session_name": "感染症・抗菌薬/抗真菌薬TDM・HIV連携", "title": "バンコマイシン初回投与設計の構築における取り組み前後の AUC 後方的調査", "authors": "齊藤 健太（さいとう けんた）、 大塚 健太郎（おおつか けんたろう）、 石向 嶺（いしこう りょう）、 小沼 大祐（こぬま だいすけ）、 寳福 誠（ほうふく まこと）", "first_author": "齊藤 健太（さいとう けんた）", "affiliations": "NHO まつもと医療センター 薬剤部", "first_affiliation": "NHO まつもと医療センター 薬剤部", "printed_pages": "473", "pdf_pages": "229", "features": ["体重・腎機能別のバンコマイシン初回投与設計表と手順書を導入し、初回TDM時のAUCを比較。", "目標範囲内の割合が6.7％から60.0％へ増加。設計表の具体的内容と対象患者の違いを確認したい。"], "issues": [], "sections": [{"heading": "目的", "content": "まつもと医療センターでは、複数の診療科があり、多くの診療科でバンコマイシンによる治療が行われている。添付文書では、「1 日 2g を 1 回 0.5g6 時間ごとまたは 1 回 1g12 時間ごとに分割して、それぞれ 60 分以上かけて投与する」となっているが、日本化学療法学会が発行する抗菌薬 TDM 臨床実践ガイドライン 2022 では、「初回のみ 25〜30mg/kg の負荷投与を行い、維持量として腎機能正常患者では 1 回 20mg/kg を 12 時間ごと投与することを推奨」となっており、双方に相違がある。そこで、適正な抗菌薬投与を目指す体制を進めているため、初回投与設計の構築に取り組んだ。"}, {"heading": "方法", "content": "日本化学療法学会が発行する抗菌薬 TDM 臨床実践ガイドライン 2022 を参考とし、体重及び腎機能別の初回投与量及び腎機能別の維持量を初回投与設計表として作成した。その後、手順書を作成し、2025 年 12 月から運用を開始した。取り組み前 3 か月と取り組み後 3 か月の症例に対して 初回採血時における AUC（μg・hr/mL）について後方視的に調査を行った。"}, {"heading": "結果", "content": "初回投与設計表を用いることで、適切な治療を行えた。また、推奨とされる目標 AUC（400〜600μg・hr/mL）の範囲内に入る患者の割合が取り組み前の 6.7％に対して、取り組み後は 60.0％と増加した。"}, {"heading": "考察", "content": "初回投与設計表を構築したことで病棟担当薬剤師以外も適切な抗菌薬投与を実施することができた。取り組み前は、病態や腎機能などの個々の状態から医師が投与量を調整していたが、今回の取り組みにおいて薬剤師が積極的にバンコマイシンの初回投与設計に介入することで、介入前と比較して目標 AUC の範囲内に入る割合が上昇し、導入時の適切な治療につながったと考えられる。"}], "body_text": "### 目的\n\nまつもと医療センターでは、複数の診療科があり、多くの診療科でバンコマイシンによる治療が行われている。添付文書では、「1 日 2g を 1 回 0.5g6 時間ごとまたは 1 回 1g12 時間ごとに分割して、それぞれ 60 分以上かけて投与する」となっているが、日本化学療法学会が発行する抗菌薬 TDM 臨床実践ガイドライン 2022 では、「初回のみ 25〜30mg/kg の負荷投与を行い、維持量として腎機能正常患者では 1 回 20mg/kg を 12 時間ごと投与することを推奨」となっており、双方に相違がある。そこで、適正な抗菌薬投与を目指す体制を進めているため、初回投与設計の構築に取り組んだ。\n\n### 方法\n\n日本化学療法学会が発行する抗菌薬 TDM 臨床実践ガイドライン 2022 を参考とし、体重及び腎機能別の初回投与量及び腎機能別の維持量を初回投与設計表として作成した。その後、手順書を作成し、2025 年 12 月から運用を開始した。取り組み前 3 か月と取り組み後 3 か月の症例に対して 初回採血時における AUC（μg・hr/mL）について後方視的に調査を行った。\n\n### 結果\n\n初回投与設計表を用いることで、適切な治療を行えた。また、推奨とされる目標 AUC（400〜600μg・hr/mL）の範囲内に入る患者の割合が取り組み前の 6.7％に対して、取り組み後は 60.0％と増加した。\n\n### 考察\n\n初回投与設計表を構築したことで病棟担当薬剤師以外も適切な抗菌薬投与を実施することができた。取り組み前は、病態や腎機能などの個々の状態から医師が投与量を調整していたが、今回の取り組みにおいて薬剤師が積極的にバンコマイシンの初回投与設計に介入することで、介入前と比較して目標 AUC の範囲内に入る割合が上昇し、導入時の適切な治療につながったと考えられる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-64-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [229]\nstatus: \"imported\"\n---\n\n# バンコマイシン初回投与設計の構築における取り組み前後の AUC 後方的調査\n\n- 演題番号: P1-64-2\n- 演題名: バンコマイシン初回投与設計の構築における取り組み前後の AUC 後方的調査\n- 所属施設: NHO まつもと医療センター 薬剤部\n- 筆頭演者: 齊藤 健太（さいとう けんた）\n- 筆頭演者の所属: NHO まつもと医療センター 薬剤部\n- 演者名: 齊藤 健太（さいとう けんた）、 大塚 健太郎（おおつか けんたろう）、 石向 嶺（いしこう りょう）、 小沼 大祐（こぬま だいすけ）、 寳福 誠（ほうふく まこと）\n- 原本: [PDF 229ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=229>)\n- 冊子ページ: 473\n\n## 抄録本文\n\n### 目的\n\nまつもと医療センターでは、複数の診療科があり、多くの診療科でバンコマイシンによる治療が行われている。添付文書では、「1 日 2g を 1 回 0.5g6 時間ごとまたは 1 回 1g12 時間ごとに分割して、それぞれ 60 分以上かけて投与する」となっているが、日本化学療法学会が発行する抗菌薬 TDM 臨床実践ガイドライン 2022 では、「初回のみ 25〜30mg/kg の負荷投与を行い、維持量として腎機能正常患者では 1 回 20mg/kg を 12 時間ごと投与することを推奨」となっており、双方に相違がある。そこで、適正な抗菌薬投与を目指す体制を進めているため、初回投与設計の構築に取り組んだ。\n\n### 方法\n\n日本化学療法学会が発行する抗菌薬 TDM 臨床実践ガイドライン 2022 を参考とし、体重及び腎機能別の初回投与量及び腎機能別の維持量を初回投与設計表として作成した。その後、手順書を作成し、2025 年 12 月から運用を開始した。取り組み前 3 か月と取り組み後 3 か月の症例に対して 初回採血時における AUC（μg・hr/mL）について後方視的に調査を行った。\n\n### 結果\n\n初回投与設計表を用いることで、適切な治療を行えた。また、推奨とされる目標 AUC（400〜600μg・hr/mL）の範囲内に入る患者の割合が取り組み前の 6.7％に対して、取り組み後は 60.0％と増加した。\n\n### 考察\n\n初回投与設計表を構築したことで病棟担当薬剤師以外も適切な抗菌薬投与を実施することができた。取り組み前は、病態や腎機能などの個々の状態から医師が投与量を調整していたが、今回の取り組みにおいて薬剤師が積極的にバンコマイシンの初回投与設計に介入することで、介入前と比較して目標 AUC の範囲内に入る割合が上昇し、導入時の適切な治療につながったと考えられる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 体重・腎機能別のバンコマイシン初回投与設計表と手順書を導入し、初回TDM時のAUCを比較。\n- 目標範囲内の割合が6.7％から60.0％へ増加。設計表の具体的内容と対象患者の違いを確認したい。\n\n", "rec_grade": "B", "rec_perspective": "抗菌薬TDM・標準化", "rec_reason": "TDMガイドライン2022準拠の体重・腎機能別「初回投与設計表」と手順書を整備し、病棟担当者以外でも初回採血時の目標AUC（400〜600）達成率を6.7%→60.0%へ大幅改善。"}, {"id": "P1-64-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-64", "session_name": "感染症・抗菌薬/抗真菌薬TDM・HIV連携", "title": "当院におけるスルバクタム/アンピシリンの規格変更が薬剤費及び投与量に与える影響", "authors": "宮崎 久瑠美（みやざき くるみ） 1、 山根 夕季（やまね ゆき） 1、 西 裕美（にし ひろみ） 1、 近藤 讓（こんどう ゆずる） 1、 山脇 一浩（やまわき かずひろ） 2、福 石 和久（ふくいし かずひさ） 1", "first_author": "宮崎 久瑠美（みやざき くるみ） 1", "affiliations": "1 NHO 福岡東医療センター 薬剤科、2 NHO 九州医療センター 薬剤科", "first_affiliation": "NHO 福岡東医療センター 薬剤科", "printed_pages": "474", "pdf_pages": "230", "features": ["スルバクタム／アンピシリンの採用規格変更を、薬剤費と腎機能別の実投与量から評価。", "費用削減だけでなく、変更後に1回1.5g投与例がなくなった点も重要。規格集約と個別の用量調整の両立が焦点となる。"], "issues": [], "sections": [{"heading": "目的", "content": "当院では、2026 年 1 月にスルバクタム/アンピシリン（以下、SBT/ABPC）の採用規格を 1.5g/V から 3.0g/V へ変更した。従来規格の 1.5g/V では、1 回投与量 3.0g の処方に対し 1.5g/V を 2V 使用する必要があり、薬剤費の増加が課題となっていた。また、腎機能が良好な患者においても 1 回 1.5g 投与に留まる症例が散見され、用量不足による治療効果低下が懸念されていた。今回、SBT/ABPC の規格変更が薬剤費及び投与量にどのような影響を与えたか評価する。"}, {"heading": "方法", "content": "1．採用規格変更前過去 1 年間の 1 回投与量 3.0g に対して1.5g/V×2V で投与されていた症例を、3.0g/V×1V に置き換えたと仮定し薬剤費を試算した。また、採用規格変更前後各 3 ヶ月間の薬剤費を算出し、差額を求めた。2．採用規格変更前後各 3 ヶ月間の 1 回投与量 1.5g/V であった症例を抽出し、1 日の投与量・腎機能とを調べ両者を比較した。"}, {"heading": "結果", "content": "1．上記の方法で試算した場合、年間で約 500 万円の薬剤費削減効果が見込まれた。また、採用規格変更前 3 ヶ月間と比較し、変更後 3 ヶ月間で約 100万円減少した。2．採用規格変更前は 1 回投与量が 1.5g であった症例が 11 例（Ccr ＜30mL/min：7 例、30≦Ccr ＜ 60：4 例、Ccr≧60：0 例）、変更後 3 ヶ月は 0 例であった。"}, {"heading": "考察", "content": "日本化学療法学会では、SBT/ABPC は 1 回 3g、1 日 3〜4 回投与が推奨されている。今回の調査で、採用規格変更後は 1 回投与量の適正化がみられた。よって、SBT/ABPC の採用規格を 1.5g/V から 3.0g/V へ変更することは、薬剤費削減に大きく寄与するとともに、抗菌薬適正使用の両面から有用であったと考えられる。"}], "body_text": "### 目的\n\n当院では、2026 年 1 月にスルバクタム/アンピシリン（以下、SBT/ABPC）の採用規格を 1.5g/V から 3.0g/V へ変更した。従来規格の 1.5g/V では、1 回投与量 3.0g の処方に対し 1.5g/V を 2V 使用する必要があり、薬剤費の増加が課題となっていた。また、腎機能が良好な患者においても 1 回 1.5g 投与に留まる症例が散見され、用量不足による治療効果低下が懸念されていた。今回、SBT/ABPC の規格変更が薬剤費及び投与量にどのような影響を与えたか評価する。\n\n### 方法\n\n1．採用規格変更前過去 1 年間の 1 回投与量 3.0g に対して1.5g/V×2V で投与されていた症例を、3.0g/V×1V に置き換えたと仮定し薬剤費を試算した。また、採用規格変更前後各 3 ヶ月間の薬剤費を算出し、差額を求めた。2．採用規格変更前後各 3 ヶ月間の 1 回投与量 1.5g/V であった症例を抽出し、1 日の投与量・腎機能とを調べ両者を比較した。\n\n### 結果\n\n1．上記の方法で試算した場合、年間で約 500 万円の薬剤費削減効果が見込まれた。また、採用規格変更前 3 ヶ月間と比較し、変更後 3 ヶ月間で約 100万円減少した。2．採用規格変更前は 1 回投与量が 1.5g であった症例が 11 例（Ccr ＜30mL/min：7 例、30≦Ccr ＜ 60：4 例、Ccr≧60：0 例）、変更後 3 ヶ月は 0 例であった。\n\n### 考察\n\n日本化学療法学会では、SBT/ABPC は 1 回 3g、1 日 3〜4 回投与が推奨されている。今回の調査で、採用規格変更後は 1 回投与量の適正化がみられた。よって、SBT/ABPC の採用規格を 1.5g/V から 3.0g/V へ変更することは、薬剤費削減に大きく寄与するとともに、抗菌薬適正使用の両面から有用であったと考えられる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-64-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [230]\nstatus: \"imported\"\n---\n\n# 当院におけるスルバクタム/アンピシリンの規格変更が薬剤費及び投与量に与える影響\n\n- 演題番号: P1-64-3\n- 演題名: 当院におけるスルバクタム/アンピシリンの規格変更が薬剤費及び投与量に与える影響\n- 所属施設: 1 NHO 福岡東医療センター 薬剤科、2 NHO 九州医療センター 薬剤科\n- 筆頭演者: 宮崎 久瑠美（みやざき くるみ） 1\n- 筆頭演者の所属: NHO 福岡東医療センター 薬剤科\n- 演者名: 宮崎 久瑠美（みやざき くるみ） 1、 山根 夕季（やまね ゆき） 1、 西 裕美（にし ひろみ） 1、 近藤 讓（こんどう ゆずる） 1、 山脇 一浩（やまわき かずひろ） 2、福 石 和久（ふくいし かずひさ） 1\n- 原本: [PDF 230ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=230>)\n- 冊子ページ: 474\n\n## 抄録本文\n\n### 目的\n\n当院では、2026 年 1 月にスルバクタム/アンピシリン（以下、SBT/ABPC）の採用規格を 1.5g/V から 3.0g/V へ変更した。従来規格の 1.5g/V では、1 回投与量 3.0g の処方に対し 1.5g/V を 2V 使用する必要があり、薬剤費の増加が課題となっていた。また、腎機能が良好な患者においても 1 回 1.5g 投与に留まる症例が散見され、用量不足による治療効果低下が懸念されていた。今回、SBT/ABPC の規格変更が薬剤費及び投与量にどのような影響を与えたか評価する。\n\n### 方法\n\n1．採用規格変更前過去 1 年間の 1 回投与量 3.0g に対して1.5g/V×2V で投与されていた症例を、3.0g/V×1V に置き換えたと仮定し薬剤費を試算した。また、採用規格変更前後各 3 ヶ月間の薬剤費を算出し、差額を求めた。2．採用規格変更前後各 3 ヶ月間の 1 回投与量 1.5g/V であった症例を抽出し、1 日の投与量・腎機能とを調べ両者を比較した。\n\n### 結果\n\n1．上記の方法で試算した場合、年間で約 500 万円の薬剤費削減効果が見込まれた。また、採用規格変更前 3 ヶ月間と比較し、変更後 3 ヶ月間で約 100万円減少した。2．採用規格変更前は 1 回投与量が 1.5g であった症例が 11 例（Ccr ＜30mL/min：7 例、30≦Ccr ＜ 60：4 例、Ccr≧60：0 例）、変更後 3 ヶ月は 0 例であった。\n\n### 考察\n\n日本化学療法学会では、SBT/ABPC は 1 回 3g、1 日 3〜4 回投与が推奨されている。今回の調査で、採用規格変更後は 1 回投与量の適正化がみられた。よって、SBT/ABPC の採用規格を 1.5g/V から 3.0g/V へ変更することは、薬剤費削減に大きく寄与するとともに、抗菌薬適正使用の両面から有用であったと考えられる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- スルバクタム／アンピシリンの採用規格変更を、薬剤費と腎機能別の実投与量から評価。\n- 費用削減だけでなく、変更後に1回1.5g投与例がなくなった点も重要。規格集約と個別の用量調整の両立が焦点となる。\n\n", "rec_grade": "C", "rec_perspective": "規格集約・AS推進", "rec_reason": "SBT/ABPCを1.5g/Vから3.0g/Vへ規格変更し、年間約500万円の薬剤費削減見込みと同時に、腎機能正常例での「1回1.5g低用量投与」を解消した一石二鳥の改善。"}, {"id": "P1-64-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-64", "session_name": "感染症・抗菌薬/抗真菌薬TDM・HIV連携", "title": "九州医療センターにおけるタゾバクタム/セフトロザンの使用実態調査", "authors": "平峯 侑恵（ひらみね ゆきえ）、 中島 瑞貴（なかしま みずき）、 大石 博史（おおいし ひろふみ）、 高野 豪（たかの たけし）、 藤瀬 陽子（ふじせ ようこ）、 山脇 一浩（やまわき かずひろ）", "first_author": "平峯 侑恵（ひらみね ゆきえ）", "affiliations": "NHO 九州医療センター 薬剤部", "first_affiliation": "NHO 九州医療センター 薬剤部", "printed_pages": "474", "pdf_pages": "230", "features": ["タゾバクタム／セフトロザン49例を、感染部位・起炎菌・重症度・変更理由から後方視的に整理。", "耐性菌対応を含む実臨床での使用場面が分かる。対照群のない実態調査として、薬剤選択の判断過程に注目したい。"], "issues": [], "sections": [{"heading": "目的", "content": "タゾバクタム/セフトロザン（TAZ/CTLZ）は、基質特異性拡張型 β-ラクタマーゼ（ESBL）産生菌をはじめとする多剤耐性グラム陰性菌に対して重要な抗菌薬である。今回、当院における TAZ/CTLZ の使用実態を調査した。"}, {"heading": "方法", "content": "2022 年 10 月〜2025 年 9 月に TAZ/CTLZ を 72 時間以上投与した患者を対象に、後方視的に調査した。"}, {"heading": "結果", "content": "対象は 49 例（男性 31 例、女性 18 例）で、年齢中央値 73 歳、投与日数中央値 10日、ICU 入
