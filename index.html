が、職員のマネジメント意識を向上させ、組織全体の医療安全文化を底上げする可能性が示唆された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"O2-76-2\"\ncategory: \"一般演題（口頭）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [372]\nstatus: \"imported\"\n---\n\n# P-mSHELL モデルを用いたインシデント分析の継続的実践が薬剤部の医療安全文化に与える影響\n\n- 演題番号: O2-76-2\n- 演題名: P-mSHELL モデルを用いたインシデント分析の継続的実践が薬剤部の医療安全文化に与える影響\n- 所属施設: 1 NHO 熊本南病院 薬剤科、2 NHO 九州医療センター 薬剤部、3 NHO 九州がんセンター 薬剤部\n- 筆頭演者: 大橋 邦央（おおはし くにお） 1\n- 筆頭演者の所属: NHO 熊本南病院 薬剤科\n- 演者名: 大橋 邦央（おおはし くにお） 1、 溝田 愛子（みぞた あいこ） 2、 高武 嘉道（こうたけ よしみち） 3\n- 原本: [PDF 372ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=372>)\n- 冊子ページ: 616\n\n## 抄録本文\n\n### 目的\n\n医療安全は個人の責任から組織的管理体制の構築へと転換が求められている。P-mSHELL モデルは事象の背後要因を多角的に分析する手法であるが、その継続的実践が薬剤部の安全文化に与える影響は未検証である。本研究は同分析の継続的実践が、薬剤部の医療安全文化に及ぼす効果を評価した。\n\n### 方法\n\n九州医療センター薬剤部員 25 名を対象とした。重要なインシデント 9 事例を選択し、3チーム編成で各チーム 3 回、P-mSHELL 分析を実施した。評価指標として、1）立案された改善策と従来のレポート記載の改善策との要素別比較、2）P-mSHELL 分析前後における全6 回の Patient Safety Climate Scale（PSCS）意識調査による全体のスコア推移を用いた。\n\n### 結果\n\nP-mSHELL 分析により改善策は 11 件から 64 件（5.8 倍）へ大幅に増加した。従来は対策の多くが個人の注意力（Liveware）依存であったが、介入後は管理（16 件）、ソフトウェア（14 件）、ハードウェア（7 件）など、システム的対策へと明確な質的転換が認められた。また PSCS 全体の推移では、導入後半にかけて「個人の安全意識・姿勢」および「マネジメントシステム」要因を中心に、組織全体のスコアが上昇する傾向が確認された。\n\n### 考察・結論\n\nP-mSHELL 分析の実践により、従来の属人的な対策から、個人の注意力に依存しないシステム的な対策への転換が進んだ。具体的なシステム改善を継続的に立案・共有するプロセスそのものが、職員のマネジメント意識を向上させ、組織全体の医療安全文化を底上げする可能性が示唆された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- P-mSHELL分析の継続実践を、改善策の内容と複数回の安全文化尺度の双方で評価。\n- 改善策が11件から64件へ増え、個人の注意から仕組みへの転換を報告。分析会の運営方法と対策の定着が参考となる。\n\n", "rec_grade": "A", "rec_perspective": "医療安全文化・システム思考", "rec_reason": "重要インシデントのP-mSHELL分析継続により、対策が個人注意依存から管理・ソフト・ハードのシステム対策へ転換（改善策5.8倍）し、医療安全文化尺度（PSCS）も改善。安全文化醸成のモデルケース。"}, {"id": "P1-7-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-7", "session_name": "疑義照会簡素化プロトコル①", "title": "院外処方箋に関する疑義照会簡素化プロトコール導入の効果", "authors": "須永 健太（すなが けんた）、 辰口 杏奈（たつぐち あんな）、 中村 舞奈（なかむら まいな）、 市川 竜太郎（いちかわ りゅうたろう）、 新保 一（しんぼ はじめ）、 岡本 一人（おかもと かずと）", "first_author": "須永 健太（すなが けんた）", "affiliations": "NHO 新潟病院 薬剤部", "first_affiliation": "NHO 新潟病院 薬剤部", "printed_pages": "352", "pdf_pages": "108", "features": ["院外処方の疑義照会総数と医師への問い合わせ数、推計業務時間を分けてPBPM導入効果を評価。", "医師への問い合わせは減った一方、総業務時間は増加。簡素化対象の選び方と薬剤部側の負担を検討する材料となる。"], "issues": [], "sections": [{"heading": "目的", "content": "新潟病院では薬局からの疑義照会を薬剤部で対応している。疑義照会には時間を要するものから軽微なものまであり、業務負担となることが課題であった。そのため、医師及び薬剤師による疑義照会簡素化プロトコール（以下 PBPM）を策定（1：先発医薬品同士・剤型・規格の変更 2：半割・粉砕・混合・一包化指示の追加 3：週 1 回製剤が連日処方されている場合の変更 4：「医師の指示どおり」と記載されているが用法の記載が不明瞭な処方の対応 5：経腸栄養剤のフレーバー変更）し運用を開始し、その効果を調査したので報告する。"}, {"heading": "方法", "content": "調査期間は、2020 年 12 月 1 日〜2021 年 5 月 31 日を PBPM 導入前とし、2024年 6 月 1 日〜2024 年 11 月 30 日を PBPM 導入後とした。調査項目は、PBPM の 1〜5 とし、PBPM 以外を 6 とした。業務負担軽減のための指標として、PBPM 対象項目の業務時間を 1 分/1 件、PBPM 以外の項目の業務時間を 3 分/1 件として算出した。"}, {"heading": "結果", "content": "PBPM 導入前の疑義照会件数は 383 件（1〜5 は 98 件、6 は 285 件）、導入後の疑義照会件数は、586 件（1〜5 は 265 件、6 は 321 件）であった。医師へ問い合わせた件数は、導入前は383 件、導入後は 321 件で約 16％の減少であった。業務時間は、導入前で 1149 分、導入後で 1228 分であった。"}, {"heading": "考察", "content": "PBPM 導入前と比べ疑義照会総数が増加しているにも関わらず、医師への問い合わせ数が減少している。このことから、PBPM を活用することにより、院内の医師、薬剤師の業務負担軽減につながったと考えられる。今回の調査で、業務時間の短縮は見られなかったが、疑義照会の半数以上が PBPM 以外の項目に該当することが分かったため、今後、その内容を解析し新たな PBPM を策定し業務時間削減に努めたい。"}], "body_text": "### 目的\n\n新潟病院では薬局からの疑義照会を薬剤部で対応している。疑義照会には時間を要するものから軽微なものまであり、業務負担となることが課題であった。そのため、医師及び薬剤師による疑義照会簡素化プロトコール（以下 PBPM）を策定（1：先発医薬品同士・剤型・規格の変更 2：半割・粉砕・混合・一包化指示の追加 3：週 1 回製剤が連日処方されている場合の変更 4：「医師の指示どおり」と記載されているが用法の記載が不明瞭な処方の対応 5：経腸栄養剤のフレーバー変更）し運用を開始し、その効果を調査したので報告する。\n\n### 方法\n\n調査期間は、2020 年 12 月 1 日〜2021 年 5 月 31 日を PBPM 導入前とし、2024年 6 月 1 日〜2024 年 11 月 30 日を PBPM 導入後とした。調査項目は、PBPM の 1〜5 とし、PBPM 以外を 6 とした。業務負担軽減のための指標として、PBPM 対象項目の業務時間を 1 分/1 件、PBPM 以外の項目の業務時間を 3 分/1 件として算出した。\n\n### 結果\n\nPBPM 導入前の疑義照会件数は 383 件（1〜5 は 98 件、6 は 285 件）、導入後の疑義照会件数は、586 件（1〜5 は 265 件、6 は 321 件）であった。医師へ問い合わせた件数は、導入前は383 件、導入後は 321 件で約 16％の減少であった。業務時間は、導入前で 1149 分、導入後で 1228 分であった。\n\n### 考察\n\nPBPM 導入前と比べ疑義照会総数が増加しているにも関わらず、医師への問い合わせ数が減少している。このことから、PBPM を活用することにより、院内の医師、薬剤師の業務負担軽減につながったと考えられる。今回の調査で、業務時間の短縮は見られなかったが、疑義照会の半数以上が PBPM 以外の項目に該当することが分かったため、今後、その内容を解析し新たな PBPM を策定し業務時間削減に努めたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-7-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [108]\nstatus: \"imported\"\n---\n\n# 院外処方箋に関する疑義照会簡素化プロトコール導入の効果\n\n- 演題番号: P1-7-6\n- 演題名: 院外処方箋に関する疑義照会簡素化プロトコール導入の効果\n- 所属施設: NHO 新潟病院 薬剤部\n- 筆頭演者: 須永 健太（すなが けんた）\n- 筆頭演者の所属: NHO 新潟病院 薬剤部\n- 演者名: 須永 健太（すなが けんた）、 辰口 杏奈（たつぐち あんな）、 中村 舞奈（なかむら まいな）、 市川 竜太郎（いちかわ りゅうたろう）、 新保 一（しんぼ はじめ）、 岡本 一人（おかもと かずと）\n- 原本: [PDF 108ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=108>)\n- 冊子ページ: 352\n\n## 抄録本文\n\n### 目的\n\n新潟病院では薬局からの疑義照会を薬剤部で対応している。疑義照会には時間を要するものから軽微なものまであり、業務負担となることが課題であった。そのため、医師及び薬剤師による疑義照会簡素化プロトコール（以下 PBPM）を策定（1：先発医薬品同士・剤型・規格の変更 2：半割・粉砕・混合・一包化指示の追加 3：週 1 回製剤が連日処方されている場合の変更 4：「医師の指示どおり」と記載されているが用法の記載が不明瞭な処方の対応 5：経腸栄養剤のフレーバー変更）し運用を開始し、その効果を調査したので報告する。\n\n### 方法\n\n調査期間は、2020 年 12 月 1 日〜2021 年 5 月 31 日を PBPM 導入前とし、2024年 6 月 1 日〜2024 年 11 月 30 日を PBPM 導入後とした。調査項目は、PBPM の 1〜5 とし、PBPM 以外を 6 とした。業務負担軽減のための指標として、PBPM 対象項目の業務時間を 1 分/1 件、PBPM 以外の項目の業務時間を 3 分/1 件として算出した。\n\n### 結果\n\nPBPM 導入前の疑義照会件数は 383 件（1〜5 は 98 件、6 は 285 件）、導入後の疑義照会件数は、586 件（1〜5 は 265 件、6 は 321 件）であった。医師へ問い合わせた件数は、導入前は383 件、導入後は 321 件で約 16％の減少であった。業務時間は、導入前で 1149 分、導入後で 1228 分であった。\n\n### 考察\n\nPBPM 導入前と比べ疑義照会総数が増加しているにも関わらず、医師への問い合わせ数が減少している。このことから、PBPM を活用することにより、院内の医師、薬剤師の業務負担軽減につながったと考えられる。今回の調査で、業務時間の短縮は見られなかったが、疑義照会の半数以上が PBPM 以外の項目に該当することが分かったため、今後、その内容を解析し新たな PBPM を策定し業務時間削減に努めたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 院外処方の疑義照会総数と医師への問い合わせ数、推計業務時間を分けてPBPM導入効果を評価。\n- 医師への問い合わせは減った一方、総業務時間は増加。簡素化対象の選び方と薬剤部側の負担を検討する材料となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-14-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-14", "session_name": "疑義照会簡素化・処方介入", "title": "疑義照会簡素化プロトコルの導入効果と処方介入の実績調査", "authors": "花田 聖典（はなだ きよのり）", "first_author": "花田 聖典（はなだ きよのり）", "affiliations": "NHO 南九州病院 薬剤部", "first_affiliation": "NHO 南九州病院 薬剤部", "printed_pages": "366", "pdf_pages": "122", "features": ["一般処方介入573件とプロトコルによる処方修正266件を、内容・安全への寄与から整理。", "治療効果向上の介入と形式的変更の役割を比較できる。追加すべきプロトコル項目の選定方法に注目したい。"], "issues": [], "sections": [{"heading": "目的", "content": "薬剤師による疑義照会をはじめとする処方介入は、医療過誤の防止だけでなく、薬物治療の最適化において極めて重要な役割を担っている。一方で形式的な内容の照会は医師の負担を増大させ、診療業務の妨げとなる場合がある。当院では医師の業務負担軽減と業務効率化を目的に「疑義照会簡素化プロトコル」を導入した。今回、処方介入の内容と本プロトコルの実績を分析し、今後の安全管理体制の課題を検討した。"}, {"heading": "方法", "content": "2023 年 4 月から 2026 年 3 月までに実施された処方介入 573 件およびプロトコルに基づく処方修正 266 件を対象として、一般処方介入内容およびプロトコル内容の分類および医療安全への寄与度について後方視的に調査した。"}, {"heading": "結果", "content": "一般処方介入では「薬物治療効果の向上」が 420 件と最多であり、「副作用重篤化等回避」が 87 件、「副作用未然回避」が 66 件だった。また介入内容では「用量変更」が 188件と最多であり、次に日数・開始日変更（92 件）、処方提案・処方追加（78 件）の順だった。一方、プロトコルの運用では、成分名が同一の銘柄変更（93 件）、日数適正化（55 件）、剤形変更（43 件）の順に多かった。"}, {"heading": "考察", "content": "調査結果から薬剤師は用量変更や処方日数、処方提案に関する介入を通じて、薬物治療効果の向上に貢献していることが示唆された。また本プロトコル導入は、医師の業務負担軽減による業務効率化に寄与するとともに、薬剤師がより薬物治療の最適化に注力し専門性を発揮する体制につながっていると考える。今後は、特に発生頻度が高い処方エラーをシステム的に防ぐ仕組みづくりや、プロトコルの修正や追加を検討し、更なる医療安全の向上と業務効率化を目指す必要がある。"}], "body_text": "### 目的\n\n薬剤師による疑義照会をはじめとする処方介入は、医療過誤の防止だけでなく、薬物治療の最適化において極めて重要な役割を担っている。一方で形式的な内容の照会は医師の負担を増大させ、診療業務の妨げとなる場合がある。当院では医師の業務負担軽減と業務効率化を目的に「疑義照会簡素化プロトコル」を導入した。今回、処方介入の内容と本プロトコルの実績を分析し、今後の安全管理体制の課題を検討した。\n\n### 方法\n\n2023 年 4 月から 2026 年 3 月までに実施された処方介入 573 件およびプロトコルに基づく処方修正 266 件を対象として、一般処方介入内容およびプロトコル内容の分類および医療安全への寄与度について後方視的に調査した。\n\n### 結果\n\n一般処方介入では「薬物治療効果の向上」が 420 件と最多であり、「副作用重篤化等回避」が 87 件、「副作用未然回避」が 66 件だった。また介入内容では「用量変更」が 188件と最多であり、次に日数・開始日変更（92 件）、処方提案・処方追加（78 件）の順だった。一方、プロトコルの運用では、成分名が同一の銘柄変更（93 件）、日数適正化（55 件）、剤形変更（43 件）の順に多かった。\n\n### 考察\n\n調査結果から薬剤師は用量変更や処方日数、処方提案に関する介入を通じて、薬物治療効果の向上に貢献していることが示唆された。また本プロトコル導入は、医師の業務負担軽減による業務効率化に寄与するとともに、薬剤師がより薬物治療の最適化に注力し専門性を発揮する体制につながっていると考える。今後は、特に発生頻度が高い処方エラーをシステム的に防ぐ仕組みづくりや、プロトコルの修正や追加を検討し、更なる医療安全の向上と業務効率化を目指す必要がある。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-14-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [122]\nstatus: \"imported\"\n---\n\n# 疑義照会簡素化プロトコルの導入効果と処方介入の実績調査\n\n- 演題番号: P1-14-4\n- 演題名: 疑義照会簡素化プロトコルの導入効果と処方介入の実績調査\n- 所属施設: NHO 南九州病院 薬剤部\n- 筆頭演者: 花田 聖典（はなだ きよのり）\n- 筆頭演者の所属: NHO 南九州病院 薬剤部\n- 演者名: 花田 聖典（はなだ きよのり）\n- 原本: [PDF 122ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=122>)\n- 冊子ページ: 366\n\n## 抄録本文\n\n### 目的\n\n薬剤師による疑義照会をはじめとする処方介入は、医療過誤の防止だけでなく、薬物治療の最適化において極めて重要な役割を担っている。一方で形式的な内容の照会は医師の負担を増大させ、診療業務の妨げとなる場合がある。当院では医師の業務負担軽減と業務効率化を目的に「疑義照会簡素化プロトコル」を導入した。今回、処方介入の内容と本プロトコルの実績を分析し、今後の安全管理体制の課題を検討した。\n\n### 方法\n\n2023 年 4 月から 2026 年 3 月までに実施された処方介入 573 件およびプロトコルに基づく処方修正 266 件を対象として、一般処方介入内容およびプロトコル内容の分類および医療安全への寄与度について後方視的に調査した。\n\n### 結果\n\n一般処方介入では「薬物治療効果の向上」が 420 件と最多であり、「副作用重篤化等回避」が 87 件、「副作用未然回避」が 66 件だった。また介入内容では「用量変更」が 188件と最多であり、次に日数・開始日変更（92 件）、処方提案・処方追加（78 件）の順だった。一方、プロトコルの運用では、成分名が同一の銘柄変更（93 件）、日数適正化（55 件）、剤形変更（43 件）の順に多かった。\n\n### 考察\n\n調査結果から薬剤師は用量変更や処方日数、処方提案に関する介入を通じて、薬物治療効果の向上に貢献していることが示唆された。また本プロトコル導入は、医師の業務負担軽減による業務効率化に寄与するとともに、薬剤師がより薬物治療の最適化に注力し専門性を発揮する体制につながっていると考える。今後は、特に発生頻度が高い処方エラーをシステム的に防ぐ仕組みづくりや、プロトコルの修正や追加を検討し、更なる医療安全の向上と業務効率化を目指す必要がある。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 一般処方介入573件とプロトコルによる処方修正266件を、内容・安全への寄与から整理。\n- 治療効果向上の介入と形式的変更の役割を比較できる。追加すべきプロトコル項目の選定方法に注目したい。\n\n", "rec_grade": "C", "rec_perspective": "PBPM・処方介入分析", "rec_reason": "一般処方介入573件とPBPM修正266件を分類し、形式的照会の削減が「用量変更・処方提案」等の薬物治療効果向上（420件）への注力につながる構造を整理。"}, {"id": "P1-16-1", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-16", "session_name": "医療安全・調剤支援・プレアボイド評価", "title": "計数調剤管理システム導入による調剤過誤件数の変化と今後の課題", "authors": "東谷 素直（ひがしたに すなお）、 田村 憲明（たむら のりあき）、 中島 淳（なかしま じゅん）、 吉村 芙美（よしむら ふみ）、 齊藤 祐介（さいとう ゆうすけ）、 原 伸好（はら のぶよし）、 井上 敦介（いのうえ あつゆき）", "first_author": "東谷 素直（ひがしたに すなお）", "affiliations": "NHO 舞鶴医療センター 薬剤科", "first_affiliation": "NHO 舞鶴医療センター 薬剤科", "printed_pages": "369", "pdf_pages": "125", "features": ["計数調剤支援システムの導入前後を、ヒヤリハットとインシデント、当直帯の状況に分けて評価。", "ヒヤリハットは減少した一方、インシデントは横ばい。使用する職種・時間帯と残存エラーの関係が聴講ポイント。"], "issues": [], "sections": [{"heading": "目的", "content": "医療安全の推進とともに、調剤監査を支援する手段として計数調剤管理システムの使用が近年主流となっている。当院でも 2024 年度より計数調剤管理システム（TOSHO 製 F-WAVE）を導入し、主には薬剤助手と薬剤師の当直帯で使用している。今回、F-WAVE 導入前後の計数調剤ヒヤリハット及びインシデント件数とその事例内容を分析し、今後の課題について検討したため報告する。"}, {"heading": "方法", "content": "F-WAVE 導入前（2023 年 4 月-2024 年 3 月）と導入後（2024 年 4 月-2026 年 3 月）の期間において、薬剤部内で発見されたヒヤリハット、インシデント事例の内容について後方視的に調査した。"}, {"heading": "結果", "content": "ヒヤリハットの総件数は2023〜2025 年度でそれぞれ 222 件、130 件、76 件と減少傾向であった。一方、インシデント件数の推移は、20 件（当直帯 5 件）、24 件（当直帯 9 件）、17 件（当直帯 12 件）と横ばいであった。"}, {"heading": "考察", "content": "当院では、薬剤助手と薬剤師の当直帯で F-WAVE を限定的に使用しているが、導入によって日中のヒヤリハット件数が減少したことから、薬剤助手の調剤精度の担保に一定の効果があることが示唆された。しかしながら、当直帯のインシデント件数は減少しておらず、これは F-WAVE の使用では防止できない事例が多かったためと考えられた。事例内容の分析では、規格間違いも報告されていた。これは、薬剤師が当直の繁忙な時間帯に F-WAVE を使用しなかったことが要因であり、使用の徹底について周知している。今回の結果から、F-WAVE の使用は医療安全の向上に有用であると考える。現状、当院は薬剤助手と薬剤師の当直帯の使用に限定しているが、医療安全の推進には、F-WAVE のさらなる有効活用を検討していく必要があると思われる。"}], "body_text": "### 目的\n\n医療安全の推進とともに、調剤監査を支援する手段として計数調剤管理システムの使用が近年主流となっている。当院でも 2024 年度より計数調剤管理システム（TOSHO 製 F-WAVE）を導入し、主には薬剤助手と薬剤師の当直帯で使用している。今回、F-WAVE 導入前後の計数調剤ヒヤリハット及びインシデント件数とその事例内容を分析し、今後の課題について検討したため報告する。\n\n### 方法\n\nF-WAVE 導入前（2023 年 4 月-2024 年 3 月）と導入後（2024 年 4 月-2026 年 3 月）の期間において、薬剤部内で発見されたヒヤリハット、インシデント事例の内容について後方視的に調査した。\n\n### 結果\n\nヒヤリハットの総件数は2023〜2025 年度でそれぞれ 222 件、130 件、76 件と減少傾向であった。一方、インシデント件数の推移は、20 件（当直帯 5 件）、24 件（当直帯 9 件）、17 件（当直帯 12 件）と横ばいであった。\n\n### 考察\n\n当院では、薬剤助手と薬剤師の当直帯で F-WAVE を限定的に使用しているが、導入によって日中のヒヤリハット件数が減少したことから、薬剤助手の調剤精度の担保に一定の効果があることが示唆された。しかしながら、当直帯のインシデント件数は減少しておらず、これは F-WAVE の使用では防止できない事例が多かったためと考えられた。事例内容の分析では、規格間違いも報告されていた。これは、薬剤師が当直の繁忙な時間帯に F-WAVE を使用しなかったことが要因であり、使用の徹底について周知している。今回の結果から、F-WAVE の使用は医療安全の向上に有用であると考える。現状、当院は薬剤助手と薬剤師の当直帯の使用に限定しているが、医療安全の推進には、F-WAVE のさらなる有効活用を検討していく必要があると思われる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-16-1\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [125]\nstatus: \"imported\"\n---\n\n# 計数調剤管理システム導入による調剤過誤件数の変化と今後の課題\n\n- 演題番号: P1-16-1\n- 演題名: 計数調剤管理システム導入による調剤過誤件数の変化と今後の課題\n- 所属施設: NHO 舞鶴医療センター 薬剤科\n- 筆頭演者: 東谷 素直（ひがしたに すなお）\n- 筆頭演者の所属: NHO 舞鶴医療センター 薬剤科\n- 演者名: 東谷 素直（ひがしたに すなお）、 田村 憲明（たむら のりあき）、 中島 淳（なかしま じゅん）、 吉村 芙美（よしむら ふみ）、 齊藤 祐介（さいとう ゆうすけ）、 原 伸好（はら のぶよし）、 井上 敦介（いのうえ あつゆき）\n- 原本: [PDF 125ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=125>)\n- 冊子ページ: 369\n\n## 抄録本文\n\n### 目的\n\n医療安全の推進とともに、調剤監査を支援する手段として計数調剤管理システムの使用が近年主流となっている。当院でも 2024 年度より計数調剤管理システム（TOSHO 製 F-WAVE）を導入し、主には薬剤助手と薬剤師の当直帯で使用している。今回、F-WAVE 導入前後の計数調剤ヒヤリハット及びインシデント件数とその事例内容を分析し、今後の課題について検討したため報告する。\n\n### 方法\n\nF-WAVE 導入前（2023 年 4 月-2024 年 3 月）と導入後（2024 年 4 月-2026 年 3 月）の期間において、薬剤部内で発見されたヒヤリハット、インシデント事例の内容について後方視的に調査した。\n\n### 結果\n\nヒヤリハットの総件数は2023〜2025 年度でそれぞれ 222 件、130 件、76 件と減少傾向であった。一方、インシデント件数の推移は、20 件（当直帯 5 件）、24 件（当直帯 9 件）、17 件（当直帯 12 件）と横ばいであった。\n\n### 考察\n\n当院では、薬剤助手と薬剤師の当直帯で F-WAVE を限定的に使用しているが、導入によって日中のヒヤリハット件数が減少したことから、薬剤助手の調剤精度の担保に一定の効果があることが示唆された。しかしながら、当直帯のインシデント件数は減少しておらず、これは F-WAVE の使用では防止できない事例が多かったためと考えられた。事例内容の分析では、規格間違いも報告されていた。これは、薬剤師が当直の繁忙な時間帯に F-WAVE を使用しなかったことが要因であり、使用の徹底について周知している。今回の結果から、F-WAVE の使用は医療安全の向上に有用であると考える。現状、当院は薬剤助手と薬剤師の当直帯の使用に限定しているが、医療安全の推進には、F-WAVE のさらなる有効活用を検討していく必要があると思われる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 計数調剤支援システムの導入前後を、ヒヤリハットとインシデント、当直帯の状況に分けて評価。\n- ヒヤリハットは減少した一方、インシデントは横ばい。使用する職種・時間帯と残存エラーの関係が聴講ポイント。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-16-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-16", "session_name": "医療安全・調剤支援・プレアボイド評価", "title": "PDA 導入で見えた成果と課題〜バーコード認証で調剤エラーは防げるのか〜", "authors": "清 純一（きよし じゅんいち）、 中村 優希（なかむら ゆき）、 田中 麻理子（たなか まりこ）、 海家 亜希子（かいや あきこ）、 別府 博仁（べっぷ ひろひと）", "first_author": "清 純一（きよし じゅんいち）", "affiliations": "NHO 神戸医療センター 薬剤部", "first_affiliation": "NHO 神戸医療センター 薬剤部", "printed_pages": "369", "pdf_pages": "125", "features": ["PDA導入の効果をエラーの種類別に分析し、バーコードで防ぎやすい誤りと残る誤りを示す。", "他剤・規格間違いの減少に対し半錠・粉砕忘れは増加傾向。処方箋の見方や運用変更を含む対策に注目できる。"], "issues": [], "sections": [{"heading": "目的", "content": "近年、薬剤師には従来の対物業務に加え、服薬指導や副作用モニタリングなど対人業務への関与が求められている。当院では、調剤業務の安全性向上および効率化を目的として、PDA を用いた調剤支援システム（TOSHO 社製 F-WAVE、F-AUDIT：以下 PDA）を導入した。本研究では、導入前後におけるヒヤリハット事例を比較し、その有用性と課題について検討した。"}, {"heading": "方法", "content": "調剤支援システム導入前後に薬剤部内で報告されたヒヤリハット事例について、内容別に後方視的調査を行った。主な分類項目として、他剤間違い、規格間違い、計数間違い、半錠・粉砕忘れ等を抽出し、導入前後で比較した。"}, {"heading": "結果", "content": "導入前は他剤間違いおよび規格間違いがヒヤリハット事例の大半を占めていたが、導入後はこれらの事例が大幅に減少した。一方、内服薬および外用薬の計数間違いは導入前後で大きな変化を認めなかったが、注射薬においては計数間違いの減少が確認された。また、半錠・粉砕忘れは導入後に増加傾向を認めた。"}, {"heading": "考察", "content": "調剤支援システムの導入により、他剤間違い、規格間違いの減少が認められ、調剤業務の安全性向上に有用であることが示唆された。PDA 導入により他剤間違いが起こりえないと考えるが、完全に防止できない要因としては、PDA を用いないことに起因する事例によるため、手順の順守が求められる。また、半錠・粉砕忘れの増加については、導入後に PDA 画面中心で調剤を進める傾向となり、処方箋全体の確認不足につながった可能性が示唆された。今後は、PDA の適切な運用に関する注意喚起に加え、処方箋レイアウトや運用方法の見直しを行うことで、さらなる安全対策を検討する必要がある。"}], "body_text": "### 目的\n\n近年、薬剤師には従来の対物業務に加え、服薬指導や副作用モニタリングなど対人業務への関与が求められている。当院では、調剤業務の安全性向上および効率化を目的として、PDA を用いた調剤支援システム（TOSHO 社製 F-WAVE、F-AUDIT：以下 PDA）を導入した。本研究では、導入前後におけるヒヤリハット事例を比較し、その有用性と課題について検討した。\n\n### 方法\n\n調剤支援システム導入前後に薬剤部内で報告されたヒヤリハット事例について、内容別に後方視的調査を行った。主な分類項目として、他剤間違い、規格間違い、計数間違い、半錠・粉砕忘れ等を抽出し、導入前後で比較した。\n\n### 結果\n\n導入前は他剤間違いおよび規格間違いがヒヤリハット事例の大半を占めていたが、導入後はこれらの事例が大幅に減少した。一方、内服薬および外用薬の計数間違いは導入前後で大きな変化を認めなかったが、注射薬においては計数間違いの減少が確認された。また、半錠・粉砕忘れは導入後に増加傾向を認めた。\n\n### 考察\n\n調剤支援システムの導入により、他剤間違い、規格間違いの減少が認められ、調剤業務の安全性向上に有用であることが示唆された。PDA 導入により他剤間違いが起こりえないと考えるが、完全に防止できない要因としては、PDA を用いないことに起因する事例によるため、手順の順守が求められる。また、半錠・粉砕忘れの増加については、導入後に PDA 画面中心で調剤を進める傾向となり、処方箋全体の確認不足につながった可能性が示唆された。今後は、PDA の適切な運用に関する注意喚起に加え、処方箋レイアウトや運用方法の見直しを行うことで、さらなる安全対策を検討する必要がある。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-16-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [125]\nstatus: \"imported\"\n---\n\n# PDA 導入で見えた成果と課題〜バーコード認証で調剤エラーは防げるのか〜\n\n- 演題番号: P1-16-2\n- 演題名: PDA 導入で見えた成果と課題〜バーコード認証で調剤エラーは防げるのか〜\n- 所属施設: NHO 神戸医療センター 薬剤部\n- 筆頭演者: 清 純一（きよし じゅんいち）\n- 筆頭演者の所属: NHO 神戸医療センター 薬剤部\n- 演者名: 清 純一（きよし じゅんいち）、 中村 優希（なかむら ゆき）、 田中 麻理子（たなか まりこ）、 海家 亜希子（かいや あきこ）、 別府 博仁（べっぷ ひろひと）\n- 原本: [PDF 125ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=125>)\n- 冊子ページ: 369\n\n## 抄録本文\n\n### 目的\n\n近年、薬剤師には従来の対物業務に加え、服薬指導や副作用モニタリングなど対人業務への関与が求められている。当院では、調剤業務の安全性向上および効率化を目的として、PDA を用いた調剤支援システム（TOSHO 社製 F-WAVE、F-AUDIT：以下 PDA）を導入した。本研究では、導入前後におけるヒヤリハット事例を比較し、その有用性と課題について検討した。\n\n### 方法\n\n調剤支援システム導入前後に薬剤部内で報告されたヒヤリハット事例について、内容別に後方視的調査を行った。主な分類項目として、他剤間違い、規格間違い、計数間違い、半錠・粉砕忘れ等を抽出し、導入前後で比較した。\n\n### 結果\n\n導入前は他剤間違いおよび規格間違いがヒヤリハット事例の大半を占めていたが、導入後はこれらの事例が大幅に減少した。一方、内服薬および外用薬の計数間違いは導入前後で大きな変化を認めなかったが、注射薬においては計数間違いの減少が確認された。また、半錠・粉砕忘れは導入後に増加傾向を認めた。\n\n### 考察\n\n調剤支援システムの導入により、他剤間違い、規格間違いの減少が認められ、調剤業務の安全性向上に有用であることが示唆された。PDA 導入により他剤間違いが起こりえないと考えるが、完全に防止できない要因としては、PDA を用いないことに起因する事例によるため、手順の順守が求められる。また、半錠・粉砕忘れの増加については、導入後に PDA 画面中心で調剤を進める傾向となり、処方箋全体の確認不足につながった可能性が示唆された。今後は、PDA の適切な運用に関する注意喚起に加え、処方箋レイアウトや運用方法の見直しを行うことで、さらなる安全対策を検討する必要がある。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- PDA導入の効果をエラーの種類別に分析し、バーコードで防ぎやすい誤りと残る誤りを示す。\n- 他剤・規格間違いの減少に対し半錠・粉砕忘れは増加傾向。処方箋の見方や運用変更を含む対策に注目できる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-16-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-16", "session_name": "医療安全・調剤支援・プレアボイド評価", "title": "事前合意プロトコル導入による疑義照会後の処方修正効率化の検討", "authors": "岡本 春香（おかもと はるか）、 清水 宏太郎（しみず こうたろう）、 廣瀬 沙紀（ひろせ さき）、 中口 真愛子（なかぐち まいこ）、 山内 真治（やまうち しんじ）、 生駒 歌織（いこま かおり）、 竹松 茂樹（たけまつ しげき）", "first_author": "岡本 春香（おかもと はるか）", "affiliations": "NHO 和歌山病院 薬剤部", "first_affiliation": "NHO 和歌山病院 薬剤部", "printed_pages": "369", "pdf_pages": "125", "features": ["薬剤師による処方代行修正に、事前に問い合わせを省略できる6項目を加えた運用を検証。", "380件の代行修正中124件が省略対象となり、7か月で約10.3時間の削減を推計。適用条件と安全確認が参考となる。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "和歌山病院では医師の業務負担軽減および疑義照会後の処方修正作業の効率化を目的として、薬剤師が一定の条件下で処方内容を代行修正できる事前同意プロトコルを導入した。本プロトコルでは、医師への問い合わせを行わずに薬剤師が修正可能な項目（以下、問い合わせ省略項目）を設定した。今回、問い合わせ省略項目の実績とその効果を検証した。"}, {"heading": "方法", "content": "問い合わせ省略項目は内服薬・外用薬に限定し、院内処方では 1．採用品目変更に伴う同一成分・同一規格・同一剤型への変更、2．吸入処方の生理食塩水量調整、3．軟膏混合指示の追記、4．一包化指示の追加・削除、5．粉砕・簡易懸濁指示の追記の 5 項目、院外処方では 6．剤型違い製剤への変更の 1 項目とした。2025 年 10 月から 2026 年 4 月に薬剤師が実施した処方修正件数を集計し、そのうち事前同意プロトコルに基づき問い合わせを省略して修正した件数を調査した。"}, {"heading": "結果", "content": "事前同意プロトコルに基づき代行修正した件数は380 件であり、そのうち問い合わせ省略項目に該当した件数は 124 件であった。内訳は、1．採用品目変更に伴う同一成分・同一規格・同一剤型への変更 86 件、6．剤型違い製剤への変更 14 件、4．一包化指示の追加・削除 13 件、2．吸入処方の生理食塩水量調整 7 件、3．軟膏混合指示の追記 4 件であった。"}, {"heading": "考察", "content": "疑義照会 1 件あたり約 5 分を要することから、調査期間 7 か月で合計 10.3 時間の業務削減効果が得られた。本プロトコルの導入は、疑義照会後の処方修正作業の効率化に寄与するとともに、医師の問い合わせ対応負担の軽減にも貢献したと考える。今後は省略項目のさらなる検討を行い、より効率的な処方支援体制の構築を目指していきたい。"}], "body_text": "### 背景・目的\n\n和歌山病院では医師の業務負担軽減および疑義照会後の処方修正作業の効率化を目的として、薬剤師が一定の条件下で処方内容を代行修正できる事前同意プロトコルを導入した。本プロトコルでは、医師への問い合わせを行わずに薬剤師が修正可能な項目（以下、問い合わせ省略項目）を設定した。今回、問い合わせ省略項目の実績とその効果を検証した。\n\n### 方法\n\n問い合わせ省略項目は内服薬・外用薬に限定し、院内処方では 1．採用品目変更に伴う同一成分・同一規格・同一剤型への変更、2．吸入処方の生理食塩水量調整、3．軟膏混合指示の追記、4．一包化指示の追加・削除、5．粉砕・簡易懸濁指示の追記の 5 項目、院外処方では 6．剤型違い製剤への変更の 1 項目とした。2025 年 10 月から 2026 年 4 月に薬剤師が実施した処方修正件数を集計し、そのうち事前同意プロトコルに基づき問い合わせを省略して修正した件数を調査した。\n\n### 結果\n\n事前同意プロトコルに基づき代行修正した件数は380 件であり、そのうち問い合わせ省略項目に該当した件数は 124 件であった。内訳は、1．採用品目変更に伴う同一成分・同一規格・同一剤型への変更 86 件、6．剤型違い製剤への変更 14 件、4．一包化指示の追加・削除 13 件、2．吸入処方の生理食塩水量調整 7 件、3．軟膏混合指示の追記 4 件であった。\n\n### 考察\n\n疑義照会 1 件あたり約 5 分を要することから、調査期間 7 か月で合計 10.3 時間の業務削減効果が得られた。本プロトコルの導入は、疑義照会後の処方修正作業の効率化に寄与するとともに、医師の問い合わせ対応負担の軽減にも貢献したと考える。今後は省略項目のさらなる検討を行い、より効率的な処方支援体制の構築を目指していきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-16-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [125]\nstatus: \"imported\"\n---\n\n# 事前合意プロトコル導入による疑義照会後の処方修正効率化の検討\n\n- 演題番号: P1-16-3\n- 演題名: 事前合意プロトコル導入による疑義照会後の処方修正効率化の検討\n- 所属施設: NHO 和歌山病院 薬剤部\n- 筆頭演者: 岡本 春香（おかもと はるか）\n- 筆頭演者の所属: NHO 和歌山病院 薬剤部\n- 演者名: 岡本 春香（おかもと はるか）、 清水 宏太郎（しみず こうたろう）、 廣瀬 沙紀（ひろせ さき）、 中口 真愛子（なかぐち まいこ）、 山内 真治（やまうち しんじ）、 生駒 歌織（いこま かおり）、 竹松 茂樹（たけまつ しげき）\n- 原本: [PDF 125ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=125>)\n- 冊子ページ: 369\n\n## 抄録本文\n\n### 背景・目的\n\n和歌山病院では医師の業務負担軽減および疑義照会後の処方修正作業の効率化を目的として、薬剤師が一定の条件下で処方内容を代行修正できる事前同意プロトコルを導入した。本プロトコルでは、医師への問い合わせを行わずに薬剤師が修正可能な項目（以下、問い合わせ省略項目）を設定した。今回、問い合わせ省略項目の実績とその効果を検証した。\n\n### 方法\n\n問い合わせ省略項目は内服薬・外用薬に限定し、院内処方では 1．採用品目変更に伴う同一成分・同一規格・同一剤型への変更、2．吸入処方の生理食塩水量調整、3．軟膏混合指示の追記、4．一包化指示の追加・削除、5．粉砕・簡易懸濁指示の追記の 5 項目、院外処方では 6．剤型違い製剤への変更の 1 項目とした。2025 年 10 月から 2026 年 4 月に薬剤師が実施した処方修正件数を集計し、そのうち事前同意プロトコルに基づき問い合わせを省略して修正した件数を調査した。\n\n### 結果\n\n事前同意プロトコルに基づき代行修正した件数は380 件であり、そのうち問い合わせ省略項目に該当した件数は 124 件であった。内訳は、1．採用品目変更に伴う同一成分・同一規格・同一剤型への変更 86 件、6．剤型違い製剤への変更 14 件、4．一包化指示の追加・削除 13 件、2．吸入処方の生理食塩水量調整 7 件、3．軟膏混合指示の追記 4 件であった。\n\n### 考察\n\n疑義照会 1 件あたり約 5 分を要することから、調査期間 7 か月で合計 10.3 時間の業務削減効果が得られた。本プロトコルの導入は、疑義照会後の処方修正作業の効率化に寄与するとともに、医師の問い合わせ対応負担の軽減にも貢献したと考える。今後は省略項目のさらなる検討を行い、より効率的な処方支援体制の構築を目指していきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 薬剤師による処方代行修正に、事前に問い合わせを省略できる6項目を加えた運用を検証。\n- 380件の代行修正中124件が省略対象となり、7か月で約10.3時間の削減を推計。適用条件と安全確認が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-16-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-16", "session_name": "医療安全・調剤支援・プレアボイド評価", "title": "病棟薬剤業務を発端とするプレアボイド収集のための取り組みと今後の展望", "authors": "平山 真秀（ひらやま まほ）、 片岡 優衣（かたおか ゆい）、 中田 華（なかた はな）、 中筋 千佳（なかすじ ちか）、 松井 尚美（まつい なおみ）、 田路 章博（たじ あきひろ）", "first_author": "平山 真秀（ひらやま まほ）", "affiliations": "NHO 姫路医療センター 薬剤部", "first_affiliation": "NHO 姫路医療センター 薬剤部", "printed_pages": "370", "pdf_pages": "126", "features": ["病棟業務のプレアボイド419件を分析し、その分類を電子カルテの記録テンプレート改変へ反映。", "改変後は処方提案53件に対し分類入力28件。介入を報告実績につなげる入力設計・定着の工夫に注目したい。"], "issues": [], "sections": [{"heading": "目的", "content": "プレアボイド報告は薬剤師が実践する薬学的患者ケアを通じて副作用や相互作用を回避、軽減するための取り組みであり、有効で安全な薬物療法を実施するために重要な役割を果たす。当院では 2019 年 7 月以降電子カルテテンプレートに記録した処方提案内容を元にプレアボイド報告をするため、診療データウエアハウスシステムを用いてプレアボイド収集及び内容解析を行っている。今回、業務効率化を目的に 2026 年 4 月テンプレートの一部改変を行ったので、その取り組みと改変後の業務変化について報告する。"}, {"heading": "方法", "content": "2025 年度の病棟業務に関するプレアボイド報告を収集し、分類別、介入項目別で評価を行った。その評価を元に改変したテンプレートによる薬剤師業務の変化を検証した。"}, {"heading": "結果", "content": "病棟業務に関するプレアボイド報告は 2025 年度 419 件、内訳は重篤化回避 19 件、未然回避 278 件、治療向上 122 件であった。テンプレートを改変した 2026 年 4 月の処方提案件数は 53 件、プレアボイド分類の入力は 28 件に留まった。"}, {"heading": "考察", "content": "報告様式に準じた分類・介入項目を選択出来る細分化したテンプレートを用いることで処方提案を行った薬剤師がプレアボイド報告を意識した薬学的介入を行う機会となった。またプレアボイドの内容解析を担当する薬剤師は既に分類毎に入力されているため、報告内容に注視でき業務効率化が図れた。テンプレート改変後の業務効率化やプレアボイド報告の意識付けを持続し、多岐にわたる病院薬剤師業務の質の高いプレアボイド収集が可能となるツールを今後も検討するとともに、薬剤師による医療安全、医薬品適正使用の貢献を示していきたい。"}], "body_text": "### 目的\n\nプレアボイド報告は薬剤師が実践する薬学的患者ケアを通じて副作用や相互作用を回避、軽減するための取り組みであり、有効で安全な薬物療法を実施するために重要な役割を果たす。当院では 2019 年 7 月以降電子カルテテンプレートに記録した処方提案内容を元にプレアボイド報告をするため、診療データウエアハウスシステムを用いてプレアボイド収集及び内容解析を行っている。今回、業務効率化を目的に 2026 年 4 月テンプレートの一部改変を行ったので、その取り組みと改変後の業務変化について報告する。\n\n### 方法\n\n2025 年度の病棟業務に関するプレアボイド報告を収集し、分類別、介入項目別で評価を行った。その評価を元に改変したテンプレートによる薬剤師業務の変化を検証した。\n\n### 結果\n\n病棟業務に関するプレアボイド報告は 2025 年度 419 件、内訳は重篤化回避 19 件、未然回避 278 件、治療向上 122 件であった。テンプレートを改変した 2026 年 4 月の処方提案件数は 53 件、プレアボイド分類の入力は 28 件に留まった。\n\n### 考察\n\n報告様式に準じた分類・介入項目を選択出来る細分化したテンプレートを用いることで処方提案を行った薬剤師がプレアボイド報告を意識した薬学的介入を行う機会となった。またプレアボイドの内容解析を担当する薬剤師は既に分類毎に入力されているため、報告内容に注視でき業務効率化が図れた。テンプレート改変後の業務効率化やプレアボイド報告の意識付けを持続し、多岐にわたる病院薬剤師業務の質の高いプレアボイド収集が可能となるツールを今後も検討するとともに、薬剤師による医療安全、医薬品適正使用の貢献を示していきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-16-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [126]\nstatus: \"imported\"\n---\n\n# 病棟薬剤業務を発端とするプレアボイド収集のための取り組みと今後の展望\n\n- 演題番号: P1-16-4\n- 演題名: 病棟薬剤業務を発端とするプレアボイド収集のための取り組みと今後の展望\n- 所属施設: NHO 姫路医療センター 薬剤部\n- 筆頭演者: 平山 真秀（ひらやま まほ）\n- 筆頭演者の所属: NHO 姫路医療センター 薬剤部\n- 演者名: 平山 真秀（ひらやま まほ）、 片岡 優衣（かたおか ゆい）、 中田 華（なかた はな）、 中筋 千佳（なかすじ ちか）、 松井 尚美（まつい なおみ）、 田路 章博（たじ あきひろ）\n- 原本: [PDF 126ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=126>)\n- 冊子ページ: 370\n\n## 抄録本文\n\n### 目的\n\nプレアボイド報告は薬剤師が実践する薬学的患者ケアを通じて副作用や相互作用を回避、軽減するための取り組みであり、有効で安全な薬物療法を実施するために重要な役割を果たす。当院では 2019 年 7 月以降電子カルテテンプレートに記録した処方提案内容を元にプレアボイド報告をするため、診療データウエアハウスシステムを用いてプレアボイド収集及び内容解析を行っている。今回、業務効率化を目的に 2026 年 4 月テンプレートの一部改変を行ったので、その取り組みと改変後の業務変化について報告する。\n\n### 方法\n\n2025 年度の病棟業務に関するプレアボイド報告を収集し、分類別、介入項目別で評価を行った。その評価を元に改変したテンプレートによる薬剤師業務の変化を検証した。\n\n### 結果\n\n病棟業務に関するプレアボイド報告は 2025 年度 419 件、内訳は重篤化回避 19 件、未然回避 278 件、治療向上 122 件であった。テンプレートを改変した 2026 年 4 月の処方提案件数は 53 件、プレアボイド分類の入力は 28 件に留まった。\n\n### 考察\n\n報告様式に準じた分類・介入項目を選択出来る細分化したテンプレートを用いることで処方提案を行った薬剤師がプレアボイド報告を意識した薬学的介入を行う機会となった。またプレアボイドの内容解析を担当する薬剤師は既に分類毎に入力されているため、報告内容に注視でき業務効率化が図れた。テンプレート改変後の業務効率化やプレアボイド報告の意識付けを持続し、多岐にわたる病院薬剤師業務の質の高いプレアボイド収集が可能となるツールを今後も検討するとともに、薬剤師による医療安全、医薬品適正使用の貢献を示していきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 病棟業務のプレアボイド419件を分析し、その分類を電子カルテの記録テンプレート改変へ反映。\n- 改変後は処方提案53件に対し分類入力28件。介入を報告実績につなげる入力設計・定着の工夫に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-16-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-16", "session_name": "医療安全・調剤支援・プレアボイド評価", "title": "腎機能評価に基づく疑義照会の調査および医療経済的評価", "authors": "森山 美優（もりやま みゆ）、 山本 晃大（やまもと あきひろ）、 平池 美香子（ひらいけ みかこ）、 橋本 未雷（はしもと みらい）、 小山田 純治（おやまだ じゅんじ）", "first_author": "森山 美優（もりやま みゆ）", "affiliations": "NHO 長崎医療センター 薬剤部", "first_affiliation": "NHO 長崎医療センター 薬剤部", "printed_pages": "370", "pdf_pages": "126", "features": ["腎機能に基づく疑義照会310件を、処方変更内容と副作用回避による推定経済効果から評価。", "約1,507万円の効果は既報リスクと救済給付金額による推計値。実際の支出削減と区別し、算定の前提を確認したい。"], "issues": [], "sections": [{"heading": "目的", "content": "薬剤の過量投与事例の約 6 割が腎機能低下に起因すると報告されており、腎機能評価に基づく適切な用量調整は安全な薬物療法に不可欠である。薬剤師による疑義照会は安全管理のみならず、医療費抑制の点でも重要である。今回、長崎医療センター（以下、当院）における腎機能評価に基づく疑義照会の実態を調査し、医療経済的効果を評価した。"}, {"heading": "方法", "content": "2025 年 4 月から 2026 年 3 月に当院で実施された腎機能評価に基づく疑義照会事例を対象とし、診療録より後方視的に調査した。調査項目は、患者背景、腎機能、薬剤名、疑義照会後の結果とした。医療経済的評価は、令和 6 年度 PMDA 医薬品副作用被害救済給付実績の 1 件あたりの平均支給額（2,289,050 円）に既報の副作用発現リスクを乗じて算出した。"}, {"heading": "結果", "content": "対象は 310 件。疑義照会後の結果は、減量 143 件（46.1％）、中止 61 件（19.7％）、薬剤変更 22 件（7.1％）、増量 11 件（3.5％）、変更なし 73 件（23.5％）であった。副作用発現リスク別件数及び推定医療経済効果は、がん化学療法 5 件（2.1％）・約60 万円、ハイリスク薬（がん化学療法以外）22 件（9.3％）・約 197 万円、非ハイリスク薬 210 件（88.6％）・約 1250 万円、総額約 1507 万円であった。"}, {"heading": "考察", "content": "疑義照会は非ハイリスク薬で多く認められ、医療経済効果も大きかった。処方箋への腎機能表示により、調剤時に適切な用量調整を行うことは、経済的損失の回避に寄与すると考えられる。がん化学療法・ハイリスク薬の事例は少数だが、重篤な有害事象に直結する内容であり、腎機能評価に基づく安全管理の重要性が再確認された。薬剤師による腎機能評価に基づく介入は医療安全と医療経済の両面において有用であると考えられる。"}], "body_text": "### 目的\n\n薬剤の過量投与事例の約 6 割が腎機能低下に起因すると報告されており、腎機能評価に基づく適切な用量調整は安全な薬物療法に不可欠である。薬剤師による疑義照会は安全管理のみならず、医療費抑制の点でも重要である。今回、長崎医療センター（以下、当院）における腎機能評価に基づく疑義照会の実態を調査し、医療経済的効果を評価した。\n\n### 方法\n\n2025 年 4 月から 2026 年 3 月に当院で実施された腎機能評価に基づく疑義照会事例を対象とし、診療録より後方視的に調査した。調査項目は、患者背景、腎機能、薬剤名、疑義照会後の結果とした。医療経済的評価は、令和 6 年度 PMDA 医薬品副作用被害救済給付実績の 1 件あたりの平均支給額（2,289,050 円）に既報の副作用発現リスクを乗じて算出した。\n\n### 結果\n\n対象は 310 件。疑義照会後の結果は、減量 143 件（46.1％）、中止 61 件（19.7％）、薬剤変更 22 件（7.1％）、増量 11 件（3.5％）、変更なし 73 件（23.5％）であった。副作用発現リスク別件数及び推定医療経済効果は、がん化学療法 5 件（2.1％）・約60 万円、ハイリスク薬（がん化学療法以外）22 件（9.3％）・約 197 万円、非ハイリスク薬 210 件（88.6％）・約 1250 万円、総額約 1507 万円であった。\n\n### 考察\n\n疑義照会は非ハイリスク薬で多く認められ、医療経済効果も大きかった。処方箋への腎機能表示により、調剤時に適切な用量調整を行うことは、経済的損失の回避に寄与すると考えられる。がん化学療法・ハイリスク薬の事例は少数だが、重篤な有害事象に直結する内容であり、腎機能評価に基づく安全管理の重要性が再確認された。薬剤師による腎機能評価に基づく介入は医療安全と医療経済の両面において有用であると考えられる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-16-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [126]\nstatus: \"imported\"\n---\n\n# 腎機能評価に基づく疑義照会の調査および医療経済的評価\n\n- 演題番号: P1-16-5\n- 演題名: 腎機能評価に基づく疑義照会の調査および医療経済的評価\n- 所属施設: NHO 長崎医療センター 薬剤部\n- 筆頭演者: 森山 美優（もりやま みゆ）\n- 筆頭演者の所属: NHO 長崎医療センター 薬剤部\n- 演者名: 森山 美優（もりやま みゆ）、 山本 晃大（やまもと あきひろ）、 平池 美香子（ひらいけ みかこ）、 橋本 未雷（はしもと みらい）、 小山田 純治（おやまだ じゅんじ）\n- 原本: [PDF 126ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=126>)\n- 冊子ページ: 370\n\n## 抄録本文\n\n### 目的\n\n薬剤の過量投与事例の約 6 割が腎機能低下に起因すると報告されており、腎機能評価に基づく適切な用量調整は安全な薬物療法に不可欠である。薬剤師による疑義照会は安全管理のみならず、医療費抑制の点でも重要である。今回、長崎医療センター（以下、当院）における腎機能評価に基づく疑義照会の実態を調査し、医療経済的効果を評価した。\n\n### 方法\n\n2025 年 4 月から 2026 年 3 月に当院で実施された腎機能評価に基づく疑義照会事例を対象とし、診療録より後方視的に調査した。調査項目は、患者背景、腎機能、薬剤名、疑義照会後の結果とした。医療経済的評価は、令和 6 年度 PMDA 医薬品副作用被害救済給付実績の 1 件あたりの平均支給額（2,289,050 円）に既報の副作用発現リスクを乗じて算出した。\n\n### 結果\n\n対象は 310 件。疑義照会後の結果は、減量 143 件（46.1％）、中止 61 件（19.7％）、薬剤変更 22 件（7.1％）、増量 11 件（3.5％）、変更なし 73 件（23.5％）であった。副作用発現リスク別件数及び推定医療経済効果は、がん化学療法 5 件（2.1％）・約60 万円、ハイリスク薬（がん化学療法以外）22 件（9.3％）・約 197 万円、非ハイリスク薬 210 件（88.6％）・約 1250 万円、総額約 1507 万円であった。\n\n### 考察\n\n疑義照会は非ハイリスク薬で多く認められ、医療経済効果も大きかった。処方箋への腎機能表示により、調剤時に適切な用量調整を行うことは、経済的損失の回避に寄与すると考えられる。がん化学療法・ハイリスク薬の事例は少数だが、重篤な有害事象に直結する内容であり、腎機能評価に基づく安全管理の重要性が再確認された。薬剤師による腎機能評価に基づく介入は医療安全と医療経済の両面において有用であると考えられる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 腎機能に基づく疑義照会310件を、処方変更内容と副作用回避による推定経済効果から評価。\n- 約1,507万円の効果は既報リスクと救済給付金額による推計値。実際の支出削減と区別し、算定の前提を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-16-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-16", "session_name": "医療安全・調剤支援・プレアボイド評価", "title": "関節リウマチ患者における鎮痛薬使用と腎機能推移に関する後方視的検討", "authors": "櫛田 宏幸（くしだ ひろゆき）、 中野 一也（なかの かずや）、 本田 富得（ほんだ とみのり）", "first_author": "櫛田 宏幸（くしだ ひろゆき）", "affiliations": "NHO 大阪南医療センター 薬剤部", "first_affiliation": "NHO 大阪南医療センター 薬剤部", "printed_pages": "370", "pdf_pages": "126", "features": ["関節リウマチ1,517名の腎機能を最長36か月追跡し、鎮痛薬の使用群別に比較する研究。", "併用群の腎機能低下が大きい一方、疾患活動性や併用治療も異なる。薬剤の影響と背景因子の切り分けが論点となる。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "関節リウマチ（RA）は慢性炎症性疾患であり、腎機能障害を合併する症例も少なくない。RA 患者では NSAIDs やアセトアミノフェン（ACAP）が鎮痛目的で広く使用されるが、両剤併用が腎機能に及ぼす影響についての報告は限られている。本研究では RA患者における鎮痛薬使用状況別に腎機能の経時的変化を比較検討した。"}, {"heading": "方法", "content": "2022 年 1月以降に当院通院中の RA 患者のうち、eGFR 測定歴があり最長 36 か月追跡可能であった1517 名を対象とした。対象の患者の 0、12 カ月時の腎機能の測定は必須とし、DAS28 が測定されていない患者は除外した。鎮痛薬使用状況により ACAP 群、NSAIDs 群、非使用群、ACAP ＋ NSAIDs 併用群の 4 群に分類し、eGFR の経時変化および年間変化量（ΔeGFR/年）を比較した。統計解析は一元配置分散分析および群間比較を行った。"}, {"heading": "結果", "content": "ΔeGFR/年は ACAP 群+1.12、NSAIDs 群-0.93、非使用群-1.85、併用群-3.17 であり、群間差を認めた（ANOVA p=0.0002）。併用群では観察開始 3 か月時点で最も大きな eGFR低下を認め、その後も低値で推移した。併用群は疾患活動性、ステロイドおよび生物学的製剤使用率が高く、多剤併用の高リスク患者が多かった。"}, {"heading": "考察・結論", "content": "RA 患者における鎮痛薬使用群間では患者背景に大きな差があり、単純な群間比較による薬剤直接効果の評価には限界があると考えられた。特に ACAP と NSAIDs 併用症例では腎機能低下傾向を示しており、疾患活動性や併用薬を含めた多変量解析による交絡調整を行った上、総合的評価が重要である。臨床現場においては、鎮痛薬を併用する RA 高リスク患者に対し、定期的な腎機能モニタリングを行うことが有用と考えられた。"}], "body_text": "### 背景・目的\n\n関節リウマチ（RA）は慢性炎症性疾患であり、腎機能障害を合併する症例も少なくない。RA 患者では NSAIDs やアセトアミノフェン（ACAP）が鎮痛目的で広く使用されるが、両剤併用が腎機能に及ぼす影響についての報告は限られている。本研究では RA患者における鎮痛薬使用状況別に腎機能の経時的変化を比較検討した。\n\n### 方法\n\n2022 年 1月以降に当院通院中の RA 患者のうち、eGFR 測定歴があり最長 36 か月追跡可能であった1517 名を対象とした。対象の患者の 0、12 カ月時の腎機能の測定は必須とし、DAS28 が測定されていない患者は除外した。鎮痛薬使用状況により ACAP 群、NSAIDs 群、非使用群、ACAP ＋ NSAIDs 併用群の 4 群に分類し、eGFR の経時変化および年間変化量（ΔeGFR/年）を比較した。統計解析は一元配置分散分析および群間比較を行った。\n\n### 結果\n\nΔeGFR/年は ACAP 群+1.12、NSAIDs 群-0.93、非使用群-1.85、併用群-3.17 であり、群間差を認めた（ANOVA p=0.0002）。併用群では観察開始 3 か月時点で最も大きな eGFR低下を認め、その後も低値で推移した。併用群は疾患活動性、ステロイドおよび生物学的製剤使用率が高く、多剤併用の高リスク患者が多かった。\n\n### 考察・結論\n\nRA 患者における鎮痛薬使用群間では患者背景に大きな差があり、単純な群間比較による薬剤直接効果の評価には限界があると考えられた。特に ACAP と NSAIDs 併用症例では腎機能低下傾向を示しており、疾患活動性や併用薬を含めた多変量解析による交絡調整を行った上、総合的評価が重要である。臨床現場においては、鎮痛薬を併用する RA 高リスク患者に対し、定期的な腎機能モニタリングを行うことが有用と考えられた。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-16-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [126]\nstatus: \"imported\"\n---\n\n# 関節リウマチ患者における鎮痛薬使用と腎機能推移に関する後方視的検討\n\n- 演題番号: P1-16-6\n- 演題名: 関節リウマチ患者における鎮痛薬使用と腎機能推移に関する後方視的検討\n- 所属施設: NHO 大阪南医療センター 薬剤部\n- 筆頭演者: 櫛田 宏幸（くしだ ひろゆき）\n- 筆頭演者の所属: NHO 大阪南医療センター 薬剤部\n- 演者名: 櫛田 宏幸（くしだ ひろゆき）、 中野 一也（なかの かずや）、 本田 富得（ほんだ とみのり）\n- 原本: [PDF 126ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=126>)\n- 冊子ページ: 370\n\n## 抄録本文\n\n### 背景・目的\n\n関節リウマチ（RA）は慢性炎症性疾患であり、腎機能障害を合併する症例も少なくない。RA 患者では NSAIDs やアセトアミノフェン（ACAP）が鎮痛目的で広く使用されるが、両剤併用が腎機能に及ぼす影響についての報告は限られている。本研究では RA患者における鎮痛薬使用状況別に腎機能の経時的変化を比較検討した。\n\n### 方法\n\n2022 年 1月以降に当院通院中の RA 患者のうち、eGFR 測定歴があり最長 36 か月追跡可能であった1517 名を対象とした。対象の患者の 0、12 カ月時の腎機能の測定は必須とし、DAS28 が測定されていない患者は除外した。鎮痛薬使用状況により ACAP 群、NSAIDs 群、非使用群、ACAP ＋ NSAIDs 併用群の 4 群に分類し、eGFR の経時変化および年間変化量（ΔeGFR/年）を比較した。統計解析は一元配置分散分析および群間比較を行った。\n\n### 結果\n\nΔeGFR/年は ACAP 群+1.12、NSAIDs 群-0.93、非使用群-1.85、併用群-3.17 であり、群間差を認めた（ANOVA p=0.0002）。併用群では観察開始 3 か月時点で最も大きな eGFR低下を認め、その後も低値で推移した。併用群は疾患活動性、ステロイドおよび生物学的製剤使用率が高く、多剤併用の高リスク患者が多かった。\n\n### 考察・結論\n\nRA 患者における鎮痛薬使用群間では患者背景に大きな差があり、単純な群間比較による薬剤直接効果の評価には限界があると考えられた。特に ACAP と NSAIDs 併用症例では腎機能低下傾向を示しており、疾患活動性や併用薬を含めた多変量解析による交絡調整を行った上、総合的評価が重要である。臨床現場においては、鎮痛薬を併用する RA 高リスク患者に対し、定期的な腎機能モニタリングを行うことが有用と考えられた。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 関節リウマチ1,517名の腎機能を最長36か月追跡し、鎮痛薬の使用群別に比較する研究。\n- 併用群の腎機能低下が大きい一方、疾患活動性や併用治療も異なる。薬剤の影響と背景因子の切り分けが論点となる。\n\n", "rec_grade": "C", "rec_perspective": "腎機能コホート・交絡考察", "rec_reason": "RA患者1,517名を最長36か月追跡し、アセトアミノフェン＋NSAIDs併用群の年間eGFR低下（-3.17）と背景因子（疾患活動性・併用薬）の交絡を冷静に考察。"}, {"id": "P1-16-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-16", "session_name": "医療安全・調剤支援・プレアボイド評価", "title": "フルオロウラシルおよびシクロフォスファミドにおける分解剤「HD プロテクト」の有効調査", "authors": "櫻井 凌（さくらい りょう） 1、 早川 裕二（はやかわ ゆうじ） 1、 林 怜花（はやし れいか） 2、 田淵 勝則（たぶち まさのり） 1、 高橋 昌明（たかはし まさあき） 2、 平野 隆司（ひらの りゅうじ） 1", "first_author": "櫻井 凌（さくらい りょう） 1", "affiliations": "1 NHO 名古屋医療センター 薬剤部、2 金城学院大学 薬学部 薬学科", "first_affiliation": "NHO 名古屋医療センター 薬剤部", "printed_pages": "370", "pdf_pages": "126", "features": ["抗がん薬2剤の環境残留量を、従来清掃と分解剤使用後で比較し、場所による効果の違いを示す。", "作業面では検出限界未満となる一方、床・マウスでは明確な低減がない。薬剤だけでなく清掃対象の選定にも注目したい。"], "issues": [], "sections": [{"heading": "目的", "content": "当施設の抗がん剤調製室では自施設で作成している分解剤を使用しているが、作成の煩雑さや有効性担保が課題である。本調査では、既製品の抗がん剤分解溶液 HD プロテクトの採用を検討するにあたり、除染効果を実環境下で評価し、従来の清掃法（以下、従来法）と比較することを目的とした。"}, {"heading": "方法", "content": "生物学的安全キャビネット（BSC）内 2 箇所（作業面、電子天秤）と BSC 外 3 箇所（床面、マウス、電話受話器）を調査箇所とし、対象薬剤をシクロホスファミド（CPA）とフルオロウラシル（5-FU）とした。従来法（BSC 内：0.3mol/L 水酸化ナトリウムおよび注射用水、BSC 外：界面活性剤クリーナー）の清掃後と、HD プロテクト清掃後とで両薬剤の残留量を比較した。"}, {"heading": "結果", "content": "従来法では全箇所で両薬剤が検出され、BSC 内作業面で CPA 1.18ng、5-FU 173ng、電子天秤で CPA 1.40ng、5-FU 14,100ng であった。一方、HD プロテクト清掃後、BSC 内作業面は両薬剤とも検出限界未満（ND）となり、電子天秤の 5-FU も 849ng へ激減した。しかし、BSC 下床面やマウスでは明確な低減は認められなかった。"}, {"heading": "考察", "content": "従来法で薬剤残留が確認され、水酸化ナトリウムでは両薬剤を十分に不活化できない可能性が示唆された。HD プロテクト後でも周辺機器や床面で明確な提言が認められなかったのは、機器の凹凸や多孔質構造に薬液が浸透し、物理的なふき取りが妨げられたという構造的要因と考えられる。"}, {"heading": "結論", "content": "HD プロテクトの導入は、BSC 内の確実な除染と業務の標準化において非常に有用である。しかし、除染効果が限定的である箇所もみたれたため、個人防護具（PPE）の着用など、基本となる曝露対策の継続は必要不可欠である。"}], "body_text": "### 目的\n\n当施設の抗がん剤調製室では自施設で作成している分解剤を使用しているが、作成の煩雑さや有効性担保が課題である。本調査では、既製品の抗がん剤分解溶液 HD プロテクトの採用を検討するにあたり、除染効果を実環境下で評価し、従来の清掃法（以下、従来法）と比較することを目的とした。\n\n### 方法\n\n生物学的安全キャビネット（BSC）内 2 箇所（作業面、電子天秤）と BSC 外 3 箇所（床面、マウス、電話受話器）を調査箇所とし、対象薬剤をシクロホスファミド（CPA）とフルオロウラシル（5-FU）とした。従来法（BSC 内：0.3mol/L 水酸化ナトリウムおよび注射用水、BSC 外：界面活性剤クリーナー）の清掃後と、HD プロテクト清掃後とで両薬剤の残留量を比較した。\n\n### 結果\n\n従来法では全箇所で両薬剤が検出され、BSC 内作業面で CPA 1.18ng、5-FU 173ng、電子天秤で CPA 1.40ng、5-FU 14,100ng であった。一方、HD プロテクト清掃後、BSC 内作業面は両薬剤とも検出限界未満（ND）となり、電子天秤の 5-FU も 849ng へ激減した。しかし、BSC 下床面やマウスでは明確な低減は認められなかった。\n\n### 考察\n\n従来法で薬剤残留が確認され、水酸化ナトリウムでは両薬剤を十分に不活化できない可能性が示唆された。HD プロテクト後でも周辺機器や床面で明確な提言が認められなかったのは、機器の凹凸や多孔質構造に薬液が浸透し、物理的なふき取りが妨げられたという構造的要因と考えられる。\n\n### 結論\n\nHD プロテクトの導入は、BSC 内の確実な除染と業務の標準化において非常に有用である。しかし、除染効果が限定的である箇所もみたれたため、個人防護具（PPE）の着用など、基本となる曝露対策の継続は必要不可欠である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-16-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [126]\nstatus: \"imported\"\n---\n\n# フルオロウラシルおよびシクロフォスファミドにおける分解剤「HD プロテクト」の有効調査\n\n- 演題番号: P1-16-7\n- 演題名: フルオロウラシルおよびシクロフォスファミドにおける分解剤「HD プロテクト」の有効調査\n- 所属施設: 1 NHO 名古屋医療センター 薬剤部、2 金城学院大学 薬学部 薬学科\n- 筆頭演者: 櫻井 凌（さくらい りょう） 1\n- 筆頭演者の所属: NHO 名古屋医療センター 薬剤部\n- 演者名: 櫻井 凌（さくらい りょう） 1、 早川 裕二（はやかわ ゆうじ） 1、 林 怜花（はやし れいか） 2、 田淵 勝則（たぶち まさのり） 1、 高橋 昌明（たかはし まさあき） 2、 平野 隆司（ひらの りゅうじ） 1\n- 原本: [PDF 126ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=126>)\n- 冊子ページ: 370\n\n## 抄録本文\n\n### 目的\n\n当施設の抗がん剤調製室では自施設で作成している分解剤を使用しているが、作成の煩雑さや有効性担保が課題である。本調査では、既製品の抗がん剤分解溶液 HD プロテクトの採用を検討するにあたり、除染効果を実環境下で評価し、従来の清掃法（以下、従来法）と比較することを目的とした。\n\n### 方法\n\n生物学的安全キャビネット（BSC）内 2 箇所（作業面、電子天秤）と BSC 外 3 箇所（床面、マウス、電話受話器）を調査箇所とし、対象薬剤をシクロホスファミド（CPA）とフルオロウラシル（5-FU）とした。従来法（BSC 内：0.3mol/L 水酸化ナトリウムおよび注射用水、BSC 外：界面活性剤クリーナー）の清掃後と、HD プロテクト清掃後とで両薬剤の残留量を比較した。\n\n### 結果\n\n従来法では全箇所で両薬剤が検出され、BSC 内作業面で CPA 1.18ng、5-FU 173ng、電子天秤で CPA 1.40ng、5-FU 14,100ng であった。一方、HD プロテクト清掃後、BSC 内作業面は両薬剤とも検出限界未満（ND）となり、電子天秤の 5-FU も 849ng へ激減した。しかし、BSC 下床面やマウスでは明確な低減は認められなかった。\n\n### 考察\n\n従来法で薬剤残留が確認され、水酸化ナトリウムでは両薬剤を十分に不活化できない可能性が示唆された。HD プロテクト後でも周辺機器や床面で明確な提言が認められなかったのは、機器の凹凸や多孔質構造に薬液が浸透し、物理的なふき取りが妨げられたという構造的要因と考えられる。\n\n### 結論\n\nHD プロテクトの導入は、BSC 内の確実な除染と業務の標準化において非常に有用である。しかし、除染効果が限定的である箇所もみたれたため、個人防護具（PPE）の着用など、基本となる曝露対策の継続は必要不可欠である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 抗がん薬2剤の環境残留量を、従来清掃と分解剤使用後で比較し、場所による効果の違いを示す。\n- 作業面では検出限界未満となる一方、床・マウスでは明確な低減がない。薬剤だけでなく清掃対象の選定にも注目したい。\n\n", "rec_grade": "C", "rec_perspective": "抗がん薬曝露対策", "rec_reason": "従来清掃（NaOH等）で残留していたBSC内作業面の5-FU・CPAが、HDプロテクト清掃で検出限界未満（ND）となった一方、床面・マウス等の構造的課題を実証。"}, {"id": "P1-16-8", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-16", "session_name": "医療安全・調剤支援・プレアボイド評価", "title": "プレアボイド優良事例審査における 6 つの質的評価基準と複数査読体制の妥当性検証", "authors": "小井土 啓一（こいど けいいち） 1,5、 山田 昌彦（やまだ まさひこ） 2,5、 石垣 千絵（いしがき ちえ） 3,5、 阿部 直樹（あべ なおき） 4,5", "first_author": "小井土 啓一（こいど けいいち） 1,5", "affiliations": "1 NHO 横浜医療センター 薬剤部、2 NHO 宇都宮病院 薬剤部、3 NHO 東埼玉病院 薬剤部、 4 NHO 信州上田医療センター 薬剤部、5 関信地区 国立病院薬剤師会", "first_affiliation": "NHO 横浜医療センター 薬剤部 / 関信地区 国立病院薬剤師会", "printed_pages": "371", "pdf_pages": "127", "features": ["プレアボイド70例を11名が独立に査読し、6つの質的基準と複数査読の運用を検証。", "評価者間のばらつきと査読者の負担感を併せて評価。「特筆すべき加点」の付けにくさと評価基準の改善が聴講ポイント。"], "issues": [], "sections": [{"heading": "背景", "content": "プレアボイド報告はこれまで報告件数の量的側面が中心であり、その内容の「質」を系統的に評価する方法が示されていない。関信地区国立病院薬剤師会では 6 つの質的評価指標（1．アセスメント、2．介入、3．根拠、4．結果、5．評価（振り返り）、6．特筆すべき加点）と施設推薦・複数査読方式を新たに導入した。"}, {"heading": "目的", "content": "本制度の妥当性、特に評価者間一致度を検証する。"}, {"heading": "方法", "content": "推薦事例 70 例を対象に、薬剤業務委員 11 名（薬剤師経験 8-32 年）が査読を実施し、各事例につき中央値 3 名（最大 9 名）で評価した。他評価者の採点情報は非開示として独立採点とし（評価者間ブラインド）、施設名・報告者名は開示した。査読終了後、評価委員11 名へ 4 段階リッカート尺度のアンケートを実施した。"}, {"heading": "結果", "content": "合計スコア（15 点満点）の評価者間 SD 中央値は 2.05（四分位範囲 1.53-2.88、最大 5.57）で、SD≦2.0 の事例が 48.5％、SD≦3.0 が 76.5％で、経験年数によらず良好な評価者間一致を示した。アンケートでは 6 指標による評価の「迷い」解消への寄与：3.2（平均）、複数査読による心理的負担軽減：2.9、推薦事例記述の質の高さ：2.9、実務負担軽減：3.4（経験者）で肯定的回答を得た。施設名開示によるバイアス懸念は 2.0 と概ね低かった。点数付けやすさは 2．介入・4．結果で 10/11 名が「付けやすい」と回答した一方、6．特筆すべき加点は 9/11 名が「付けにくい」と回答した。"}, {"heading": "結論", "content": "経験差が大きい評価者群でも評価者間 SD が小さく抑えられたことは、6 指標・複数査読・評価者間ブラインドという評価モデルが評価者依存性を抑制する仕組みとして機能したと考えられる。6．特筆すべき加点の基準明確化が今後の課題である。"}], "body_text": "### 背景\n\nプレアボイド報告はこれまで報告件数の量的側面が中心であり、その内容の「質」を系統的に評価する方法が示されていない。関信地区国立病院薬剤師会では 6 つの質的評価指標（1．アセスメント、2．介入、3．根拠、4．結果、5．評価（振り返り）、6．特筆すべき加点）と施設推薦・複数査読方式を新たに導入した。\n\n### 目的\n\n本制度の妥当性、特に評価者間一致度を検証する。\n\n### 方法\n\n推薦事例 70 例を対象に、薬剤業務委員 11 名（薬剤師経験 8-32 年）が査読を実施し、各事例につき中央値 3 名（最大 9 名）で評価した。他評価者の採点情報は非開示として独立採点とし（評価者間ブラインド）、施設名・報告者名は開示した。査読終了後、評価委員11 名へ 4 段階リッカート尺度のアンケートを実施した。\n\n### 結果\n\n合計スコア（15 点満点）の評価者間 SD 中央値は 2.05（四分位範囲 1.53-2.88、最大 5.57）で、SD≦2.0 の事例が 48.5％、SD≦3.0 が 76.5％で、経験年数によらず良好な評価者間一致を示した。アンケートでは 6 指標による評価の「迷い」解消への寄与：3.2（平均）、複数査読による心理的負担軽減：2.9、推薦事例記述の質の高さ：2.9、実務負担軽減：3.4（経験者）で肯定的回答を得た。施設名開示によるバイアス懸念は 2.0 と概ね低かった。点数付けやすさは 2．介入・4．結果で 10/11 名が「付けやすい」と回答した一方、6．特筆すべき加点は 9/11 名が「付けにくい」と回答した。\n\n### 結論\n\n経験差が大きい評価者群でも評価者間 SD が小さく抑えられたことは、6 指標・複数査読・評価者間ブラインドという評価モデルが評価者依存性を抑制する仕組みとして機能したと考えられる。6．特筆すべき加点の基準明確化が今後の課題である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-16-8\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [127]\nstatus: \"imported\"\n---\n\n# プレアボイド優良事例審査における 6 つの質的評価基準と複数査読体制の妥当性検証\n\n- 演題番号: P1-16-8\n- 演題名: プレアボイド優良事例審査における 6 つの質的評価基準と複数査読体制の妥当性検証\n- 所属施設: 1 NHO 横浜医療センター 薬剤部、2 NHO 宇都宮病院 薬剤部、3 NHO 東埼玉病院 薬剤部、 4 NHO 信州上田医療センター 薬剤部、5 関信地区 国立病院薬剤師会\n- 筆頭演者: 小井土 啓一（こいど けいいち） 1,5\n- 筆頭演者の所属: NHO 横浜医療センター 薬剤部 / 関信地区 国立病院薬剤師会\n- 演者名: 小井土 啓一（こいど けいいち） 1,5、 山田 昌彦（やまだ まさひこ） 2,5、 石垣 千絵（いしがき ちえ） 3,5、 阿部 直樹（あべ なおき） 4,5\n- 原本: [PDF 127ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=127>)\n- 冊子ページ: 371\n\n## 抄録本文\n\n### 背景\n\nプレアボイド報告はこれまで報告件数の量的側面が中心であり、その内容の「質」を系統的に評価する方法が示されていない。関信地区国立病院薬剤師会では 6 つの質的評価指標（1．アセスメント、2．介入、3．根拠、4．結果、5．評価（振り返り）、6．特筆すべき加点）と施設推薦・複数査読方式を新たに導入した。\n\n### 目的\n\n本制度の妥当性、特に評価者間一致度を検証する。\n\n### 方法\n\n推薦事例 70 例を対象に、薬剤業務委員 11 名（薬剤師経験 8-32 年）が査読を実施し、各事例につき中央値 3 名（最大 9 名）で評価した。他評価者の採点情報は非開示として独立採点とし（評価者間ブラインド）、施設名・報告者名は開示した。査読終了後、評価委員11 名へ 4 段階リッカート尺度のアンケートを実施した。\n\n### 結果\n\n合計スコア（15 点満点）の評価者間 SD 中央値は 2.05（四分位範囲 1.53-2.88、最大 5.57）で、SD≦2.0 の事例が 48.5％、SD≦3.0 が 76.5％で、経験年数によらず良好な評価者間一致を示した。アンケートでは 6 指標による評価の「迷い」解消への寄与：3.2（平均）、複数査読による心理的負担軽減：2.9、推薦事例記述の質の高さ：2.9、実務負担軽減：3.4（経験者）で肯定的回答を得た。施設名開示によるバイアス懸念は 2.0 と概ね低かった。点数付けやすさは 2．介入・4．結果で 10/11 名が「付けやすい」と回答した一方、6．特筆すべき加点は 9/11 名が「付けにくい」と回答した。\n\n### 結論\n\n経験差が大きい評価者群でも評価者間 SD が小さく抑えられたことは、6 指標・複数査読・評価者間ブラインドという評価モデルが評価者依存性を抑制する仕組みとして機能したと考えられる。6．特筆すべき加点の基準明確化が今後の課題である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- プレアボイド70例を11名が独立に査読し、6つの質的基準と複数査読の運用を検証。\n- 評価者間のばらつきと査読者の負担感を併せて評価。「特筆すべき加点」の付けにくさと評価基準の改善が聴講ポイント。\n\n", "rec_grade": "A", "rec_perspective": "プレアボイド質的評価・査読検証", "rec_reason": "従来の件数偏重から脱却し、6つの質的評価指標×複数査読（ブラインド）を導入。70事例の評価者間SD中央値2.05と高い一致度を示し、薬学的介入の「質」を測る新基準として全国展開が期待される。"}, {"id": "P1-16-9", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-16", "session_name": "医療安全・調剤支援・プレアボイド評価", "title": "プレアボイド報告の質的評価制度の導入と受容性―関信地区国立病院薬剤師会における実務者・管理者満足度調査―", "authors": "山田 昌彦（やまだ まさひこ） 1,5、 小井土 啓一（こいど けいいち） 2,5、 石垣 千絵（いしがき ちえ） 3,5、 阿部 直樹（あべ なおき） 4,5", "first_author": "山田 昌彦（やまだ まさひこ） 1,5", "affiliations": "1 NHO 宇都宮病院 薬剤部、2 NHO 横浜医療センター 薬剤部、3 NHO 東埼玉病院 薬剤部、 4 NHO 信州上田医療センター 薬剤部、5 関信地区 国立病院薬剤師会", "first_affiliation": "NHO 宇都宮病院 薬剤部 / 関信地区 国立病院薬剤師会", "printed_pages": "371", "pdf_pages": "127", "features": ["プレアボイドの質的評価制度を、実務者77名と管理者37名の両側から受容性調査で検討。", "評価への納得感が高い一方、多忙が報告の障壁となる。制度の支持と実際の報告行動をつなぐ仕組みに注目したい。"], "issues": [], "sections": [{"heading": "背景", "content": "プレアボイドは薬剤師の臨床貢献を示す指標だが、件数中心の評価では報告の少ない施設のモチベーション維持が困難であった。関信地区国立病院薬剤師会は 2025 年度より、6 つの質的評価基準と施設推薦・複数査読方式による表彰制度を新設した。"}, {"heading": "目的", "content": "新制度導入が会員の意識・行動に与えた影響を検証する。"}, {"heading": "方法", "content": "2026 年 5 月、会員施設の実務者および薬剤部科長/副薬剤部科長（管理者）に無記名 Google フォームで横断調査を実施。4 段階リッカート尺度（中間値なし）で 6 基準の妥当性・査読の納得感・モチベーション等を評価した。"}, {"heading": "結果", "content": "実務者 77 名、管理者 37 名から回答を得た。実務者の肯定的回答（3+4）は、専門性評価・報告書指針・複数査読の納得感が各 90.9％、表彰のモチベーション寄与 71.4％、施設代表推薦の自信 74.0％、思考プロセス言語化の重視 87.0％であった。報告未実施の主因は「業務多忙」（17/29 名）であった。管理者 37 名中 26 名が自施設の報告実績ありとし、23 名が自施設から推薦ありと回答した。質的基準は部下のアセスメント能力向上88.5％、経営層への可視化 73.1％、推薦数上限「妥当」が 81％であった。"}, {"heading": "考察", "content": "6 つの質的評価基準と複数査読体制は実務者・管理者の双方から広く受容された。一方、個人モチベーションへの効果は中程度にとどまり、事例共有・副賞等の補完が課題である。管理者からは部下教育・対外可視化に有用と評価され、持続可能な評価モデルとして継続する妥当性が示された。ただし、報告活動は特定施設に偏在し、実務者の推定回答率も約13％にとどまる。結果は積極層の意見が中心の可能性があり、業務余力確保と未参加層への認知拡大が今後の課題である。"}], "body_text": "### 背景\n\nプレアボイドは薬剤師の臨床貢献を示す指標だが、件数中心の評価では報告の少ない施設のモチベーション維持が困難であった。関信地区国立病院薬剤師会は 2025 年度より、6 つの質的評価基準と施設推薦・複数査読方式による表彰制度を新設した。\n\n### 目的\n\n新制度導入が会員の意識・行動に与えた影響を検証する。\n\n### 方法\n\n2026 年 5 月、会員施設の実務者および薬剤部科長/副薬剤部科長（管理者）に無記名 Google フォームで横断調査を実施。4 段階リッカート尺度（中間値なし）で 6 基準の妥当性・査読の納得感・モチベーション等を評価した。\n\n### 結果\n\n実務者 77 名、管理者 37 名から回答を得た。実務者の肯定的回答（3+4）は、専門性評価・報告書指針・複数査読の納得感が各 90.9％、表彰のモチベーション寄与 71.4％、施設代表推薦の自信 74.0％、思考プロセス言語化の重視 87.0％であった。報告未実施の主因は「業務多忙」（17/29 名）であった。管理者 37 名中 26 名が自施設の報告実績ありとし、23 名が自施設から推薦ありと回答した。質的基準は部下のアセスメント能力向上88.5％、経営層への可視化 73.1％、推薦数上限「妥当」が 81％であった。\n\n### 考察\n\n6 つの質的評価基準と複数査読体制は実務者・管理者の双方から広く受容された。一方、個人モチベーションへの効果は中程度にとどまり、事例共有・副賞等の補完が課題である。管理者からは部下教育・対外可視化に有用と評価され、持続可能な評価モデルとして継続する妥当性が示された。ただし、報告活動は特定施設に偏在し、実務者の推定回答率も約13％にとどまる。結果は積極層の意見が中心の可能性があり、業務余力確保と未参加層への認知拡大が今後の課題である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-16-9\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [127]\nstatus: \"imported\"\n---\n\n# プレアボイド報告の質的評価制度の導入と受容性―関信地区国立病院薬剤師会における実務者・管理者満足度調査―\n\n- 演題番号: P1-16-9\n- 演題名: プレアボイド報告の質的評価制度の導入と受容性―関信地区国立病院薬剤師会における実務者・管理者満足度調査―\n- 所属施設: 1 NHO 宇都宮病院 薬剤部、2 NHO 横浜医療センター 薬剤部、3 NHO 東埼玉病院 薬剤部、 4 NHO 信州上田医療センター 薬剤部、5 関信地区 国立病院薬剤師会\n- 筆頭演者: 山田 昌彦（やまだ まさひこ） 1,5\n- 筆頭演者の所属: NHO 宇都宮病院 薬剤部 / 関信地区 国立病院薬剤師会\n- 演者名: 山田 昌彦（やまだ まさひこ） 1,5、 小井土 啓一（こいど けいいち） 2,5、 石垣 千絵（いしがき ちえ） 3,5、 阿部 直樹（あべ なおき） 4,5\n- 原本: [PDF 127ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=127>)\n- 冊子ページ: 371\n\n## 抄録本文\n\n### 背景\n\nプレアボイドは薬剤師の臨床貢献を示す指標だが、件数中心の評価では報告の少ない施設のモチベーション維持が困難であった。関信地区国立病院薬剤師会は 2025 年度より、6 つの質的評価基準と施設推薦・複数査読方式による表彰制度を新設した。\n\n### 目的\n\n新制度導入が会員の意識・行動に与えた影響を検証する。\n\n### 方法\n\n2026 年 5 月、会員施設の実務者および薬剤部科長/副薬剤部科長（管理者）に無記名 Google フォームで横断調査を実施。4 段階リッカート尺度（中間値なし）で 6 基準の妥当性・査読の納得感・モチベーション等を評価した。\n\n### 結果\n\n実務者 77 名、管理者 37 名から回答を得た。実務者の肯定的回答（3+4）は、専門性評価・報告書指針・複数査読の納得感が各 90.9％、表彰のモチベーション寄与 71.4％、施設代表推薦の自信 74.0％、思考プロセス言語化の重視 87.0％であった。報告未実施の主因は「業務多忙」（17/29 名）であった。管理者 37 名中 26 名が自施設の報告実績ありとし、23 名が自施設から推薦ありと回答した。質的基準は部下のアセスメント能力向上88.5％、経営層への可視化 73.1％、推薦数上限「妥当」が 81％であった。\n\n### 考察\n\n6 つの質的評価基準と複数査読体制は実務者・管理者の双方から広く受容された。一方、個人モチベーションへの効果は中程度にとどまり、事例共有・副賞等の補完が課題である。管理者からは部下教育・対外可視化に有用と評価され、持続可能な評価モデルとして継続する妥当性が示された。ただし、報告活動は特定施設に偏在し、実務者の推定回答率も約13％にとどまる。結果は積極層の意見が中心の可能性があり、業務余力確保と未参加層への認知拡大が今後の課題である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- プレアボイドの質的評価制度を、実務者77名と管理者37名の両側から受容性調査で検討。\n- 評価への納得感が高い一方、多忙が報告の障壁となる。制度の支持と実際の報告行動をつなぐ仕組みに注目したい。\n\n", "rec_grade": "A", "rec_perspective": "制度受容性・組織マネジメント", "rec_reason": "P1-16-8と対をなす調査。実務者77名・管理者37名の調査で納得感90.9%・部下のアセスメント能力向上88.5%を達成しつつ、未報告要因（業務多忙）も定量化。ペアでの聴講が強く推奨される。"}, {"id": "P1-17-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-17", "session_name": "災害備蓄医薬品管理", "title": "地域災害拠点病院における備蓄医薬品管理のシステム化〜MEMS を用いた期限管理と運用改善〜", "authors": "唐川 雅生（からかわ まさお） 1、 國定 誠也（くにさだ せいや） 1、 大野 開成（おおの かいせい） 2、 塩田 直史（しおた なおふみ） 3、 大倉 裕祐（おおくら ゆうすけ） 1", "first_author": "唐川 雅生（からかわ まさお） 1", "affiliations": "1 NHO 岡山医療センター 薬剤部、2 NHO 岡山医療センター 臨床工学室、 3 NHO 岡山医療センター 整形外科", "first_affiliation": "NHO 岡山医療センター 薬剤部", "printed_pages": "372", "pdf_pages": "128", "features": ["既存の資器材管理システムに医薬品管理を統合し、Excelの警告表示・一括処理・変更履歴を実装。", "災害備蓄の期限管理と履歴追跡を一体化する実務報告。定量的な時間短縮だけでなく更新・点検手順の再現性を確認したい。"], "issues": [], "sections": [{"heading": "目的", "content": "地域災害拠点病院である当院には 250 人分の医薬品確保が求められている。管理は DMAT隊員の薬剤師が担ってきたが、近年の後発品切り替えや供給制限、病棟業務の拡大により、管理時間の確保が困難であった。また、人事異動時の引継ぎ不足によるリストの変遷や、期限切れの見落としも課題であった。そこで、これまで資器材管理で運用してきた当院オリジナルの DMAT 資器材管理システム MEMS（Medical Equipment Management System）を改良し、災害時医薬品管理の効率化を試みた。"}, {"heading": "方法", "content": "従来の資器材管理システムに医薬品管理機能を組み込んだ。主な改良点は、1．Excel 上の薬品セット毎のハイライト表示、2．期限切れ・期限切迫物品のアラート表示、3．HOME画面「ボタン」によるマクロ処理の実装、4．自動入力される変更履歴シートの作成、の 4点である。"}, {"heading": "結果", "content": "MEMS への機能統合により、資器材と医薬品の一元管理体制が確立した。視覚的アラートと一括処理は、点検に要する作業負担が軽減した。また、リスト更新時には変更履歴シートへ内容が自動で記録され、過去の修正経緯が容易に確認可能となった。"}, {"heading": "考察", "content": "視覚的アラートと一括処理は、平時に動かない備蓄薬の期限切れリスク抑止に有効と考えられた。また、変更履歴の自動化は、近年の供給制限に伴う流動的なリスト変更の経緯を可視化し、異動時の引継ぎ不足による属人化を予防することが示唆される。従って、限られた時間内で拠点病院としての備蓄の質を継続管理する仕組みとして有用であると考えた。"}, {"heading": "結語", "content": "既存システムを医薬品管理へ応用したことで、業務の省力化と、災害拠点病院としての備蓄薬の確実な品質担保を両立できた。"}], "body_text": "### 目的\n\n地域災害拠点病院である当院には 250 人分の医薬品確保が求められている。管理は DMAT隊員の薬剤師が担ってきたが、近年の後発品切り替えや供給制限、病棟業務の拡大により、管理時間の確保が困難であった。また、人事異動時の引継ぎ不足によるリストの変遷や、期限切れの見落としも課題であった。そこで、これまで資器材管理で運用してきた当院オリジナルの DMAT 資器材管理システム MEMS（Medical Equipment Management System）を改良し、災害時医薬品管理の効率化を試みた。\n\n### 方法\n\n従来の資器材管理システムに医薬品管理機能を組み込んだ。主な改良点は、1．Excel 上の薬品セット毎のハイライト表示、2．期限切れ・期限切迫物品のアラート表示、3．HOME画面「ボタン」によるマクロ処理の実装、4．自動入力される変更履歴シートの作成、の 4点である。\n\n### 結果\n\nMEMS への機能統合により、資器材と医薬品の一元管理体制が確立した。視覚的アラートと一括処理は、点検に要する作業負担が軽減した。また、リスト更新時には変更履歴シートへ内容が自動で記録され、過去の修正経緯が容易に確認可能となった。\n\n### 考察\n\n視覚的アラートと一括処理は、平時に動かない備蓄薬の期限切れリスク抑止に有効と考えられた。また、変更履歴の自動化は、近年の供給制限に伴う流動的なリスト変更の経緯を可視化し、異動時の引継ぎ不足による属人化を予防することが示唆される。従って、限られた時間内で拠点病院としての備蓄の質を継続管理する仕組みとして有用であると考えた。\n\n### 結語\n\n既存システムを医薬品管理へ応用したことで、業務の省力化と、災害拠点病院としての備蓄薬の確実な品質担保を両立できた。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-17-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [128]\nstatus: \"imported\"\n---\n\n# 地域災害拠点病院における備蓄医薬品管理のシステム化〜MEMS を用いた期限管理と運用改善〜\n\n- 演題番号: P1-17-3\n- 演題名: 地域災害拠点病院における備蓄医薬品管理のシステム化〜MEMS を用いた期限管理と運用改善〜\n- 所属施設: 1 NHO 岡山医療センター 薬剤部、2 NHO 岡山医療センター 臨床工学室、 3 NHO 岡山医療センター 整形外科\n- 筆頭演者: 唐川 雅生（からかわ まさお） 1\n- 筆頭演者の所属: NHO 岡山医療センター 薬剤部\n- 演者名: 唐川 雅生（からかわ まさお） 1、 國定 誠也（くにさだ せいや） 1、 大野 開成（おおの かいせい） 2、 塩田 直史（しおた なおふみ） 3、 大倉 裕祐（おおくら ゆうすけ） 1\n- 原本: [PDF 128ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=128>)\n- 冊子ページ: 372\n\n## 抄録本文\n\n### 目的\n\n地域災害拠点病院である当院には 250 人分の医薬品確保が求められている。管理は DMAT隊員の薬剤師が担ってきたが、近年の後発品切り替えや供給制限、病棟業務の拡大により、管理時間の確保が困難であった。また、人事異動時の引継ぎ不足によるリストの変遷や、期限切れの見落としも課題であった。そこで、これまで資器材管理で運用してきた当院オリジナルの DMAT 資器材管理システム MEMS（Medical Equipment Management System）を改良し、災害時医薬品管理の効率化を試みた。\n\n### 方法\n\n従来の資器材管理システムに医薬品管理機能を組み込んだ。主な改良点は、1．Excel 上の薬品セット毎のハイライト表示、2．期限切れ・期限切迫物品のアラート表示、3．HOME画面「ボタン」によるマクロ処理の実装、4．自動入力される変更履歴シートの作成、の 4点である。\n\n### 結果\n\nMEMS への機能統合により、資器材と医薬品の一元管理体制が確立した。視覚的アラートと一括処理は、点検に要する作業負担が軽減した。また、リスト更新時には変更履歴シートへ内容が自動で記録され、過去の修正経緯が容易に確認可能となった。\n\n### 考察\n\n視覚的アラートと一括処理は、平時に動かない備蓄薬の期限切れリスク抑止に有効と考えられた。また、変更履歴の自動化は、近年の供給制限に伴う流動的なリスト変更の経緯を可視化し、異動時の引継ぎ不足による属人化を予防することが示唆される。従って、限られた時間内で拠点病院としての備蓄の質を継続管理する仕組みとして有用であると考えた。\n\n### 結語\n\n既存システムを医薬品管理へ応用したことで、業務の省力化と、災害拠点病院としての備蓄薬の確実な品質担保を両立できた。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 既存の資器材管理システムに医薬品管理を統合し、Excelの警告表示・一括処理・変更履歴を実装。\n- 災害備蓄の期限管理と履歴追跡を一体化する実務報告。定量的な時間短縮だけでなく更新・点検手順の再現性を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-26-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-26", "session_name": "緩和ケア外来同席", "title": "薬剤師の緩和ケア外来診察同席に関する活動報告と介入の一例", "authors": "中山 やちよ（なかやま やちよ） 1、 藤原 未稀（ふじわら みき） 1、 藤田 憲一（ふじた けんいち） 1、 中村 孝佑（なかむら こうすけ） 5、 中野 良（なかの りょう） 1、 濱岡 照隆（はまおか てるたか） 1、 城野 裕朗（じょうの ひろあき） 2、 前田 智樹（まえだ ともき） 3、 高橋 健司（たかはし けんじ） 4", "first_author": "中山 やちよ（なかやま やちよ） 1", "affiliations": "1 NHO 福山医療センター 薬剤部、2 NHO 福山医療センター 地域連携室、 3 NHO 福山医療センター 看護部、4 NHO 福山医療センター 呼吸器外科、 5 NHO 岡山医療センター 薬剤部", "first_affiliation": "NHO 福山医療センター 薬剤部", "printed_pages": "392", "pdf_pages": "148", "features": ["緩和ケア外来の診察同席を9名・98診察で報告し、具体的なオピオイド減量例を示す。", "腎機能や痛み以外の症状も含む処方提案が特徴。医師との役割分担と、減量時の評価・フォローの方法に学べる。"], "issues": [], "sections": [{"heading": "はじめに", "content": "外来緩和ケアでは疼痛や有害事象への迅速な対応が必要であり、患者個々に応じた多様なアセスメントをするためには多職種連携が重要である。当院では、緩和ケア医の要望にて 2018 年頃から薬剤師が医師の診察に同席し処方提案等の診療補助を行っている。今回、2024 年 4 月〜2026 年 4 月の 2 年間に薬剤師が診察同席した件数及び内容を集計し、介入事例の中で薬剤師の関わりが大きかった症例を紹介する。"}, {"heading": "活動報告", "content": "介入患者数は9 名、診察回数 98 回でそのうち薬剤師の同席率 98％だった。診察同席時の薬剤師の処方提案内容については、腎機能に応じた用量設定、痛み以外の症状緩和のための薬剤追加提案、患者指導などがあった。"}, {"heading": "症例", "content": "70 歳代女性で、膀胱痛の訴えで泌尿器科からコンサルトがあった。初発時は子宮頸癌 stage4A の診断だったが、化学放射線療法後に原発・転移巣いずれも縮小維持し 6 年経過していた。化学放射線療法中にオキシコドン徐放錠が開始され寛解後も患者の痛みの訴えに応じて増量されており、紹介時はオキシコドン徐放錠 80mg/日とオキシコドン速放製剤 20mg1 日 4 回定期服用の合計 160mg/日が継続処方されていた。緩和ケア医が画像診断した結果、癌の再発はなくオピオイドコーピングと診断し、医師・薬剤師・看護師が家族と協同してオピオイド減薬を開始し、3 年かけてオキシコドン速放製剤 2.5mg 頓用 1 日 2 回程度まで減量することができた。"}, {"heading": "まとめ", "content": "薬剤師が外来診察同席する事で、限られた時間でも薬物動態等考慮した専門的な薬学的介入で安全な薬剤選択が可能になる。現在の診療報酬上緩和ケア外来に薬剤師の同席は必須ではないが、質の高い緩和ケアを提供するためには必要と考える。"}], "body_text": "### はじめに\n\n外来緩和ケアでは疼痛や有害事象への迅速な対応が必要であり、患者個々に応じた多様なアセスメントをするためには多職種連携が重要である。当院では、緩和ケア医の要望にて 2018 年頃から薬剤師が医師の診察に同席し処方提案等の診療補助を行っている。今回、2024 年 4 月〜2026 年 4 月の 2 年間に薬剤師が診察同席した件数及び内容を集計し、介入事例の中で薬剤師の関わりが大きかった症例を紹介する。\n\n### 活動報告\n\n介入患者数は9 名、診察回数 98 回でそのうち薬剤師の同席率 98％だった。診察同席時の薬剤師の処方提案内容については、腎機能に応じた用量設定、痛み以外の症状緩和のための薬剤追加提案、患者指導などがあった。\n\n### 症例\n\n70 歳代女性で、膀胱痛の訴えで泌尿器科からコンサルトがあった。初発時は子宮頸癌 stage4A の診断だったが、化学放射線療法後に原発・転移巣いずれも縮小維持し 6 年経過していた。化学放射線療法中にオキシコドン徐放錠が開始され寛解後も患者の痛みの訴えに応じて増量されており、紹介時はオキシコドン徐放錠 80mg/日とオキシコドン速放製剤 20mg1 日 4 回定期服用の合計 160mg/日が継続処方されていた。緩和ケア医が画像診断した結果、癌の再発はなくオピオイドコーピングと診断し、医師・薬剤師・看護師が家族と協同してオピオイド減薬を開始し、3 年かけてオキシコドン速放製剤 2.5mg 頓用 1 日 2 回程度まで減量することができた。\n\n### まとめ\n\n薬剤師が外来診察同席する事で、限られた時間でも薬物動態等考慮した専門的な薬学的介入で安全な薬剤選択が可能になる。現在の診療報酬上緩和ケア外来に薬剤師の同席は必須ではないが、質の高い緩和ケアを提供するためには必要と考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-26-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [148]\nstatus: \"imported\"\n---\n\n# 薬剤師の緩和ケア外来診察同席に関する活動報告と介入の一例\n\n- 演題番号: P1-26-5\n- 演題名: 薬剤師の緩和ケア外来診察同席に関する活動報告と介入の一例\n- 所属施設: 1 NHO 福山医療センター 薬剤部、2 NHO 福山医療センター 地域連携室、 3 NHO 福山医療センター 看護部、4 NHO 福山医療センター 呼吸器外科、 5 NHO 岡山医療センター 薬剤部\n- 筆頭演者: 中山 やちよ（なかやま やちよ） 1\n- 筆頭演者の所属: NHO 福山医療センター 薬剤部\n- 演者名: 中山 やちよ（なかやま やちよ） 1、 藤原 未稀（ふじわら みき） 1、 藤田 憲一（ふじた けんいち） 1、 中村 孝佑（なかむら こうすけ） 5、 中野 良（なかの りょう） 1、 濱岡 照隆（はまおか てるたか） 1、 城野 裕朗（じょうの ひろあき） 2、 前田 智樹（まえだ ともき） 3、 高橋 健司（たかはし けんじ） 4\n- 原本: [PDF 148ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=148>)\n- 冊子ページ: 392\n\n## 抄録本文\n\n### はじめに\n\n外来緩和ケアでは疼痛や有害事象への迅速な対応が必要であり、患者個々に応じた多様なアセスメントをするためには多職種連携が重要である。当院では、緩和ケア医の要望にて 2018 年頃から薬剤師が医師の診察に同席し処方提案等の診療補助を行っている。今回、2024 年 4 月〜2026 年 4 月の 2 年間に薬剤師が診察同席した件数及び内容を集計し、介入事例の中で薬剤師の関わりが大きかった症例を紹介する。\n\n### 活動報告\n\n介入患者数は9 名、診察回数 98 回でそのうち薬剤師の同席率 98％だった。診察同席時の薬剤師の処方提案内容については、腎機能に応じた用量設定、痛み以外の症状緩和のための薬剤追加提案、患者指導などがあった。\n\n### 症例\n\n70 歳代女性で、膀胱痛の訴えで泌尿器科からコンサルトがあった。初発時は子宮頸癌 stage4A の診断だったが、化学放射線療法後に原発・転移巣いずれも縮小維持し 6 年経過していた。化学放射線療法中にオキシコドン徐放錠が開始され寛解後も患者の痛みの訴えに応じて増量されており、紹介時はオキシコドン徐放錠 80mg/日とオキシコドン速放製剤 20mg1 日 4 回定期服用の合計 160mg/日が継続処方されていた。緩和ケア医が画像診断した結果、癌の再発はなくオピオイドコーピングと診断し、医師・薬剤師・看護師が家族と協同してオピオイド減薬を開始し、3 年かけてオキシコドン速放製剤 2.5mg 頓用 1 日 2 回程度まで減量することができた。\n\n### まとめ\n\n薬剤師が外来診察同席する事で、限られた時間でも薬物動態等考慮した専門的な薬学的介入で安全な薬剤選択が可能になる。現在の診療報酬上緩和ケア外来に薬剤師の同席は必須ではないが、質の高い緩和ケアを提供するためには必要と考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 緩和ケア外来の診察同席を9名・98診察で報告し、具体的なオピオイド減量例を示す。\n- 腎機能や痛み以外の症状も含む処方提案が特徴。医師との役割分担と、減量時の評価・フォローの方法に学べる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-29-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-29", "session_name": "精神科薬物療法（LAI・ECT）", "title": "抗精神病薬持効性注射剤の治療継続率と中止要因の検討", "authors": "吉岡 芙美（よしおか ふみ） 1、 岡 辰也（おか たつや） 2、 中山 洋輔（なかやま ようすけ） 3、 石井 秀明（いしい ひであき） 1、 荒木 志乃（あらき しの） 1、福 石 和久（ふくいし かずひさ） 4、 川俣 洋生（かわまた ようせい） 1", "first_author": "吉岡 芙美（よしおか ふみ） 1", "affiliations": "1 NHO 肥前精神医療センター 薬剤部、2 NHO 熊本医療センター 薬剤部、 3 NHO 九州医療センター 薬剤部、4 NHO 福岡東医療センター 薬剤部", "first_affiliation": "NHO 肥前精神医療センター 薬剤部", "printed_pages": "397", "pdf_pages": "153", "features": ["抗精神病薬持効性注射剤2剤を、12か月継続率・中止理由・中止後の切替先まで比較。", "継続率はAOM群で高い傾向だが、患者背景の違いも確認したい。効果不十分と副作用への対応が実務上の焦点となる。"], "issues": [], "sections": [{"heading": "目的", "content": "統合失調症の治療において服薬アドヒアランス不良は臨床上の課題となっており、持効性注射剤（Long Acting Injection：以下、LAI）は怠薬防止に有用とされる。当院では、主にアリピプラゾール LAI（以下、AOM）とパリペリドンパルミチン酸エステル LAI（以下、PP）が使用されており、特に AOM の使用が増加傾向にある。本研究では、両剤の治療継続率と中止要因について調査を行い AOM の有効性を検証した。"}, {"heading": "方法", "content": "当院において、2016 年 1 月 1 日から 2024 年 12 月 31 日までに AOM または PP を導入した統合失調症の患者を対象とし、12 ヵ月時点の治療継続率、中止要因を調査した。"}, {"heading": "結果", "content": "対象患者は AOM 群 46 例、PP 群 54 例であった。治療継続率は AOM 群 69.6％、PP 群51.8％と、AOM 群で高い傾向を示した。中止要因は、両群ともに「効果不十分」が 50％以上、「副作用」が 20％以上を占めていた。全対象患者に占める「副作用」による中止の割合は、AOM 群 6.5％、PP 群 13.0％であった。中止後の切替先は、両群ともにクロザピンが約 30％と最多であり、PP から AOM は 19.2％、AOM から PP は 7.0％であった。PP群では「副作用」により中止した患者の半数が AOM へ切り替えられていた。"}, {"heading": "考察", "content": "AOM 群は PP 群に比較して治療継続率が高い傾向にあり、PP で忍容性に問題を生じた症例の一部に対して AOM が代替治療として選択されていたことから、AOM は忍容性の観点において統合失調症の治療の有用な選択肢であることが示唆された。また、中止要因は群ともに「効果不十分」が最多であり、中止後にクロザピンへ切り替えられた症例が一定割合を占めたことから、対象患者の一部に治療抵抗性統合失調症が含まれている可能性が示唆された。"}], "body_text": "### 目的\n\n統合失調症の治療において服薬アドヒアランス不良は臨床上の課題となっており、持効性注射剤（Long Acting Injection：以下、LAI）は怠薬防止に有用とされる。当院では、主にアリピプラゾール LAI（以下、AOM）とパリペリドンパルミチン酸エステル LAI（以下、PP）が使用されており、特に AOM の使用が増加傾向にある。本研究では、両剤の治療継続率と中止要因について調査を行い AOM の有効性を検証した。\n\n### 方法\n\n当院において、2016 年 1 月 1 日から 2024 年 12 月 31 日までに AOM または PP を導入した統合失調症の患者を対象とし、12 ヵ月時点の治療継続率、中止要因を調査した。\n\n### 結果\n\n対象患者は AOM 群 46 例、PP 群 54 例であった。治療継続率は AOM 群 69.6％、PP 群51.8％と、AOM 群で高い傾向を示した。中止要因は、両群ともに「効果不十分」が 50％以上、「副作用」が 20％以上を占めていた。全対象患者に占める「副作用」による中止の割合は、AOM 群 6.5％、PP 群 13.0％であった。中止後の切替先は、両群ともにクロザピンが約 30％と最多であり、PP から AOM は 19.2％、AOM から PP は 7.0％であった。PP群では「副作用」により中止した患者の半数が AOM へ切り替えられていた。\n\n### 考察\n\nAOM 群は PP 群に比較して治療継続率が高い傾向にあり、PP で忍容性に問題を生じた症例の一部に対して AOM が代替治療として選択されていたことから、AOM は忍容性の観点において統合失調症の治療の有用な選択肢であることが示唆された。また、中止要因は群ともに「効果不十分」が最多であり、中止後にクロザピンへ切り替えられた症例が一定割合を占めたことから、対象患者の一部に治療抵抗性統合失調症が含まれている可能性が示唆された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-29-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [153]\nstatus: \"imported\"\n---\n\n# 抗精神病薬持効性注射剤の治療継続率と中止要因の検討\n\n- 演題番号: P1-29-4\n- 演題名: 抗精神病薬持効性注射剤の治療継続率と中止要因の検討\n- 所属施設: 1 NHO 肥前精神医療センター 薬剤部、2 NHO 熊本医療センター 薬剤部、 3 NHO 九州医療センター 薬剤部、4 NHO 福岡東医療センター 薬剤部\n- 筆頭演者: 吉岡 芙美（よしおか ふみ） 1\n- 筆頭演者の所属: NHO 肥前精神医療センター 薬剤部\n- 演者名: 吉岡 芙美（よしおか ふみ） 1、 岡 辰也（おか たつや） 2、 中山 洋輔（なかやま ようすけ） 3、 石井 秀明（いしい ひであき） 1、 荒木 志乃（あらき しの） 1、福 石 和久（ふくいし かずひさ） 4、 川俣 洋生（かわまた ようせい） 1\n- 原本: [PDF 153ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=153>)\n- 冊子ページ: 397\n\n## 抄録本文\n\n### 目的\n\n統合失調症の治療において服薬アドヒアランス不良は臨床上の課題となっており、持効性注射剤（Long Acting Injection：以下、LAI）は怠薬防止に有用とされる。当院では、主にアリピプラゾール LAI（以下、AOM）とパリペリドンパルミチン酸エステル LAI（以下、PP）が使用されており、特に AOM の使用が増加傾向にある。本研究では、両剤の治療継続率と中止要因について調査を行い AOM の有効性を検証した。\n\n### 方法\n\n当院において、2016 年 1 月 1 日から 2024 年 12 月 31 日までに AOM または PP を導入した統合失調症の患者を対象とし、12 ヵ月時点の治療継続率、中止要因を調査した。\n\n### 結果\n\n対象患者は AOM 群 46 例、PP 群 54 例であった。治療継続率は AOM 群 69.6％、PP 群51.8％と、AOM 群で高い傾向を示した。中止要因は、両群ともに「効果不十分」が 50％以上、「副作用」が 20％以上を占めていた。全対象患者に占める「副作用」による中止の割合は、AOM 群 6.5％、PP 群 13.0％であった。中止後の切替先は、両群ともにクロザピンが約 30％と最多であり、PP から AOM は 19.2％、AOM から PP は 7.0％であった。PP群では「副作用」により中止した患者の半数が AOM へ切り替えられていた。\n\n### 考察\n\nAOM 群は PP 群に比較して治療継続率が高い傾向にあり、PP で忍容性に問題を生じた症例の一部に対して AOM が代替治療として選択されていたことから、AOM は忍容性の観点において統合失調症の治療の有用な選択肢であることが示唆された。また、中止要因は群ともに「効果不十分」が最多であり、中止後にクロザピンへ切り替えられた症例が一定割合を占めたことから、対象患者の一部に治療抵抗性統合失調症が含まれている可能性が示唆された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 抗精神病薬持効性注射剤2剤を、12か月継続率・中止理由・中止後の切替先まで比較。\n- 継続率はAOM群で高い傾向だが、患者背景の違いも確認したい。効果不十分と副作用への対応が実務上の焦点となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-29-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-29", "session_name": "精神科薬物療法（LAI・ECT）", "title": "うつ病患者に対する電気けいれん療法後の薬物治療についての実態調査と検討", "authors": "澤田 奈々（さわだ なな）、 黒川 拓也（くろかわ たくや）、 原 伸好（はら のぶよし）、 井上 敦介（いのうえ あつゆき）", "first_author": "澤田 奈々（さわだ なな）", "affiliations": "NHO 舞鶴医療センター 薬剤部", "first_affiliation": "NHO 舞鶴医療センター 薬剤部", "printed_pages": "398", "pdf_pages": "154", "features": ["ECT後の薬物治療を抗うつ薬の種類・併用と抗精神病薬の増強療法から整理する実態調査。", "延べ24人と小規模で、治療抵抗性以外の症例も含む。維持療法の選択と対象患者の定義を検討する材料となる。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "治療抵抗性のうつ病に対する電気けいれん療法（ECT）は、治療終了後に比較的早期に再発する例が多く見られるため、ECT 終了後の再発予防を目的とした維持療法が重要である。しかし、三環系抗うつ薬の販売中止などを受け、主剤として新規抗うつ薬を使用する例が増加しているが、エビデンスが少ないため施設や主治医によって薬剤の選択が異なるのが現状である。本研究では当院における 2023 年 4 月から 2025 年 7 月までの ECT 後の薬物療法の実態を調査し、その傾向や課題を明らかにすることを目的とする。2023 年 4 月 1 日から2025 年 7 月 31 日までの間に当院精神科病棟に入院し ECT を受けた、ICD-10/11 F32/33 code に属する患者について、年齢、性別、入院期間、ECT 施行回数、退院後 1 年以内の再入院の有無、抗うつ薬と抗精神病薬の使用状況を調査した。ECT 患者数延 24 人のうち 2 人は 1 年以内の再入院があり再入院時も ECT を実施していた。抗うつ薬の剤数は66.7％が 1 剤、33.3％が 2 剤であり 3 剤以上の使用はなかった。抗うつ薬の種類の内訳はミルタザピン 31.3％、ベンラファキシン 18.8％、パロキセチン 15.6％、エスシタロプラム 15.6％であり、2 剤使用例は全てミルタザピンと他の抗うつ薬との併用であった。イミプラミン換算の平均値は 224.7mg であった。また、抗精神病薬による増強療法は全体の70.3％で実施されていた。当院では治療抵抗性でないうつ病に対しても ECT を実施していることが示された。今後は治療抵抗性の症例に限定して薬剤の用量等を調査する必要がある。"}], "body_text": "治療抵抗性のうつ病に対する電気けいれん療法（ECT）は、治療終了後に比較的早期に再発する例が多く見られるため、ECT 終了後の再発予防を目的とした維持療法が重要である。しかし、三環系抗うつ薬の販売中止などを受け、主剤として新規抗うつ薬を使用する例が増加しているが、エビデンスが少ないため施設や主治医によって薬剤の選択が異なるのが現状である。本研究では当院における 2023 年 4 月から 2025 年 7 月までの ECT 後の薬物療法の実態を調査し、その傾向や課題を明らかにすることを目的とする。2023 年 4 月 1 日から2025 年 7 月 31 日までの間に当院精神科病棟に入院し ECT を受けた、ICD-10/11 F32/33 code に属する患者について、年齢、性別、入院期間、ECT 施行回数、退院後 1 年以内の再入院の有無、抗うつ薬と抗精神病薬の使用状況を調査した。ECT 患者数延 24 人のうち 2 人は 1 年以内の再入院があり再入院時も ECT を実施していた。抗うつ薬の剤数は66.7％が 1 剤、33.3％が 2 剤であり 3 剤以上の使用はなかった。抗うつ薬の種類の内訳はミルタザピン 31.3％、ベンラファキシン 18.8％、パロキセチン 15.6％、エスシタロプラム 15.6％であり、2 剤使用例は全てミルタザピンと他の抗うつ薬との併用であった。イミプラミン換算の平均値は 224.7mg であった。また、抗精神病薬による増強療法は全体の70.3％で実施されていた。当院では治療抵抗性でないうつ病に対しても ECT を実施していることが示された。今後は治療抵抗性の症例に限定して薬剤の用量等を調査する必要がある。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-29-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [154]\nstatus: \"imported\"\n---\n\n# うつ病患者に対する電気けいれん療法後の薬物治療についての実態調査と検討\n\n- 演題番号: P1-29-7\n- 演題名: うつ病患者に対する電気けいれん療法後の薬物治療についての実態調査と検討\n- 所属施設: NHO 舞鶴医療センター 薬剤部\n- 筆頭演者: 澤田 奈々（さわだ なな）\n- 筆頭演者の所属: NHO 舞鶴医療センター 薬剤部\n- 演者名: 澤田 奈々（さわだ なな）、 黒川 拓也（くろかわ たくや）、 原 伸好（はら のぶよし）、 井上 敦介（いのうえ あつゆき）\n- 原本: [PDF 154ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=154>)\n- 冊子ページ: 398\n\n## 抄録本文\n\n治療抵抗性のうつ病に対する電気けいれん療法（ECT）は、治療終了後に比較的早期に再発する例が多く見られるため、ECT 終了後の再発予防を目的とした維持療法が重要である。しかし、三環系抗うつ薬の販売中止などを受け、主剤として新規抗うつ薬を使用する例が増加しているが、エビデンスが少ないため施設や主治医によって薬剤の選択が異なるのが現状である。本研究では当院における 2023 年 4 月から 2025 年 7 月までの ECT 後の薬物療法の実態を調査し、その傾向や課題を明らかにすることを目的とする。2023 年 4 月 1 日から2025 年 7 月 31 日までの間に当院精神科病棟に入院し ECT を受けた、ICD-10/11 F32/33 code に属する患者について、年齢、性別、入院期間、ECT 施行回数、退院後 1 年以内の再入院の有無、抗うつ薬と抗精神病薬の使用状況を調査した。ECT 患者数延 24 人のうち 2 人は 1 年以内の再入院があり再入院時も ECT を実施していた。抗うつ薬の剤数は66.7％が 1 剤、33.3％が 2 剤であり 3 剤以上の使用はなかった。抗うつ薬の種類の内訳はミルタザピン 31.3％、ベンラファキシン 18.8％、パロキセチン 15.6％、エスシタロプラム 15.6％であり、2 剤使用例は全てミルタザピンと他の抗うつ薬との併用であった。イミプラミン換算の平均値は 224.7mg であった。また、抗精神病薬による増強療法は全体の70.3％で実施されていた。当院では治療抵抗性でないうつ病に対しても ECT を実施していることが示された。今後は治療抵抗性の症例に限定して薬剤の用量等を調査する必要がある。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- ECT後の薬物治療を抗うつ薬の種類・併用と抗精神病薬の増強療法から整理する実態調査。\n- 延べ24人と小規模で、治療抵抗性以外の症例も含む。維持療法の選択と対象患者の定義を検討する材料となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-32-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-32", "session_name": "抗菌薬有害事象症例", "title": "セフトリアキソン投与による偽胆石症を疑った一例", "authors": "大友 大輔（おおとも だいすけ）、 高木 亜由（たかぎ あゆ）、 小澤 真吾（こざわ しんご）、 大久保 美里（おおくぼ みさと）、 鈴木 克之（すずき かつゆき）、 小林 道雄（こばやし みちお）", "first_author": "大友 大輔（おおとも だいすけ）", "affiliations": "NHO あきた病院 薬剤科", "first_affiliation": "NHO あきた病院 薬剤科", "printed_pages": "404", "pdf_pages": "160", "features": ["腎機能障害・絶食などを伴う患者で、セフトリアキソン投与後の偽胆石症を疑った経過を提示。", "投与歴と画像所見の推移を結び付ける視点が参考となる。リスク因子の重なりと薬剤師が介入できる時点に注目したい。"], "issues": [], "sections": [{"heading": "背景", "content": "セフトリアキソンは第三世代のセフェム系抗菌薬であり、特徴として血中半減期が長く、広い抗菌スペクトラムを有することから現在でも多くの感染症に使用されている。また、セフトリアキソンは胆石様沈殿物（偽胆石）を生じるという報告があり、これらの主成分はカルシウム塩であることが分かっている。今回、当院においてセフトリアキソン投与による偽胆石症を疑った一例を経験したので報告する。"}, {"heading": "症例", "content": "79 歳、男性"}, {"heading": "現病歴", "content": "多系統萎縮症と診断され、当院外来にてフォロー。X 年 1 月慢性経過での誤嚥性肺炎増悪と、インフルエンザ罹患により呼吸困難が増悪し、他院に救急搬送。X 年 2 月当院へ転院となる。"}, {"heading": "経過", "content": "X 年 3 月 19 日肺炎にセフトリアキソン 2g/日×8 日間の投与が行われた。その際栄養剤の逆流が疑われ、絶食となる。血液検査所見で AST 31U/L、ALT 8U/L、CYS-C/LA 1.9mg/L、eGFRcys 29.9、Ca-（S）8.7ng/dl と腎機能障害あり。また、入院当初 Ca-（S）11.3mg/dl と高カルシウム血症を認め、X 年 3 月 17 日まで治療薬のエルカトニン注を使用していた。X 年 4 月 3 日肺炎再燃し、CT が施行された際、胆嚢内に高吸収域を認め、偽胆石症が疑われた。その後の CT では、胆嚢内の高吸収域は見られなかった。"}, {"heading": "考察", "content": "偽胆石症のリスク因子としては、投与量、期間、安静度、絶食、腎機能障害などが挙げられている。今回の症例では、患者本人に自覚症状はなく、偽胆石も自然消失した。偽胆石症は多くの場合、無症状であるとされているが、合併症、抗菌薬の変更や中止のリスクは考慮する必要があると考える。"}], "body_text": "### 背景\n\nセフトリアキソンは第三世代のセフェム系抗菌薬であり、特徴として血中半減期が長く、広い抗菌スペクトラムを有することから現在でも多くの感染症に使用されている。また、セフトリアキソンは胆石様沈殿物（偽胆石）を生じるという報告があり、これらの主成分はカルシウム塩であることが分かっている。今回、当院においてセフトリアキソン投与による偽胆石症を疑った一例を経験したので報告する。\n\n### 症例\n\n79 歳、男性\n\n### 現病歴\n\n多系統萎縮症と診断され、当院外来にてフォロー。X 年 1 月慢性経過での誤嚥性肺炎増悪と、インフルエンザ罹患により呼吸困難が増悪し、他院に救急搬送。X 年 2 月当院へ転院となる。\n\n### 経過\n\nX 年 3 月 19 日肺炎にセフトリアキソン 2g/日×8 日間の投与が行われた。その際栄養剤の逆流が疑われ、絶食となる。血液検査所見で AST 31U/L、ALT 8U/L、CYS-C/LA 1.9mg/L、eGFRcys 29.9、Ca-（S）8.7ng/dl と腎機能障害あり。また、入院当初 Ca-（S）11.3mg/dl と高カルシウム血症を認め、X 年 3 月 17 日まで治療薬のエルカトニン注を使用していた。X 年 4 月 3 日肺炎再燃し、CT が施行された際、胆嚢内に高吸収域を認め、偽胆石症が疑われた。その後の CT では、胆嚢内の高吸収域は見られなかった。\n\n### 考察\n\n偽胆石症のリスク因子としては、投与量、期間、安静度、絶食、腎機能障害などが挙げられている。今回の症例では、患者本人に自覚症状はなく、偽胆石も自然消失した。偽胆石症は多くの場合、無症状であるとされているが、合併症、抗菌薬の変更や中止のリスクは考慮する必要があると考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-32-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [160]\nstatus: \"imported\"\n---\n\n# セフトリアキソン投与による偽胆石症を疑った一例\n\n- 演題番号: P1-32-5\n- 演題名: セフトリアキソン投与による偽胆石症を疑った一例\n- 所属施設: NHO あきた病院 薬剤科\n- 筆頭演者: 大友 大輔（おおとも だいすけ）\n- 筆頭演者の所属: NHO あきた病院 薬剤科\n- 演者名: 大友 大輔（おおとも だいすけ）、 高木 亜由（たかぎ あゆ）、 小澤 真吾（こざわ しんご）、 大久保 美里（おおくぼ みさと）、 鈴木 克之（すずき かつゆき）、 小林 道雄（こばやし みちお）\n- 原本: [PDF 160ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=160>)\n- 冊子ページ: 404\n\n## 抄録本文\n\n### 背景\n\nセフトリアキソンは第三世代のセフェム系抗菌薬であり、特徴として血中半減期が長く、広い抗菌スペクトラムを有することから現在でも多くの感染症に使用されている。また、セフトリアキソンは胆石様沈殿物（偽胆石）を生じるという報告があり、これらの主成分はカルシウム塩であることが分かっている。今回、当院においてセフトリアキソン投与による偽胆石症を疑った一例を経験したので報告する。\n\n### 症例\n\n79 歳、男性\n\n### 現病歴\n\n多系統萎縮症と診断され、当院外来にてフォロー。X 年 1 月慢性経過での誤嚥性肺炎増悪と、インフルエンザ罹患により呼吸困難が増悪し、他院に救急搬送。X 年 2 月当院へ転院となる。\n\n### 経過\n\nX 年 3 月 19 日肺炎にセフトリアキソン 2g/日×8 日間の投与が行われた。その際栄養剤の逆流が疑われ、絶食となる。血液検査所見で AST 31U/L、ALT 8U/L、CYS-C/LA 1.9mg/L、eGFRcys 29.9、Ca-（S）8.7ng/dl と腎機能障害あり。また、入院当初 Ca-（S）11.3mg/dl と高カルシウム血症を認め、X 年 3 月 17 日まで治療薬のエルカトニン注を使用していた。X 年 4 月 3 日肺炎再燃し、CT が施行された際、胆嚢内に高吸収域を認め、偽胆石症が疑われた。その後の CT では、胆嚢内の高吸収域は見られなかった。\n\n### 考察\n\n偽胆石症のリスク因子としては、投与量、期間、安静度、絶食、腎機能障害などが挙げられている。今回の症例では、患者本人に自覚症状はなく、偽胆石も自然消失した。偽胆石症は多くの場合、無症状であるとされているが、合併症、抗菌薬の変更や中止のリスクは考慮する必要があると考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 腎機能障害・絶食などを伴う患者で、セフトリアキソン投与後の偽胆石症を疑った経過を提示。\n- 投与歴と画像所見の推移を結び付ける視点が参考となる。リスク因子の重なりと薬剤師が介入できる時点に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-32-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-32", "session_name": "抗菌薬有害事象症例", "title": "セフメタゾール投与終了後にビタミン K 欠乏性を疑う凝固能異常が発現した一例", "authors": "松本 麻希（まつもと まき）、 長岡 宏一（ながおか こういち）、 後藤 拓也（ごとう たくや）、 尾納 明里紗（びのう ありさ）", "first_author": "松本 麻希（まつもと まき）", "affiliations": "NHO 豊橋医療センター 薬剤部", "first_affiliation": "NHO 豊橋医療センター 薬剤部", "printed_pages": "404", "pdf_pages": "160", "features": ["セフメタゾール中止後にPT-INRが著明に延長した、低栄養・高度腎機能障害を伴う症例。", "中止時の値が正常域でも遅れて凝固異常が現れた点が特徴。ビタミンK投与後の推移と監視期間の考え方を確認したい。"], "issues": [], "sections": [{"heading": "背景", "content": "セフメタゾール（CMZ）は構造中に N-メチルチオテトラゾール（NMTT）基を有し、ビタミン K エポキシド還元酵素を阻害することで凝固因子の産生を抑制する。今回CMZ 投与中止から数日後に PT-INR 延長を認め、ビタミン K の補充により改善した症例を経験したため報告する。"}, {"heading": "症例", "content": "91 歳女性。敗血症（尿培・血培より E. coli 検出）に対し CMZ（1g 1 日 2 回）を開始した。入院時、低栄養（Alb 2.7g/dL）および重度の腎機能障害（Ccr9.64mL/min）を認めていた。"}, {"heading": "経過", "content": "Day4 まで CMZ を投与後、血小板減少と腎機能増悪を認めたため薬剤性を考慮してCMZ を中止しセフトリアキソン（CTRX）へ変更した。中止時の PT-INR は 1.17 であったが、Day 8 に 7.84 と著明に延長した。バイタルや他の凝固マーカーから DIC（2 点）は否定的であり、CMZ によるビタミン K 欠乏性凝固異常を疑い Day8-11 までメナテトレノン20mg/日を投与した。Day10 には PT-INR が 1.23 まで低下し、凝固能の著明な改善を認めた。"}, {"heading": "考察", "content": "NMTT 基含有抗菌薬は、ビタミン K の再利用サイクルを阻害する。既存の凝固因子の枯渇には時間を要するため、凝固異常出現は NMTT 基含有抗菌薬投与開始後最短 2-4 日、最長で 20 日（平均 7-9 日）と幅が大きく、本例のように投与終了後に凝固異常が顕在化することがある。特に高齢、低栄養、腎機能低下例ではリスクが高く、投与中のみならず投与終了後も継続的な評価が必要である。"}, {"heading": "結論", "content": "CMZ 投与症例においては、投与中のみならず投与終了後も凝固能異常が発現する可能性がある。特にハイリスクな患者において CMZ を投与する場合には、身体所見等の観察や検査値の測定などのモニタリングによる凝固異常の早期発見が重篤な出血合併症の回避につながる。"}], "body_text": "### 背景\n\nセフメタゾール（CMZ）は構造中に N-メチルチオテトラゾール（NMTT）基を有し、ビタミン K エポキシド還元酵素を阻害することで凝固因子の産生を抑制する。今回CMZ 投与中止から数日後に PT-INR 延長を認め、ビタミン K の補充により改善した症例を経験したため報告する。\n\n### 症例\n\n91 歳女性。敗血症（尿培・血培より E. coli 検出）に対し CMZ（1g 1 日 2 回）を開始した。入院時、低栄養（Alb 2.7g/dL）および重度の腎機能障害（Ccr9.64mL/min）を認めていた。\n\n### 経過\n\nDay4 まで CMZ を投与後、血小板減少と腎機能増悪を認めたため薬剤性を考慮してCMZ を中止しセフトリアキソン（CTRX）へ変更した。中止時の PT-INR は 1.17 であったが、Day 8 に 7.84 と著明に延長した。バイタルや他の凝固マーカーから DIC（2 点）は否定的であり、CMZ によるビタミン K 欠乏性凝固異常を疑い Day8-11 までメナテトレノン20mg/日を投与した。Day10 には PT-INR が 1.23 まで低下し、凝固能の著明な改善を認めた。\n\n### 考察\n\nNMTT 基含有抗菌薬は、ビタミン K の再利用サイクルを阻害する。既存の凝固因子の枯渇には時間を要するため、凝固異常出現は NMTT 基含有抗菌薬投与開始後最短 2-4 日、最長で 20 日（平均 7-9 日）と幅が大きく、本例のように投与終了後に凝固異常が顕在化することがある。特に高齢、低栄養、腎機能低下例ではリスクが高く、投与中のみならず投与終了後も継続的な評価が必要である。\n\n### 結論\n\nCMZ 投与症例においては、投与中のみならず投与終了後も凝固能異常が発現する可能性がある。特にハイリスクな患者において CMZ を投与する場合には、身体所見等の観察や検査値の測定などのモニタリングによる凝固異常の早期発見が重篤な出血合併症の回避につながる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-32-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [160]\nstatus: \"imported\"\n---\n\n# セフメタゾール投与終了後にビタミン K 欠乏性を疑う凝固能異常が発現した一例\n\n- 演題番号: P1-32-6\n- 演題名: セフメタゾール投与終了後にビタミン K 欠乏性を疑う凝固能異常が発現した一例\n- 所属施設: NHO 豊橋医療センター 薬剤部\n- 筆頭演者: 松本 麻希（まつもと まき）\n- 筆頭演者の所属: NHO 豊橋医療センター 薬剤部\n- 演者名: 松本 麻希（まつもと まき）、 長岡 宏一（ながおか こういち）、 後藤 拓也（ごとう たくや）、 尾納 明里紗（びのう ありさ）\n- 原本: [PDF 160ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=160>)\n- 冊子ページ: 404\n\n## 抄録本文\n\n### 背景\n\nセフメタゾール（CMZ）は構造中に N-メチルチオテトラゾール（NMTT）基を有し、ビタミン K エポキシド還元酵素を阻害することで凝固因子の産生を抑制する。今回CMZ 投与中止から数日後に PT-INR 延長を認め、ビタミン K の補充により改善した症例を経験したため報告する。\n\n### 症例\n\n91 歳女性。敗血症（尿培・血培より E. coli 検出）に対し CMZ（1g 1 日 2 回）を開始した。入院時、低栄養（Alb 2.7g/dL）および重度の腎機能障害（Ccr9.64mL/min）を認めていた。\n\n### 経過\n\nDay4 まで CMZ を投与後、血小板減少と腎機能増悪を認めたため薬剤性を考慮してCMZ を中止しセフトリアキソン（CTRX）へ変更した。中止時の PT-INR は 1.17 であったが、Day 8 に 7.84 と著明に延長した。バイタルや他の凝固マーカーから DIC（2 点）は否定的であり、CMZ によるビタミン K 欠乏性凝固異常を疑い Day8-11 までメナテトレノン20mg/日を投与した。Day10 には PT-INR が 1.23 まで低下し、凝固能の著明な改善を認めた。\n\n### 考察\n\nNMTT 基含有抗菌薬は、ビタミン K の再利用サイクルを阻害する。既存の凝固因子の枯渇には時間を要するため、凝固異常出現は NMTT 基含有抗菌薬投与開始後最短 2-4 日、最長で 20 日（平均 7-9 日）と幅が大きく、本例のように投与終了後に凝固異常が顕在化することがある。特に高齢、低栄養、腎機能低下例ではリスクが高く、投与中のみならず投与終了後も継続的な評価が必要である。\n\n### 結論\n\nCMZ 投与症例においては、投与中のみならず投与終了後も凝固能異常が発現する可能性がある。特にハイリスクな患者において CMZ を投与する場合には、身体所見等の観察や検査値の測定などのモニタリングによる凝固異常の早期発見が重篤な出血合併症の回避につながる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- セフメタゾール中止後にPT-INRが著明に延長した、低栄養・高度腎機能障害を伴う症例。\n- 中止時の値が正常域でも遅れて凝固異常が現れた点が特徴。ビタミンK投与後の推移と監視期間の考え方を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-34-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-34", "session_name": "周術期・術前休薬・ハイリスク薬指導", "title": "病棟薬剤師による入院前の術前休薬指針に則った医師指示確認の取組み", "authors": "江端 成美（えばた なるみ） 1、 松岡 志歩（まつおか しほ） 1、溝 田 愛子（みぞた あいこ） 1、 大石 博史（おおいし ひろふみ） 1、 藤瀬 陽子（ふじせ ようこ） 1、 高野 豪（たかの たけし） 1、 山脇 一浩（やまわき かずひろ） 1、 大橋 邦央（おおはし くにお） 2", "first_author": "江端 成美（えばた なるみ） 1", "affiliations": "1 NHO 九州医療センター 薬剤部、2 NHO 熊本南病院 薬剤科", "first_affiliation": "NHO 九州医療センター 薬剤部", "printed_pages": "408", "pdf_pages": "164", "features": ["病棟薬剤師が週1回約30分の入院前確認を行い、術前休薬指示への介入を評価。", "不適切な指示への介入率は上昇したが、適切な休薬実施率等には有意差なし。限られた時間での対象抽出が参考となる。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "国立病院機構九州医療センターでの周術期の薬剤師の関わりとして、医師から依頼があった際に必要に応じて術前休薬情報を提供しているが、適切な休薬指示が無いまま入院となる患者がしばしば見られた。そこで消化器外科の手術予定患者に対し、入院前に病棟薬剤師が指針に沿わない休薬指示（指示漏れを含む）に疑義照会する取り組み（当該業務）を実施したため報告する。"}, {"heading": "方法", "content": "2025 年 4 月から 2026 年 1 月の期間、消化器外科の手術予定患者を対象とし、病棟薬剤師が週 1 回（30 分程度）当該業務を行った。周術期薬剤関連介入数、損失回避額、不適切な休薬指示症例への薬剤師介入率、適切な休薬実施率について、当該業務実施前の 2024 年 4 月から 2025 年 1 月の期間と比較した。緊急手術症例は対象から除外し、カテゴリーデータに対する統計解析は Fisherʼs exact test を用い p ＜0.05 を有意水準とした。"}, {"heading": "結果", "content": "不適切な休薬指示症例への薬剤師介入率は 0％→71.4％と有意に増加し、介入による損失回避総額は 150 万円と概算された。周術期薬剤関連の介入数は 17 件→16 件、適切な休薬実施率は 93.1％→96.9％とどちらも有意差はなかった。"}, {"heading": "考察", "content": "不適切な休薬指示症例への介入率増加、概算された損失回避額から、薬剤師の介入がより安全な治療提供に貢献できること、経済的な面で重要であることが示唆される。周術期薬剤関連介入数、適切な休薬実施率はほとんど変化せず、当該業務が既存の業務に悪影響を与えなかったこと、当該業務実施前から周術期の薬剤師の介入が適切に機能していたことが示唆される。"}], "body_text": "### 背景・目的\n\n国立病院機構九州医療センターでの周術期の薬剤師の関わりとして、医師から依頼があった際に必要に応じて術前休薬情報を提供しているが、適切な休薬指示が無いまま入院となる患者がしばしば見られた。そこで消化器外科の手術予定患者に対し、入院前に病棟薬剤師が指針に沿わない休薬指示（指示漏れを含む）に疑義照会する取り組み（当該業務）を実施したため報告する。\n\n### 方法\n\n2025 年 4 月から 2026 年 1 月の期間、消化器外科の手術予定患者を対象とし、病棟薬剤師が週 1 回（30 分程度）当該業務を行った。周術期薬剤関連介入数、損失回避額、不適切な休薬指示症例への薬剤師介入率、適切な休薬実施率について、当該業務実施前の 2024 年 4 月から 2025 年 1 月の期間と比較した。緊急手術症例は対象から除外し、カテゴリーデータに対する統計解析は Fisherʼs exact test を用い p ＜0.05 を有意水準とした。\n\n### 結果\n\n不適切な休薬指示症例への薬剤師介入率は 0％→71.4％と有意に増加し、介入による損失回避総額は 150 万円と概算された。周術期薬剤関連の介入数は 17 件→16 件、適切な休薬実施率は 93.1％→96.9％とどちらも有意差はなかった。\n\n### 考察\n\n不適切な休薬指示症例への介入率増加、概算された損失回避額から、薬剤師の介入がより安全な治療提供に貢献できること、経済的な面で重要であることが示唆される。周術期薬剤関連介入数、適切な休薬実施率はほとんど変化せず、当該業務が既存の業務に悪影響を与えなかったこと、当該業務実施前から周術期の薬剤師の介入が適切に機能していたことが示唆される。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-34-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [164]\nstatus: \"imported\"\n---\n\n# 病棟薬剤師による入院前の術前休薬指針に則った医師指示確認の取組み\n\n- 演題番号: P1-34-6\n- 演題名: 病棟薬剤師による入院前の術前休薬指針に則った医師指示確認の取組み\n- 所属施設: 1 NHO 九州医療センター 薬剤部、2 NHO 熊本南病院 薬剤科\n- 筆頭演者: 江端 成美（えばた なるみ） 1\n- 筆頭演者の所属: NHO 九州医療センター 薬剤部\n- 演者名: 江端 成美（えばた なるみ） 1、 松岡 志歩（まつおか しほ） 1、溝 田 愛子（みぞた あいこ） 1、 大石 博史（おおいし ひろふみ） 1、 藤瀬 陽子（ふじせ ようこ） 1、 高野 豪（たかの たけし） 1、 山脇 一浩（やまわき かずひろ） 1、 大橋 邦央（おおはし くにお） 2\n- 原本: [PDF 164ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=164>)\n- 冊子ページ: 408\n\n## 抄録本文\n\n### 背景・目的\n\n国立病院機構九州医療センターでの周術期の薬剤師の関わりとして、医師から依頼があった際に必要に応じて術前休薬情報を提供しているが、適切な休薬指示が無いまま入院となる患者がしばしば見られた。そこで消化器外科の手術予定患者に対し、入院前に病棟薬剤師が指針に沿わない休薬指示（指示漏れを含む）に疑義照会する取り組み（当該業務）を実施したため報告する。\n\n### 方法\n\n2025 年 4 月から 2026 年 1 月の期間、消化器外科の手術予定患者を対象とし、病棟薬剤師が週 1 回（30 分程度）当該業務を行った。周術期薬剤関連介入数、損失回避額、不適切な休薬指示症例への薬剤師介入率、適切な休薬実施率について、当該業務実施前の 2024 年 4 月から 2025 年 1 月の期間と比較した。緊急手術症例は対象から除外し、カテゴリーデータに対する統計解析は Fisherʼs exact test を用い p ＜0.05 を有意水準とした。\n\n### 結果\n\n不適切な休薬指示症例への薬剤師介入率は 0％→71.4％と有意に増加し、介入による損失回避総額は 150 万円と概算された。周術期薬剤関連の介入数は 17 件→16 件、適切な休薬実施率は 93.1％→96.9％とどちらも有意差はなかった。\n\n### 考察\n\n不適切な休薬指示症例への介入率増加、概算された損失回避額から、薬剤師の介入がより安全な治療提供に貢献できること、経済的な面で重要であることが示唆される。周術期薬剤関連介入数、適切な休薬実施率はほとんど変化せず、当該業務が既存の業務に悪影響を与えなかったこと、当該業務実施前から周術期の薬剤師の介入が適切に機能していたことが示唆される。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 病棟薬剤師が週1回約30分の入院前確認を行い、術前休薬指示への介入を評価。\n- 不適切な指示への介入率は上昇したが、適切な休薬実施率等には有意差なし。限られた時間での対象抽出が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-34-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-34", "session_name": "周術期・術前休薬・ハイリスク薬指導", "title": "周術期薬剤師連携と指導ツールの導入によるハイリスク薬指導料 1 算定向上への取り組み", "authors": "黒川 雄太（くろかわ ゆうた）、 三角 紳博（みすみ のぶひろ）、 小園 亜希（こぞの あき）、 齋藤 巨樹（さいとう おおき）、 橋本 崇広（はしもと たかひろ）、 山田 政典（やまだ まさのり）、 田代 早紀（たしろ さき）、 木村 修徳（きむら よしのり）、 濱崎 翔平（はまさき しょうへい）、 中尾 佳世（なかお かよ）、 平木 麻衣（ひらき まい）、 水田 康裕（みずた やすひろ）、 本多 成美（ほんだ なるみ）、 江口 遥菜（えぐち はるな）、 春口 麻衣子（はるぐち まいこ）、 友永 さわ（ともなが さわ）", "first_author": "黒川 雄太（くろかわ ゆうた）", "affiliations": "NHO 熊本医療センター 薬剤部", "first_affiliation": "NHO 熊本医療センター 薬剤部", "printed_pages": "408", "pdf_pages": "164", "features": ["周術期の情報を集約する指導ツールと薬剤師間連携を、全身麻酔2,399例で評価。", "薬剤管理指導料1の算定率が24.9％から68.0％へ上昇。術中薬を含めた情報共有と指導内容の整備に注目できる。"], "issues": [], "sections": [{"heading": "目的", "content": "当院では薬剤管理指導料 1 の実施率の増加が停滞しており、その要因の一つとして術中使用薬剤の情報が病棟薬剤師による確認に限界があることが挙げられた。そこで、術中薬を含む周術期ハイリスク薬の確実な把握を目的に、外来・手術室・病棟を連携する「術前薬剤管理記録」ツールを作成した。本ツールを用いた体制構築が、薬剤管理指導料 1 の算定率向上に寄与するかを検討した。"}, {"heading": "方法", "content": "対象は 2025 年 4 月から 2026 年 3 月に全身麻酔を施行した 2399 例とした。2025 年 10 月に導入した本ツールは、入院前常用薬・術前中止薬・アレルギー歴・麻酔管理加算申請情報を管理し、全身麻酔（全麻）症例における術中使用薬の抽出する仕組みを備える。本ツールを用いて手術室薬剤師が全麻症例のスクリーニングを行い、病棟薬剤師へ情報を視覚的に共有・伝達して術後指導へ繋げる体制を構築した。導入前後で薬剤管理指導料 1 の算定件数・算定率の変化を検証した。"}, {"heading": "結果", "content": "全麻症例に対する算定率は、導入前 24.9％（306/1229 例）から導入後 68.0％（796/1170 例）へ上昇した。術中薬以外のハイリスク薬による算定は前後で大きな変動を認めなかった（297 件から 307 件）。術中薬を含む算定は 9 件から 489 件へと著明に増加した。"}, {"heading": "考察", "content": "術中薬以外の算定に変動がないことから、算定向上は本ツール導入による術中薬の把握精度向上によるものと考える。周術期における薬剤関連リスクは術後合併症の原因となり得るが、薬剤師の継続的介入が適正化に寄与すると報告されている。本取り組みは、術中薬を含む周術期薬剤情報の共有が可能となり、病棟の業務負荷を増やすことなく周術期薬物管理を強化する、実用性の高い運用体制と言える。"}], "body_text": "### 目的\n\n当院では薬剤管理指導料 1 の実施率の増加が停滞しており、その要因の一つとして術中使用薬剤の情報が病棟薬剤師による確認に限界があることが挙げられた。そこで、術中薬を含む周術期ハイリスク薬の確実な把握を目的に、外来・手術室・病棟を連携する「術前薬剤管理記録」ツールを作成した。本ツールを用いた体制構築が、薬剤管理指導料 1 の算定率向上に寄与するかを検討した。\n\n### 方法\n\n対象は 2025 年 4 月から 2026 年 3 月に全身麻酔を施行した 2399 例とした。2025 年 10 月に導入した本ツールは、入院前常用薬・術前中止薬・アレルギー歴・麻酔管理加算申請情報を管理し、全身麻酔（全麻）症例における術中使用薬の抽出する仕組みを備える。本ツールを用いて手術室薬剤師が全麻症例のスクリーニングを行い、病棟薬剤師へ情報を視覚的に共有・伝達して術後指導へ繋げる体制を構築した。導入前後で薬剤管理指導料 1 の算定件数・算定率の変化を検証した。\n\n### 結果\n\n全麻症例に対する算定率は、導入前 24.9％（306/1229 例）から導入後 68.0％（796/1170 例）へ上昇した。術中薬以外のハイリスク薬による算定は前後で大きな変動を認めなかった（297 件から 307 件）。術中薬を含む算定は 9 件から 489 件へと著明に増加した。\n\n### 考察\n\n術中薬以外の算定に変動がないことから、算定向上は本ツール導入による術中薬の把握精度向上によるものと考える。周術期における薬剤関連リスクは術後合併症の原因となり得るが、薬剤師の継続的介入が適正化に寄与すると報告されている。本取り組みは、術中薬を含む周術期薬剤情報の共有が可能となり、病棟の業務負荷を増やすことなく周術期薬物管理を強化する、実用性の高い運用体制と言える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-34-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pag
