議事概要作成に AI を導入した取り組みについて、業務効率の改善や記録の正確性についてのアンケート調査を行った。"}, {"heading": "結果", "content": "手入力の平均記録時間 12 分 11 秒に対し、AI 記録は 4分 41 秒で、平均 7 分 30 秒の時間短縮が認められ、かつ、内容が簡潔にまとまった文章が作成できた。アンケート調査では、議事概要作成に AI を導入してからの業務効率について、80％の人で「大幅に改善した」との回答が得られ、AI が作成した記録の正確性については全員が「だいたい正確」と評価した。一方で「医療用語認識精度の向上」、「発言者の自動識別」など、実務に基づく改善要望も挙がった。"}, {"heading": "考察", "content": "AI 導入により議事概要作成の効率化が確認された。しかし、もともと備わっている機能について十分に把握できていないことも明らかとなり、今後は AI の活用方法について個々が学んでいく必要があると考えた。また、発言者識別などの機能を運用に取り入れることで、より正確で有用な記録作成とさらなる業務効率化が期待される。"}], "body_text": "### 目的\n\n近年、医療現場では業務の効率化が求められている。当院では朝礼内容の議事概要をマイクロソフト Excel（以下、Excel）に手入力で記録していたが、作業に時間を要していた。そこで AI を活用した議事概要作成を導入し、業務効率化と薬剤師の負担軽減への有用性を検証することを目的とした。\n\n### 方法\n\nある特定の 14 日間を対象期間とし、従来の Excel手入力による記録とマイクロソフト Teams の文字起こし機能を使用し、マイクロソフトCopilot で要約した AI 記録の作業時間を比較した。両者の平均記録時間を算出し、AI 導入による時間短縮効果を評価した。更に、Google Forms を用いて当院薬剤師 10 名を対象に議事概要作成に AI を導入した取り組みについて、業務効率の改善や記録の正確性についてのアンケート調査を行った。\n\n### 結果\n\n手入力の平均記録時間 12 分 11 秒に対し、AI 記録は 4分 41 秒で、平均 7 分 30 秒の時間短縮が認められ、かつ、内容が簡潔にまとまった文章が作成できた。アンケート調査では、議事概要作成に AI を導入してからの業務効率について、80％の人で「大幅に改善した」との回答が得られ、AI が作成した記録の正確性については全員が「だいたい正確」と評価した。一方で「医療用語認識精度の向上」、「発言者の自動識別」など、実務に基づく改善要望も挙がった。\n\n### 考察\n\nAI 導入により議事概要作成の効率化が確認された。しかし、もともと備わっている機能について十分に把握できていないことも明らかとなり、今後は AI の活用方法について個々が学んでいく必要があると考えた。また、発言者識別などの機能を運用に取り入れることで、より正確で有用な記録作成とさらなる業務効率化が期待される。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-132-1\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [469]\nstatus: \"imported\"\n---\n\n# 既存ソフトと AI を併用した議事概要作成の有用性について\n\n- 演題番号: P2-132-1\n- 演題名: 既存ソフトと AI を併用した議事概要作成の有用性について\n- 所属施設: 1 NHO 佐賀病院 薬剤部、2 NHO 琉球病院 薬剤部\n- 筆頭演者: 川崎 菜央（かわさき なお） 1\n- 筆頭演者の所属: NHO 佐賀病院 薬剤部\n- 演者名: 川崎 菜央（かわさき なお） 1、 甲斐 達夫（かい たつお） 2、仲 田 浩成（なかた ひろなり） 1、 鶴崎 泰史（つるさき やすふみ） 1\n- 原本: [PDF 469ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=469>)\n- 冊子ページ: 713\n\n## 抄録本文\n\n### 目的\n\n近年、医療現場では業務の効率化が求められている。当院では朝礼内容の議事概要をマイクロソフト Excel（以下、Excel）に手入力で記録していたが、作業に時間を要していた。そこで AI を活用した議事概要作成を導入し、業務効率化と薬剤師の負担軽減への有用性を検証することを目的とした。\n\n### 方法\n\nある特定の 14 日間を対象期間とし、従来の Excel手入力による記録とマイクロソフト Teams の文字起こし機能を使用し、マイクロソフトCopilot で要約した AI 記録の作業時間を比較した。両者の平均記録時間を算出し、AI 導入による時間短縮効果を評価した。更に、Google Forms を用いて当院薬剤師 10 名を対象に議事概要作成に AI を導入した取り組みについて、業務効率の改善や記録の正確性についてのアンケート調査を行った。\n\n### 結果\n\n手入力の平均記録時間 12 分 11 秒に対し、AI 記録は 4分 41 秒で、平均 7 分 30 秒の時間短縮が認められ、かつ、内容が簡潔にまとまった文章が作成できた。アンケート調査では、議事概要作成に AI を導入してからの業務効率について、80％の人で「大幅に改善した」との回答が得られ、AI が作成した記録の正確性については全員が「だいたい正確」と評価した。一方で「医療用語認識精度の向上」、「発言者の自動識別」など、実務に基づく改善要望も挙がった。\n\n### 考察\n\nAI 導入により議事概要作成の効率化が確認された。しかし、もともと備わっている機能について十分に把握できていないことも明らかとなり、今後は AI の活用方法について個々が学んでいく必要があると考えた。また、発言者識別などの機能を運用に取り入れることで、より正確で有用な記録作成とさらなる業務効率化が期待される。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 既存のTeams文字起こしとCopilot要約を組み合わせ、議事概要の作成時間と職員の評価を比較。\n- 平均7分30秒短縮する一方、医療用語・話者識別に課題。原記録との照合を含む実務の運用方法に注目したい。\n\n", "rec_grade": "C", "rec_perspective": "日常業務AI活用", "rec_reason": "Teams文字起こし＋Copilot要約により朝礼議事録作成時間を平均12分11秒→4分41秒へ短縮。医療用語認識や話者識別など現場ならではの課題も共有。"}, {"id": "P2-132-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-132", "session_name": "AI議事録・フォーミュラリー・中毒・研究体制", "title": "ANCA 関連血管炎におけるアバコパン投与患者の肝機能の評価", "authors": "稲石 千陽（いないし ちはる）、 坂田 峯都紀（さかた みずき）、 千崎 宏樹（せんざき ひろき）、 水津 智樹（すいづ ともき）、 宮部 貴識（みやべ たかし）", "first_author": "稲石 千陽（いないし ちはる）", "affiliations": "NHO 大阪刀根山医療センター 薬剤部", "first_affiliation": "NHO 大阪刀根山医療センター 薬剤部", "printed_pages": "714", "pdf_pages": "470", "features": ["アバコパン使用8名の肝機能と減量・中止の経過をCTCAEで整理した単施設研究。", "肝機能障害による対応例を具体的に確認できる。少数例から発現頻度を一般化せず、併用薬と検査推移を読みたい。"], "issues": [], "sections": [{"heading": "目的", "content": "アバコパンは、ANCA 関連血管炎に対して使用される C5a 受容体拮抗薬である。本剤に関して、重篤な肝機能障害に関する安全性速報が発出され、死亡例も報告された。本研究では、大阪刀根山医療センター（以下、当院）における本剤の使用状況および肝機能障害の発現状況について調査を行った。"}, {"heading": "方法", "content": "2024 年 7 月-2026 年 5 月において、当院で本剤が処方された全症例を対象とし、単施設後ろ向き研究を行った。調査項目は年齢、性別、併用薬、肝機能（AST、ALT、総ビリルビン、ALP）とし、肝機能は CTCAE v5.0 に基づき評価した。"}, {"heading": "結果", "content": "対象患者数は 8 名（男性 3 名、女性 5 名）で年齢中央値は 77 歳であった。投与継続は 4 例、減量継続は 1 例、投与中止は 2 例、原疾患による死亡は 1 例であった。減量継続となった事例では Grade2 の AST 増加および Grade1 の ALT 増加を認めた。投与中止となった事例では、Grade3 の AST・ALT 増加および Grade2 の総ビリルビン増加を認めた。また、口内炎発現により減量中であった 1 例では、肝機能障害に関する報道を受けて患者自身が不安を訴え、主治医との相談の上で投与中止に至った。【考察 本調査では、8 例中 2 例で肝機能障害を認め、うち 1 例は減量、1 例は投与中止に至った。このことから、本剤投与時には導入初期から定期的な肝機能モニタリングを行う重要性が示唆された。また、肝機能障害に関する報道を受け、患者の不安から投与中止に至った症例も認められ、副作用モニタリングに加え、患者へ適切な情報提供を行い、不安に寄り添う対応も重要であると考えられた。今後は、さらなる症例の蓄積を通じて安全性の評価を進めるとともに、継続的な観察が必要である。"}], "body_text": "### 目的\n\nアバコパンは、ANCA 関連血管炎に対して使用される C5a 受容体拮抗薬である。本剤に関して、重篤な肝機能障害に関する安全性速報が発出され、死亡例も報告された。本研究では、大阪刀根山医療センター（以下、当院）における本剤の使用状況および肝機能障害の発現状況について調査を行った。\n\n### 方法\n\n2024 年 7 月-2026 年 5 月において、当院で本剤が処方された全症例を対象とし、単施設後ろ向き研究を行った。調査項目は年齢、性別、併用薬、肝機能（AST、ALT、総ビリルビン、ALP）とし、肝機能は CTCAE v5.0 に基づき評価した。\n\n### 結果\n\n対象患者数は 8 名（男性 3 名、女性 5 名）で年齢中央値は 77 歳であった。投与継続は 4 例、減量継続は 1 例、投与中止は 2 例、原疾患による死亡は 1 例であった。減量継続となった事例では Grade2 の AST 増加および Grade1 の ALT 増加を認めた。投与中止となった事例では、Grade3 の AST・ALT 増加および Grade2 の総ビリルビン増加を認めた。また、口内炎発現により減量中であった 1 例では、肝機能障害に関する報道を受けて患者自身が不安を訴え、主治医との相談の上で投与中止に至った。【考察 本調査では、8 例中 2 例で肝機能障害を認め、うち 1 例は減量、1 例は投与中止に至った。このことから、本剤投与時には導入初期から定期的な肝機能モニタリングを行う重要性が示唆された。また、肝機能障害に関する報道を受け、患者の不安から投与中止に至った症例も認められ、副作用モニタリングに加え、患者へ適切な情報提供を行い、不安に寄り添う対応も重要であると考えられた。今後は、さらなる症例の蓄積を通じて安全性の評価を進めるとともに、継続的な観察が必要である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-132-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [470]\nstatus: \"imported\"\n---\n\n# ANCA 関連血管炎におけるアバコパン投与患者の肝機能の評価\n\n- 演題番号: P2-132-2\n- 演題名: ANCA 関連血管炎におけるアバコパン投与患者の肝機能の評価\n- 所属施設: NHO 大阪刀根山医療センター 薬剤部\n- 筆頭演者: 稲石 千陽（いないし ちはる）\n- 筆頭演者の所属: NHO 大阪刀根山医療センター 薬剤部\n- 演者名: 稲石 千陽（いないし ちはる）、 坂田 峯都紀（さかた みずき）、 千崎 宏樹（せんざき ひろき）、 水津 智樹（すいづ ともき）、 宮部 貴識（みやべ たかし）\n- 原本: [PDF 470ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=470>)\n- 冊子ページ: 714\n\n## 抄録本文\n\n### 目的\n\nアバコパンは、ANCA 関連血管炎に対して使用される C5a 受容体拮抗薬である。本剤に関して、重篤な肝機能障害に関する安全性速報が発出され、死亡例も報告された。本研究では、大阪刀根山医療センター（以下、当院）における本剤の使用状況および肝機能障害の発現状況について調査を行った。\n\n### 方法\n\n2024 年 7 月-2026 年 5 月において、当院で本剤が処方された全症例を対象とし、単施設後ろ向き研究を行った。調査項目は年齢、性別、併用薬、肝機能（AST、ALT、総ビリルビン、ALP）とし、肝機能は CTCAE v5.0 に基づき評価した。\n\n### 結果\n\n対象患者数は 8 名（男性 3 名、女性 5 名）で年齢中央値は 77 歳であった。投与継続は 4 例、減量継続は 1 例、投与中止は 2 例、原疾患による死亡は 1 例であった。減量継続となった事例では Grade2 の AST 増加および Grade1 の ALT 増加を認めた。投与中止となった事例では、Grade3 の AST・ALT 増加および Grade2 の総ビリルビン増加を認めた。また、口内炎発現により減量中であった 1 例では、肝機能障害に関する報道を受けて患者自身が不安を訴え、主治医との相談の上で投与中止に至った。【考察 本調査では、8 例中 2 例で肝機能障害を認め、うち 1 例は減量、1 例は投与中止に至った。このことから、本剤投与時には導入初期から定期的な肝機能モニタリングを行う重要性が示唆された。また、肝機能障害に関する報道を受け、患者の不安から投与中止に至った症例も認められ、副作用モニタリングに加え、患者へ適切な情報提供を行い、不安に寄り添う対応も重要であると考えられた。今後は、さらなる症例の蓄積を通じて安全性の評価を進めるとともに、継続的な観察が必要である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- アバコパン使用8名の肝機能と減量・中止の経過をCTCAEで整理した単施設研究。\n- 肝機能障害による対応例を具体的に確認できる。少数例から発現頻度を一般化せず、併用薬と検査推移を読みたい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-132-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-132", "session_name": "AI議事録・フォーミュラリー・中毒・研究体制", "title": "教育入院で始めるチルセパチド―切替え症例 31 例における BMI 変化―", "authors": "宮坂 公輔（みやさか こうすけ）、 中村 敦士（なかむら あつし）", "first_author": "宮坂 公輔（みやさか こうすけ）", "affiliations": "NHO 大分医療センター 薬剤部", "first_affiliation": "NHO 大分医療センター 薬剤部", "printed_pages": "714", "pdf_pages": "470", "features": ["糖尿病教育入院でチルセパチドを開始・変更した31例のBMI変化を、前治療やC-ペプチド等と検討。", "短い入院期間内の変化であり、教育・食事療法等の影響も含む。薬剤単独の効果と区別して切替時の管理に注目したい。"], "issues": [], "sections": [{"heading": "目的", "content": "チルセパチドの強力な体重減少作用・血糖降下作用が注目されている。臨床における他剤からの切替え症例は十分とは言えない。本研究では既存薬からチルセパチドへ変更した31 例を対象に後方視的に BMI 変化や HbA1c 等の変化及び背景を比較検討した。"}, {"heading": "方法", "content": "2024 年 7 月から 2026 年 3 月までの当院に教育入院し、チルセパチド 2.5mg を開始、変更した 31 例を対象に年齢、性別、BMI 変化、HbA1c、併用薬、切替え前の薬剤、尿中 C-ペプチド、副作用の有無を後方視的に調査した。透析患者、教育入院以外の新規開始者は除外した。"}, {"heading": "結果", "content": "対象は 31 名（男性 20 名、女性 11 名）、平均年齢 53.5±19.5 歳（22〜87 歳）、平均入院期間 17.3 日あった。BMI は入院時 29.98 から退院時 28.85 へ低下し、平均変化量は−1.14（約 4.0％減少）であった。尿中 C-ペプチド高値群（減少量 1.20）と低値群（同1.70）で BMI 減少効果に大きな差は認められなかった。切替え前治療薬は DPP-4 阻害薬が27 例（BMI 変化−1.18）、GLP-1 受容体作動薬が 4 例（同−1.13）で、切替え元による差は認められなかった。副作用は 11 例（35.5％）認め、食欲不振、腹部膨満感、悪心等の消化器症状あった。GLP-1 受容体作動薬からの切替え 1 例で低血糖を認めた。"}, {"heading": "考察", "content": "本研究では年齢やインスリン分泌能にかかわらず BMI 低下が認められ、導入は有効である可能性が示唆された。DPP-4 阻害薬および GLP-1 受容体作動薬からの切替えでは、BMI 変化や副作用に大きな差はなく切替えによる影響は限定的と考えられる。週 1 回投与で血糖管理が可能である点はアドヒアランス向上の観点から有用であり、薬剤師による積極的な処方提案が重要である。症例数が少ないため、今後さらなる検討が必要である。"}], "body_text": "### 目的\n\nチルセパチドの強力な体重減少作用・血糖降下作用が注目されている。臨床における他剤からの切替え症例は十分とは言えない。本研究では既存薬からチルセパチドへ変更した31 例を対象に後方視的に BMI 変化や HbA1c 等の変化及び背景を比較検討した。\n\n### 方法\n\n2024 年 7 月から 2026 年 3 月までの当院に教育入院し、チルセパチド 2.5mg を開始、変更した 31 例を対象に年齢、性別、BMI 変化、HbA1c、併用薬、切替え前の薬剤、尿中 C-ペプチド、副作用の有無を後方視的に調査した。透析患者、教育入院以外の新規開始者は除外した。\n\n### 結果\n\n対象は 31 名（男性 20 名、女性 11 名）、平均年齢 53.5±19.5 歳（22〜87 歳）、平均入院期間 17.3 日あった。BMI は入院時 29.98 から退院時 28.85 へ低下し、平均変化量は−1.14（約 4.0％減少）であった。尿中 C-ペプチド高値群（減少量 1.20）と低値群（同1.70）で BMI 減少効果に大きな差は認められなかった。切替え前治療薬は DPP-4 阻害薬が27 例（BMI 変化−1.18）、GLP-1 受容体作動薬が 4 例（同−1.13）で、切替え元による差は認められなかった。副作用は 11 例（35.5％）認め、食欲不振、腹部膨満感、悪心等の消化器症状あった。GLP-1 受容体作動薬からの切替え 1 例で低血糖を認めた。\n\n### 考察\n\n本研究では年齢やインスリン分泌能にかかわらず BMI 低下が認められ、導入は有効である可能性が示唆された。DPP-4 阻害薬および GLP-1 受容体作動薬からの切替えでは、BMI 変化や副作用に大きな差はなく切替えによる影響は限定的と考えられる。週 1 回投与で血糖管理が可能である点はアドヒアランス向上の観点から有用であり、薬剤師による積極的な処方提案が重要である。症例数が少ないため、今後さらなる検討が必要である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-132-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [470]\nstatus: \"imported\"\n---\n\n# 教育入院で始めるチルセパチド―切替え症例 31 例における BMI 変化―\n\n- 演題番号: P2-132-3\n- 演題名: 教育入院で始めるチルセパチド―切替え症例 31 例における BMI 変化―\n- 所属施設: NHO 大分医療センター 薬剤部\n- 筆頭演者: 宮坂 公輔（みやさか こうすけ）\n- 筆頭演者の所属: NHO 大分医療センター 薬剤部\n- 演者名: 宮坂 公輔（みやさか こうすけ）、 中村 敦士（なかむら あつし）\n- 原本: [PDF 470ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=470>)\n- 冊子ページ: 714\n\n## 抄録本文\n\n### 目的\n\nチルセパチドの強力な体重減少作用・血糖降下作用が注目されている。臨床における他剤からの切替え症例は十分とは言えない。本研究では既存薬からチルセパチドへ変更した31 例を対象に後方視的に BMI 変化や HbA1c 等の変化及び背景を比較検討した。\n\n### 方法\n\n2024 年 7 月から 2026 年 3 月までの当院に教育入院し、チルセパチド 2.5mg を開始、変更した 31 例を対象に年齢、性別、BMI 変化、HbA1c、併用薬、切替え前の薬剤、尿中 C-ペプチド、副作用の有無を後方視的に調査した。透析患者、教育入院以外の新規開始者は除外した。\n\n### 結果\n\n対象は 31 名（男性 20 名、女性 11 名）、平均年齢 53.5±19.5 歳（22〜87 歳）、平均入院期間 17.3 日あった。BMI は入院時 29.98 から退院時 28.85 へ低下し、平均変化量は−1.14（約 4.0％減少）であった。尿中 C-ペプチド高値群（減少量 1.20）と低値群（同1.70）で BMI 減少効果に大きな差は認められなかった。切替え前治療薬は DPP-4 阻害薬が27 例（BMI 変化−1.18）、GLP-1 受容体作動薬が 4 例（同−1.13）で、切替え元による差は認められなかった。副作用は 11 例（35.5％）認め、食欲不振、腹部膨満感、悪心等の消化器症状あった。GLP-1 受容体作動薬からの切替え 1 例で低血糖を認めた。\n\n### 考察\n\n本研究では年齢やインスリン分泌能にかかわらず BMI 低下が認められ、導入は有効である可能性が示唆された。DPP-4 阻害薬および GLP-1 受容体作動薬からの切替えでは、BMI 変化や副作用に大きな差はなく切替えによる影響は限定的と考えられる。週 1 回投与で血糖管理が可能である点はアドヒアランス向上の観点から有用であり、薬剤師による積極的な処方提案が重要である。症例数が少ないため、今後さらなる検討が必要である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 糖尿病教育入院でチルセパチドを開始・変更した31例のBMI変化を、前治療やC-ペプチド等と検討。\n- 短い入院期間内の変化であり、教育・食事療法等の影響も含む。薬剤単独の効果と区別して切替時の管理に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-132-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-132", "session_name": "AI議事録・フォーミュラリー・中毒・研究体制", "title": "PPI フォーミュラリー導入下における薬剤師の処方提案が処方行動および薬剤費に与える影響", "authors": "林 南々子（はやし ななこ）、 大月 慎之介（おおつき しんのすけ）、安 達 尚哉（あだち なおや）、 山本 吉章（やまもと よしあき）、 三井 陽二（みつい ようじ）", "first_author": "林 南々子（はやし ななこ）", "affiliations": "NHO 金沢医療センター 薬剤部", "first_affiliation": "NHO 金沢医療センター 薬剤部", "printed_pages": "714", "pdf_pages": "470", "features": ["PPIフォーミュラリーを、電子カルテでコピー可能な代替処方案の提示により実装する取り組み。", "処方割合と1日当たり薬剤費の変化を報告。医師が採用しやすい提案形式と、切替対象の選定が参考となる。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "当院では 2022 年 9 月より、薬剤費の適正化および処方の標準化を目的として、プロトンポンプ阻害薬（PPI）フォーミュラリーを導入し、エソメプラゾールカプセル20 mg を第一選択薬とした。しかし、2025 年 4 月から 8 月の実績では、推奨薬への集約は十分ではなかった。本研究では、薬剤師の処方提案が医師の処方行動および薬剤費に与える影響を検討した。"}, {"heading": "方法", "content": "当院では持参薬鑑別後、薬剤師が電子カルテ上でコピー可能な形式で代替処方案を提示し、医師が妥当と判断した場合に採用する運用としている。2026 年9 月より、持参薬がタケキャブ錠 10 mg である症例に対し、第一選択薬であるエソメプラゾールカプセル 20 mg への変更提案を実施した。介入前（2026 年 4 月から 8 月）および介入後（2026 年 9 月から 2027 年 1 月）における PPI の使用割合および 1 日当たり薬剤費を比較した。"}, {"heading": "結果", "content": "介入前後を比較し、タケキャブ錠 10 mg は 48％から 35％、エソメプラゾールカプセル 20 mg は 15％から 29％、ランソプラゾール OD 錠 15 mg は 26％から24％、ラベプラゾール錠 10 mg は 10％から 8％、パリエット錠 5 mg は 1％から 1％、ネキシウム懸濁用顆粒 20 mg は 0％から 3％となった。また、PPI の 1 日当たり薬剤費は64.0 円から 56.2 円へ低下した。"}, {"heading": "考察", "content": "第一選択薬としたエソメプラゾールカプセル 20 mg への処方集約が進み、薬剤師による処方提案は医師の処方行動の変容に寄与したと考えられた。さらに、薬剤費の低減も認められ、処方の標準化と医療経済性の両立に有効な介入であることが示唆された。"}], "body_text": "### 背景・目的\n\n当院では 2022 年 9 月より、薬剤費の適正化および処方の標準化を目的として、プロトンポンプ阻害薬（PPI）フォーミュラリーを導入し、エソメプラゾールカプセル20 mg を第一選択薬とした。しかし、2025 年 4 月から 8 月の実績では、推奨薬への集約は十分ではなかった。本研究では、薬剤師の処方提案が医師の処方行動および薬剤費に与える影響を検討した。\n\n### 方法\n\n当院では持参薬鑑別後、薬剤師が電子カルテ上でコピー可能な形式で代替処方案を提示し、医師が妥当と判断した場合に採用する運用としている。2026 年9 月より、持参薬がタケキャブ錠 10 mg である症例に対し、第一選択薬であるエソメプラゾールカプセル 20 mg への変更提案を実施した。介入前（2026 年 4 月から 8 月）および介入後（2026 年 9 月から 2027 年 1 月）における PPI の使用割合および 1 日当たり薬剤費を比較した。\n\n### 結果\n\n介入前後を比較し、タケキャブ錠 10 mg は 48％から 35％、エソメプラゾールカプセル 20 mg は 15％から 29％、ランソプラゾール OD 錠 15 mg は 26％から24％、ラベプラゾール錠 10 mg は 10％から 8％、パリエット錠 5 mg は 1％から 1％、ネキシウム懸濁用顆粒 20 mg は 0％から 3％となった。また、PPI の 1 日当たり薬剤費は64.0 円から 56.2 円へ低下した。\n\n### 考察\n\n第一選択薬としたエソメプラゾールカプセル 20 mg への処方集約が進み、薬剤師による処方提案は医師の処方行動の変容に寄与したと考えられた。さらに、薬剤費の低減も認められ、処方の標準化と医療経済性の両立に有効な介入であることが示唆された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-132-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [470]\nstatus: \"imported\"\n---\n\n# PPI フォーミュラリー導入下における薬剤師の処方提案が処方行動および薬剤費に与える影響\n\n- 演題番号: P2-132-4\n- 演題名: PPI フォーミュラリー導入下における薬剤師の処方提案が処方行動および薬剤費に与える影響\n- 所属施設: NHO 金沢医療センター 薬剤部\n- 筆頭演者: 林 南々子（はやし ななこ）\n- 筆頭演者の所属: NHO 金沢医療センター 薬剤部\n- 演者名: 林 南々子（はやし ななこ）、 大月 慎之介（おおつき しんのすけ）、安 達 尚哉（あだち なおや）、 山本 吉章（やまもと よしあき）、 三井 陽二（みつい ようじ）\n- 原本: [PDF 470ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=470>)\n- 冊子ページ: 714\n\n## 抄録本文\n\n### 背景・目的\n\n当院では 2022 年 9 月より、薬剤費の適正化および処方の標準化を目的として、プロトンポンプ阻害薬（PPI）フォーミュラリーを導入し、エソメプラゾールカプセル20 mg を第一選択薬とした。しかし、2025 年 4 月から 8 月の実績では、推奨薬への集約は十分ではなかった。本研究では、薬剤師の処方提案が医師の処方行動および薬剤費に与える影響を検討した。\n\n### 方法\n\n当院では持参薬鑑別後、薬剤師が電子カルテ上でコピー可能な形式で代替処方案を提示し、医師が妥当と判断した場合に採用する運用としている。2026 年9 月より、持参薬がタケキャブ錠 10 mg である症例に対し、第一選択薬であるエソメプラゾールカプセル 20 mg への変更提案を実施した。介入前（2026 年 4 月から 8 月）および介入後（2026 年 9 月から 2027 年 1 月）における PPI の使用割合および 1 日当たり薬剤費を比較した。\n\n### 結果\n\n介入前後を比較し、タケキャブ錠 10 mg は 48％から 35％、エソメプラゾールカプセル 20 mg は 15％から 29％、ランソプラゾール OD 錠 15 mg は 26％から24％、ラベプラゾール錠 10 mg は 10％から 8％、パリエット錠 5 mg は 1％から 1％、ネキシウム懸濁用顆粒 20 mg は 0％から 3％となった。また、PPI の 1 日当たり薬剤費は64.0 円から 56.2 円へ低下した。\n\n### 考察\n\n第一選択薬としたエソメプラゾールカプセル 20 mg への処方集約が進み、薬剤師による処方提案は医師の処方行動の変容に寄与したと考えられた。さらに、薬剤費の低減も認められ、処方の標準化と医療経済性の両立に有効な介入であることが示唆された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- PPIフォーミュラリーを、電子カルテでコピー可能な代替処方案の提示により実装する取り組み。\n- 処方割合と1日当たり薬剤費の変化を報告。医師が採用しやすい提案形式と、切替対象の選定が参考となる。\n\n", "rec_grade": "B", "rec_perspective": "フォーミュラリー実装", "rec_reason": "形骸化しがちなフォーミュラリーに対し、持参薬鑑別後に「電子カルテ上でコピー可能な代替処方案」を提示する運用で、ボノプラザン48→35%、エソメプラゾール15→29%へ処方行動を変容。"}, {"id": "P2-132-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-132", "session_name": "AI議事録・フォーミュラリー・中毒・研究体制", "title": "当院で応需している急性中毒患者の実態調査", "authors": "藤田 孝幸（ふじた たかゆき） 1、 前田 龍人（まえだ りゅうと） 1、信 岡 希呼（のぶおか きこ） 2、 佐藤 岳春（さとう たけはる）1 、 前岡 遼祐（まえおか りょうすけ） 1、 西本 凜（にしもと りん） 1、 宮川 貴行（みやかわ たかゆき） 1、 川崎 元弘（かわさき もとひろ） 1、 西澤 修一（にしざわ しゅういち） 1", "first_author": "藤田 孝幸（ふじた たかゆき） 1", "affiliations": "1 NHO 岩国医療センター 薬剤部、2 NHO 岩国医療センター 管理課", "first_affiliation": "NHO 岩国医療センター 薬剤部", "printed_pages": "714", "pdf_pages": "470", "features": ["急性中毒患者の実態に加え、専門資格を持つ薬剤師の赴任前後で介入と記録内容の変化を検討。", "薬物動態・検査・解毒薬の記録が充実した点を提示。夜間対応の標準化と専門知識の部署内共有に注目できる。"], "issues": [], "sections": [{"heading": "背景", "content": "当院における急性中毒患者への対応は薬剤師により差が生じ、夜間の業務軽減のため原則的に中毒 110 番への連絡を医師に依頼している。今回、当院で応需している急性中毒患者の傾向を把握し、今後の薬剤師業務に活用することを期待して現状調査した。"}, {"heading": "方法", "content": "2023年度から 2025 年度に、当院で応需した急性アルコール中毒を除く中毒患者の電子カルテ内容を後方視的に調査した。また認定クリニカルトキシコロジストの資格を持つ薬剤師（有資格者）の赴任前後で薬剤師のカルテ記述内容に変化がないか調査した。"}, {"heading": "結果", "content": "性別は女性61 名、男性 33 名だった。入院日数は 2〜3 日、入院中の精神科受診件数は 6→4→2 件と減少していた。精神疾患を基礎疾患にもつ患者数は減少傾向だが、希死念慮等を動機とした過量内服が多かった。中毒起因物質はベンゾジアゼピン系薬や抗てんかん薬、アセトアミノフェン等、患者の処方薬に準じた薬剤を使用していた。解毒拮抗薬は概ねアセトアミノフェン中毒患者への N-アセチルシステインの使用が占めていた。合併症は肺炎、電解質異常、消化器症状だった。有資格者赴任前後の変化は、全体の介入数が 42％→63％へ増加した。介入内容は、薬物動態に関する記録が 18.8％→60％、検査値や副作用等の確認記録が 25％→60％、解毒拮抗薬等に関しての記録は 6.3％→60％に増加した。"}, {"heading": "考察", "content": "当院で応需している中毒患者の傾向が分かり、今後の対応に繋げられると考えられる。また有資格者の赴任後は、介入内容の充実化の傾向がみられた。有資格者による他の薬剤師のスキルアップも今後期待したい。"}], "body_text": "### 背景\n\n当院における急性中毒患者への対応は薬剤師により差が生じ、夜間の業務軽減のため原則的に中毒 110 番への連絡を医師に依頼している。今回、当院で応需している急性中毒患者の傾向を把握し、今後の薬剤師業務に活用することを期待して現状調査した。\n\n### 方法\n\n2023年度から 2025 年度に、当院で応需した急性アルコール中毒を除く中毒患者の電子カルテ内容を後方視的に調査した。また認定クリニカルトキシコロジストの資格を持つ薬剤師（有資格者）の赴任前後で薬剤師のカルテ記述内容に変化がないか調査した。\n\n### 結果\n\n性別は女性61 名、男性 33 名だった。入院日数は 2〜3 日、入院中の精神科受診件数は 6→4→2 件と減少していた。精神疾患を基礎疾患にもつ患者数は減少傾向だが、希死念慮等を動機とした過量内服が多かった。中毒起因物質はベンゾジアゼピン系薬や抗てんかん薬、アセトアミノフェン等、患者の処方薬に準じた薬剤を使用していた。解毒拮抗薬は概ねアセトアミノフェン中毒患者への N-アセチルシステインの使用が占めていた。合併症は肺炎、電解質異常、消化器症状だった。有資格者赴任前後の変化は、全体の介入数が 42％→63％へ増加した。介入内容は、薬物動態に関する記録が 18.8％→60％、検査値や副作用等の確認記録が 25％→60％、解毒拮抗薬等に関しての記録は 6.3％→60％に増加した。\n\n### 考察\n\n当院で応需している中毒患者の傾向が分かり、今後の対応に繋げられると考えられる。また有資格者の赴任後は、介入内容の充実化の傾向がみられた。有資格者による他の薬剤師のスキルアップも今後期待したい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-132-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [470]\nstatus: \"imported\"\n---\n\n# 当院で応需している急性中毒患者の実態調査\n\n- 演題番号: P2-132-5\n- 演題名: 当院で応需している急性中毒患者の実態調査\n- 所属施設: 1 NHO 岩国医療センター 薬剤部、2 NHO 岩国医療センター 管理課\n- 筆頭演者: 藤田 孝幸（ふじた たかゆき） 1\n- 筆頭演者の所属: NHO 岩国医療センター 薬剤部\n- 演者名: 藤田 孝幸（ふじた たかゆき） 1、 前田 龍人（まえだ りゅうと） 1、信 岡 希呼（のぶおか きこ） 2、 佐藤 岳春（さとう たけはる）1 、 前岡 遼祐（まえおか りょうすけ） 1、 西本 凜（にしもと りん） 1、 宮川 貴行（みやかわ たかゆき） 1、 川崎 元弘（かわさき もとひろ） 1、 西澤 修一（にしざわ しゅういち） 1\n- 原本: [PDF 470ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=470>)\n- 冊子ページ: 714\n\n## 抄録本文\n\n### 背景\n\n当院における急性中毒患者への対応は薬剤師により差が生じ、夜間の業務軽減のため原則的に中毒 110 番への連絡を医師に依頼している。今回、当院で応需している急性中毒患者の傾向を把握し、今後の薬剤師業務に活用することを期待して現状調査した。\n\n### 方法\n\n2023年度から 2025 年度に、当院で応需した急性アルコール中毒を除く中毒患者の電子カルテ内容を後方視的に調査した。また認定クリニカルトキシコロジストの資格を持つ薬剤師（有資格者）の赴任前後で薬剤師のカルテ記述内容に変化がないか調査した。\n\n### 結果\n\n性別は女性61 名、男性 33 名だった。入院日数は 2〜3 日、入院中の精神科受診件数は 6→4→2 件と減少していた。精神疾患を基礎疾患にもつ患者数は減少傾向だが、希死念慮等を動機とした過量内服が多かった。中毒起因物質はベンゾジアゼピン系薬や抗てんかん薬、アセトアミノフェン等、患者の処方薬に準じた薬剤を使用していた。解毒拮抗薬は概ねアセトアミノフェン中毒患者への N-アセチルシステインの使用が占めていた。合併症は肺炎、電解質異常、消化器症状だった。有資格者赴任前後の変化は、全体の介入数が 42％→63％へ増加した。介入内容は、薬物動態に関する記録が 18.8％→60％、検査値や副作用等の確認記録が 25％→60％、解毒拮抗薬等に関しての記録は 6.3％→60％に増加した。\n\n### 考察\n\n当院で応需している中毒患者の傾向が分かり、今後の対応に繋げられると考えられる。また有資格者の赴任後は、介入内容の充実化の傾向がみられた。有資格者による他の薬剤師のスキルアップも今後期待したい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 急性中毒患者の実態に加え、専門資格を持つ薬剤師の赴任前後で介入と記録内容の変化を検討。\n- 薬物動態・検査・解毒薬の記録が充実した点を提示。夜間対応の標準化と専門知識の部署内共有に注目できる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-132-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-132", "session_name": "AI議事録・フォーミュラリー・中毒・研究体制", "title": "認知症ケアチーム主導不眠時指示プロトコルの運用前後のインシデント件数及び睡眠薬使用量の変化", "authors": "丹羽 貴郎（にわ たかお）、 伊東 幸子（いとう ゆきこ）、 山内 典子（やまうち のりこ）、 黒田 勝宏（くろだ かつひろ）、 稲垣 雄一（いながき ゆういち）、 座光寺 伸幸（ざこうじ のぶゆき）、古 屋 裕之（ふるや ひろゆき）", "first_author": "丹羽 貴郎（にわ たかお）", "affiliations": "NHO 静岡医療センター 薬剤科", "first_affiliation": "NHO 静岡医療センター 薬剤科", "printed_pages": "715", "pdf_pages": "471", "features": ["認知症ケアチームによる不眠時指示プロトコルを、睡眠薬使用量・転倒転落・せん妄介入件数から評価。", "薬剤使用の変化と安全指標を併せて捉える実務報告。前後の患者構成や他の対策も含め、変化の要因を確認したい。"], "issues": ["原文は使用量の比を「実施前/実施後」と記す一方、1572/1009を約1.56倍の増加、630/899を約0.7倍の減少と説明している。数値の前後順序は[要確認]。原文の表記を保持した。"], "sections": [{"heading": "背景・目的", "content": "当院では、2024 年 1 月より不眠時指示プロトコルを実施し、患者の不眠・不穏時の対応として、BZ 系薬剤よりも転倒転落・せん妄リスクが比較的少ないとされるオレキシン受容体拮抗薬の推奨を行ってきた。以前、プロトコル実施 3 か月前後での睡眠薬使用量及び転倒転落インシデント件数を比較したが短期的な評価となったため、プロトコル導入効果の再評価が必要と考えられた。本研究では、プロトコル実施前後 27 か月での睡眠薬使用量及び転倒転落インシデント件数の再比較を行った。"}, {"heading": "方法", "content": "本プロトコルは 2024 年 1月に運用開始されたため、調査期間を実施前後 27 カ月（前：2021.10-2023.12、後：2024.1-2026.3）とした。不眠症適応のある採用薬を睡眠薬使用量として集計し、使用量と変化の調査、及び 24・25 年度での転倒転落インシデント件数の比較を行った。また、せん妄対策チームの介入件数も調査した。"}, {"heading": "結果", "content": "プロトコル運用開始前後でオレキシン受容体拮抗薬の月平均使用量（実施前/実施後【錠】）は、約 1.56 倍（1572/1009【錠】）に増加した。一方、BZ 系薬剤は、約 0.7 倍（630/899【錠】）に減少した。転倒転落インシデント件数は、BZ 系薬剤服用患者において、プロトコル開始前後で 16 件から 6 件に減少した。せん妄対策チームの介入件数は、24・25 年度で 11 件から 5 件へ減少した。"}, {"heading": "考察", "content": "本プロトコルの実施後、BZ 系薬剤の使用量の減少とともに、BZ 系薬剤使用者の転倒転落インシデントおよびせん妄対策チームの介入件数の減少が見られた。因果関係は検証できていないが、BZ 系薬剤は転倒転落・せん妄のリスク因子として知られており、BZ 系薬剤の使用量の減少がこれらの結果の要因の一つとして考えられた。"}], "body_text": "### 背景・目的\n\n当院では、2024 年 1 月より不眠時指示プロトコルを実施し、患者の不眠・不穏時の対応として、BZ 系薬剤よりも転倒転落・せん妄リスクが比較的少ないとされるオレキシン受容体拮抗薬の推奨を行ってきた。以前、プロトコル実施 3 か月前後での睡眠薬使用量及び転倒転落インシデント件数を比較したが短期的な評価となったため、プロトコル導入効果の再評価が必要と考えられた。本研究では、プロトコル実施前後 27 か月での睡眠薬使用量及び転倒転落インシデント件数の再比較を行った。\n\n### 方法\n\n本プロトコルは 2024 年 1月に運用開始されたため、調査期間を実施前後 27 カ月（前：2021.10-2023.12、後：2024.1-2026.3）とした。不眠症適応のある採用薬を睡眠薬使用量として集計し、使用量と変化の調査、及び 24・25 年度での転倒転落インシデント件数の比較を行った。また、せん妄対策チームの介入件数も調査した。\n\n### 結果\n\nプロトコル運用開始前後でオレキシン受容体拮抗薬の月平均使用量（実施前/実施後【錠】）は、約 1.56 倍（1572/1009【錠】）に増加した。一方、BZ 系薬剤は、約 0.7 倍（630/899【錠】）に減少した。転倒転落インシデント件数は、BZ 系薬剤服用患者において、プロトコル開始前後で 16 件から 6 件に減少した。せん妄対策チームの介入件数は、24・25 年度で 11 件から 5 件へ減少した。\n\n### 考察\n\n本プロトコルの実施後、BZ 系薬剤の使用量の減少とともに、BZ 系薬剤使用者の転倒転落インシデントおよびせん妄対策チームの介入件数の減少が見られた。因果関係は検証できていないが、BZ 系薬剤は転倒転落・せん妄のリスク因子として知られており、BZ 系薬剤の使用量の減少がこれらの結果の要因の一つとして考えられた。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-132-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [471]\nstatus: \"needs-review\"\n---\n\n# 認知症ケアチーム主導不眠時指示プロトコルの運用前後のインシデント件数及び睡眠薬使用量の変化\n\n- 演題番号: P2-132-6\n- 演題名: 認知症ケアチーム主導不眠時指示プロトコルの運用前後のインシデント件数及び睡眠薬使用量の変化\n- 所属施設: NHO 静岡医療センター 薬剤科\n- 筆頭演者: 丹羽 貴郎（にわ たかお）\n- 筆頭演者の所属: NHO 静岡医療センター 薬剤科\n- 演者名: 丹羽 貴郎（にわ たかお）、 伊東 幸子（いとう ゆきこ）、 山内 典子（やまうち のりこ）、 黒田 勝宏（くろだ かつひろ）、 稲垣 雄一（いながき ゆういち）、 座光寺 伸幸（ざこうじ のぶゆき）、古 屋 裕之（ふるや ひろゆき）\n- 原本: [PDF 471ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=471>)\n- 冊子ページ: 715\n\n## 要確認\n\n- 原文は使用量の比を「実施前/実施後」と記す一方、1572/1009を約1.56倍の増加、630/899を約0.7倍の減少と説明している。数値の前後順序は\\[要確認\\]。原文の表記を保持した。\n\n## 抄録本文\n\n### 背景・目的\n\n当院では、2024 年 1 月より不眠時指示プロトコルを実施し、患者の不眠・不穏時の対応として、BZ 系薬剤よりも転倒転落・せん妄リスクが比較的少ないとされるオレキシン受容体拮抗薬の推奨を行ってきた。以前、プロトコル実施 3 か月前後での睡眠薬使用量及び転倒転落インシデント件数を比較したが短期的な評価となったため、プロトコル導入効果の再評価が必要と考えられた。本研究では、プロトコル実施前後 27 か月での睡眠薬使用量及び転倒転落インシデント件数の再比較を行った。\n\n### 方法\n\n本プロトコルは 2024 年 1月に運用開始されたため、調査期間を実施前後 27 カ月（前：2021.10-2023.12、後：2024.1-2026.3）とした。不眠症適応のある採用薬を睡眠薬使用量として集計し、使用量と変化の調査、及び 24・25 年度での転倒転落インシデント件数の比較を行った。また、せん妄対策チームの介入件数も調査した。\n\n### 結果\n\nプロトコル運用開始前後でオレキシン受容体拮抗薬の月平均使用量（実施前/実施後【錠】）は、約 1.56 倍（1572/1009【錠】）に増加した。一方、BZ 系薬剤は、約 0.7 倍（630/899【錠】）に減少した。転倒転落インシデント件数は、BZ 系薬剤服用患者において、プロトコル開始前後で 16 件から 6 件に減少した。せん妄対策チームの介入件数は、24・25 年度で 11 件から 5 件へ減少した。\n\n### 考察\n\n本プロトコルの実施後、BZ 系薬剤の使用量の減少とともに、BZ 系薬剤使用者の転倒転落インシデントおよびせん妄対策チームの介入件数の減少が見られた。因果関係は検証できていないが、BZ 系薬剤は転倒転落・せん妄のリスク因子として知られており、BZ 系薬剤の使用量の減少がこれらの結果の要因の一つとして考えられた。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 認知症ケアチームによる不眠時指示プロトコルを、睡眠薬使用量・転倒転落・せん妄介入件数から評価。\n- 薬剤使用の変化と安全指標を併せて捉える実務報告。前後の患者構成や他の対策も含め、変化の要因を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-132-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-132", "session_name": "AI議事録・フォーミュラリー・中毒・研究体制", "title": "人工呼吸器の加湿に用いる注射用水プラボトル 500mL からソフトバック1000mL へ規格変更に伴う看護師の業務負担軽減などについての調査", "authors": "川村 萌人（かわむら もえと） 1、 桑原 貴美子（くわはら きみこ） 1、 長 俊太郎（ちょう しゅんたろう） 2、 竹添 達也（たけぞえ たつや） 1", "first_author": "川村 萌人（かわむら もえと） 1", "affiliations": "1 NHO 福岡病院 薬剤部、2 NHO 福岡病院 医療安全管理室", "first_affiliation": "NHO 福岡病院 薬剤部", "printed_pages": "715", "pdf_pages": "471", "features": ["人工呼吸器加湿用の注射用水を大容量ソフトバッグへ変更し、看護師負担・購入費・廃棄量を評価。", "交換頻度やごみのかさまで含む職種横断の改善。規格選択を供給・作業・環境負担の両面から考える材料となる。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "2024 年 4 月より薬剤部と臨床工学技士の試みで、人工呼吸器使用患者への加湿に用いる注射用水について、大塚蒸留水プラボトル 500mL から注射用水ソフトバック「フソー」1000mL へ変更を行った。変更により、注射用水の交換頻度を減らすことができるなど看護師の業務負担軽減が期待される。そこで今回、看護師の業務負担軽減、薬剤購入費や使用後のごみの量に変化があったのか調査を行った。"}, {"heading": "方法", "content": "看護師の業務負担：アンケート調査を実施薬剤購入費：過去 1 年間の薬剤購入費の比較使用後のごみの量：実際にプラボトルとソフトバックの廃棄量を比較"}, {"heading": "結果", "content": "重症心身障害者の病棟である 5 病棟（32名）6 病棟（16 名）の看護師より回答を得た。看護師の業務負担について 8 割以上が業務負担軽減になったと回答があった。また、交換頻度が減った、廃棄ボックスがかさばらない、空焚きがなくなったなどの意見もあった。薬剤購入費や使用後の廃棄量に関しても規格変更に伴い削減に繋がった。"}, {"heading": "考察", "content": "今回の取り組みは、他職種との連携によりタスクシフトやタスクシェアといった負担を分散化することなく規格の院内採用変更という介入を行ったが、費用をかけず、少ない時間と労力で病院全体への大きな貢献に繋がった一例であった。日頃、自部署内で解決策が見つからないことについて他職種に相談を行い、他部署であっても気づいたことを助言、協力する姿勢が大切であると学んだ。本結果が、まだ見つかっていない課題に対して今後の契機になればと考える。"}], "body_text": "### 背景・目的\n\n2024 年 4 月より薬剤部と臨床工学技士の試みで、人工呼吸器使用患者への加湿に用いる注射用水について、大塚蒸留水プラボトル 500mL から注射用水ソフトバック「フソー」1000mL へ変更を行った。変更により、注射用水の交換頻度を減らすことができるなど看護師の業務負担軽減が期待される。そこで今回、看護師の業務負担軽減、薬剤購入費や使用後のごみの量に変化があったのか調査を行った。\n\n### 方法\n\n看護師の業務負担：アンケート調査を実施薬剤購入費：過去 1 年間の薬剤購入費の比較使用後のごみの量：実際にプラボトルとソフトバックの廃棄量を比較\n\n### 結果\n\n重症心身障害者の病棟である 5 病棟（32名）6 病棟（16 名）の看護師より回答を得た。看護師の業務負担について 8 割以上が業務負担軽減になったと回答があった。また、交換頻度が減った、廃棄ボックスがかさばらない、空焚きがなくなったなどの意見もあった。薬剤購入費や使用後の廃棄量に関しても規格変更に伴い削減に繋がった。\n\n### 考察\n\n今回の取り組みは、他職種との連携によりタスクシフトやタスクシェアといった負担を分散化することなく規格の院内採用変更という介入を行ったが、費用をかけず、少ない時間と労力で病院全体への大きな貢献に繋がった一例であった。日頃、自部署内で解決策が見つからないことについて他職種に相談を行い、他部署であっても気づいたことを助言、協力する姿勢が大切であると学んだ。本結果が、まだ見つかっていない課題に対して今後の契機になればと考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-132-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [471]\nstatus: \"imported\"\n---\n\n# 人工呼吸器の加湿に用いる注射用水プラボトル 500mL からソフトバック1000mL へ規格変更に伴う看護師の業務負担軽減などについての調査\n\n- 演題番号: P2-132-7\n- 演題名: 人工呼吸器の加湿に用いる注射用水プラボトル 500mL からソフトバック1000mL へ規格変更に伴う看護師の業務負担軽減などについての調査\n- 所属施設: 1 NHO 福岡病院 薬剤部、2 NHO 福岡病院 医療安全管理室\n- 筆頭演者: 川村 萌人（かわむら もえと） 1\n- 筆頭演者の所属: NHO 福岡病院 薬剤部\n- 演者名: 川村 萌人（かわむら もえと） 1、 桑原 貴美子（くわはら きみこ） 1、 長 俊太郎（ちょう しゅんたろう） 2、 竹添 達也（たけぞえ たつや） 1\n- 原本: [PDF 471ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=471>)\n- 冊子ページ: 715\n\n## 抄録本文\n\n### 背景・目的\n\n2024 年 4 月より薬剤部と臨床工学技士の試みで、人工呼吸器使用患者への加湿に用いる注射用水について、大塚蒸留水プラボトル 500mL から注射用水ソフトバック「フソー」1000mL へ変更を行った。変更により、注射用水の交換頻度を減らすことができるなど看護師の業務負担軽減が期待される。そこで今回、看護師の業務負担軽減、薬剤購入費や使用後のごみの量に変化があったのか調査を行った。\n\n### 方法\n\n看護師の業務負担：アンケート調査を実施薬剤購入費：過去 1 年間の薬剤購入費の比較使用後のごみの量：実際にプラボトルとソフトバックの廃棄量を比較\n\n### 結果\n\n重症心身障害者の病棟である 5 病棟（32名）6 病棟（16 名）の看護師より回答を得た。看護師の業務負担について 8 割以上が業務負担軽減になったと回答があった。また、交換頻度が減った、廃棄ボックスがかさばらない、空焚きがなくなったなどの意見もあった。薬剤購入費や使用後の廃棄量に関しても規格変更に伴い削減に繋がった。\n\n### 考察\n\n今回の取り組みは、他職種との連携によりタスクシフトやタスクシェアといった負担を分散化することなく規格の院内採用変更という介入を行ったが、費用をかけず、少ない時間と労力で病院全体への大きな貢献に繋がった一例であった。日頃、自部署内で解決策が見つからないことについて他職種に相談を行い、他部署であっても気づいたことを助言、協力する姿勢が大切であると学んだ。本結果が、まだ見つかっていない課題に対して今後の契機になればと考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 人工呼吸器加湿用の注射用水を大容量ソフトバッグへ変更し、看護師負担・購入費・廃棄量を評価。\n- 交換頻度やごみのかさまで含む職種横断の改善。規格選択を供給・作業・環境負担の両面から考える材料となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-132-8", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-132", "session_name": "AI議事録・フォーミュラリー・中毒・研究体制", "title": "研究活動が活発な薬剤部における研究意識と実施状況の乖離および構造的課題の検討", "authors": "上田 真也（うえだ しんや）、 小川 千晶（おがわ ちあき）、 茂野 絢子（しげの あやこ）、 正木 匠（まさき たくみ）、 谷 健太郎（たに けんたろう）、 軍司 剛宏（ぐんじ たかひろ）", "first_author": "上田 真也（うえだ しんや）", "affiliations": "NHO 東京医療センター 薬剤部", "first_affiliation": "NHO 東京医療センター 薬剤部", "printed_pages": "715", "pdf_pages": "471", "features": ["研究活動が活発な部署でも、興味・支援の実感と実際の研究参加に隔たりがあることを42名の回答で検討。", "時間確保を主要な障壁として挙げ、AI利用状況も調査。意欲向上だけでなく業務配分を含む支援の設計が論点となる。"], "issues": [], "sections": [{"heading": "目的", "content": "東京医療センター薬剤部（以下、当院）では研究活動が活発であり、2025 年度は論文 7件、発表 41 件の業績を収めた。一方、国立病院機構内には研究活動が十分でない施設もあり、研究推進には個人的な資質のみならず組織的支援や環境整備が重要である。そこで本研究は当院に所属する薬剤師の研究に対する意識と実施状況を明らかにし、研究活動促進に関連する要因と課題を抽出することで研究体制構築に資する知見を得ることを目的とした。"}, {"heading": "方法", "content": "当院所属薬剤師 50 名を対象に匿名アンケート調査を実施した。調査項目は、研究経験、研究への興味、業務における有用性の認識、組織的支援体制、研究実施の阻害因子、AI 関連サービスの活用状況などとした。"}, {"heading": "結果", "content": "回答率は 84％（42 名）、薬剤師歴中央値は 9 年であった。研究への興味を有する者は 74％、研究が業務へ有用と認識する者は 88％であった。一方、現在研究に従事している者は38.1％と低調で興味はあるが関与できていない者も同程度に認められた。組織的支援を実感している者は 88.1％であり概ね良好に評価された。研究の阻害要因としては時間確保が最も多く挙げられた。さらに、有料 AI 関連サービスの利用者は 23.8％であり、その全例に過去 5 年間の学会発表歴を認めた。"}, {"heading": "考察", "content": "当院では研究への関心および組織的支援は高い一方、時間的制約が研究実施への障壁となっていた。AI 活用と研究活動歴の関連が示唆され、業務効率化ツールの導入が研究推進に寄与する可能性がある。今後は時間確保に向けた業務調整、体系的な研究教育、チームでの研究推進体制の構築、臨床実務に直結した研究テーマの設定が研究業績の維持・発展に重要と考える。"}], "body_text": "### 目的\n\n東京医療センター薬剤部（以下、当院）では研究活動が活発であり、2025 年度は論文 7件、発表 41 件の業績を収めた。一方、国立病院機構内には研究活動が十分でない施設もあり、研究推進には個人的な資質のみならず組織的支援や環境整備が重要である。そこで本研究は当院に所属する薬剤師の研究に対する意識と実施状況を明らかにし、研究活動促進に関連する要因と課題を抽出することで研究体制構築に資する知見を得ることを目的とした。\n\n### 方法\n\n当院所属薬剤師 50 名を対象に匿名アンケート調査を実施した。調査項目は、研究経験、研究への興味、業務における有用性の認識、組織的支援体制、研究実施の阻害因子、AI 関連サービスの活用状況などとした。\n\n### 結果\n\n回答率は 84％（42 名）、薬剤師歴中央値は 9 年であった。研究への興味を有する者は 74％、研究が業務へ有用と認識する者は 88％であった。一方、現在研究に従事している者は38.1％と低調で興味はあるが関与できていない者も同程度に認められた。組織的支援を実感している者は 88.1％であり概ね良好に評価された。研究の阻害要因としては時間確保が最も多く挙げられた。さらに、有料 AI 関連サービスの利用者は 23.8％であり、その全例に過去 5 年間の学会発表歴を認めた。\n\n### 考察\n\n当院では研究への関心および組織的支援は高い一方、時間的制約が研究実施への障壁となっていた。AI 活用と研究活動歴の関連が示唆され、業務効率化ツールの導入が研究推進に寄与する可能性がある。今後は時間確保に向けた業務調整、体系的な研究教育、チームでの研究推進体制の構築、臨床実務に直結した研究テーマの設定が研究業績の維持・発展に重要と考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-132-8\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [471]\nstatus: \"imported\"\n---\n\n# 研究活動が活発な薬剤部における研究意識と実施状況の乖離および構造的課題の検討\n\n- 演題番号: P2-132-8\n- 演題名: 研究活動が活発な薬剤部における研究意識と実施状況の乖離および構造的課題の検討\n- 所属施設: NHO 東京医療センター 薬剤部\n- 筆頭演者: 上田 真也（うえだ しんや）\n- 筆頭演者の所属: NHO 東京医療センター 薬剤部\n- 演者名: 上田 真也（うえだ しんや）、 小川 千晶（おがわ ちあき）、 茂野 絢子（しげの あやこ）、 正木 匠（まさき たくみ）、 谷 健太郎（たに けんたろう）、 軍司 剛宏（ぐんじ たかひろ）\n- 原本: [PDF 471ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=471>)\n- 冊子ページ: 715\n\n## 抄録本文\n\n### 目的\n\n東京医療センター薬剤部（以下、当院）では研究活動が活発であり、2025 年度は論文 7件、発表 41 件の業績を収めた。一方、国立病院機構内には研究活動が十分でない施設もあり、研究推進には個人的な資質のみならず組織的支援や環境整備が重要である。そこで本研究は当院に所属する薬剤師の研究に対する意識と実施状況を明らかにし、研究活動促進に関連する要因と課題を抽出することで研究体制構築に資する知見を得ることを目的とした。\n\n### 方法\n\n当院所属薬剤師 50 名を対象に匿名アンケート調査を実施した。調査項目は、研究経験、研究への興味、業務における有用性の認識、組織的支援体制、研究実施の阻害因子、AI 関連サービスの活用状況などとした。\n\n### 結果\n\n回答率は 84％（42 名）、薬剤師歴中央値は 9 年であった。研究への興味を有する者は 74％、研究が業務へ有用と認識する者は 88％であった。一方、現在研究に従事している者は38.1％と低調で興味はあるが関与できていない者も同程度に認められた。組織的支援を実感している者は 88.1％であり概ね良好に評価された。研究の阻害要因としては時間確保が最も多く挙げられた。さらに、有料 AI 関連サービスの利用者は 23.8％であり、その全例に過去 5 年間の学会発表歴を認めた。\n\n### 考察\n\n当院では研究への関心および組織的支援は高い一方、時間的制約が研究実施への障壁となっていた。AI 活用と研究活動歴の関連が示唆され、業務効率化ツールの導入が研究推進に寄与する可能性がある。今後は時間確保に向けた業務調整、体系的な研究教育、チームでの研究推進体制の構築、臨床実務に直結した研究テーマの設定が研究業績の維持・発展に重要と考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 研究活動が活発な部署でも、興味・支援の実感と実際の研究参加に隔たりがあることを42名の回答で検討。\n- 時間確保を主要な障壁として挙げ、AI利用状況も調査。意欲向上だけでなく業務配分を含む支援の設計が論点となる。\n\n", "rec_grade": "B", "rec_perspective": "研究体制・AI活用", "rec_reason": "年間論文7件・発表41件の活発な施設でも「研究への興味74% vs 現在の従事38.1%」という乖離と時間確保の壁を可視化。有料AIサービス利用者全例に学会発表歴がある点も興味深い。"}, {"id": "P2-132-9", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-132", "session_name": "AI議事録・フォーミュラリー・中毒・研究体制", "title": "Consumer Satisfaction 分析を用いたハンセン病療養所におけるセンター薬剤業務の再評価", "authors": "立石 千咲（たていし ちさき） 1、 矢口 武廣（やぐち たけひろ） 1、 山下 克也（やました かつや） 2、 片山 陽介（かたやま ようすけ） 1", "first_author": "立石 千咲（たていし ちさき） 1", "affiliations": "1 国立療養所沖縄愛楽園 薬剤科、2 国立療養所星塚敬愛園 薬剤科", "first_affiliation": "国立療養所沖縄愛楽園 薬剤科", "printed_pages": "715", "pdf_pages": "471", "features": ["医師・看護師・入所者の評価をCS分析し、薬剤業務の重点改善項目を立場別に抽出。", "職員では常駐時間、入所者では訪問時間が課題として浮かぶ。満足度を具体的な配置・訪問の改善につなげる方法が参考となる。"], "issues": [], "sections": [{"heading": "緒言", "content": "沖縄愛楽園では有用性を鑑み、2023 年 6 月より算定外の病棟（センター）薬剤業務（以下、センター業務）を開始している。今回、初回満足度調査で判明したセンター業務の時間確保と他職種との積極的な情報共有の課題に対し業務改善を行い、その成果を再度満足度調査により検証したので報告する。"}, {"heading": "方法", "content": "2025 年 9 月 1 日時点で勤務している医師22 名、看護師 118 名、及び回答可能と判断された入所者 39 名を対象にアンケート調査を行った。アンケートは医師・看護師が 13 項目、入所者が 9 項目、それぞれ 5 段階の評価とした。項目には総合評価とダミー設問を含み、ダミー設問で回答が不適切もしくは未回答の設問がある場合は除外した。結果は Microsoft Excel を用いて Consumer Satisfaction（以下、CS）分析を行った。"}, {"heading": "結果", "content": "有効回答率は医師 14 名（63.6％）、看護師 55 名（46.6％）、入所者 24 名（61.5％）であり、総合評価の平均点は順に 4.7 点・4.1 点・3.9点であった。CS 分析の結果、医師・看護師いずれも重点改善項目に「センターへの常駐時間」が、入所者では「訪問時間」がプロットされた。"}, {"heading": "考察", "content": "初回調査と比較し、総合評価は医師・看護師で高く維持され、入所者は顕著に上昇したことは、センター業務の有用性が評価されたためと考える。一方、医師・看護師の「センターへの常駐時間」、入所者の「訪問時間」が重点改善項目となった。医師側は前回より重要度が増しており、看護師や入所者も改善・維持項目から移動した。これらは薬剤師の有用性が認知され、現場での関与拡大をより強く求められている結果と言える。今後は一層の業務効率化により時間を確保し、高まる期待に応える業務の質向上に努めたい。"}], "body_text": "### 緒言\n\n沖縄愛楽園では有用性を鑑み、2023 年 6 月より算定外の病棟（センター）薬剤業務（以下、センター業務）を開始している。今回、初回満足度調査で判明したセンター業務の時間確保と他職種との積極的な情報共有の課題に対し業務改善を行い、その成果を再度満足度調査により検証したので報告する。\n\n### 方法\n\n2025 年 9 月 1 日時点で勤務している医師22 名、看護師 118 名、及び回答可能と判断された入所者 39 名を対象にアンケート調査を行った。アンケートは医師・看護師が 13 項目、入所者が 9 項目、それぞれ 5 段階の評価とした。項目には総合評価とダミー設問を含み、ダミー設問で回答が不適切もしくは未回答の設問がある場合は除外した。結果は Microsoft Excel を用いて Consumer Satisfaction（以下、CS）分析を行った。\n\n### 結果\n\n有効回答率は医師 14 名（63.6％）、看護師 55 名（46.6％）、入所者 24 名（61.5％）であり、総合評価の平均点は順に 4.7 点・4.1 点・3.9点であった。CS 分析の結果、医師・看護師いずれも重点改善項目に「センターへの常駐時間」が、入所者では「訪問時間」がプロットされた。\n\n### 考察\n\n初回調査と比較し、総合評価は医師・看護師で高く維持され、入所者は顕著に上昇したことは、センター業務の有用性が評価されたためと考える。一方、医師・看護師の「センターへの常駐時間」、入所者の「訪問時間」が重点改善項目となった。医師側は前回より重要度が増しており、看護師や入所者も改善・維持項目から移動した。これらは薬剤師の有用性が認知され、現場での関与拡大をより強く求められている結果と言える。今後は一層の業務効率化により時間を確保し、高まる期待に応える業務の質向上に努めたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-132-9\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [471]\nstatus: \"imported\"\n---\n\n# Consumer Satisfaction 分析を用いたハンセン病療養所におけるセンター薬剤業務の再評価\n\n- 演題番号: P2-132-9\n- 演題名: Consumer Satisfaction 分析を用いたハンセン病療養所におけるセンター薬剤業務の再評価\n- 所属施設: 1 国立療養所沖縄愛楽園 薬剤科、2 国立療養所星塚敬愛園 薬剤科\n- 筆頭演者: 立石 千咲（たていし ちさき） 1\n- 筆頭演者の所属: 国立療養所沖縄愛楽園 薬剤科\n- 演者名: 立石 千咲（たていし ちさき） 1、 矢口 武廣（やぐち たけひろ） 1、 山下 克也（やました かつや） 2、 片山 陽介（かたやま ようすけ） 1\n- 原本: [PDF 471ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=471>)\n- 冊子ページ: 715\n\n## 抄録本文\n\n### 緒言\n\n沖縄愛楽園では有用性を鑑み、2023 年 6 月より算定外の病棟（センター）薬剤業務（以下、センター業務）を開始している。今回、初回満足度調査で判明したセンター業務の時間確保と他職種との積極的な情報共有の課題に対し業務改善を行い、その成果を再度満足度調査により検証したので報告する。\n\n### 方法\n\n2025 年 9 月 1 日時点で勤務している医師22 名、看護師 118 名、及び回答可能と判断された入所者 39 名を対象にアンケート調査を行った。アンケートは医師・看護師が 13 項目、入所者が 9 項目、それぞれ 5 段階の評価とした。項目には総合評価とダミー設問を含み、ダミー設問で回答が不適切もしくは未回答の設問がある場合は除外した。結果は Microsoft Excel を用いて Consumer Satisfaction（以下、CS）分析を行った。\n\n### 結果\n\n有効回答率は医師 14 名（63.6％）、看護師 55 名（46.6％）、入所者 24 名（61.5％）であり、総合評価の平均点は順に 4.7 点・4.1 点・3.9点であった。CS 分析の結果、医師・看護師いずれも重点改善項目に「センターへの常駐時間」が、入所者では「訪問時間」がプロットされた。\n\n### 考察\n\n初回調査と比較し、総合評価は医師・看護師で高く維持され、入所者は顕著に上昇したことは、センター業務の有用性が評価されたためと考える。一方、医師・看護師の「センターへの常駐時間」、入所者の「訪問時間」が重点改善項目となった。医師側は前回より重要度が増しており、看護師や入所者も改善・維持項目から移動した。これらは薬剤師の有用性が認知され、現場での関与拡大をより強く求められている結果と言える。今後は一層の業務効率化により時間を確保し、高まる期待に応える業務の質向上に努めたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 医師・看護師・入所者の評価をCS分析し、薬剤業務の重点改善項目を立場別に抽出。\n- 職員では常駐時間、入所者では訪問時間が課題として浮かぶ。満足度を具体的な配置・訪問の改善につなげる方法が参考となる。\n\n", "rec_grade": "C", "rec_perspective": "CS分析・業務評価", "rec_reason": "医師・看護師・入所者へのアンケートにダミー設問を設けてCS（顧客満足度）分析を実施し、「常駐時間」「訪問時間」の重点改善項目を科学的に抽出。"}, {"id": "P2-138-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-138", "session_name": "小規模施設のがん薬剤師外来", "title": "小規模施設でがん薬物療法に関わる薬剤師外来の活動について", "authors": "瀬戸口 由（せとぐち ゆき） 1、 藤原 純平（ふじわら じゅんぺい） 1、 高橋 弘季（たかはし ひろき） 1、 平川 理紗（ひらかわ りさ） 1、 橋詰 宏美（はしづめ ひろみ） 1、横 山 晋一郎（よこやま しんいちろう）1 、 辻 真梨亜（つじ まりあ） 2、戸 川 保（とがわ たもつ） 3、 南山 啓吾（みなみやま けいご） 1", "first_author": "瀬戸口 由（せとぐち ゆき） 1", "affiliations": "1 NHO 敦賀医療センター 薬剤部、2 NHO 敦賀医療センター 看護部、3 NHO 敦賀医療センター 外科", "first_affiliation": "NHO 敦賀医療センター 薬剤部", "printed_pages": "728", "pdf_pages": "484", "features": ["小規模施設の薬剤師外来を、専用室設置・プリセプター教育・副作用一覧・事後カルテ確認により拡充。", "外来実績を部内へ共有し若手の処方提案につなげた点が特徴。限られた専門薬剤師の経験を組織へ広げる方法に学べる。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "敦賀医療センターにおけるがん診療の内訳は、内科 34％、外科 31％、次いで婦人科 20％等となっている。薬剤師外来介入診療科は、がん化学療法室を利用している外科、内科、婦人科に加えて、外科の内服抗がん薬単剤療法で介入している。2025 年度の月平均件数は、外来がん患者指導 54.1 件、連携充実加算算定 17 件、がん薬物療法体制充実加算 16.8 件、がん患者指導管理料ハ算定 2 件であった。2023 年度は薬剤師 1 名で外来業務を担っていたが、2024 年度に病院から業務実績が認められ薬剤師外来専用室の設置に至った。さらに薬剤師外来担当者を 2 名増員するために教育を開始した。方法として、指導や記録に役立てるためにレジメン毎に出現する可能性の高い副作用一覧を作成した上で、次に 3 ヶ月を目標にプリセプター制度を導入した。指導前後に担当患者の情報共有や処方提案、薬学的介入方法の相談ができる体制を整え、さらに事後で有資格者によるカルテチェックも行った。教育期間終了後も気軽に相談できる体制、毎回のカルテチェックなどフォローアップを行っている。2024 年度 3 月に部内会議で薬剤師外来業務の見える化を目的に処方提案内容をまとめて報告した。2025 年度以降毎月の部内会議で、プレアボイド報告内容について調剤室でも処方提案可能な情報共有を図った結果、2024 年度に 34 件だったがん治療に関する報告が 2025 年度は 64 件に上昇し、若手薬剤師の積極的な処方提案が反映される結果となった。小規模施設で、がん診療に関わる薬剤師数に限りはあるが、処方提案から薬剤師外来教育の一環、他職種とコミュニケーションを図ること、薬剤師が関わる環境を整えていくことが重要と考える。"}], "body_text": "敦賀医療センターにおけるがん診療の内訳は、内科 34％、外科 31％、次いで婦人科 20％等となっている。薬剤師外来介入診療科は、がん化学療法室を利用している外科、内科、婦人科に加えて、外科の内服抗がん薬単剤療法で介入している。2025 年度の月平均件数は、外来がん患者指導 54.1 件、連携充実加算算定 17 件、がん薬物療法体制充実加算 16.8 件、がん患者指導管理料ハ算定 2 件であった。2023 年度は薬剤師 1 名で外来業務を担っていたが、2024 年度に病院から業務実績が認められ薬剤師外来専用室の設置に至った。さらに薬剤師外来担当者を 2 名増員するために教育を開始した。方法として、指導や記録に役立てるためにレジメン毎に出現する可能性の高い副作用一覧を作成した上で、次に 3 ヶ月を目標にプリセプター制度を導入した。指導前後に担当患者の情報共有や処方提案、薬学的介入方法の相談ができる体制を整え、さらに事後で有資格者によるカルテチェックも行った。教育期間終了後も気軽に相談できる体制、毎回のカルテチェックなどフォローアップを行っている。2024 年度 3 月に部内会議で薬剤師外来業務の見える化を目的に処方提案内容をまとめて報告した。2025 年度以降毎月の部内会議で、プレアボイド報告内容について調剤室でも処方提案可能な情報共有を図った結果、2024 年度に 34 件だったがん治療に関する報告が 2025 年度は 64 件に上昇し、若手薬剤師の積極的な処方提案が反映される結果となった。小規模施設で、がん診療に関わる薬剤師数に限りはあるが、処方提案から薬剤師外来教育の一環、他職種とコミュニケーションを図ること、薬剤師が関わる環境を整えていくことが重要と考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-138-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [484]\nstatus: \"imported\"\n---\n\n# 小規模施設でがん薬物療法に関わる薬剤師外来の活動について\n\n- 演題番号: P2-138-5\n- 演題名: 小規模施設でがん薬物療法に関わる薬剤師外来の活動について\n- 所属施設: 1 NHO 敦賀医療センター 薬剤部、2 NHO 敦賀医療センター 看護部、3 NHO 敦賀医療センター 外科\n- 筆頭演者: 瀬戸口 由（せとぐち ゆき） 1\n- 筆頭演者の所属: NHO 敦賀医療センター 薬剤部\n- 演者名: 瀬戸口 由（せとぐち ゆき） 1、 藤原 純平（ふじわら じゅんぺい） 1、 高橋 弘季（たかはし ひろき） 1、 平川 理紗（ひらかわ りさ） 1、 橋詰 宏美（はしづめ ひろみ） 1、横 山 晋一郎（よこやま しんいちろう）1 、 辻 真梨亜（つじ まりあ） 2、戸 川 保（とがわ たもつ） 3、 南山 啓吾（みなみやま けいご） 1\n- 原本: [PDF 484ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=484>)\n- 冊子ページ: 728\n\n## 抄録本文\n\n敦賀医療センターにおけるがん診療の内訳は、内科 34％、外科 31％、次いで婦人科 20％等となっている。薬剤師外来介入診療科は、がん化学療法室を利用している外科、内科、婦人科に加えて、外科の内服抗がん薬単剤療法で介入している。2025 年度の月平均件数は、外来がん患者指導 54.1 件、連携充実加算算定 17 件、がん薬物療法体制充実加算 16.8 件、がん患者指導管理料ハ算定 2 件であった。2023 年度は薬剤師 1 名で外来業務を担っていたが、2024 年度に病院から業務実績が認められ薬剤師外来専用室の設置に至った。さらに薬剤師外来担当者を 2 名増員するために教育を開始した。方法として、指導や記録に役立てるためにレジメン毎に出現する可能性の高い副作用一覧を作成した上で、次に 3 ヶ月を目標にプリセプター制度を導入した。指導前後に担当患者の情報共有や処方提案、薬学的介入方法の相談ができる体制を整え、さらに事後で有資格者によるカルテチェックも行った。教育期間終了後も気軽に相談できる体制、毎回のカルテチェックなどフォローアップを行っている。2024 年度 3 月に部内会議で薬剤師外来業務の見える化を目的に処方提案内容をまとめて報告した。2025 年度以降毎月の部内会議で、プレアボイド報告内容について調剤室でも処方提案可能な情報共有を図った結果、2024 年度に 34 件だったがん治療に関する報告が 2025 年度は 64 件に上昇し、若手薬剤師の積極的な処方提案が反映される結果となった。小規模施設で、がん診療に関わる薬剤師数に限りはあるが、処方提案から薬剤師外来教育の一環、他職種とコミュニケーションを図ること、薬剤師が関わる環境を整えていくことが重要と考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 小規模施設の薬剤師外来を、専用室設置・プリセプター教育・副作用一覧・事後カルテ確認により拡充。\n- 外来実績を部内へ共有し若手の処方提案につなげた点が特徴。限られた専門薬剤師の経験を組織へ広げる方法に学べる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-146-1", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-146", "session_name": "地域連携・心不全サマリー・TR・周術期連携", "title": "薬剤師が初発の 1 型糖尿病患児の関係者会議に出席することの有益性に関する予備的検討", "authors": "野田 真愛（のだ まえ） 1,2、 山本 高範（やまもと たかのり） 3、稲 吉 隆行（いなよし たかゆき） 3、 平松 匡邦（ひらまつ まさくに） 4", "first_author": "野田 真愛（のだ まえ） 1,2", "affiliations": "1 NHO 名古屋医療センター 薬剤部、2 NHO 三重病院 臨床研究部、3 NHO 三重病院 薬剤科、 4 NHO 七尾病院 薬剤科", "first_affiliation": "NHO 名古屋医療センター 薬剤部 / NHO 三重病院 臨床研究部", "printed_pages": "745", "pdf_pages": "501", "features": ["初発1型糖尿病患児の関係者会議に薬剤師が参加し、学校・園の教職員へ低血糖や救急薬の説明を行う。", "回答7名の予備的調査で理解向上への好意的評価を報告。実際の手技定着と学校生活での支援体制を確認したい。"], "issues": [], "sections": [{"heading": "目的", "content": "1 型糖尿病の患児においては学校、保育園、幼稚園等での本人のみによる血糖管理は難しく、教職員の協力が必須である。2024 年 1 月の厚生労働省からの通知により、医療従事者、家族以外で教職員のグルカゴン点鼻粉末剤の使用が可能となった。そこで、薬剤師が関係者会議（退院時カンファレンス）に参加し説明を行うことで、学校関係者の低血糖、グルカゴン点鼻粉末剤の使用方法などへの理解度が深まり、安全な学校生活環境へ寄与することができるのか予備的検討を実施した。"}, {"heading": "方法", "content": "教職員等（2024 年度〜2025 年度の間に行われた 1 型糖尿病の患児の関係者会議に参加した保育園、幼稚園、小学校などの教職員）を対象に、薬剤師が関係者会議で説明した内容に関するアンケートを実施した。"}, {"heading": "結果", "content": "アンケート対象者は 15 名、回答者は 7 名であった（回答率：46.7％）。主な回答結果について、「バクスミーの使用方法・手技について理解できた」に対しては、肯定的な回答（「そう思う」と「どちらかといえばそう思う」）は 85.7％であった。また、「低血糖に対して理解が深まった」、「幼児、児童が安心して過ごしやすい学校生活を送る手助けができるようになると思う。」に対しては、肯定的な回答は 100％であった。さらに、「他の医療従事者（医師、看護師等）の説明に加えて薬剤師の説明も聞いてよかった。」に対しては、肯定的な回答は 85.7％であった。"}, {"heading": "考察", "content": "今回の結果より、理解度、患児への有益性に関する内容について、肯定的な回答が多かったことから、薬剤師の説明に対する満足度は高かったと考えられる。現時点では症例が限られているため、今後症例を追加し解析を進める予定である。"}], "body_text": "### 目的\n\n1 型糖尿病の患児においては学校、保育園、幼稚園等での本人のみによる血糖管理は難しく、教職員の協力が必須である。2024 年 1 月の厚生労働省からの通知により、医療従事者、家族以外で教職員のグルカゴン点鼻粉末剤の使用が可能となった。そこで、薬剤師が関係者会議（退院時カンファレンス）に参加し説明を行うことで、学校関係者の低血糖、グルカゴン点鼻粉末剤の使用方法などへの理解度が深まり、安全な学校生活環境へ寄与することができるのか予備的検討を実施した。\n\n### 方法\n\n教職員等（2024 年度〜2025 年度の間に行われた 1 型糖尿病の患児の関係者会議に参加した保育園、幼稚園、小学校などの教職員）を対象に、薬剤師が関係者会議で説明した内容に関するアンケートを実施した。\n\n### 結果\n\nアンケート対象者は 15 名、回答者は 7 名であった（回答率：46.7％）。主な回答結果について、「バクスミーの使用方法・手技について理解できた」に対しては、肯定的な回答（「そう思う」と「どちらかといえばそう思う」）は 85.7％であった。また、「低血糖に対して理解が深まった」、「幼児、児童が安心して過ごしやすい学校生活を送る手助けができるようになると思う。」に対しては、肯定的な回答は 100％であった。さらに、「他の医療従事者（医師、看護師等）の説明に加えて薬剤師の説明も聞いてよかった。」に対しては、肯定的な回答は 85.7％であった。\n\n### 考察\n\n今回の結果より、理解度、患児への有益性に関する内容について、肯定的な回答が多かったことから、薬剤師の説明に対する満足度は高かったと考えられる。現時点では症例が限られているため、今後症例を追加し解析を進める予定である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-146-1\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [501]\nstatus: \"imported\"\n---\n\n# 薬剤師が初発の 1 型糖尿病患児の関係者会議に出席することの有益性に関する予備的検討\n\n- 演題番号: P2-146-1\n- 演題名: 薬剤師が初発の 1 型糖尿病患児の関係者会議に出席することの有益性に関する予備的検討\n- 所属施設: 1 NHO 名古屋医療センター 薬剤部、2 NHO 三重病院 臨床研究部、3 NHO 三重病院 薬剤科、 4 NHO 七尾病院 薬剤科\n- 筆頭演者: 野田 真愛（のだ まえ） 1,2\n- 筆頭演者の所属: NHO 名古屋医療センター 薬剤部 / NHO 三重病院 臨床研究部\n- 演者名: 野田 真愛（のだ まえ） 1,2、 山本 高範（やまもと たかのり） 3、稲 吉 隆行（いなよし たかゆき） 3、 平松 匡邦（ひらまつ まさくに） 4\n- 原本: [PDF 501ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=501>)\n- 冊子ページ: 745\n\n## 抄録本文\n\n### 目的\n\n1 型糖尿病の患児においては学校、保育園、幼稚園等での本人のみによる血糖管理は難しく、教職員の協力が必須である。2024 年 1 月の厚生労働省からの通知により、医療従事者、家族以外で教職員のグルカゴン点鼻粉末剤の使用が可能となった。そこで、薬剤師が関係者会議（退院時カンファレンス）に参加し説明を行うことで、学校関係者の低血糖、グルカゴン点鼻粉末剤の使用方法などへの理解度が深まり、安全な学校生活環境へ寄与することができるのか予備的検討を実施した。\n\n### 方法\n\n教職員等（2024 年度〜2025 年度の間に行われた 1 型糖尿病の患児の関係者会議に参加した保育園、幼稚園、小学校などの教職員）を対象に、薬剤師が関係者会議で説明した内容に関するアンケートを実施した。\n\n### 結果\n\nアンケート対象者は 15 名、回答者は 7 名であった（回答率：46.7％）。主な回答結果について、「バクスミーの使用方法・手技について理解できた」に対しては、肯定的な回答（「そう思う」と「どちらかといえばそう思う」）は 85.7％であった。また、「低血糖に対して理解が深まった」、「幼児、児童が安心して過ごしやすい学校生活を送る手助けができるようになると思う。」に対しては、肯定的な回答は 100％であった。さらに、「他の医療従事者（医師、看護師等）の説明に加えて薬剤師の説明も聞いてよかった。」に対しては、肯定的な回答は 85.7％であった。\n\n### 考察\n\n今回の結果より、理解度、患児への有益性に関する内容について、肯定的な回答が多かったことから、薬剤師の説明に対する満足度は高かったと考えられる。現時点では症例が限られているため、今後症例を追加し解析を進める予定である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 初発1型糖尿病患児の関係者会議に薬剤師が参加し、学校・園の教職員へ低血糖や救急薬の説明を行う。\n- 回答7名の予備的調査で理解向上への好意的評価を報告。実際の手技定着と学校生活での支援体制を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-146-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-146", "session_name": "地域連携・心不全サマリー・TR・周術期連携", "title": "横浜医療センターにおける心不全患者に対する多職種カンファレンスを介した退院時薬剤連携に関する取り組み", "authors": "青山 大樹（あおやま だいき） 1、 日下部 由衣（くさかべ ゆい） 1、 坂 貴博（さか たかひろ） 2、 小井土 啓一（こいど けいいち） 1、 前田 遼造（まえだ りょうぞう） 3、 森 文章（もり ふみあき） 3、 秋元 朝行（あきもと あさゆき） 1", "first_author": "青山 大樹（あおやま だいき） 1", "affiliations": "1 NHO 横浜医療センター 薬剤部、2 NHO 横浜医療センター 看護部、 3 NHO 横浜医療センター 循環器内科", "first_affiliation": "NHO 横浜医療センター 薬剤部", "printed_pages": "746", "pdf_pages": "502", "features": ["心不全の多職種カンファレンスと退院時サマリーを組み合わせ、薬局からの返書と介入を調査。", "サマリー31例中14例に返書、4例で医師への報告につながる介入を認めた。血圧・体重・服薬課題の共有項目が参考となる。"], "issues": [], "sections": [{"heading": "背景", "content": "心不全患者の再入院予防には多職種連携が不可欠であり、当院ではカンファレンスによる介入を行ってきた。しかし、入院中の詳細な情報は調剤薬局へは伝達する方法がなく、処方意図や管理上の留意点が共有されないまま地域へ移行することは再入院のリスク因子となる。そこで 2025 年 9 月から心不全薬剤管理サマリー（サマリー）を導入し、多職種の検討成果、処方意図等を地域へ情報共有する取り組みを開始した。"}, {"heading": "目的", "content": "サマリー運用の実情を報告し、地域連携における有用性と課題を明らかにする。"}, {"heading": "方法", "content": "2025 年 8 月から 2026 年 4 月に当院で多職種カンファレンスを行い、サマリーを作成した患者を対象とした。薬局からの返書割合、薬学的介入について調査した。"}, {"heading": "結果", "content": "期間中に多職種介入を行った患者は 40 例、うちサマリーを作成した 31 例を分析対象とした。薬局からの返書が得られたのは 14 例で、複数回の返書は 3 例であった。薬学的介入を要し医師へ報告を行った症例は 4 例であった。各項目への記載はチェックボックス平均 7.15 か所、血圧 10 例、体重 11 例であった。フリー記載欄は心不全情報 13 例、推奨調剤方法 11 例、怠薬原因 10 例であった。"}, {"heading": "考察", "content": "特定の薬局に限定しない運用下で約 40％の返書割合を得たこと、医師への薬学的提案を行えたことは、地域薬剤師との情報共有およびフォローアップにおいて有用性が示唆された。一方、フリー記載欄では各欄の活用度に偏りが見られた。今後は薬局側のサマリーに対する理解度を向上させると共に項目の精査や質の向上に努めることで、より強固な薬薬連携を目指す。"}], "body_text": "### 背景\n\n心不全患者の再入院予防には多職種連携が不可欠であり、当院ではカンファレンスによる介入を行ってきた。しかし、入院中の詳細な情報は調剤薬局へは伝達する方法がなく、処方意図や管理上の留意点が共有されないまま地域へ移行することは再入院のリスク因子となる。そこで 2025 年 9 月から心不全薬剤管理サマリー（サマリー）を導入し、多職種の検討成果、処方意図等を地域へ情報共有する取り組みを開始した。\n\n### 目的\n\nサマリー運用の実情を報告し、地域連携における有用性と課題を明らかにする。\n\n### 方法\n\n2025 年 8 月から 2026 年 4 月に当院で多職種カンファレンスを行い、サマリーを作成した患者を対象とした。薬局からの返書割合、薬学的介入について調査した。\n\n### 結果\n\n期間中に多職種介入を行った患者は 40 例、うちサマリーを作成した 31 例を分析対象とした。薬局からの返書が得られたのは 14 例で、複数回の返書は 3 例であった。薬学的介入を要し医師へ報告を行った症例は 4 例であった。各項目への記載はチェックボックス平均 7.15 か所、血圧 10 例、体重 11 例であった。フリー記載欄は心不全情報 13 例、推奨調剤方法 11 例、怠薬原因 10 例であった。\n\n### 考察\n\n特定の薬局に限定しない運用下で約 40％の返書割合を得たこと、医師への薬学的提案を行えたことは、地域薬剤師との情報共有およびフォローアップにおいて有用性が示唆された。一方、フリー記載欄では各欄の活用度に偏りが見られた。今後は薬局側のサマリーに対する理解度を向上させると共に項目の精査や質の向上に努めることで、より強固な薬薬連携を目指す。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-146-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [502]\nstatus: \"imported\"\n---\n\n# 横浜医療センターにおける心不全患者に対する多職種カンファレンスを介した退院時薬剤連携に関する取り組み\n\n- 演題番号: P2-146-2\n- 演題名: 横浜医療センターにおける心不全患者に対する多職種カンファレンスを介した退院時薬剤連携に関する取り組み\n- 所属施設: 1 NHO 横浜医療センター 薬剤部、2 NHO 横浜医療センター 看護部、 3 NHO 横浜医療センター 循環器内科\n- 筆頭演者: 青山 大樹（あおやま だいき） 1\n- 筆頭演者の所属: NHO 横浜医療センター 薬剤部\n- 演者名: 青山 大樹（あおやま だいき） 1、 日下部 由衣（くさかべ ゆい） 1、 坂 貴博（さか たかひろ） 2、 小井土 啓一（こいど けいいち） 1、 前田 遼造（まえだ りょうぞう） 3、 森 文章（もり ふみあき） 3、 秋元 朝行（あきもと あさゆき） 1\n- 原本: [PDF 502ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=502>)\n- 冊子ページ: 746\n\n## 抄録本文\n\n### 背景\n\n心不全患者の再入院予防には多職種連携が不可欠であり、当院ではカンファレンスによる介入を行ってきた。しかし、入院中の詳細な情報は調剤薬局へは伝達する方法がなく、処方意図や管理上の留意点が共有されないまま地域へ移行することは再入院のリスク因子となる。そこで 2025 年 9 月から心不全薬剤管理サマリー（サマリー）を導入し、多職種の検討成果、処方意図等を地域へ情報共有する取り組みを開始した。\n\n### 目的\n\nサマリー運用の実情を報告し、地域連携における有用性と課題を明らかにする。\n\n### 方法\n\n2025 年 8 月から 2026 年 4 月に当院で多職種カンファレンスを行い、サマリーを作成した患者を対象とした。薬局からの返書割合、薬学的介入について調査した。\n\n### 結果\n\n期間中に多職種介入を行った患者は 40 例、うちサマリーを作成した 31 例を分析対象とした。薬局からの返書が得られたのは 14 例で、複数回の返書は 3 例であった。薬学的介入を要し医師へ報告を行った症例は 4 例であった。各項目への記載はチェックボックス平均 7.15 か所、血圧 10 例、体重 11 例であった。フリー記載欄は心不全情報 13 例、推奨調剤方法 11 例、怠薬原因 10 例であった。\n\n### 考察\n\n特定の薬局に限定しない運用下で約 40％の返書割合を得たこと、医師への薬学的提案を行えたことは、地域薬剤師との情報共有およびフォローアップにおいて有用性が示唆された。一方、フリー記載欄では各欄の活用度に偏りが見られた。今後は薬局側のサマリーに対する理解度を向上させると共に項目の精査や質の向上に努めることで、より強固な薬薬連携を目指す。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 心不全の多職種カンファレンスと退院時サマリーを組み合わせ、薬局からの返書と介入を調査。\n- サマリー31例中14例に返書、4例で医師への報告につながる介入を認めた。血圧・体重・服薬課題の共有項目が参考となる。\n\n", "rec_grade": "B", "rec_perspective": "心不全地域連携", "rec_reason": "心不全カンファレンスと退院時薬剤管理サマリーを組み合わせ、特定の薬局に限定しない運用下で薬局からの返書率約45%（14/31例）・医師への介入報告4例を実現。"}, {"id": "P2-146-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-146", "session_name": "地域連携・心不全サマリー・TR・周術期連携", "title": "外来がん化学療法施行患者におけるトレーシングレポートを用いた薬薬連携の有用性の検討", "authors": "細川 大輔（ほそかわ だいすけ）、土 江 亜季（つちえ あき）、安 井 みのり（やすい みのり）、服 部 雄司（はっとり ゆうじ）", "first_author": "細川 大輔（ほそかわ だいすけ）", "affiliations": "NHO 東近江総合医療センター 薬剤部", "first_affiliation": "NHO 東近江総合医療センター 薬剤部", "printed_pages": "746", "pdf_pages": "502", "features": ["外来がん患者のトレーシングレポート265件について、受領数だけでなく処方提案につながる内容を評価。", "支持療法が中心で、軽度症状の段階からの情報共有に注目。薬局から届いた情報を病院の対応へつなぐ流れが参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "2020 年度の診療報酬改定により連携充実加算および特定薬剤管理指導加算 2 が新設され、当院では、2020 年より抗がん剤治療に関するトレーシングレポート（TR）、2024年よりがん性疼痛治療に関する TR の運用を開始した。本研究では、当院における TR の活用状況を解析し、薬薬連携における有用性および今後の課題について検討することを目的とした。"}, {"heading": "方法", "content": "調査期間を 2021 年 1 月から 2025 年 12 月とし、電子カルテを用いて後方視的調査を実施した。調査項目として、TR 件数、TR を契機とした処方提案件数を集計した。また TR が契機となった処方提案内容について解析した。"}, {"heading": "結果", "content": "TR 受領件数は 265 件であった。内訳は、抗がん剤関連 TR が 250 件、がん性疼痛関連 TR が 15 件であった。処方提案に結び付いた TR は 36 件であった。処方提案内容は、支持療法に関する内容が最多であり、内訳は件数の多いものから、皮膚障害、下痢・便秘、嘔気・食欲不振・味覚障害、血圧コントロール、口腔ケア、疼痛、浮腫、神経障害、倦怠感であった。"}, {"heading": "考察", "content": "TR の活用により、副作用の予防策や投与量調整の検討を事前に行うことが可能となり、外来がん患者に対する支援が薬薬連携を通じてさらに向上する可能性が示唆された。また、今回の処方提案件数には直接反映されていないが、外来移行後の経過を継続的に把握することで、副作用が軽度の段階や疼痛管理開始直後から早期に情報収集・介入できている症例も認められた。"}, {"heading": "結論", "content": "外来治療での治療の継続には、質の高い薬物療法の管理が必要であり、患者の薬物療法の充実を図るためには、迅速な双方向の情報共有等の TR の活用が重要となる。"}], "body_text": "### 目的\n\n2020 年度の診療報酬改定により連携充実加算および特定薬剤管理指導加算 2 が新設され、当院では、2020 年より抗がん剤治療に関するトレーシングレポート（TR）、2024年よりがん性疼痛治療に関する TR の運用を開始した。本研究では、当院における TR の活用状況を解析し、薬薬連携における有用性および今後の課題について検討することを目的とした。\n\n### 方法\n\n調査期間を 2021 年 1 月から 2025 年 12 月とし、電子カルテを用いて後方視的調査を実施した。調査項目として、TR 件数、TR を契機とした処方提案件数を集計した。また TR が契機となった処方提案内容について解析した。\n\n### 結果\n\nTR 受領件数は 265 件であった。内訳は、抗がん剤関連 TR が 250 件、がん性疼痛関連 TR が 15 件であった。処方提案に結び付いた TR は 36 件であった。処方提案内容は、支持療法に関する内容が最多であり、内訳は件数の多いものから、皮膚障害、下痢・便秘、嘔気・食欲不振・味覚障害、血圧コントロール、口腔ケア、疼痛、浮腫、神経障害、倦怠感であった。\n\n### 考察\n\nTR の活用により、副作用の予防策や投与量調整の検討を事前に行うことが可能となり、外来がん患者に対する支援が薬薬連携を通じてさらに向上する可能性が示唆された。また、今回の処方提案件数には直接反映されていないが、外来移行後の経過を継続的に把握することで、副作用が軽度の段階や疼痛管理開始直後から早期に情報収集・介入できている症例も認められた。\n\n### 結論\n\n外来治療での治療の継続には、質の高い薬物療法の管理が必要であり、患者の薬物療法の充実を図るためには、迅速な双方向の情報共有等の TR の活用が重要となる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-146-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [502]\nstatus: \"imported\"\n---\n\n# 外来がん化学療法施行患者におけるトレーシングレポートを用いた薬薬連携の有用性の検討\n\n- 演題番号: P2-146-3\n- 演題名: 外来がん化学療法施行患者におけるトレーシングレポートを用いた薬薬連携の有用性の検討\n- 所属施設: NHO 東近江総合医療センター 薬剤部\n- 筆頭演者: 細川 大輔（ほそかわ だいすけ）\n- 筆頭演者の所属: NHO 東近江総合医療センター 薬剤部\n- 演者名: 細川 大輔（ほそかわ だいすけ）、土 江 亜季（つちえ あき）、安 井 みのり（やすい みのり）、服 部 雄司（はっとり ゆうじ）\n- 原本: [PDF 502ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=502>)\n- 冊子ページ: 746\n\n## 抄録本文\n\n### 目的\n\n2020 年度の診療報酬改定により連携充実加算および特定薬剤管理指導加算 2 が新設され、当院では、2020 年より抗がん剤治療に関するトレーシングレポート（TR）、2024年よりがん性疼痛治療に関する TR の運用を開始した。本研究では、当院における TR の活用状況を解析し、薬薬連携における有用性および今後の課題について検討することを目的とした。\n\n### 方法\n\n調査期間を 2021 年 1 月から 2025 年 12 月とし、電子カルテを用いて後方視的調査を実施した。調査項目として、TR 件数、TR を契機とした処方提案件数を集計した。また TR が契機となった処方提案内容について解析した。\n\n### 結果\n\nTR 受領件数は 265 件であった。内訳は、抗がん剤関連 TR が 250 件、がん性疼痛関連 TR が 15 件であった。処方提案に結び付いた TR は 36 件であった。処方提案内容は、支持療法に関する内容が最多であり、内訳は件数の多いものから、皮膚障害、下痢・便秘、嘔気・食欲不振・味覚障害、血圧コントロール、口腔ケア、疼痛、浮腫、神経障害、倦怠感であった。\n\n### 考察\n\nTR の活用により、副作用の予防策や投与量調整の検討を事前に行うことが可能となり、外来がん患者に対する支援が薬薬連携を通じてさらに向上する可能性が示唆された。また、今回の処方提案件数には直接反映されていないが、外来移行後の経過を継続的に把握することで、副作用が軽度の段階や疼痛管理開始直後から早期に情報収集・介入できている症例も認められた。\n\n### 結論\n\n外来治療での治療の継続には、質の高い薬物療法の管理が必要であり、患者の薬物療法の充実を図るためには、迅速な双方向の情報共有等の TR の活用が重要となる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 外来がん患者のトレーシングレポート265件について、受領数だけでなく処方提案につながる内容を評価。\n- 支持療法が中心で、軽度症状の段階からの情報共有に注目。薬局から届いた情報を病院の対応へつなぐ流れが参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-146-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-146", "session_name": "地域連携・心不全サマリー・TR・周術期連携", "title": "地域医療連携を活かした入院前支援により安全な手術施行に貢献した薬剤師介入の一例", "authors": "嶋田 みなみ（しまだ みなみ） 1、 長岡 宏一（ながおか こういち） 1、 後藤 拓也（ごとう たくや） 1、 井上 裕貴（いのうえ ひろたか） 2、 森下 拓哉（もりした たくや） 1、 柴田 康宏（しばた やすひろ） 1、 中井 朱梅（なかい あけみ） 1、 土方 真由美（ひじかた まゆみ） 1、 井上 孝恵（いのうえ たかえ） 1、 五十川 直人（いがらし なおと） 1", "first_author": "嶋田 みなみ（しまだ みなみ） 1", "affiliations": "1 NHO 豊橋医療センター 薬剤部、2 NHO 名古屋医療センター 薬剤部", "first_affiliation": "NHO 豊橋医療センター 薬剤部", "printed_pages": "746", "pdf_pages": "502", "features": ["術前面談で把握した他院のワルファリン処方について、主治医・処方元・薬局をつないだ個別支援例。", "一包化薬からの除去まで依頼して休薬を実行可能にした点が具体的。休薬判断を一般化せず、連携手順を学びたい。"], "issues": [], "sections": [{"heading": "はじめに", "content": "入退院時における医療の連続性確保や周術期合併症の予防において、術前からの薬剤師介入が重要視されている。豊橋医療センターでは多職種連携による入院支援を実施し、薬剤師はアレルギー歴確認や持参薬鑑別、休薬指導などを担う。今回、入院前支援の介入を契機に、抗凝固薬の適切な休薬管理と薬薬連携により安全に手術を施行できた症例を報告する。"}, {"heading": "症例", "content": "70 歳代女性。人工膝関節置換術を目的として当院整形外科を受診し、手術に向けた術前入院支援センターでの面談を実施した。"}, {"heading": "経過", "content": "持参薬鑑別および面談にて、他院（循環器専門クリニック）処方のワルファリン内服が判明した。院内休薬リストに基づき休薬の必要性を評価した上で、主治医および処方元と連携し、術前 3 日前からの休薬およびヘパリン置換不要との判断に至った。さらに、患者の自己判断による誤薬を防ぐため、かかりつけ薬局へ情報提供を実施した。服薬アドヒアランスの観点から一包化薬からの該当薬除去を依頼した結果、適切な休薬期間が担保され、術後出血などの合併症なく安全に手術が施行された。"}, {"heading": "考察", "content": "入院前の早期段階で薬剤師が介入し、クリニック・保険薬局と緊密に連携したことが、安全な周術期管理に直結した。特に、高齢患者における休薬アドヒアランス低下を防ぐため、かかりつけ薬局へ依頼し一包化薬から休薬対象薬を除外したことは、誤薬防止に極めて有効であった。入退院支援における薬剤師の役割は、単なる情報聴取にとどまらず、個々の患者リスクに応じたマネジメントと地域医療連携の要として極めて重要である。"}], "body_text": "### はじめに\n\n入退院時における医療の連続性確保や周術期合併症の予防において、術前からの薬剤師介入が重要視されている。豊橋医療センターでは多職種連携による入院支援を実施し、薬剤師はアレルギー歴確認や持参薬鑑別、休薬指導などを担う。今回、入院前支援の介入を契機に、抗凝固薬の適切な休薬管理と薬薬連携により安全に手術を施行できた症例を報告する。\n\n### 症例\n\n70 歳代女性。人工膝関節置換術を目的として当院整形外科を受診し、手術に向けた術前入院支援センターでの面談を実施した。\n\n### 経過\n\n持参薬鑑別および面談にて、他院（循環器専門クリニック）処方のワルファリン内服が判明した。院内休薬リストに基づき休薬の必要性を評価した上で、主治医および処方元と連携し、術前 3 日前からの休薬およびヘパリン置換不要との判断に至った。さらに、患者の自己判断による誤薬を防ぐため、かかりつけ薬局へ情報提供を実施した。服薬アドヒアランスの観点から一包化薬からの該当薬除去を依頼した結果、適切な休薬期間が担保され、術後出血などの合併症なく安全に手術が施行された。\n\n### 考察\n\n入院前の早期段階で薬剤師が介入し、クリニック・保険薬局と緊密に連携したことが、安全な周術期管理に直結した。特に、高齢患者における休薬アドヒアランス低下を防ぐため、かかりつけ薬局へ依頼し一包化薬から休薬対象薬を除外したことは、誤薬防止に極めて有効であった。入退院支援における薬剤師の役割は、単なる情報聴取にとどまらず、個々の患者リスクに応じたマネジメントと地域医療連携の要として極めて重要である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-146-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [502]\nstatus: \"imported\"\n---\n\n# 地域医療連携を活かした入院前支援により安全な手術施行に貢献した薬剤師介入の一例\n\n- 演題番号: P2-146-4\n- 演題名: 地域医療連携を活かした入院前支援により安全な手術施行に貢献した薬剤師介入の一例\n- 所属施設: 1 NHO 豊橋医療センター 薬剤部、2 NHO 名古屋医療センター 薬剤部\n- 筆頭演者: 嶋田 みなみ（しまだ みなみ） 1\n- 筆頭演者の所属: NHO 豊橋医療センター 薬剤部\n- 演者名: 嶋田 みなみ（しまだ みなみ） 1、 長岡 宏一（ながおか こういち） 1、 後藤 拓也（ごとう たくや） 1、 井上 裕貴（いのうえ ひろたか） 2、 森下 拓哉（もりした たくや） 1、 柴田 康宏（しばた やすひろ） 1、 中井 朱梅（なかい あけみ） 1、 土方 真由美（ひじかた まゆみ） 1、 井上 孝恵（いのうえ たかえ） 1、 五十川 直人（いがらし なおと） 1\n- 原本: [PDF 502ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=502>)\n- 冊子ページ: 746\n\n## 抄録本文\n\n### はじめに\n\n入退院時における医療の連続性確保や周術期合併症の予防において、術前からの薬剤師介入が重要視されている。豊橋医療センターでは多職種連携による入院支援を実施し、薬剤師はアレルギー歴確認や持参薬鑑別、休薬指導などを担う。今回、入院前支援の介入を契機に、抗凝固薬の適切な休薬管理と薬薬連携により安全に手術を施行できた症例を報告する。\n\n### 症例\n\n70 歳代女性。人工膝関節置換術を目的として当院整形外科を受診し、手術に向けた術前入院支援センターでの面談を実施した。\n\n### 経過\n\n持参薬鑑別および面談にて、他院（循環器専門クリニック）処方のワルファリン内服が判明した。院内休薬リストに基づき休薬の必要性を評価した上で、主治医および処方元と連携し、術前 3 日前からの休薬およびヘパリン置換不要との判断に至った。さらに、患者の自己判断による誤薬を防ぐため、かかりつけ薬局へ情報提供を実施した。服薬アドヒアランスの観点から一包化薬からの該当薬除去を依頼した結果、適切な休薬期間が担保され、術後出血などの合併症なく安全に手術が施行された。\n\n### 考察\n\n入院前の早期段階で薬剤師が介入し、クリニック・保険薬局と緊密に連携したことが、安全な周術期管理に直結した。特に、高齢患者における休薬アドヒアランス低下を防ぐため、かかりつけ薬局へ依頼し一包化薬から休薬対象薬を除外したことは、誤薬防止に極めて有効であった。入退院支援における薬剤師の役割は、単なる情報聴取にとどまらず、個々の患者リスクに応じたマネジメントと地域医療連携の要として極めて重要である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 術前面談で把握した他院のワルファリン処方について、主治医・処方元・薬局をつないだ個別支援例。\n- 一包化薬からの除去まで依頼して休薬を実行可能にした点が具体的。休薬判断を一般化せず、連携手順を学びたい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-146-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-146", "session_name": "地域連携・心不全サマリー・TR・周術期連携", "title": "周術期管理におけるインチャージシート導入の有用性", "authors": "渡邊 龍生（わたなべ たつき）、 岩切 悦子（いわきり えつこ）、 川上 智広（かわかみ ともひろ）、 松本 信彦（まつもと のぶひこ）、 辰己 晃造（たつみ こうぞう）、 永井 聡子（ながい さとこ）", "first_author": "渡邊 龍生（わたなべ たつき）", "affiliations": "NHO 京都医療センター 薬剤部", "first_affiliation": "NHO 京都医療センター 薬剤部", "printed_pages": "746", "pdf_pages": "502", "features": ["周術期情報をまとめるインチャージシートを導入し、術前休薬漏れと薬剤師の問い合わせを評価。", "休薬漏れは導入前4件から導入後0件となり、問い合わせで休薬決定9件。確認項目と情報伝達の担当を確認したい。"], "issues": [], "sections": [{"heading": "背景", "content": "京都医療センター（以下：当院）では 2019 年より患者支援センターに薬剤師が常駐し全入院予定の患者に対して面談を行っているが、休薬すべき薬剤の確認漏れや情報共有不足による休薬漏れが課題となっていた。そこで患者支援センターでの薬剤師業務に消化器外科限定でインチャージシートの導入を開始した。インチャージシートは医師の指示を一元化できる電子カルテのツールであり、休薬指示等を医師の指示として薬剤師が受領できるメリットがある。本調査ではインチャージシートの導入前後における休薬漏れ件数への影響を評価した。"}, {"heading": "方法", "content": "2024 年 4 月〜2025 年 7 月を導入前の期間、2025 年 8 月〜2026 年4 月を導入後の期間に設定し当院で手術を予定している全患者を対象に休薬漏れ件数の調査を行った。導入後は患者支援センター担当薬剤師がインチャージシートの医師からの指示受けを行い、必要時には医師に問い合わせを行い、その件数も調査を行った。"}, {"heading": "結果", "content": "対象患者数は導入前 809 人、導入後 573 人であった。休薬漏れ件数は導入前 4 件、導入後 0 件であり、休薬漏れはなかった。また、導入後薬剤師による問い合わせにより休薬が決定した件数も 9 件確認された。"}, {"heading": "考察", "content": "インチャージシート導入により術前休薬を要する薬剤を内服している患者に対して、薬剤師から医師への確認を積極的におこなうことができ、休薬漏れ件数の減少、休薬漏れによる患者不利益の回避や、病院経営にも寄与できたと考える。現時点では消化器外科限定での運用となっているが、今回の結果を踏まえ他の診療科にもインチャージシートの導入を行うことでより安全に手術や検査、治療を行うことができるのではないかと考える。"}], "body_text": "### 背景\n\n京都医療センター（以下：当院）では 2019 年より患者支援センターに薬剤師が常駐し全入院予定の患者に対して面談を行っているが、休薬すべき薬剤の確認漏れや情報共有不足による休薬漏れが課題となっていた。そこで患者支援センターでの薬剤師業務に消化器外科限定でインチャージシートの導入を開始した。インチャージシートは医師の指示を一元化できる電子カルテのツールであり、休薬指示等を医師の指示として薬剤師が受領できるメリットがある。本調査ではインチャージシートの導入前後における休薬漏れ件数への影響を評価した。\n\n### 方法\n\n2024 年 4 月〜2025 年 7 月を導入前の期間、2025 年 8 月〜2026 年4 月を導入後の期間に設定し当院で手術を予定している全患者を対象に休薬漏れ件数の調査を行った。導入後は患者支援センター担当薬剤師がインチャージシートの医師からの指示受けを行い、必要時には医師に問い合わせを行い、その件数も調査を行った。\n\n### 結果\n\n対象患者数は導入前 809 人、導入後 573 人であった。休薬漏れ件数は導入前 4 件、導入後 0 件であり、休薬漏れはなかった。また、導入後薬剤師による問い合わせにより休薬が決定した件数も 9 件確認された。\n\n### 考察\n\nインチャージシート導入により術前休薬を要する薬剤を内服している患者に対して、薬剤師から医師への確認を積極的におこなうことができ、休薬漏れ件数の減少、休薬漏れによる患者不利益の回避や、病院経営にも寄与できたと考える。現時点では消化器外科限定での運用となっているが、今回の結果を踏まえ他の診療科にもインチャージシートの導入を行うことでより安全に手術や検査、治療を行うことができるのではないかと考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-146-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [502]\nstatus: \"imported\"\n---\n\n# 周術期管理におけるインチャージシート導入の有用性\n\n- 演題番号: P2-146-5\n- 演題名: 周術期管理におけるインチャージシート導入の有用性\n- 所属施設: NHO 京都医療センター 薬剤部\n- 筆頭演者: 渡邊 龍生（わたなべ たつき）\n- 筆頭演者の所属: NHO 京都医療センター 薬剤部\n- 演者名: 渡邊 龍生（わたなべ たつき）、 岩切 悦子（いわきり えつこ）、 川上 智広（かわかみ ともひろ）、 松本 信彦（まつもと のぶひこ）、 辰己 晃造（たつみ こうぞう）、 永井 聡子（ながい さとこ）\n- 原本: [PDF 502ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=502>)\n- 冊子ページ: 746\n\n## 抄録本文\n\n### 背景\n\n京都医療センター（以下：当院）では 2019 年より患者支援センターに薬剤師が常駐し全入院予定の患者に対して面談を行っているが、休薬すべき薬剤の確認漏れや情報共有不足による休薬漏れが課題となっていた。そこで患者支援センターでの薬剤師業務に消化器外科限定でインチャージシートの導入を開始した。インチャージシートは医師の指示を一元化できる電子カルテのツールであり、休薬指示等を医師の指示として薬剤師が受領できるメリットがある。本調査ではインチャージシートの導入前後における休薬漏れ件数への影響を評価した。\n\n### 方法\n\n2024 年 4 月〜2025 年 7 月を導入前の期間、2025 年 8 月〜2026 年4 月を導入後の期間に設定し当院で手術を予定している全患者を対象に休薬漏れ件数の調査を行った。導入後は患者支援センター担当薬剤師がインチャージシートの医師からの指示受けを行い、必要時には医師に問い合わせを行い、その件数も調査を行った。\n\n### 結果\n\n対象患者数は導入前 809 人、導入後 573 人であった。休薬漏れ件数は導入前 4 件、導入後 0 件であり、休薬漏れはなかった。また、導入後薬剤師による問い合わせにより休薬が決定した件数も 9 件確認された。\n\n### 考察\n\nインチャージシート導入により術前休薬を要する薬剤を内服している患者に対して、薬剤師から医師への確認を積極的におこなうことができ、休薬漏れ件数の減少、休薬漏れによる患者不利益の回避や、病院経営にも寄与できたと考える。現時点では消化器外科限定での運用となっているが、今回の結果を踏まえ他の診療科にもインチャージシートの導入を行うことでより安全に手術や検査、治療を行うことができるのではないかと考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 周術期情報をまとめるインチャージシートを導入し、術前休薬漏れと薬剤師の問い合わせを評価。\n- 休薬漏れは導入前4件から導入後0件となり、問い合わせで休薬決定9件。確認項目と情報伝達の担当を確認したい。\n\n", "rec_grade": "C", "rec_perspective": "周術期休薬管理", "rec_reason": "電子カルテ上で医師の指示を一元化する「インチャージシート」を患者支援センター薬剤師が受領・確認する運用により、術前休薬漏れを導入前4件→導入後0件（n=573）へ抑制。"}, {"id": "P2-146-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-146", "session_name": "地域連携・心不全サマリー・TR・周術期連携", "title": "連携充実加算の実施状況と研修会におけるアンケート調査結果を踏まえた課題の検討", "authors": "東盛 裕里（ひがしもり ゆり）、 池上 幸恵（いけがみ ゆきえ）、 藤野 祥（ふじの しょう）、 上原 智博（うえはら ともひろ）、 谷口 潤（たにぐち じゅん）", "first_author": "東盛 裕里（ひがしもり ゆり）", "affiliations": "NHO 沖縄病院 薬剤部", "first_affiliation": "NHO 沖縄病院 薬剤部", "printed_pages": "747", "pdf_pages": "503", "features": ["連携充実加算の実績・返信率と、研修参加者の認知度・実施上の障壁を組み合わせて検討。", "返信率72％でも電話拒否や返書負担が残る。高い認知度を実行につなげる支援と研修内容の工夫が聴講ポイント。"], "issues": [], "sections": [{"heading": "はじめに", "content": "2020 年度診療報酬改定で、外来がん化学療法における薬薬連携を評価する連携充実加算が新設された。病院及び薬局の薬剤師が相互に患者情報を共有し、シームレスな薬物療法を行うことが重要である。沖縄病院では同年 9 月より算定を開始し、トレーシングレポートを導入した連携充実を図ってきたので、その実施状況について報告する。また、算定要件である地域の薬局薬剤師を対象とした研修会を実施した際に、連携強化及び研修会の充実を図る目的にアンケート調査を実施したので報告する。"}, {"heading": "方法", "content": "2022〜2025 年度の連携充実加算の算定数、トレーシングレポートの返信数及び返信率を調査した。また、2022〜2025 年度の研修会参加者を対象として、連携関連の診療報酬の認知度、連携充実加算等の実施状況及び研修会の有用性に対するアンケート調査を実施した。"}, {"heading": "結果・考察", "content": "連携充実加算の算定件数 808 件に対し返信数は 582 件、返信率は 72％と高かった。また、研修会は 199 人が参加、アンケートは 142 人が回答し、回収率は 71％であり、連携充実加算の認知度は 71％、特定薬剤管理指導料加算の認知度は 87％といずれも高く、連携の重要性の理解が得られていることが明らかとなった。一方、患者からの電話拒否の経験や、病院への返書が業務負担という一定数の回答があり、算定に障壁があることがわかった。また、連携開始当初は情報提供書の有用性が示されていたが次第に低下が認められたため、連携の工夫を行う必要があり、さらなる連携強化が今後の課題と考えられる。研修会の有用率は全年度で 100％であり、今後も研修会を充実させて継続していきたい。"}], "body_text": "### はじめに\n\n2020 年度診療報酬改定で、外来がん化学療法における薬薬連携を評価する連携充実加算が新設された。病院及び薬局の薬剤師が相互に患者情報を共有し、シームレスな薬物療法を行うことが重要である。沖縄病院では同年 9 月より算定を開始し、トレーシングレポートを導入した連携充実を図ってきたので、その実施状況について報告する。また、算定要件である地域の薬局薬剤師を対象とした研修会を実施した際に、連携強化及び研修会の充実を図る目的にアンケート調査を実施したので報告する。\n\n### 方法\n\n2022〜2025 年度の連携充実加算の算定数、トレーシングレポートの返信数及び返信率を調査した。また、2022〜2025 年度の研修会参加者を対象として、連携関連の診療報酬の認知度、連携充実加算等の実施状況及び研修会の有用性に対するアンケート調査を実施した。\n\n### 結果・考察\n\n連携充実加算の算定件数 808 件に対し返信数は 582 件、返信率は 72％と高かった。また、研修会は 199 人が参加、アンケートは 142 人が回答し、回収率は 71％であり、連携充実加算の認知度は 71％、特定薬剤管理指導料加算の認知度は 87％といずれも高く、連携の重要性の理解が得られていることが明らかとなった。一方、患者からの電話拒否の経験や、病院への返書が業務負担という一定数の回答があり、算定に障壁があることがわかった。また、連携開始当初は情報提供書の有用性が示されていたが次第に低下が認められたため、連携の工夫を行う必要があり、さらなる連携強化が今後の課題と考えられる。研修会の有用率は全年度で 100％であり、今後も研修会を充実させて継続していきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-146-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [503]\nstatus: \"imported\"\n---\n\n# 連携充実加算の実施状況と研修会におけるアンケート調査結果を踏まえた課題の検討\n\n- 演題番号: P2-146-6\n- 演題名: 連携充実加算の実施状況と研修会におけるアンケート調査結果を踏まえた課題の検討\n- 所属施設: NHO 沖縄病院 薬剤部\n- 筆頭演者: 東盛 裕里（ひがしもり ゆり）\n- 筆頭演者の所属: NHO 沖縄病院 薬剤部\n- 演者名: 東盛 裕里（ひがしもり ゆり）、 池上 幸恵（いけがみ ゆきえ）、 藤野 祥（ふじの しょう）、 上原 智博（うえはら ともひろ）、 谷口 潤（たにぐち じゅん）\n- 原本: [PDF 503ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=503>)\n- 冊子ページ: 747\n\n## 抄録本文\n\n### はじめに\n\n2020 年度診療報酬改定で、外来がん化学療法における薬薬連携を評価する連携充実加算が新設された。病院及び薬局の薬剤師が相互に患者情報を共有し、シームレスな薬物療法を行うことが重要である。沖縄病院では同年 9 月より算定を開始し、トレーシングレポートを導入した連携充実を図ってきたので、その実施状況について報告する。また、算定要件である地域の薬局薬剤師を対象とした研修会を実施した際に、連携強化及び研修会の充実を図る目的にアンケート調査を実施したので報告する。\n\n### 方法\n\n2022〜2025 年度の連携充実加算の算定数、トレーシングレポートの返信数及び返信率を調査した。また、2022〜2025 年度の研修会参加者を対象として、連携関連の診療報酬の認知度、連携充実加算等の実施状況及び研修会の有用性に対するアンケート調査を実施した。\n\n### 結果・考察\n\n連携充実加算の算定件数 808 件に対し返信数は 582 件、返信率は 72％と高かった。また、研修会は 199 人が参加、アンケートは 142 人が回答し、回収率は 71％であり、連携充実加算の認知度は 71％、特定薬剤管理指導料加算の認知度は 87％といずれも高く、連携の重要性の理解が得られていることが明らかとなった。一方、患者からの電話拒否の経験や、病院への返書が業務負担という一定数の回答があり、算定に障壁があることがわかった。また、連携開始当初は情報提供書の有用性が示されていたが次第に低下が認められたため、連携の工夫を行う必要があり、さらなる連携強化が今後の課題と考えられる。研修会の有用率は全年度で 100％であり、今後も研修会を充実させて継続していきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 連携充実加算の実績・返信率と、研修参加者の認知度・実施上の障壁を組み合わせて検討。\n- 返信率72％でも電話拒否や返書負担が残る。高い認知度を実行につなげる支援と研修内容の工夫が聴講ポイント。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-146-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-146", "session_name": "地域連携・心不全サマリー・TR・周術期連携", "title": "院外処方疑義照会不要の報告内容の推移", "authors": "田中 誠（たなか まこと）", "first_author": "田中 誠（たなか まこと）", "affiliations": "NHO 熊本再春医療センター 薬剤部", "first_affiliation": "NHO 熊本再春医療センター 薬剤部", "printed_pages": "747", "pdf_pages": "503", "features": ["疑義照会不要とした変更の報告を3年間追跡し、地域別・内容別の推移を整理。", "一般名処方開始後の件数減少に着目。簡素化プロトコルの効果を評価するとき、処方制度の変化も考慮する視点が参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "薬剤師による疑義照会は、「薬物治療の有効性と安全性の確保」であり、医薬品の適正使用上、薬剤師法に基づく極めて重要な業務です。患者さんの個々の病状や検査値等を勘案した疑義照会・処方提案は益々重要となる一方で形式的な疑義照会は患者・薬局薬剤師・処方医師それぞれにご負担をかけている。そこで、当院では、平成 22 年 4 月 30 日付 厚生労働省医政局長通知「医療スタッフの協働・連携によるチーム医療の推進について」を踏まえ、プロトコルに基づく薬物治療管理の一環として、調剤上の形式的な変更に伴う疑義照会を減らし、保険薬局での患者への薬学的ケアの充実、処方医師の診療時間の確保、さらに適正使用の推進に寄与できると考え「院外処方箋における疑義照会一部不要のプロトコル」を平成元年より運用している。今回、過去 3 年間を振り返り報告内容に関しての推移を検証した。"}, {"heading": "方法", "content": "2023 年 6 月から 2026 年 5 月 3 の年間に保険調剤薬局から報告があった内容を検証"}, {"heading": "結果", "content": "3 年間の報告で報告件数において 3 年前は 200 件を超えていたが昨今は 80件前後まで減少していた。地域別では門前薬局が 85％以上あったが、昨今は 70％前後まで減少していた。また、報告件数の多いのは 3 年間経過しても、残薬調整が多く、次に成分名が同一の銘柄変更であった。報告件数が明らかに減少したのは一般名処方開始後であった。"}, {"heading": "結論", "content": "今回、院外処方におけるプロトコルの推移を検証してみた結果、プロトコル件数そのものが明らかに減少しており、その要因として一般名処方は保険薬局での疑義照会業務不要に寄与しているものと思われる。"}], "body_text": "### 目的\n\n薬剤師による疑義照会は、「薬物治療の有効性と安全性の確保」であり、医薬品の適正使用上、薬剤師法に基づく極めて重要な業務です。患者さんの個々の病状や検査値等を勘案した疑義照会・処方提案は益々重要となる一方で形式的な疑義照会は患者・薬局薬剤師・処方医師それぞれにご負担をかけている。そこで、当院では、平成 22 年 4 月 30 日付 厚生労働省医政局長通知「医療スタッフの協働・連携によるチーム医療の推進について」を踏まえ、プロトコルに基づく薬物治療管理の一環として、調剤上の形式的な変更に伴う疑義照会を減らし、保険薬局での患者への薬学的ケアの充実、処方医師の診療時間の確保、さらに適正使用の推進に寄与できると考え「院外処方箋における疑義照会一部不要のプロトコル」を平成元年より運用している。今回、過去 3 年間を振り返り報告内容に関しての推移を検証した。\n\n### 方法\n\n2023 年 6 月から 2026 年 5 月 3 の年間に保険調剤薬局から報告があった内容を検証\n\n### 結果\n\n3 年間の報告で報告件数において 3 年前は 200 件を超えていたが昨今は 80件前後まで減少していた。地域別では門前薬局が 85％以上あったが、昨今は 70％前後まで減少していた。また、報告件数の多いのは 3 年間経過しても、残薬調整が多く、次に成分名が同一の銘柄変更であった。報告件数が明らかに減少したのは一般名処方開始後であった。\n\n### 結論\n\n今回、院外処方におけるプロトコルの推移を検証してみた結果、プロトコル件数そのものが明らかに減少しており、その要因として一般名処方は保険薬局での疑義照会業務不要に寄与しているものと思われる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-146-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [503]\nstatus: \"imported\"\n---\n\n# 院外処方疑義照会不要の報告内容の推移\n\n- 演題番号: P2-146-7\n- 演題名: 院外処方疑義照会不要の報告内容の推移\n- 所属施設: NHO 熊本再春医療センター 薬剤部\n- 筆頭演者: 田中 誠（たなか まこと）\n- 筆頭演者の所属: NHO 熊本再春医療センター 薬剤部\n- 演者名: 田中 誠（たなか まこと）\n- 原本: [PDF 503ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=503>)\n- 冊子ページ: 747\n\n## 抄録本文\n\n### 目的\n\n薬剤師による疑義照会は、「薬物治療の有効性と安全性の確保」であり、医薬品の適正使用上、薬剤師法に基づく極めて重要な業務です。患者さんの個々の病状や検査値等を勘案した疑義照会・処方提案は益々重要となる一方で形式的な疑義照会は患者・薬局薬剤師・処方医師それぞれにご負担をかけている。そこで、当院では、平成 22 年 4 月 30 日付 厚生労働省医政局長通知「医療スタッフの協働・連携によるチーム医療の推進について」を踏まえ、プロトコルに基づく薬物治療管理の一環として、調剤上の形式的な変更に伴う疑義照会を減らし、保険薬局での患者への薬学的ケアの充実、処方医師の診療時間の確保、さらに適正使用の推進に寄与できると考え「院外処方箋における疑義照会一部不要のプロトコル」を平成元年より運用している。今回、過去 3 年間を振り返り報告内容に関しての推移を検証した。\n\n### 方法\n\n2023 年 6 月から 2026 年 5 月 3 の年間に保険調剤薬局から報告があった内容を検証\n\n### 結果\n\n3 年間の報告で報告件数において 3 年前は 200 件を超えていたが昨今は 80件前後まで減少していた。地域別では門前薬局が 85％以上あったが、昨今は 70％前後まで減少していた。また、報告件数の多いのは 3 年間経過しても、残薬調整が多く、次に成分名が同一の銘柄変更であった。報告件数が明らかに減少したのは一般名処方開始後であった。\n\n### 結論\n\n今回、院外処方におけるプロトコルの推移を検証してみた結果、プロトコル件数そのものが明らかに減少しており、その要因として一般名処方は保険薬局での疑義照会業務不要に寄与しているものと思われる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 疑義照会不要とした変更の報告を3年間追跡し、地域別・内容別の推移を整理。\n- 一般名処方開始後の件数減少に着目。簡素化プロトコルの効果を評価するとき、処方制度の変化も考慮する視点が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-179-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-179", "session_name": "感染制御・耐性菌・DASC・抗MRSA薬介入", "title": "ICT ラウンドの実施現状と改善活動の成果報告", "authors": "地田 凌（ちだ りょう） 1、 有藤 直子（うとう なおこ） 1、 平野 淳（ひらの あつし） 1、林 誠（はやし まこと） 1、 山本 貴玄（やまもと たかはる） 2、 鈴木 京子（すずき きょうこ） 6、 志波 幸子（しわ さちこ） 3、 伊藤 陽子（いとう ようこ）4 、 林 悠太（はやし ゆうた） 5", "first_author": "地田 凌（ちだ りょう） 1", "affiliations": "1 NHO 東名古屋病院 薬剤部、2 国立研究開発法人 国立長寿医療研究センター 検査科、 3 NHO 名古屋医療センター 看護部、4 NHO 東名古屋病院 耳鼻いんこう科、 5 NHO 東名古屋病院 呼吸器内科、6 NHO 東名古屋病院 看護部", "first_affiliation": "NHO 東名古屋病院 薬剤部", "printed_pages": "823", "pdf_pages": "579", "features": ["ICTラウンドの問題項目に表示対策を行い、チェックリストを8項目から15項目へ細分化。", "改善した項目と変化の乏しい項目を併記する。観察基準の共有と、掲示だけでは変わらない行動への対策に注目したい。"], "issues": [], "sections": [{"heading": "緒言", "content": "院内感染対策ラウンドの目的は、院内感染を未然に予防し、患者および医療従事者に安心・安全な医療環境を提供することである。当院では ICT メンバーによりチェックリストを用いた環境ラウンドを週 1 回実施し、ラウンド後には各部署へ書面によるフィードバックを行っているが、改善効果が乏しいことが課題であった。そこで、ICT ラウンドをより有益なものとするための改善活動を実施した。"}, {"heading": "方法", "content": "「適切でない」評価が多い項目に着目し、全病棟および外来部門に、針捨て BOX や廃棄物の容器の蓋に注意喚起の掲示を行った。また従来 8 項目であったチェックリストを 15 項目へ細分化し、問題点をより明確に把握できるようにした。改善活動前後での「適切でない」評価の割合を比較した。"}, {"heading": "結果", "content": "「適切でない」評価が多かった主な項目は A．携帯用針捨て BOX の管理 B．鋭利・非鋭利廃棄物の容器からの溢れ C．開封済み個人防護具の箱の積み重ね D．廃棄物の放置であった。改善活動前後における「適切でない」割合は A．35.9％→35.5％、B．42.9％→28.1％、C．17.2％→3.8％、D．31.9％→30.4％であり、B および C で改善を認めた。また、チェックリストの細分化により評価者間のばらつきが軽減し確認事項が明確となった。"}, {"heading": "考察", "content": "視覚的な注意喚起を用いることで、一部項目において改善効果が得られた。一方、改善が乏しかった項目については、介入方法の再検討が必要と考えられた。今後は改善効果を維持するための評価方法の確立と継続的な取り組みが課題である。"}], "body_text": "### 緒言\n\n院内感染対策ラウンドの目的は、院内感染を未然に予防し、患者および医療従事者に安心・安全な医療環境を提供することである。当院では ICT メンバーによりチェックリストを用いた環境ラウンドを週 1 回実施し、ラウンド後には各部署へ書面によるフィードバックを行っているが、改善効果が乏しいことが課題であった。そこで、ICT ラウンドをより有益なものとするための改善活動を実施した。\n\n### 方法\n\n「適切でない」評価が多い項目に着目し、全病棟および外来部門に、針捨て BOX や廃棄物の容器の蓋に注意喚起の掲示を行った。また従来 8 項目であったチェックリストを 15 項目へ細分化し、問題点をより明確に把握できるようにした。改善活動前後での「適切でない」評価の割合を比較した。\n\n### 結果\n\n「適切でない」評価が多かった主な項目は A．携帯用針捨て BOX の管理 B．鋭利・非鋭利廃棄物の容器からの溢れ C．開封済み個人防護具の箱の積み重ね D．廃棄物の放置であった。改善活動前後における「適切でない」割合は A．35.9％→35.5％、B．42.9％→28.1％、C．17.2％→3.8％、D．31.9％→30.4％であり、B および C で改善を認めた。また、チェックリストの細分化により評価者間のばらつきが軽減し確認事項が明確となった。\n\n### 考察\n\n視覚的な注意喚起を用いることで、一部項目において改善効果が得られた。一方、改善が乏しかった項目については、介入方法の再検討が必要と考えられた。今後は改善効果を維持するための評価方法の確立と継続的な取り組みが課題である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-179-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [579]\nstatus: \"imported\"\n---\n\n# ICT ラウンドの実施現状と改善活動の成果報告\n\n- 演題番号: P2-179-3\n- 演題名: ICT ラウンドの実施現状と改善活動の成果報告\n- 所属施設: 1 NHO 東名古屋病院 薬剤部、2 国立研究開発法人 国立長寿医療研究センター 検査科、 3 NHO 名古屋医療センター 看護部、4 NHO 東名古屋病院 耳鼻いんこう科、 5 NHO 東名古屋病院 呼吸器内科、6 NHO 東名古屋病院 看護部\n- 筆頭演者: 地田 凌（ちだ りょう） 1\n- 筆頭演者の所属: NHO 東名古屋病院 薬剤部\n- 演者名: 地田 凌（ちだ りょう） 1、 有藤 直子（うとう なおこ） 1、 平野 淳（ひらの あつし） 1、林 誠（はやし まこと） 1、 山本 貴玄（やまもと たかはる） 2、 鈴木 京子（すずき きょうこ） 6、 志波 幸子（しわ さちこ） 3、 伊藤 陽子（いとう ようこ）4 、 林 悠太（はやし ゆうた） 5\n- 原本: [PDF 579ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=579>)\n- 冊子ページ: 823\n\n## 抄録本文\n\n### 緒言\n\n院内感染対策ラウンドの目的は、院内感染を未然に予防し、患者および医療従事者に安心・安全な医療環境を提供することである。当院では ICT メンバーによりチェックリストを用いた環境ラウンドを週 1 回実施し、ラウンド後には各部署へ書面によるフィードバックを行っているが、改善効果が乏しいことが課題であった。そこで、ICT ラウンドをより有益なものとするための改善活動を実施した。\n\n### 方法\n\n「適切でない」評価が多い項目に着目し、全病棟および外来部門に、針捨て BOX や廃棄物の容器の蓋に注意喚起の掲示を行った。また従来 8 項目であったチェックリストを 15 項目へ細分化し、問題点をより明確に把握できるようにした。改善活動前後での「適切でない」評価の割合を比較した。\n\n### 結果\n\n「適切でない」評価が多かった主な項目は A．携帯用針捨て BOX の管理 B．鋭利・非鋭利廃棄物の容器からの溢れ C．開封済み個人防護具の箱の積み重ね D．廃棄物の放置であった。改善活動前後における「適切でない」割合は A．35.9％→35.5％、B．42.9％→28.1％、C．17.2％→3.8％、D．31.9％→30.4％であり、B および C で改善を認めた。また、チェックリストの細分化により評価者間のばらつきが軽減し確認事項が明確となった。\n\n### 考察\n\n視覚的な注意喚起を用いることで、一部項目において改善効果が得られた。一方、改善が乏しかった項目については、介入方法の再検討が必要と考えられた。今後は改善効果を維持するための評価方法の確立と継続的な取り組みが課題である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- ICTラウンドの問題項目に表示対策を行い、チェックリストを8項目から15項目へ細分化。\n- 改善した項目と変化の乏しい項目を併記する。観察基準の共有と、掲示だけでは変わらない行動への対策に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-179-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-179", "session_name": "感染制御・耐性菌・DASC・抗MRSA薬介入", "title": "入院時耐性菌検査実施に関する取り組みと調査", "authors": "三宅 利明（みやけ としあき） 1,5、 石尾 圭史郎（いしお けいしろう） 2,5、 吉田 美香（よしだ みか） 3,5、 山根 有美子（やまね ゆみこ） 1,5、 高尾 祐希（たかお ゆうき） 2,5、 原口 俊（はらぐち たかし） 4,5", "first_author": "三宅 利明（みやけ としあき） 1,5", "affiliations": "1 NHO 南岡山医療センター 薬剤部、2 NHO 南岡山医療センター 臨床検査科、 3 NHO 南岡山医療センター 看護部、4 NHO 南岡山医療センター 脳神経内科、 5 NHO 南岡山医療センター 感染対策室", "first_affiliation": "NHO 南岡山医療センター 薬剤部 / NHO 南岡山医療センター 感染対策室", "printed_pages": "824", "pdf_pages": "580", "features": ["入院時耐性菌スクリーニングを、2017年と2025年の比較および紹介元別の検出状況から評価。", "菌種によって増減が異なり、急性期病院からの転院と尿ESBL陽性に着目。検査対象の背景と対策への反映を確認したい。"], "issues": [], "sections": [{"heading": "背景", "content": "入院時耐性菌検査は、薬剤耐性菌保菌患者の早期把握を通じて、院内感染対策を行うための重要な取り組みである。薬剤耐性菌は無症候性に保菌されることも多く、臨床症状のみで保菌の有無を判別することは困難である。そのため入院時のスクリーニングにより保菌状況を把握することは、接触予防策の迅速な導入や病室調整、医療器材の適切な管理につながり、院内伝播の予防に有用である。"}, {"heading": "方法", "content": "本調査では、当院で入院時耐性菌検査を実施した患者を対象に、年齢、性別、検査材料（痰、尿、便）、検出菌（MRSA、ESBL、CRE、MDRP、VRE）、紹介元別（急性期病院、慢性期病院、施設、自宅）の検出数および検出率から、それぞれの関連性について検討した。また 2017 年と 2025 年のデータを比較し、検出率の変遷についても調査した。"}, {"heading": "結果", "content": "2017 年と 2025 年の比較において、MRSA 陽性率は 15.1％（2017 年）から 18.2％（2025 年）に上昇した。一方で ESBL 陽性率は 28.5％（2017 年）から 15.6％（2025 年）に減少した。また 2017 年は CRE が 1 例、VRE が 2例認められたが、2025 年は CRE と VRE ともに認められなかった。MDRP は 2017 年と2025 年ともに検出されなかった。紹介元を上記 4 群に分けて尿 ESBL 陽性率を比較した結果、4 群間に有意差を認め（Fisher の直接確率検定、p=0.044）、急性期病院からの転院群で陽性が有意に多かった（調整済み残差=+1.9）。"}, {"heading": "考察/結語", "content": "急性期病院からの転院患者において、尿の ESBL 陽性患者が多い傾向にあったことから、2 群間に関連性があることが示唆された。今後も耐性菌検出率を継続してモニタリングすることで、今後の院内感染対策に繋がることが期待される。"}], "body_text": "### 背景\n\n入院時耐性菌検査は、薬剤耐性菌保菌患者の早期把握を通じて、院内感染対策を行うための重要な取り組みである。薬剤耐性菌は無症候性に保菌されることも多く、臨床症状のみで保菌の有無を判別することは困難である。そのため入院時のスクリーニングにより保菌状況を把握することは、接触予防策の迅速な導入や病室調整、医療器材の適切な管理につながり、院内伝播の予防に有用である。\n\n### 方法\n\n本調査では、当院で入院時耐性菌検査を実施した患者を対象に、年齢、性別、検査材料（痰、尿、便）、検出菌（MRSA、ESBL、CRE、MDRP、VRE）、紹介元別（急性期病院、慢性期病院、施設、自宅）の検出数および検出率から、それぞれの関連性について検討した。また 2017 年と 2025 年のデータを比較し、検出率の変遷についても調査した。\n\n### 結果\n\n2017 年と 2025 年の比較において、MRSA 陽性率は 15.1％（2017 年）から 18.2％（2025 年）に上昇した。一方で ESBL 陽性率は 28.5％（2017 年）から 15.6％（2025 年）に減少した。また 2017 年は CRE が 1 例、VRE が 2例認められたが、2025 年は CRE と VRE ともに認められなかった。MDRP は 2017 年と2025 年ともに検出されなかった。紹介元を上記 4 群に分けて尿 ESBL 陽性率を比較した結果、4 群間に有意差を認め（Fisher の直接確率検定、p=0.044）、急性期病院からの転院群で陽性が有意に多かった（調整済み残差=+1.9）。\n\n### 考察/結語\n\n急性期病院からの転院患者において、尿の ESBL 陽性患者が多い傾向にあったことから、2 群間に関連性があることが示唆された。今後も耐性菌検出率を継続してモニタリングすることで、今後の院内感染対策に繋がることが期待される。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-179-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [580]\nstatus: \"imported\"\n---\n\n# 入院時耐性菌検査実施に関する取り組みと調査\n\n- 演題番号: P2-179-6\n- 演題名: 入院時耐性菌検査実施に関する取り組みと調査\n- 所属施設: 1 NHO 南岡山医療センター 薬剤部、2 NHO 南岡山医療センター 臨床検査科、 3 NHO 南岡山医療センター 看護部、4 NHO 南岡山医療センター 脳神経内科、 5 NHO 南岡山医療センター 感染対策室\n- 筆頭演者: 三宅 利明（みやけ としあき） 1,5\n- 筆頭演者の所属: NHO 南岡山医療センター 薬剤部 / NHO 南岡山医療センター 感染対策室\n- 演者名: 三宅 利明（みやけ としあき） 1,5、 石尾 圭史郎（いしお けいしろう） 2,5、 吉田 美香（よしだ みか） 3,5、 山根 有美子（やまね ゆみこ） 1,5、 高尾 祐希（たかお ゆうき） 2,5、 原口 俊（はらぐち たかし） 4,5\n- 原本: [PDF 580ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=580>)\n- 冊子ページ: 824\n\n## 抄録本文\n\n### 背景\n\n入院時耐性菌検査は、薬剤耐性菌保菌患者の早期把握を通じて、院内感染対策を行うための重要な取り組みである。薬剤耐性菌は無症候性に保菌されることも多く、臨床症状のみで保菌の有無を判別することは困難である。そのため入院時のスクリーニングにより保菌状況を把握することは、接触予防策の迅速な導入や病室調整、医療器材の適切な管理につながり、院内伝播の予防に有用である。\n\n### 方法\n\n本調査では、当院で入院時耐性菌検査を実施した患者を対象に、年齢、性別、検査材料（痰、尿、便）、検出菌（MRSA、ESBL、CRE、MDRP、VRE）、紹介元別（急性期病院、慢性期病院、施設、自宅）の検出数および検出率から、それぞれの関連性について検討した。また 2017 年と 2025 年のデータを比較し、検出率の変遷についても調査した。\n\n### 結果\n\n2017 年と 2025 年の比較において、MRSA 陽性率は 15.1％（2017 年）から 18.2％（2025 年）に上昇した。一方で ESBL 陽性率は 28.5％（2017 年）から 15.6％（2025 年）に減少した。また 2017 年は CRE が 1 例、VRE が 2例認められたが、2025 年は CRE と VRE ともに認められなかった。MDRP は 2017 年と2025 年ともに検出されなかった。紹介元を上記 4 群に分けて尿 ESBL 陽性率を比較した結果、4 群間に有意差を認め（Fisher の直接確率検定、p=0.044）、急性期病院からの転院群で陽性が有意に多かった（調整済み残差=+1.9）。\n\n### 考察/結語\n\n急性期病院からの転院患者において、尿の ESBL 陽性患者が多い傾向にあったことから、2 群間に関連性があることが示唆された。今後も耐性菌検出率を継続してモニタリングすることで、今後の院内感染対策に繋がることが期待される。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 入院時耐性菌スクリーニングを、2017年と2025年の比較および紹介元別の検出状況から評価。\n- 菌種によって増減が異なり、急性期病院からの転院と尿ESBL陽性に着目。検査対象の背景と対策への反映を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-179-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-179", "session_name": "感染制御・耐性菌・DASC・抗MRSA薬介入", "title": "グラム陰性桿菌菌血症患者におけるセフメタゾール投与量の実態と薬剤師介入点の探索", "authors": "水島 淳裕（みずしま あつひろ）、 田中 亜希（たなか あき）、 小井土 啓一（こいど けいいち）、 秋元 朝行（あきもと ともゆき）", "first_author": "水島 淳裕（みずしま あつひろ）", "affiliations": "NHO 横浜医療センター 薬剤部", "first_affiliation": "NHO 横浜医療センター 薬剤部", "printed_pages": "824", "pdf_pages": "580", "features": ["グラム陰性桿菌菌血症19例で、セフメタゾールの腎機能に応じた用量と治療失敗を探索。", "低用量投与が73.7％と多い一方、群は小規模。用量選択の理由と薬剤師が処方提案できる時点が論点となる。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "セフメタゾール（CMZ）はグラム陰性桿菌菌血症に対する治療選択肢であるが、実臨床では腎機能別推奨投与量より少ない投与が選択されることがある。本研究は、CMZ 投与量の実態を記述的に検討し、低用量投与が選択された背景および薬剤師が介入できた可能性のある投与設計上の課題を探索することを目的とした。"}, {"heading": "方法", "content": "2020 年 1 月から 2025 年 12 月に横浜医療センターに入院し、血液培養で PEK（Proteus mirabilis、Es-cherichia coli、Klebsiella 属）が検出され、CMZ を 48 時間以上投与された成人患者を対象とした。CMZ 開始時の Cockcroft Gault 式による CCr に基づき、推奨投与量群と低用量群に分類した。診療科、Pitt bacteremia score、Charlson Comorbidity Index、ICU入室の有無、感染臓器、検出菌、ESBL 産生の有無、投与日数、感染巣コントロールを両群で記述的に比較した。主要評価項目は低用量投与の割合、副次評価項目は治療失敗の発生状況とした。治療失敗は 30 日以内死亡、同一感染症の再燃、効果不十分による抗菌薬エスカレーションの複合評価項目とした。"}, {"heading": "結果", "content": "解析対象は 19 例であり、低用量群 14 例、推奨投与量群 5 例であった。低用量投与の割合は 73.7％であった。治療失敗は低用量群で 2 例に認め、内訳は 30 日以内死亡 1 例、抗菌薬エスカレーション 1 例であった。推奨投与量群では再燃 1 例を認めた。"}, {"heading": "考察", "content": "本研究では低用量投与が多数を占め、薬剤師による投与量再評価の余地が示唆された。記述的検討であり、投与量と治療失敗の関連を評価するには限界があるが、薬剤師は腎機能、重症度、感染臓器、感染巣コントロールを踏まえた早期の投与量確認が必要である。"}], "body_text": "### 背景・目的\n\nセフメタゾール（CMZ）はグラム陰性桿菌菌血症に対する治療選択肢であるが、実臨床では腎機能別推奨投与量より少ない投与が選択されることがある。本研究は、CMZ 投与量の実態を記述的に検討し、低用量投与が選択された背景および薬剤師が介入できた可能性のある投与設計上の課題を探索することを目的とした。\n\n### 方法\n\n2020 年 1 月から 2025 年 12 月に横浜医療センターに入院し、血液培養で PEK（Proteus mirabilis、Es-cherichia coli、Klebsiella 属）が検出され、CMZ を 48 時間以上投与された成人患者を対象とした。CMZ 開始時の Cockcroft Gault 式による CCr に基づき、推奨投与量群と低用量群に分類した。診療科、Pitt bacteremia score、Charlson Comorbidity Index、ICU入室の有無、感染臓器、検出菌、ESBL 産生の有無、投与日数、感染巣コントロールを両群で記述的に比較した。主要評価項目は低用量投与の割合、副次評価項目は治療失敗の発生状況とした。治療失敗は 30 日以内死亡、同一感染症の再燃、効果不十分による抗菌薬エスカレーションの複合評価項目とした。\n\n### 結果\n\n解析対象は 19 例であり、低用量群 14 例、推奨投与量群 5 例であった。低用量投与の割合は 73.7％であった。治療失敗は低用量群で 2 例に認め、内訳は 30 日以内死亡 1 例、抗菌薬エスカレーション 1 例であった。推奨投与量群では再燃 1 例を認めた。\n\n### 考察\n\n本研究では低用量投与が多数を占め、薬剤師による投与量再評価の余地が示唆された。記述的検討であり、投与量と治療失敗の関連を評価するには限界があるが、薬剤師は腎
