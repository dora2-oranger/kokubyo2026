機能、重症度、感染臓器、感染巣コントロールを踏まえた早期の投与量確認が必要である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-179-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [580]\nstatus: \"imported\"\n---\n\n# グラム陰性桿菌菌血症患者におけるセフメタゾール投与量の実態と薬剤師介入点の探索\n\n- 演題番号: P2-179-7\n- 演題名: グラム陰性桿菌菌血症患者におけるセフメタゾール投与量の実態と薬剤師介入点の探索\n- 所属施設: NHO 横浜医療センター 薬剤部\n- 筆頭演者: 水島 淳裕（みずしま あつひろ）\n- 筆頭演者の所属: NHO 横浜医療センター 薬剤部\n- 演者名: 水島 淳裕（みずしま あつひろ）、 田中 亜希（たなか あき）、 小井土 啓一（こいど けいいち）、 秋元 朝行（あきもと ともゆき）\n- 原本: [PDF 580ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=580>)\n- 冊子ページ: 824\n\n## 抄録本文\n\n### 背景・目的\n\nセフメタゾール（CMZ）はグラム陰性桿菌菌血症に対する治療選択肢であるが、実臨床では腎機能別推奨投与量より少ない投与が選択されることがある。本研究は、CMZ 投与量の実態を記述的に検討し、低用量投与が選択された背景および薬剤師が介入できた可能性のある投与設計上の課題を探索することを目的とした。\n\n### 方法\n\n2020 年 1 月から 2025 年 12 月に横浜医療センターに入院し、血液培養で PEK（Proteus mirabilis、Es-cherichia coli、Klebsiella 属）が検出され、CMZ を 48 時間以上投与された成人患者を対象とした。CMZ 開始時の Cockcroft Gault 式による CCr に基づき、推奨投与量群と低用量群に分類した。診療科、Pitt bacteremia score、Charlson Comorbidity Index、ICU入室の有無、感染臓器、検出菌、ESBL 産生の有無、投与日数、感染巣コントロールを両群で記述的に比較した。主要評価項目は低用量投与の割合、副次評価項目は治療失敗の発生状況とした。治療失敗は 30 日以内死亡、同一感染症の再燃、効果不十分による抗菌薬エスカレーションの複合評価項目とした。\n\n### 結果\n\n解析対象は 19 例であり、低用量群 14 例、推奨投与量群 5 例であった。低用量投与の割合は 73.7％であった。治療失敗は低用量群で 2 例に認め、内訳は 30 日以内死亡 1 例、抗菌薬エスカレーション 1 例であった。推奨投与量群では再燃 1 例を認めた。\n\n### 考察\n\n本研究では低用量投与が多数を占め、薬剤師による投与量再評価の余地が示唆された。記述的検討であり、投与量と治療失敗の関連を評価するには限界があるが、薬剤師は腎機能、重症度、感染臓器、感染巣コントロールを踏まえた早期の投与量確認が必要である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- グラム陰性桿菌菌血症19例で、セフメタゾールの腎機能に応じた用量と治療失敗を探索。\n- 低用量投与が73.7％と多い一方、群は小規模。用量選択の理由と薬剤師が処方提案できる時点が論点となる。\n\n", "rec_grade": "C", "rec_perspective": "菌血症PK/PD・AS", "rec_reason": "PEK菌血症に対するCMZ投与19例のうち73.7%（14例）が腎機能別推奨量より低用量であった実態を明らかにし、重症度や感染巣を踏まえた薬剤師の早期介入点を提示。"}, {"id": "P2-179-8", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-179", "session_name": "感染制御・耐性菌・DASC・抗MRSA薬介入", "title": "重症心身障害児（者）病棟における DASC を用いた抗菌薬使用評価の課題", "authors": "小俣 裕之（おまた ひろゆき）、 沢登 恵美（さわのぼり えみ）、 宮澤 智孝（みやざわ ともたか）、 板子 和恵（いたこ かずえ）、白 井 毅（しらい つよし）、 牧山 稔（まきやま みのる）、 萩野 哲男（はぎの てつお）", "first_author": "小俣 裕之（おまた ひろゆき）", "affiliations": "NHO 甲府病院 薬剤部", "first_affiliation": "NHO 甲府病院 薬剤部", "printed_pages": "824", "pdf_pages": "580", "features": ["重症心身障害児者の3病棟で、DOTと抗菌スペクトルを反映するDASCを長期に比較。", "使用量・スペクトル・耐性率が単純に対応しない点を示す。病棟特性に合わせた抗菌薬評価指標の使い分けに注目したい。"], "issues": [], "sections": [{"heading": "背景", "content": "重症心身障害児（者）病棟では、反復感染や慢性呼吸器管理により広域抗菌薬使用が長期化しやすい。近年、抗菌薬使用評価指標として DASC（Days of Antibiotic Spectrum Coverage）が用いられているが、重心病棟での報告は少ない。"}, {"heading": "対象・方法", "content": "2019〜2025年度の重心 3 病棟（132 床、平均年齢 43.6 歳）を対象に、DOT、DASC、MEPM およびTAZ/PIPC 使用割合を後方視的に解析した。さらに MRSA 検出率、緑膿菌耐性率との関連を検討した。"}, {"heading": "結果", "content": "3 病棟の平均 DASC/DOT は 15313.3/1778 で病棟間差を認めた（A/B/C：DASC 16384/16998/12558、DOT 1908/1967/1459）。2020〜2022 年度は 2023 年度以降と比較し DASC 低下傾向を示した。DASC/DOT は 8.61 で、病棟ごとに抗菌薬使用傾向は異なり、一部で TAZ/PIPC 高使用と MEPM 低下を認めた。また時期により DASC が大きく変動する病棟を認めた。MRSA 検出率 41％、緑膿菌耐性率 23.4％であったが、広域抗菌薬使用量との明確な関連は認めなかった。"}, {"heading": "考察", "content": "DASC は重心病棟における広域抗菌薬使用状況の可視化に有用であった。DASC/DOT は急性期病院報告より高値で、病棟や時期による変動が大きく、少数長期症例の影響が示唆された。重心病棟では長期入所、慢性管理、反復感染などを背景に、一部症例が病棟全体の DASC へ与える影響が大きいと考えられた。"}, {"heading": "結語", "content": "重心病棟で DASC を用いる際は、病棟特性や長期症例の影響を考慮した評価が必要と考えられた。"}], "body_text": "### 背景\n\n重症心身障害児（者）病棟では、反復感染や慢性呼吸器管理により広域抗菌薬使用が長期化しやすい。近年、抗菌薬使用評価指標として DASC（Days of Antibiotic Spectrum Coverage）が用いられているが、重心病棟での報告は少ない。\n\n### 対象・方法\n\n2019〜2025年度の重心 3 病棟（132 床、平均年齢 43.6 歳）を対象に、DOT、DASC、MEPM およびTAZ/PIPC 使用割合を後方視的に解析した。さらに MRSA 検出率、緑膿菌耐性率との関連を検討した。\n\n### 結果\n\n3 病棟の平均 DASC/DOT は 15313.3/1778 で病棟間差を認めた（A/B/C：DASC 16384/16998/12558、DOT 1908/1967/1459）。2020〜2022 年度は 2023 年度以降と比較し DASC 低下傾向を示した。DASC/DOT は 8.61 で、病棟ごとに抗菌薬使用傾向は異なり、一部で TAZ/PIPC 高使用と MEPM 低下を認めた。また時期により DASC が大きく変動する病棟を認めた。MRSA 検出率 41％、緑膿菌耐性率 23.4％であったが、広域抗菌薬使用量との明確な関連は認めなかった。\n\n### 考察\n\nDASC は重心病棟における広域抗菌薬使用状況の可視化に有用であった。DASC/DOT は急性期病院報告より高値で、病棟や時期による変動が大きく、少数長期症例の影響が示唆された。重心病棟では長期入所、慢性管理、反復感染などを背景に、一部症例が病棟全体の DASC へ与える影響が大きいと考えられた。\n\n### 結語\n\n重心病棟で DASC を用いる際は、病棟特性や長期症例の影響を考慮した評価が必要と考えられた。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-179-8\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [580]\nstatus: \"imported\"\n---\n\n# 重症心身障害児（者）病棟における DASC を用いた抗菌薬使用評価の課題\n\n- 演題番号: P2-179-8\n- 演題名: 重症心身障害児（者）病棟における DASC を用いた抗菌薬使用評価の課題\n- 所属施設: NHO 甲府病院 薬剤部\n- 筆頭演者: 小俣 裕之（おまた ひろゆき）\n- 筆頭演者の所属: NHO 甲府病院 薬剤部\n- 演者名: 小俣 裕之（おまた ひろゆき）、 沢登 恵美（さわのぼり えみ）、 宮澤 智孝（みやざわ ともたか）、 板子 和恵（いたこ かずえ）、白 井 毅（しらい つよし）、 牧山 稔（まきやま みのる）、 萩野 哲男（はぎの てつお）\n- 原本: [PDF 580ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=580>)\n- 冊子ページ: 824\n\n## 抄録本文\n\n### 背景\n\n重症心身障害児（者）病棟では、反復感染や慢性呼吸器管理により広域抗菌薬使用が長期化しやすい。近年、抗菌薬使用評価指標として DASC（Days of Antibiotic Spectrum Coverage）が用いられているが、重心病棟での報告は少ない。\n\n### 対象・方法\n\n2019〜2025年度の重心 3 病棟（132 床、平均年齢 43.6 歳）を対象に、DOT、DASC、MEPM およびTAZ/PIPC 使用割合を後方視的に解析した。さらに MRSA 検出率、緑膿菌耐性率との関連を検討した。\n\n### 結果\n\n3 病棟の平均 DASC/DOT は 15313.3/1778 で病棟間差を認めた（A/B/C：DASC 16384/16998/12558、DOT 1908/1967/1459）。2020〜2022 年度は 2023 年度以降と比較し DASC 低下傾向を示した。DASC/DOT は 8.61 で、病棟ごとに抗菌薬使用傾向は異なり、一部で TAZ/PIPC 高使用と MEPM 低下を認めた。また時期により DASC が大きく変動する病棟を認めた。MRSA 検出率 41％、緑膿菌耐性率 23.4％であったが、広域抗菌薬使用量との明確な関連は認めなかった。\n\n### 考察\n\nDASC は重心病棟における広域抗菌薬使用状況の可視化に有用であった。DASC/DOT は急性期病院報告より高値で、病棟や時期による変動が大きく、少数長期症例の影響が示唆された。重心病棟では長期入所、慢性管理、反復感染などを背景に、一部症例が病棟全体の DASC へ与える影響が大きいと考えられた。\n\n### 結語\n\n重心病棟で DASC を用いる際は、病棟特性や長期症例の影響を考慮した評価が必要と考えられた。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 重症心身障害児者の3病棟で、DOTと抗菌スペクトルを反映するDASCを長期に比較。\n- 使用量・スペクトル・耐性率が単純に対応しない点を示す。病棟特性に合わせた抗菌薬評価指標の使い分けに注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-179-9", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-179", "session_name": "感染制御・耐性菌・DASC・抗MRSA薬介入", "title": "バンコマイシン及びテイコプラニン投与への薬剤師の全例介入効果調査", "authors": "藤原 純平（ふじわら じゅんぺい）、横 山 晋一郎（よこやま しんいちろう）、 平川 理紗（ひらかわ りさ）、 高橋 弘季（たかはし ひろき）、 瀬戸口 由（せとぐち ゆき）、 橋詰 宏美（はしづめ ひろみ）、 南山 啓吾（みなみやま けいご）", "first_author": "藤原 純平（ふじわら じゅんぺい）", "affiliations": "NHO 敦賀医療センター 薬剤部", "first_affiliation": "NHO 敦賀医療センター 薬剤部", "printed_pages": "825", "pdf_pages": "581", "features": ["バンコマイシン・テイコプラニンの全例介入を、血中濃度指標と急性腎障害から前後比較。", "17名の小規模調査で濃度指標の変化を提示し、AKIは両群とも0％。安全性の優劣とは区別して投与設計の運用を確認したい。"], "issues": [], "sections": [{"heading": "はじめに", "content": "バンコマイシン（以下 VCM）、テイコプラニン（以下 TEIC）はメチシリン耐性黄色ブドウ球菌による感染症治療薬として広く使用されており、両剤の投与に関しては有効性のみならず、安全性からも薬剤師の早期介入が重要である。敦賀医療センターでは、2024年 4 月より薬剤師が VCM、TEIC の投与設計に対して全例介入を開始したため、その効果を調査した"}, {"heading": "方法", "content": "2023 年 4 月 1 日から 2025 年 3 月 31 日までに VCM、TEIC を使用した患者のうち、血中濃度測定を実施した 17 名を対象とし、2024 年 3 月 31 日までの患者7 名を非介入群、2024 年 4 月 1 日以降の患者 10 名を介入群とした。VCM は投与後 24〜48 時間と定常状態における、ベイズ推定による血中濃度時間曲線下面積/最小発育阻止濃度比（以下 AUC/MIC）、TEIC はトラフ値、共通項目として投与期間中の急性腎障害（以下AKI）発生率を比較した。"}, {"heading": "結果", "content": "TEIC のトラフ値（μg/mL）の平均は非介入群が 23.46、介入群が 27.67 であった。VCM の AUC/MIC（μg・h/mL）は、投与後 24〜48 時間は非介入群が 299.76、介入群が 359.57、定常状態では非介入群が 353.45、介入群が 513.02であった。AKI 発生率については両剤ともに両群で 0％であった。"}, {"heading": "考察", "content": "VCM のAUC/MIC は介入により有意に上昇したが、投与後 24〜48 時間については介入後も450μg・h/mL に到達していない。TEIC のトラフ値は有意な差は見られなかった。これは非介入群においても、目標値である 20μg/mL を達成できていたためと考える。以上のことから、今回の取り組みでは安全性を損なうことなく VCM の AUC/MIC を上昇できたが、投与後 24〜48 時間における AUC/MIC の目標値達成が今後の課題であることが示された。"}], "body_text": "### はじめに\n\nバンコマイシン（以下 VCM）、テイコプラニン（以下 TEIC）はメチシリン耐性黄色ブドウ球菌による感染症治療薬として広く使用されており、両剤の投与に関しては有効性のみならず、安全性からも薬剤師の早期介入が重要である。敦賀医療センターでは、2024年 4 月より薬剤師が VCM、TEIC の投与設計に対して全例介入を開始したため、その効果を調査した\n\n### 方法\n\n2023 年 4 月 1 日から 2025 年 3 月 31 日までに VCM、TEIC を使用した患者のうち、血中濃度測定を実施した 17 名を対象とし、2024 年 3 月 31 日までの患者7 名を非介入群、2024 年 4 月 1 日以降の患者 10 名を介入群とした。VCM は投与後 24〜48 時間と定常状態における、ベイズ推定による血中濃度時間曲線下面積/最小発育阻止濃度比（以下 AUC/MIC）、TEIC はトラフ値、共通項目として投与期間中の急性腎障害（以下AKI）発生率を比較した。\n\n### 結果\n\nTEIC のトラフ値（μg/mL）の平均は非介入群が 23.46、介入群が 27.67 であった。VCM の AUC/MIC（μg・h/mL）は、投与後 24〜48 時間は非介入群が 299.76、介入群が 359.57、定常状態では非介入群が 353.45、介入群が 513.02であった。AKI 発生率については両剤ともに両群で 0％であった。\n\n### 考察\n\nVCM のAUC/MIC は介入により有意に上昇したが、投与後 24〜48 時間については介入後も450μg・h/mL に到達していない。TEIC のトラフ値は有意な差は見られなかった。これは非介入群においても、目標値である 20μg/mL を達成できていたためと考える。以上のことから、今回の取り組みでは安全性を損なうことなく VCM の AUC/MIC を上昇できたが、投与後 24〜48 時間における AUC/MIC の目標値達成が今後の課題であることが示された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-179-9\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [581]\nstatus: \"imported\"\n---\n\n# バンコマイシン及びテイコプラニン投与への薬剤師の全例介入効果調査\n\n- 演題番号: P2-179-9\n- 演題名: バンコマイシン及びテイコプラニン投与への薬剤師の全例介入効果調査\n- 所属施設: NHO 敦賀医療センター 薬剤部\n- 筆頭演者: 藤原 純平（ふじわら じゅんぺい）\n- 筆頭演者の所属: NHO 敦賀医療センター 薬剤部\n- 演者名: 藤原 純平（ふじわら じゅんぺい）、横 山 晋一郎（よこやま しんいちろう）、 平川 理紗（ひらかわ りさ）、 高橋 弘季（たかはし ひろき）、 瀬戸口 由（せとぐち ゆき）、 橋詰 宏美（はしづめ ひろみ）、 南山 啓吾（みなみやま けいご）\n- 原本: [PDF 581ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=581>)\n- 冊子ページ: 825\n\n## 抄録本文\n\n### はじめに\n\nバンコマイシン（以下 VCM）、テイコプラニン（以下 TEIC）はメチシリン耐性黄色ブドウ球菌による感染症治療薬として広く使用されており、両剤の投与に関しては有効性のみならず、安全性からも薬剤師の早期介入が重要である。敦賀医療センターでは、2024年 4 月より薬剤師が VCM、TEIC の投与設計に対して全例介入を開始したため、その効果を調査した\n\n### 方法\n\n2023 年 4 月 1 日から 2025 年 3 月 31 日までに VCM、TEIC を使用した患者のうち、血中濃度測定を実施した 17 名を対象とし、2024 年 3 月 31 日までの患者7 名を非介入群、2024 年 4 月 1 日以降の患者 10 名を介入群とした。VCM は投与後 24〜48 時間と定常状態における、ベイズ推定による血中濃度時間曲線下面積/最小発育阻止濃度比（以下 AUC/MIC）、TEIC はトラフ値、共通項目として投与期間中の急性腎障害（以下AKI）発生率を比較した。\n\n### 結果\n\nTEIC のトラフ値（μg/mL）の平均は非介入群が 23.46、介入群が 27.67 であった。VCM の AUC/MIC（μg・h/mL）は、投与後 24〜48 時間は非介入群が 299.76、介入群が 359.57、定常状態では非介入群が 353.45、介入群が 513.02であった。AKI 発生率については両剤ともに両群で 0％であった。\n\n### 考察\n\nVCM のAUC/MIC は介入により有意に上昇したが、投与後 24〜48 時間については介入後も450μg・h/mL に到達していない。TEIC のトラフ値は有意な差は見られなかった。これは非介入群においても、目標値である 20μg/mL を達成できていたためと考える。以上のことから、今回の取り組みでは安全性を損なうことなく VCM の AUC/MIC を上昇できたが、投与後 24〜48 時間における AUC/MIC の目標値達成が今後の課題であることが示された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- バンコマイシン・テイコプラニンの全例介入を、血中濃度指標と急性腎障害から前後比較。\n- 17名の小規模調査で濃度指標の変化を提示し、AKIは両群とも0％。安全性の優劣とは区別して投与設計の運用を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "SY4-2", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY4", "session_name": "結核医療における服薬支援", "title": "当院結核病棟における薬剤師の取り組み〜治療完遂のための服薬支援〜", "authors": "井上 佑美（いのうえ ゆみ）", "first_author": "井上 佑美（いのうえ ゆみ）", "affiliations": "NHO 東名古屋病院 薬剤部", "first_affiliation": "NHO 東名古屋病院 薬剤部", "printed_pages": "250", "pdf_pages": "6", "features": ["結核治療完遂を、相互作用・副作用管理に加え、内服嚥下障害の評価と退院後の薬薬連携から捉える。", "アセスメントツールと薬剤情報連絡書をどう使い分けるかが実務的な焦点。長期治療の服薬支援に関心がある人向け。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "結核治療は多剤併用が原則であり、一般的な抗菌薬と比較して副作用発生頻度は高い。副作用にて休薬した薬剤の再投与が必要となる場合も多く、これらは結核治療の特殊性と言える。また、キードラッグであるリファンピシンは、薬物代謝酵素の誘導作用を有するため、併用薬との薬物相互作用の管理が極めて重要となる。さらに、抗結核薬だけでも 1 回に 10 個近くの錠剤やカプセルを服用する必要があるため、「内服嚥下障害」を有する患者への対応も課題となる。当院結核病棟ではアセスメントツールを用いた内服嚥下障害の評価を行い、必要に応じた服薬支援を行っている。また、長期間に及ぶ結核治療を退院後も途切れることなく支援してもらえるよう、退院時には「薬剤情報連絡書」を作成し、主に保険薬局との薬薬連携を積極的に推進している。今回は、当院結核病棟での薬剤師の取り組みを紹介するとともに、結核治療完遂のための服薬支援について概説する。"}], "body_text": "結核治療は多剤併用が原則であり、一般的な抗菌薬と比較して副作用発生頻度は高い。副作用にて休薬した薬剤の再投与が必要となる場合も多く、これらは結核治療の特殊性と言える。また、キードラッグであるリファンピシンは、薬物代謝酵素の誘導作用を有するため、併用薬との薬物相互作用の管理が極めて重要となる。さらに、抗結核薬だけでも 1 回に 10 個近くの錠剤やカプセルを服用する必要があるため、「内服嚥下障害」を有する患者への対応も課題となる。当院結核病棟ではアセスメントツールを用いた内服嚥下障害の評価を行い、必要に応じた服薬支援を行っている。また、長期間に及ぶ結核治療を退院後も途切れることなく支援してもらえるよう、退院時には「薬剤情報連絡書」を作成し、主に保険薬局との薬薬連携を積極的に推進している。今回は、当院結核病棟での薬剤師の取り組みを紹介するとともに、結核治療完遂のための服薬支援について概説する。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY4-2\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [6]\nstatus: \"imported\"\n---\n\n# 当院結核病棟における薬剤師の取り組み〜治療完遂のための服薬支援〜\n\n- 演題番号: SY4-2\n- 演題名: 当院結核病棟における薬剤師の取り組み〜治療完遂のための服薬支援〜\n- 所属施設: NHO 東名古屋病院 薬剤部\n- 筆頭演者: 井上 佑美（いのうえ ゆみ）\n- 筆頭演者の所属: NHO 東名古屋病院 薬剤部\n- 演者名: 井上 佑美（いのうえ ゆみ）\n- 原本: [PDF 6ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=6>)\n- 冊子ページ: 250\n\n## 抄録本文\n\n結核治療は多剤併用が原則であり、一般的な抗菌薬と比較して副作用発生頻度は高い。副作用にて休薬した薬剤の再投与が必要となる場合も多く、これらは結核治療の特殊性と言える。また、キードラッグであるリファンピシンは、薬物代謝酵素の誘導作用を有するため、併用薬との薬物相互作用の管理が極めて重要となる。さらに、抗結核薬だけでも 1 回に 10 個近くの錠剤やカプセルを服用する必要があるため、「内服嚥下障害」を有する患者への対応も課題となる。当院結核病棟ではアセスメントツールを用いた内服嚥下障害の評価を行い、必要に応じた服薬支援を行っている。また、長期間に及ぶ結核治療を退院後も途切れることなく支援してもらえるよう、退院時には「薬剤情報連絡書」を作成し、主に保険薬局との薬薬連携を積極的に推進している。今回は、当院結核病棟での薬剤師の取り組みを紹介するとともに、結核治療完遂のための服薬支援について概説する。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 結核治療完遂を、相互作用・副作用管理に加え、内服嚥下障害の評価と退院後の薬薬連携から捉える。\n- アセスメントツールと薬剤情報連絡書をどう使い分けるかが実務的な焦点。長期治療の服薬支援に関心がある人向け。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "SY5-5", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY5", "session_name": "NHO災害医療班・ロジスティクス", "title": "NHO 医療班の薬剤師・業務調整員がこれからやること", "authors": "及川 瞬（おいかわ しゅん）", "first_author": "及川 瞬（おいかわ しゅん）", "affiliations": "NHO 高崎総合医療センター 薬剤部", "first_affiliation": "NHO 高崎総合医療センター 薬剤部", "printed_pages": "253", "pdf_pages": "9", "features": ["NHO医療班の薬剤師・業務調整員の役割を、ロジスティクス・職種別研修・施設間の関係づくりから提案。", "災害拠点病院以外の派遣も踏まえる点が特徴。平時の訓練や調整担当として準備すべき内容を考えられる。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "国立病院機構（以下、NHO）は、災害対策基本法基づき、「指定医療機関」に指定されている。そのため、平時から防災業務計画を作成することや、災害時には国や自治体と連携して医療救護活動等を行う責務が課されている。そのため NHO は災害時に医療支援をおこなうチームとして初動医療班、医療班を組織して活動をおこなっている。しかしながら、チームの全員が災害関係の研修を受けているとは限らない。また、能登半島地震での派遣実績をみると、派遣チームの半分は災害拠点病院ではない病院が被災地支援をおこなっていることから、NHO 全体で災害医療に対するビルドアップが必要である。そのためにはこれから 3 つのことを行っていく必要があると考える。1 つ目はロジスティクスの向上である。医療支援等をおこなうにしても、どこで、いつ、誰と、どのような活動するのか、調整する必要がある。各職種の職能を生かした活動をおこなうことためにも、CSCA の確立をおこなうことが重要であり、災害時のロジスティクス能力の向上を目指していく必要がある。2 つ目は災害に関わる各職種別の研修である。医療班は多職種で構成される医療支援チームであるが、災害時には特別な知識が必要となることもある。そのため、必要となる知識を得るための研修が必要になる。3 つ目は顔の見える関係の構築である。NHO は転勤制度があるため、顔の見える関係が作りやすい部分がある。しかし、他ブロックや他職種に関してはわからない部分も多いため、災害時の対応を見越した顔の見える関係の構築が必要である。これらのことを踏まえ、今後の NHO と災害医療についてシンポジウムでみなさんとディスカッションしたい。"}], "body_text": "国立病院機構（以下、NHO）は、災害対策基本法基づき、「指定医療機関」に指定されている。そのため、平時から防災業務計画を作成することや、災害時には国や自治体と連携して医療救護活動等を行う責務が課されている。そのため NHO は災害時に医療支援をおこなうチームとして初動医療班、医療班を組織して活動をおこなっている。しかしながら、チームの全員が災害関係の研修を受けているとは限らない。また、能登半島地震での派遣実績をみると、派遣チームの半分は災害拠点病院ではない病院が被災地支援をおこなっていることから、NHO 全体で災害医療に対するビルドアップが必要である。そのためにはこれから 3 つのことを行っていく必要があると考える。1 つ目はロジスティクスの向上である。医療支援等をおこなうにしても、どこで、いつ、誰と、どのような活動するのか、調整する必要がある。各職種の職能を生かした活動をおこなうことためにも、CSCA の確立をおこなうことが重要であり、災害時のロジスティクス能力の向上を目指していく必要がある。2 つ目は災害に関わる各職種別の研修である。医療班は多職種で構成される医療支援チームであるが、災害時には特別な知識が必要となることもある。そのため、必要となる知識を得るための研修が必要になる。3 つ目は顔の見える関係の構築である。NHO は転勤制度があるため、顔の見える関係が作りやすい部分がある。しかし、他ブロックや他職種に関してはわからない部分も多いため、災害時の対応を見越した顔の見える関係の構築が必要である。これらのことを踏まえ、今後の NHO と災害医療についてシンポジウムでみなさんとディスカッションしたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY5-5\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [9]\nstatus: \"imported\"\n---\n\n# NHO 医療班の薬剤師・業務調整員がこれからやること\n\n- 演題番号: SY5-5\n- 演題名: NHO 医療班の薬剤師・業務調整員がこれからやること\n- 所属施設: NHO 高崎総合医療センター 薬剤部\n- 筆頭演者: 及川 瞬（おいかわ しゅん）\n- 筆頭演者の所属: NHO 高崎総合医療センター 薬剤部\n- 演者名: 及川 瞬（おいかわ しゅん）\n- 原本: [PDF 9ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=9>)\n- 冊子ページ: 253\n\n## 抄録本文\n\n国立病院機構（以下、NHO）は、災害対策基本法基づき、「指定医療機関」に指定されている。そのため、平時から防災業務計画を作成することや、災害時には国や自治体と連携して医療救護活動等を行う責務が課されている。そのため NHO は災害時に医療支援をおこなうチームとして初動医療班、医療班を組織して活動をおこなっている。しかしながら、チームの全員が災害関係の研修を受けているとは限らない。また、能登半島地震での派遣実績をみると、派遣チームの半分は災害拠点病院ではない病院が被災地支援をおこなっていることから、NHO 全体で災害医療に対するビルドアップが必要である。そのためにはこれから 3 つのことを行っていく必要があると考える。1 つ目はロジスティクスの向上である。医療支援等をおこなうにしても、どこで、いつ、誰と、どのような活動するのか、調整する必要がある。各職種の職能を生かした活動をおこなうことためにも、CSCA の確立をおこなうことが重要であり、災害時のロジスティクス能力の向上を目指していく必要がある。2 つ目は災害に関わる各職種別の研修である。医療班は多職種で構成される医療支援チームであるが、災害時には特別な知識が必要となることもある。そのため、必要となる知識を得るための研修が必要になる。3 つ目は顔の見える関係の構築である。NHO は転勤制度があるため、顔の見える関係が作りやすい部分がある。しかし、他ブロックや他職種に関してはわからない部分も多いため、災害時の対応を見越した顔の見える関係の構築が必要である。これらのことを踏まえ、今後の NHO と災害医療についてシンポジウムでみなさんとディスカッションしたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- NHO医療班の薬剤師・業務調整員の役割を、ロジスティクス・職種別研修・施設間の関係づくりから提案。\n- 災害拠点病院以外の派遣も踏まえる点が特徴。平時の訓練や調整担当として準備すべき内容を考えられる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "SY16-1", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY16", "session_name": "2040年に向けた薬薬連携・ポリファーマシー", "title": "薬薬連携の現状と課題〜2040 年に向けて、今できることは何か〜（趣旨説明）", "authors": "阿部 直樹（あべ なおき）", "first_author": "阿部 直樹（あべ なおき）", "affiliations": "NHO 信州上田医療センター 薬剤部", "first_affiliation": "NHO 信州上田医療センター 薬剤部", "printed_pages": "268", "pdf_pages": "24", "features": ["2040年を見据えた薬薬連携の課題を、情報の双方向性、様式、ICT、対面交流の観点から整理する趣旨説明。", "個別ツールの導入にとどまらず、限られた人員で継続できる地域連携の設計を議論するための全体像を得られる。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "地域包括ケアシステムの推進を背景に、病院薬剤師と薬局薬剤師が患者の薬物治療を切れ目なく支える「薬薬連携」の重要性はこれまで以上に高まっている。2040 年には 85 歳以上の高齢者人口がピークを迎え、生産年齢人口の減少により医療・介護の担い手不足がより深刻化することが見込まれている中で、国が示す新たな地域医療構想においても外来・在宅連携の強化は目指すべき方向性とされている。薬薬連携は目先の業務改善にとどまらず、限られた医療資源で機能する持続可能な地域医療提供体制を支える基盤として位置づけられる。現在、薬薬連携のツールとしては、お薬手帳、トレーシングレポート、退院時薬剤管理サマリーなどが活用されており、診療報酬上も、薬剤総合評価調整加算、連携充実加算、服薬情報等提供料、地域支援・医薬品供給対応体制加算等で評価がなされ、電子的診療情報連携体制整備加算をはじめとする医療 DX 関連加算の新設・見直しにより、病院・薬局双方における情報連携基盤の強化が後押しされている。しかしながら、実態を見ると情報連携は一方通行であることも多く、双方向性の連携については十分に定着しているとは言えない。退院時情報の到達遅延や連携フォーマットの不統一、連携情報の電子的情報基盤の活用不足なども連携における課題として残っている。加えてコロナ禍以降の「顔の見える関係」構築の機会の減少、薬局薬剤師が患者の臨床情報にアクセスしづらい環境なども双方向連携の障壁となっている。こうした制度動向や環境・構造変化を踏まえ、ICT の有効活用、合同研修などを含めた連携強化のあり方について各施設の取り組みを踏まえつつ建設的な議論を行っていきたい。"}], "body_text": "地域包括ケアシステムの推進を背景に、病院薬剤師と薬局薬剤師が患者の薬物治療を切れ目なく支える「薬薬連携」の重要性はこれまで以上に高まっている。2040 年には 85 歳以上の高齢者人口がピークを迎え、生産年齢人口の減少により医療・介護の担い手不足がより深刻化することが見込まれている中で、国が示す新たな地域医療構想においても外来・在宅連携の強化は目指すべき方向性とされている。薬薬連携は目先の業務改善にとどまらず、限られた医療資源で機能する持続可能な地域医療提供体制を支える基盤として位置づけられる。現在、薬薬連携のツールとしては、お薬手帳、トレーシングレポート、退院時薬剤管理サマリーなどが活用されており、診療報酬上も、薬剤総合評価調整加算、連携充実加算、服薬情報等提供料、地域支援・医薬品供給対応体制加算等で評価がなされ、電子的診療情報連携体制整備加算をはじめとする医療 DX 関連加算の新設・見直しにより、病院・薬局双方における情報連携基盤の強化が後押しされている。しかしながら、実態を見ると情報連携は一方通行であることも多く、双方向性の連携については十分に定着しているとは言えない。退院時情報の到達遅延や連携フォーマットの不統一、連携情報の電子的情報基盤の活用不足なども連携における課題として残っている。加えてコロナ禍以降の「顔の見える関係」構築の機会の減少、薬局薬剤師が患者の臨床情報にアクセスしづらい環境なども双方向連携の障壁となっている。こうした制度動向や環境・構造変化を踏まえ、ICT の有効活用、合同研修などを含めた連携強化のあり方について各施設の取り組みを踏まえつつ建設的な議論を行っていきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY16-1\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [24]\nstatus: \"imported\"\n---\n\n# 薬薬連携の現状と課題〜2040 年に向けて、今できることは何か〜（趣旨説明）\n\n- 演題番号: SY16-1\n- 演題名: 薬薬連携の現状と課題〜2040 年に向けて、今できることは何か〜（趣旨説明）\n- 所属施設: NHO 信州上田医療センター 薬剤部\n- 筆頭演者: 阿部 直樹（あべ なおき）\n- 筆頭演者の所属: NHO 信州上田医療センター 薬剤部\n- 演者名: 阿部 直樹（あべ なおき）\n- 原本: [PDF 24ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=24>)\n- 冊子ページ: 268\n\n## 抄録本文\n\n地域包括ケアシステムの推進を背景に、病院薬剤師と薬局薬剤師が患者の薬物治療を切れ目なく支える「薬薬連携」の重要性はこれまで以上に高まっている。2040 年には 85 歳以上の高齢者人口がピークを迎え、生産年齢人口の減少により医療・介護の担い手不足がより深刻化することが見込まれている中で、国が示す新たな地域医療構想においても外来・在宅連携の強化は目指すべき方向性とされている。薬薬連携は目先の業務改善にとどまらず、限られた医療資源で機能する持続可能な地域医療提供体制を支える基盤として位置づけられる。現在、薬薬連携のツールとしては、お薬手帳、トレーシングレポート、退院時薬剤管理サマリーなどが活用されており、診療報酬上も、薬剤総合評価調整加算、連携充実加算、服薬情報等提供料、地域支援・医薬品供給対応体制加算等で評価がなされ、電子的診療情報連携体制整備加算をはじめとする医療 DX 関連加算の新設・見直しにより、病院・薬局双方における情報連携基盤の強化が後押しされている。しかしながら、実態を見ると情報連携は一方通行であることも多く、双方向性の連携については十分に定着しているとは言えない。退院時情報の到達遅延や連携フォーマットの不統一、連携情報の電子的情報基盤の活用不足なども連携における課題として残っている。加えてコロナ禍以降の「顔の見える関係」構築の機会の減少、薬局薬剤師が患者の臨床情報にアクセスしづらい環境なども双方向連携の障壁となっている。こうした制度動向や環境・構造変化を踏まえ、ICT の有効活用、合同研修などを含めた連携強化のあり方について各施設の取り組みを踏まえつつ建設的な議論を行っていきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 2040年を見据えた薬薬連携の課題を、情報の双方向性、様式、ICT、対面交流の観点から整理する趣旨説明。\n- 個別ツールの導入にとどまらず、限られた人員で継続できる地域連携の設計を議論するための全体像を得られる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "SY16-2", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY16", "session_name": "2040年に向けた薬薬連携・ポリファーマシー", "title": "心不全患者における多職種での関わり〜外来から入院へ、入院から外来へ〜", "authors": "市川 瑞季（いちかわ みずき）", "first_author": "市川 瑞季（いちかわ みずき）", "affiliations": "NHO 静岡医療センター 薬剤部", "first_affiliation": "NHO 静岡医療センター 薬剤部", "printed_pages": "268", "pdf_pages": "24", "features": ["心不全の退院後の脆弱期を意識し、多職種カンファレンスと地域薬剤師への情報提供を振り返る。", "年約12件のサマリー送付に返信0件という課題を率直に示す。地域側のニーズを取り入れる連携改善に注目したい。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "昨今、心不全パンデミックという言葉が生まれ、心血管病の最終病期である心不全患者が激増し、病院、地域、外来などにおける介入、連携が求められている。薬局においては 2024年度診療報酬改定で調剤後薬剤管理指導料 2 の対象疾患に慢性心不全が追加され、医療機関においては 2026 年度診療報酬改定で心不全再入院予防継続管理料が新設された。\n\n慢性心不全は、比較的療養期間が長く、入退院を繰り返しながら徐々に身体機能・ADL が低下していく。特に、退院後 3-6 か月は再入院リスクが高い「脆弱期」とされ、この期間に再入院をさせないための介入が重要である。\n\n当院は地方循環器病センターとして、「循環器病」に関する中心施設に位置付けられており、2015 年から循環器医、心不全認定看護師を中心に、「脆弱期」に対する対策として 2 週に1 回心不全カンファレンスを実施している。カンファレンスでは医師、看護師（循環器病棟、循環器外来）、理学療法士、管理栄養士、臨床心理士、MSW、薬剤師が集合し、病棟から抽出された患者の問題点を共有し、退院に向けた介入事項を整理している。\n\n薬剤師は、薬剤管理サマリーを作成し、年 12 件程度かかりつけ薬局に FAX を行っているが、返信件数は 0 件である。また、退院後在宅カンファレンスに同席した際に、病院と在宅の治療方針の違いなど理想と現実のギャップを目の当たりにした。\n\nこれらの経験を元に、当院薬剤部では、実効性の高い薬薬連携を目的としたアンケートを地域の薬剤師会に実施し、「脆弱期」を含む長い療養期間における心不全患者の ADL、QOL 維持に貢献するため動き出した。本シンポジウムでは、それら当院での取り組みについて紹介する。"}], "body_text": "昨今、心不全パンデミックという言葉が生まれ、心血管病の最終病期である心不全患者が激増し、病院、地域、外来などにおける介入、連携が求められている。薬局においては 2024年度診療報酬改定で調剤後薬剤管理指導料 2 の対象疾患に慢性心不全が追加され、医療機関においては 2026 年度診療報酬改定で心不全再入院予防継続管理料が新設された。\n\n慢性心不全は、比較的療養期間が長く、入退院を繰り返しながら徐々に身体機能・ADL が低下していく。特に、退院後 3-6 か月は再入院リスクが高い「脆弱期」とされ、この期間に再入院をさせないための介入が重要である。\n\n当院は地方循環器病センターとして、「循環器病」に関する中心施設に位置付けられており、2015 年から循環器医、心不全認定看護師を中心に、「脆弱期」に対する対策として 2 週に1 回心不全カンファレンスを実施している。カンファレンスでは医師、看護師（循環器病棟、循環器外来）、理学療法士、管理栄養士、臨床心理士、MSW、薬剤師が集合し、病棟から抽出された患者の問題点を共有し、退院に向けた介入事項を整理している。\n\n薬剤師は、薬剤管理サマリーを作成し、年 12 件程度かかりつけ薬局に FAX を行っているが、返信件数は 0 件である。また、退院後在宅カンファレンスに同席した際に、病院と在宅の治療方針の違いなど理想と現実のギャップを目の当たりにした。\n\nこれらの経験を元に、当院薬剤部では、実効性の高い薬薬連携を目的としたアンケートを地域の薬剤師会に実施し、「脆弱期」を含む長い療養期間における心不全患者の ADL、QOL 維持に貢献するため動き出した。本シンポジウムでは、それら当院での取り組みについて紹介する。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY16-2\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [24]\nstatus: \"imported\"\n---\n\n# 心不全患者における多職種での関わり〜外来から入院へ、入院から外来へ〜\n\n- 演題番号: SY16-2\n- 演題名: 心不全患者における多職種での関わり〜外来から入院へ、入院から外来へ〜\n- 所属施設: NHO 静岡医療センター 薬剤部\n- 筆頭演者: 市川 瑞季（いちかわ みずき）\n- 筆頭演者の所属: NHO 静岡医療センター 薬剤部\n- 演者名: 市川 瑞季（いちかわ みずき）\n- 原本: [PDF 24ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=24>)\n- 冊子ページ: 268\n\n## 抄録本文\n\n昨今、心不全パンデミックという言葉が生まれ、心血管病の最終病期である心不全患者が激増し、病院、地域、外来などにおける介入、連携が求められている。薬局においては 2024年度診療報酬改定で調剤後薬剤管理指導料 2 の対象疾患に慢性心不全が追加され、医療機関においては 2026 年度診療報酬改定で心不全再入院予防継続管理料が新設された。\n\n慢性心不全は、比較的療養期間が長く、入退院を繰り返しながら徐々に身体機能・ADL が低下していく。特に、退院後 3-6 か月は再入院リスクが高い「脆弱期」とされ、この期間に再入院をさせないための介入が重要である。\n\n当院は地方循環器病センターとして、「循環器病」に関する中心施設に位置付けられており、2015 年から循環器医、心不全認定看護師を中心に、「脆弱期」に対する対策として 2 週に1 回心不全カンファレンスを実施している。カンファレンスでは医師、看護師（循環器病棟、循環器外来）、理学療法士、管理栄養士、臨床心理士、MSW、薬剤師が集合し、病棟から抽出された患者の問題点を共有し、退院に向けた介入事項を整理している。\n\n薬剤師は、薬剤管理サマリーを作成し、年 12 件程度かかりつけ薬局に FAX を行っているが、返信件数は 0 件である。また、退院後在宅カンファレンスに同席した際に、病院と在宅の治療方針の違いなど理想と現実のギャップを目の当たりにした。\n\nこれらの経験を元に、当院薬剤部では、実効性の高い薬薬連携を目的としたアンケートを地域の薬剤師会に実施し、「脆弱期」を含む長い療養期間における心不全患者の ADL、QOL 維持に貢献するため動き出した。本シンポジウムでは、それら当院での取り組みについて紹介する。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 心不全の退院後の脆弱期を意識し、多職種カンファレンスと地域薬剤師への情報提供を振り返る。\n- 年約12件のサマリー送付に返信0件という課題を率直に示す。地域側のニーズを取り入れる連携改善に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "SY16-3", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY16", "session_name": "2040年に向けた薬薬連携・ポリファーマシー", "title": "地域に密着した連携と今後の展望〜長崎医療センターの事例〜", "authors": "橋本 未雷（はしもと みらい）", "first_author": "橋本 未雷（はしもと みらい）", "affiliations": "NHO 長崎医療センター 薬剤部", "first_affiliation": "NHO 長崎医療センター 薬剤部", "printed_pages": "268", "pdf_pages": "24", "features": ["定期協議・合同勉強会・疑義照会簡略化・研究支援まで、地域との多面的な薬薬連携を紹介。", "顔の見える関係を基盤に、課題の集約やICTで継続性を高める構想が特徴。複数の活動を連携体制へ育てる方法に学べる。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "医療機能の分化と高齢化に伴い、保険薬局薬剤師と病院薬剤師が緊密に繋がる薬薬連携は、地域で安全かつ切れ目のない薬物療法を担保する重要基盤である。患者が一貫した質の高い薬学管理を受けられる体制の構築は、病院薬剤師が果たすべき不可欠な役割と言える。\n\n長崎医療センター（以下、当院）はこれまで、顔の見える関係を基盤に多角的な連携を展開してきた。具体的には、医薬品の安定供給や問題事例に対応する定期ミーティング、地域全体の知識底上げを図る合同勉強会に加え、連携充実加算の質向上を見据えたトレーシングレポート推進の少人数勉強会を継続している。さらに、行政委託による地域連携研修への協力、薬剤師会と連携した採用医薬品情報の迅速な共有、疑義照会簡略化プロトコルの運用、当院医師の臨床疑問をもとにした臨床研究への支援など、実務から学術まで幅広く地域との協働を深めてきた。\n\n近年は医薬品供給不足や診療報酬改定、DX 推進など地域で解決すべき課題が増加し、双方向の情報共有の重要性はますます高まっている。しかし、多様化する課題に対し、従来の対面手法や一過性の情報共有だけではタイムリーな対応や蓄積データの有効活用に限界がある。今後は、日々の連携で得られた課題を地域の共通財産として集約・フィードバックする仕組みづくりや、業務負担を軽減する ICT の活用など、持続可能な連携モデルをどのように構築していくかが当院の次なる課題である。\n\n本シンポジウムでは、これまでの地道な取り組みを振り返るとともに、地域全体で一歩先へ進むために今後どのような情報共有体制を目指すべきか、そのあり方について考察する。"}], "body_text": "医療機能の分化と高齢化に伴い、保険薬局薬剤師と病院薬剤師が緊密に繋がる薬薬連携は、地域で安全かつ切れ目のない薬物療法を担保する重要基盤である。患者が一貫した質の高い薬学管理を受けられる体制の構築は、病院薬剤師が果たすべき不可欠な役割と言える。\n\n長崎医療センター（以下、当院）はこれまで、顔の見える関係を基盤に多角的な連携を展開してきた。具体的には、医薬品の安定供給や問題事例に対応する定期ミーティング、地域全体の知識底上げを図る合同勉強会に加え、連携充実加算の質向上を見据えたトレーシングレポート推進の少人数勉強会を継続している。さらに、行政委託による地域連携研修への協力、薬剤師会と連携した採用医薬品情報の迅速な共有、疑義照会簡略化プロトコルの運用、当院医師の臨床疑問をもとにした臨床研究への支援など、実務から学術まで幅広く地域との協働を深めてきた。\n\n近年は医薬品供給不足や診療報酬改定、DX 推進など地域で解決すべき課題が増加し、双方向の情報共有の重要性はますます高まっている。しかし、多様化する課題に対し、従来の対面手法や一過性の情報共有だけではタイムリーな対応や蓄積データの有効活用に限界がある。今後は、日々の連携で得られた課題を地域の共通財産として集約・フィードバックする仕組みづくりや、業務負担を軽減する ICT の活用など、持続可能な連携モデルをどのように構築していくかが当院の次なる課題である。\n\n本シンポジウムでは、これまでの地道な取り組みを振り返るとともに、地域全体で一歩先へ進むために今後どのような情報共有体制を目指すべきか、そのあり方について考察する。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY16-3\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [24]\nstatus: \"imported\"\n---\n\n# 地域に密着した連携と今後の展望〜長崎医療センターの事例〜\n\n- 演題番号: SY16-3\n- 演題名: 地域に密着した連携と今後の展望〜長崎医療センターの事例〜\n- 所属施設: NHO 長崎医療センター 薬剤部\n- 筆頭演者: 橋本 未雷（はしもと みらい）\n- 筆頭演者の所属: NHO 長崎医療センター 薬剤部\n- 演者名: 橋本 未雷（はしもと みらい）\n- 原本: [PDF 24ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=24>)\n- 冊子ページ: 268\n\n## 抄録本文\n\n医療機能の分化と高齢化に伴い、保険薬局薬剤師と病院薬剤師が緊密に繋がる薬薬連携は、地域で安全かつ切れ目のない薬物療法を担保する重要基盤である。患者が一貫した質の高い薬学管理を受けられる体制の構築は、病院薬剤師が果たすべき不可欠な役割と言える。\n\n長崎医療センター（以下、当院）はこれまで、顔の見える関係を基盤に多角的な連携を展開してきた。具体的には、医薬品の安定供給や問題事例に対応する定期ミーティング、地域全体の知識底上げを図る合同勉強会に加え、連携充実加算の質向上を見据えたトレーシングレポート推進の少人数勉強会を継続している。さらに、行政委託による地域連携研修への協力、薬剤師会と連携した採用医薬品情報の迅速な共有、疑義照会簡略化プロトコルの運用、当院医師の臨床疑問をもとにした臨床研究への支援など、実務から学術まで幅広く地域との協働を深めてきた。\n\n近年は医薬品供給不足や診療報酬改定、DX 推進など地域で解決すべき課題が増加し、双方向の情報共有の重要性はますます高まっている。しかし、多様化する課題に対し、従来の対面手法や一過性の情報共有だけではタイムリーな対応や蓄積データの有効活用に限界がある。今後は、日々の連携で得られた課題を地域の共通財産として集約・フィードバックする仕組みづくりや、業務負担を軽減する ICT の活用など、持続可能な連携モデルをどのように構築していくかが当院の次なる課題である。\n\n本シンポジウムでは、これまでの地道な取り組みを振り返るとともに、地域全体で一歩先へ進むために今後どのような情報共有体制を目指すべきか、そのあり方について考察する。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 定期協議・合同勉強会・疑義照会簡略化・研究支援まで、地域との多面的な薬薬連携を紹介。\n- 顔の見える関係を基盤に、課題の集約やICTで継続性を高める構想が特徴。複数の活動を連携体制へ育てる方法に学べる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "SY16-4", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY16", "session_name": "2040年に向けた薬薬連携・ポリファーマシー", "title": "がん治療における薬薬連携の未来〜PHR の導入と課題〜", "authors": "鈴木 訓史（すずき のりふみ）、 西村 康人（にしむら やすひと）", "first_author": "鈴木 訓史（すずき のりふみ）", "affiliations": "NHO 仙台医療センター 薬剤部", "first_affiliation": "NHO 仙台医療センター 薬剤部", "printed_pages": "269", "pdf_pages": "25", "features": ["がん治療の面談・トレーシングレポートを補うPHRを試験導入し、日々の症状把握のあり方を検討。", "患者背景に応じて面談・電話と組み合わせる視点が特徴。導入段階の運用課題と情報を対応へつなぐ方法を確認したい。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "がん治療の高度化に伴い、経口抗がん薬の普及や外来治療の増加により、患者自身による副作用管理の重要性が高まっている。この中で薬剤師外来は、診察前に服薬状況や有害事象を詳細に評価し、支持療法の提案や処方支援を行うことで、アドヒアランス向上と安全性確保に寄与している。また、ePRO は患者の QOL 向上や予後改善に寄与することが報告されており、継続的な症状把握の重要性が示されている。さらに PHR（Personal Health Record）は、患者主体の情報共有を可能とし、セルフマネジメントの促進や医療者間の情報連携強化に有用であることが報告されている。一方、薬薬連携は依然として十分とは言えず、トレーシングレポート（TR）の活用や副作用モニタリング体制のさらなる強化が求められている。現在実施している TR による情報共有や、受診日における診察前の薬剤師面談は、患者の状態把握や処方支援に有用である一方、情報収集のタイミングが限定されるため、日々変化する副作用をリアルタイムに把握することには限界がある。当院では 2026 年 5 月より、「ヘルスケアパスポート」を試験的に導入し、患者を中心とした情報共有基盤の構築を進めている。PHR 導入は一定の課題を有しており、一律に導入するのではなく、患者の背景やニーズに応じた適切な活用方法を検討し、従来の薬剤師面談やテレフォンフォローなどを組み合わせた患者中心の副作用モニタリング体制を構築することが重要である。本シンポジウムでは、がん治療における薬薬連携の未来として、PHR の導入と課題について議論したいと思う。"}], "body_text": "がん治療の高度化に伴い、経口抗がん薬の普及や外来治療の増加により、患者自身による副作用管理の重要性が高まっている。この中で薬剤師外来は、診察前に服薬状況や有害事象を詳細に評価し、支持療法の提案や処方支援を行うことで、アドヒアランス向上と安全性確保に寄与している。また、ePRO は患者の QOL 向上や予後改善に寄与することが報告されており、継続的な症状把握の重要性が示されている。さらに PHR（Personal Health Record）は、患者主体の情報共有を可能とし、セルフマネジメントの促進や医療者間の情報連携強化に有用であることが報告されている。一方、薬薬連携は依然として十分とは言えず、トレーシングレポート（TR）の活用や副作用モニタリング体制のさらなる強化が求められている。現在実施している TR による情報共有や、受診日における診察前の薬剤師面談は、患者の状態把握や処方支援に有用である一方、情報収集のタイミングが限定されるため、日々変化する副作用をリアルタイムに把握することには限界がある。当院では 2026 年 5 月より、「ヘルスケアパスポート」を試験的に導入し、患者を中心とした情報共有基盤の構築を進めている。PHR 導入は一定の課題を有しており、一律に導入するのではなく、患者の背景やニーズに応じた適切な活用方法を検討し、従来の薬剤師面談やテレフォンフォローなどを組み合わせた患者中心の副作用モニタリング体制を構築することが重要である。本シンポジウムでは、がん治療における薬薬連携の未来として、PHR の導入と課題について議論したいと思う。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY16-4\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [25]\nstatus: \"imported\"\n---\n\n# がん治療における薬薬連携の未来〜PHR の導入と課題〜\n\n- 演題番号: SY16-4\n- 演題名: がん治療における薬薬連携の未来〜PHR の導入と課題〜\n- 所属施設: NHO 仙台医療センター 薬剤部\n- 筆頭演者: 鈴木 訓史（すずき のりふみ）\n- 筆頭演者の所属: NHO 仙台医療センター 薬剤部\n- 演者名: 鈴木 訓史（すずき のりふみ）、 西村 康人（にしむら やすひと）\n- 原本: [PDF 25ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=25>)\n- 冊子ページ: 269\n\n## 抄録本文\n\nがん治療の高度化に伴い、経口抗がん薬の普及や外来治療の増加により、患者自身による副作用管理の重要性が高まっている。この中で薬剤師外来は、診察前に服薬状況や有害事象を詳細に評価し、支持療法の提案や処方支援を行うことで、アドヒアランス向上と安全性確保に寄与している。また、ePRO は患者の QOL 向上や予後改善に寄与することが報告されており、継続的な症状把握の重要性が示されている。さらに PHR（Personal Health Record）は、患者主体の情報共有を可能とし、セルフマネジメントの促進や医療者間の情報連携強化に有用であることが報告されている。一方、薬薬連携は依然として十分とは言えず、トレーシングレポート（TR）の活用や副作用モニタリング体制のさらなる強化が求められている。現在実施している TR による情報共有や、受診日における診察前の薬剤師面談は、患者の状態把握や処方支援に有用である一方、情報収集のタイミングが限定されるため、日々変化する副作用をリアルタイムに把握することには限界がある。当院では 2026 年 5 月より、「ヘルスケアパスポート」を試験的に導入し、患者を中心とした情報共有基盤の構築を進めている。PHR 導入は一定の課題を有しており、一律に導入するのではなく、患者の背景やニーズに応じた適切な活用方法を検討し、従来の薬剤師面談やテレフォンフォローなどを組み合わせた患者中心の副作用モニタリング体制を構築することが重要である。本シンポジウムでは、がん治療における薬薬連携の未来として、PHR の導入と課題について議論したいと思う。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- がん治療の面談・トレーシングレポートを補うPHRを試験導入し、日々の症状把握のあり方を検討。\n- 患者背景に応じて面談・電話と組み合わせる視点が特徴。導入段階の運用課題と情報を対応へつなぐ方法を確認したい。\n\n", "rec_grade": "B", "rec_perspective": "がんPHR・ePRO連携", "rec_reason": "受診日面談やTRでは拾いきれない日々の副作用変化に対し、PHR「ヘルスケアパスポート」を試験導入し、電話フォローや面談と組み合わせる次世代の患者中心モニタリングを提示。"}, {"id": "SY16-5", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY16", "session_name": "2040年に向けた薬薬連携・ポリファーマシー", "title": "薬物療法情報提供書作成ガイド―切れ目のない包括的視点に基づくポリファーマシー対策―", "authors": "溝神 文博（みぞかみ ふみひろ） 1,2,3", "first_author": "溝神 文博（みぞかみ ふみひろ） 1,2,3", "affiliations": "1 国立研究開発法人 国立長寿医療研究センター 薬剤部、 2 国立研究開発法人 国立長寿医療研究センター 長寿医療研修部 高齢者薬学教育研修室、 3 国立研究開発法人 国立長寿医療研究センター ジェロサイエンス研究センター 高齢者薬物療法研究グ ループ", "first_affiliation": "国立研究開発法人 国立長寿医療研究センター 薬剤部 / 国立研究開発法人 国立長寿医療研究センター 長寿医療研修部 高齢者薬学教育研修室 / 国立研究開発法人 国立長寿医療研究センター ジェロサイエンス研究センター 高齢者薬物療法研究グ ループ", "printed_pages": "269", "pdf_pages": "25", "features": ["薬物療法情報提供書にCGAの視点を取り入れ、処方変更の意図と生活機能・生活環境を多職種で共有する提案。", "ポリファーマシー対策を療養環境移行後も継続するための文書設計が中心。具体的な記載項目と活用例に注目できる。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "高齢化の進展と医療・介護ニーズの増大に伴い、病院から地域へと切れ目なく薬物療法を継続する体制の構築が求められており、特に高齢患者では、多疾患併存やポリファーマシーを背景として、入退院や在宅移行のたびに療養環境が変化するため、処方変更の意図や薬学的評価、経過観察のポイントなどが適切に共有されなければ、薬物療法の質を維持することは困難である。ポリファーマシー対策は単なる減薬ではなく、患者の生活機能や価値観を踏まえた薬物療法を地域全体で継続的に支える取り組みとして実践する必要がある。令和 8年度診療報酬改定では、薬剤総合評価調整加算の算定要件として、退院時における情報提供書を用いた情報共有が必須に位置付けられ、薬剤師のみではなく医師を含めた多職種へ情報をつなぐ役割がこれまで以上に期待されている。このような背景のもと、「薬物療法情報提供書作成ガイド」を策定した。処方変更内容だけでなく、高齢者総合機能評価（CGA）の視点を取り入れ、薬剤起因性老年症候群、認知機能、ADL、栄養状態、生活環境などを含めた包括的な情報共有を推奨している。これにより、病院と地域薬局、さらには医師、訪問看護師、ケアマネジャーなど多職種が共通の視点で患者を理解し、継続的な薬物療法管理を実践することが可能となる。本発表では、薬物療法情報提供書を活用した薬薬連携の考え方と、病院における運用のポイント、療養環境移行時における情報共有の実践例を紹介する。薬物療法情報提供書を単なる情報伝達文書ではなく、多職種をつなぐ共通言語として活用することで、切れ目のないポリファーマシー対策を実装するための病院薬剤師の役割について考えたい。"}], "body_text": "高齢化の進展と医療・介護ニーズの増大に伴い、病院から地域へと切れ目なく薬物療法を継続する体制の構築が求められており、特に高齢患者では、多疾患併存やポリファーマシーを背景として、入退院や在宅移行のたびに療養環境が変化するため、処方変更の意図や薬学的評価、経過観察のポイントなどが適切に共有されなければ、薬物療法の質を維持することは困難である。ポリファーマシー対策は単なる減薬ではなく、患者の生活機能や価値観を踏まえた薬物療法を地域全体で継続的に支える取り組みとして実践する必要がある。令和 8年度診療報酬改定では、薬剤総合評価調整加算の算定要件として、退院時における情報提供書を用いた情報共有が必須に位置付けられ、薬剤師のみではなく医師を含めた多職種へ情報をつなぐ役割がこれまで以上に期待されている。このような背景のもと、「薬物療法情報提供書作成ガイド」を策定した。処方変更内容だけでなく、高齢者総合機能評価（CGA）の視点を取り入れ、薬剤起因性老年症候群、認知機能、ADL、栄養状態、生活環境などを含めた包括的な情報共有を推奨している。これにより、病院と地域薬局、さらには医師、訪問看護師、ケアマネジャーなど多職種が共通の視点で患者を理解し、継続的な薬物療法管理を実践することが可能となる。本発表では、薬物療法情報提供書を活用した薬薬連携の考え方と、病院における運用のポイント、療養環境移行時における情報共有の実践例を紹介する。薬物療法情報提供書を単なる情報伝達文書ではなく、多職種をつなぐ共通言語として活用することで、切れ目のないポリファーマシー対策を実装するための病院薬剤師の役割について考えたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY16-5\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [25]\nstatus: \"imported\"\n---\n\n# 薬物療法情報提供書作成ガイド―切れ目のない包括的視点に基づくポリファーマシー対策―\n\n- 演題番号: SY16-5\n- 演題名: 薬物療法情報提供書作成ガイド―切れ目のない包括的視点に基づくポリファーマシー対策―\n- 所属施設: 1 国立研究開発法人 国立長寿医療研究センター 薬剤部、 2 国立研究開発法人 国立長寿医療研究センター 長寿医療研修部 高齢者薬学教育研修室、 3 国立研究開発法人 国立長寿医療研究センター ジェロサイエンス研究センター 高齢者薬物療法研究グ ループ\n- 筆頭演者: 溝神 文博（みぞかみ ふみひろ） 1,2,3\n- 筆頭演者の所属: 国立研究開発法人 国立長寿医療研究センター 薬剤部 / 国立研究開発法人 国立長寿医療研究センター 長寿医療研修部 高齢者薬学教育研修室 / 国立研究開発法人 国立長寿医療研究センター ジェロサイエンス研究センター 高齢者薬物療法研究グ ループ\n- 演者名: 溝神 文博（みぞかみ ふみひろ） 1,2,3\n- 原本: [PDF 25ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=25>)\n- 冊子ページ: 269\n\n## 抄録本文\n\n高齢化の進展と医療・介護ニーズの増大に伴い、病院から地域へと切れ目なく薬物療法を継続する体制の構築が求められており、特に高齢患者では、多疾患併存やポリファーマシーを背景として、入退院や在宅移行のたびに療養環境が変化するため、処方変更の意図や薬学的評価、経過観察のポイントなどが適切に共有されなければ、薬物療法の質を維持することは困難である。ポリファーマシー対策は単なる減薬ではなく、患者の生活機能や価値観を踏まえた薬物療法を地域全体で継続的に支える取り組みとして実践する必要がある。令和 8年度診療報酬改定では、薬剤総合評価調整加算の算定要件として、退院時における情報提供書を用いた情報共有が必須に位置付けられ、薬剤師のみではなく医師を含めた多職種へ情報をつなぐ役割がこれまで以上に期待されている。このような背景のもと、「薬物療法情報提供書作成ガイド」を策定した。処方変更内容だけでなく、高齢者総合機能評価（CGA）の視点を取り入れ、薬剤起因性老年症候群、認知機能、ADL、栄養状態、生活環境などを含めた包括的な情報共有を推奨している。これにより、病院と地域薬局、さらには医師、訪問看護師、ケアマネジャーなど多職種が共通の視点で患者を理解し、継続的な薬物療法管理を実践することが可能となる。本発表では、薬物療法情報提供書を活用した薬薬連携の考え方と、病院における運用のポイント、療養環境移行時における情報共有の実践例を紹介する。薬物療法情報提供書を単なる情報伝達文書ではなく、多職種をつなぐ共通言語として活用することで、切れ目のないポリファーマシー対策を実装するための病院薬剤師の役割について考えたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 薬物療法情報提供書にCGAの視点を取り入れ、処方変更の意図と生活機能・生活環境を多職種で共有する提案。\n- ポリファーマシー対策を療養環境移行後も継続するための文書設計が中心。具体的な記載項目と活用例に注目できる。\n\n", "rec_grade": "A", "rec_perspective": "ポリファーマシー・2026改定", "rec_reason": "令和8年度改定で必須化された退院時情報提供書について、単なる処方変更伝達ではなくCGA（高齢者総合機能評価：認知・ADL・栄養・生活環境）を統合した「作成ガイド」を提示。多職種共通言語としての必読指針。"}, {"id": "SY34-1", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY34", "session_name": "各地区国立病院薬剤師会の臨床研究支援", "title": "関信地区国立病院薬剤師会の取り組み〜つなげるバトン これまでとこれから〜", "authors": "及川 瞬（おいかわ しゅん） 1、 武内 偲乃（たけうち しの） 8、 盛川 敬介（もりかわ けいすけ） 7、 根岸 大輔（ねぎし だいすけ） 1、 佐野 智望（さの ともあき） 9、青 山 大樹（あおやま だいき） 8、 上田 真也（うえだ しんや） 7、 齊藤 達也（さいとう 模索したい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY34-1\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [312]\nstatus: \"imported\"\n---\n\n# 関信地区国立病院薬剤師会の取り組み〜つなげるバトン これまでとこれから〜\n\n- 演題番号: SY34-1\n- 演題名: 関信地区国立病院薬剤師会の取り組み〜つなげるバトン これまでとこれから〜\n- 所属施設: 1 NHO 高崎総合医療センター 薬剤部、2 NHO 信州上田医療センター 薬剤部、 3 NHO 埼玉病院 薬剤部、4 国立研究開発法人 国立国際医療研究センター国府台病院 薬剤部、 5 NHO 下総精神医療センター 薬剤科、6 NHO 千葉医療センター 薬剤部、 7 NHO 東京医療センター 薬剤部、8 NHO 横浜医療センター 薬剤部、 9 国立研究開発法人 国立がん研究センター中央病院 薬剤部\n- 筆頭演者: 及川 瞬（おいかわ しゅん） 1\n- 筆頭演者の所属: NHO 高崎総合医療センター 薬剤部\n- 演者名: 及川 瞬（おいかわ しゅん） 1、 武内 偲乃（たけうち しの） 8、 盛川 敬介（もりかわ けいすけ） 7、 根岸 大輔（ねぎし だいすけ） 1、 佐野 智望（さの ともあき） 9、青 山 大樹（あおやま だいき） 8、 上田 真也（うえだ しんや） 7、 齊藤 達也（さいとう たつや） 6、 大竹 将司（おおたけ まさし） 5、 赤木 祐貴（あかぎ ゆうき） 3、 高橋 郷（たかはし ごう） 4、 阿部 直樹（あべ なおき） 2\n- 原本: [PDF 312ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=312>)\n- 冊子ページ: 556\n\n## 抄録本文\n\n関信地区国立病院薬剤師会では、薬剤師が臨床研究や薬剤業務研究を行うための知識を習得し、研究計画の立案から実践までを自立して行えるようになることを目指し、2013 年より「臨床研究推進研修会」を立ち上げ継続して開催してきた。本研修会は、約 10 ヶ月の期間中に受講生が各自の臨床疑問からテーマを設定し、研究計画書をブラッシュアップしていく実践的なプログラムである。コロナ禍以降は集合研修と Web ミーティング、メールディスカッションを組み合わせたハイブリッド形式を導入し、限られた時間の中でも効率的かつ緊密にバトンを繋ぐ体制を整えている。これまでの受講生は延べ 129 名にのぼり、近年では本研修会の修了生が数年後に指導者（チューター）として次世代の受講生を支えるという、当会独自の理想的な育成の好循環（つなげるバトン）が定着しつつある。指導者陣は毎年リーダーを含め約 10 名の会員で構成され、これまで延べ 22 名が関わってきた。統計学などの専門知識を要する講義では外部講師を招聘しつつ、多くの講義をチューターが担当することで指導者自身のスキルアップも図っている。また、これらの講義を全会員へ開放することで、組織全体への知識の還元を試みている。最終回には研究計画の発表を行い修了となるが、希望者には学会発表や論文投稿まで伴走する手厚いフォローアップ体制も構築してきた。本シンポジウムでは、これまでの歩みと成果を共有するとともに、指導者の負担軽減やモチベーション維持、さらに他地区における研究支援の現状や課題について広く意見を交わし、今後の持続可能な研究育成体制のあり方を模索したい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 約10か月の伴走型研究研修を継続し、修了生がチューターとして次世代を支える育成循環を紹介。\n- 延べ129名の受講と、発表・論文投稿までの支援が特徴。指導者の負担や意欲を保つ運営方法が聴講ポイント。\n\n", "rec_grade": "A", "rec_perspective": "臨床研究育成・伴走型支援", "rec_reason": "10か月間の伴走型「臨床研究推進研修会」で延べ129名を育成し、修了生が数年後にチューターとして次世代を指導する好循環（つなげるバトン）を確立。NHOにおける臨床研究人材育成のベンチマーク。"}, {"id": "SY34-2", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY34", "session_name": "各地区国立病院薬剤師会の臨床研究支援", "title": "東北地区国立病院薬剤師会の取り組み〜ニーズに寄り添う研究支援〜", "authors": "阿部 憲介（あべ けんすけ）", "first_author": "阿部 憲介（あべ けんすけ）", "affiliations": "NHO 仙台医療センター 薬剤部", "first_affiliation": "NHO 仙台医療センター 薬剤部", "printed_pages": "557", "pdf_pages": "313", "features": ["研究への関心が高くても時間・統計・相談相手が障壁となる状況から、個別ニーズに応じた研究支援を検討。", "一律の参加を求めず、人事異動後も続く関係を活用する視点が特徴。小規模な相談体制を育てる方法に注目したい。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "薬剤師によるファーマシューティカル・ケアを薬物療法の最適化、医療安全、薬害防止へつなげるためには、日常診療で得られる臨床疑問をデータとして集積・解析し、現場へ還元するエビデンス創出（evidence generation）が重要である。東北地区では、関信地区の臨床研究推進活動に学び、2022 年度に臨床研究の意義や日常業務の気づきを研究へつなげる方法をテーマとした研修会を開催するとともに、会員を対象とした意識調査を実施した。その結果、学会発表・論文投稿への関心は 78％と高かったものの、時間の確保、研究の始め方、統計解析、身近な相談相手の不足等が障壁として示された。また、東北地区国立病院薬学研究会では、毎年、各施設の臨床研究や業務改善等に関する多様な一般演題を募集し、若手薬剤師が研究と発表を学ぶ場を提供してきた。さらに、北海道東北グループ事務所と連携し、ステップアップ研修に臨床研究をテーマとする研修を毎年組み込み、研究マインドの醸成を図るとともに、研究に触れる機会を継続してきた。臨床研究を一律に求めるのではなく、支援を必要とする薬剤師に対し、臨床疑問の整理、研究計画、評価項目、データ集積、解析方法等を個別に助言してきた。東北地区では統一的な研究支援体制の構築には至っていないが、人事異動後も続く顔の見える関係が、相談のしやすさや研究の継続につながる例もある。本発表では、これまでの試行錯誤と支援例を共有し、今後、ニーズに応じて伴走する小規模なワーキンググループや相談体制へ発展させる可能性を考察する。"}], "body_text": "薬剤師によるファーマシューティカル・ケアを薬物療法の最適化、医療安全、薬害防止へつなげるためには、日常診療で得られる臨床疑問をデータとして集積・解析し、現場へ還元するエビデンス創出（evidence generation）が重要である。東北地区では、関信地区の臨床研究推進活動に学び、2022 年度に臨床研究の意義や日常業務の気づきを研究へつなげる方法をテーマとした研修会を開催するとともに、会員を対象とした意識調査を実施した。その結果、学会発表・論文投稿への関心は 78％と高かったものの、時間の確保、研究の始め方、統計解析、身近な相談相手の不足等が障壁として示された。また、東北地区国立病院薬学研究会では、毎年、各施設の臨床研究や業務改善等に関する多様な一般演題を募集し、若手薬剤師が研究と発表を学ぶ場を提供してきた。さらに、北海道東北グループ事務所と連携し、ステップアップ研修に臨床研究をテーマとする研修を毎年組み込み、研究マインドの醸成を図るとともに、研究に触れる機会を継続してきた。臨床研究を一律に求めるのではなく、支援を必要とする薬剤師に対し、臨床疑問の整理、研究計画、評価項目、データ集積、解析方法等を個別に助言してきた。東北地区では統一的な研究支援体制の構築には至っていないが、人事異動後も続く顔の見える関係が、相談のしやすさや研究の継続につながる例もある。本発表では、これまでの試行錯誤と支援例を共有し、今後、ニーズに応じて伴走する小規模なワーキンググループや相談体制へ発展させる可能性を考察する。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY34-2\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [313]\nstatus: \"imported\"\n---\n\n# 東北地区国立病院薬剤師会の取り組み〜ニーズに寄り添う研究支援〜\n\n- 演題番号: SY34-2\n- 演題名: 東北地区国立病院薬剤師会の取り組み〜ニーズに寄り添う研究支援〜\n- 所属施設: NHO 仙台医療センター 薬剤部\n- 筆頭演者: 阿部 憲介（あべ けんすけ）\n- 筆頭演者の所属: NHO 仙台医療センター 薬剤部\n- 演者名: 阿部 憲介（あべ けんすけ）\n- 原本: [PDF 313ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=313>)\n- 冊子ページ: 557\n\n## 抄録本文\n\n薬剤師によるファーマシューティカル・ケアを薬物療法の最適化、医療安全、薬害防止へつなげるためには、日常診療で得られる臨床疑問をデータとして集積・解析し、現場へ還元するエビデンス創出（evidence generation）が重要である。東北地区では、関信地区の臨床研究推進活動に学び、2022 年度に臨床研究の意義や日常業務の気づきを研究へつなげる方法をテーマとした研修会を開催するとともに、会員を対象とした意識調査を実施した。その結果、学会発表・論文投稿への関心は 78％と高かったものの、時間の確保、研究の始め方、統計解析、身近な相談相手の不足等が障壁として示された。また、東北地区国立病院薬学研究会では、毎年、各施設の臨床研究や業務改善等に関する多様な一般演題を募集し、若手薬剤師が研究と発表を学ぶ場を提供してきた。さらに、北海道東北グループ事務所と連携し、ステップアップ研修に臨床研究をテーマとする研修を毎年組み込み、研究マインドの醸成を図るとともに、研究に触れる機会を継続してきた。臨床研究を一律に求めるのではなく、支援を必要とする薬剤師に対し、臨床疑問の整理、研究計画、評価項目、データ集積、解析方法等を個別に助言してきた。東北地区では統一的な研究支援体制の構築には至っていないが、人事異動後も続く顔の見える関係が、相談のしやすさや研究の継続につながる例もある。本発表では、これまでの試行錯誤と支援例を共有し、今後、ニーズに応じて伴走する小規模なワーキンググループや相談体制へ発展させる可能性を考察する。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 研究への関心が高くても時間・統計・相談相手が障壁となる状況から、個別ニーズに応じた研究支援を検討。\n- 一律の参加を求めず、人事異動後も続く関係を活用する視点が特徴。小規模な相談体制を育てる方法に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "SY34-3", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY34", "session_name": "各地区国立病院薬剤師会の臨床研究支援", "title": "東海北陸国立病院薬剤師会の取り組み〜入職初期より臨床研究に取り組める環境整備〜", "authors": "山本 高範（やまもと たかのり）", "first_author": "山本 高範（やまもと たかのり）", "affiliations": "NHO 三重病院 薬剤科", "first_affiliation": "NHO 三重病院 薬剤科", "printed_pages": "557", "pdf_pages": "313", "features": ["入職初期の学会発表準備、抄読 と たかのり）\n- 筆頭演者の所属: NHO 三重病院 薬剤科\n- 演者名: 山本 高範（やまもと たかのり）\n- 原本: [PDF 313ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=313>)\n- 冊子ページ: 557\n\n## 抄録本文\n\n東海北陸国立病院薬剤師会では学術研究委員会を設け、若手薬剤師が入職初期から臨床研究に触れられる環境整備を目的として、多様な教育活動を展開してきた。教育・研究支援としては、若手薬剤師向けの「学会発表準備のイロハ塾」を開催し、テーマ設定、研究計画、データ収集、発表準備までの基本的スキルを少人数制 Web 形式で学ぶ機会を提供し、学会発表への第一歩を支援している。年 6 回開催する論文抄読会では、初学者向けの難易度で論文の読み方や EBM の考え方を共有し、アンケート機能や意見交換を通じて施設間での知識交流を促進している。また、研究を学ぶ時間確保が難しい会員に向けて、オンデマンド形式の臨床研究学習コンテンツを配信し、年間を通じて自由に学べる環境を整備した。さらに、副薬剤部科長・主任薬剤師を対象としたスキルアップ研修は、臨床疑問を研究課題へと変換し、その解決を図るために必要な知識と実践的な能力向上を目的にワークショップ形式で実施している。発表する場としては、「合同症例カンファレンス」と「研究・取り組み発表会」を完全 Web 形式あるいはハイブリッド形式で開催し、若手からベテランまで幅広い層が症例、研究成果、取り組みを共有できる環境を整えた。その他の活動としては、施設間の連携を活かした多施設共同研究を行っており、毎年新たな成果を創出している。また、論文掲載者にはその労をたたえ、論文賞を表彰している。これらの活動は、コアメンバーの協力と成長に支えられ、会員の研究マインド向上に寄与している。今後も教育体制の充実と人材育成を継続し、薬剤師が主体的に臨床研究へ取り組める環境づくりをさらに推進していく。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 入職初期の学会発表準備、抄読会、オンデマンド教材、管理職向け研修、発表機会を段階的に整備。\n- 学びと成果発信をつなぐ複層的な研究支援が特徴。担当者間の分担と、多施設共同研究へ発展させる運営が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "SY34-4", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY34", "session_name": "各地区国立病院薬剤師会の臨床研究支援", "title": "近畿国立病院薬剤師会の取り組み〜学会発表・研究につなげる初学者・若手支援〜", "authors": "櫛田 宏幸（くしだ ひろゆき）", "first_author": "櫛田 宏幸（くしだ ひろゆき）", "affiliations": "NHO 大阪南医療センター 薬剤部", "first_affiliation": "NHO 大阪南医療センター 薬剤部", "printed_pages": "557", "pdf_pages": "313", "features": ["研究委員会だけでなく各専門委員会の活動を研究の入口とし、メタバースでの発表機会も提供。", "初学者から経験者までを支える複数の経路を持つ点が特徴。施設規模や場所によらない交流の設計に注目できる。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "薬剤師による臨床研究は、薬物療法の有効性・安全性の検証や医療の質向上に寄与する重要な活動である。一方で、研究テーマの設定や研究計画立案、統計解析、論文化などに対するハードルから、研究活動への参加に踏み出せない薬剤師も少なくない。近畿国立病院薬剤師会では、こうした課題に対応するため、長年にわたり研究支援活動を継続してきた。臨床研究委員会では、ネットワーク研究支援、業績目録集の収集・公開、研究関連情報の提供を行い、2021 年度には「臨床研究の実践を目指して〜医療に貢献できる薬剤師〜」をテーマとしたシンポジウムを開催した。その後も論文抄読会を継続的に開催し、研究初学者から経験者まで幅広い会員の研究力向上を支援している。また、研究活動の基盤形成には各専門委員会の活動も大きく寄与している。治験委員会による臨床研究・治験関連の相談体制、医薬品情報委員会によるプレアボイド共同研究、各専門委員会による症例検討会や勉強会は、日常診療上の疑問を研究課題へ発展させる契機となっている。さらに近年は研究成果を発信する機会の拡充にも取り組んでおり、2022 年 3 月からメタバース空間を活用した学術大会・研究発表会を継続開催している。場所や施設規模に制約されない新たな学術交流の場を提供することで、若手薬剤師の発表機会創出と研究活動のさらなる活性化を目指している。本シンポジウムでは、近畿国立病院薬剤師会における研究支援活動の変遷と成果を紹介するとともに、若手薬剤師の研究マインド醸成、施設間連携による研究活性化、さらには薬物療法の最適化につながる研究文化の構築に向けた今後の展望について報告する。"}], "body_text": "薬剤師による臨床研究は、薬物療法の有効性・安全性の検証や医療の質向上に寄与する重要な活動である。一方で、研究テーマの設定や研究計画立案、統計解析、論文化などに対するハードルから、研究活動への参加に踏み出せない薬剤師も少なくない。近畿国立病院薬剤師会では、こうした課題に対応するため、長年にわたり研究支援活動を継続してきた。臨床研究委員会では、ネットワーク研究支援、業績目録集の収集・公開、研究関連情報の提供を行い、2021 年度には「臨床研究の実践を目指して〜医療に貢献できる薬剤師〜」をテーマとしたシンポジウムを開催した。その後も論文抄読会を継続的に開催し、研究初学者から経験者まで幅広い会員の研究力向上を支援している。また、研究活動の基盤形成には各専門委員会の活動も大きく寄与している。治験委員会による臨床研究・治験関連の相談体制、医薬品情報委員会によるプレアボイド共同研究、各専門委員会による症例検討会や勉強会は、日常診療上の疑問を研究課題へ発展させる契機となっている。さらに近年は研究成果を発信する機会の拡充にも取り組んでおり、2022 年 3 月からメタバース空間を活用した学術大会・研究発表会を継続開催している。場所や施設規模に制約されない新たな学術交流の場を提供することで、若手薬剤師の発表機会創出と研究活動のさらなる活性化を目指している。本シンポジウムでは、近畿国立病院薬剤師会における研究支援活動の変遷と成果を紹介するとともに、若手薬剤師の研究マインド醸成、施設間連携による研究活性化、さらには薬物療法の最適化につながる研究文化の構築に向けた今後の展望について報告する。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY34-4\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [313]\nstatus: \"imported\"\n---\n\n# 近畿国立病院薬剤師会の取り組み〜学会発表・研究につなげる初学者・若手支援〜\n\n- 演題番号: SY34-4\n- 演題名: 近畿国立病院薬剤師会の取り組み〜学会発表・研究につなげる初学者・若手支援〜\n- 所属施設: NHO 大阪南医療センター 薬剤部\n- 筆頭演者: 櫛田 宏幸（くしだ ひろゆき）\n- 筆頭演者の所属: NHO 大阪南医療センター 薬剤部\n- 演者名: 櫛田 宏幸（くしだ ひろゆき）\n- 原本: [PDF 313ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=313>)\n- 冊子ページ: 557\n\n## 抄録本文\n\n薬剤師による臨床研究は、薬物療法の有効性・安全性の検証や医療の質向上に寄与する重要な活動である。一方で、研究テーマの設定や研究計画立案、統計解析、論文化などに対するハードルから、研究活動への参加に踏み出せない薬剤師も少なくない。近畿国立病院薬剤師会では、こうした課題に対応するため、長年にわたり研究支援活動を継続してきた。臨床研究委員会では、ネットワーク研究支援、業績目録集の収集・公開、研究関連情報の提供を行い、2021 年度には「臨床研究の実践を目指して〜医療に貢献できる薬剤師〜」をテーマとしたシンポジウムを開催した。その後も論文抄読会を継続的に開催し、研究初学者から経験者まで幅広い会員の研究力向上を支援している。また、研究活動の基盤形成には各専門委員会の活動も大きく寄与している。治験委員会による臨床研究・治験関連の相談体制、医薬品情報委員会によるプレアボイド共同研究、各専門委員会による症例検討会や勉強会は、日常診療上の疑問を研究課題へ発展させる契機となっている。さらに近年は研究成果を発信する機会の拡充にも取り組んでおり、2022 年 3 月からメタバース空間を活用した学術大会・研究発表会を継続開催している。場所や施設規模に制約されない新たな学術交流の場を提供することで、若手薬剤師の発表機会創出と研究活動のさらなる活性化を目指している。本シンポジウムでは、近畿国立病院薬剤師会における研究支援活動の変遷と成果を紹介するとともに、若手薬剤師の研究マインド醸成、施設間連携による研究活性化、さらには薬物療法の最適化につながる研究文化の構築に向けた今後の展望について報告する。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 研究委員会だけでなく各専門委員会の活動を研究の入口とし、メタバースでの発表機会も提供。\n- 初学者から経験者までを支える複数の経路を持つ点が特徴。施設規模や場所によらない交流の設計に注目できる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "SY34-5", "category": "シンポジウム", "cat_code": "symposium", "cat_short": "シンポジウム", "session": "SY34", "session_name": "各地区国立病院薬剤師会の臨床研究支援", "title": "九州地区国立病院薬剤師会の取り組み〜メーリングリストがつなぐ臨床研究〜", "authors": "高武 嘉道（こうたけ よしみち）", "first_author": "高武 嘉道（こうたけ よしみち）", "affiliations": "NHO 九州がんセンター 薬剤部", "first_affiliation": "NHO 九州がんセンター 薬剤部", "printed_pages": "557", "pdf_pages": "313", "features": ["55名のメーリングリストを教育・研究相談・研究計画支援の基盤にし、職位を超えた交流を形成。", "2025年度111通の配信に加え共同研究の相談・企画へ進む取り組み。情報共有を実際の研究につなげる支援が参考となる。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "病院薬剤師が主体となる臨床研究は、薬物療法の最適化に資するエビデンスを創出する上で重要である。一方で、研究経験や指導者の不足、施設間の情報格差、相談相手の不在などを背景に、臨床研究への第一歩を踏み出せない薬剤師も少なくない。こうした課題を解決するには、施設の枠を超えて研究者同士がつながり、支援し合える環境の整備が重要である。九州地区国立病院薬剤師会では、臨床研究に興味を持つ薬剤師を対象にメーリングリスト（ML）を立ち上げ、教育・相談・研究計画支援を柱とした活動を展開している。現在 55 名が参加し、一般薬剤師から薬剤部長まで幅広い職位の薬剤師が所属している。2025 年度には 111 通のメールを配信し、研究相談や勉強会・講演会の案内、研究情報の共有を通じて交流を深めてきた。また、臨床研究勉強会を定期開催し、統計解析や研究デザインなど実践的な内容を提供した結果、参加者アンケートでは高い満足度と有用性が示された。さらに、定年退職者や育児休暇取得者を対象としたアンケート調査や特殊集団における薬物動態調査など、複数施設が関心を共有する研究テーマについて相談・企画が進められている。本講演では、九州地区国立病院薬剤師会における ML を活用した臨床研究支援の取り組みを紹介するとともに、その成果と課題について報告する。ML は単なる情報共有ツールではなく、研究に関心を持つ薬剤師同士をつなぎ、施設を超えたネットワークを形成する基盤として機能している。今後は、このネットワークを活用し、単施設では実施が困難な臨床研究を多施設共同研究へ発展させることで、薬剤師主導臨床研究の活性化と薬物療法の質向上に貢献したい。"}], "body_text": "病院薬剤師が主体となる臨床研究は、薬物療法の最適化に資するエビデンスを創出する上で重要である。一方で、研究経験や指導者の不足、施設間の情報格差、相談相手の不在などを背景に、臨床研究への第一歩を踏み出せない薬剤師も少なくない。こうした課題を解決するには、施設の枠を超えて研究者同士がつながり、支援し合える環境の整備が重要である。九州地区国立病院薬剤師会では、臨床研究に興味を持つ薬剤師を対象にメーリングリスト（ML）を立ち上げ、教育・相談・研究計画支援を柱とした活動を展開している。現在 55 名が参加し、一般薬剤師から薬剤部長まで幅広い職位の薬剤師が所属している。2025 年度には 111 通のメールを配信し、研究相談や勉強会・講演会の案内、研究情報の共有を通じて交流を深めてきた。また、臨床研究勉強会を定期開催し、統計解析や研究デザインなど実践的な内容を提供した結果、参加者アンケートでは高い満足度と有用性が示された。さらに、定年退職者や育児休暇取得者を対象としたアンケート調査や特殊集団における薬物動態調査など、複数施設が関心を共有する研究テーマについて相談・企画が進められている。本講演では、九州地区国立病院薬剤師会における ML を活用した臨床研究支援の取り組みを紹介するとともに、その成果と課題について報告する。ML は単なる情報共有ツールではなく、研究に関心を持つ薬剤師同士をつなぎ、施設を超えたネットワークを形成する基盤として機能している。今後は、このネットワークを活用し、単施設では実施が困難な臨床研究を多施設共同研究へ発展させることで、薬剤師主導臨床研究の活性化と薬物療法の質向上に貢献したい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"SY34-5\"\ncategory: \"シンポジウム\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [313]\nstatus: \"imported\"\n---\n\n# 九州地区国立病院薬剤師会の取り組み〜メーリングリストがつなぐ臨床研究〜\n\n- 演題番号: SY34-5\n- 演題名: 九州地区国立病院薬剤師会の取り組み〜メーリングリストがつなぐ臨床研究〜\n- 所属施設: NHO 九州がんセンター 薬剤部\n- 筆頭演者: 高武 嘉道（こうたけ よしみち）\n- 筆頭演者の所属: NHO 九州がんセンター 薬剤部\n- 演者名: 高武 嘉道（こうたけ よしみち）\n- 原本: [PDF 313ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=313>)\n- 冊子ページ: 557\n\n## 抄録本文\n\n病院薬剤師が主体となる臨床研究は、薬物療法の最適化に資するエビデンスを創出する上で重要である。一方で、研究経験や指導者の不足、施設間の情報格差、相談相手の不在などを背景に、臨床研究への第一歩を踏み出せない薬剤師も少なくない。こうした課題を解決するには、施設の枠を超えて研究者同士がつながり、支援し合える環境の整備が重要である。九州地区国立病院薬剤師会では、臨床研究に興味を持つ薬剤師を対象にメーリングリスト（ML）を立ち上げ、教育・相談・研究計画支援を柱とした活動を展開している。現在 55 名が参加し、一般薬剤師から薬剤部長まで幅広い職位の薬剤師が所属している。2025 年度には 111 通のメールを配信し、研究相談や勉強会・講演会の案内、研究情報の共有を通じて交流を深めてきた。また、臨床研究勉強会を定期開催し、統計解析や研究デザインなど実践的な内容を提供した結果、参加者アンケートでは高い満足度と有用性が示された。さらに、定年退職者や育児休暇取得者を対象としたアンケート調査や特殊集団における薬物動態調査など、複数施設が関心を共有する研究テーマについて相談・企画が進められている。本講演では、九州地区国立病院薬剤師会における ML を活用した臨床研究支援の取り組みを紹介するとともに、その成果と課題について報告する。ML は単なる情報共有ツールではなく、研究に関心を持つ薬剤師同士をつなぎ、施設を超えたネットワークを形成する基盤として機能している。今後は、このネットワークを活用し、単施設では実施が困難な臨床研究を多施設共同研究へ発展させることで、薬剤師主導臨床研究の活性化と薬物療法の質向上に貢献したい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 55名のメーリングリストを教育・研究相談・研究計画支援の基盤にし、職位を超えた交流を形成。\n- 2025年度111通の配信に加え共同研究の相談・企画へ進む取り組み。情報共有を実際の研究につなげる支援が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "LS13-1", "category": "ランチョンセミナー", "cat_code": "luncheon", "cat_short": "ランチョン", "session": "LS13", "session_name": "病院経営とバイオシミラーマネジメント", "title": "医薬品費適正化と病院経営におけるバイオシミラーへの期待", "authors": "山脇 一浩（やまわき かずひろ）", "first_author": "山脇 一浩（やまわき かずひろ）", "affiliations": "NHO 九州医療センター 薬剤部", "first_affiliation": "NHO 九州医療センター 薬剤部", "printed_pages": "561", "pdf_pages": "317", "features": ["薬剤費適正化を、バイオシミラー・在庫管理・クリニカルパス・診療報酬の観点から考える講演。", "未算定加算の課題も含む病院経営上の実務が中心。自施設で導入を進める際の障壁と評価指標を確認したい。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "我が国の国民医療費は 48 兆円を超え、医薬品費についても再生医療等製品をはじめ、免疫チェックポイント阻害薬や二重特異性抗体などの高額医薬品の登場により増加傾向が続いている。こうした状況を踏まえ、政府は医療費・医薬品費の適正化を目的として、2029 年度末までの後発医薬品使用促進目標において、従来の数量ベースに加え、バイオシミラーおよび金額ベースによる新たな指標を設定した。また、診療報酬においても後発医薬品やバイオシミラーの積極的な使用を評価している。当院においても高額医薬品の使用機会が増え、医薬品費は年々上昇している。DPC 病院として、各診療科ではクリニカルパスやセット処方の見直しを進めるとともに、薬剤部では後発医薬品およびバイオシミラーの適切な活用、医薬品の在庫管理適正化による廃棄削減など、医薬品費適正化に向けた取り組みを推進している。さらに、現在未算定であるバイオ後続品使用体制加算についても課題を整理し、算定に向けた検討を進めている。本講演では、持続可能な病院経営を支える医薬品費適正化の取り組みを紹介するとともに、バイオシミラー導入がもたらす医薬品費適正化効果と、その経営的・医療的価値について考察する。"}], "body_text": "我が国の国民医療費は 48 兆円を超え、医薬品費についても再生医療等製品をはじめ、免疫チェックポイント阻害薬や二重特異性抗体などの高額医薬品の登場により増加傾向が続いている。こうした状況を踏まえ、政府は医療費・医薬品費の適正化を目的として、2029 年度末までの後発医薬品使用促進目標において、従来の数量ベースに加え、バイオシミラーおよび金額ベースによる新たな指標を設定した。また、診療報酬においても後発医薬品やバイオシミラーの積極的な使用を評価している。当院においても高額医薬品の使用機会が増え、医薬品費は年々上昇している。DPC 病院として、各診療科ではクリニカルパスやセット処方の見直しを進めるとともに、薬剤部では後発医薬品およびバイオシミラーの適切な活用、医薬品の在庫管理適正化による廃棄削減など、医薬品費適正化に向けた取り組みを推進している。さらに、現在未算定であるバイオ後続品使用体制加算についても課題を整理し、算定に向けた検討を進めている。本講演では、持続可能な病院経営を支える医薬品費適正化の取り組みを紹介するとともに、バイオシミラー導入がもたらす医薬品費適正化効果と、その経営的・医療的価値について考察する。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"LS13-1\"\ncategory: \"ランチョンセミナー\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [317]\nstatus: \"imported\"\n---\n\n# 医薬品費適正化と病院経営におけるバイオシミラーへの期待\n\n- 演題番号: LS13-1\n- 演題名: 医薬品費適正化と病院経営におけるバイオシミラーへの期待\n- 所属施設: NHO 九州医療センター 薬剤部\n- 筆頭演者: 山脇 一浩（やまわき かずひろ）\n- 筆頭演者の所属: NHO 九州医療センター 薬剤部\n- 演者名: 山脇 一浩（やまわき かずひろ）\n- 原本: [PDF 317ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=317>)\n- 冊子ページ: 561\n\n## 抄録本文\n\n我が国の国民医療費は 48 兆円を超え、医薬品費についても再生医療等製品をはじめ、免疫チェックポイント阻害薬や二重特異性抗体などの高額医薬品の登場により増加傾向が続いている。こうした状況を踏まえ、政府は医療費・医薬品費の適正化を目的として、2029 年度末までの後発医薬品使用促進目標において、従来の数量ベースに加え、バイオシミラーおよび金額ベースによる新たな指標を設定した。また、診療報酬においても後発医薬品やバイオシミラーの積極的な使用を評価している。当院においても高額医薬品の使用機会が増え、医薬品費は年々上昇している。DPC 病院として、各診療科ではクリニカルパスやセット処方の見直しを進めるとともに、薬剤部では後発医薬品およびバイオシミラーの適切な活用、医薬品の在庫管理適正化による廃棄削減など、医薬品費適正化に向けた取り組みを推進している。さらに、現在未算定であるバイオ後続品使用体制加算についても課題を整理し、算定に向けた検討を進めている。本講演では、持続可能な病院経営を支える医薬品費適正化の取り組みを紹介するとともに、バイオシミラー導入がもたらす医薬品費適正化効果と、その経営的・医療的価値について考察する。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 薬剤費適正化を、バイオシミラー・在庫管理・クリニカルパス・診療報酬の観点から考える講演。\n- 未算定加算の課題も含む病院経営上の実務が中心。自施設で導入を進める際の障壁と評価指標を確認したい。\n\n", "rec_grade": "C", "rec_perspective": "バイオシミラー・病院経営", "rec_reason": "2029年度新目標（金額ベース・BS指標）やDPC病院でのパス見直し、バイオ後続品使用体制加算の算定に向けた課題整理など、薬局長・管理者視点の経営戦略を網羅。"}, {"id": "LS13-2", "category": "ランチョンセミナー", "cat_code": "luncheon", "cat_short": "ランチョン", "session": "LS13", "session_name": "病院経営とバイオシミラーマネジメント", "title": "病院薬剤師の実践的バイオシミラーマネジメント―病院経営に貢献するために―", "authors": "三宅 知宏（みやけ ともひろ）", "first_author": "三宅 知宏（みやけ ともひろ）", "affiliations": "日本赤十字社 伊勢赤十字病院 薬剤部", "first_affiliation": "日本赤十字社 伊勢赤十字病院 薬剤部", "printed_pages": "561", "pdf_pages": "317", "features": ["バイオシミラーの採用から普及・安全性確保までを、病院薬剤師が主導するマネジメントとして提示。", "コストだけでなく診療報酬や院内展開を含む実践事例が焦点。ランチョンセミナーとして個別施設の経験を聞く位置付け。"], "issues": [], "sections": [{"heading": "抄録本文", "content": "バイオ医薬品は、遺伝子組み換え技術や細胞培養技術などのバイオテクノロジーを応用し、細胞や微生物などの生物の力を利用して作られる、タンパク質由来の有効成分をもつ医薬品である。バイオ後続品（バイオシミラー）とは、国内で既に新有効成分含有医薬品として承認された先行バイオ医薬品と同等/同質の品質、安全性、有効性を有する医薬品として、異なる製造販売業者により開発される医薬品である。薬剤費を含めた材料費の高騰と、それに伴う病院経営の悪化、医療財政の逼迫が急速に進む現在、バイオシミラーの導入はコスト適正化に向けた病院薬剤師の責務と考える。この取り組みは、単なる削減策ではなく、診療報酬を戦略的に活用し、病院経営に貢献することが重要である。薬剤師には、医薬品の専門性に基づき、採用から普及、安全性の確保までの一連のプロセスを主導することが強く期待されている。本セミナーでは、当院の取り組み事例を通じて実践的なマネジメントを紹介し、病院薬剤師が持続可能な医療を支える新たな役割と貢献を見出すことに少しでも参考になれば幸いである。"}], "body_text": "バイオ医薬品は、遺伝子組み換え技術や細胞培養技術などのバイオテクノロジーを応用し、細胞や微生物などの生物の力を利用して作られる、タンパク質由来の有効成分をもつ医薬品である。バイオ後続品（バイオシミラー）とは、国内で既に新有効成分含有医薬品として承認された先行バイオ医薬品と同等/同質の品質、安全性、有効性を有する医薬品として、異なる製造販売業者により開発される医薬品である。薬剤費を含めた材料費の高騰と、それに伴う病院経営の悪化、医療財政の逼迫が急速に進む現在、バイオシミラーの導入はコスト適正化に向けた病院薬剤師の責務と考える。この取り組みは、単なる削減策ではなく、診療報酬を戦略的に活用し、病院経営に貢献することが重要である。薬剤師には、医薬品の専門性に基づき、採用から普及、安全性の確保までの一連のプロセスを主導することが強く期待されている。本セミナーでは、当院の取り組み事例を通じて実践的なマネジメントを紹介し、病院薬剤師が持続可能な医療を支える新たな役割と貢献を見出すことに少しでも参考になれば幸いである。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"LS13-2\"\ncategory: \"ランチョンセミナー\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [317]\nstatus: \"imported\"\n---\n\n# 病院薬剤師の実践的バイオシミラーマネジメント―病院経営に貢献するために―\n\n- 演題番号: LS13-2\n- 演題名: 病院薬剤師の実践的バイオシミラーマネジメント―病院経営に貢献するために―\n- 所属施設: 日本赤十字社 伊勢赤十字病院 薬剤部\n- 筆頭演者: 三宅 知宏（みやけ ともひろ）\n- 筆頭演者の所属: 日本赤十字社 伊勢赤十字病院 薬剤部\n- 演者名: 三宅 知宏（みやけ ともひろ）\n- 原本: [PDF 317ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=317>)\n- 冊子ページ: 561\n\n## 抄録本文\n\nバイオ医薬品は、遺伝子組み換え技術や細胞培養技術などのバイオテクノロジーを応用し、細胞や微生物などの生物の力を利用して作られる、タンパク質由来の有効成分をもつ医薬品である。バイオ後続品（バイオシミラー）とは、国内で既に新有効成分含有医薬品として承認された先行バイオ医薬品と同等/同質の品質、安全性、有効性を有する医薬品として、異なる製造販売業者により開発される医薬品である。薬剤費を含めた材料費の高騰と、それに伴う病院経営の悪化、医療財政の逼迫が急速に進む現在、バイオシミラーの導入はコスト適正化に向けた病院薬剤師の責務と考える。この取り組みは、単なる削減策ではなく、診療報酬を戦略的に活用し、病院経営に貢献することが重要である。薬剤師には、医薬品の専門性に基づき、採用から普及、安全性の確保までの一連のプロセスを主導することが強く期待されている。本セミナーでは、当院の取り組み事例を通じて実践的なマネジメントを紹介し、病院薬剤師が持続可能な医療を支える新たな役割と貢献を見出すことに少しでも参考になれば幸いである。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- バイオシミラーの採用から普及・安全性確保までを、病院薬剤師が主導するマネジメントとして提示。\n- コストだけでなく診療報酬や院内展開を含む実践事例が焦点。ランチョンセミナーとして個別施設の経験を聞く位置付け。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}];

        }

        function setCategory(catCode) {
            state.selectedCategory = catCode;
            // カテゴリ変更時、セッション個別フィルタが別カテゴリの場合はALLに戻す
            if (!['ALL', 'REC_ALL', 'REC_A', 'REC_B', 'REC_C', 'FAV'].includes(state.selectedSession)) {
                const hasSessionInCat = PRESENTATIONS.some(p =>
                    (catCode === 'ALL' || p.cat_code === catCode) && p.session === state.selectedSession
                );
                if (!hasSessionInCat) {
                    state.selectedSession = 'ALL';
                }
            }
            updateCategoryTabs();
            renderFilters();
            renderList();
        }

        function updateCategoryTabs() {
            const tabs = document.querySelectorAll('.cat-tab');
            const codes = ['ALL', 'oral', 'poster', 'symposium', 'luncheon'];
            tabs.forEach((btn, idx) => {
                btn.classList.toggle('active', codes[idx] === state.selectedCategory);
            });
        }

        function renderFilters() {
            const catFiltered = PRESENTATIONS.filter(p =>
                state.selectedCategory === 'ALL' || p.cat_code === state.selectedCategory
            );

            const sessions = [...new Set(catFiltered.map(p => p.session))];
            const countA = catFiltered.filter(p => p.rec_grade === 'A').length;
            const countB = catFiltered.filter(p => p.rec_grade === 'B').length;
            const countC = catFiltered.filter(p => p.rec_grade === 'C').length;
            const countRecAll = countA + countB + countC;

            let html = `<button class="filter-pill ${state.selectedSession === 'ALL' && !state.onlyFavorites ? 'active' : ''}" onclick="selectSession('ALL')">すべて (${catFiltered.length})</button>`;
            if (countA > 0) {
                html += `<button class="filter-pill rec-pill-A ${state.selectedSession === 'REC_A' ? 'active' : ''}" onclick="selectSession('REC_A')">🏆 推奨度A (${countA})</button>`;
            }
            if (countB > 0) {
                html += `<button class="filter-pill rec-pill-B ${state.selectedSession === 'REC_B' ? 'active' : ''}" onclick="selectSession('REC_B')">🥈 推奨度B (${countB})</button>`;
            }
            if (countC > 0) {
                html += `<button class="filter-pill rec-pill-C ${state.selectedSession === 'REC_C' ? 'active' : ''}" onclick="selectSession('REC_C')">💡 推奨度C (${countC})</button>`;
            }
            if (countRecAll > 0) {
                html += `<button class="filter-pill ${state.selectedSession === 'REC_ALL' ? 'active' : ''}" onclick="selectSession('REC_ALL')">🌟 AI推奨すべて (${countRecAll})</button>`;
            }
            html += `<button class="filter-pill ${state.onlyFavorites ? 'active' : ''}" onclick="selectSession('FAV')">⭐ お気に入り (${state.favorites.size})</button>`;

            sessions.forEach(s => {
                const sCount = catFiltered.filter(p => p.session === s).length;
                const sName = SESSION_NAMES[s] ? `${s} ${SESSION_NAMES[s]}` : s;
                const isActive = state.selectedSession === s && !state.onlyFavorites;
                html += `<button class="filter-pill ${isActive ? 'active' : ''}" onclick="selectSession('${s}')" title="${escapeHtml(sName)}">${s} (${sCount})</button>`;
            });
            filterBar.innerHTML = html;
        }

        function selectSession(session) {
            if (session === 'FAV') {
                state.onlyFavorites = true;
                state.onlyRecommended = false;
                state.selectedSession = 'ALL';
                updateBottomNav('fav');
            } else {
                state.onlyFavorites = false;
                state.selectedSession = session;
                state.onlyRecommended = session.startsWith('REC_');
                updateBottomNav(state.onlyRecommended ? 'rec' : 'all');
            }
            renderFilters();
            renderList();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
            });
        }

        function highlightText(text, query) {
            const safe = escapeHtml(text);
            if (!query) return safe;
            const escapedQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedQ})`, 'gi');
            return safe.replace(regex, '<mark>$1</mark>');
        }

        function renderList() {
            const q = state.searchQuery.toLowerCase();

            const filtered = PRESENTATIONS.filter(p => {
                if (state.selectedCategory !== 'ALL' && p.cat_code !== state.selectedCategory) return false;
                if (state.onlyFavorites && !state.favorites.has(p.id)) return false;

                if (!state.onlyFavorites && state.selectedSession !== 'ALL') {
                    if (state.selectedSession === 'REC_ALL' && !p.rec_grade) return false;
                    if (state.selectedSession === 'REC_A' && p.rec_grade !== 'A') return false;
                    if (state.selectedSession === 'REC_B' && p.rec_grade !== 'B') return false;
                    if (state.selectedSession === 'REC_C' && p.rec_grade !== 'C') return false;
                    if (!state.selectedSession.startsWith('REC_') && p.session !== state.selectedSession) return false;
                }

                if (!q) return true;
                const target = `${p.id} ${p.category} ${p.session_name} ${p.title} ${p.authors} ${p.affiliations} ${(p.features || []).join(' ')} ${p.rec_perspective} ${p.rec_reason} ${p.body_text}`.toLowerCase();
                return target.includes(q);
            });

            state.currentFilteredIds = filtered.map(p => p.id);
            totalCountEl.textContent = `${filtered.length}題`;

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 2.4rem; margin-bottom: 8px;">🔍</div>
                        <p>条件に一致する演題が見つかりませんでした。</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filtered.map(p => {
                const isFav = state.favorites.has(p.id);
                let recBadgeHtml = '';
                if (p.rec_grade === 'A') {
                    recBadgeHtml = `<span class="rec-badge rec-A">🏆 推奨度A</span>`;
                } else if (p.rec_grade === 'B') {
                    recBadgeHtml = `<span class="rec-badge rec-B">🥈 推奨度B</span>`;
                } else if (p.rec_grade === 'C') {
                    recBadgeHtml = `<span class="rec-badge rec-C">💡 推奨度C</span>`;
                }

                const featurePreview = p.features && p.features.length > 0
                    ? `<div class="card-feature-preview">💡 ${highlightText(p.features[0], state.searchQuery)}</div>`
                    : '';

                return `
                    <div class="card cat-${p.cat_code}" onclick="openDetail('${p.id}')">
                        <div class="card-header">
                            <div class="badge-group">
                                <span class="session-badge">${highlightText(p.id, state.searchQuery)}</span>
                                <span class="cat-badge ${p.cat_code}">${escapeHtml(p.cat_short)}</span>
                                ${recBadgeHtml}
                                ${p.session_name ? `<span class="session-name-badge">${highlightText(p.session_name, state.searchQuery)}</span>` : ''}
                            </div>
                            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${p.id}')" title="お気に入り">${isFav ? '★' : '☆'}</button>
                        </div>
                        <h2 class="card-title">${highlightText(p.title, state.searchQuery)}</h2>
                        ${featurePreview}
                        <div class="card-meta">
                            <div class="meta-item">
                                <span class="meta-icon">👤</span>
                                <span>${highlightText(p.first_author || p.authors, state.searchQuery)}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-icon">🏥</span>
                                <span>${highlightText(p.first_affiliation || p.affiliations, state.searchQuery)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleFav(event, id) {
            event.stopPropagation();
            if (state.favorites.has(id)) {
                state.favorites.delete(id);
            } else {
                state.favorites.add(id);
            }
            saveFavs();
            renderFilters();
            renderList();
        }

        function toggleDetailFav() {
            if (!state.currentDetailId) return;
            const id = state.currentDetailId;
            if (state.favorites.has(id)) {
                state.favorites.delete(id);
            } else {
                state.favorites.add(id);
            }
            saveFavs();
            updateDetailFavBtn();
            renderFilters();
            renderList();
        }

        function updateDetailFavBtn() {
            const btn = document.getElementById('detail-fav-btn');
            const isFav = state.favorites.has(state.currentDetailId);
            btn.className = `fav-btn ${isFav ? 'active' : ''}`;
            btn.textContent = isFav ? '★' : '☆';
        }

        function saveFavs() {
            localStorage.setItem('kokubyo2026_favs', JSON.stringify([...state.favorites]));
        }

        function openDetail(id, pushHistory = true) {
            const p = PRESENTATIONS.find(item => item.id === id);
            if (!p) return;

            state.currentDetailId = id;
            document.getElementById('detail-header-id').textContent = `${p.id}（${p.cat_short}）`;
            updateDetailFavBtn();

            let recBannerHtml = '';
            if (p.rec_grade) {
                const gradeLabel = p.rec_grade === 'A' ? '🏆 推奨度 A（最優先・必聴演題）' :
                                  (p.rec_grade === 'B' ? '🥈 推奨度 B（準最優先・実務直結）' : '💡 推奨度 C（テーマ特化・注目）');
                recBannerHtml = `
                    <div class="rec-info-box rec-info-${p.rec_grade}">
                        <div style="font-weight: 800; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px;">
                            <span>${gradeLabel}</span>
                            <span style="font-size: 0.76rem; padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,0.08);">${escapeHtml(p.rec_perspective)}</span>
                        </div>
                        <div>${highlightText(p.rec_reason, state.searchQuery)}</div>
                    </div>
                `;
            }

            let featuresHtml = '';
            if (p.features && p.features.length > 0) {
                const items = p.features.map(f => `<li>${highlightText(f, state.searchQuery)}</li>`).join('');
                featuresHtml = `
                    <div class="features-box">
                        <div class="features-box-title">💡 本演題の特徴・聴講ポイント</div>
                        <ul class="features-list">${items}</ul>
                    </div>
                `;
            }

            let issuesHtml = '';
            if (p.issues && p.issues.length > 0) {
                const items = p.issues.map(iss => `<div>・${escapeHtml(iss)}</div>`).join('');
                issuesHtml = `
                    <div class="issues-box">
                        <div style="font-weight: 800; margin-bottom: 4px;">⚠️ 原文の要確認事項</div>
                        ${items}
                    </div>
                `;
            }

            let sectionsHtml = p.sections.map(sec => `
                <div class="abstract-section">
                    <h3 class="section-heading">${escapeHtml(sec.heading)}</h3>
                    <p class="section-body">${highlightText(sec.content, state.searchQuery)}</p>
                </div>
            `).join('');

            // 前後演題ナビゲーション
            const navList = state.currentFilteredIds.length > 0 ? state.currentFilteredIds : PRESENTATIONS.map(x => x.id);
            const curIdx = navList.indexOf(id);
            const prevItem = curIdx > 0 ? PRESENTATIONS.find(x => x.id === navList[curIdx - 1]) : null;
            const nextItem = (curIdx >= 0 && curIdx < navList.length - 1) ? PRESENTATIONS.find(x => x.id === navList[curIdx + 1]) : null;

            const navRowHtml = `
                <div class="detail-nav-row">
                    <button class="detail-nav-btn prev" ${prevItem ? `onclick="openDetail('${prevItem.id}', false)"` : 'disabled'}>
                        <span class="detail-nav-label">← 前の演題</span>
                        <span class="detail-nav-title">${prevItem ? escapeHtml(prevItem.id + ' ' + prevItem.title) : '先頭の演題です'}</span>
                    </button>
                    <button class="detail-nav-btn next" ${nextItem ? `onclick="openDetail('${nextItem.id}', false)"` : 'disabled'}>
                        <span class="detail-nav-label">次の演題 →</span>
                        <span class="detail-nav-title">${nextItem ? escapeHtml(nextItem.id + ' ' + nextItem.title) : '最後の演題です'}</span>
                    </button>
                </div>
            `;

            document.getElementById('detail-content').innerHTML = `
                <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
                    <span class="session-badge">${escapeHtml(p.id)}</span>
                    <span class="cat-badge ${p.cat_code}">${escapeHtml(p.category)}</span>
                    ${p.session_name ? `<span class="session-name-badge">${escapeHtml(p.session)} ${escapeHtml(p.session_name)}</span>` : ''}
                </div>
                <h1 class="detail-title">${highlightText(p.title, state.searchQuery)}</h1>
                ${recBannerHtml}
                <div class="detail-meta-box">
                    <div class="detail-authors">👤 ${highlightText(p.authors, state.searchQuery)}</div>
                    <div class="detail-affiliations">🏥 ${highlightText(p.affiliations, state.searchQuery)}</div>
                    <div class="detail-pages">📄 抄録集ページ: p.${escapeHtml(p.printed_pages)}（PDF p.${escapeHtml(p.pdf_pages)}）</div>
                </div>
                ${featuresHtml}
                ${issuesHtml}
                ${sectionsHtml}
                ${navRowHtml}
                <details style="margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
                    <summary style="cursor: pointer; padding: 8px 0;">Markdownソースを表示</summary>
                    <pre style="white-space: pre-wrap; background: var(--bg-secondary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto;">${escapeHtml(p.raw_markdown)}</pre>
                </details>
            `;

            detailView.classList.add('open');
            detailView.scrollTop = 0;
            if (pushHistory) {
                history.pushState({ detailId: id }, '');
            }
        }

        function closeDetail() {
            detailView.classList.remove('open');
            state.currentDetailId = null;
            if (history.state && history.state.detailId) {
                history.back();
            }
        }

        function clearSearch() {
            searchInput.value = '';
            state.searchQuery = '';
            clearBtn.style.display = 'none';
            renderList();
        }

        function updateBottomNav(activeKey) {
            document.getElementById('nav-all').classList.toggle('active', activeKey === 'all');
            document.getElementById('nav-rec').classList.toggle('active', activeKey === 'rec');
            document.getElementById('nav-fav').classList.toggle('active', activeKey === 'fav');
        }

        function switchTab(tab) {
            if (detailView.classList.contains('open')) {
                detailView.classList.remove('open');
                state.currentDetailId = null;
            }
            if (tab === 'fav') {
                state.onlyFavorites = true;
                state.onlyRecommended = false;
                state.selectedSession = 'ALL';
                updateBottomNav('fav');
            } else if (tab === 'rec') {
                state.onlyFavorites = false;
                state.onlyRecommended = true;
                state.selectedSession = 'REC_ALL';
                updateBottomNav('rec');
            } else {
                state.onlyFavorites = false;
                state.onlyRecommended = false;
                state.selectedSession = 'ALL';
                updateBottomNav('all');
            }
            renderFilters();
            renderList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.add('open');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('open');
        }

        function setFontSize(size, key) {
            document.documentElement.style.setProperty('--font-size-base', size + 'px');
            localStorage.setItem('kokubyo2026_font', size);
            ['sm', 'md', 'lg'].forEach(k => {
                document.getElementById('font-' + k).classList.toggle('active', k === key);
            });
        }

        function setTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            localStorage.setItem('kokubyo2026_theme', theme);
            document.getElementById('theme-light').classList.toggle('active', theme === 'light');
            document.getElementById('theme-dark').classList.toggle('active', theme === 'dark');
        }

        init();
    </script>
</body>
</html>
