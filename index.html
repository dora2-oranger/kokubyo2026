: "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-102-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [401]\nstatus: \"imported\"\n---\n\n# ラジカット点滴静注からラジカット内用懸濁液切り替えによる有害事象発現状況調査\n\n- 演題番号: P2-102-3\n- 演題名: ラジカット点滴静注からラジカット内用懸濁液切り替えによる有害事象発現状況調査\n- 所属施設: NHO 熊本再春医療センター 薬剤部薬剤科\n- 筆頭演者: 松本 淳（まつもと じゅん）\n- 筆頭演者の所属: NHO 熊本再春医療センター 薬剤部薬剤科\n- 演者名: 松本 淳（まつもと じゅん）、 田中 誠（たなか まこと）、 井上 大奨（いのうえ たいしょう）\n- 原本: [PDF 401ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=401>)\n- 冊子ページ: 645\n\n## 抄録本文\n\n### 目的\n\n熊本再春医療センター（以下、当院）では神経難病の 1 つである筋萎縮性側索硬化症（以下、ALS）の治療が多く行われており、ラジカットの注射剤から内用懸濁液への変更が行われている。臨床試験ではラジカット注射薬から内用懸濁液へ切り替えた患者の副作用等のデータは含まれていない。そこで、当院にてラジカット注射剤から内用懸濁液へ切り替えた患者を対象に、副作用の発現状況、副作用に関する検査値の変化について調査を行った。\n\n### 方法\n\n2023 年 4 月から 2026 年 5 月までの期間に当院にて、ラジカット注射剤から内用懸濁液へ切り替えた患者を対象に切り替え前後 3 か月間の腎機能、肝機能、下痢、電解質異常のイベント発生について電子カルテを用いて後方視的に調査を行った。\n\n### 結果\n\n対象は 19症例であり、肝機能障害、腎機能障害、血小板、顆粒球減少といった症例はみられなかった。しかし、嘔吐や便秘、下痢といった消化器症状や電解質異常などがみられた。ラジカット内用懸濁液の投与中止は 2 症例（10.5％）であり、中止理由は下痢（1 症例）と、本人による希望（1 例）であった。\n\n### 考察\n\n今回の調査では切り替え後に肝機能障害、腎機能障害、血球減少となる症例は見られなかった。しかし、ラジカット内用懸濁液切り替え後、消化器症状により投与中止となった症例が見られた。ラジカット内用懸濁液へ切り替え後は消化器症状が現れる可能性があり、下痢や悪心等の副作用を意識したフォローが重要であると考える。また、電解質異常を呈し、薬剤による電解質補正を受けた患者もみられた。このため、ラジカット内用懸濁液においても、定期的な検査値の確認が必要であると考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- エダラボンの注射から内用懸濁液への切替19例を、前後の検査値と消化器症状等から評価。\n- 下痢による中止例を含み、投与経路変更後の生活上の利点と忍容性の両面を考えられる。少数例としての評価範囲も確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-108-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-108", "session_name": "治験体制・臨床研究支援人材・CRC", "title": "当院における治験の高度化・複雑化に伴う治験実施体制の変遷と今後の課題", "authors": "箕輪 彩華（みのわ さいか）1 、 小川 千晶（おがわ ちあき） 1,2、 盛川 敬介（もりかわ けいすけ） 1,2、 金光 章江（かねみつ あきえ） 2、 中川 由美（なかがわ ゆみ） 2、 高垣 花音（たかがき かのん） 1、塚 田 絵美（つかだ えみ） 1,2、 軍司 剛宏（ぐんじ たかひろ）1 ,2、 鈴木 勝也（すずき かつや） 2,3", "first_author": "箕輪 彩華（みのわ さいか）1", "affiliations": "1 NHO 東京医療センター 薬剤部、2 NHO 東京医療センター 臨床研究・治験推進室、 3 NHO 東京医療センター リウマチ膠原病内科", "first_affiliation": "NHO 東京医療センター 薬剤部", "printed_pages": "659", "pdf_pages": "415", "features": ["治験の国際化・マスタープロトコル導入と、SMO利用率・研究経費ポイントの年次推移を関連付ける。", "件数だけでは見えにくい治験の複雑化を捉える視点が特徴。人員配置や支援体制を見直す指標として参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "国際共同治験の増加に伴い治験業務は高度化・複雑化している。本研究では、過去10 年間の東京医療センター（以下、当院）の治験受託状況および実施体制の変遷を調査し、今後の課題について検討した。"}, {"heading": "方法", "content": "2016 年 4 月から 2025 年 3 月までに当院で受託した治験を対象とした単施設後方視的調査を実施した。調査項目は、新規治験受託件数、国際共同治験比率、SMO 利用率、マスタープロトコル試験比率、臨床試験研究経費ポイント数などについて年次推移を調査し、記述統計を用いて解析した。"}, {"heading": "結果", "content": "新規治験受託件数は年間 10-20 件で推移した。国際共同治験の割合は 2016 年度の 23.1％から 2025 年度には83.3％へ増加した。SMO 利用率は 2018 年度以降増加傾向を示し、2025 年度には 72.2％となった。さらに 2024 年度に受託したマスタープロトコル試験は 2025 年度には新規治験の 22.2％を占めた。1 試験当たりの臨床試験研究経費ポイント数の平均値は 2016 年度の 87.3 から 2025 年度には 127.7 へ増加した。"}, {"heading": "考察", "content": "本研究では、国際共同治験比率の増加やマスタープロトコル試験導入に伴い、当院における治験実施体制が大きく変化している実態が示された。当院では CRC 業務負担軽減のため SMO を導入し実施体制の維持を図ってきたが、その利用率は増加傾向を示しており、医療機関側における品質管理およびマネジメント機能の重要性は高まっている可能性が示唆された。また、臨床試験研究経費ポイント数は増加傾向を示したものの、現行のポイント表は治験の高度化・複雑化や SMO の活用実態を十分に反映していない可能性がある。今後は持続可能な実施体制の構築に向け運営体制および研究経費算定の再検討が必要と考えられた。"}], "body_text": "### 目的\n\n国際共同治験の増加に伴い治験業務は高度化・複雑化している。本研究では、過去10 年間の東京医療センター（以下、当院）の治験受託状況および実施体制の変遷を調査し、今後の課題について検討した。\n\n### 方法\n\n2016 年 4 月から 2025 年 3 月までに当院で受託した治験を対象とした単施設後方視的調査を実施した。調査項目は、新規治験受託件数、国際共同治験比率、SMO 利用率、マスタープロトコル試験比率、臨床試験研究経費ポイント数などについて年次推移を調査し、記述統計を用いて解析した。\n\n### 結果\n\n新規治験受託件数は年間 10-20 件で推移した。国際共同治験の割合は 2016 年度の 23.1％から 2025 年度には83.3％へ増加した。SMO 利用率は 2018 年度以降増加傾向を示し、2025 年度には 72.2％となった。さらに 2024 年度に受託したマスタープロトコル試験は 2025 年度には新規治験の 22.2％を占めた。1 試験当たりの臨床試験研究経費ポイント数の平均値は 2016 年度の 87.3 から 2025 年度には 127.7 へ増加した。\n\n### 考察\n\n本研究では、国際共同治験比率の増加やマスタープロトコル試験導入に伴い、当院における治験実施体制が大きく変化している実態が示された。当院では CRC 業務負担軽減のため SMO を導入し実施体制の維持を図ってきたが、その利用率は増加傾向を示しており、医療機関側における品質管理およびマネジメント機能の重要性は高まっている可能性が示唆された。また、臨床試験研究経費ポイント数は増加傾向を示したものの、現行のポイント表は治験の高度化・複雑化や SMO の活用実態を十分に反映していない可能性がある。今後は持続可能な実施体制の構築に向け運営体制および研究経費算定の再検討が必要と考えられた。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-108-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [415]\nstatus: \"imported\"\n---\n\n# 当院における治験の高度化・複雑化に伴う治験実施体制の変遷と今後の課題\n\n- 演題番号: P2-108-2\n- 演題名: 当院における治験の高度化・複雑化に伴う治験実施体制の変遷と今後の課題\n- 所属施設: 1 NHO 東京医療センター 薬剤部、2 NHO 東京医療センター 臨床研究・治験推進室、 3 NHO 東京医療センター リウマチ膠原病内科\n- 筆頭演者: 箕輪 彩華（みのわ さいか）1\n- 筆頭演者の所属: NHO 東京医療センター 薬剤部\n- 演者名: 箕輪 彩華（みのわ さいか）1 、 小川 千晶（おがわ ちあき） 1,2、 盛川 敬介（もりかわ けいすけ） 1,2、 金光 章江（かねみつ あきえ） 2、 中川 由美（なかがわ ゆみ） 2、 高垣 花音（たかがき かのん） 1、塚 田 絵美（つかだ えみ） 1,2、 軍司 剛宏（ぐんじ たかひろ）1 ,2、 鈴木 勝也（すずき かつや） 2,3\n- 原本: [PDF 415ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=415>)\n- 冊子ページ: 659\n\n## 抄録本文\n\n### 目的\n\n国際共同治験の増加に伴い治験業務は高度化・複雑化している。本研究では、過去10 年間の東京医療センター（以下、当院）の治験受託状況および実施体制の変遷を調査し、今後の課題について検討した。\n\n### 方法\n\n2016 年 4 月から 2025 年 3 月までに当院で受託した治験を対象とした単施設後方視的調査を実施した。調査項目は、新規治験受託件数、国際共同治験比率、SMO 利用率、マスタープロトコル試験比率、臨床試験研究経費ポイント数などについて年次推移を調査し、記述統計を用いて解析した。\n\n### 結果\n\n新規治験受託件数は年間 10-20 件で推移した。国際共同治験の割合は 2016 年度の 23.1％から 2025 年度には83.3％へ増加した。SMO 利用率は 2018 年度以降増加傾向を示し、2025 年度には 72.2％となった。さらに 2024 年度に受託したマスタープロトコル試験は 2025 年度には新規治験の 22.2％を占めた。1 試験当たりの臨床試験研究経費ポイント数の平均値は 2016 年度の 87.3 から 2025 年度には 127.7 へ増加した。\n\n### 考察\n\n本研究では、国際共同治験比率の増加やマスタープロトコル試験導入に伴い、当院における治験実施体制が大きく変化している実態が示された。当院では CRC 業務負担軽減のため SMO を導入し実施体制の維持を図ってきたが、その利用率は増加傾向を示しており、医療機関側における品質管理およびマネジメント機能の重要性は高まっている可能性が示唆された。また、臨床試験研究経費ポイント数は増加傾向を示したものの、現行のポイント表は治験の高度化・複雑化や SMO の活用実態を十分に反映していない可能性がある。今後は持続可能な実施体制の構築に向け運営体制および研究経費算定の再検討が必要と考えられた。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 治験の国際化・マスタープロトコル導入と、SMO利用率・研究経費ポイントの年次推移を関連付ける。\n- 件数だけでは見えにくい治験の複雑化を捉える視点が特徴。人員配置や支援体制を見直す指標として参考となる。\n\n", "rec_grade": "C", "rec_perspective": "治験マネジメント", "rec_reason": "10年間で国際共同治験比率が23.1%→83.3%、マスタープロトコルが22.2%、SMO利用率が72.2%へ上昇した変遷を定量化し、現行の研究経費ポイント表の課題を提起。"}, {"id": "P2-108-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-108", "session_name": "治験体制・臨床研究支援人材・CRC", "title": "薬剤師を対象とした臨床研究支援担当者養成研修（インダクションコース）の実践とその課題", "authors": "盛川 敬介（もりかわ けいすけ） 1,2、 小川 千晶（おがわ ちあき） 1,2、 高垣 花音（たかがき かのん） 1、 塚田 絵美（つかだ えみ） 1,2、鈴 木 勝也（すずき かつや） 2,3、 軍司 剛宏（ぐんじ たかひろ） 1,2", "first_author": "盛川 敬介（もりかわ けいすけ） 1,2", "affiliations": "1 NHO 東京医療センター 薬剤部、2 NHO 東京医療センター 臨床研究・治験推進室、 3 NHO 東京医療センター リウマチ膠原病内科", "first_affiliation": "NHO 東京医療センター 薬剤部 / NHO 東京医療センター 臨床研究・治験推進室", "printed_pages": "659", "pdf_pages": "415", "features": ["卒後2年目の薬剤師に週1.5日・半年間の研修を設け、講義・見学・演習・振り返りを組み合わせる。", "治験薬管理手順書・計画の作成を成果物とする点が具体的。自己評価以外の到達度評価と、研修時間の確保に注目したい。"], "issues": [], "sections": [{"heading": "目的", "content": "薬剤師を対象とした体系的かつ実践的な臨床研究支援人材育成プログラムは十分に確立されておらず、特に実際の治験実施計画書を活用した実務経験を伴う教育機会は限定的であった。そこで本研究では、臨床研究支援業務を担う薬剤師の育成を目的として導入研修「インダクションコース」を立案・実施し、その有用性および課題について検討した。"}, {"heading": "方法", "content": "本研修は卒後 2 年目の薬剤師を対象に週 1.5 日、半年間実施した。「講義および確認テストによる基礎知識習得」、「見学による業務理解」、「演習および実務を通じた実践経験」、「日誌および定期面談による振り返り」、「自己評価アンケートによる前後比較」で構成した。演習・実務では治験実施計画書および疾患ガイドラインを基に、治験薬管理計画の立案を課題とした。"}, {"heading": "結果", "content": "研修者は 2 課題において、治験薬管理の手順書を作成し、治験実施計画書および疾患ガイドラインに基づく管理計画を立案した。自己評価アンケートでは、臨床研究支援に関する知識、治験薬管理に関する実務能力において向上が認められた。研修終了後には発展的研修（プラクティスコース）の参加意欲が確認された。"}, {"heading": "考察", "content": "本研修では、治験実施計画書を用いて疾患背景や治療戦略を踏まえて治験薬管理を検討するプロセスを取り入れることで、知識習得と実務経験を統合した実践的教育を実施できたと考えられた。また、実務を通じた経験が専門性向上や発展的研修への意欲向上に寄与した可能性が示唆された。一方、本研修は治験薬管理業務を中心とした構成のため、CRC 業務や研究事務局業務等も段階的に組み込み、臨床研究支援業務全体を担う人材育成プログラムとして発展させていく。"}], "body_text": "### 目的\n\n薬剤師を対象とした体系的かつ実践的な臨床研究支援人材育成プログラムは十分に確立されておらず、特に実際の治験実施計画書を活用した実務経験を伴う教育機会は限定的であった。そこで本研究では、臨床研究支援業務を担う薬剤師の育成を目的として導入研修「インダクションコース」を立案・実施し、その有用性および課題について検討した。\n\n### 方法\n\n本研修は卒後 2 年目の薬剤師を対象に週 1.5 日、半年間実施した。「講義および確認テストによる基礎知識習得」、「見学による業務理解」、「演習および実務を通じた実践経験」、「日誌および定期面談による振り返り」、「自己評価アンケートによる前後比較」で構成した。演習・実務では治験実施計画書および疾患ガイドラインを基に、治験薬管理計画の立案を課題とした。\n\n### 結果\n\n研修者は 2 課題において、治験薬管理の手順書を作成し、治験実施計画書および疾患ガイドラインに基づく管理計画を立案した。自己評価アンケートでは、臨床研究支援に関する知識、治験薬管理に関する実務能力において向上が認められた。研修終了後には発展的研修（プラクティスコース）の参加意欲が確認された。\n\n### 考察\n\n本研修では、治験実施計画書を用いて疾患背景や治療戦略を踏まえて治験薬管理を検討するプロセスを取り入れることで、知識習得と実務経験を統合した実践的教育を実施できたと考えられた。また、実務を通じた経験が専門性向上や発展的研修への意欲向上に寄与した可能性が示唆された。一方、本研修は治験薬管理業務を中心とした構成のため、CRC 業務や研究事務局業務等も段階的に組み込み、臨床研究支援業務全体を担う人材育成プログラムとして発展させていく。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-108-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [415]\nstatus: \"imported\"\n---\n\n# 薬剤師を対象とした臨床研究支援担当者養成研修（インダクションコース）の実践とその課題\n\n- 演題番号: P2-108-3\n- 演題名: 薬剤師を対象とした臨床研究支援担当者養成研修（インダクションコース）の実践とその課題\n- 所属施設: 1 NHO 東京医療センター 薬剤部、2 NHO 東京医療センター 臨床研究・治験推進室、 3 NHO 東京医療センター リウマチ膠原病内科\n- 筆頭演者: 盛川 敬介（もりかわ けいすけ） 1,2\n- 筆頭演者の所属: NHO 東京医療センター 薬剤部 / NHO 東京医療センター 臨床研究・治験推進室\n- 演者名: 盛川 敬介（もりかわ けいすけ） 1,2、 小川 千晶（おがわ ちあき） 1,2、 高垣 花音（たかがき かのん） 1、 塚田 絵美（つかだ えみ） 1,2、鈴 木 勝也（すずき かつや） 2,3、 軍司 剛宏（ぐんじ たかひろ） 1,2\n- 原本: [PDF 415ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=415>)\n- 冊子ページ: 659\n\n## 抄録本文\n\n### 目的\n\n薬剤師を対象とした体系的かつ実践的な臨床研究支援人材育成プログラムは十分に確立されておらず、特に実際の治験実施計画書を活用した実務経験を伴う教育機会は限定的であった。そこで本研究では、臨床研究支援業務を担う薬剤師の育成を目的として導入研修「インダクションコース」を立案・実施し、その有用性および課題について検討した。\n\n### 方法\n\n本研修は卒後 2 年目の薬剤師を対象に週 1.5 日、半年間実施した。「講義および確認テストによる基礎知識習得」、「見学による業務理解」、「演習および実務を通じた実践経験」、「日誌および定期面談による振り返り」、「自己評価アンケートによる前後比較」で構成した。演習・実務では治験実施計画書および疾患ガイドラインを基に、治験薬管理計画の立案を課題とした。\n\n### 結果\n\n研修者は 2 課題において、治験薬管理の手順書を作成し、治験実施計画書および疾患ガイドラインに基づく管理計画を立案した。自己評価アンケートでは、臨床研究支援に関する知識、治験薬管理に関する実務能力において向上が認められた。研修終了後には発展的研修（プラクティスコース）の参加意欲が確認された。\n\n### 考察\n\n本研修では、治験実施計画書を用いて疾患背景や治療戦略を踏まえて治験薬管理を検討するプロセスを取り入れることで、知識習得と実務経験を統合した実践的教育を実施できたと考えられた。また、実務を通じた経験が専門性向上や発展的研修への意欲向上に寄与した可能性が示唆された。一方、本研修は治験薬管理業務を中心とした構成のため、CRC 業務や研究事務局業務等も段階的に組み込み、臨床研究支援業務全体を担う人材育成プログラムとして発展させていく。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 卒後2年目の薬剤師に週1.5日・半年間の研修を設け、講義・見学・演習・振り返りを組み合わせる。\n- 治験薬管理手順書・計画の作成を成果物とする点が具体的。自己評価以外の到達度評価と、研修時間の確保に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-108-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-108", "session_name": "治験体制・臨床研究支援人材・CRC", "title": "CRC における電子カルテスクリーニングの実態と標準化ニーズ―単施設パイロット調査および多施設調査準備状況の検討―", "authors": "小林 英嗣（こばやし ひでつぐ） 1,2、 阿部 憲介（あべ けんすけ） 1,2、 西城 信（さいじょう まこと） 1,2、 西村 康人（にしむら やすひと） 1,2、 杉村 美華子（すぎむら みかこ） 2,3、 和泉 透（いずみ とおる） 2,4", "first_author": "小林 英嗣（こばやし ひでつぐ） 1,2", "affiliations": "1 NHO 仙台医療センター 薬剤部、2 NHO 仙台医療センター 治験管理室、 3 NHO 仙台医療センター 消化器センター、4 NHO 仙台医療センター 臨床研究部", "first_affiliation": "NHO 仙台医療センター 薬剤部 / NHO 仙台医療センター 治験管理室", "printed_pages": "660", "pdf_pages": "416", "features": ["CRCのカルテスクリーニングを、単施設の試行調査と多施設調査に向けた実施可能性から検討。", "時間的負担と見逃し不安、テンプレートへの期待を整理。少数回答の予備的結果として、標準化する範囲と調査設計が論点となる。"], "issues": [], "sections": [{"heading": "目的", "content": "治験実施率向上には、適格患者を効率的かつ漏れなく拾い上げる体制が重要である。しかし、臨床研究コーディネーター（CRC）による電子カルテスクリーニングは、個人の経験や担当診療科との関係性に依存しやすく、方法の属人化が課題となる。本調査は、当院CRC を対象としたパイロット調査により電子カルテスクリーニングの課題と標準化ニーズを把握するとともに、地区内多施設調査への展開可能性を検討することを目的とした。"}, {"heading": "方法", "content": "当院 CRC5 名を対象に無記名自記式アンケートを実施した。調査項目は属性、実施状況、負担感、質の自己評価、標準化ニーズ等の全 29 項目とし、Q12〜25 は 5 段階リッカート尺度（1：全くそう思わない〜5：非常にそう思う）にて評価した。結果は記述統計により整理した。併せて、地区内 NHO 病院 20 施設を対象に、治験業務実施の有無、電子カルテスクリーニングへの CRC 関与の有無、本調査対象 CRC 人数等に関する事前調査を行った。"}, {"heading": "結果", "content": "当院調査では 5 名中 3 名が回答し、時間的負担 4.33、見逃し不安 4.00、検索条件テンプレートへの期待 4.33 であった。自由記述では、抽出後確認の負担、検索ツール活用不足、診療科差が挙がった。事前調査では 20 施設中 14 施設から回答を得た（回答率70％）。このうち治験実施施設は 8 施設で、CRC が電子カルテスクリーニングに関与する施設は 5 施設、本調査対象 CRC を有する施設は 4 施設、対象 CRC 数は 17 名（薬剤師 7 名、看護師 10 名）であった。"}, {"heading": "結論", "content": "当院 CRC における電子カルテスクリーニングの課題と標準化ニーズの一端が把握されるとともに、地区内多施設調査へ展開するための基盤が確認された。"}], "body_text": "### 目的\n\n治験実施率向上には、適格患者を効率的かつ漏れなく拾い上げる体制が重要である。しかし、臨床研究コーディネーター（CRC）による電子カルテスクリーニングは、個人の経験や担当診療科との関係性に依存しやすく、方法の属人化が課題となる。本調査は、当院CRC を対象としたパイロット調査により電子カルテスクリーニングの課題と標準化ニーズを把握するとともに、地区内多施設調査への展開可能性を検討することを目的とした。\n\n### 方法\n\n当院 CRC5 名を対象に無記名自記式アンケートを実施した。調査項目は属性、実施状況、負担感、質の自己評価、標準化ニーズ等の全 29 項目とし、Q12〜25 は 5 段階リッカート尺度（1：全くそう思わない〜5：非常にそう思う）にて評価した。結果は記述統計により整理した。併せて、地区内 NHO 病院 20 施設を対象に、治験業務実施の有無、電子カルテスクリーニングへの CRC 関与の有無、本調査対象 CRC 人数等に関する事前調査を行った。\n\n### 結果\n\n当院調査では 5 名中 3 名が回答し、時間的負担 4.33、見逃し不安 4.00、検索条件テンプレートへの期待 4.33 であった。自由記述では、抽出後確認の負担、検索ツール活用不足、診療科差が挙がった。事前調査では 20 施設中 14 施設から回答を得た（回答率70％）。このうち治験実施施設は 8 施設で、CRC が電子カルテスクリーニングに関与する施設は 5 施設、本調査対象 CRC を有する施設は 4 施設、対象 CRC 数は 17 名（薬剤師 7 名、看護師 10 名）であった。\n\n### 結論\n\n当院 CRC における電子カルテスクリーニングの課題と標準化ニーズの一端が把握されるとともに、地区内多施設調査へ展開するための基盤が確認された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-108-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [416]\nstatus: \"imported\"\n---\n\n# CRC における電子カルテスクリーニングの実態と標準化ニーズ―単施設パイロット調査および多施設調査準備状況の検討―\n\n- 演題番号: P2-108-4\n- 演題名: CRC における電子カルテスクリーニングの実態と標準化ニーズ―単施設パイロット調査および多施設調査準備状況の検討―\n- 所属施設: 1 NHO 仙台医療センター 薬剤部、2 NHO 仙台医療センター 治験管理室、 3 NHO 仙台医療センター 消化器センター、4 NHO 仙台医療センター 臨床研究部\n- 筆頭演者: 小林 英嗣（こばやし ひでつぐ） 1,2\n- 筆頭演者の所属: NHO 仙台医療センター 薬剤部 / NHO 仙台医療センター 治験管理室\n- 演者名: 小林 英嗣（こばやし ひでつぐ） 1,2、 阿部 憲介（あべ けんすけ） 1,2、 西城 信（さいじょう まこと） 1,2、 西村 康人（にしむら やすひと） 1,2、 杉村 美華子（すぎむら みかこ） 2,3、 和泉 透（いずみ とおる） 2,4\n- 原本: [PDF 416ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=416>)\n- 冊子ページ: 660\n\n## 抄録本文\n\n### 目的\n\n治験実施率向上には、適格患者を効率的かつ漏れなく拾い上げる体制が重要である。しかし、臨床研究コーディネーター（CRC）による電子カルテスクリーニングは、個人の経験や担当診療科との関係性に依存しやすく、方法の属人化が課題となる。本調査は、当院CRC を対象としたパイロット調査により電子カルテスクリーニングの課題と標準化ニーズを把握するとともに、地区内多施設調査への展開可能性を検討することを目的とした。\n\n### 方法\n\n当院 CRC5 名を対象に無記名自記式アンケートを実施した。調査項目は属性、実施状況、負担感、質の自己評価、標準化ニーズ等の全 29 項目とし、Q12〜25 は 5 段階リッカート尺度（1：全くそう思わない〜5：非常にそう思う）にて評価した。結果は記述統計により整理した。併せて、地区内 NHO 病院 20 施設を対象に、治験業務実施の有無、電子カルテスクリーニングへの CRC 関与の有無、本調査対象 CRC 人数等に関する事前調査を行った。\n\n### 結果\n\n当院調査では 5 名中 3 名が回答し、時間的負担 4.33、見逃し不安 4.00、検索条件テンプレートへの期待 4.33 であった。自由記述では、抽出後確認の負担、検索ツール活用不足、診療科差が挙がった。事前調査では 20 施設中 14 施設から回答を得た（回答率70％）。このうち治験実施施設は 8 施設で、CRC が電子カルテスクリーニングに関与する施設は 5 施設、本調査対象 CRC を有する施設は 4 施設、対象 CRC 数は 17 名（薬剤師 7 名、看護師 10 名）であった。\n\n### 結論\n\n当院 CRC における電子カルテスクリーニングの課題と標準化ニーズの一端が把握されるとともに、地区内多施設調査へ展開するための基盤が確認された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- CRCのカルテスクリーニングを、単施設の試行調査と多施設調査に向けた実施可能性から検討。\n- 時間的負担と見逃し不安、テンプレートへの期待を整理。少数回答の予備的結果として、標準化する範囲と調査設計が論点となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-109-1", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-109", "session_name": "病棟薬剤業務・ポリファーマシー・業務再設計", "title": "これからの医療を見据えた薬剤情報連携体制の構築", "authors": "福泉 智子（ふくいずみ ともこ）、 古賀 麻紀子（こが まきこ）、仲 田 浩成（なかた ひろなり）、 鶴崎 泰史（つるさき やすふみ）", "first_author": "福泉 智子（ふくいずみ ともこ）", "affiliations": "NHO 佐賀病院 薬剤部", "first_affiliation": "NHO 佐賀病院 薬剤部", "printed_pages": "661", "pdf_pages": "417", "features": ["電子カルテ帳票で薬剤管理サマリーを作り、薬局への送付と医事算定情報の連携を整備。", "半年で7件の実績を報告する導入期の取り組み。作成負担と同意取得・送付・算定を一連の運用にする工夫が参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "地域包括医療病棟は急性期治療後の下り搬送患者や軽症〜中等症の高齢者の救急患者を受け入れ、多職種によるリハビリテーション・栄養管理・退院支援を通じて ADL の維持・向上と在宅復帰を支援する役割を担う。この病棟では高齢者の多剤服用や薬剤関連問題が顕在化しやすく、退院後の生活を見据えた薬剤情報連携が重要となり、薬剤師の役割は大きい。当院では令和 6 年 10 月の急性期一般病棟から地域包括医療病棟への転換を契機に病棟薬剤師による薬剤情報共有の体制整備が求められた。今回、退院時薬剤情報管理指導料算定に向けたシステム構築の取り組みについて報告する。"}, {"heading": "方法", "content": "薬剤情報共有ツールである薬剤管理サマリーを電子カルテ上の帳票として作成した。患者または家族の同意取得後、帳票をかかりつけ薬局へ FAX で送信した。また帳票作成後に算定情報が医事システムへ自動連携されるよう設定した。"}, {"heading": "結果", "content": "薬剤管理サマリーを用いた薬剤情報共有の運用を開始できた。令和7 年 10 月〜令和 8 年 3 月に旧退院時薬剤情報連携加算を取得した症例は 7 件（自宅退院 6件、施設退院 1 件）であった。"}, {"heading": "考察", "content": "地域包括医療病棟を有する施設として退院後の服薬管理を見据えた薬剤情報連携の基盤構築は重要である。特にポリファーマシー対策は地域包括ケアの中で薬剤師が積極的に関与すべき領域である。今回の取り組みで薬剤管理サマリーを活用した施設間の薬剤情報共有が可能となりかかりつけ薬局との連携強化に寄与した。令和 8 年度診療報酬改定では病棟薬剤業務実施加算 1 が新設され、今後はポリファーマシー対策や薬剤情報連携を継続的・体系的に実施できる体制整備が必要である。"}], "body_text": "### 目的\n\n地域包括医療病棟は急性期治療後の下り搬送患者や軽症〜中等症の高齢者の救急患者を受け入れ、多職種によるリハビリテーション・栄養管理・退院支援を通じて ADL の維持・向上と在宅復帰を支援する役割を担う。この病棟では高齢者の多剤服用や薬剤関連問題が顕在化しやすく、退院後の生活を見据えた薬剤情報連携が重要となり、薬剤師の役割は大きい。当院では令和 6 年 10 月の急性期一般病棟から地域包括医療病棟への転換を契機に病棟薬剤師による薬剤情報共有の体制整備が求められた。今回、退院時薬剤情報管理指導料算定に向けたシステム構築の取り組みについて報告する。\n\n### 方法\n\n薬剤情報共有ツールである薬剤管理サマリーを電子カルテ上の帳票として作成した。患者または家族の同意取得後、帳票をかかりつけ薬局へ FAX で送信した。また帳票作成後に算定情報が医事システムへ自動連携されるよう設定した。\n\n### 結果\n\n薬剤管理サマリーを用いた薬剤情報共有の運用を開始できた。令和7 年 10 月〜令和 8 年 3 月に旧退院時薬剤情報連携加算を取得した症例は 7 件（自宅退院 6件、施設退院 1 件）であった。\n\n### 考察\n\n地域包括医療病棟を有する施設として退院後の服薬管理を見据えた薬剤情報連携の基盤構築は重要である。特にポリファーマシー対策は地域包括ケアの中で薬剤師が積極的に関与すべき領域である。今回の取り組みで薬剤管理サマリーを活用した施設間の薬剤情報共有が可能となりかかりつけ薬局との連携強化に寄与した。令和 8 年度診療報酬改定では病棟薬剤業務実施加算 1 が新設され、今後はポリファーマシー対策や薬剤情報連携を継続的・体系的に実施できる体制整備が必要である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-109-1\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [417]\nstatus: \"imported\"\n---\n\n# これからの医療を見据えた薬剤情報連携体制の構築\n\n- 演題番号: P2-109-1\n- 演題名: これからの医療を見据えた薬剤情報連携体制の構築\n- 所属施設: NHO 佐賀病院 薬剤部\n- 筆頭演者: 福泉 智子（ふくいずみ ともこ）\n- 筆頭演者の所属: NHO 佐賀病院 薬剤部\n- 演者名: 福泉 智子（ふくいずみ ともこ）、 古賀 麻紀子（こが まきこ）、仲 田 浩成（なかた ひろなり）、 鶴崎 泰史（つるさき やすふみ）\n- 原本: [PDF 417ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=417>)\n- 冊子ページ: 661\n\n## 抄録本文\n\n### 目的\n\n地域包括医療病棟は急性期治療後の下り搬送患者や軽症〜中等症の高齢者の救急患者を受け入れ、多職種によるリハビリテーション・栄養管理・退院支援を通じて ADL の維持・向上と在宅復帰を支援する役割を担う。この病棟では高齢者の多剤服用や薬剤関連問題が顕在化しやすく、退院後の生活を見据えた薬剤情報連携が重要となり、薬剤師の役割は大きい。当院では令和 6 年 10 月の急性期一般病棟から地域包括医療病棟への転換を契機に病棟薬剤師による薬剤情報共有の体制整備が求められた。今回、退院時薬剤情報管理指導料算定に向けたシステム構築の取り組みについて報告する。\n\n### 方法\n\n薬剤情報共有ツールである薬剤管理サマリーを電子カルテ上の帳票として作成した。患者または家族の同意取得後、帳票をかかりつけ薬局へ FAX で送信した。また帳票作成後に算定情報が医事システムへ自動連携されるよう設定した。\n\n### 結果\n\n薬剤管理サマリーを用いた薬剤情報共有の運用を開始できた。令和7 年 10 月〜令和 8 年 3 月に旧退院時薬剤情報連携加算を取得した症例は 7 件（自宅退院 6件、施設退院 1 件）であった。\n\n### 考察\n\n地域包括医療病棟を有する施設として退院後の服薬管理を見据えた薬剤情報連携の基盤構築は重要である。特にポリファーマシー対策は地域包括ケアの中で薬剤師が積極的に関与すべき領域である。今回の取り組みで薬剤管理サマリーを活用した施設間の薬剤情報共有が可能となりかかりつけ薬局との連携強化に寄与した。令和 8 年度診療報酬改定では病棟薬剤業務実施加算 1 が新設され、今後はポリファーマシー対策や薬剤情報連携を継続的・体系的に実施できる体制整備が必要である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 電子カルテ帳票で薬剤管理サマリーを作り、薬局への送付と医事算定情報の連携を整備。\n- 半年で7件の実績を報告する導入期の取り組み。作成負担と同意取得・送付・算定を一連の運用にする工夫が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-109-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-109", "session_name": "病棟薬剤業務・ポリファーマシー・業務再設計", "title": "トレーシングレポートに対する当院の状況と運用方法の検討", "authors": "佐々木 京子（ささき きょうこ）、 小原 直紘（おはら なおひろ）、向 井 優太朗（むかい ゆうたろう）、 細田 敦規（ほそだ あつき）、 阿部 正樹（あべ まさき）、 山西 香織（やまにし かおり）、 畝 佳子（うね よしこ）", "first_author": "佐々木 京子（ささき きょうこ）", "affiliations": "国立研究開発法人 国立循環器病研究センター 薬剤部", "first_affiliation": "国立研究開発法人 国立循環器病研究センター 薬剤部", "printed_pages": "661", "pdf_pages": "417", "features": ["トレーシングレポート556件を地域・診療科・薬剤・内容別に整理し、運用変更後の医師返信も評価。", "返信率89％という双方向連携の実績が特徴。医師へ確実に届き返信につながる手順に注目したい。"], "issues": [], "sections": [{"heading": "背景", "content": "保険薬局薬剤師が患者から得た非緊急の薬物治療関連情報をトレーシングレポート（TR）として医師へ提供する取り組みが進められている。当院では従来、医師の返信を各自に一任していたが、2025 年 8 月より薬剤部が回答を回収し保険薬局へ FAX 返信する運用に変更した。これにより返信状況および回答内容の把握が可能となったため、当院の TR の現状と課題を検討した。"}, {"heading": "方法", "content": "2024 年 7 月以降に薬剤部へ送付された TR を対象として、薬局名、薬局所在地（市）、診療科、該当薬剤および報告内容を収集し、2026 年 3 月までを対象期間として集計した。なお、医師の返信率は運用変更後（2025 年 8 月以降）を対象に算出した。"}, {"heading": "結果", "content": "対象期間中の TR は 556 件で、月平均は 2024 年度約 23 件、2025年度約 29 件であった。提供元は吹田市が 56％と最多であった。診療科は心臓血管集中治療科（20％）、心不全科（15％）、腎臓・高血圧内科（10％）が中心で、該当薬剤は心不全治療薬（28％）、抗凝固薬（12％）、脂質異常症治療薬（8％）と循環器・代謝領域が大半を占めた。報告内容は在宅訪問 25％、残薬・アドヒアランス 20％、副作用 15％、用法・用量変更依頼 12％であった。運用変更後の医師からの返信率は 89％であった。"}, {"heading": "考察", "content": "当院の TR は在宅・外来診療の情報を補完し、継続的な薬学的管理に寄与していることが示唆された。薬剤部が介在する運用への変更により医師の負担軽減と高い返信率が得られ、双方向の情報連携が促進されたと考えられる。今後は近隣薬局との連携強化に向け、得られた傾向の共有および TR 様式の改善を通じて、報告の質向上を図りたい。"}], "body_text": "### 背景\n\n保険薬局薬剤師が患者から得た非緊急の薬物治療関連情報をトレーシングレポート（TR）として医師へ提供する取り組みが進められている。当院では従来、医師の返信を各自に一任していたが、2025 年 8 月より薬剤部が回答を回収し保険薬局へ FAX 返信する運用に変更した。これにより返信状況および回答内容の把握が可能となったため、当院の TR の現状と課題を検討した。\n\n### 方法\n\n2024 年 7 月以降に薬剤部へ送付された TR を対象として、薬局名、薬局所在地（市）、診療科、該当薬剤および報告内容を収集し、2026 年 3 月までを対象期間として集計した。なお、医師の返信率は運用変更後（2025 年 8 月以降）を対象に算出した。\n\n### 結果\n\n対象期間中の TR は 556 件で、月平均は 2024 年度約 23 件、2025年度約 29 件であった。提供元は吹田市が 56％と最多であった。診療科は心臓血管集中治療科（20％）、心不全科（15％）、腎臓・高血圧内科（10％）が中心で、該当薬剤は心不全治療薬（28％）、抗凝固薬（12％）、脂質異常症治療薬（8％）と循環器・代謝領域が大半を占めた。報告内容は在宅訪問 25％、残薬・アドヒアランス 20％、副作用 15％、用法・用量変更依頼 12％であった。運用変更後の医師からの返信率は 89％であった。\n\n### 考察\n\n当院の TR は在宅・外来診療の情報を補完し、継続的な薬学的管理に寄与していることが示唆された。薬剤部が介在する運用への変更により医師の負担軽減と高い返信率が得られ、双方向の情報連携が促進されたと考えられる。今後は近隣薬局との連携強化に向け、得られた傾向の共有および TR 様式の改善を通じて、報告の質向上を図りたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-109-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [417]\nstatus: \"imported\"\n---\n\n# トレーシングレポートに対する当院の状況と運用方法の検討\n\n- 演題番号: P2-109-2\n- 演題名: トレーシングレポートに対する当院の状況と運用方法の検討\n- 所属施設: 国立研究開発法人 国立循環器病研究センター 薬剤部\n- 筆頭演者: 佐々木 京子（ささき きょうこ）\n- 筆頭演者の所属: 国立研究開発法人 国立循環器病研究センター 薬剤部\n- 演者名: 佐々木 京子（ささき きょうこ）、 小原 直紘（おはら なおひろ）、向 井 優太朗（むかい ゆうたろう）、 細田 敦規（ほそだ あつき）、 阿部 正樹（あべ まさき）、 山西 香織（やまにし かおり）、 畝 佳子（うね よしこ）\n- 原本: [PDF 417ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=417>)\n- 冊子ページ: 661\n\n## 抄録本文\n\n### 背景\n\n保険薬局薬剤師が患者から得た非緊急の薬物治療関連情報をトレーシングレポート（TR）として医師へ提供する取り組みが進められている。当院では従来、医師の返信を各自に一任していたが、2025 年 8 月より薬剤部が回答を回収し保険薬局へ FAX 返信する運用に変更した。これにより返信状況および回答内容の把握が可能となったため、当院の TR の現状と課題を検討した。\n\n### 方法\n\n2024 年 7 月以降に薬剤部へ送付された TR を対象として、薬局名、薬局所在地（市）、診療科、該当薬剤および報告内容を収集し、2026 年 3 月までを対象期間として集計した。なお、医師の返信率は運用変更後（2025 年 8 月以降）を対象に算出した。\n\n### 結果\n\n対象期間中の TR は 556 件で、月平均は 2024 年度約 23 件、2025年度約 29 件であった。提供元は吹田市が 56％と最多であった。診療科は心臓血管集中治療科（20％）、心不全科（15％）、腎臓・高血圧内科（10％）が中心で、該当薬剤は心不全治療薬（28％）、抗凝固薬（12％）、脂質異常症治療薬（8％）と循環器・代謝領域が大半を占めた。報告内容は在宅訪問 25％、残薬・アドヒアランス 20％、副作用 15％、用法・用量変更依頼 12％であった。運用変更後の医師からの返信率は 89％であった。\n\n### 考察\n\n当院の TR は在宅・外来診療の情報を補完し、継続的な薬学的管理に寄与していることが示唆された。薬剤部が介在する運用への変更により医師の負担軽減と高い返信率が得られ、双方向の情報連携が促進されたと考えられる。今後は近隣薬局との連携強化に向け、得られた傾向の共有および TR 様式の改善を通じて、報告の質向上を図りたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- トレーシングレポート556件を地域・診療科・薬剤・内容別に整理し、運用変更後の医師返信も評価。\n- 返信率89％という双方向連携の実績が特徴。医師へ確実に届き返信につながる手順に注目したい。\n\n", "rec_grade": "B", "rec_perspective": "双方向薬薬連携・循環器TR", "rec_reason": "556件のTRを分析し、医師任せだった返信を「薬剤部が回答回収・FAX返信する運用」へ変更することで医師返信率89%を達成。双方向連携を機能させる運用モデル。"}, {"id": "P2-109-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-109", "session_name": "病棟薬剤業務・ポリファーマシー・業務再設計", "title": "薬剤総合評価調整加算の算定推進を目的とした業務標準化への取り組み", "authors": "石田 誠直（いしだ せな）", "first_author": "石田 誠直（いしだ せな）", "affiliations": "NHO 村山医療センター 薬剤科", "first_affiliation": "NHO 村山医療センター 薬剤科", "printed_pages": "661", "pdf_pages": "417", "features": ["患者抽出・カルテ記載・情報提供のツールをまとめ、薬剤総合評価調整加算の業務を標準化。", "算定者が1名から病棟担当4名へ広がり、月2.5件から9.5件へ増加。属人化を解く教育・運用設計が参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "2026 年度診療報酬改定において、病棟薬剤業務実施加算 1 の算定要件に薬剤総合評価調整加算（以下、調整加算）の算定実績（直近 3 ヶ月で 10 回以上）が新たに追加された。村山医療センターでは、これまで調整加算の算定件数が年間数件に留まり、新要件の充足が困難な状況であった。その要因のひとつとして、算定の取得が特定の薬剤師のみ実施しており、業務の標準化が不十分であったことが考えられた。そこで、算定件数増加を目的として算定体制を再構築し、その効果を検証した。"}, {"heading": "方法", "content": "調整加算の算定体制強化と業務標準化を目指し、既存マニュアルの改訂および業務フローの見直しを実施した。あわせて、対象患者を効率的に抽出する「患者スクリーニングシート」、「カルテ記載用フォーマット」、転院先等への情報連携を円滑に実施するための「連携文書（薬剤サマリー等）フォーマット」を整備した。2026 年 4 月より運用を開始し、導入前後各 2 か月間における、調整加算の算定件数を比較した。"}, {"heading": "結果", "content": "改訂マニュアルおよび各種ツールの活用により、従来は、1 名のみであった算定取得者が、病棟業務を担当する全薬剤師 4 名へと拡大した。月平均算定件数は導入前の 2.5 件から導入後は 9.5 件へと増加し、病棟薬剤業務実施加算 1 の施設基準の一つを満たした。"}, {"heading": "結論", "content": "業務プロセスの標準化により、調整加算の算定件数増加と病棟薬剤業務実施加算 1 の新施設基準達成が可能となった。本取り組みは、地域連携を見据えた継続的なポリファーマシー対策の推進に寄与するとともに、病院経営の安定化にも有用であると考えられた。"}], "body_text": "### 目的\n\n2026 年度診療報酬改定において、病棟薬剤業務実施加算 1 の算定要件に薬剤総合評価調整加算（以下、調整加算）の算定実績（直近 3 ヶ月で 10 回以上）が新たに追加された。村山医療センターでは、これまで調整加算の算定件数が年間数件に留まり、新要件の充足が困難な状況であった。その要因のひとつとして、算定の取得が特定の薬剤師のみ実施しており、業務の標準化が不十分であったことが考えられた。そこで、算定件数増加を目的として算定体制を再構築し、その効果を検証した。\n\n### 方法\n\n調整加算の算定体制強化と業務標準化を目指し、既存マニュアルの改訂および業務フローの見直しを実施した。あわせて、対象患者を効率的に抽出する「患者スクリーニングシート」、「カルテ記載用フォーマット」、転院先等への情報連携を円滑に実施するための「連携文書（薬剤サマリー等）フォーマット」を整備した。2026 年 4 月より運用を開始し、導入前後各 2 か月間における、調整加算の算定件数を比較した。\n\n### 結果\n\n改訂マニュアルおよび各種ツールの活用により、従来は、1 名のみであった算定取得者が、病棟業務を担当する全薬剤師 4 名へと拡大した。月平均算定件数は導入前の 2.5 件から導入後は 9.5 件へと増加し、病棟薬剤業務実施加算 1 の施設基準の一つを満たした。\n\n### 結論\n\n業務プロセスの標準化により、調整加算の算定件数増加と病棟薬剤業務実施加算 1 の新施設基準達成が可能となった。本取り組みは、地域連携を見据えた継続的なポリファーマシー対策の推進に寄与するとともに、病院経営の安定化にも有用であると考えられた。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-109-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [417]\nstatus: \"imported\"\n---\n\n# 薬剤総合評価調整加算の算定推進を目的とした業務標準化への取り組み\n\n- 演題番号: P2-109-3\n- 演題名: 薬剤総合評価調整加算の算定推進を目的とした業務標準化への取り組み\n- 所属施設: NHO 村山医療センター 薬剤科\n- 筆頭演者: 石田 誠直（いしだ せな）\n- 筆頭演者の所属: NHO 村山医療センター 薬剤科\n- 演者名: 石田 誠直（いしだ せな）\n- 原本: [PDF 417ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=417>)\n- 冊子ページ: 661\n\n## 抄録本文\n\n### 目的\n\n2026 年度診療報酬改定において、病棟薬剤業務実施加算 1 の算定要件に薬剤総合評価調整加算（以下、調整加算）の算定実績（直近 3 ヶ月で 10 回以上）が新たに追加された。村山医療センターでは、これまで調整加算の算定件数が年間数件に留まり、新要件の充足が困難な状況であった。その要因のひとつとして、算定の取得が特定の薬剤師のみ実施しており、業務の標準化が不十分であったことが考えられた。そこで、算定件数増加を目的として算定体制を再構築し、その効果を検証した。\n\n### 方法\n\n調整加算の算定体制強化と業務標準化を目指し、既存マニュアルの改訂および業務フローの見直しを実施した。あわせて、対象患者を効率的に抽出する「患者スクリーニングシート」、「カルテ記載用フォーマット」、転院先等への情報連携を円滑に実施するための「連携文書（薬剤サマリー等）フォーマット」を整備した。2026 年 4 月より運用を開始し、導入前後各 2 か月間における、調整加算の算定件数を比較した。\n\n### 結果\n\n改訂マニュアルおよび各種ツールの活用により、従来は、1 名のみであった算定取得者が、病棟業務を担当する全薬剤師 4 名へと拡大した。月平均算定件数は導入前の 2.5 件から導入後は 9.5 件へと増加し、病棟薬剤業務実施加算 1 の施設基準の一つを満たした。\n\n### 結論\n\n業務プロセスの標準化により、調整加算の算定件数増加と病棟薬剤業務実施加算 1 の新施設基準達成が可能となった。本取り組みは、地域連携を見据えた継続的なポリファーマシー対策の推進に寄与するとともに、病院経営の安定化にも有用であると考えられた。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 患者抽出・カルテ記載・情報提供のツールをまとめ、薬剤総合評価調整加算の業務を標準化。\n- 算定者が1名から病棟担当4名へ広がり、月2.5件から9.5件へ増加。属人化を解く教育・運用設計が参考となる。\n\n", "rec_grade": "B", "rec_perspective": "2026改定・ポリファーマシー", "rec_reason": "スクリーニングシート・記載フォーマット・連携文書を整備し、特定薬剤師1名のみだった算定を病棟担当全員へ拡大（月2.5→9.5件）。病棟薬剤業務実施加算1の新基準達成に直結。"}, {"id": "P2-109-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-109", "session_name": "病棟薬剤業務・ポリファーマシー・業務再設計", "title": "病棟薬剤業務充実に向けた取り組み", "authors": "松下 すみれ（まつした すみれ）、 松岡 まりあ（まつおか まりあ）、 安達 尚哉（あだち なおや）、 山本 吉章（やまもと よしあき）、 三井 陽二（みつい ようじ）", "first_author": "松下 すみれ（まつした すみれ）", "affiliations": "NHO 金沢医療センター 薬剤部", "first_affiliation": "NHO 金沢医療センター 薬剤部", "printed_pages": "661", "pdf_pages": "417", "features": ["朝礼後1時間の病棟業務確保など体制を見直し、退院時指導・薬剤調整・再調剤を評価。", "退院時指導の増加と再調剤の減少を併せて示す。短期間の比較として、業務配分と継続運用の工夫に注目したい。"], "issues": [], "sections": [{"heading": "目的", "content": "2026 年度診療報酬改定では、病棟薬剤業務実施加算に新区分（加算 1）が新設され、退院時薬剤情報管理指導や薬剤総合評価調整の実績が評価対象となった。当院では病棟薬剤業務の充実を目的として業務体制整備を実施したため、その取り組みと成果について報告する。"}, {"heading": "方法", "content": "従来、病棟業務はシフト制で運用しており、薬剤師ごとに午前または午後のみ病棟対応を行っていた。そこで（1）全薬剤師が朝礼後 1 時間は病棟業務を実施できる体制へ変更し、退院時薬剤情報管理指導を推進した。（2）退院会計時に退院時薬剤情報管理指導料の算定がない場合、医事科から病棟担当薬剤師へ連絡する体制を構築した。（3）病棟業務へ人的資源を再配置する目的で院外処方せん発行を推進し、院内処方入力時には院外処方への変更を依頼した。（4）一包化再調剤依頼は原則中止とし、必要時のみ病棟担当薬剤師と協議のうえ実施した。2025 年 4 月〜2026 年 2 月の月平均値と 2026 年 4 月実績を比較評価した。"}, {"heading": "結果", "content": "退院時薬剤情報管理指導実施率は 13.4％から 66.0％に増加し、薬剤総合評価調整実施率は 3.4％から 3.8％に増加した。加えて再調剤実施率は 7.4％から 4.4％に減少した。"}, {"heading": "考察", "content": "病棟薬剤業務実施加算 1 算定に向けた業務体制整備により、退院時薬剤情報管理指導実施率の大幅な向上が認められた。特に、全薬剤師が病棟業務を実施できる時間を確保したことや、医事科との連携による算定漏れ防止体制の構築が、退院時指導件数増加に寄与したと考えられる。また、院外処方推進や再調剤依頼の適正化により調剤業務の効率化が図られ、病棟業務へ人的資源を再配置できたことが、病棟薬剤業務の充実につながったと考えられる。"}], "body_text": "### 目的\n\n2026 年度診療報酬改定では、病棟薬剤業務実施加算に新区分（加算 1）が新設され、退院時薬剤情報管理指導や薬剤総合評価調整の実績が評価対象となった。当院では病棟薬剤業務の充実を目的として業務体制整備を実施したため、その取り組みと成果について報告する。\n\n### 方法\n\n従来、病棟業務はシフト制で運用しており、薬剤師ごとに午前または午後のみ病棟対応を行っていた。そこで（1）全薬剤師が朝礼後 1 時間は病棟業務を実施できる体制へ変更し、退院時薬剤情報管理指導を推進した。（2）退院会計時に退院時薬剤情報管理指導料の算定がない場合、医事科から病棟担当薬剤師へ連絡する体制を構築した。（3）病棟業務へ人的資源を再配置する目的で院外処方せん発行を推進し、院内処方入力時には院外処方への変更を依頼した。（4）一包化再調剤依頼は原則中止とし、必要時のみ病棟担当薬剤師と協議のうえ実施した。2025 年 4 月〜2026 年 2 月の月平均値と 2026 年 4 月実績を比較評価した。\n\n### 結果\n\n退院時薬剤情報管理指導実施率は 13.4％から 66.0％に増加し、薬剤総合評価調整実施率は 3.4％から 3.8％に増加した。加えて再調剤実施率は 7.4％から 4.4％に減少した。\n\n### 考察\n\n病棟薬剤業務実施加算 1 算定に向けた業務体制整備により、退院時薬剤情報管理指導実施率の大幅な向上が認められた。特に、全薬剤師が病棟業務を実施できる時間を確保したことや、医事科との連携による算定漏れ防止体制の構築が、退院時指導件数増加に寄与したと考えられる。また、院外処方推進や再調剤依頼の適正化により調剤業務の効率化が図られ、病棟業務へ人的資源を再配置できたことが、病棟薬剤業務の充実につながったと考えられる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-109-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [417]\nstatus: \"imported\"\n---\n\n# 病棟薬剤業務充実に向けた取り組み\n\n- 演題番号: P2-109-4\n- 演題名: 病棟薬剤業務充実に向けた取り組み\n- 所属施設: NHO 金沢医療センター 薬剤部\n- 筆頭演者: 松下 すみれ（まつした すみれ）\n- 筆頭演者の所属: NHO 金沢医療センター 薬剤部\n- 演者名: 松下 すみれ（まつした すみれ）、 松岡 まりあ（まつおか まりあ）、 安達 尚哉（あだち なおや）、 山本 吉章（やまもと よしあき）、 三井 陽二（みつい ようじ）\n- 原本: [PDF 417ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=417>)\n- 冊子ページ: 661\n\n## 抄録本文\n\n### 目的\n\n2026 年度診療報酬改定では、病棟薬剤業務実施加算に新区分（加算 1）が新設され、退院時薬剤情報管理指導や薬剤総合評価調整の実績が評価対象となった。当院では病棟薬剤業務の充実を目的として業務体制整備を実施したため、その取り組みと成果について報告する。\n\n### 方法\n\n従来、病棟業務はシフト制で運用しており、薬剤師ごとに午前または午後のみ病棟対応を行っていた。そこで（1）全薬剤師が朝礼後 1 時間は病棟業務を実施できる体制へ変更し、退院時薬剤情報管理指導を推進した。（2）退院会計時に退院時薬剤情報管理指導料の算定がない場合、医事科から病棟担当薬剤師へ連絡する体制を構築した。（3）病棟業務へ人的資源を再配置する目的で院外処方せん発行を推進し、院内処方入力時には院外処方への変更を依頼した。（4）一包化再調剤依頼は原則中止とし、必要時のみ病棟担当薬剤師と協議のうえ実施した。2025 年 4 月〜2026 年 2 月の月平均値と 2026 年 4 月実績を比較評価した。\n\n### 結果\n\n退院時薬剤情報管理指導実施率は 13.4％から 66.0％に増加し、薬剤総合評価調整実施率は 3.4％から 3.8％に増加した。加えて再調剤実施率は 7.4％から 4.4％に減少した。\n\n### 考察\n\n病棟薬剤業務実施加算 1 算定に向けた業務体制整備により、退院時薬剤情報管理指導実施率の大幅な向上が認められた。特に、全薬剤師が病棟業務を実施できる時間を確保したことや、医事科との連携による算定漏れ防止体制の構築が、退院時指導件数増加に寄与したと考えられる。また、院外処方推進や再調剤依頼の適正化により調剤業務の効率化が図られ、病棟業務へ人的資源を再配置できたことが、病棟薬剤業務の充実につながったと考えられる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 朝礼後1時間の病棟業務確保など体制を見直し、退院時指導・薬剤調整・再調剤を評価。\n- 退院時指導の増加と再調剤の減少を併せて示す。短期間の比較として、業務配分と継続運用の工夫に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-109-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-109", "session_name": "病棟薬剤業務・ポリファーマシー・業務再設計", "title": "中小病院における薬剤総合評価調整加算算定に向けた体制整備と病棟薬剤業務の充実への取り組み", "authors": "中西 剛志（なかにし たけし） 1、 川俣 洋生（かわまた ようせい） 2、黒 川 綾子（くろかわ あやこ） 3、 西村 尚芳（にしむら なおよし） 1、 古川 和弘（ふるかわ かずひろ） 1、 小薮 真紀子（こやぶ まきこ） 1", "first_author": "中西 剛志（なかにし たけし） 1", "affiliations": "1 NHO 宮崎東病院 薬剤科、2 NHO 肥前精神医療センター 薬剤部、3 NHO 都城医療センター 薬剤部", "first_affiliation": "NHO 宮崎東病院 薬剤科", "printed_pages": "662", "pdf_pages": "418", "features": ["中小病院でスクリーニング基準と記録テンプレートを整備し、薬剤調整と加算算定の体制を構築。", "2か月の介入21件を症状・検査値・転倒リスク等から分類。単なる減薬件数を超えた介入内容の評価が参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "2026 年度診療報酬改定で病棟薬剤業務実施加算 1 の構造が整理され、施設基準にポリファーマシー対策に関わる薬剤総合評価調整加算の算定実績が追加された。当院は薬剤師 4 名で運用する中小病院であり、対策手順が未整備であったため同加算の算定に至っていなかった。そこで今回、ポリファーマシー対策の体制整備を行い、その運用状況を検討した。"}, {"heading": "方法", "content": "対象患者のスクリーニング基準を設定し、カルテ記載を日本老年薬学会提唱の「東大方式」を参考にテンプレート化し、記載負担の軽減を図った。2026 年 3 月導入からの 2 ヶ月間に薬剤調整を行った患者を対象に、介入内容や算定状況を後方視的に調査した。"}, {"heading": "結果", "content": "介入件数は 21 件で算定件数は 12 件、介入薬剤数 51 剤であった。年齢中央値（範囲）は 79（64-100）歳で、服用薬剤数の中央値は入院時 8 剤で退院時は 7 剤であった。介入内容は、症状消失が 21 件（40％）、検査値からの処方適正化 9 件（17％）、転倒リスク 6 件（12％）、その他 16 件（31％）であった。処方変更は中止が 36 件、他剤変更 9件、減量 5 件、追加 1 件であった。"}, {"heading": "考察", "content": "算定件数が介入件数を下回った要因として、6 剤以下の症例や予期せぬ急な退院による算定漏れが挙げられる。また、介入による減薬の一方で入院中に新規治療薬が追加された症例が含まれた為、入院時と退院時の薬剤数中央値には大きな差が認められなかったと考える。今回の取り組みにより、多職種との情報共有や病棟での処方見直しを行う機会につながった。"}, {"heading": "結語", "content": "中小病院でも、テンプレート化と連携強化により、ポリファーマシー対策の体制整備が可能であった。今後は、PDCA サイクルを継続し、算定の安定化と業務効率化を図る予定である。"}], "body_text": "### 目的\n\n2026 年度診療報酬改定で病棟薬剤業務実施加算 1 の構造が整理され、施設基準にポリファーマシー対策に関わる薬剤総合評価調整加算の算定実績が追加された。当院は薬剤師 4 名で運用する中小病院であり、対策手順が未整備であったため同加算の算定に至っていなかった。そこで今回、ポリファーマシー対策の体制整備を行い、その運用状況を検討した。\n\n### 方法\n\n対象患者のスクリーニング基準を設定し、カルテ記載を日本老年薬学会提唱の「東大方式」を参考にテンプレート化し、記載負担の軽減を図った。2026 年 3 月導入からの 2 ヶ月間に薬剤調整を行った患者を対象に、介入内容や算定状況を後方視的に調査した。\n\n### 結果\n\n介入件数は 21 件で算定件数は 12 件、介入薬剤数 51 剤であった。年齢中央値（範囲）は 79（64-100）歳で、服用薬剤数の中央値は入院時 8 剤で退院時は 7 剤であった。介入内容は、症状消失が 21 件（40％）、検査値からの処方適正化 9 件（17％）、転倒リスク 6 件（12％）、その他 16 件（31％）であった。処方変更は中止が 36 件、他剤変更 9件、減量 5 件、追加 1 件であった。\n\n### 考察\n\n算定件数が介入件数を下回った要因として、6 剤以下の症例や予期せぬ急な退院による算定漏れが挙げられる。また、介入による減薬の一方で入院中に新規治療薬が追加された症例が含まれた為、入院時と退院時の薬剤数中央値には大きな差が認められなかったと考える。今回の取り組みにより、多職種との情報共有や病棟での処方見直しを行う機会につながった。\n\n### 結語\n\n中小病院でも、テンプレート化と連携強化により、ポリファーマシー対策の体制整備が可能であった。今後は、PDCA サイクルを継続し、算定の安定化と業務効率化を図る予定である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-109-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [418]\nstatus: \"imported\"\n---\n\n# 中小病院における薬剤総合評価調整加算算定に向けた体制整備と病棟薬剤業務の充実への取り組み\n\n- 演題番号: P2-109-5\n- 演題名: 中小病院における薬剤総合評価調整加算算定に向けた体制整備と病棟薬剤業務の充実への取り組み\n- 所属施設: 1 NHO 宮崎東病院 薬剤科、2 NHO 肥前精神医療センター 薬剤部、3 NHO 都城医療センター 薬剤部\n- 筆頭演者: 中西 剛志（なかにし たけし） 1\n- 筆頭演者の所属: NHO 宮崎東病院 薬剤科\n- 演者名: 中西 剛志（なかにし たけし） 1、 川俣 洋生（かわまた ようせい） 2、黒 川 綾子（くろかわ あやこ） 3、 西村 尚芳（にしむら なおよし） 1、 古川 和弘（ふるかわ かずひろ） 1、 小薮 真紀子（こやぶ まきこ） 1\n- 原本: [PDF 418ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=418>)\n- 冊子ページ: 662\n\n## 抄録本文\n\n### 目的\n\n2026 年度診療報酬改定で病棟薬剤業務実施加算 1 の構造が整理され、施設基準にポリファーマシー対策に関わる薬剤総合評価調整加算の算定実績が追加された。当院は薬剤師 4 名で運用する中小病院であり、対策手順が未整備であったため同加算の算定に至っていなかった。そこで今回、ポリファーマシー対策の体制整備を行い、その運用状況を検討した。\n\n### 方法\n\n対象患者のスクリーニング基準を設定し、カルテ記載を日本老年薬学会提唱の「東大方式」を参考にテンプレート化し、記載負担の軽減を図った。2026 年 3 月導入からの 2 ヶ月間に薬剤調整を行った患者を対象に、介入内容や算定状況を後方視的に調査した。\n\n### 結果\n\n介入件数は 21 件で算定件数は 12 件、介入薬剤数 51 剤であった。年齢中央値（範囲）は 79（64-100）歳で、服用薬剤数の中央値は入院時 8 剤で退院時は 7 剤であった。介入内容は、症状消失が 21 件（40％）、検査値からの処方適正化 9 件（17％）、転倒リスク 6 件（12％）、その他 16 件（31％）であった。処方変更は中止が 36 件、他剤変更 9件、減量 5 件、追加 1 件であった。\n\n### 考察\n\n算定件数が介入件数を下回った要因として、6 剤以下の症例や予期せぬ急な退院による算定漏れが挙げられる。また、介入による減薬の一方で入院中に新規治療薬が追加された症例が含まれた為、入院時と退院時の薬剤数中央値には大きな差が認められなかったと考える。今回の取り組みにより、多職種との情報共有や病棟での処方見直しを行う機会につながった。\n\n### 結語\n\n中小病院でも、テンプレート化と連携強化により、ポリファーマシー対策の体制整備が可能であった。今後は、PDCA サイクルを継続し、算定の安定化と業務効率化を図る予定である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 中小病院でスクリーニング基準と記録テンプレートを整備し、薬剤調整と加算算定の体制を構築。\n- 2か月の介入21件を症状・検査値・転倒リスク等から分類。単なる減薬件数を超えた介入内容の評価が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-109-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-109", "session_name": "病棟薬剤業務・ポリファーマシー・業務再設計", "title": "人員減少下における計画的業務再設計による病棟業務の維持・強化", "authors": "山西 香織（やまにし かおり）、 小原 直紘（おはら なおひろ）、 阿部 正樹（あべ まさき）、畝 佳子（うね よしこ）", "first_author": "山西 香織（やまにし かおり）", "affiliations": "国立研究開発法人 国立循環器病研究センター 薬剤部", "first_affiliation": "国立研究開発法人 国立循環器病研究センター 薬剤部", "printed_pages": "662", "pdf_pages": "418", "features": ["薬剤師不足の中で、外来業務・材料調剤・病棟担当・初回面談をまとめて再設計する実務報告。", "退院指導増加や持参薬報告の前倒しを示す。個別業務の時短だけでなく、配置と機能を組み直す視点が参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "2024 年 4 月、年度内に大幅な人員減少が見込まれる中で運営開始した。従来体制のままでは病棟業務の質と量の維持が困難と予測されたため、欠員数が最多となる年度後半に向けて業務体制を見直し、病棟業務を維持、強化することができたので取り組みとその効果を報告する。"}, {"heading": "方法", "content": "業務の効率化、病棟業務時間の確保、人員配置最適化の視点で業務分析、改善を行った。具体的には外来処方交付方法変更、医療材料等の院内調剤廃止、院外処方箋発行推進を行った。さらに病棟業務体制を固定チーム制から全病棟シームレスに対応する体制へと改変し、初回面談を患者サポートセンターへ集約した。検証には、当センターの月次業務報告、業務記録を用いた。"}, {"heading": "結果", "content": "外来処方を交付する医事カウンター常駐薬剤師の業務内容を整理し病棟業務時間を確保した。医療材料調剤廃止により月約 250 件の業務削減、院外処方箋発行率は 92.5％から 95.5％へ上昇した。チーム制を撤廃、初回面談の患者サポートセンター集約で、持参薬報告時刻は約 1 時間前倒しされた。薬剤師不足数は2024〜25 年度の間に 2〜7 名で推移した。退院指導件数は 2024 年度月平均 158 件から2025 年度月平均 425 件へ増加し、薬剤総合評価調整加算の算定を開始した。"}, {"heading": "考察", "content": "計画的、多面的に業務再設計を行うことで、最大 7 名の欠員下においても病棟業務の維持・強化が可能であった。特に、病棟業務の体制変更は人員配置最適化に大きく寄与し、退院指導件数増加に繋がったと考える。この実績をもって、2026 年 6 月より病棟薬剤業務実施加算 1の算定基準を満たし、年間約 5200 万円の増収が期待される。"}], "body_text": "### 目的\n\n2024 年 4 月、年度内に大幅な人員減少が見込まれる中で運営開始した。従来体制のままでは病棟業務の質と量の維持が困難と予測されたため、欠員数が最多となる年度後半に向けて業務体制を見直し、病棟業務を維持、強化することができたので取り組みとその効果を報告する。\n\n### 方法\n\n業務の効率化、病棟業務時間の確保、人員配置最適化の視点で業務分析、改善を行った。具体的には外来処方交付方法変更、医療材料等の院内調剤廃止、院外処方箋発行推進を行った。さらに病棟業務体制を固定チーム制から全病棟シームレスに対応する体制へと改変し、初回面談を患者サポートセンターへ集約した。検証には、当センターの月次業務報告、業務記録を用いた。\n\n### 結果\n\n外来処方を交付する医事カウンター常駐薬剤師の業務内容を整理し病棟業務時間を確保した。医療材料調剤廃止により月約 250 件の業務削減、院外処方箋発行率は 92.5％から 95.5％へ上昇した。チーム制を撤廃、初回面談の患者サポートセンター集約で、持参薬報告時刻は約 1 時間前倒しされた。薬剤師不足数は2024〜25 年度の間に 2〜7 名で推移した。退院指導件数は 2024 年度月平均 158 件から2025 年度月平均 425 件へ増加し、薬剤総合評価調整加算の算定を開始した。\n\n### 考察\n\n計画的、多面的に業務再設計を行うことで、最大 7 名の欠員下においても病棟業務の維持・強化が可能であった。特に、病棟業務の体制変更は人員配置最適化に大きく寄与し、退院指導件数増加に繋がったと考える。この実績をもって、2026 年 6 月より病棟薬剤業務実施加算 1の算定基準を満たし、年間約 5200 万円の増収が期待される。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-109-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [418]\nstatus: \"imported\"\n---\n\n# 人員減少下における計画的業務再設計による病棟業務の維持・強化\n\n- 演題番号: P2-109-6\n- 演題名: 人員減少下における計画的業務再設計による病棟業務の維持・強化\n- 所属施設: 国立研究開発法人 国立循環器病研究センター 薬剤部\n- 筆頭演者: 山西 香織（やまにし かおり）\n- 筆頭演者の所属: 国立研究開発法人 国立循環器病研究センター 薬剤部\n- 演者名: 山西 香織（やまにし かおり）、 小原 直紘（おはら なおひろ）、 阿部 正樹（あべ まさき）、畝 佳子（うね よしこ）\n- 原本: [PDF 418ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=418>)\n- 冊子ページ: 662\n\n## 抄録本文\n\n### 目的\n\n2024 年 4 月、年度内に大幅な人員減少が見込まれる中で運営開始した。従来体制のままでは病棟業務の質と量の維持が困難と予測されたため、欠員数が最多となる年度後半に向けて業務体制を見直し、病棟業務を維持、強化することができたので取り組みとその効果を報告する。\n\n### 方法\n\n業務の効率化、病棟業務時間の確保、人員配置最適化の視点で業務分析、改善を行った。具体的には外来処方交付方法変更、医療材料等の院内調剤廃止、院外処方箋発行推進を行った。さらに病棟業務体制を固定チーム制から全病棟シームレスに対応する体制へと改変し、初回面談を患者サポートセンターへ集約した。検証には、当センターの月次業務報告、業務記録を用いた。\n\n### 結果\n\n外来処方を交付する医事カウンター常駐薬剤師の業務内容を整理し病棟業務時間を確保した。医療材料調剤廃止により月約 250 件の業務削減、院外処方箋発行率は 92.5％から 95.5％へ上昇した。チーム制を撤廃、初回面談の患者サポートセンター集約で、持参薬報告時刻は約 1 時間前倒しされた。薬剤師不足数は2024〜25 年度の間に 2〜7 名で推移した。退院指導件数は 2024 年度月平均 158 件から2025 年度月平均 425 件へ増加し、薬剤総合評価調整加算の算定を開始した。\n\n### 考察\n\n計画的、多面的に業務再設計を行うことで、最大 7 名の欠員下においても病棟業務の維持・強化が可能であった。特に、病棟業務の体制変更は人員配置最適化に大きく寄与し、退院指導件数増加に繋がったと考える。この実績をもって、2026 年 6 月より病棟薬剤業務実施加算 1の算定基準を満たし、年間約 5200 万円の増収が期待される。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 薬剤師不足の中で、外来業務・材料調剤・病棟担当・初回面談をまとめて再設計する実務報告。\n- 退院指導増加や持参薬報告の前倒しを示す。個別業務の時短だけでなく、配置と機能を組み直す視点が参考となる。\n\n", "rec_grade": "A", "rec_perspective": "業務再設計・加算1達成", "rec_reason": "最大7名の薬剤師欠員下で、医療材料調剤廃止・チーム制から全病棟シームレス体制への転換・初回面談集約を断行。退院指導を月158→425件へ倍増させ、病棟薬剤業務実施加算1達成（年5,200万円増収見込）へ繋げた圧巻のマネジメント。"}, {"id": "P2-109-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-109", "session_name": "病棟薬剤業務・ポリファーマシー・業務再設計", "title": "術前休薬確認業務の人的資源視点から見た費用対効果の検討（第 2 報）―業務量増加下における経時的評価―", "authors": "奥 沙耶佳（おく さやか）、 小井土 啓一（こいど けいいち）、 関口 華乃（せきぐち かの）、市 川 暁（いちかわ さとる）、 秋元 朝行（あきもと ともゆき）", "first_author": "奥 沙耶佳（おく さやか）", "affiliations": "NHO 横浜医療センター 薬剤部", "first_affiliation": "NHO 横浜医療センター 薬剤部", "printed_pages": "662", "pdf_pages": "418", "features": ["術前休薬確認の所要時間を、対象薬と医師指示の有無で分け、人的資源の観点から評価。", "指示漏れのある群ほど時間を要し、1件発見当たり延べ91分と報告。業務量増加時の人員配置や優先順位を考えられる。"], "issues": [], "sections": [{"heading": "背景", "content": "術前休薬の適切な確認は、出血・血栓症等の周術期合併症予防に必要かつ重要である。横浜医療センターでは入退院支援センター（PCC）にて薬剤師が術前休薬確認を実施しているが、要確認事案の多くは「指示漏れ」であり、必ずしも専門的判断を要するものばかりではない。我々は第 78 回国立病院総合医学会において本業務の費用対効果を報告した。"}, {"heading": "目的", "content": "業務量が増加した状況下において、術前休薬確認業務の費用対効果指標を再評価し、前回調査（2023 年 10 月）との比較を行うこと。"}, {"heading": "方法", "content": "2025 年 9 月 29 日〜10 月 31 日の期間に PCC で術前休薬確認を行った全事例を対象に、その業務に係る所要時間を測定した。診療科、休薬対象薬の有無・種類、医師への指示確認有無を調査した。所要時間の群間比較は Steel-Dwass 法を用い、P ＜ 0.05 を有意とした。"}, {"heading": "結果", "content": "対象患者 163 名（2024 年 109 名）、対象薬を含む患者 54 名、指示漏れ 23 件であった。所用時間は、対象薬あり/指示なし群が中央値 20 分［範囲：10-41］、対象薬あり/指示あり群が 15 分［5-40］、対象薬なし群が 10 分［5-20］で、3 群間に有意差を認めた（P ＜ 0.001）。薬剤数と所要時間の間に相関性は認めなかった（R=0.184）。指示漏れ 1 件発見あたりののべ業務時間は 91 分であった。"}, {"heading": "考察", "content": "業務量が約 1.5 倍に増加した状況下においても、対象薬の有無による所要時間差および薬剤数と所要時間の無相関といった前回示された構造は再現された。本業務において専門的判断を要する事案は限定的であり、手順書で対応可能な範囲は広い。業務量増加局面では、ノンメディカルスタッフへの業務シフトを含めた体制設計などの検討が考えられる。"}], "body_text": "### 背景\n\n術前休薬の適切な確認は、出血・血栓症等の周術期合併症予防に必要かつ重要である。横浜医療センターでは入退院支援センター（PCC）にて薬剤師が術前休薬確認を実施しているが、要確認事案の多くは「指示漏れ」であり、必ずしも専門的判断を要するものばかりではない。我々は第 78 回国立病院総合医学会において本業務の費用対効果を報告した。\n\n### 目的\n\n業務量が増加した状況下において、術前休薬確認業務の費用対効果指標を再評価し、前回調査（2023 年 10 月）との比較を行うこと。\n\n### 方法\n\n2025 年 9 月 29 日〜10 月 31 日の期間に PCC で術前休薬確認を行った全事例を対象に、その業務に係る所要時間を測定した。診療科、休薬対象薬の有無・種類、医師への指示確認有無を調査した。所要時間の群間比較は Steel-Dwass 法を用い、P ＜ 0.05 を有意とした。\n\n### 結果\n\n対象患者 163 名（2024 年 109 名）、対象薬を含む患者 54 名、指示漏れ 23 件であった。所用時間は、対象薬あり/指示なし群が中央値 20 分［範囲：10-41］、対象薬あり/指示あり群が 15 分［5-40］、対象薬なし群が 10 分［5-20］で、3 群間に有意差を認めた（P ＜ 0.001）。薬剤数と所要時間の間に相関性は認めなかった（R=0.184）。指示漏れ 1 件発見あたりののべ業務時間は 91 分であった。\n\n### 考察\n\n業務量が約 1.5 倍に増加した状況下においても、対象薬の有無による所要時間差および薬剤数と所要時間の無相関といった前回示された構造は再現された。本業務において専門的判断を要する事案は限定的であり、手順書で対応可能な範囲は広い。業務量増加局面では、ノンメディカルスタッフへの業務シフトを含めた体制設計などの検討が考えられる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-109-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [418]\nstatus: \"imported\"\n---\n\n# 術前休薬確認業務の人的資源視点から見た費用対効果の検討（第 2 報）―業務量増加下における経時的評価―\n\n- 演題番号: P2-109-7\n- 演題名: 術前休薬確認業務の人的資源視点から見た費用対効果の検討（第 2 報）―業務量増加下における経時的評価―\n- 所属施設: NHO 横浜医療センター 薬剤部\n- 筆頭演者: 奥 沙耶佳（おく さやか）\n- 筆頭演者の所属: NHO 横浜医療センター 薬剤部\n- 演者名: 奥 沙耶佳（おく さやか）、 小井土 啓一（こいど けいいち）、 関口 華乃（せきぐち かの）、市 川 暁（いちかわ さとる）、 秋元 朝行（あきもと ともゆき）\n- 原本: [PDF 418ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=418>)\n- 冊子ページ: 662\n\n## 抄録本文\n\n### 背景\n\n術前休薬の適切な確認は、出血・血栓症等の周術期合併症予防に必要かつ重要である。横浜医療センターでは入退院支援センター（PCC）にて薬剤師が術前休薬確認を実施しているが、要確認事案の多くは「指示漏れ」であり、必ずしも専門的判断を要するものばかりではない。我々は第 78 回国立病院総合医学会において本業務の費用対効果を報告した。\n\n### 目的\n\n業務量が増加した状況下において、術前休薬確認業務の費用対効果指標を再評価し、前回調査（2023 年 10 月）との比較を行うこと。\n\n### 方法\n\n2025 年 9 月 29 日〜10 月 31 日の期間に PCC で術前休薬確認を行った全事例を対象に、その業務に係る所要時間を測定した。診療科、休薬対象薬の有無・種類、医師への指示確認有無を調査した。所要時間の群間比較は Steel-Dwass 法を用い、P ＜ 0.05 を有意とした。\n\n### 結果\n\n対象患者 163 名（2024 年 109 名）、対象薬を含む患者 54 名、指示漏れ 23 件であった。所用時間は、対象薬あり/指示なし群が中央値 20 分［範囲：10-41］、対象薬あり/指示あり群が 15 分［5-40］、対象薬なし群が 10 分［5-20］で、3 群間に有意差を認めた（P ＜ 0.001）。薬剤数と所要時間の間に相関性は認めなかった（R=0.184）。指示漏れ 1 件発見あたりののべ業務時間は 91 分であった。\n\n### 考察\n\n業務量が約 1.5 倍に増加した状況下においても、対象薬の有無による所要時間差および薬剤数と所要時間の無相関といった前回示された構造は再現された。本業務において専門的判断を要する事案は限定的であり、手順書で対応可能な範囲は広い。業務量増加局面では、ノンメディカルスタッフへの業務シフトを含めた体制設計などの検討が考えられる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 術前休薬確認の所要時間を、対象薬と医師指示の有無で分け、人的資源の観点から評価。\n- 指示漏れのある群ほど時間を要し、1件発見当たり延べ91分と報告。業務量増加時の人員配置や優先順位を考えられる。\n\n", "rec_grade": "B", "rec_perspective": "人的資源評価・タスクシフト", "rec_reason": "入退院支援センターでの術前休薬確認163名の所要時間を群間比較（Steel-Dwass法）し、指示漏れ1件発見あたり延べ91分を要することを定量化。非薬剤師シフトの根拠を与える研究。"}, {"id": "P2-109-8", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-109", "session_name": "病棟薬剤業務・ポリファーマシー・業務再設計", "title": "嬉野医療センターにおける入院前の患者への薬剤師の関わりについて", "authors": "東島 幸道（ひがしじま こうどう） 1、 永江 一徳（ながえ かずのり） 1、 水町 裕子（みずまち ひろこ） 2、 福田 隆恵（ふくだ たかえ） 2、鈴 田 浩孝（すずた ひろたか） 1", "first_author": "東島 幸道（ひがしじま こうどう） 1", "affiliations": "1 NHO 嬉野医療センター 薬剤部、2 NHO 嬉野医療センター 地域医療連携室", "first_affiliation": "NHO 嬉野医療センター 薬剤部", "printed_pages": "662", "pdf_pages": "418", "features": ["入院前の薬剤師面談を病棟と連携し、一包化対応や薬剤画像提示を含む休薬支援を整理。", "延べ1,815人の入院支援から対象208人を抽出。休薬の説明に加え、副作用・アレルギー歴を拾う機会として参考となる。"], "issues": [], "sections": [{"heading": "緒言", "content": "近年、入院予定患者に対する入院前支援の重要性が高まっており、薬物療法の安全性確保の観点から薬剤師の介入が求められている。しかし嬉野医療センター（以下当院）薬剤部では人員不足からその介入は行えていなかった。"}, {"heading": "目的", "content": "2025 年 10 月より入院予定の患者に対して薬剤師が関与する体制を構築したので、その取り組み内容の報告を目的とした。"}, {"heading": "方法", "content": "入院前から休薬指示のある入院予定患者を対象に入院支援センターにて薬剤師が休薬の説明を行い、病棟担当薬剤師と情報共有した。2025 年 10 月から 2026 年 3 月を集計期間とし、面談時および入院中の介入状況を検討した。"}, {"heading": "結果", "content": "入院支援センターにて対応した患者は延べ 1815 人、そのうち休薬指示のあった患者は延べ 208 人、薬剤師が介入できた患者は延べ 172 人であった。主な介入内容は一包化への対応（74 件）、休止薬剤の画像提示（17 件）、アドヒアランスへの介入（14 件）であった。休薬の主な目的は手術（151 件）、検査（42 件）であり、主な休止薬は抗血栓薬（137 件）、糖尿病治療薬（114 件）であった。指示通り休薬できていた症例は 171 件であり、入院中に薬剤師が介入した症例は 135件であった。また、休薬指示の漏れを主治医へ確認することで手術延期の回避につながった症例や、副作用歴やアレルギー歴の新規確認ができた症例も認められた。"}, {"heading": "考察", "content": "入院前の薬剤師による休薬の説明は、患者に休薬指示が適切に伝わることで入院目的の安全かつ円滑な達成に寄与できると考える。また副次的な効果も期待できることから、今後は対象患者の拡大や介入効果を定量的に評価し、より質の高い入院前薬剤支援体制の確立を目指したい。"}], "body_text": "### 緒言\n\n近年、入院予定患者に対する入院前支援の重要性が高まっており、薬物療法の安全性確保の観点から薬剤師の介入が求められている。しかし嬉野医療センター（以下当院）薬剤部では人員不足からその介入は行えていなかった。\n\n### 目的\n\n2025 年 10 月より入院予定の患者に対して薬剤師が関与する体制を構築したので、その取り組み内容の報告を目的とした。\n\n### 方法\n\n入院前から休薬指示のある入院予定患者を対象に入院支援センターにて薬剤師が休薬の説明を行い、病棟担当薬剤師と情報共有した。2025 年 10 月から 2026 年 3 月を集計期間とし、面談時および入院中の介入状況を検討した。\n\n### 結果\n\n入院支援センターにて対応した患者は延べ 1815 人、そのうち休薬指示のあった患者は延べ 208 人、薬剤師が介入できた患者は延べ 172 人であった。主な介入内容は一包化への対応（74 件）、休止薬剤の画像提示（17 件）、アドヒアランスへの介入（14 件）であった。休薬の主な目的は手術（151 件）、検査（42 件）であり、主な休止薬は抗血栓薬（137 件）、糖尿病治療薬（114 件）であった。指示通り休薬できていた症例は 171 件であり、入院中に薬剤師が介入した症例は 135件であった。また、休薬指示の漏れを主治医へ確認することで手術延期の回避につながった症例や、副作用歴やアレルギー歴の新規確認ができた症例も認められた。\n\n### 考察\n\n入院前の薬剤師による休薬の説明は、患者に休薬指示が適切に伝わることで入院目的の安全かつ円滑な達成に寄与できると考える。また副次的な効果も期待できることから、今後は対象患者の拡大や介入効果を定量的に評価し、より質の高い入院前薬剤支援体制の確立を目指したい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-109-8\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [418]\nstatus: \"imported\"\n---\n\n# 嬉野医療センターにおける入院前の患者への薬剤師の関わりについて\n\n- 演題番号: P2-109-8\n- 演題名: 嬉野医療センターにおける入院前の患者への薬剤師の関わりについて\n- 所属施設: 1 NHO 嬉野医療センター 薬剤部、2 NHO 嬉野医療センター 地域医療連携室\n- 筆頭演者: 東島 幸道（ひがしじま こうどう） 1\n- 筆頭演者の所属: NHO 嬉野医療センター 薬剤部\n- 演者名: 東島 幸道（ひがしじま こうどう） 1、 永江 一徳（ながえ かずのり） 1、 水町 裕子（みずまち ひろこ） 2、 福田 隆恵（ふくだ たかえ） 2、鈴 田 浩孝（すずた ひろたか） 1\n- 原本: [PDF 418ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=418>)\n- 冊子ページ: 662\n\n## 抄録本文\n\n### 緒言\n\n近年、入院予定患者に対する入院前支援の重要性が高まっており、薬物療法の安全性確保の観点から薬剤師の介入が求められている。しかし嬉野医療センター（以下当院）薬剤部では人員不足からその介入は行えていなかった。\n\n### 目的\n\n2025 年 10 月より入院予定の患者に対して薬剤師が関与する体制を構築したので、その取り組み内容の報告を目的とした。\n\n### 方法\n\n入院前から休薬指示のある入院予定患者を対象に入院支援センターにて薬剤師が休薬の説明を行い、病棟担当薬剤師と情報共有した。2025 年 10 月から 2026 年 3 月を集計期間とし、面談時および入院中の介入状況を検討した。\n\n### 結果\n\n入院支援センターにて対応した患者は延べ 1815 人、そのうち休薬指示のあった患者は延べ 208 人、薬剤師が介入できた患者は延べ 172 人であった。主な介入内容は一包化への対応（74 件）、休止薬剤の画像提示（17 件）、アドヒアランスへの介入（14 件）であった。休薬の主な目的は手術（151 件）、検査（42 件）であり、主な休止薬は抗血栓薬（137 件）、糖尿病治療薬（114 件）であった。指示通り休薬できていた症例は 171 件であり、入院中に薬剤師が介入した症例は 135件であった。また、休薬指示の漏れを主治医へ確認することで手術延期の回避につながった症例や、副作用歴やアレルギー歴の新規確認ができた症例も認められた。\n\n### 考察\n\n入院前の薬剤師による休薬の説明は、患者に休薬指示が適切に伝わることで入院目的の安全かつ円滑な達成に寄与できると考える。また副次的な効果も期待できることから、今後は対象患者の拡大や介入効果を定量的に評価し、より質の高い入院前薬剤支援体制の確立を目指したい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 入院前の薬剤師面談を病棟と連携し、一包化対応や薬剤画像提示を含む休薬支援を整理。\n- 延べ1,815人の入院支援から対象208人を抽出。休薬の説明に加え、副作用・アレルギー歴を拾う機会として参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-109-9", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-109", "session_name": "病棟薬剤業務・ポリファーマシー・業務再設計", "title": "地域薬剤師のための持続可能なオンラインセミナー：「戸塚原宿レジメンカフェ」4 年間の評価", "authors": "小井土 啓一（こいど けいいち） 1、 山田 みなみ（やまだ みなみ） 1、 松田 悟郎（まつだ ごろう） 2、 秋元 朝行（あきもと ともゆき） 1", "first_author": "小井土 啓一（こいど けいいち） 1", "affiliations": "1 NHO 横浜医療センター 薬剤部、2 NHO 横浜医療センター 外科", "first_affiliation": "NHO 横浜医療センター 薬剤部", "printed_pages": "663", "pdf_pages": "419", "features": ["地域向けオンラインセミナー30回を、満足度に加え実参加者・再参加・年度間継続で評価。", "全体の高評価と若手の継続率の低さを併記。継続しやすい内容・開催方法や対象層別の支援設計に注目したい。"], "issues": [], "sections": [{"heading": "背景", "content": "外来腫瘍化学療法診療料連携充実加算の施設基準として保険薬局向け研修会の実施が求められている。横浜医療センターでは 2020 年からがん専門薬剤師が中心となってオンラインセミナー「戸塚原宿レジメンカフェ（R-Cafe）」を年間 8-10 回開催している。"}, {"heading": "目的", "content": "5 年間の R-Cafe 実績を通じて教育的効果・参加継続性・参加者構造を評価し、持続可能な教育モデルとしての有用性を検討する。"}, {"heading": "方法", "content": "2022 年 4 月-2025 年 8 月に開催した 30 回分の事後アンケートを分析した。受講者が回答した満足度・理解度（5 段階評価）を評価し、薬剤師免許証番号を用いて実参加者数・リピート率・年度間継続率を追跡した。薬剤師免許番号帯をキャリアステージの代替指標として、番号帯別の傾向を評価した。自由記載は Janome による形態素解析により分類した。"}, {"heading": "結果", "content": "延べ回答 1,232 件、実参加者 326 名、複数回参加者 161 名（49.4％）であった。5 回以上のコア参加者は 78 名（23.9％）、うち 10 回以上は 36 名（11.0％）であった。満足度 4.25±0.80（mean±SD）、理解度 3.57±0.94 で全 30 回で満足度 4.0 以上を維持した。年度間参加継続率は 2022→2023 年度：50.0％、2023→2024 年度：48.1％、2024→2025 年度：28.5％であった。薬剤師免許番号 40 万未満（中堅以上）が延べ回答の63.2％を占め、平均参加回数は 5 回以上であった。若手層（50 万番台）の年度間継続率は17-33％と全体を下回った。"}, {"heading": "結論", "content": "地域のがん診療病院であっても持続可能な教育モデルの構築が可能であった。その要因として高い満足度とコア参加者層の形成が考えられる。今後の課題としては若手層の継続率向上が挙げられる。"}], "body_text": "### 背景\n\n外来腫瘍化学療法診療料連携充実加算の施設基準として保険薬局向け研修会の実施が求められている。横浜医療センターでは 2020 年からがん専門薬剤師が中心となってオンラインセミナー「戸塚原宿レジメンカフェ（R-Cafe）」を年間 8-10 回開催している。\n\n### 目的\n\n5 年間の R-Cafe 実績を通じて教育的効果・参加継続性・参加者構造を評価し、持続可能な教育モデルとしての有用性を検討する。\n\n### 方法\n\n2022 年 4 月-2025 年 8 月に開催した 30 回分の事後アンケートを分析した。受講者が回答した満足度・理解度（5 段階評価）を評価し、薬剤師免許証番号を用いて実参加者数・リピート率・年度間継続率を追跡した。薬剤師免許番号帯をキャリアステージの代替指標として、番号帯別の傾向を評価した。自由記載は Janome による形態素解析により分類した。\n\n### 結果\n\n延べ回答 1,232 件、実参加者 326 名、複数回参加者 161 名（49.4％）であった。5 回以上のコア参加者は 78 名（23.9％）、うち 10 回以上は 36 名（11.0％）であった。満足度 4.25±0.80（mean±SD）、理解度 3.57±0.94 で全 30 回で満足度 4.0 以上を維持した。年度間参加継続率は 2022→2023 年度：50.0％、2023→2024 年度：48.1％、2024→2025 年度：28.5％であった。薬剤師免許番号 40 万未満（中堅以上）が延べ回答の63.2％を占め、平均参加回数は 5 回以上であった。若手層（50 万番台）の年度間継続率は17-33％と全体を下回った。\n\n### 結論\n\n地域のがん診療病院であっても持続可能な教育モデルの構築が可能であった。その要因として高い満足度とコア参加者層の形成が考えられる。今後の課題としては若手層の継続率向上が挙げられる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-109-9\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [419]\nstatus: \"imported\"\n---\n\n# 地域薬剤師のための持続可能なオンラインセミナー：「戸塚原宿レジメンカフェ」4 年間の評価\n\n- 演題番号: P2-109-9\n- 演題名: 地域薬剤師のための持続可能なオンラインセミナー：「戸塚原宿レジメンカフェ」4 年間の評価\n- 所属施設: 1 NHO 横浜医療センター 薬剤部、2 NHO 横浜医療センター 外科\n- 筆頭演者: 小井土 啓一（こいど けいいち） 1\n- 筆頭演者の所属: NHO 横浜医療センター 薬剤部\n- 演者名: 小井土 啓一（こいど けいいち） 1、 山田 みなみ（やまだ みなみ） 1、 松田 悟郎（まつだ ごろう） 2、 秋元 朝行（あきもと ともゆき） 1\n- 原本: [PDF 419ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=419>)\n- 冊子ページ: 663\n\n## 抄録本文\n\n### 背景\n\n外来腫瘍化学療法診療料連携充実加算の施設基準として保険薬局向け研修会の実施が求められている。横浜医療センターでは 2020 年からがん専門薬剤師が中心となってオンラインセミナー「戸塚原宿レジメンカフェ（R-Cafe）」を年間 8-10 回開催している。\n\n### 目的\n\n5 年間の R-Cafe 実績を通じて教育的効果・参加継続性・参加者構造を評価し、持続可能な教育モデルとしての有用性を検討する。\n\n### 方法\n\n2022 年 4 月-2025 年 8 月に開催した 30 回分の事後アンケートを分析した。受講者が回答した満足度・理解度（5 段階評価）を評価し、薬剤師免許証番号を用いて実参加者数・リピート率・年度間継続率を追跡した。薬剤師免許番号帯をキャリアステージの代替指標として、番号帯別の傾向を評価した。自由記載は Janome による形態素解析により分類した。\n\n### 結果\n\n延べ回答 1,232 件、実参加者 326 名、複数回参加者 161 名（49.4％）であった。5 回以上のコア参加者は 78 名（23.9％）、うち 10 回以上は 36 名（11.0％）であった。満足度 4.25±0.80（mean±SD）、理解度 3.57±0.94 で全 30 回で満足度 4.0 以上を維持した。年度間参加継続率は 2022→2023 年度：50.0％、2023→2024 年度：48.1％、2024→2025 年度：28.5％であった。薬剤師免許番号 40 万未満（中堅以上）が延べ回答の63.2％を占め、平均参加回数は 5 回以上であった。若手層（50 万番台）の年度間継続率は17-33％と全体を下回った。\n\n### 結論\n\n地域のがん診療病院であっても持続可能な教育モデルの構築が可能であった。その要因として高い満足度とコア参加者層の形成が考えられる。今後の課題としては若手層の継続率向上が挙げられる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 地域向けオンラインセミナー30回を、満足度に加え実参加者・再参加・年度間継続で評価。\n- 全体の高評価と若手の継続率の低さを併記。継続しやすい内容・開催方法や対象層別の支援設計に注目したい。\n\n", "rec_grade": "A", "rec_perspective": "薬薬連携教育・継続性解析", "rec_reason": "全30回・延べ1,232件の参加者を薬剤師免許証番号で縦断追跡し、リピート率49.4%・キャリア帯別の年度間継続率と形態素解析を実施。連携充実加算研修会のマンネリ化打破と若手定着に向けた示唆が深い。"}, {"id": "P2-122-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-122", "session_name": "調剤自動化機器（散薬分包機・PTP払出機）", "title": "全自動秤量散薬分包機（Di-32 Ⓡ）導入までの流れと現状について", "authors": "江川 友子（えがわ ゆうこ）、 齊田 翌美（さいた あすみ）、林 佳奈子（はやし かなこ）、 山崎 貴史（やまさき たかふみ）、 今田 美里（いまだ みさと）、 大久保 博史（おおくぼ ひろし）", "first_author": "江川 友子（えがわ ゆうこ）", "affiliations": "NHO 東佐賀病院 薬剤部", "first_affiliation": "NHO 東佐賀病院 薬剤部", "printed_pages": "691", "pdf_pages": "447", "features": ["散薬ロボット導入時のカセット選定・マスタ整備・助手への移管・剤形変更を一連の手順として提示。", "従来機使用時間は約7割減る一方、対人業務時間は大きく変化しない。省力化を臨床業務へ結び付ける条件が論点となる。"], "issues": [], "sections": [{"heading": "目的", "content": "当院は重症心身障害児（者）（以下、重症児（者））病床 165 床を有し、セーフティネット医療を担う医療機関である。重症児（者）への処方はポリファーマシーかつ経管投与に伴う散薬が多く、調剤業務が勤務シフトの 4-5 割を占めるため、対人業務時間の確保が課題であった。そこで業務効率化を目的に、2025 年 11 月より全自動秤量散薬分包機（以下、散薬ロボット）を導入した。今回、導入までの流れと現状について報告する。"}, {"heading": "方法", "content": "2025年 9 月より散薬ロボット導入に伴い、実装薬品カセットの選定、医薬品マスタ整備、散薬調剤手順及び重症児（者）定期処方の見直し等を行うこととした。また、散薬ロボット導入が対人業務の時間確保に有用であったか評価するため、導入前後における重症児（者）散薬調剤に係る時間、対人業務時間の集計を行った。"}, {"heading": "結果", "content": "1）物性や処方数量等に基づき実装薬品カセット 40 品目を選定、2）散薬ロボットと部門システムが共に TOSHO のため医薬品マスタを流用、3）散薬調剤手順は、散薬分包品の回収を調剤助手へ移行、4）散薬から錠剤への剤型変更の推進、5）散薬ロボット導入により従来機の使用時間は約 7 割減少、対人業務時間は大きな変化がみられないという結果であった。"}, {"heading": "考察", "content": "散薬ロボット導入により調剤時間の短縮には寄与したものの、秤量・分包誤差といった新たなリスクも生じており、効率性のみならず安全性を担保した業務手順の再構築が不可欠である。また、対人業務時間の確保については、導入後 3 ヵ月間のデータであったことより、現時点のデータでは対人業務時間が増加したと結論付けられなかったため引き続きデータ収集し評価予定である。"}], "body_text": "### 目的\n\n当院は重症心身障害児（者）（以下、重症児（者））病床 165 床を有し、セーフティネット医療を担う医療機関である。重症児（者）への処方はポリファーマシーかつ経管投与に伴う散薬が多く、調剤業務が勤務シフトの 4-5 割を占めるため、対人業務時間の確保が課題であった。そこで業務効率化を目的に、2025 年 11 月より全自動秤量散薬分包機（以下、散薬ロボット）を導入した。今回、導入までの流れと現状について報告する。\n\n### 方法\n\n2025年 9 月より散薬ロボット導入に伴い、実装薬品カセットの選定、医薬品マスタ整備、散薬調剤手順及び重症児（者）定期処方の見直し等を行うこととした。また、散薬ロボット導入が対人業務の時間確保に有用であったか評価するため、導入前後における重症児（者）散薬調剤に係る時間、対人業務時間の集計を行った。\n\n### 結果\n\n1）物性や処方数量等に基づき実装薬品カセット 40 品目を選定、2）散薬ロボットと部門システムが共に TOSHO のため医薬品マスタを流用、3）散薬調剤手順は、散薬分包品の回収を調剤助手へ移行、4）散薬から錠剤への剤型変更の推進、5）散薬ロボット導入により従来機の使用時間は約 7 割減少、対人業務時間は大きな変化がみられないという結果であった。\n\n### 考察\n\n散薬ロボット導入により調剤時間の短縮には寄与したものの、秤量・分包誤差といった新たなリスクも生じており、効率性のみならず安全性を担保した業務手順の再構築が不可欠である。また、対人業務時間の確保については、導入後 3 ヵ月間のデータであったことより、現時点のデータでは対人業務時間が増加したと結論付けられなかったため引き続きデータ収集し評価予定である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-122-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [447]\nstatus: \"imported\"\n---\n\n# 全自動秤量散薬分包機（Di-32 Ⓡ）導入までの流れと現状について\n\n- 演題番号: P2-122-2\n- 演題名: 全自動秤量散薬分包機（Di-32 Ⓡ）導入までの流れと現状について\n- 所属施設: NHO 東佐賀病院 薬剤部\n- 筆頭演者: 江川 友子（えがわ ゆうこ）\n- 筆頭演者の所属: NHO 東佐賀病院 薬剤部\n- 演者名: 江川 友子（えがわ ゆうこ）、 齊田 翌美（さいた あすみ）、林 佳奈子（はやし かなこ）、 山崎 貴史（やまさき たかふみ）、 今田 美里（いまだ みさと）、 大久保 博史（おおくぼ ひろし）\n- 原本: [PDF 447ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=447>)\n- 冊子ページ: 691\n\n## 抄録本文\n\n### 目的\n\n当院は重症心身障害児（者）（以下、重症児（者））病床 165 床を有し、セーフティネット医療を担う医療機関である。重症児（者）への処方はポリファーマシーかつ経管投与に伴う散薬が多く、調剤業務が勤務シフトの 4-5 割を占めるため、対人業務時間の確保が課題であった。そこで業務効率化を目的に、2025 年 11 月より全自動秤量散薬分包機（以下、散薬ロボット）を導入した。今回、導入までの流れと現状について報告する。\n\n### 方法\n\n2025年 9 月より散薬ロボット導入に伴い、実装薬品カセットの選定、医薬品マスタ整備、散薬調剤手順及び重症児（者）定期処方の見直し等を行うこととした。また、散薬ロボット導入が対人業務の時間確保に有用であったか評価するため、導入前後における重症児（者）散薬調剤に係る時間、対人業務時間の集計を行った。\n\n### 結果\n\n1）物性や処方数量等に基づき実装薬品カセット 40 品目を選定、2）散薬ロボットと部門システムが共に TOSHO のため医薬品マスタを流用、3）散薬調剤手順は、散薬分包品の回収を調剤助手へ移行、4）散薬から錠剤への剤型変更の推進、5）散薬ロボット導入により従来機の使用時間は約 7 割減少、対人業務時間は大きな変化がみられないという結果であった。\n\n### 考察\n\n散薬ロボット導入により調剤時間の短縮には寄与したものの、秤量・分包誤差といった新たなリスクも生じており、効率性のみならず安全性を担保した業務手順の再構築が不可欠である。また、対人業務時間の確保については、導入後 3 ヵ月間のデータであったことより、現時点のデータでは対人業務時間が増加したと結論付けられなかったため引き続きデータ収集し評価予定である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 散薬ロボット導入時のカセット選定・マスタ整備・助手への移管・剤形変更を一連の手順として提示。\n- 従来機使用時間は約7割減る一方、対人業務時間は大きく変化しない。省力化を臨床業務へ結び付ける条件が論点となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-122-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-122", "session_name": "調剤自動化機器（散薬分包機・PTP払出機）", "title": "全自動 PTP シート払出装置導入が薬剤師業務に与える影響", "authors": "佐々木 健将（ささき けんしょう）、 宮部 貴識（みやべ たかし）、水 津 智樹（すいず ともき）、 千崎 宏樹（せんざき ひろき）", "first_author": "佐々木 健将（ささき けんしょう）", "affiliations": "NHO 大阪刀根山医療センター 薬剤科", "first_affiliation": "NHO 大阪刀根山医療センター 薬剤科", "printed_pages": "691", "pdf_pages": "447", "features": ["PTPシート払出装置の導入を、調剤エラー・指導件数・薬剤師数・新たなチーム活動から評価。", "人員が減る中で退院指導と術後疼痛管理への参画を拡大。自動化後の時間配分を具体的に考える材料となる。"], "issues": [], "sections": [{"heading": "目的", "content": "近年、薬剤師業務は対物中心から対人中心へのシフトが進んでおり、調剤業務の精度向上と効率化が求められる。大阪刀根山医療センターでは 2022 年 11 月より全自動 PTPシート払出装置（Robopick2：ユヤマ製、以下 RP）を導入しており、今回、RP 導入が医療安全および対人業務へ与える影響を検証した。"}, {"heading": "方法", "content": "導入前（2022 年 4〜10 月）と導入後（2022 年 12 月〜2023 年 6 月）における各評価項目を比較した。評価項目は内服薬の調剤エラー数、薬剤管理指導件数、退院時指導件数、薬剤師数とした。"}, {"heading": "結果", "content": "導入前後で内服薬の調剤エラー数は 44→29 件（RP 搭載品目では、14→1 件）へ減少した。薬剤管理指導件数は大きな変化を認めなかった（662.3→641.9 件/月）が、退院時薬剤指導件数は 74.7→90.1 件/月へ増加した。また、薬剤師数は導入前後で 13.00 人→12.48 人に減少していたが、術後疼痛管理チームへの新規介入を実施し、週 10 時間程度の活動時間を確保することができた。"}, {"heading": "考察", "content": "RP 導入により調剤業務の安全性および業務効率の向上が示された。また、通常の病棟業務を維持しながら、調剤業務効率化により創出された時間を退院時薬剤指導や術後疼痛管理チーム介入等の対人業務へ時間を配分できた可能性が考えられた。これらの結果より、RP 導入は調剤業務の精度向上のみならず対人業務の推進に寄与する可能性が示唆された。"}], "body_text": "### 目的\n\n近年、薬剤師業務は対物中心から対人中心へのシフトが進んでおり、調剤業務の精度向上と効率化が求められる。大阪刀根山医療センターでは 2022 年 11 月より全自動 PTPシート払出装置（Robopick2：ユヤマ製、以下 RP）を導入しており、今回、RP 導入が医療安全および対人業務へ与える影響を検証した。\n\n### 方法\n\n導入前（2022 年 4〜10 月）と導入後（2022 年 12 月〜2023 年 6 月）における各評価項目を比較した。評価項目は内服薬の調剤エラー数、薬剤管理指導件数、退院時指導件数、薬剤師数とした。\n\n### 結果\n\n導入前後で内服薬の調剤エラー数は 44→29 件（RP 搭載品目では、14→1 件）へ減少した。薬剤管理指導件数は大きな変化を認めなかった（662.3→641.9 件/月）が、退院時薬剤指導件数は 74.7→90.1 件/月へ増加した。また、薬剤師数は導入前後で 13.00 人→12.48 人に減少していたが、術後疼痛管理チームへの新規介入を実施し、週 10 時間程度の活動時間を確保することができた。\n\n### 考察\n\nRP 導入により調剤業務の安全性および業務効率の向上が示された。また、通常の病棟業務を維持しながら、調剤業務効率化により創出された時間を退院時薬剤指導や術後疼痛管理チーム介入等の対人業務へ時間を配分できた可能性が考えられた。これらの結果より、RP 導入は調剤業務の精度向上のみならず対人業務の推進に寄与する可能性が示唆された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-122-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [447]\nstatus: \"imported\"\n---\n\n# 全自動 PTP シート払出装置導入が薬剤師業務に与える影響\n\n- 演題番号: P2-122-3\n- 演題名: 全自動 PTP シート払出装置導入が薬剤師業務に与える影響\n- 所属施設: NHO 大阪刀根山医療センター 薬剤科\n- 筆頭演者: 佐々木 健将（ささき けんしょう）\n- 筆頭演者の所属: NHO 大阪刀根山医療センター 薬剤科\n- 演者名: 佐々木 健将（ささき けんしょう）、 宮部 貴識（みやべ たかし）、水 津 智樹（すいず ともき）、 千崎 宏樹（せんざき ひろき）\n- 原本: [PDF 447ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=447>)\n- 冊子ページ: 691\n\n## 抄録本文\n\n### 目的\n\n近年、薬剤師業務は対物中心から対人中心へのシフトが進んでおり、調剤業務の精度向上と効率化が求められる。大阪刀根山医療センターでは 2022 年 11 月より全自動 PTPシート払出装置（Robopick2：ユヤマ製、以下 RP）を導入しており、今回、RP 導入が医療安全および対人業務へ与える影響を検証した。\n\n### 方法\n\n導入前（2022 年 4〜10 月）と導入後（2022 年 12 月〜2023 年 6 月）における各評価項目を比較した。評価項目は内服薬の調剤エラー数、薬剤管理指導件数、退院時指導件数、薬剤師数とした。\n\n### 結果\n\n導入前後で内服薬の調剤エラー数は 44→29 件（RP 搭載品目では、14→1 件）へ減少した。薬剤管理指導件数は大きな変化を認めなかった（662.3→641.9 件/月）が、退院時薬剤指導件数は 74.7→90.1 件/月へ増加した。また、薬剤師数は導入前後で 13.00 人→12.48 人に減少していたが、術後疼痛管理チームへの新規介入を実施し、週 10 時間程度の活動時間を確保することができた。\n\n### 考察\n\nRP 導入により調剤業務の安全性および業務効率の向上が示された。また、通常の病棟業務を維持しながら、調剤業務効率化により創出された時間を退院時薬剤指導や術後疼痛管理チーム介入等の対人業務へ時間を配分できた可能性が考えられた。これらの結果より、RP 導入は調剤業務の精度向上のみならず対人業務の推進に寄与する可能性が示唆された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- PTPシート払出装置の導入を、調剤エラー・指導件数・薬剤師数・新たなチーム活動から評価。\n- 人員が減る中で退院指導と術後疼痛管理への参画を拡大。自動化後の時間配分を具体的に考える材料となる。\n\n", "rec_grade": "B", "rec_perspective": "調剤自動化・対人シフト", "rec_reason": "Robopick2導入により搭載品目の調剤エラーを14→1件へ削減し、薬剤師数が微減する中でも退院時指導の増加と「術後疼痛管理チーム（週10時間）」への新規参画を実現。"}, {"id": "P2-127-1", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-127", "session_name": "医療安全・監査システム・不眠時指示標準化", "title": "アンケート調査を基にした監査システムのマニュアル改訂", "authors": "小林 幸恵（こばやし ゆきえ）、 小村 誠（こむら まこと）、 横尾 祐一（よこお ゆういち）、濱 中 悠賀（はまなか ゆか）、 清水 麻由（しみず まゆ）、 田中 我空（たなか がく）", "first_author": "小林 幸恵（こばやし ゆきえ）", "affiliations": "NHO 渋川医療センター 薬剤部", "first_affiliation": "NHO 渋川医療センター 薬剤部", "printed_pages": "702", "pdf_pages": "458", "features": ["監査端末を使わない理由を部員へのアンケートで調べ、マニュアル改訂につなげる取り組み。", "端末不足・コード読取不能・緊急払出しという運用上の障壁を可視化。導入済み機器を実際に使える手順にする工夫が参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "渋川医療センター薬剤部では 4 年前より医薬品の取り揃えや監査時にハンディ端末による監査システム（内服薬の調剤時及び監査時、注射薬の監査時）を導入している。しかし、既存のマニュアルは存在するものの運用手順について詳細な記載はされておらず、部内の使用状況に個人差が生じていた。ハンディ端末使用の部内での標準化、調剤ミスなどを低減し、医療安全へ寄与することを目的に、部員アンケートに基づいたマニュアルの改訂を行うこととした。"}, {"heading": "方法", "content": "ハンディ端末の使用状況と現状の課題について無記名アンケートを作成し、薬剤部員 15 名を対象に実施した。"}, {"heading": "結果", "content": "ハンディ端末による監査システムを日勤帯に使用しないことがあると回答した部員は 66.7％であった。使用しない理由としてはハンディ端末の不足（75％）、GS1 コードの読み取り不能（66.7％）、緊急薬払い出しのため（41.7％）だった。以上の結果を踏まえ、使用に関する手順を見直し、少なくとも監査時にはハンディ端末を使用した監査を実施するなど、マニュアルへの追記を行った。"}, {"heading": "考察", "content": "多くの部員が監査システムの有用性を実感している一方、端末不足時や緊急薬払い出し時、監査システムで読み取り不能な薬剤調剤時に監査システムを十分に使用できていない現状がわかった。これらの要因に対するマニュアル改訂を行い、本マニュアルに基づいた運用を開始している。今後は、運用開始後に生じた課題を抽出し、マニュアルの更なる見直しを行っていく予定である。"}], "body_text": "### 目的\n\n渋川医療センター薬剤部では 4 年前より医薬品の取り揃えや監査時にハンディ端末による監査システム（内服薬の調剤時及び監査時、注射薬の監査時）を導入している。しかし、既存のマニュアルは存在するものの運用手順について詳細な記載はされておらず、部内の使用状況に個人差が生じていた。ハンディ端末使用の部内での標準化、調剤ミスなどを低減し、医療安全へ寄与することを目的に、部員アンケートに基づいたマニュアルの改訂を行うこととした。\n\n### 方法\n\nハンディ端末の使用状況と現状の課題について無記名アンケートを作成し、薬剤部員 15 名を対象に実施した。\n\n### 結果\n\nハンディ端末による監査システムを日勤帯に使用しないことがあると回答した部員は 66.7％であった。使用しない理由としてはハンディ端末の不足（75％）、GS1 コードの読み取り不能（66.7％）、緊急薬払い出しのため（41.7％）だった。以上の結果を踏まえ、使用に関する手順を見直し、少なくとも監査時にはハンディ端末を使用した監査を実施するなど、マニュアルへの追記を行った。\n\n### 考察\n\n多くの部員が監査システムの有用性を実感している一方、端末不足時や緊急薬払い出し時、監査システムで読み取り不能な薬剤調剤時に監査システムを十分に使用できていない現状がわかった。これらの要因に対するマニュアル改訂を行い、本マニュアルに基づいた運用を開始している。今後は、運用開始後に生じた課題を抽出し、マニュアルの更なる見直しを行っていく予定である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-127-1\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [458]\nstatus: \"imported\"\n---\n\n# アンケート調査を基にした監査システムのマニュアル改訂\n\n- 演題番号: P2-127-1\n- 演題名: アンケート調査を基にした監査システムのマニュアル改訂\n- 所属施設: NHO 渋川医療センター 薬剤部\n- 筆頭演者: 小林 幸恵（こばやし ゆきえ）\n- 筆頭演者の所属: NHO 渋川医療センター 薬剤部\n- 演者名: 小林 幸恵（こばやし ゆきえ）、 小村 誠（こむら まこと）、 横尾 祐一（よこお ゆういち）、濱 中 悠賀（はまなか ゆか）、 清水 麻由（しみず まゆ）、 田中 我空（たなか がく）\n- 原本: [PDF 458ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=458>)\n- 冊子ページ: 702\n\n## 抄録本文\n\n### 目的\n\n渋川医療センター薬剤部では 4 年前より医薬品の取り揃えや監査時にハンディ端末による監査システム（内服薬の調剤時及び監査時、注射薬の監査時）を導入している。しかし、既存のマニュアルは存在するものの運用手順について詳細な記載はされておらず、部内の使用状況に個人差が生じていた。ハンディ端末使用の部内での標準化、調剤ミスなどを低減し、医療安全へ寄与することを目的に、部員アンケートに基づいたマニュアルの改訂を行うこととした。\n\n### 方法\n\nハンディ端末の使用状況と現状の課題について無記名アンケートを作成し、薬剤部員 15 名を対象に実施した。\n\n### 結果\n\nハンディ端末による監査システムを日勤帯に使用しないことがあると回答した部員は 66.7％であった。使用しない理由としてはハンディ端末の不足（75％）、GS1 コードの読み取り不能（66.7％）、緊急薬払い出しのため（41.7％）だった。以上の結果を踏まえ、使用に関する手順を見直し、少なくとも監査時にはハンディ端末を使用した監査を実施するなど、マニュアルへの追記を行った。\n\n### 考察\n\n多くの部員が監査システムの有用性を実感している一方、端末不足時や緊急薬払い出し時、監査システムで読み取り不能な薬剤調剤時に監査システムを十分に使用できていない現状がわかった。これらの要因に対するマニュアル改訂を行い、本マニュアルに基づいた運用を開始している。今後は、運用開始後に生じた課題を抽出し、マニュアルの更なる見直しを行っていく予定である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 監査端末を使わない理由を部員へのアンケートで調べ、マニュアル改訂につなげる取り組み。\n- 端末不足・コード読取不能・緊急払出しという運用上の障壁を可視化。導入済み機器を実際に使える手順にする工夫が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-127-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-127", "session_name": "医療安全・監査システム・不眠時指示標準化", "title": "硬膜外麻酔の麻薬漏出事故の発生状況調査", "authors": "谷口 潤（たにぐち じゅん） 1、 上原 智博（うえはら ともひろ） 1、 又吉 直樹（またよし なおき） 2", "first_author": "谷口 潤（たにぐち じゅん） 1", "affiliations": "1 NHO 沖縄病院 薬剤部、2 NHO 沖縄病院 医療安全管理室", "first_affiliation": "NHO 沖縄病院 薬剤部", "printed_pages": "702", "pdf_pages": "458", "features": ["硬膜外麻酔の麻薬漏出10件を、発見者・場所・時間帯・開始からの時間などで詳しく整理。", "胸腔鏡手術や開始36時間以降の事例が多い。少数事例の記述として、観察のタイミングと多職種の連絡方法に注目したい。"], "issues": [], "sections": [{"heading": "目的", "content": "硬膜外麻酔（epidural anesthesia：EPI）は強力で安定した鎮痛が得られるため、広く使用されている。一方で、局所麻酔薬とオピオイドが併用され、麻薬を含むことから麻薬及び向精神薬取締法の厳格な規制で、適正な使用と管理が求められる。\n\n沖縄病院ではマニュアルに従った麻薬の取り扱いの徹底や教育に努めてきた。しかし、硬膜外麻酔の麻薬漏出事故が一定の割合で発生していた。そこで、硬膜外麻酔の麻薬漏出事故の早期発見及び発生防止を図る目的で、発生状況を調査した。"}, {"heading": "方法", "content": "2024 年 4 月から 2025 年 12 月における、EPI 件数、EPI 麻薬の漏出件数、漏出事例の手術の種類、漏出の発見者・発見場所・発見契機・発生原因・発見状況・発生時間帯、投与開始からの漏出時間、最終確認からの漏出発見時間、フェンタニル漏出量、漏出後の対応を調査し、記述的分析を行った。"}, {"heading": "結果", "content": "全 10 件の EPI 漏出が発生していた。胸腔鏡手術での発生が 9 件であった。発見者は看護師7 件、発見場所は病室 9 件、発生原因は刺入部からの漏出 7 件が各項目で多かった。発生時間帯は 17 時台 4 件、9 時台 3 件であった。投与開始からの漏出時間は 36 時間以降が 7 件であった。漏出後の対応は 8 件が中止であった。"}, {"heading": "考察", "content": "低侵襲手術での事例が多く、早期離床による体動増加が、刺入部からの漏出要因の一つと考えられた。看護師が勤務交代の患者確認時に、漏出を早期発見できており、今後も注意深い観察を行う必要がある。投与開始 36 時間以降に漏出が増加し、また漏出後ほとんど中止となることから、36 時間を目途に EPI 中止を検討することで、事故減少の可能性が示唆された。\n\n今後は患者背景の要因等も調査し、さらなる業務改善に努めていきたい。"}], "body_text": "### 目的\n\n硬膜外麻酔（epidural anesthesia：EPI）は強力で安定した鎮痛が得られるため、広く使用されている。一方で、局所麻酔薬とオピオイドが併用され、麻薬を含むことから麻薬及び向精神薬取締法の厳格な規制で、適正な使用と管理が求められる。\n\n沖縄病院ではマニュアルに従った麻薬の取り扱いの徹底や教育に努めてきた。しかし、硬膜外麻酔の麻薬漏出事故が一定の割合で発生していた。そこで、硬膜外麻酔の麻薬漏出事故の早期発見及び発生防止を図る目的で、発生状況を調査した。\n\n### 方法\n\n2024 年 4 月から 2025 年 12 月における、EPI 件数、EPI 麻薬の漏出件数、漏出事例の手術の種類、漏出の発見者・発見場所・発見契機・発生原因・発見状況・発生時間帯、投与開始からの漏出時間、最終確認からの漏出発見時間、フェンタニル漏出量、漏出後の対応を調査し、記述的分析を行った。\n\n### 結果\n\n全 10 件の EPI 漏出が発生していた。胸腔鏡手術での発生が 9 件であった。発見者は看護師7 件、発見場所は病室 9 件、発生原因は刺入部からの漏出 7 件が各項目で多かった。発生時間帯は 17 時台 4 件、9 時台 3 件であった。投与開始からの漏出時間は 36 時間以降が 7 件であった。漏出後の対応は 8 件が中止であった。\n\n### 考察\n\n低侵襲手術での事例が多く、早期離床による体動増加が、刺入部からの漏出要因の一つと考えられた。看護師が勤務交代の患者確認時に、漏出を早期発見できており、今後も注意深い観察を行う必要がある。投与開始 36 時間以降に漏出が増加し、また漏出後ほとんど中止となることから、36 時間を目途に EPI 中止を検討することで、事故減少の可能性が示唆された。\n\n今後は患者背景の要因等も調査し、さらなる業務改善に努めていきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-127-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [458]\nstatus: \"imported\"\n---\n\n# 硬膜外麻酔の麻薬漏出事故の発生状況調査\n\n- 演題番号: P2-127-3\n- 演題名: 硬膜外麻酔の麻薬漏出事故の発生状況調査\n- 所属施設: 1 NHO 沖縄病院 薬剤部、2 NHO 沖縄病院 医療安全管理室\n- 筆頭演者: 谷口 潤（たにぐち じゅん） 1\n- 筆頭演者の所属: NHO 沖縄病院 薬剤部\n- 演者名: 谷口 潤（たにぐち じゅん） 1、 上原 智博（うえはら ともひろ） 1、 又吉 直樹（またよし なおき） 2\n- 原本: [PDF 458ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=458>)\n- 冊子ページ: 702\n\n## 抄録本文\n\n### 目的\n\n硬膜外麻酔（epidural anesthesia：EPI）は強力で安定した鎮痛が得られるため、広く使用されている。一方で、局所麻酔薬とオピオイドが併用され、麻薬を含むことから麻薬及び向精神薬取締法の厳格な規制で、適正な使用と管理が求められる。\n\n沖縄病院ではマニュアルに従った麻薬の取り扱いの徹底や教育に努めてきた。しかし、硬膜外麻酔の麻薬漏出事故が一定の割合で発生していた。そこで、硬膜外麻酔の麻薬漏出事故の早期発見及び発生防止を図る目的で、発生状況を調査した。\n\n### 方法\n\n2024 年 4 月から 2025 年 12 月における、EPI 件数、EPI 麻薬の漏出件数、漏出事例の手術の種類、漏出の発見者・発見場所・発見契機・発生原因・発見状況・発生時間帯、投与開始からの漏出時間、最終確認からの漏出発見時間、フェンタニル漏出量、漏出後の対応を調査し、記述的分析を行った。\n\n### 結果\n\n全 10 件の EPI 漏出が発生していた。胸腔鏡手術での発生が 9 件であった。発見者は看護師7 件、発見場所は病室 9 件、発生原因は刺入部からの漏出 7 件が各項目で多かった。発生時間帯は 17 時台 4 件、9 時台 3 件であった。投与開始からの漏出時間は 36 時間以降が 7 件であった。漏出後の対応は 8 件が中止であった。\n\n### 考察\n\n低侵襲手術での事例が多く、早期離床による体動増加が、刺入部からの漏出要因の一つと考えられた。看護師が勤務交代の患者確認時に、漏出を早期発見できており、今後も注意深い観察を行う必要がある。投与開始 36 時間以降に漏出が増加し、また漏出後ほとんど中止となることから、36 時間を目途に EPI 中止を検討することで、事故減少の可能性が示唆された。\n\n今後は患者背景の要因等も調査し、さらなる業務改善に努めていきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 硬膜外麻酔の麻薬漏出10件を、発見者・場所・時間帯・開始からの時間などで詳しく整理。\n- 胸腔鏡手術や開始36時間以降の事例が多い。少数事例の記述として、観察のタイミングと多職種の連絡方法に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-127-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-127", "session_name": "医療安全・監査システム・不眠時指示標準化", "title": "調剤室におけるヒヤリハット事例の要因分析と対策の効果に関する検討", "authors": "築部 涼子（つくべ りょうこ）、 塚原 優太（つかはら ゆうた）、 川上 智広（かわかみ ともひろ）、 松本 信彦（まつもと のぶひこ）、 辰己 晃造（たつみ こうぞう）、 永井 聡子（ながい さとこ）", "first_author": "築部 涼子（つくべ りょうこ）", "affiliations": "NHO 京都医療センター 薬剤部", "first_affiliation": "NHO 京都医療センター 薬剤部", "printed_pages": "703", "pdf_pages": "459", "features": ["ヒヤリハット235件を誤りの種類と要因から追い、棚表示など継続対策後にも残る問題を分析。", "数量間違いと薬品取り違えが中心で、傾向は大きく変わらない。表示対策の限界と次に必要な仕組みを考えられる。"], "issues": [], "sections": [{"heading": "背景", "content": "調剤室におけるヒヤリハットは重大事故を防止する観点から発生状況の把握が重要であり、各施設で様々な対策が講じられている。京都医療センターでは、毎月ヒヤリハットの集計後に対策を実施しているが、その多くは個別事例に対する対応にとどまり、ヒヤリハットが継続的に発生する背景や対策についての検討は十分でない。"}, {"heading": "目的", "content": "ヒヤリハット事例の背景を明らかにし、継続的対策を実施したにも関わらず発生する背景を検討する。"}, {"heading": "方法", "content": "2025 年 4 月から 2026 年 4 月に調剤室で報告されたヒヤリハット事例を対象とし、間違いの種類（薬品名、規格、数量等）および要因（思い込み、確認不足等）に分類し、月別推移を分析した。対策は毎月報告後に継続的に実施した。"}, {"heading": "結果", "content": "ヒヤリハット件数は全体で 235件、月により変動を認めたが、棚へののれんやラベルの設置を実施したにも関わらずヒヤリハット発生が確認された。間違いの種類は数量間違い（139 件）、薬品名取り違え（73 件）等が主体であり、要因として思い込みと確認不足が全体を通して多く認められた。これらの傾向は期間を通じて大きな変化を認めなかった。"}, {"heading": "結論", "content": "のれんやラベルの配置、配置変更などの視認性の向上を目的とした介入のみでは十分な抑制は困難であると考えられた。特に、思い込みや確認不足といった人的要因が認められており、注意喚起のみでは防ぎきれない可能性が示唆された。個人のダブルチェックを再度進めながら、導入予定であるピッキングサポートシステムでのバーコード照合による薬剤確認をすることで人的要因への対策を強化し、医療安全の向上に努めたい。"}], "body_text": "### 背景\n\n調剤室におけるヒヤリハットは重大事故を防止する観点から発生状況の把握が重要であり、各施設で様々な対策が講じられている。京都医療センターでは、毎月ヒヤリハットの集計後に対策を実施しているが、その多くは個別事例に対する対応にとどまり、ヒヤリハットが継続的に発生する背景や対策についての検討は十分でない。\n\n### 目的\n\nヒヤリハット事例の背景を明らかにし、継続的対策を実施したにも関わらず発生する背景を検討する。\n\n### 方法\n\n2025 年 4 月から 2026 年 4 月に調剤室で報告されたヒヤリハット事例を対象とし、間違いの種類（薬品名、規格、数量等）および要因（思い込み、確認不足等）に分類し、月別推移を分析した。対策は毎月報告後に継続的に実施した。\n\n### 結果\n\nヒヤリハット件数は全体で 235件、月により変動を認めたが、棚へののれんやラベルの設置を実施したにも関わらずヒヤリハット発生が確認された。間違いの種類は数量間違い（139 件）、薬品名取り違え（73 件）等が主体であり、要因として思い込みと確認不足が全体を通して多く認められた。これらの傾向は期間を通じて大きな変化を認めなかった。\n\n### 結論\n\nのれんやラベルの配置、配置変更などの視認性の向上を目的とした介入のみでは十分な抑制は困難であると考えられた。特に、思い込みや確認不足といった人的要因が認められており、注意喚起のみでは防ぎきれない可能性が示唆された。個人のダブルチェックを再度進めながら、導入予定であるピッキングサポートシステムでのバーコード照合による薬剤確認をすることで人的要因への対策を強化し、医療安全の向上に努めたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-127-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [459]\nstatus: \"imported\"\n---\n\n# 調剤室におけるヒヤリハット事例の要因分析と対策の効果に関する検討\n\n- 演題番号: P2-127-4\n- 演題名: 調剤室におけるヒヤリハット事例の要因分析と対策の効果に関する検討\n- 所属施設: NHO 京都医療センター 薬剤部\n- 筆頭演者: 築部 涼子（つくべ りょうこ）\n- 筆頭演者の所属: NHO 京都医療センター 薬剤部\n- 演者名: 築部 涼子（つくべ りょうこ）、 塚原 優太（つかはら ゆうた）、 川上 智広（かわかみ ともひろ）、 松本 信彦（まつもと のぶひこ）、 辰己 晃造（たつみ こうぞう）、 永井 聡子（ながい さとこ）\n- 原本: [PDF 459ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=459>)\n- 冊子ページ: 703\n\n## 抄録本文\n\n### 背景\n\n調剤室におけるヒヤリハットは重大事故を防止する観点から発生状況の把握が重要であり、各施設で様々な対策が講じられている。京都医療センターでは、毎月ヒヤリハットの集計後に対策を実施しているが、その多くは個別事例に対する対応にとどまり、ヒヤリハットが継続的に発生する背景や対策についての検討は十分でない。\n\n### 目的\n\nヒヤリハット事例の背景を明らかにし、継続的対策を実施したにも関わらず発生する背景を検討する。\n\n### 方法\n\n2025 年 4 月から 2026 年 4 月に調剤室で報告されたヒヤリハット事例を対象とし、間違いの種類（薬品名、規格、数量等）および要因（思い込み、確認不足等）に分類し、月別推移を分析した。対策は毎月報告後に継続的に実施した。\n\n### 結果\n\nヒヤリハット件数は全体で 235件、月により変動を認めたが、棚へののれんやラベルの設置を実施したにも関わらずヒヤリハット発生が確認された。間違いの種類は数量間違い（139 件）、薬品名取り違え（73 件）等が主体であり、要因として思い込みと確認不足が全体を通して多く認められた。これらの傾向は期間を通じて大きな変化を認めなかった。\n\n### 結論\n\nのれんやラベルの配置、配置変更などの視認性の向上を目的とした介入のみでは十分な抑制は困難であると考えられた。特に、思い込みや確認不足といった人的要因が認められており、注意喚起のみでは防ぎきれない可能性が示唆された。個人のダブルチェックを再度進めながら、導入予定であるピッキングサポートシステムでのバーコード照合による薬剤確認をすることで人的要因への対策を強化し、医療安全の向上に努めたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- ヒヤリハット235件を誤りの種類と要因から追い、棚表示など継続対策後にも残る問題を分析。\n- 数量間違いと薬品取り違えが中心で、傾向は大きく変わらない。表示対策の限界と次に必要な仕組みを考えられる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-127-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-127", "session_name": "医療安全・監査システム・不眠時指示標準化", "title": "多職種連携による不眠時指示の標準化に向けた取り組み", "authors": "田頭 尚士（たがしら ひさし） 1、 中原 翔（なかはら しょう） 2、 小島 利香（おじま りか） 3、 平見 有二（ひらみ ゆうじ） 4、 松原 広己（まつばら ひろみ） 5、 大倉 裕祐（おおくら ゆうすけ） 1", "first_author": "田頭 尚士（たがしら ひさし） 1", "affiliations": "1 NHO 岡山医療センター 薬剤部、2 NHO 岡山医療センター 医療安全管理室、 3 NHO 岡山医療センター 臨床検査科、4 NHO 岡山医療センター 呼吸器外科、 5 NHO 岡山医療センター 循環器内科", "first_affiliation": "NHO 岡山医療センター 薬剤部", "printed_pages": "703", "pdf_pages": "459", "features": ["多職種で睡眠薬選択・用量を標準化し、病棟常備薬の見直しまで含めた不眠時指示を整備。", "導入の円滑さとベンゾジアゼピン系使用減少傾向を報告。標準指示の内容、例外対応、導入後評価が聴講ポイント。"], "issues": [], "sections": [{"heading": "はじめに", "content": "ベンゾジアゼピン（BZ）受容体作動薬は、その優れた抗不安作用と睡眠導入効果により、広く一般診療においても使用されてきた薬剤群である。しかし、長期使用に伴う依存性や副作用の問題が指摘されるようになっている。また、薬剤性のせん妄を引き起こすリスクも報告されており、適切な使用が求められている。当院において不眠時指示は診療科ごとに内容が異なり、BZ 受容体作動薬の漫然使用が課題の一つであった。セーフティーマネージャー会議において多職種からなるグループを結成し、BZ 受容体作動薬の安易または不適切な使用を避ける取り組みを行ったので報告する。"}, {"heading": "方法", "content": "院内の不眠時指示および睡眠薬使用状況を後方視的に調査し、薬剤選択や用量設定の実態を把握した。これらを基にガイドラインや安全性情報を参照し、院内での標準的使用睡眠薬のリストならびに不眠時指示を作成した。また院内全体への周知を行うとともに病棟常備薬からのブロチゾラム等薬剤の撤去を行った。"}, {"heading": "結果", "content": "2025 年 12 月より多職種で対応することで院内周知等スムーズな導入が可能であった。導入後、ベンゾジアゼピン系睡眠薬の使用割合は減少傾向を示した。さらに代替薬剤へ切り替えられるなど頓用指示の適正化が認められた。"}, {"heading": "まとめ", "content": "多職種連携による不眠時指示の統一は、睡眠薬の適正使用、特にベンゾジアゼピン系薬剤の使用抑制に有用である可能性が示唆された。今後は転倒やせん妄など臨床的アウトカムへの影響についても検討が必要である。"}], "body_text": "### はじめに\n\nベンゾジアゼピン（BZ）受容体作動薬は、その優れた抗不安作用と睡眠導入効果により、広く一般診療においても使用されてきた薬剤群である。しかし、長期使用に伴う依存性や副作用の問題が指摘されるようになっている。また、薬剤性のせん妄を引き起こすリスクも報告されており、適切な使用が求められている。当院において不眠時指示は診療科ごとに内容が異なり、BZ 受容体作動薬の漫然使用が課題の一つであった。セーフティーマネージャー会議において多職種からなるグループを結成し、BZ 受容体作動薬の安易または不適切な使用を避ける取り組みを行ったので報告する。\n\n### 方法\n\n院内の不眠時指示および睡眠薬使用状況を後方視的に調査し、薬剤選択や用量設定の実態を把握した。これらを基にガイドラインや安全性情報を参照し、院内での標準的使用睡眠薬のリストならびに不眠時指示を作成した。また院内全体への周知を行うとともに病棟常備薬からのブロチゾラム等薬剤の撤去を行った。\n\n### 結果\n\n2025 年 12 月より多職種で対応することで院内周知等スムーズな導入が可能であった。導入後、ベンゾジアゼピン系睡眠薬の使用割合は減少傾向を示した。さらに代替薬剤へ切り替えられるなど頓用指示の適正化が認められた。\n\n### まとめ\n\n多職種連携による不眠時指示の統一は、睡眠薬の適正使用、特にベンゾジアゼピン系薬剤の使用抑制に有用である可能性が示唆された。今後は転倒やせん妄など臨床的アウトカムへの影響についても検討が必要である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-127-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [459]\nstatus: \"imported\"\n---\n\n# 多職種連携による不眠時指示の標準化に向けた取り組み\n\n- 演題番号: P2-127-5\n- 演題名: 多職種連携による不眠時指示の標準化に向けた取り組み\n- 所属施設: 1 NHO 岡山医療センター 薬剤部、2 NHO 岡山医療センター 医療安全管理室、 3 NHO 岡山医療センター 臨床検査科、4 NHO 岡山医療センター 呼吸器外科、 5 NHO 岡山医療センター 循環器内科\n- 筆頭演者: 田頭 尚士（たがしら ひさし） 1\n- 筆頭演者の所属: NHO 岡山医療センター 薬剤部\n- 演者名: 田頭 尚士（たがしら ひさし） 1、 中原 翔（なかはら しょう） 2、 小島 利香（おじま りか） 3、 平見 有二（ひらみ ゆうじ） 4、 松原 広己（まつばら ひろみ） 5、 大倉 裕祐（おおくら ゆうすけ） 1\n- 原本: [PDF 459ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=459>)\n- 冊子ページ: 703\n\n## 抄録本文\n\n### はじめに\n\nベンゾジアゼピン（BZ）受容体作動薬は、その優れた抗不安作用と睡眠導入効果により、広く一般診療においても使用されてきた薬剤群である。しかし、長期使用に伴う依存性や副作用の問題が指摘されるようになっている。また、薬剤性のせん妄を引き起こすリスクも報告されており、適切な使用が求められている。当院において不眠時指示は診療科ごとに内容が異なり、BZ 受容体作動薬の漫然使用が課題の一つであった。セーフティーマネージャー会議において多職種からなるグループを結成し、BZ 受容体作動薬の安易または不適切な使用を避ける取り組みを行ったので報告する。\n\n### 方法\n\n院内の不眠時指示および睡眠薬使用状況を後方視的に調査し、薬剤選択や用量設定の実態を把握した。これらを基にガイドラインや安全性情報を参照し、院内での標準的使用睡眠薬のリストならびに不眠時指示を作成した。また院内全体への周知を行うとともに病棟常備薬からのブロチゾラム等薬剤の撤去を行った。\n\n### 結果\n\n2025 年 12 月より多職種で対応することで院内周知等スムーズな導入が可能であった。導入後、ベンゾジアゼピン系睡眠薬の使用割合は減少傾向を示した。さらに代替薬剤へ切り替えられるなど頓用指示の適正化が認められた。\n\n### まとめ\n\n多職種連携による不眠時指示の統一は、睡眠薬の適正使用、特にベンゾジアゼピン系薬剤の使用抑制に有用である可能性が示唆された。今後は転倒やせん妄など臨床的アウトカムへの影響についても検討が必要である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 多職種で睡眠薬選択・用量を標準化し、病棟常備薬の見直しまで含めた不眠時指示を整備。\n- 導入の円滑さとベンゾジアゼピン系使用減少傾向を報告。標準指示の内容、例外対応、導入後評価が聴講ポイント。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-127-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-127", "session_name": "医療安全・監査システム・不眠時指示標準化", "title": "薬剤部におけるインシデント報告の件数増加と医療安全へ与える影響について", "authors": "勝俣 寛成（かつまた ひろなり） 1、 佐々木 史帆（ささき しほ） 1、 福元 大介（ふくもと だいすけ） 2、 平戸 江梨夏（ひらと えりか） 2、 辰己 晋平（たつみ しんぺい） 1、 森 達也（もり たつや） 1", "first_author": "勝俣 寛成（かつまた ひろなり） 1", "affiliations": "1 NHO 相模原病院 薬剤部、2 NHO 相模原病院 看護部", "first_affiliation": "NHO 相模原病院 薬剤部", "printed_pages": "703", "pdf_pages": "459", "features": ["インシデント報告の共有と個別フィードバックを継続し、報告件数とレベル別割合の変化を提示。", "報告増加の大半がレベル0である点が特徴。報告文化の変化と実際の有害事象発生を区別して評価したい。"], "issues": [], "sections": [{"heading": "目的", "content": "インシデントレポートの報告及び分析は医療事故を防止と医療安全に重要である。当院薬剤部におけるインシデント報告件数は、2023 年度から 2024 年度にかけて 1133 件から 1676 件へ増加した。本研究では、報告増加の要因とインシデントの傾向を分析し、医療安全への影響を評価した。"}, {"heading": "方法", "content": "各年度及び各月のインシデントについて傾向を分析し、再発防止策を検討した。分析結果は薬剤部全体への周知および部員個々へフィードバックを通じて共有した。"}, {"heading": "結果", "content": "2024 年度は全体への周知は 8 回、薬剤部員個々へのフィードバックを 4 回行った。2025 年度も同様に行った。2025 年度におけるインシデント報告件数は2129 件とさらに報告件数が増加した。増加の大半はレベル 0 であり、レベル 1 以上の発生は 2023 年度 7.94％、2024 年度 3.4％、2025 年度 2.96％へと減少した。"}, {"heading": "考察", "content": "報告件数の増加によりインシデントの傾向分析の精度が向上し、個人の傾向に応じた対策が可能となった。また、情報共有とフィードバックが薬剤部員の医療安全意識の向上につながり、報告件数の増加を促進したと考えるさらに、再発防止の対策の実施によりレベル 1 以上の発生割合が減少し、医療事故の未然防止に寄与したと考える。"}], "body_text": "### 目的\n\nインシデントレポートの報告及び分析は医療事故を防止と医療安全に重要である。当院薬剤部におけるインシデント報告件数は、2023 年度から 2024 年度にかけて 1133 件から 1676 件へ増加した。本研究では、報告増加の要因とインシデントの傾向を分析し、医療安全への影響を評価した。\n\n### 方法\n\n各年度及び各月のインシデントについて傾向を分析し、再発防止策を検討した。分析結果は薬剤部全体への周知および部員個々へフィードバックを通じて共有した。\n\n### 結果\n\n2024 年度は全体への周知は 8 回、薬剤部員個々へのフィードバックを 4 回行った。2025 年度も同様に行った。2025 年度におけるインシデント報告件数は2129 件とさらに報告件数が増加した。増加の大半はレベル 0 であり、レベル 1 以上の発生は 2023 年度 7.94％、2024 年度 3.4％、2025 年度 2.96％へと減少した。\n\n### 考察\n\n報告件数の増加によりインシデントの傾向分析の精度が向上し、個人の傾向に応じた対策が可能となった。また、情報共有とフィードバックが薬剤部員の医療安全意識の向上につながり、報告件数の増加を促進したと考えるさらに、再発防止の対策の実施によりレベル 1 以上の発生割合が減少し、医療事故の未然防止に寄与したと考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-127-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [459]\nstatus: \"imported\"\n---\n\n# 薬剤部におけるインシデント報告の件数増加と医療安全へ与える影響について\n\n- 演題番号: P2-127-6\n- 演題名: 薬剤部におけるインシデント報告の件数増加と医療安全へ与える影響について\n- 所属施設: 1 NHO 相模原病院 薬剤部、2 NHO 相模原病院 看護部\n- 筆頭演者: 勝俣 寛成（かつまた ひろなり） 1\n- 筆頭演者の所属: NHO 相模原病院 薬剤部\n- 演者名: 勝俣 寛成（かつまた ひろなり） 1、 佐々木 史帆（ささき しほ） 1、 福元 大介（ふくもと だいすけ） 2、 平戸 江梨夏（ひらと えりか） 2、 辰己 晋平（たつみ しんぺい） 1、 森 達也（もり たつや） 1\n- 原本: [PDF 459ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=459>)\n- 冊子ページ: 703\n\n## 抄録本文\n\n### 目的\n\nインシデントレポートの報告及び分析は医療事故を防止と医療安全に重要である。当院薬剤部におけるインシデント報告件数は、2023 年度から 2024 年度にかけて 1133 件から 1676 件へ増加した。本研究では、報告増加の要因とインシデントの傾向を分析し、医療安全への影響を評価した。\n\n### 方法\n\n各年度及び各月のインシデントについて傾向を分析し、再発防止策を検討した。分析結果は薬剤部全体への周知および部員個々へフィードバックを通じて共有した。\n\n### 結果\n\n2024 年度は全体への周知は 8 回、薬剤部員個々へのフィードバックを 4 回行った。2025 年度も同様に行った。2025 年度におけるインシデント報告件数は2129 件とさらに報告件数が増加した。増加の大半はレベル 0 であり、レベル 1 以上の発生は 2023 年度 7.94％、2024 年度 3.4％、2025 年度 2.96％へと減少した。\n\n### 考察\n\n報告件数の増加によりインシデントの傾向分析の精度が向上し、個人の傾向に応じた対策が可能となった。また、情報共有とフィードバックが薬剤部員の医療安全意識の向上につながり、報告件数の増加を促進したと考えるさらに、再発防止の対策の実施によりレベル 1 以上の発生割合が減少し、医療事故の未然防止に寄与したと考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- インシデント報告の共有と個別フィードバックを継続し、報告件数とレベル別割合の変化を提示。\n- 報告増加の大半がレベル0である点が特徴。報告文化の変化と実際の有害事象発生を区別して評価したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-132-1", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-132", "session_name": "AI議事録・フォーミュラリー・中毒・研究体制", "title": "既存ソフトと AI を併用した議事概要作成の有用性について", "authors": "川崎 菜央（かわさき なお） 1、 甲斐 達夫（かい たつお） 2、仲 田 浩成（なかた ひろなり） 1、 鶴崎 泰史（つるさき やすふみ） 1", "first_author": "川崎 菜央（かわさき なお） 1", "affiliations": "1 NHO 佐賀病院 薬剤部、2 NHO 琉球病院 薬剤部", "first_affiliation": "NHO 佐賀病院 薬剤部", "printed_pages": "713", "pdf_pages": "469", "features": ["既存のTeams文字起こしとCopilot要約を組み合わせ、議事概要の作成時間と職員の評価を比較。", "平均7分30秒短縮する一方、医療用語・話者識別に課題。原記録との照合を含む実務の運用方法に注目したい。"], "issues": [], "sections": [{"heading": "目的", "content": "近年、医療現場では業務の効率化が求められている。当院では朝礼内容の議事概要をマイクロソフト Excel（以下、Excel）に手入力で記録していたが、作業に時間を要していた。そこで AI を活用した議事概要作成を導入し、業務効率化と薬剤師の負担軽減への有用性を検証することを目的とした。"}, {"heading": "方法", "content": "ある特定の 14 日間を対象期間とし、従来の Excel手入力による記録とマイクロソフト Teams の文字起こし機能を使用し、マイクロソフトCopilot で要約した AI 記録の作業時間を比較した。両者の平均記録時間を算出し、AI 導入による時間短縮効果を評価した。更に、Google Forms を用いて当院薬剤師 10 名を対象に
