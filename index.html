室 15 例、30 日死亡 7 例であった。感染症の内訳は、尿路感染 14 例、肺炎 13例、菌血症 12 例、腹腔内感染 6 例、その他 4 例であり、敗血症へ進展したのは 17 例であった。分離菌は緑膿菌 31 株、大腸菌 22 株、肺炎桿菌 6 株であり、ESBL 産生の腸内細菌目細菌は 22 株、多剤耐性緑膿菌は 11 株であった。使用理由は、多剤耐性緑膿菌の検出 11 例、ESBL 産生の腸内細菌目細菌と緑膿菌の両菌種検出 7 例、ESBL 産生の腸内細菌目細菌に対するセフメタゾールの最小発育阻止濃度（MIC）が MIC≧2 であった症例が 2 例、緑膿菌に対するセフェピムの MIC が MIC≧4 であった症例が 8 例、起因菌もしくは感受性が判明するまでの使用 9 例、メロペネムからの de-escalation2 例であった。また、副作用発現による変更、他剤使用中の重症化に伴う変更は各々 5 例であった。"}, {"heading": "考察", "content": "当院において TAZ/CTLZ は、ESBL 産生の腸内細菌目細菌や緑膿菌感染症に対して使用され、ICU 入室例や敗血症例を含む重症患者にも適用されていた。治療成功率は 85％と良好であった。以上より、従来治療で対応困難な耐性グラム陰性桿菌による感染症に対する治療選択肢の一つとなる可能性が示唆された。"}], "body_text": "### 目的\n\nタゾバクタム/セフトロザン（TAZ/CTLZ）は、基質特異性拡張型 β-ラクタマーゼ（ESBL）産生菌をはじめとする多剤耐性グラム陰性菌に対して重要な抗菌薬である。今回、当院における TAZ/CTLZ の使用実態を調査した。\n\n### 方法\n\n2022 年 10 月〜2025 年 9 月に TAZ/CTLZ を 72 時間以上投与した患者を対象に、後方視的に調査した。\n\n### 結果\n\n対象は 49 例（男性 31 例、女性 18 例）で、年齢中央値 73 歳、投与日数中央値 10日、ICU 入室 15 例、30 日死亡 7 例であった。感染症の内訳は、尿路感染 14 例、肺炎 13例、菌血症 12 例、腹腔内感染 6 例、その他 4 例であり、敗血症へ進展したのは 17 例であった。分離菌は緑膿菌 31 株、大腸菌 22 株、肺炎桿菌 6 株であり、ESBL 産生の腸内細菌目細菌は 22 株、多剤耐性緑膿菌は 11 株であった。使用理由は、多剤耐性緑膿菌の検出 11 例、ESBL 産生の腸内細菌目細菌と緑膿菌の両菌種検出 7 例、ESBL 産生の腸内細菌目細菌に対するセフメタゾールの最小発育阻止濃度（MIC）が MIC≧2 であった症例が 2 例、緑膿菌に対するセフェピムの MIC が MIC≧4 であった症例が 8 例、起因菌もしくは感受性が判明するまでの使用 9 例、メロペネムからの de-escalation2 例であった。また、副作用発現による変更、他剤使用中の重症化に伴う変更は各々 5 例であった。\n\n### 考察\n\n当院において TAZ/CTLZ は、ESBL 産生の腸内細菌目細菌や緑膿菌感染症に対して使用され、ICU 入室例や敗血症例を含む重症患者にも適用されていた。治療成功率は 85％と良好であった。以上より、従来治療で対応困難な耐性グラム陰性桿菌による感染症に対する治療選択肢の一つとなる可能性が示唆された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-64-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [230]\nstatus: \"imported\"\n---\n\n# 九州医療センターにおけるタゾバクタム/セフトロザンの使用実態調査\n\n- 演題番号: P1-64-4\n- 演題名: 九州医療センターにおけるタゾバクタム/セフトロザンの使用実態調査\n- 所属施設: NHO 九州医療センター 薬剤部\n- 筆頭演者: 平峯 侑恵（ひらみね ゆきえ）\n- 筆頭演者の所属: NHO 九州医療センター 薬剤部\n- 演者名: 平峯 侑恵（ひらみね ゆきえ）、 中島 瑞貴（なかしま みずき）、 大石 博史（おおいし ひろふみ）、 高野 豪（たかの たけし）、 藤瀬 陽子（ふじせ ようこ）、 山脇 一浩（やまわき かずひろ）\n- 原本: [PDF 230ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=230>)\n- 冊子ページ: 474\n\n## 抄録本文\n\n### 目的\n\nタゾバクタム/セフトロザン（TAZ/CTLZ）は、基質特異性拡張型 β-ラクタマーゼ（ESBL）産生菌をはじめとする多剤耐性グラム陰性菌に対して重要な抗菌薬である。今回、当院における TAZ/CTLZ の使用実態を調査した。\n\n### 方法\n\n2022 年 10 月〜2025 年 9 月に TAZ/CTLZ を 72 時間以上投与した患者を対象に、後方視的に調査した。\n\n### 結果\n\n対象は 49 例（男性 31 例、女性 18 例）で、年齢中央値 73 歳、投与日数中央値 10日、ICU 入室 15 例、30 日死亡 7 例であった。感染症の内訳は、尿路感染 14 例、肺炎 13例、菌血症 12 例、腹腔内感染 6 例、その他 4 例であり、敗血症へ進展したのは 17 例であった。分離菌は緑膿菌 31 株、大腸菌 22 株、肺炎桿菌 6 株であり、ESBL 産生の腸内細菌目細菌は 22 株、多剤耐性緑膿菌は 11 株であった。使用理由は、多剤耐性緑膿菌の検出 11 例、ESBL 産生の腸内細菌目細菌と緑膿菌の両菌種検出 7 例、ESBL 産生の腸内細菌目細菌に対するセフメタゾールの最小発育阻止濃度（MIC）が MIC≧2 であった症例が 2 例、緑膿菌に対するセフェピムの MIC が MIC≧4 であった症例が 8 例、起因菌もしくは感受性が判明するまでの使用 9 例、メロペネムからの de-escalation2 例であった。また、副作用発現による変更、他剤使用中の重症化に伴う変更は各々 5 例であった。\n\n### 考察\n\n当院において TAZ/CTLZ は、ESBL 産生の腸内細菌目細菌や緑膿菌感染症に対して使用され、ICU 入室例や敗血症例を含む重症患者にも適用されていた。治療成功率は 85％と良好であった。以上より、従来治療で対応困難な耐性グラム陰性桿菌による感染症に対する治療選択肢の一つとなる可能性が示唆された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- タゾバクタム／セフトロザン49例を、感染部位・起炎菌・重症度・変更理由から後方視的に整理。\n- 耐性菌対応を含む実臨床での使用場面が分かる。対照群のない実態調査として、薬剤選択の判断過程に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-64-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-64", "session_name": "感染症・抗菌薬/抗真菌薬TDM・HIV連携", "title": "国立ハンセン病療養所・多磨全生園における抗菌薬皮下点滴投与の安全性および有効性の検討", "authors": "青山 美穂（あおやま みほ） 1,2、 岡野 和成（おかの かずなり） 1、 小関 燈（こせき あかし） 2,3、 関 由貴子（せき ゆきこ） 2,3、 千葉 浩子（ちば ひろこ）2 ,3、 加藤 知子（かとう ともこ） 2,3、 竹光 正和（たけみつ まさかず） 2,3、 小田 智三（おだ としみ）2 ,3、 岡 慎一（おか しんいち） 2,3、 伊藤 博（いとう ひろし） 1,2,3", "first_author": "青山 美穂（あおやま みほ） 1,2", "affiliations": "1 国立療養所多磨全生園 薬剤科、2 国立療養所多磨全生園 抗菌薬適正使用支援チーム、 3 国立療養所多磨全生園 感染管理室", "first_affiliation": "国立療養所多磨全生園 薬剤科 / 国立療養所多磨全生園 抗菌薬適正使用支援チーム", "printed_pages": "474", "pdf_pages": "230", "features": ["ハンセン病療養所における抗菌薬皮下点滴を、有害事象・培養・CRPから検討する少数例の報告。", "抄録では7名の既存実績に発表時の追加データを予定。静脈路確保が難しい場面での運用と局所症状の監視が論点となる。"], "issues": [], "sections": [{"heading": "背景", "content": "国立ハンセン病療養所・多磨全生園では高齢化が進んでおり、点滴静注による医薬品の投与が困難となる事例が増えている。重症感染症の場合は注射用抗菌薬の投与が必要となるケースがあるが、静脈ルート確保が困難という理由から、1 日 1 回の投与でよいセフトリアキソンやレボフロキサシンなど広域の抗菌薬が好まれる一方、1 日複数回投与が必要なセファゾリンやスルバクタム/アンピシリンはほとんど処方されていなかった。また、経口抗菌薬は嚥下の問題で使用できないケースもあり、やむなく皮下点滴投与が必要となる場合がある。そこで当園では、国内外で皮下点滴投与実績のあるペニシリン系、セフェム系について、委員会において適応外使用を承認し運用を行っているが、皮下点滴投与の安全性や有効性に関する明確なエビデンスは少なく、データの蓄積が必要であると考えたため、今回、安全性と有効性の検討を行った。"}, {"heading": "方法", "content": "2019 年 1 月〜2026 年 9 月に皮下点滴投与された症例を抽出し、投与された抗菌薬の種類、投与期間、細菌培養結果、CRP 値を調査した。また、診療録より有害事象の出現がないか情報収集した。"}, {"heading": "結果", "content": "2019 年 1 月〜2025 年 12 月の実績では皮下点滴投与が 7 名の患者に行われていた。皮下点滴投与されたのは、セファゾリン、セフトリアキソン、スルバクタム/アンピシリンの 3 剤であった。投与期間は症例により異なるが、3 剤とも平均すると 14 日以内であった。このうち投与中の有害事象として、刺入部の疼痛および浮腫が 3 例報告されていたが、軽度であった。当日はこれに 2026 年 9月までの投与データおよび有害事象発現時期、細菌検査データ、CRP 値を追加して発表を行う。"}], "body_text": "### 背景\n\n国立ハンセン病療養所・多磨全生園では高齢化が進んでおり、点滴静注による医薬品の投与が困難となる事例が増えている。重症感染症の場合は注射用抗菌薬の投与が必要となるケースがあるが、静脈ルート確保が困難という理由から、1 日 1 回の投与でよいセフトリアキソンやレボフロキサシンなど広域の抗菌薬が好まれる一方、1 日複数回投与が必要なセファゾリンやスルバクタム/アンピシリンはほとんど処方されていなかった。また、経口抗菌薬は嚥下の問題で使用できないケースもあり、やむなく皮下点滴投与が必要となる場合がある。そこで当園では、国内外で皮下点滴投与実績のあるペニシリン系、セフェム系について、委員会において適応外使用を承認し運用を行っているが、皮下点滴投与の安全性や有効性に関する明確なエビデンスは少なく、データの蓄積が必要であると考えたため、今回、安全性と有効性の検討を行った。\n\n### 方法\n\n2019 年 1 月〜2026 年 9 月に皮下点滴投与された症例を抽出し、投与された抗菌薬の種類、投与期間、細菌培養結果、CRP 値を調査した。また、診療録より有害事象の出現がないか情報収集した。\n\n### 結果\n\n2019 年 1 月〜2025 年 12 月の実績では皮下点滴投与が 7 名の患者に行われていた。皮下点滴投与されたのは、セファゾリン、セフトリアキソン、スルバクタム/アンピシリンの 3 剤であった。投与期間は症例により異なるが、3 剤とも平均すると 14 日以内であった。このうち投与中の有害事象として、刺入部の疼痛および浮腫が 3 例報告されていたが、軽度であった。当日はこれに 2026 年 9月までの投与データおよび有害事象発現時期、細菌検査データ、CRP 値を追加して発表を行う。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-64-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [230]\nstatus: \"imported\"\n---\n\n# 国立ハンセン病療養所・多磨全生園における抗菌薬皮下点滴投与の安全性および有効性の検討\n\n- 演題番号: P1-64-5\n- 演題名: 国立ハンセン病療養所・多磨全生園における抗菌薬皮下点滴投与の安全性および有効性の検討\n- 所属施設: 1 国立療養所多磨全生園 薬剤科、2 国立療養所多磨全生園 抗菌薬適正使用支援チーム、 3 国立療養所多磨全生園 感染管理室\n- 筆頭演者: 青山 美穂（あおやま みほ） 1,2\n- 筆頭演者の所属: 国立療養所多磨全生園 薬剤科 / 国立療養所多磨全生園 抗菌薬適正使用支援チーム\n- 演者名: 青山 美穂（あおやま みほ） 1,2、 岡野 和成（おかの かずなり） 1、 小関 燈（こせき あかし） 2,3、 関 由貴子（せき ゆきこ） 2,3、 千葉 浩子（ちば ひろこ）2 ,3、 加藤 知子（かとう ともこ） 2,3、 竹光 正和（たけみつ まさかず） 2,3、 小田 智三（おだ としみ）2 ,3、 岡 慎一（おか しんいち） 2,3、 伊藤 博（いとう ひろし） 1,2,3\n- 原本: [PDF 230ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=230>)\n- 冊子ページ: 474\n\n## 抄録本文\n\n### 背景\n\n国立ハンセン病療養所・多磨全生園では高齢化が進んでおり、点滴静注による医薬品の投与が困難となる事例が増えている。重症感染症の場合は注射用抗菌薬の投与が必要となるケースがあるが、静脈ルート確保が困難という理由から、1 日 1 回の投与でよいセフトリアキソンやレボフロキサシンなど広域の抗菌薬が好まれる一方、1 日複数回投与が必要なセファゾリンやスルバクタム/アンピシリンはほとんど処方されていなかった。また、経口抗菌薬は嚥下の問題で使用できないケースもあり、やむなく皮下点滴投与が必要となる場合がある。そこで当園では、国内外で皮下点滴投与実績のあるペニシリン系、セフェム系について、委員会において適応外使用を承認し運用を行っているが、皮下点滴投与の安全性や有効性に関する明確なエビデンスは少なく、データの蓄積が必要であると考えたため、今回、安全性と有効性の検討を行った。\n\n### 方法\n\n2019 年 1 月〜2026 年 9 月に皮下点滴投与された症例を抽出し、投与された抗菌薬の種類、投与期間、細菌培養結果、CRP 値を調査した。また、診療録より有害事象の出現がないか情報収集した。\n\n### 結果\n\n2019 年 1 月〜2025 年 12 月の実績では皮下点滴投与が 7 名の患者に行われていた。皮下点滴投与されたのは、セファゾリン、セフトリアキソン、スルバクタム/アンピシリンの 3 剤であった。投与期間は症例により異なるが、3 剤とも平均すると 14 日以内であった。このうち投与中の有害事象として、刺入部の疼痛および浮腫が 3 例報告されていたが、軽度であった。当日はこれに 2026 年 9月までの投与データおよび有害事象発現時期、細菌検査データ、CRP 値を追加して発表を行う。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- ハンセン病療養所における抗菌薬皮下点滴を、有害事象・培養・CRPから検討する少数例の報告。\n- 抄録では7名の既存実績に発表時の追加データを予定。静脈路確保が難しい場面での運用と局所症状の監視が論点となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-64-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-64", "session_name": "感染症・抗菌薬/抗真菌薬TDM・HIV連携", "title": "イサブコナゾールの忍容性に関する検討", "authors": "成田 和希（なりた かずき） 1、 上田 真也（うえだ しんや） 2、 小林 勝利（こばやし かつとし） 1、 倉茂 耀（くらしげ ひかる） 1、 齋藤 敏樹（さいとう としき） 1", "first_author": "成田 和希（なりた かずき） 1", "affiliations": "1 NHO 茨城東病院 薬剤部、2 NHO 東京医療センター 薬剤部", "first_affiliation": "NHO 茨城東病院 薬剤部", "printed_pages": "474", "pdf_pages": "230", "features": ["慢性肺アスペルギルス症でイサブコナゾールとボリコナゾール各26例の180日継続率を比較。", "継続率はいずれも73.1％で、中止理由に違いがある。切替例の経過と患者背景を踏まえた忍容性評価が参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "イサブコナゾール（ISCZ）は 2023 年 4 月に上市された第 2 世代トリアゾール系抗真菌薬である。また、慢性肺アスペルギルス症（CPA）は治療が長期間に及ぶため、抗真菌薬の忍容性が重要となる。ISCZ は CPA における第一選択薬のボリコナゾール（VRCZ）と比較して有害事象が少ないという報告があるが、日本人での実臨床データは限られている。そこで、呼吸器専門病院である当院において、CPA 患者に対する ISCZ と VRCZ の治療継続率を比較し、ISCZ の忍容性を検討した。"}, {"heading": "方法", "content": "2019 年 1 月〜2025 年 9 月に当院で、CPA に対して ISCZ もしくは VRCZ の投与を開始した患者を対象として後方視的に調査した。除外基準は外国籍の患者、開始時の投与量が添付文書と異なる患者、死亡退院となった患者、副作用以外で医師判断により治療中断となった患者、ならびに VRCZ 群では TDM 未実施の患者とした。主要評価項目は、CPA 治療の目安である 180 日間以上の治療継続率とした。"}, {"heading": "結果", "content": "調査期間において、ISCZ 群および VRCZ 群はそれぞれ 26 例が対象となった。治療継続率は、ISCZ 群および VRCZ 群いずれも 73.1％（19 例）であった。また、ISCZ 開始時に他剤から切り替えられた例は 13 例であり、うち 10 例で治療継続が可能であった。主な中止理由として、ISCZ 群は低 Na 血症 2 例、VRCZ 群は肝機能障害 3 例であった。"}, {"heading": "考察", "content": "本調査は報告の乏しい日本人データで行ったが、ISCZ は CPA において VRCZ と同等の治療継続率を示し、他剤からの切り替え後も治療継続が可能な症例を認めた。ISCZ は VRCZと比較して、TDM による用量調整が不要であること、薬物間相互作用が少ないことから、CPA 治療において有用な選択肢の一つとなる可能性が示唆された。"}], "body_text": "### 目的\n\nイサブコナゾール（ISCZ）は 2023 年 4 月に上市された第 2 世代トリアゾール系抗真菌薬である。また、慢性肺アスペルギルス症（CPA）は治療が長期間に及ぶため、抗真菌薬の忍容性が重要となる。ISCZ は CPA における第一選択薬のボリコナゾール（VRCZ）と比較して有害事象が少ないという報告があるが、日本人での実臨床データは限られている。そこで、呼吸器専門病院である当院において、CPA 患者に対する ISCZ と VRCZ の治療継続率を比較し、ISCZ の忍容性を検討した。\n\n### 方法\n\n2019 年 1 月〜2025 年 9 月に当院で、CPA に対して ISCZ もしくは VRCZ の投与を開始した患者を対象として後方視的に調査した。除外基準は外国籍の患者、開始時の投与量が添付文書と異なる患者、死亡退院となった患者、副作用以外で医師判断により治療中断となった患者、ならびに VRCZ 群では TDM 未実施の患者とした。主要評価項目は、CPA 治療の目安である 180 日間以上の治療継続率とした。\n\n### 結果\n\n調査期間において、ISCZ 群および VRCZ 群はそれぞれ 26 例が対象となった。治療継続率は、ISCZ 群および VRCZ 群いずれも 73.1％（19 例）であった。また、ISCZ 開始時に他剤から切り替えられた例は 13 例であり、うち 10 例で治療継続が可能であった。主な中止理由として、ISCZ 群は低 Na 血症 2 例、VRCZ 群は肝機能障害 3 例であった。\n\n### 考察\n\n本調査は報告の乏しい日本人データで行ったが、ISCZ は CPA において VRCZ と同等の治療継続率を示し、他剤からの切り替え後も治療継続が可能な症例を認めた。ISCZ は VRCZと比較して、TDM による用量調整が不要であること、薬物間相互作用が少ないことから、CPA 治療において有用な選択肢の一つとなる可能性が示唆された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-64-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [230]\nstatus: \"imported\"\n---\n\n# イサブコナゾールの忍容性に関する検討\n\n- 演題番号: P1-64-6\n- 演題名: イサブコナゾールの忍容性に関する検討\n- 所属施設: 1 NHO 茨城東病院 薬剤部、2 NHO 東京医療センター 薬剤部\n- 筆頭演者: 成田 和希（なりた かずき） 1\n- 筆頭演者の所属: NHO 茨城東病院 薬剤部\n- 演者名: 成田 和希（なりた かずき） 1、 上田 真也（うえだ しんや） 2、 小林 勝利（こばやし かつとし） 1、 倉茂 耀（くらしげ ひかる） 1、 齋藤 敏樹（さいとう としき） 1\n- 原本: [PDF 230ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=230>)\n- 冊子ページ: 474\n\n## 抄録本文\n\n### 目的\n\nイサブコナゾール（ISCZ）は 2023 年 4 月に上市された第 2 世代トリアゾール系抗真菌薬である。また、慢性肺アスペルギルス症（CPA）は治療が長期間に及ぶため、抗真菌薬の忍容性が重要となる。ISCZ は CPA における第一選択薬のボリコナゾール（VRCZ）と比較して有害事象が少ないという報告があるが、日本人での実臨床データは限られている。そこで、呼吸器専門病院である当院において、CPA 患者に対する ISCZ と VRCZ の治療継続率を比較し、ISCZ の忍容性を検討した。\n\n### 方法\n\n2019 年 1 月〜2025 年 9 月に当院で、CPA に対して ISCZ もしくは VRCZ の投与を開始した患者を対象として後方視的に調査した。除外基準は外国籍の患者、開始時の投与量が添付文書と異なる患者、死亡退院となった患者、副作用以外で医師判断により治療中断となった患者、ならびに VRCZ 群では TDM 未実施の患者とした。主要評価項目は、CPA 治療の目安である 180 日間以上の治療継続率とした。\n\n### 結果\n\n調査期間において、ISCZ 群および VRCZ 群はそれぞれ 26 例が対象となった。治療継続率は、ISCZ 群および VRCZ 群いずれも 73.1％（19 例）であった。また、ISCZ 開始時に他剤から切り替えられた例は 13 例であり、うち 10 例で治療継続が可能であった。主な中止理由として、ISCZ 群は低 Na 血症 2 例、VRCZ 群は肝機能障害 3 例であった。\n\n### 考察\n\n本調査は報告の乏しい日本人データで行ったが、ISCZ は CPA において VRCZ と同等の治療継続率を示し、他剤からの切り替え後も治療継続が可能な症例を認めた。ISCZ は VRCZと比較して、TDM による用量調整が不要であること、薬物間相互作用が少ないことから、CPA 治療において有用な選択肢の一つとなる可能性が示唆された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 慢性肺アスペルギルス症でイサブコナゾールとボリコナゾール各26例の180日継続率を比較。\n- 継続率はいずれも73.1％で、中止理由に違いがある。切替例の経過と患者背景を踏まえた忍容性評価が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-64-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-64", "session_name": "感染症・抗菌薬/抗真菌薬TDM・HIV連携", "title": "Candida glabrata 治療に対するアンケート調査および当院での実態調査", "authors": "小田 実季（おだ みき） 1、 上田 真也（うえだ しんや） 1、 茂野 絢子（しげの あやこ） 1、 稲葉 悠（いなば ゆう） 2、 春日 依蕗（かすが いぶき） 1、 渡慶次 里佳（とけし りか） 1、 小川 千晶（おがわ ちあき） 1、 軍司 剛宏（ぐんじ たかひろ） 1", "first_author": "小田 実季（おだ みき） 1", "affiliations": "1 NHO 東京医療センター 薬剤部、2 NHO 栃木医療センター 薬剤部", "first_affiliation": "NHO 東京医療センター 薬剤部", "printed_pages": "475", "pdf_pages": "231", "features": ["C. glabrataの治療方針を37施設の回答と自施設症例の両方から検討し、経口スイッチにも着目。", "施設間の治療選択の違いと、感受性用量依存の判定例での使用経験を比較できる。少数例の結果の解釈を確認したい。"], "issues": [], "sections": [{"heading": "目的", "content": "Candidaglabrata（C.glabrata）はキャンディン系抗真菌薬が第一推奨とされる。しかし、国内におけるC.glabrataに対する抗真菌薬の使用状況は十分に明らかとなっていない。また、C.glabrataはフルコナゾール（FLCZ）に対して用量依存的感性（SDD）を示すことがあり、感受性結果に基づいた治療薬選択が課題となる菌種である。本研究では、実臨床におけるC.glabrataに対する治療戦略の実態を明らかにすることを目的とした。"}, {"heading": "方法", "content": "国立病院機構関東信越グループに属する 40 施設を対象にC.glabrataを起炎菌とする感染症の治療方針について、多施設アンケート調査を実施した。調査項目は、抗真菌薬の選択、菌種同定後の治療方針、経口スイッチの方針、FLCZ SDD 症例への対応などとした。また、東京医療センター（当院）において 2020 年 1 月∽ 2025 年 12 月に無菌検体からC.glab-rataが検出された症例を後方視的に調査した。"}, {"heading": "結果", "content": "アンケートには 40 施設のうち 37 施設より回答が得られた（92.5％）。C.glabrataに対する治療薬としてはキャンディン系抗真菌薬を選択する施設が 26 施設（70.3％）と最多であった。経口スイッチの実施は 20 施設（54.1％）で検討されており、主な薬剤は FLCZ、ボリコナゾールであった。当院では SDDと判定された 32 例中 5 例（15.6％）で FLCZ が使用されており、そのうち 4 例（80.0％）が治療完遂できていた。"}, {"heading": "結論", "content": "C.glabrataに対して半数超の施設で経口スイッチを実施している状況が明らかとなった。キャンディン系抗真菌薬の使用量が増えている現状においてSDD 症例に対する FLCZ は、治療選択肢のひとつとなる有望な薬剤の可能性がある。"}], "body_text": "### 目的\n\nCandidaglabrata（C.glabrata）はキャンディン系抗真菌薬が第一推奨とされる。しかし、国内におけるC.glabrataに対する抗真菌薬の使用状況は十分に明らかとなっていない。また、C.glabrataはフルコナゾール（FLCZ）に対して用量依存的感性（SDD）を示すことがあり、感受性結果に基づいた治療薬選択が課題となる菌種である。本研究では、実臨床におけるC.glabrataに対する治療戦略の実態を明らかにすることを目的とした。\n\n### 方法\n\n国立病院機構関東信越グループに属する 40 施設を対象にC.glabrataを起炎菌とする感染症の治療方針について、多施設アンケート調査を実施した。調査項目は、抗真菌薬の選択、菌種同定後の治療方針、経口スイッチの方針、FLCZ SDD 症例への対応などとした。また、東京医療センター（当院）において 2020 年 1 月∽ 2025 年 12 月に無菌検体からC.glab-rataが検出された症例を後方視的に調査した。\n\n### 結果\n\nアンケートには 40 施設のうち 37 施設より回答が得られた（92.5％）。C.glabrataに対する治療薬としてはキャンディン系抗真菌薬を選択する施設が 26 施設（70.3％）と最多であった。経口スイッチの実施は 20 施設（54.1％）で検討されており、主な薬剤は FLCZ、ボリコナゾールであった。当院では SDDと判定された 32 例中 5 例（15.6％）で FLCZ が使用されており、そのうち 4 例（80.0％）が治療完遂できていた。\n\n### 結論\n\nC.glabrataに対して半数超の施設で経口スイッチを実施している状況が明らかとなった。キャンディン系抗真菌薬の使用量が増えている現状においてSDD 症例に対する FLCZ は、治療選択肢のひとつとなる有望な薬剤の可能性がある。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-64-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [231]\nstatus: \"imported\"\n---\n\n# Candida glabrata 治療に対するアンケート調査および当院での実態調査\n\n- 演題番号: P1-64-7\n- 演題名: Candida glabrata 治療に対するアンケート調査および当院での実態調査\n- 所属施設: 1 NHO 東京医療センター 薬剤部、2 NHO 栃木医療センター 薬剤部\n- 筆頭演者: 小田 実季（おだ みき） 1\n- 筆頭演者の所属: NHO 東京医療センター 薬剤部\n- 演者名: 小田 実季（おだ みき） 1、 上田 真也（うえだ しんや） 1、 茂野 絢子（しげの あやこ） 1、 稲葉 悠（いなば ゆう） 2、 春日 依蕗（かすが いぶき） 1、 渡慶次 里佳（とけし りか） 1、 小川 千晶（おがわ ちあき） 1、 軍司 剛宏（ぐんじ たかひろ） 1\n- 原本: [PDF 231ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=231>)\n- 冊子ページ: 475\n\n## 抄録本文\n\n### 目的\n\nCandidaglabrata（C.glabrata）はキャンディン系抗真菌薬が第一推奨とされる。しかし、国内におけるC.glabrataに対する抗真菌薬の使用状況は十分に明らかとなっていない。また、C.glabrataはフルコナゾール（FLCZ）に対して用量依存的感性（SDD）を示すことがあり、感受性結果に基づいた治療薬選択が課題となる菌種である。本研究では、実臨床におけるC.glabrataに対する治療戦略の実態を明らかにすることを目的とした。\n\n### 方法\n\n国立病院機構関東信越グループに属する 40 施設を対象にC.glabrataを起炎菌とする感染症の治療方針について、多施設アンケート調査を実施した。調査項目は、抗真菌薬の選択、菌種同定後の治療方針、経口スイッチの方針、FLCZ SDD 症例への対応などとした。また、東京医療センター（当院）において 2020 年 1 月∽ 2025 年 12 月に無菌検体からC.glab-rataが検出された症例を後方視的に調査した。\n\n### 結果\n\nアンケートには 40 施設のうち 37 施設より回答が得られた（92.5％）。C.glabrataに対する治療薬としてはキャンディン系抗真菌薬を選択する施設が 26 施設（70.3％）と最多であった。経口スイッチの実施は 20 施設（54.1％）で検討されており、主な薬剤は FLCZ、ボリコナゾールであった。当院では SDDと判定された 32 例中 5 例（15.6％）で FLCZ が使用されており、そのうち 4 例（80.0％）が治療完遂できていた。\n\n### 結論\n\nC.glabrataに対して半数超の施設で経口スイッチを実施している状況が明らかとなった。キャンディン系抗真菌薬の使用量が増えている現状においてSDD 症例に対する FLCZ は、治療選択肢のひとつとなる有望な薬剤の可能性がある。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- C. glabrataの治療方針を37施設の回答と自施設症例の両方から検討し、経口スイッチにも着目。\n- 施設間の治療選択の違いと、感受性用量依存の判定例での使用経験を比較できる。少数例の結果の解釈を確認したい。\n\n", "rec_grade": "C", "rec_perspective": "抗真菌薬適正使用・多施設調査", "rec_reason": "関信グループ37施設のアンケート（回収率92.5%）と自施設無菌検体32例を組み合わせ、C. glabrataに対するキャンディン系選択と経口スイッチ（FLCZ SDD等）の実態を解明。"}, {"id": "P1-64-8", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-64", "session_name": "感染症・抗菌薬/抗真菌薬TDM・HIV連携", "title": "診療継続困難下における HIV 感染症患者の転院時薬剤管理サマリーの作成：アンケート調査に基づく検討", "authors": "野村 直幸（のむら なおゆき） 1、 濱砂 恵理香（はますな えりか） 1、 森木 智子（もりき さとこ） 1、 小山 朋子（こやま ともこ） 2、濱 岡 照隆（はまおか てるたか） 3", "first_author": "野村 直幸（のむら なおゆき） 1", "affiliations": "1 NHO 関門医療センター 薬剤部、2 国立療養所長島愛生園 薬剤部、3 NHO 福山医療センター 薬剤部", "first_affiliation": "NHO 関門医療センター 薬剤部", "printed_pages": "475", "pdf_pages": "231", "features": ["HIV診療の継続が難しくなる状況で、転院先薬剤師の情報ニーズを調査し薬剤管理サマリーを検討。", "治療失敗歴だけでなく調剤方法や食事摂取状況も重視された。治療を途切れさせない情報項目の設計に学べる。"], "issues": [], "sections": [{"heading": "背景", "content": "関門医療センター（以下、当院）は、エイズ治療中核拠点病院として山口県の HIV 診療を担ってきたが、2026 年度から診療体制の変更に伴い HIV 診療の継続が困難となり、当院通院中の約 40 名の HIV 感染症患者（以下、HIV 患者）は転院する方針となった。転院時の薬剤管理サマリー（以下、サマリー）は病院間での円滑な情報共有に重要であるが、HIV 患者において統一された様式はない。そこで本研究では、転院時に薬剤師が必要とする情報を明らかにすることを目的に、転院先の医療機関に対してアンケート調査を実施し、サマリーの検討・運用を行った。"}, {"heading": "方法", "content": "転院を予定している近隣 6 病院の HIV 担当薬剤師を対象とし、Google フォームを活用したWeb アンケートを実施した。調査項目は、HIV 治療に関する情報、アレルギー・副作用歴および検査値、併用薬や健康食品等、服薬・処方状況、生活背景等とした。"}, {"heading": "結果", "content": "5 病院 10 名から回答を得た。サマリーの作成に必要な情報として全員が必要と回答した項目は、抗 HIV 薬の治療失敗歴、薬剤アレルギー歴、併用薬、調剤方法、食事摂取の状況であった。自由記載は、感染経路に関する情報の必要性が挙げられた。"}, {"heading": "考察", "content": "現在も HIV 患者への差別や偏見は一部に存在しており、周囲の誰にも相談できない患者だけでなく、医療従事者へ相談ができない患者も散見される。さらに急な転院に伴い新しい環境に不安を感じる患者も少なくない。本調査により転院時に必要とされる薬剤関連情報が明らかとなり、これに基づきサマリーを作成し活用することで、病院間での情報共有の標準化と薬物療法の円滑な継続に寄与すると考えられる。"}], "body_text": "### 背景\n\n関門医療センター（以下、当院）は、エイズ治療中核拠点病院として山口県の HIV 診療を担ってきたが、2026 年度から診療体制の変更に伴い HIV 診療の継続が困難となり、当院通院中の約 40 名の HIV 感染症患者（以下、HIV 患者）は転院する方針となった。転院時の薬剤管理サマリー（以下、サマリー）は病院間での円滑な情報共有に重要であるが、HIV 患者において統一された様式はない。そこで本研究では、転院時に薬剤師が必要とする情報を明らかにすることを目的に、転院先の医療機関に対してアンケート調査を実施し、サマリーの検討・運用を行った。\n\n### 方法\n\n転院を予定している近隣 6 病院の HIV 担当薬剤師を対象とし、Google フォームを活用したWeb アンケートを実施した。調査項目は、HIV 治療に関する情報、アレルギー・副作用歴および検査値、併用薬や健康食品等、服薬・処方状況、生活背景等とした。\n\n### 結果\n\n5 病院 10 名から回答を得た。サマリーの作成に必要な情報として全員が必要と回答した項目は、抗 HIV 薬の治療失敗歴、薬剤アレルギー歴、併用薬、調剤方法、食事摂取の状況であった。自由記載は、感染経路に関する情報の必要性が挙げられた。\n\n### 考察\n\n現在も HIV 患者への差別や偏見は一部に存在しており、周囲の誰にも相談できない患者だけでなく、医療従事者へ相談ができない患者も散見される。さらに急な転院に伴い新しい環境に不安を感じる患者も少なくない。本調査により転院時に必要とされる薬剤関連情報が明らかとなり、これに基づきサマリーを作成し活用することで、病院間での情報共有の標準化と薬物療法の円滑な継続に寄与すると考えられる。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-64-8\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [231]\nstatus: \"imported\"\n---\n\n# 診療継続困難下における HIV 感染症患者の転院時薬剤管理サマリーの作成：アンケート調査に基づく検討\n\n- 演題番号: P1-64-8\n- 演題名: 診療継続困難下における HIV 感染症患者の転院時薬剤管理サマリーの作成：アンケート調査に基づく検討\n- 所属施設: 1 NHO 関門医療センター 薬剤部、2 国立療養所長島愛生園 薬剤部、3 NHO 福山医療センター 薬剤部\n- 筆頭演者: 野村 直幸（のむら なおゆき） 1\n- 筆頭演者の所属: NHO 関門医療センター 薬剤部\n- 演者名: 野村 直幸（のむら なおゆき） 1、 濱砂 恵理香（はますな えりか） 1、 森木 智子（もりき さとこ） 1、 小山 朋子（こやま ともこ） 2、濱 岡 照隆（はまおか てるたか） 3\n- 原本: [PDF 231ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=231>)\n- 冊子ページ: 475\n\n## 抄録本文\n\n### 背景\n\n関門医療センター（以下、当院）は、エイズ治療中核拠点病院として山口県の HIV 診療を担ってきたが、2026 年度から診療体制の変更に伴い HIV 診療の継続が困難となり、当院通院中の約 40 名の HIV 感染症患者（以下、HIV 患者）は転院する方針となった。転院時の薬剤管理サマリー（以下、サマリー）は病院間での円滑な情報共有に重要であるが、HIV 患者において統一された様式はない。そこで本研究では、転院時に薬剤師が必要とする情報を明らかにすることを目的に、転院先の医療機関に対してアンケート調査を実施し、サマリーの検討・運用を行った。\n\n### 方法\n\n転院を予定している近隣 6 病院の HIV 担当薬剤師を対象とし、Google フォームを活用したWeb アンケートを実施した。調査項目は、HIV 治療に関する情報、アレルギー・副作用歴および検査値、併用薬や健康食品等、服薬・処方状況、生活背景等とした。\n\n### 結果\n\n5 病院 10 名から回答を得た。サマリーの作成に必要な情報として全員が必要と回答した項目は、抗 HIV 薬の治療失敗歴、薬剤アレルギー歴、併用薬、調剤方法、食事摂取の状況であった。自由記載は、感染経路に関する情報の必要性が挙げられた。\n\n### 考察\n\n現在も HIV 患者への差別や偏見は一部に存在しており、周囲の誰にも相談できない患者だけでなく、医療従事者へ相談ができない患者も散見される。さらに急な転院に伴い新しい環境に不安を感じる患者も少なくない。本調査により転院時に必要とされる薬剤関連情報が明らかとなり、これに基づきサマリーを作成し活用することで、病院間での情報共有の標準化と薬物療法の円滑な継続に寄与すると考えられる。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- HIV診療の継続が難しくなる状況で、転院先薬剤師の情報ニーズを調査し薬剤管理サマリーを検討。\n- 治療失敗歴だけでなく調剤方法や食事摂取状況も重視された。治療を途切れさせない情報項目の設計に学べる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-78-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-78", "session_name": "多職種見学ツアー・薬学生多施設講義", "title": "院内コ・メディカル見学ツアーを開催して〜みんなの仕事を見に行こう〜", "authors": "杉浦 澄香（すぎうら すみか） 1、 内野 達宏（うちの たつひろ） 1、 花満 裕（はなみつ ひろし） 1、 佐藤 善彦（さとう よしひこ） 2、 浅岡 俊彰（あさおか としあき） 3、 田中 雄太郎（たなか ゆうたろう）4 、 松井 一樹（まつい かずき） 5", "first_author": "杉浦 澄香（すぎうら すみか） 1", "affiliations": "1 NHO 静岡てんかん・神経医療センター 薬剤部、2 NHO 静岡てんかん・神経医療センター 放射線科、 3 NHO 静岡てんかん・神経医療センター リハビリテーション科、 4 NHO 静岡てんかん・神経医療センター 栄養管理室、 5 NHO 静岡てんかん・神経医療センター 臨床検査科", "first_affiliation": "NHO 静岡てんかん・神経医療センター 薬剤部", "printed_pages": "503", "pdf_pages": "259", "features": ["5部門の相互見学を定期開催し、職種間の理解・コミュニケーションの変化を前後アンケートで評価。", "業務の可視化への好意的評価と準備負担を併記。継続可能な規模や見学プログラムの作り方が参考となる。"], "issues": [], "sections": [{"heading": "はじめに", "content": "チーム医療の推進は、医療の質を高めるとともに効率的な医療サービスを展開するために不可欠である。チーム医療を推進する目的は、専門職の積極的な活用、職種間の有機的な連携を図ること等により医療の質を改善することであり、そのためには、1．コミュニケーション、2．情報の共有化、3．チームマネジメントの 3 つの視点が重要である。当院においては他部署と密接な関係であるもののお互いの業務について十分に理解できていない。"}, {"heading": "目的", "content": "他部署との交流と業務内容の理解を目的とした見学ツアーを実施した。"}, {"heading": "方法", "content": "2025 年 7 月より 2 カ月毎に薬剤部・放射線科・リハビリテーション科・栄養管理室・検査科を各職場から 1〜2 名が見学ツアーに参加することとした。見学ツアー前後でアンケートを実施した。"}, {"heading": "結果", "content": "見学ツアー前は通常業務への影響が不安、コミュニケーションが強化されることに期待との回答が多かった。見学ツアー後は準備が大変との意見も多く見られたが、コミュニケーションが強化された、業務の透明化が確保された、自部署の業務がアピールできた、との回答が多かった。また、自由記述からは、他職種の業務について知るきっかけとなった、非常に画期的な取り組みであった、他部署の歳の近い方から上司の方まで話す機会があるのは良い事だと思うなどの意見が複数挙がった。"}, {"heading": "結論", "content": "本見学ツアーは、他部署の理解不足の是正と連携意識の向上に有効であり、教育プログラムとして継続的に実践することで実践的施策の検討に寄与する。今後も定期的な実施とさらなる部署参加を推奨する。"}], "body_text": "### はじめに\n\nチーム医療の推進は、医療の質を高めるとともに効率的な医療サービスを展開するために不可欠である。チーム医療を推進する目的は、専門職の積極的な活用、職種間の有機的な連携を図ること等により医療の質を改善することであり、そのためには、1．コミュニケーション、2．情報の共有化、3．チームマネジメントの 3 つの視点が重要である。当院においては他部署と密接な関係であるもののお互いの業務について十分に理解できていない。\n\n### 目的\n\n他部署との交流と業務内容の理解を目的とした見学ツアーを実施した。\n\n### 方法\n\n2025 年 7 月より 2 カ月毎に薬剤部・放射線科・リハビリテーション科・栄養管理室・検査科を各職場から 1〜2 名が見学ツアーに参加することとした。見学ツアー前後でアンケートを実施した。\n\n### 結果\n\n見学ツアー前は通常業務への影響が不安、コミュニケーションが強化されることに期待との回答が多かった。見学ツアー後は準備が大変との意見も多く見られたが、コミュニケーションが強化された、業務の透明化が確保された、自部署の業務がアピールできた、との回答が多かった。また、自由記述からは、他職種の業務について知るきっかけとなった、非常に画期的な取り組みであった、他部署の歳の近い方から上司の方まで話す機会があるのは良い事だと思うなどの意見が複数挙がった。\n\n### 結論\n\n本見学ツアーは、他部署の理解不足の是正と連携意識の向上に有効であり、教育プログラムとして継続的に実践することで実践的施策の検討に寄与する。今後も定期的な実施とさらなる部署参加を推奨する。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-78-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [259]\nstatus: \"imported\"\n---\n\n# 院内コ・メディカル見学ツアーを開催して〜みんなの仕事を見に行こう〜\n\n- 演題番号: P1-78-5\n- 演題名: 院内コ・メディカル見学ツアーを開催して〜みんなの仕事を見に行こう〜\n- 所属施設: 1 NHO 静岡てんかん・神経医療センター 薬剤部、2 NHO 静岡てんかん・神経医療センター 放射線科、 3 NHO 静岡てんかん・神経医療センター リハビリテーション科、 4 NHO 静岡てんかん・神経医療センター 栄養管理室、 5 NHO 静岡てんかん・神経医療センター 臨床検査科\n- 筆頭演者: 杉浦 澄香（すぎうら すみか） 1\n- 筆頭演者の所属: NHO 静岡てんかん・神経医療センター 薬剤部\n- 演者名: 杉浦 澄香（すぎうら すみか） 1、 内野 達宏（うちの たつひろ） 1、 花満 裕（はなみつ ひろし） 1、 佐藤 善彦（さとう よしひこ） 2、 浅岡 俊彰（あさおか としあき） 3、 田中 雄太郎（たなか ゆうたろう）4 、 松井 一樹（まつい かずき） 5\n- 原本: [PDF 259ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=259>)\n- 冊子ページ: 503\n\n## 抄録本文\n\n### はじめに\n\nチーム医療の推進は、医療の質を高めるとともに効率的な医療サービスを展開するために不可欠である。チーム医療を推進する目的は、専門職の積極的な活用、職種間の有機的な連携を図ること等により医療の質を改善することであり、そのためには、1．コミュニケーション、2．情報の共有化、3．チームマネジメントの 3 つの視点が重要である。当院においては他部署と密接な関係であるもののお互いの業務について十分に理解できていない。\n\n### 目的\n\n他部署との交流と業務内容の理解を目的とした見学ツアーを実施した。\n\n### 方法\n\n2025 年 7 月より 2 カ月毎に薬剤部・放射線科・リハビリテーション科・栄養管理室・検査科を各職場から 1〜2 名が見学ツアーに参加することとした。見学ツアー前後でアンケートを実施した。\n\n### 結果\n\n見学ツアー前は通常業務への影響が不安、コミュニケーションが強化されることに期待との回答が多かった。見学ツアー後は準備が大変との意見も多く見られたが、コミュニケーションが強化された、業務の透明化が確保された、自部署の業務がアピールできた、との回答が多かった。また、自由記述からは、他職種の業務について知るきっかけとなった、非常に画期的な取り組みであった、他部署の歳の近い方から上司の方まで話す機会があるのは良い事だと思うなどの意見が複数挙がった。\n\n### 結論\n\n本見学ツアーは、他部署の理解不足の是正と連携意識の向上に有効であり、教育プログラムとして継続的に実践することで実践的施策の検討に寄与する。今後も定期的な実施とさらなる部署参加を推奨する。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 5部門の相互見学を定期開催し、職種間の理解・コミュニケーションの変化を前後アンケートで評価。\n- 業務の可視化への好意的評価と準備負担を併記。継続可能な規模や見学プログラムの作り方が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-78-8", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-78", "session_name": "多職種見学ツアー・薬学生多施設講義", "title": "東北地区国立病院機構における薬学部実務実習オンライン多施設連携講義の実施と評価", "authors": "阿部 憲介（あべ けんすけ） 1、 吉田 和美（よしだ かずみ） 2、 鈴木 克之（すずき かつゆき） 3、 鈴木 敬雄（すずき たかお） 4、 菅原 秀悦（すがわら しゅうえつ） 5、亀 田 真梨子（かめた まりこ） 6、 荒井 信二（あらい しんじ） 7、 工藤 早苗（くどう さなえ） 8、 永澤 佑佳（ながさわ ゆか） 1、 東 敬太（あずま けいた） 1、会 津 裕子（あいづ ゆうこ） 7、 北尾 翔子（きたお しょうこ） 7、 細川 美里（ほそかわ みさと） 7、 夏坂 香里（なつさか かおり） 9、 三上 祥博（みかみ よしひろ） 7、 田中 南美英（たなか なみえ） 8、 一戸 集平（いちのへ しゅうへい） 6、 小野 幸一（おの こういち） 9、 西村 康人（にしむら やすひと） 1", "first_author": "阿部 憲介（あべ けんすけ） 1", "affiliations": "1 NHO 仙台医療センター 薬剤部、2 NHO 岩手病院 薬剤科、3 NHO あきた病院 薬剤科、 4 NHO 福島病院 薬剤科、5 NHO いわき病院 薬剤科、6 NHO 盛岡医療センター 薬剤科、 7 NHO 仙台西多賀病院 薬剤部、8 NHO 弘前総合医療センター 薬剤部、9 NHO 宮城病院 薬剤部", "first_affiliation": "NHO 仙台医療センター 薬剤部", "printed_pages": "504", "pdf_pages": "260", "features": ["複数施設がオンライン講義を共同提供し、実務実習の学習機会を施設の枠を超えて補完する取り組み。", "58名の回答で高い満足度を報告。自己評価による学習効果と区別しつつ、講義分担や運営方法に注目したい。"], "issues": [], "sections": [{"heading": "背景", "content": "薬学部実務実習では幅広い学修が求められる一方、病院機能の違いにより各施設単独では提供できる実習内容に差が生じる可能性がある。"}, {"heading": "目的", "content": "東北地区国立病院機構の複数施設でオンライン施設間連携講義を企画・実施し、実習生による評価を通じてその有用性を検討した。"}, {"heading": "方法", "content": "2023〜2025 年度に病院実習を行った薬学部実務実習生を対象とした。オンラインツール（Microsoft Teams）を用い、抗がん薬副作用対策、妊娠・授乳中の薬物療法、病院薬剤師の役割、ファーマシューティカル・ケアと臨床研究、チーム医療、重症心身障がい児・神経難病への関わりについて、週 1 回 60 分、計 7 回の講義を実施した。講義終了後、5 段階評価による無記名アンケートを実施した。"}, {"heading": "結果", "content": "参加者 62 名中 58 名から回答を得た（回答率 93.5％）。各講義内容の評価は平均 4.70 点と高く、施設間連携講義の有意義性（4.55 点）、病院薬剤師の役割理解（4.64 点）、講義への満足度（4.55 点）もいずれも高値を示した。対面授業との比較では、93.1％が同程度以上の学習効果があると評価した。"}, {"heading": "結論", "content": "オンライン施設間連携講義は施設機能の違いを補完し、薬学部実務実習の質向上に寄与する教育手法となり得る。また、病院薬剤師の多様な役割を実習生に伝える機会として、人材育成の観点からも有用である可能性が示唆された。"}], "body_text": "### 背景\n\n薬学部実務実習では幅広い学修が求められる一方、病院機能の違いにより各施設単独では提供できる実習内容に差が生じる可能性がある。\n\n### 目的\n\n東北地区国立病院機構の複数施設でオンライン施設間連携講義を企画・実施し、実習生による評価を通じてその有用性を検討した。\n\n### 方法\n\n2023〜2025 年度に病院実習を行った薬学部実務実習生を対象とした。オンラインツール（Microsoft Teams）を用い、抗がん薬副作用対策、妊娠・授乳中の薬物療法、病院薬剤師の役割、ファーマシューティカル・ケアと臨床研究、チーム医療、重症心身障がい児・神経難病への関わりについて、週 1 回 60 分、計 7 回の講義を実施した。講義終了後、5 段階評価による無記名アンケートを実施した。\n\n### 結果\n\n参加者 62 名中 58 名から回答を得た（回答率 93.5％）。各講義内容の評価は平均 4.70 点と高く、施設間連携講義の有意義性（4.55 点）、病院薬剤師の役割理解（4.64 点）、講義への満足度（4.55 点）もいずれも高値を示した。対面授業との比較では、93.1％が同程度以上の学習効果があると評価した。\n\n### 結論\n\nオンライン施設間連携講義は施設機能の違いを補完し、薬学部実務実習の質向上に寄与する教育手法となり得る。また、病院薬剤師の多様な役割を実習生に伝える機会として、人材育成の観点からも有用である可能性が示唆された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-78-8\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [260]\nstatus: \"imported\"\n---\n\n# 東北地区国立病院機構における薬学部実務実習オンライン多施設連携講義の実施と評価\n\n- 演題番号: P1-78-8\n- 演題名: 東北地区国立病院機構における薬学部実務実習オンライン多施設連携講義の実施と評価\n- 所属施設: 1 NHO 仙台医療センター 薬剤部、2 NHO 岩手病院 薬剤科、3 NHO あきた病院 薬剤科、 4 NHO 福島病院 薬剤科、5 NHO いわき病院 薬剤科、6 NHO 盛岡医療センター 薬剤科、 7 NHO 仙台西多賀病院 薬剤部、8 NHO 弘前総合医療センター 薬剤部、9 NHO 宮城病院 薬剤部\n- 筆頭演者: 阿部 憲介（あべ けんすけ） 1\n- 筆頭演者の所属: NHO 仙台医療センター 薬剤部\n- 演者名: 阿部 憲介（あべ けんすけ） 1、 吉田 和美（よしだ かずみ） 2、 鈴木 克之（すずき かつゆき） 3、 鈴木 敬雄（すずき たかお） 4、 菅原 秀悦（すがわら しゅうえつ） 5、亀 田 真梨子（かめた まりこ） 6、 荒井 信二（あらい しんじ） 7、 工藤 早苗（くどう さなえ） 8、 永澤 佑佳（ながさわ ゆか） 1、 東 敬太（あずま けいた） 1、会 津 裕子（あいづ ゆうこ） 7、 北尾 翔子（きたお しょうこ） 7、 細川 美里（ほそかわ みさと） 7、 夏坂 香里（なつさか かおり） 9、 三上 祥博（みかみ よしひろ） 7、 田中 南美英（たなか なみえ） 8、 一戸 集平（いちのへ しゅうへい） 6、 小野 幸一（おの こういち） 9、 西村 康人（にしむら やすひと） 1\n- 原本: [PDF 260ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=260>)\n- 冊子ページ: 504\n\n## 抄録本文\n\n### 背景\n\n薬学部実務実習では幅広い学修が求められる一方、病院機能の違いにより各施設単独では提供できる実習内容に差が生じる可能性がある。\n\n### 目的\n\n東北地区国立病院機構の複数施設でオンライン施設間連携講義を企画・実施し、実習生による評価を通じてその有用性を検討した。\n\n### 方法\n\n2023〜2025 年度に病院実習を行った薬学部実務実習生を対象とした。オンラインツール（Microsoft Teams）を用い、抗がん薬副作用対策、妊娠・授乳中の薬物療法、病院薬剤師の役割、ファーマシューティカル・ケアと臨床研究、チーム医療、重症心身障がい児・神経難病への関わりについて、週 1 回 60 分、計 7 回の講義を実施した。講義終了後、5 段階評価による無記名アンケートを実施した。\n\n### 結果\n\n参加者 62 名中 58 名から回答を得た（回答率 93.5％）。各講義内容の評価は平均 4.70 点と高く、施設間連携講義の有意義性（4.55 点）、病院薬剤師の役割理解（4.64 点）、講義への満足度（4.55 点）もいずれも高値を示した。対面授業との比較では、93.1％が同程度以上の学習効果があると評価した。\n\n### 結論\n\nオンライン施設間連携講義は施設機能の違いを補完し、薬学部実務実習の質向上に寄与する教育手法となり得る。また、病院薬剤師の多様な役割を実習生に伝える機会として、人材育成の観点からも有用である可能性が示唆された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 複数施設がオンライン講義を共同提供し、実務実習の学習機会を施設の枠を超えて補完する取り組み。\n- 58名の回答で高い満足度を報告。自己評価による学習効果と区別しつつ、講義分担や運営方法に注目したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-83-1", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-83", "session_name": "手指衛生手技評価・教育", "title": "DesiCoach 2Go を用いた薬剤部員の手指衛生手技評価と教育介入効果", "authors": "小口 莉央（こぐち りお）、 松永 浩明（まつなが ひろあき）、 斎藤 達也（さいとう たつや）、 古林 園子（こばやし そのこ）、 野村 理恵（のむら りえ）、 関口 昌利（せきぐち まさとし）", "first_author": "小口 莉央（こぐち りお）", "affiliations": "NHO 千葉医療センター 薬剤部", "first_affiliation": "NHO 千葉医療センター 薬剤部", "printed_pages": "514", "pdf_pages": "270", "features": ["蛍光塗料を用いて薬剤部員の手指消毒・手洗いの不十分部位を可視化し、再教育後に評価。", "全体スコアは改善する一方、指の付け根など残存課題も示す。個別の弱点に合わせた教育と再評価の方法が参考となる。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "手指衛生は最も重要な基本的感染対策の一つであるが、薬剤部門における手技の実施状況を客観的に評価した報告は限られている。今回、手指消毒トレーニングキットである DesiCoach 2Go を用いて、薬剤部員の手指消毒および石鹸流水手洗いの実施状況を評価し、フィードバックおよび再教育を行ったためその効果について報告する。"}, {"heading": "方法", "content": "2025 年度 9 月（1 回目）と 3 月（2 回目）の 2 回に分けて、当院薬剤部員を対象に調査を実施した。調査には DesiCoach 2Go を用い、蛍光塗料を手指消毒剤に見立て手指消毒を行い、ブラックライト下で消毒不十分部位を確認した。また、石鹸流水手洗い後の蛍光塗料残存状況から洗浄状況スコアを算出した。1 回目評価終了後、手指消毒時の不十分部位を対象者へフィードバックするとともに、正しい手指消毒剤の使用方法および石鹸流水手洗い方法について再教育を実施し、再評価（2 回目）を行った。"}, {"heading": "結果", "content": "手指消毒時の不十分部位は、1 回目（12 名実施）では指関節（手背側）9 件、手背5 件、爪 4 件認められたが、2 回目（11 名実施）ではそれぞれ 2 件ずつに減少した。石鹸流水手洗い後の洗浄不十分部位は、1 回目では手首 7 件、爪 6 件、指の付け根 5 件であった。2 回目では手首 2 件、爪 3 件に減少した一方、指の付け根は 6 件であった。洗浄状況スコアの平均値は 1 回目 72.7 点から 2 回目 89.0 点へ上昇した。"}, {"heading": "考察・結論", "content": "DesiCoach 2Go を用いることで、薬剤部員の手指衛生における不十分部位を視覚的かつ客観的に評価することができた。また、評価結果のフィードバックと再教育により、手指消毒および石鹸流水手洗い手技の改善が認められ、教育介入の有用性が示唆された。"}], "body_text": "### 背景・目的\n\n手指衛生は最も重要な基本的感染対策の一つであるが、薬剤部門における手技の実施状況を客観的に評価した報告は限られている。今回、手指消毒トレーニングキットである DesiCoach 2Go を用いて、薬剤部員の手指消毒および石鹸流水手洗いの実施状況を評価し、フィードバックおよび再教育を行ったためその効果について報告する。\n\n### 方法\n\n2025 年度 9 月（1 回目）と 3 月（2 回目）の 2 回に分けて、当院薬剤部員を対象に調査を実施した。調査には DesiCoach 2Go を用い、蛍光塗料を手指消毒剤に見立て手指消毒を行い、ブラックライト下で消毒不十分部位を確認した。また、石鹸流水手洗い後の蛍光塗料残存状況から洗浄状況スコアを算出した。1 回目評価終了後、手指消毒時の不十分部位を対象者へフィードバックするとともに、正しい手指消毒剤の使用方法および石鹸流水手洗い方法について再教育を実施し、再評価（2 回目）を行った。\n\n### 結果\n\n手指消毒時の不十分部位は、1 回目（12 名実施）では指関節（手背側）9 件、手背5 件、爪 4 件認められたが、2 回目（11 名実施）ではそれぞれ 2 件ずつに減少した。石鹸流水手洗い後の洗浄不十分部位は、1 回目では手首 7 件、爪 6 件、指の付け根 5 件であった。2 回目では手首 2 件、爪 3 件に減少した一方、指の付け根は 6 件であった。洗浄状況スコアの平均値は 1 回目 72.7 点から 2 回目 89.0 点へ上昇した。\n\n### 考察・結論\n\nDesiCoach 2Go を用いることで、薬剤部員の手指衛生における不十分部位を視覚的かつ客観的に評価することができた。また、評価結果のフィードバックと再教育により、手指消毒および石鹸流水手洗い手技の改善が認められ、教育介入の有用性が示唆された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-83-1\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [270]\nstatus: \"imported\"\n---\n\n# DesiCoach 2Go を用いた薬剤部員の手指衛生手技評価と教育介入効果\n\n- 演題番号: P1-83-1\n- 演題名: DesiCoach 2Go を用いた薬剤部員の手指衛生手技評価と教育介入効果\n- 所属施設: NHO 千葉医療センター 薬剤部\n- 筆頭演者: 小口 莉央（こぐち りお）\n- 筆頭演者の所属: NHO 千葉医療センター 薬剤部\n- 演者名: 小口 莉央（こぐち りお）、 松永 浩明（まつなが ひろあき）、 斎藤 達也（さいとう たつや）、 古林 園子（こばやし そのこ）、 野村 理恵（のむら りえ）、 関口 昌利（せきぐち まさとし）\n- 原本: [PDF 270ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=270>)\n- 冊子ページ: 514\n\n## 抄録本文\n\n### 背景・目的\n\n手指衛生は最も重要な基本的感染対策の一つであるが、薬剤部門における手技の実施状況を客観的に評価した報告は限られている。今回、手指消毒トレーニングキットである DesiCoach 2Go を用いて、薬剤部員の手指消毒および石鹸流水手洗いの実施状況を評価し、フィードバックおよび再教育を行ったためその効果について報告する。\n\n### 方法\n\n2025 年度 9 月（1 回目）と 3 月（2 回目）の 2 回に分けて、当院薬剤部員を対象に調査を実施した。調査には DesiCoach 2Go を用い、蛍光塗料を手指消毒剤に見立て手指消毒を行い、ブラックライト下で消毒不十分部位を確認した。また、石鹸流水手洗い後の蛍光塗料残存状況から洗浄状況スコアを算出した。1 回目評価終了後、手指消毒時の不十分部位を対象者へフィードバックするとともに、正しい手指消毒剤の使用方法および石鹸流水手洗い方法について再教育を実施し、再評価（2 回目）を行った。\n\n### 結果\n\n手指消毒時の不十分部位は、1 回目（12 名実施）では指関節（手背側）9 件、手背5 件、爪 4 件認められたが、2 回目（11 名実施）ではそれぞれ 2 件ずつに減少した。石鹸流水手洗い後の洗浄不十分部位は、1 回目では手首 7 件、爪 6 件、指の付け根 5 件であった。2 回目では手首 2 件、爪 3 件に減少した一方、指の付け根は 6 件であった。洗浄状況スコアの平均値は 1 回目 72.7 点から 2 回目 89.0 点へ上昇した。\n\n### 考察・結論\n\nDesiCoach 2Go を用いることで、薬剤部員の手指衛生における不十分部位を視覚的かつ客観的に評価することができた。また、評価結果のフィードバックと再教育により、手指消毒および石鹸流水手洗い手技の改善が認められ、教育介入の有用性が示唆された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 蛍光塗料を用いて薬剤部員の手指消毒・手洗いの不十分部位を可視化し、再教育後に評価。\n- 全体スコアは改善する一方、指の付け根など残存課題も示す。個別の弱点に合わせた教育と再評価の方法が参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-87-1", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-87", "session_name": "医薬品在庫・薬価・簡易懸濁・生成AI活用", "title": "抗がん剤調製に要するコスト削減の検討", "authors": "中島 彩代（なかしま あやね）、 宮森 彩香（みやもり あやか）、 石垣 千絵（いしがき ちえ）", "first_author": "中島 彩代（なかしま あやね）", "affiliations": "NHO 東埼玉病院 薬剤部", "first_affiliation": "NHO 東埼玉病院 薬剤部", "printed_pages": "524", "pdf_pages": "280", "features": ["抗がん薬調製の費用を、薬価と閉鎖式接続器具の組合せ、無菌製剤処理料との関係から試算。", "希望小売価格を用いた計算である点を踏まえ、規格選択と器具使用方針が費用に及ぼす影響を確認したい。"], "issues": [], "sections": [{"heading": "背景", "content": "抗がん剤の曝露対策として閉鎖式薬物輸送システム（CSTD）の使用が推奨されている。昨今の物価高騰は病院経営を圧迫しており、物品コストの適正化は各病院に共通する重要な課題となっている。現在、東埼玉病院薬剤部では全ての抗がん剤調製に CSTD を使用しているが、コスト面から検討したことはない。"}, {"heading": "目的", "content": "抗がん剤調製に要するコストの削減方法について検討を行う。"}, {"heading": "方法", "content": "2025 年 1 月〜12 月の抗がん剤調製記録より、使用したCSTD の費用を算出した。納入価格は開示できないため、希望小売価格（税込）をもとに計算した。また、無菌製剤処理料 1（イ）の点数 180 点（1,800 円）と使用した CSTD との差額を求めた。さらに、殺細胞性抗がん剤の調製に使用を限定した場合の金額も試算し、比較した。最後に、多規格製剤の抗がん剤について、患者の体表面積を 1.5m2 とした場合に、薬価と CSTD の費用の総計が最小となる規格の組み合わせを検討した。"}, {"heading": "結果", "content": "対象期間内における CSTD の費用は、無菌製剤処理料 1（イ）の算定額を 572,750 円上回った。同期間に殺細胞性抗がん剤に限定して CSTD を使用した場合の費用は、無菌製剤処理料 1（イ）を 376,399 円上回り、1 年間で 196,351 円コストを削減できることが分かった。薬価とCSTD の費用の総計は、多規格製剤の抗がん剤においては CSTD の使用量に関わらず、薬価がより安価になる組み合わせを選択した場合に最も低コストで調製が可能となることが分かった。"}, {"heading": "考察", "content": "抗がん剤調製に要する費用の削減には、使用対象の薬剤を殺細胞性抗がん剤に限定することが有効な方法と考える。今後は、より価格の低い CSTD への変更についても検討していきたい。"}], "body_text": "### 背景\n\n抗がん剤の曝露対策として閉鎖式薬物輸送システム（CSTD）の使用が推奨されている。昨今の物価高騰は病院経営を圧迫しており、物品コストの適正化は各病院に共通する重要な課題となっている。現在、東埼玉病院薬剤部では全ての抗がん剤調製に CSTD を使用しているが、コスト面から検討したことはない。\n\n### 目的\n\n抗がん剤調製に要するコストの削減方法について検討を行う。\n\n### 方法\n\n2025 年 1 月〜12 月の抗がん剤調製記録より、使用したCSTD の費用を算出した。納入価格は開示できないため、希望小売価格（税込）をもとに計算した。また、無菌製剤処理料 1（イ）の点数 180 点（1,800 円）と使用した CSTD との差額を求めた。さらに、殺細胞性抗がん剤の調製に使用を限定した場合の金額も試算し、比較した。最後に、多規格製剤の抗がん剤について、患者の体表面積を 1.5m2 とした場合に、薬価と CSTD の費用の総計が最小となる規格の組み合わせを検討した。\n\n### 結果\n\n対象期間内における CSTD の費用は、無菌製剤処理料 1（イ）の算定額を 572,750 円上回った。同期間に殺細胞性抗がん剤に限定して CSTD を使用した場合の費用は、無菌製剤処理料 1（イ）を 376,399 円上回り、1 年間で 196,351 円コストを削減できることが分かった。薬価とCSTD の費用の総計は、多規格製剤の抗がん剤においては CSTD の使用量に関わらず、薬価がより安価になる組み合わせを選択した場合に最も低コストで調製が可能となることが分かった。\n\n### 考察\n\n抗がん剤調製に要する費用の削減には、使用対象の薬剤を殺細胞性抗がん剤に限定することが有効な方法と考える。今後は、より価格の低い CSTD への変更についても検討していきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-87-1\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [280]\nstatus: \"imported\"\n---\n\n# 抗がん剤調製に要するコスト削減の検討\n\n- 演題番号: P1-87-1\n- 演題名: 抗がん剤調製に要するコスト削減の検討\n- 所属施設: NHO 東埼玉病院 薬剤部\n- 筆頭演者: 中島 彩代（なかしま あやね）\n- 筆頭演者の所属: NHO 東埼玉病院 薬剤部\n- 演者名: 中島 彩代（なかしま あやね）、 宮森 彩香（みやもり あやか）、 石垣 千絵（いしがき ちえ）\n- 原本: [PDF 280ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=280>)\n- 冊子ページ: 524\n\n## 抄録本文\n\n### 背景\n\n抗がん剤の曝露対策として閉鎖式薬物輸送システム（CSTD）の使用が推奨されている。昨今の物価高騰は病院経営を圧迫しており、物品コストの適正化は各病院に共通する重要な課題となっている。現在、東埼玉病院薬剤部では全ての抗がん剤調製に CSTD を使用しているが、コスト面から検討したことはない。\n\n### 目的\n\n抗がん剤調製に要するコストの削減方法について検討を行う。\n\n### 方法\n\n2025 年 1 月〜12 月の抗がん剤調製記録より、使用したCSTD の費用を算出した。納入価格は開示できないため、希望小売価格（税込）をもとに計算した。また、無菌製剤処理料 1（イ）の点数 180 点（1,800 円）と使用した CSTD との差額を求めた。さらに、殺細胞性抗がん剤の調製に使用を限定した場合の金額も試算し、比較した。最後に、多規格製剤の抗がん剤について、患者の体表面積を 1.5m2 とした場合に、薬価と CSTD の費用の総計が最小となる規格の組み合わせを検討した。\n\n### 結果\n\n対象期間内における CSTD の費用は、無菌製剤処理料 1（イ）の算定額を 572,750 円上回った。同期間に殺細胞性抗がん剤に限定して CSTD を使用した場合の費用は、無菌製剤処理料 1（イ）を 376,399 円上回り、1 年間で 196,351 円コストを削減できることが分かった。薬価とCSTD の費用の総計は、多規格製剤の抗がん剤においては CSTD の使用量に関わらず、薬価がより安価になる組み合わせを選択した場合に最も低コストで調製が可能となることが分かった。\n\n### 考察\n\n抗がん剤調製に要する費用の削減には、使用対象の薬剤を殺細胞性抗がん剤に限定することが有効な方法と考える。今後は、より価格の低い CSTD への変更についても検討していきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 抗がん薬調製の費用を、薬価と閉鎖式接続器具の組合せ、無菌製剤処理料との関係から試算。\n- 希望小売価格を用いた計算である点を踏まえ、規格選択と器具使用方針が費用に及ぼす影響を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-87-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-87", "session_name": "医薬品在庫・薬価・簡易懸濁・生成AI活用", "title": "個別化医薬品流通管理プラットフォーム「NOVUMN」導入が医薬品在庫適正化に与える影響の検討", "authors": "西田 裕哉（にしだ ゆうや）、合 原 嘉寿（ごうはら よしひさ）、 吉田 翔平（よしだ しょうへい）、 東島 幸道（ひがしじま こうどう）、 鈴田 浩孝（すずた ひろたか）", "first_author": "西田 裕哉（にしだ ゆうや）", "affiliations": "NHO 嬉野医療センター 薬剤科", "first_affiliation": "NHO 嬉野医療センター 薬剤科", "printed_pages": "524", "pdf_pages": "280", "features": ["個別化医薬品流通管理プラットフォームの導入を、棚卸額・購入額・返品・急配から評価。", "全体在庫は減少する一方、対象薬の金額は月により変動。需要変化とシステム効果の切り分けが聴講ポイント。"], "issues": [], "sections": [{"heading": "目的", "content": "高額かつ冷所管理を要する医薬品の増加により、投与中止に伴う期限切れ廃棄や過剰在庫の減少を目的として、当院では 2026 年 2 月より個別化医薬品流通管理プラットフォーム「NOVUMN」を導入した。本調査では NOVUMN 導入前後における棚卸し額や購入額の推移を評価し、在庫管理体制への影響を検討した。"}, {"heading": "方法", "content": "2025 年 3 月〜2026 年 3 月を調査期間とし、棚卸し額および購入額の推移を調査した。あわせて医薬品返品数や急配件数を調査した。"}, {"heading": "結果", "content": "NOVUMN 対象医薬品（以下対象薬）の棚卸し額は 2025 年 3 月340 万円、2026 年 2 月 270 万円、3 月 480 万円であった。また、全体の棚卸し額は 2025年 3 月 5290 万円から 2026 年 2 月 5070 万円、3 月 4110 万円へ減少した。一方、対象薬の購入額は 2025 年 3 月 1170 万円から 2026 年 2 月 1040 万円、3 月 1550 万円と同月比較では増加傾向を示した。さらに、対象薬の返品および急配件数は導入後いずれも 0 件であった。"}, {"heading": "考察", "content": "NOVUMN 導入により定数や発注タイミングの見直しなどを通じて在庫管理への意識が高まった結果、対象薬の棚卸額が適正に保たれていると考える。また、対象薬の購入額は増加傾向だが全体の棚卸額が減少したことも間接的な NOVUMN 導入の効果と考える。さらに、返品や急配がなかったことから不要な購入や患者をお待たせすることなく運用できていると考える。今後も対象薬の使用状況の正確な把握と適切な購入・返品を通して患者満足度や病院経営に貢献したい。"}], "body_text": "### 目的\n\n高額かつ冷所管理を要する医薬品の増加により、投与中止に伴う期限切れ廃棄や過剰在庫の減少を目的として、当院では 2026 年 2 月より個別化医薬品流通管理プラットフォーム「NOVUMN」を導入した。本調査では NOVUMN 導入前後における棚卸し額や購入額の推移を評価し、在庫管理体制への影響を検討した。\n\n### 方法\n\n2025 年 3 月〜2026 年 3 月を調査期間とし、棚卸し額および購入額の推移を調査した。あわせて医薬品返品数や急配件数を調査した。\n\n### 結果\n\nNOVUMN 対象医薬品（以下対象薬）の棚卸し額は 2025 年 3 月340 万円、2026 年 2 月 270 万円、3 月 480 万円であった。また、全体の棚卸し額は 2025年 3 月 5290 万円から 2026 年 2 月 5070 万円、3 月 4110 万円へ減少した。一方、対象薬の購入額は 2025 年 3 月 1170 万円から 2026 年 2 月 1040 万円、3 月 1550 万円と同月比較では増加傾向を示した。さらに、対象薬の返品および急配件数は導入後いずれも 0 件であった。\n\n### 考察\n\nNOVUMN 導入により定数や発注タイミングの見直しなどを通じて在庫管理への意識が高まった結果、対象薬の棚卸額が適正に保たれていると考える。また、対象薬の購入額は増加傾向だが全体の棚卸額が減少したことも間接的な NOVUMN 導入の効果と考える。さらに、返品や急配がなかったことから不要な購入や患者をお待たせすることなく運用できていると考える。今後も対象薬の使用状況の正確な把握と適切な購入・返品を通して患者満足度や病院経営に貢献したい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-87-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [280]\nstatus: \"imported\"\n---\n\n# 個別化医薬品流通管理プラットフォーム「NOVUMN」導入が医薬品在庫適正化に与える影響の検討\n\n- 演題番号: P1-87-2\n- 演題名: 個別化医薬品流通管理プラットフォーム「NOVUMN」導入が医薬品在庫適正化に与える影響の検討\n- 所属施設: NHO 嬉野医療センター 薬剤科\n- 筆頭演者: 西田 裕哉（にしだ ゆうや）\n- 筆頭演者の所属: NHO 嬉野医療センター 薬剤科\n- 演者名: 西田 裕哉（にしだ ゆうや）、合 原 嘉寿（ごうはら よしひさ）、 吉田 翔平（よしだ しょうへい）、 東島 幸道（ひがしじま こうどう）、 鈴田 浩孝（すずた ひろたか）\n- 原本: [PDF 280ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=280>)\n- 冊子ページ: 524\n\n## 抄録本文\n\n### 目的\n\n高額かつ冷所管理を要する医薬品の増加により、投与中止に伴う期限切れ廃棄や過剰在庫の減少を目的として、当院では 2026 年 2 月より個別化医薬品流通管理プラットフォーム「NOVUMN」を導入した。本調査では NOVUMN 導入前後における棚卸し額や購入額の推移を評価し、在庫管理体制への影響を検討した。\n\n### 方法\n\n2025 年 3 月〜2026 年 3 月を調査期間とし、棚卸し額および購入額の推移を調査した。あわせて医薬品返品数や急配件数を調査した。\n\n### 結果\n\nNOVUMN 対象医薬品（以下対象薬）の棚卸し額は 2025 年 3 月340 万円、2026 年 2 月 270 万円、3 月 480 万円であった。また、全体の棚卸し額は 2025年 3 月 5290 万円から 2026 年 2 月 5070 万円、3 月 4110 万円へ減少した。一方、対象薬の購入額は 2025 年 3 月 1170 万円から 2026 年 2 月 1040 万円、3 月 1550 万円と同月比較では増加傾向を示した。さらに、対象薬の返品および急配件数は導入後いずれも 0 件であった。\n\n### 考察\n\nNOVUMN 導入により定数や発注タイミングの見直しなどを通じて在庫管理への意識が高まった結果、対象薬の棚卸額が適正に保たれていると考える。また、対象薬の購入額は増加傾向だが全体の棚卸額が減少したことも間接的な NOVUMN 導入の効果と考える。さらに、返品や急配がなかったことから不要な購入や患者をお待たせすることなく運用できていると考える。今後も対象薬の使用状況の正確な把握と適切な購入・返品を通して患者満足度や病院経営に貢献したい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 個別化医薬品流通管理プラットフォームの導入を、棚卸額・購入額・返品・急配から評価。\n- 全体在庫は減少する一方、対象薬の金額は月により変動。需要変化とシステム効果の切り分けが聴講ポイント。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-87-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-87", "session_name": "医薬品在庫・薬価・簡易懸濁・生成AI活用", "title": "薬価改定が施設に与える金銭的影響について", "authors": "坂井 翔太（さかい しょうた）、 田淵 克則（たぶち かつのり）、 野崎 里紗（のざき りさ）、 定方 萌（さだかた もえ）、 田中 綾（たなか あや）、 鈴木 慈子（すずき いつこ）、勝 弘毅（かつ ひろき）、 早川 裕二（はやかわ ゆうじ）、 井上 裕貴（いのうえ ひろたか）、 平野 隆司（ひらの りゅうじ）", "first_author": "坂井 翔太（さかい しょうた）", "affiliations": "NHO 名古屋医療センター 薬剤部", "first_affiliation": "NHO 名古屋医療センター 薬剤部", "printed_pages": "524", "pdf_pages": "280", "features": ["年度末在庫数量に薬価の変動額を乗じ、薬価改定による施設の損益を品目別に可視化。", "数量が少なくても大幅値下げ品の影響が大きいことを示す。改定前の重点管理品目を選ぶ視点として参考となる。"], "issues": [], "sections": [{"heading": "目的", "content": "4 月 1 日の薬価改定は実質的に毎年実施されている。3 月初旬に薬価改定の情報が公表されると、薬価が下がる医薬品の在庫調整等により薬務担当者は忙しい月となる。今回、在庫調整をした結果、金銭的影響がどの程度あったのか不明であったため、調査した。"}, {"heading": "方法", "content": "2023〜2025 年度末の棚卸在庫数量と、薬品毎の薬価変動分を乗じ、利益・損失分について抽出した。金銭的影響が高い薬品と傾向について調査した。"}, {"heading": "結果", "content": "3 年間の薬価改定で受けた損失は合計 180 万円程度であった。2025 年度単年ではグロブリン製剤の薬価上昇の影響が大きく 48 万円程度の利益があったが、他の年度ではそれ以上の損失があった。大きな損失が出たのは 2024 年度の注射薬であったが、サトラリズマブが1 本 38 万円薬価下落し、損失の上位 5 品目だけで 83 万円程度あり、一品目あたりの下げ幅が大きい薬品の影響が大きかった。内服・注射に関わらず、在庫数と薬価変動分を乗じた金額が、一品目あたり 1 万円以上の損失がある品目を合算すると、品目数が少ないながらも全体への損失に大きく影響を与えていた。"}, {"heading": "考察", "content": "損失金額だけを見ると、実施されずに在庫になった薬剤がクローズアップされ検討課題もあるが、薬価が下がる注射薬などでも在庫ゼロ品目が数多くあった。医薬品の年度末在庫金額が 5,000 万円程度であり、2026 年度の薬価ベースの改定率が−1.22％である事を考えると、61 万円程度の損失が推測されるが、実際の損失は 73 万円程度であった。金銭的影響は採用薬にも左右されるため、在庫調整の成否は、他施設と比較が出来ればより明確になると思われた。"}], "body_text": "### 目的\n\n4 月 1 日の薬価改定は実質的に毎年実施されている。3 月初旬に薬価改定の情報が公表されると、薬価が下がる医薬品の在庫調整等により薬務担当者は忙しい月となる。今回、在庫調整をした結果、金銭的影響がどの程度あったのか不明であったため、調査した。\n\n### 方法\n\n2023〜2025 年度末の棚卸在庫数量と、薬品毎の薬価変動分を乗じ、利益・損失分について抽出した。金銭的影響が高い薬品と傾向について調査した。\n\n### 結果\n\n3 年間の薬価改定で受けた損失は合計 180 万円程度であった。2025 年度単年ではグロブリン製剤の薬価上昇の影響が大きく 48 万円程度の利益があったが、他の年度ではそれ以上の損失があった。大きな損失が出たのは 2024 年度の注射薬であったが、サトラリズマブが1 本 38 万円薬価下落し、損失の上位 5 品目だけで 83 万円程度あり、一品目あたりの下げ幅が大きい薬品の影響が大きかった。内服・注射に関わらず、在庫数と薬価変動分を乗じた金額が、一品目あたり 1 万円以上の損失がある品目を合算すると、品目数が少ないながらも全体への損失に大きく影響を与えていた。\n\n### 考察\n\n損失金額だけを見ると、実施されずに在庫になった薬剤がクローズアップされ検討課題もあるが、薬価が下がる注射薬などでも在庫ゼロ品目が数多くあった。医薬品の年度末在庫金額が 5,000 万円程度であり、2026 年度の薬価ベースの改定率が−1.22％である事を考えると、61 万円程度の損失が推測されるが、実際の損失は 73 万円程度であった。金銭的影響は採用薬にも左右されるため、在庫調整の成否は、他施設と比較が出来ればより明確になると思われた。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-87-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [280]\nstatus: \"imported\"\n---\n\n# 薬価改定が施設に与える金銭的影響について\n\n- 演題番号: P1-87-3\n- 演題名: 薬価改定が施設に与える金銭的影響について\n- 所属施設: NHO 名古屋医療センター 薬剤部\n- 筆頭演者: 坂井 翔太（さかい しょうた）\n- 筆頭演者の所属: NHO 名古屋医療センター 薬剤部\n- 演者名: 坂井 翔太（さかい しょうた）、 田淵 克則（たぶち かつのり）、 野崎 里紗（のざき りさ）、 定方 萌（さだかた もえ）、 田中 綾（たなか あや）、 鈴木 慈子（すずき いつこ）、勝 弘毅（かつ ひろき）、 早川 裕二（はやかわ ゆうじ）、 井上 裕貴（いのうえ ひろたか）、 平野 隆司（ひらの りゅうじ）\n- 原本: [PDF 280ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=280>)\n- 冊子ページ: 524\n\n## 抄録本文\n\n### 目的\n\n4 月 1 日の薬価改定は実質的に毎年実施されている。3 月初旬に薬価改定の情報が公表されると、薬価が下がる医薬品の在庫調整等により薬務担当者は忙しい月となる。今回、在庫調整をした結果、金銭的影響がどの程度あったのか不明であったため、調査した。\n\n### 方法\n\n2023〜2025 年度末の棚卸在庫数量と、薬品毎の薬価変動分を乗じ、利益・損失分について抽出した。金銭的影響が高い薬品と傾向について調査した。\n\n### 結果\n\n3 年間の薬価改定で受けた損失は合計 180 万円程度であった。2025 年度単年ではグロブリン製剤の薬価上昇の影響が大きく 48 万円程度の利益があったが、他の年度ではそれ以上の損失があった。大きな損失が出たのは 2024 年度の注射薬であったが、サトラリズマブが1 本 38 万円薬価下落し、損失の上位 5 品目だけで 83 万円程度あり、一品目あたりの下げ幅が大きい薬品の影響が大きかった。内服・注射に関わらず、在庫数と薬価変動分を乗じた金額が、一品目あたり 1 万円以上の損失がある品目を合算すると、品目数が少ないながらも全体への損失に大きく影響を与えていた。\n\n### 考察\n\n損失金額だけを見ると、実施されずに在庫になった薬剤がクローズアップされ検討課題もあるが、薬価が下がる注射薬などでも在庫ゼロ品目が数多くあった。医薬品の年度末在庫金額が 5,000 万円程度であり、2026 年度の薬価ベースの改定率が−1.22％である事を考えると、61 万円程度の損失が推測されるが、実際の損失は 73 万円程度であった。金銭的影響は採用薬にも左右されるため、在庫調整の成否は、他施設と比較が出来ればより明確になると思われた。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 年度末在庫数量に薬価の変動額を乗じ、薬価改定による施設の損益を品目別に可視化。\n- 数量が少なくても大幅値下げ品の影響が大きいことを示す。改定前の重点管理品目を選ぶ視点として参考となる。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-87-4", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-87", "session_name": "医薬品在庫・薬価・簡易懸濁・生成AI活用", "title": "NHO 甲府病院重心病棟定期処方における調剤簡素化の効果", "authors": "白井 毅（しらい つよし）、 牧山 稔（まきやま みのる）、 小俣 裕之（おまた ひろゆき）、奥 隅 拓朗（おくずみ たくろう）、 佐藤 りら（さとう りら）、 清水 彩夏（しみず あやか）", "first_author": "白井 毅（しらい つよし）", "affiliations": "NHO 甲府病院 薬剤部", "first_affiliation": "NHO 甲府病院 薬剤部", "printed_pages": "524", "pdf_pages": "280", "features": ["重症心身障害病棟の定期処方を錠剤へ置き換え、調剤件数とシステム記録による所要時間で評価。", "一包化は増える一方、計数・散剤調剤が減り4週間で約6時間短縮。工程ごとの負担変化を捉える点が特徴。"], "issues": [], "sections": [{"heading": "目的", "content": "重症心身障害児（者）病棟（以下重心病棟）の処方薬は、患者が有する著しい嚥下機能障害と併存する身体疾患により散剤かつ多剤化するため、調剤時与薬時双方で業務を煩雑にする一因となっている。近年、散剤調剤減少による調剤の負担軽減や錠剤一包化による与薬時の効率化を目的として、様々な施設で口腔内崩壊錠や簡易懸濁法が導入されている。そこで、NHO 甲府病院では、患者状態および使用薬剤から錠剤置き換え可能な患者の重心病棟の定期処方において、2025 年 9 月より散剤から錠剤への置き換えを実施した。本研究では、調剤簡素化の効果を評価するため、錠剤置き換え前および錠剤置き換え後の調剤件数および調剤所要時間（処方、散剤、一包化、計数調剤）について後方視的調査を行い算出し、比較した。"}, {"heading": "方法", "content": "2025 年 9 月 8 日〜10 月 5 日および 2026 年 3 月 9 日〜4 月 5 日の 28 日間に行った調剤について、計数調剤、一包化調剤、散剤調剤の件数および調剤に要した時間をTOSHO Sphere Ver 8.37 に記録された調剤終了時刻を用いて算出し、比較した。"}, {"heading": "結果", "content": "錠剤置き換え後、一包化調剤件数は 206⇒250 件と増加したが、計数調剤件数および散剤秤量件数はそれぞれ 411 件⇒346 件、608 件⇒547 件と減少した。総調剤件数は1225 件から 1143 件と減少した。また、それぞれの群における調剤所要時間を算出したところ、錠剤置き換えにより 4 週間あたり約 6 時間の調剤時間短縮効果が得られた。"}, {"heading": "考察", "content": "簡易懸濁法により経管投与可能な散剤の錠剤置き換えは、調剤件数の減少を通じて全体の調剤時間を短縮させることが明らかになった。また、与薬回数の減少を通じて与薬の効率化をもたらす可能性が示唆された。"}], "body_text": "### 目的\n\n重症心身障害児（者）病棟（以下重心病棟）の処方薬は、患者が有する著しい嚥下機能障害と併存する身体疾患により散剤かつ多剤化するため、調剤時与薬時双方で業務を煩雑にする一因となっている。近年、散剤調剤減少による調剤の負担軽減や錠剤一包化による与薬時の効率化を目的として、様々な施設で口腔内崩壊錠や簡易懸濁法が導入されている。そこで、NHO 甲府病院では、患者状態および使用薬剤から錠剤置き換え可能な患者の重心病棟の定期処方において、2025 年 9 月より散剤から錠剤への置き換えを実施した。本研究では、調剤簡素化の効果を評価するため、錠剤置き換え前および錠剤置き換え後の調剤件数および調剤所要時間（処方、散剤、一包化、計数調剤）について後方視的調査を行い算出し、比較した。\n\n### 方法\n\n2025 年 9 月 8 日〜10 月 5 日および 2026 年 3 月 9 日〜4 月 5 日の 28 日間に行った調剤について、計数調剤、一包化調剤、散剤調剤の件数および調剤に要した時間をTOSHO Sphere Ver 8.37 に記録された調剤終了時刻を用いて算出し、比較した。\n\n### 結果\n\n錠剤置き換え後、一包化調剤件数は 206⇒250 件と増加したが、計数調剤件数および散剤秤量件数はそれぞれ 411 件⇒346 件、608 件⇒547 件と減少した。総調剤件数は1225 件から 1143 件と減少した。また、それぞれの群における調剤所要時間を算出したところ、錠剤置き換えにより 4 週間あたり約 6 時間の調剤時間短縮効果が得られた。\n\n### 考察\n\n簡易懸濁法により経管投与可能な散剤の錠剤置き換えは、調剤件数の減少を通じて全体の調剤時間を短縮させることが明らかになった。また、与薬回数の減少を通じて与薬の効率化をもたらす可能性が示唆された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-87-4\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [280]\nstatus: \"imported\"\n---\n\n# NHO 甲府病院重心病棟定期処方における調剤簡素化の効果\n\n- 演題番号: P1-87-4\n- 演題名: NHO 甲府病院重心病棟定期処方における調剤簡素化の効果\n- 所属施設: NHO 甲府病院 薬剤部\n- 筆頭演者: 白井 毅（しらい つよし）\n- 筆頭演者の所属: NHO 甲府病院 薬剤部\n- 演者名: 白井 毅（しらい つよし）、 牧山 稔（まきやま みのる）、 小俣 裕之（おまた ひろゆき）、奥 隅 拓朗（おくずみ たくろう）、 佐藤 りら（さとう りら）、 清水 彩夏（しみず あやか）\n- 原本: [PDF 280ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=280>)\n- 冊子ページ: 524\n\n## 抄録本文\n\n### 目的\n\n重症心身障害児（者）病棟（以下重心病棟）の処方薬は、患者が有する著しい嚥下機能障害と併存する身体疾患により散剤かつ多剤化するため、調剤時与薬時双方で業務を煩雑にする一因となっている。近年、散剤調剤減少による調剤の負担軽減や錠剤一包化による与薬時の効率化を目的として、様々な施設で口腔内崩壊錠や簡易懸濁法が導入されている。そこで、NHO 甲府病院では、患者状態および使用薬剤から錠剤置き換え可能な患者の重心病棟の定期処方において、2025 年 9 月より散剤から錠剤への置き換えを実施した。本研究では、調剤簡素化の効果を評価するため、錠剤置き換え前および錠剤置き換え後の調剤件数および調剤所要時間（処方、散剤、一包化、計数調剤）について後方視的調査を行い算出し、比較した。\n\n### 方法\n\n2025 年 9 月 8 日〜10 月 5 日および 2026 年 3 月 9 日〜4 月 5 日の 28 日間に行った調剤について、計数調剤、一包化調剤、散剤調剤の件数および調剤に要した時間をTOSHO Sphere Ver 8.37 に記録された調剤終了時刻を用いて算出し、比較した。\n\n### 結果\n\n錠剤置き換え後、一包化調剤件数は 206⇒250 件と増加したが、計数調剤件数および散剤秤量件数はそれぞれ 411 件⇒346 件、608 件⇒547 件と減少した。総調剤件数は1225 件から 1143 件と減少した。また、それぞれの群における調剤所要時間を算出したところ、錠剤置き換えにより 4 週間あたり約 6 時間の調剤時間短縮効果が得られた。\n\n### 考察\n\n簡易懸濁法により経管投与可能な散剤の錠剤置き換えは、調剤件数の減少を通じて全体の調剤時間を短縮させることが明らかになった。また、与薬回数の減少を通じて与薬の効率化をもたらす可能性が示唆された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 重症心身障害病棟の定期処方を錠剤へ置き換え、調剤件数とシステム記録による所要時間で評価。\n- 一包化は増える一方、計数・散剤調剤が減り4週間で約6時間短縮。工程ごとの負担変化を捉える点が特徴。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-87-5", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-87", "session_name": "医薬品在庫・薬価・簡易懸濁・生成AI活用", "title": "横浜医療センターにおける簡易懸濁法導入への取り組みと成果", "authors": "石川 志栞（いしかわ しおり）、 畑山 賢輔（はたやま けんすけ）、青 山 大樹（あおやま だいき）、 田淵 燿（たぶち あきら）、 森岡 想（もりおか そう）、 市川 暁（いちかわ さとる）、 小井土 啓一（こいど けいいち）、秋 元 朝行（あきもと ともゆき）", "first_author": "石川 志栞（いしかわ しおり）", "affiliations": "NHO 横浜医療センター 薬剤部", "first_affiliation": "NHO 横浜医療センター 薬剤部", "printed_pages": "525", "pdf_pages": "281", "features": ["簡易懸濁法の導入効果を、導入前後各3か月の粉砕処方数・作業時間・換算人件費で提示。", "粉砕時間は56.9時間から26.6時間へ減少。推計人件費と実際に確保できた業務時間の活用を確認したい。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "簡易懸濁法は、粉砕法に代わる経管投与手技として近年多くの施設で普及が進んでいる。横浜医療センター（当院）での簡易懸濁法導入に向けた体制構築の取り組みについて第 79 回国立病院総合医学会で報告をした。今回、この取り組みを経て導入した簡易懸濁法による影響を評価することを目的とした。"}, {"heading": "方法", "content": "簡易懸濁法導入前（2024 年 10 月 1日〜12 月 31 日）と導入後（2025 年 10 月 1 日〜12 月 31 日）の各 3 か月間において、粉砕指示付き処方件数、粉砕調剤時間、人件費を比較した。粉砕調剤時間は当院薬剤師 3 名の平均所要時間（1 薬剤あたり 6.1 分）を用い、人件費は令和 7 年賃金構造基本統計調査による薬剤師の平均時給（2785 円）に基づき算出した。"}, {"heading": "結果", "content": "調査期間における粉砕調剤件数は簡易懸濁法導入前 560 件、導入後 262 件であった。粉砕調剤に要した総時間は、導入前 56.9 時間、導入後 26.6 時間であった。人件費は 1 か月あたり 2.8 万円の削減となった。"}, {"heading": "考察", "content": "簡易懸濁法の導入により、粉砕調剤件数は半減し、薬剤師の調剤時間の短縮と人件費の削減につながった。また、簡易懸濁法では粉砕・分包時の薬剤ロスや粉末飛散による調剤者・与薬者の暴露リスクの低減が知られており、当院においても安全面の向上に寄与したと考えられる。さらに、調剤時間短縮による業務効率化のみならず、創出された時間を病棟業務、チーム医療などの対人業務へ充当することで医療の質向上にも貢献できたと考える。当院における簡易懸濁法導入は、業務の効率化、人件費の削減、職員の健康被害を低減させるのに有用な手段であることが示唆された。"}], "body_text": "### 背景・目的\n\n簡易懸濁法は、粉砕法に代わる経管投与手技として近年多くの施設で普及が進んでいる。横浜医療センター（当院）での簡易懸濁法導入に向けた体制構築の取り組みについて第 79 回国立病院総合医学会で報告をした。今回、この取り組みを経て導入した簡易懸濁法による影響を評価することを目的とした。\n\n### 方法\n\n簡易懸濁法導入前（2024 年 10 月 1日〜12 月 31 日）と導入後（2025 年 10 月 1 日〜12 月 31 日）の各 3 か月間において、粉砕指示付き処方件数、粉砕調剤時間、人件費を比較した。粉砕調剤時間は当院薬剤師 3 名の平均所要時間（1 薬剤あたり 6.1 分）を用い、人件費は令和 7 年賃金構造基本統計調査による薬剤師の平均時給（2785 円）に基づき算出した。\n\n### 結果\n\n調査期間における粉砕調剤件数は簡易懸濁法導入前 560 件、導入後 262 件であった。粉砕調剤に要した総時間は、導入前 56.9 時間、導入後 26.6 時間であった。人件費は 1 か月あたり 2.8 万円の削減となった。\n\n### 考察\n\n簡易懸濁法の導入により、粉砕調剤件数は半減し、薬剤師の調剤時間の短縮と人件費の削減につながった。また、簡易懸濁法では粉砕・分包時の薬剤ロスや粉末飛散による調剤者・与薬者の暴露リスクの低減が知られており、当院においても安全面の向上に寄与したと考えられる。さらに、調剤時間短縮による業務効率化のみならず、創出された時間を病棟業務、チーム医療などの対人業務へ充当することで医療の質向上にも貢献できたと考える。当院における簡易懸濁法導入は、業務の効率化、人件費の削減、職員の健康被害を低減させるのに有用な手段であることが示唆された。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-87-5\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [281]\nstatus: \"imported\"\n---\n\n# 横浜医療センターにおける簡易懸濁法導入への取り組みと成果\n\n- 演題番号: P1-87-5\n- 演題名: 横浜医療センターにおける簡易懸濁法導入への取り組みと成果\n- 所属施設: NHO 横浜医療センター 薬剤部\n- 筆頭演者: 石川 志栞（いしかわ しおり）\n- 筆頭演者の所属: NHO 横浜医療センター 薬剤部\n- 演者名: 石川 志栞（いしかわ しおり）、 畑山 賢輔（はたやま けんすけ）、青 山 大樹（あおやま だいき）、 田淵 燿（たぶち あきら）、 森岡 想（もりおか そう）、 市川 暁（いちかわ さとる）、 小井土 啓一（こいど けいいち）、秋 元 朝行（あきもと ともゆき）\n- 原本: [PDF 281ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=281>)\n- 冊子ページ: 525\n\n## 抄録本文\n\n### 背景・目的\n\n簡易懸濁法は、粉砕法に代わる経管投与手技として近年多くの施設で普及が進んでいる。横浜医療センター（当院）での簡易懸濁法導入に向けた体制構築の取り組みについて第 79 回国立病院総合医学会で報告をした。今回、この取り組みを経て導入した簡易懸濁法による影響を評価することを目的とした。\n\n### 方法\n\n簡易懸濁法導入前（2024 年 10 月 1日〜12 月 31 日）と導入後（2025 年 10 月 1 日〜12 月 31 日）の各 3 か月間において、粉砕指示付き処方件数、粉砕調剤時間、人件費を比較した。粉砕調剤時間は当院薬剤師 3 名の平均所要時間（1 薬剤あたり 6.1 分）を用い、人件費は令和 7 年賃金構造基本統計調査による薬剤師の平均時給（2785 円）に基づき算出した。\n\n### 結果\n\n調査期間における粉砕調剤件数は簡易懸濁法導入前 560 件、導入後 262 件であった。粉砕調剤に要した総時間は、導入前 56.9 時間、導入後 26.6 時間であった。人件費は 1 か月あたり 2.8 万円の削減となった。\n\n### 考察\n\n簡易懸濁法の導入により、粉砕調剤件数は半減し、薬剤師の調剤時間の短縮と人件費の削減につながった。また、簡易懸濁法では粉砕・分包時の薬剤ロスや粉末飛散による調剤者・与薬者の暴露リスクの低減が知られており、当院においても安全面の向上に寄与したと考えられる。さらに、調剤時間短縮による業務効率化のみならず、創出された時間を病棟業務、チーム医療などの対人業務へ充当することで医療の質向上にも貢献できたと考える。当院における簡易懸濁法導入は、業務の効率化、人件費の削減、職員の健康被害を低減させるのに有用な手段であることが示唆された。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 簡易懸濁法の導入効果を、導入前後各3か月の粉砕処方数・作業時間・換算人件費で提示。\n- 粉砕時間は56.9時間から26.6時間へ減少。推計人件費と実際に確保できた業務時間の活用を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-87-6", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-87", "session_name": "医薬品在庫・薬価・簡易懸濁・生成AI活用", "title": "ヒドロコルチゾン 100mg 注射製剤の供給制限が小児喘息の急性増悪治療に及ぼした影響", "authors": "衛藤 智章（えとう ともあき） 1、 梶原 花菜（かじわら はな） 1、渡 辺 恭子（わたなべ きょうこ） 2、 中嶋 敏紀（なかしま としのり） 2、 大野 拓郎（おおの たくろう） 2、古 海 和博（ふるみ かずひろ） 1", "first_author": "衛藤 智章（えとう ともあき） 1", "affiliations": "1 NHO 小倉医療センター 薬剤部、2 NHO 小倉医療センター 小児科", "first_affiliation": "NHO 小倉医療センター 薬剤部", "printed_pages": "525", "pdf_pages": "281", "features": ["注射用ヒドロコルチゾンの供給制限を背景とする治療変更を、小児喘息289例で検討。", "変更後に入院・ステロイド投与期間が長かったと報告。供給問題の臨床的影響と、前後群の重症度などの違いが論点となる。"], "issues": [], "sections": [{"heading": "目的", "content": "当院では 2024 年からヒドロコルチゾン注射（以下、HDC）が供給停止により入手困難になったため、小児喘息急性増悪治療では全例でプレドニゾロン注（以下、PSL）のみで初期治療が行われた。本研究では、供給制限という外的要因により生じた治療変更が臨床転帰に与えた影響を評価し、代替治療の妥当性を検証した。"}, {"heading": "方法", "content": "HDC 供給停止前後の各1 年間に、小児喘息急性増悪に対して当院で静注ステロイドを開始した患者を調査対象とした。供給停止前は HDC で初回投与後 PSL に切り替える群（停止前）と、供給停止後は PSLのみで治療された群（停止後）に分類し、治療状況について診療録をもとに後方視的に調査し検討した。本研究は当院の倫理委員会の承認を得て実施した。"}, {"heading": "成績", "content": "調査対象は 289 例（停止前 140 例、停止後 149 例）であった。入院期間中央値は、停止前で 6（3-11）日間、停止後で 8（4-14）日（p ＜ 0.001）、ステロイド投与期間中央値は、停止前で 4（1-7）日間、停止後で 6（1-9）日（p ＜ 0.001）であり、いずれも停止後で有意に長かった。"}, {"heading": "考察", "content": "小児気管支喘息ガイドラインにおける急性増悪時治療としての HDC と PSL に優先度の記載はない。しかし今回の調査においては、HDC+PSL と比較して PSL のみで治療することで治療期間が延びる可能性が示唆された。ただし本研究は単施設における後方視的調査であるため一般化するには限界があり、患者の重症度など交絡因子の影響を完全には排除できていない。"}, {"heading": "結論", "content": "HDC 供給停止に伴う PSL 代替治療はやむを得ない事情ではあるが、小児喘息急性増悪における入院期間や治療期間に少なからず影響を及ぼした可能性が否定できない。"}], "body_text": "### 目的\n\n当院では 2024 年からヒドロコルチゾン注射（以下、HDC）が供給停止により入手困難になったため、小児喘息急性増悪治療では全例でプレドニゾロン注（以下、PSL）のみで初期治療が行われた。本研究では、供給制限という外的要因により生じた治療変更が臨床転帰に与えた影響を評価し、代替治療の妥当性を検証した。\n\n### 方法\n\nHDC 供給停止前後の各1 年間に、小児喘息急性増悪に対して当院で静注ステロイドを開始した患者を調査対象とした。供給停止前は HDC で初回投与後 PSL に切り替える群（停止前）と、供給停止後は PSLのみで治療された群（停止後）に分類し、治療状況について診療録をもとに後方視的に調査し検討した。本研究は当院の倫理委員会の承認を得て実施した。\n\n### 成績\n\n調査対象は 289 例（停止前 140 例、停止後 149 例）であった。入院期間中央値は、停止前で 6（3-11）日間、停止後で 8（4-14）日（p ＜ 0.001）、ステロイド投与期間中央値は、停止前で 4（1-7）日間、停止後で 6（1-9）日（p ＜ 0.001）であり、いずれも停止後で有意に長かった。\n\n### 考察\n\n小児気管支喘息ガイドラインにおける急性増悪時治療としての HDC と PSL に優先度の記載はない。しかし今回の調査においては、HDC+PSL と比較して PSL のみで治療することで治療期間が延びる可能性が示唆された。ただし本研究は単施設における後方視的調査であるため一般化するには限界があり、患者の重症度など交絡因子の影響を完全には排除できていない。\n\n### 結論\n\nHDC 供給停止に伴う PSL 代替治療はやむを得ない事情ではあるが、小児喘息急性増悪における入院期間や治療期間に少なからず影響を及ぼした可能性が否定できない。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-87-6\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [281]\nstatus: \"imported\"\n---\n\n# ヒドロコルチゾン 100mg 注射製剤の供給制限が小児喘息の急性増悪治療に及ぼした影響\n\n- 演題番号: P1-87-6\n- 演題名: ヒドロコルチゾン 100mg 注射製剤の供給制限が小児喘息の急性増悪治療に及ぼした影響\n- 所属施設: 1 NHO 小倉医療センター 薬剤部、2 NHO 小倉医療センター 小児科\n- 筆頭演者: 衛藤 智章（えとう ともあき） 1\n- 筆頭演者の所属: NHO 小倉医療センター 薬剤部\n- 演者名: 衛藤 智章（えとう ともあき） 1、 梶原 花菜（かじわら はな） 1、渡 辺 恭子（わたなべ きょうこ） 2、 中嶋 敏紀（なかしま としのり） 2、 大野 拓郎（おおの たくろう） 2、古 海 和博（ふるみ かずひろ） 1\n- 原本: [PDF 281ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=281>)\n- 冊子ページ: 525\n\n## 抄録本文\n\n### 目的\n\n当院では 2024 年からヒドロコルチゾン注射（以下、HDC）が供給停止により入手困難になったため、小児喘息急性増悪治療では全例でプレドニゾロン注（以下、PSL）のみで初期治療が行われた。本研究では、供給制限という外的要因により生じた治療変更が臨床転帰に与えた影響を評価し、代替治療の妥当性を検証した。\n\n### 方法\n\nHDC 供給停止前後の各1 年間に、小児喘息急性増悪に対して当院で静注ステロイドを開始した患者を調査対象とした。供給停止前は HDC で初回投与後 PSL に切り替える群（停止前）と、供給停止後は PSLのみで治療された群（停止後）に分類し、治療状況について診療録をもとに後方視的に調査し検討した。本研究は当院の倫理委員会の承認を得て実施した。\n\n### 成績\n\n調査対象は 289 例（停止前 140 例、停止後 149 例）であった。入院期間中央値は、停止前で 6（3-11）日間、停止後で 8（4-14）日（p ＜ 0.001）、ステロイド投与期間中央値は、停止前で 4（1-7）日間、停止後で 6（1-9）日（p ＜ 0.001）であり、いずれも停止後で有意に長かった。\n\n### 考察\n\n小児気管支喘息ガイドラインにおける急性増悪時治療としての HDC と PSL に優先度の記載はない。しかし今回の調査においては、HDC+PSL と比較して PSL のみで治療することで治療期間が延びる可能性が示唆された。ただし本研究は単施設における後方視的調査であるため一般化するには限界があり、患者の重症度など交絡因子の影響を完全には排除できていない。\n\n### 結論\n\nHDC 供給停止に伴う PSL 代替治療はやむを得ない事情ではあるが、小児喘息急性増悪における入院期間や治療期間に少なからず影響を及ぼした可能性が否定できない。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 注射用ヒドロコルチゾンの供給制限を背景とする治療変更を、小児喘息289例で検討。\n- 変更後に入院・ステロイド投与期間が長かったと報告。供給問題の臨床的影響と、前後群の重症度などの違いが論点となる。\n\n", "rec_grade": "B", "rec_perspective": "供給制限の臨床アウトカム", "rec_reason": "医薬品供給停止に伴うプレドニゾロン注単独への代替治療を小児喘息289例で比較し、入院期間（中央値6→8日）および投与期間（4→6日）の有意な延長（p<0.001）を示した貴重な臨床検証。"}, {"id": "P1-87-7", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-87", "session_name": "医薬品在庫・薬価・簡易懸濁・生成AI活用", "title": "生成 AI を活用した医薬品供給情報管理の効率化", "authors": "和田 真由子（わだ まゆこ）、 澤村 忠輝（さわむら ただてる）、 白崎 佑磨（しらさき ゆうま）、 木原 理絵（きはら りえ）、 山本 靖子（やまもと やすこ）", "first_author": "和田 真由子（わだ まゆこ）", "affiliations": "NHO 宇多野病院 薬剤部", "first_affiliation": "NHO 宇多野病院 薬剤部", "printed_pages": "525", "pdf_pages": "281", "features": ["生成AIを改善案検討とマクロ構築に活用し、約1,000採用品目の供給情報管理を効率化。", "数十時間を要した更新を日次・数分へ変える実務例。情報源の照合、更新手順、誤りを見つける仕組みに注目したい。"], "issues": [], "sections": [{"heading": "背景", "content": "2020 年以降後発医薬品の品質管理上の問題が相次ぎ、行政処分や生産停止を契機に医薬品供給不安が拡大した。現在も多くの品目で出荷制限が続いており、医療機関の医薬品在庫管理は困難を極めている。当院では出荷に関する情報を製薬企業からの通知やホームページから手作業で収集していたが、情報漏れや更新遅延、業務負担増大が課題であった。今回業務改善を目的に生成 AI を活用したので報告する。"}, {"heading": "方法", "content": "生成 AI（Microsoft 365 Copilot）を用いて業務改善案を抽出し、採用薬約 1000 品目の供給状況を効率的に把握する手法を検討した。初めに生成 AI に院内採用薬一覧を読み込ませ、公的情報や企業 HP から出荷制限を自動判定させることを試みたが、多様な情報源が障壁となり実現困難と判断した。代替として厚生労働省公表の「医薬品供給状況一覧」を基盤とし、院内採用薬と紐づけて出荷制限品を自動抽出する仕組みを生成 AI を用いて構築した。生成 AI の使用については院内で届出をした上で行っており、機密情報は使用していない。"}, {"heading": "結果", "content": "生成 AI を用いてマクロ機能を構築し、従来は数ヶ月に 1 回、数十時間以上かけて行っていた作業が日次更新を数分で実施できる環境へ改善することができた。"}, {"heading": "考察", "content": "アイデア創出とマクロ構築支援により業務効率と情報精度が向上したことから、生成 AI の活用は有用であったと考える。一方で情報漏洩やハルシネーションなどのリスク管理には注意が必要で、院内での生成 AI 利用手順等の整備が今後の課題であると考える。今後機密情報の使用が認められれば、医薬品購入に関わる情報など多様なデータ分析に生成 AI を応用でき、医薬品管理業務の効率化に大きく寄与すると推測する。"}], "body_text": "### 背景\n\n2020 年以降後発医薬品の品質管理上の問題が相次ぎ、行政処分や生産停止を契機に医薬品供給不安が拡大した。現在も多くの品目で出荷制限が続いており、医療機関の医薬品在庫管理は困難を極めている。当院では出荷に関する情報を製薬企業からの通知やホームページから手作業で収集していたが、情報漏れや更新遅延、業務負担増大が課題であった。今回業務改善を目的に生成 AI を活用したので報告する。\n\n### 方法\n\n生成 AI（Microsoft 365 Copilot）を用いて業務改善案を抽出し、採用薬約 1000 品目の供給状況を効率的に把握する手法を検討した。初めに生成 AI に院内採用薬一覧を読み込ませ、公的情報や企業 HP から出荷制限を自動判定させることを試みたが、多様な情報源が障壁となり実現困難と判断した。代替として厚生労働省公表の「医薬品供給状況一覧」を基盤とし、院内採用薬と紐づけて出荷制限品を自動抽出する仕組みを生成 AI を用いて構築した。生成 AI の使用については院内で届出をした上で行っており、機密情報は使用していない。\n\n### 結果\n\n生成 AI を用いてマクロ機能を構築し、従来は数ヶ月に 1 回、数十時間以上かけて行っていた作業が日次更新を数分で実施できる環境へ改善することができた。\n\n### 考察\n\nアイデア創出とマクロ構築支援により業務効率と情報精度が向上したことから、生成 AI の活用は有用であったと考える。一方で情報漏洩やハルシネーションなどのリスク管理には注意が必要で、院内での生成 AI 利用手順等の整備が今後の課題であると考える。今後機密情報の使用が認められれば、医薬品購入に関わる情報など多様なデータ分析に生成 AI を応用でき、医薬品管理業務の効率化に大きく寄与すると推測する。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-87-7\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [281]\nstatus: \"imported\"\n---\n\n# 生成 AI を活用した医薬品供給情報管理の効率化\n\n- 演題番号: P1-87-7\n- 演題名: 生成 AI を活用した医薬品供給情報管理の効率化\n- 所属施設: NHO 宇多野病院 薬剤部\n- 筆頭演者: 和田 真由子（わだ まゆこ）\n- 筆頭演者の所属: NHO 宇多野病院 薬剤部\n- 演者名: 和田 真由子（わだ まゆこ）、 澤村 忠輝（さわむら ただてる）、 白崎 佑磨（しらさき ゆうま）、 木原 理絵（きはら りえ）、 山本 靖子（やまもと やすこ）\n- 原本: [PDF 281ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=281>)\n- 冊子ページ: 525\n\n## 抄録本文\n\n### 背景\n\n2020 年以降後発医薬品の品質管理上の問題が相次ぎ、行政処分や生産停止を契機に医薬品供給不安が拡大した。現在も多くの品目で出荷制限が続いており、医療機関の医薬品在庫管理は困難を極めている。当院では出荷に関する情報を製薬企業からの通知やホームページから手作業で収集していたが、情報漏れや更新遅延、業務負担増大が課題であった。今回業務改善を目的に生成 AI を活用したので報告する。\n\n### 方法\n\n生成 AI（Microsoft 365 Copilot）を用いて業務改善案を抽出し、採用薬約 1000 品目の供給状況を効率的に把握する手法を検討した。初めに生成 AI に院内採用薬一覧を読み込ませ、公的情報や企業 HP から出荷制限を自動判定させることを試みたが、多様な情報源が障壁となり実現困難と判断した。代替として厚生労働省公表の「医薬品供給状況一覧」を基盤とし、院内採用薬と紐づけて出荷制限品を自動抽出する仕組みを生成 AI を用いて構築した。生成 AI の使用については院内で届出をした上で行っており、機密情報は使用していない。\n\n### 結果\n\n生成 AI を用いてマクロ機能を構築し、従来は数ヶ月に 1 回、数十時間以上かけて行っていた作業が日次更新を数分で実施できる環境へ改善することができた。\n\n### 考察\n\nアイデア創出とマクロ構築支援により業務効率と情報精度が向上したことから、生成 AI の活用は有用であったと考える。一方で情報漏洩やハルシネーションなどのリスク管理には注意が必要で、院内での生成 AI 利用手順等の整備が今後の課題であると考える。今後機密情報の使用が認められれば、医薬品購入に関わる情報など多様なデータ分析に生成 AI を応用でき、医薬品管理業務の効率化に大きく寄与すると推測する。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 生成AIを改善案検討とマクロ構築に活用し、約1,000採用品目の供給情報管理を効率化。\n- 数十時間を要した更新を日次・数分へ変える実務例。情報源の照合、更新手順、誤りを見つける仕組みに注目したい。\n\n", "rec_grade": "A", "rec_perspective": "生成AI・供給不安DX", "rec_reason": "Microsoft 365 Copilotを活用して厚労省供給状況一覧と院内採用約1,000品目を紐づけるマクロを構築し、数十時間かかっていた作業を「日次・数分」へ劇的に短縮。機密情報を扱わない安全なAI実装の好例。"}, {"id": "P1-87-8", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-87", "session_name": "医薬品在庫・薬価・簡易懸濁・生成AI活用", "title": "院内製剤スコポラミン軟膏の有効性および安全性に関する検討", "authors": "有藤 直子（うとう なおこ）、 平野 淳（ひらの あつし）、 林 誠（はやし まこと）", "first_author": "有藤 直子（うとう なおこ）", "affiliations": "NHO 東名古屋病院 薬剤部", "first_affiliation": "NHO 東名古屋病院 薬剤部", "printed_pages": "525", "pdf_pages": "281", "features": ["院内製剤スコポラミン軟膏を、追跡可能59例の流涎等の症状変化と有害事象から評価。", "皮膚障害等の中止理由や費用面も提示する。後方視的な有効性評価の方法と、継続使用時の課題を確認したい。"], "issues": [], "sections": [{"heading": "背景", "content": "流涎は口腔運動機能や嚥下機能低下などにより生じ、誤嚥性肺炎の一因となる。治療には抗コリン薬が用いられるが、経口投与では便秘や排尿障害などの副作用が懸念される。海外では経皮的スコポラミン製剤の有効性が報告されているが、本邦では未承認であり、東名古屋病院（以下、当院）では院内製剤として 5％スコポラミン軟膏を調製している。近年、A 型ボツリヌス毒素製剤（ゼオマインⓇ注用）が慢性流涎に適応追加されたが、耳下腺及び顎下腺への注射による侵襲の課題がある。そこで本研究では、スコポラミン軟膏の有効性と安全性を検討した。"}, {"heading": "方法", "content": "2025 年度までに当院でスコポラミン軟膏を導入した 99 症例中、診療録にて追跡可能であった 59 例を対象に、患者背景や臨床症状等を後方視的に調査した。"}, {"heading": "結果", "content": "59 例中、流涎症状改善や SpO2 低下頻度の減少などにより有効であった症例は 43例（72.9％）、中止は 16 例（27.1％）であった。中止理由は有害事象が 10 例、［誠林 1.1］無効が 3 例、その他 3 例であった。有害事象は、皮膚障害 6 例、意識障害 2 例、口渇 1 例、せん妄疑い 1 例であった。"}, {"heading": "考察", "content": "スコポラミン軟膏は流涎症状改善などに有用であり、比較的安全に導入可能と考えられた。一方、使用期限が長くアドヒアランス評価が困難な点が継続率低下に影響した可能性がある。流延症状改善が誤嚥性肺炎などにどれくらい影響していたかは確認できていない。また、院内製剤のため副作用救済制度の対象外であり、コスト負担も課題である。今後は長期的な有効性・安全性の検討が必要と考える。"}], "body_text": "### 背景\n\n流涎は口腔運動機能や嚥下機能低下などにより生じ、誤嚥性肺炎の一因となる。治療には抗コリン薬が用いられるが、経口投与では便秘や排尿障害などの副作用が懸念される。海外では経皮的スコポラミン製剤の有効性が報告されているが、本邦では未承認であり、東名古屋病院（以下、当院）では院内製剤として 5％スコポラミン軟膏を調製している。近年、A 型ボツリヌス毒素製剤（ゼオマインⓇ注用）が慢性流涎に適応追加されたが、耳下腺及び顎下腺への注射による侵襲の課題がある。そこで本研究では、スコポラミン軟膏の有効性と安全性を検討した。\n\n### 方法\n\n2025 年度までに当院でスコポラミン軟膏を導入した 99 症例中、診療録にて追跡可能であった 59 例を対象に、患者背景や臨床症状等を後方視的に調査した。\n\n### 結果\n\n59 例中、流涎症状改善や SpO2 低下頻度の減少などにより有効であった症例は 43例（72.9％）、中止は 16 例（27.1％）であった。中止理由は有害事象が 10 例、［誠林 1.1］無効が 3 例、その他 3 例であった。有害事象は、皮膚障害 6 例、意識障害 2 例、口渇 1 例、せん妄疑い 1 例であった。\n\n### 考察\n\nスコポラミン軟膏は流涎症状改善などに有用であり、比較的安全に導入可能と考えられた。一方、使用期限が長くアドヒアランス評価が困難な点が継続率低下に影響した可能性がある。流延症状改善が誤嚥性肺炎などにどれくらい影響していたかは確認できていない。また、院内製剤のため副作用救済制度の対象外であり、コスト負担も課題である。今後は長期的な有効性・安全性の検討が必要と考える。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-87-8\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [281]\nstatus: \"imported\"\n---\n\n# 院内製剤スコポラミン軟膏の有効性および安全性に関する検討\n\n- 演題番号: P1-87-8\n- 演題名: 院内製剤スコポラミン軟膏の有効性および安全性に関する検討\n- 所属施設: NHO 東名古屋病院 薬剤部\n- 筆頭演者: 有藤 直子（うとう なおこ）\n- 筆頭演者の所属: NHO 東名古屋病院 薬剤部\n- 演者名: 有藤 直子（うとう なおこ）、 平野 淳（ひらの あつし）、 林 誠（はやし まこと）\n- 原本: [PDF 281ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=281>)\n- 冊子ページ: 525\n\n## 抄録本文\n\n### 背景\n\n流涎は口腔運動機能や嚥下機能低下などにより生じ、誤嚥性肺炎の一因となる。治療には抗コリン薬が用いられるが、経口投与では便秘や排尿障害などの副作用が懸念される。海外では経皮的スコポラミン製剤の有効性が報告されているが、本邦では未承認であり、東名古屋病院（以下、当院）では院内製剤として 5％スコポラミン軟膏を調製している。近年、A 型ボツリヌス毒素製剤（ゼオマインⓇ注用）が慢性流涎に適応追加されたが、耳下腺及び顎下腺への注射による侵襲の課題がある。そこで本研究では、スコポラミン軟膏の有効性と安全性を検討した。\n\n### 方法\n\n2025 年度までに当院でスコポラミン軟膏を導入した 99 症例中、診療録にて追跡可能であった 59 例を対象に、患者背景や臨床症状等を後方視的に調査した。\n\n### 結果\n\n59 例中、流涎症状改善や SpO2 低下頻度の減少などにより有効であった症例は 43例（72.9％）、中止は 16 例（27.1％）であった。中止理由は有害事象が 10 例、［誠林 1.1］無効が 3 例、その他 3 例であった。有害事象は、皮膚障害 6 例、意識障害 2 例、口渇 1 例、せん妄疑い 1 例であった。\n\n### 考察\n\nスコポラミン軟膏は流涎症状改善などに有用であり、比較的安全に導入可能と考えられた。一方、使用期限が長くアドヒアランス評価が困難な点が継続率低下に影響した可能性がある。流延症状改善が誤嚥性肺炎などにどれくらい影響していたかは確認できていない。また、院内製剤のため副作用救済制度の対象外であり、コスト負担も課題である。今後は長期的な有効性・安全性の検討が必要と考える。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 院内製剤スコポラミン軟膏を、追跡可能59例の流涎等の症状変化と有害事象から評価。\n- 皮膚障害等の中止理由や費用面も提示する。後方視的な有効性評価の方法と、継続使用時の課題を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-87-9", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-87", "session_name": "医薬品在庫・薬価・簡易懸濁・生成AI活用", "title": "実務実習生とともに挙児希望乳癌患者の妊孕性温存に向き合った経験が担当チームにもたらした成長", "authors": "佐藤 公彦（さとう きみひこ） 1、 串田 祐亮（くしだ ゆうすけ） 2、塩 田 桃子（しおた ももこ） 1、 志保 美月（しほ みづき） 1、 関口 華乃（せきぐち かの） 1、 小井土 啓一（こいど けいいち） 1、 秋元 朝行（あきもと ともゆき） 1", "first_author": "佐藤 公彦（さとう きみひこ） 1", "affiliations": "1 NHO 横浜医療センター 薬剤部、2 NHO 箱根病院 薬剤科", "first_affiliation": "NHO 横浜医療センター 薬剤部", "printed_pages": "526", "pdf_pages": "282", "features": ["乳癌患者の妊孕性温存を実習生と共に検討した経験を、担当薬剤師の学び・行動変容から評価。", "文献の批判的吟味と患者の価値観を含む意思決定が特徴。症例経験をチーム教育へつなぐ方法に関心がある人向け。"], "issues": [], "sections": [{"heading": "目的", "content": "挙児希望を持つ乳癌患者の妊孕性温存は、薬剤師が関与する機会の少ない課題である。今回我々は、実習配属されていた実務実習生とともに本症例に向き合い、調査・議論・指導を多角的に経験した。担当チームが得た学びと行動変容を Kirkpatrick（KP）モデルで記述的に整理した。"}, {"heading": "症例", "content": "34 歳の閉経前女性。浸潤性乳管癌（pStageIA）に対し右乳房部分切除術・センチネルリンパ節生検を施行。低再発リスクと判定され、術後のタモキシフェン内服が予定された。自然妊娠による第二子出産を希望しており、休薬期間を含む妊孕性温存への対応が課題となった。"}, {"heading": "取り組み", "content": "担当チーム全員で文献収集・批判的吟味を行い、薬学的エビデンスを整理した。担当医と複数回の協議、患者本人との面談を経て方針を決定した。今回の経緯をまとめて症例報告会で発表した。発表後、薬剤師 4 名に学びと行動変容について自由記述で回答を求めた。"}, {"heading": "結果", "content": "自由記述の分析から、KP モデルにおける Level 2（学習）および Level 3（行動変容）に相当する内容が確認された。薬剤師の臨床的視点は薬物治療中心から患者背景・価値観を含む全人的評価へと拡張され、実務における薬学的介入の変化が認められた。また、実習指導においても知識伝達から実務実習生の思考を引き出す指導へという変容が示された。"}, {"heading": "考察", "content": "普段関与する機会の少ない妊孕性温存という課題に実務実習生とともにチームで向き合う中で、薬剤師自身の臨床的視点の拡張と指導観の変容が同時にもたらされた。難易度の高い症例を実務実習生と共に経験することは、薬剤師が自らの実践を問い直す契機となり、教育と学習が双方向に生じる場となりうると考えられた。"}], "body_text": "### 目的\n\n挙児希望を持つ乳癌患者の妊孕性温存は、薬剤師が関与する機会の少ない課題である。今回我々は、実習配属されていた実務実習生とともに本症例に向き合い、調査・議論・指導を多角的に経験した。担当チームが得た学びと行動変容を Kirkpatrick（KP）モデルで記述的に整理した。\n\n### 症例\n\n34 歳の閉経前女性。浸潤性乳管癌（pStageIA）に対し右乳房部分切除術・センチネルリンパ節生検を施行。低再発リスクと判定され、術後のタモキシフェン内服が予定された。自然妊娠による第二子出産を希望しており、休薬期間を含む妊孕性温存への対応が課題となった。\n\n### 取り組み\n\n担当チーム全員で文献収集・批判的吟味を行い、薬学的エビデンスを整理した。担当医と複数回の協議、患者本人との面談を経て方針を決定した。今回の経緯をまとめて症例報告会で発表した。発表後、薬剤師 4 名に学びと行動変容について自由記述で回答を求めた。\n\n### 結果\n\n自由記述の分析から、KP モデルにおける Level 2（学習）および Level 3（行動変容）に相当する内容が確認された。薬剤師の臨床的視点は薬物治療中心から患者背景・価値観を含む全人的評価へと拡張され、実務における薬学的介入の変化が認められた。また、実習指導においても知識伝達から実務実習生の思考を引き出す指導へという変容が示された。\n\n### 考察\n\n普段関与する機会の少ない妊孕性温存という課題に実務実習生とともにチームで向き合う中で、薬剤師自身の臨床的視点の拡張と指導観の変容が同時にもたらされた。難易度の高い症例を実務実習生と共に経験することは、薬剤師が自らの実践を問い直す契機となり、教育と学習が双方向に生じる場となりうると考えられた。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-87-9\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [282]\nstatus: \"imported\"\n---\n\n# 実務実習生とともに挙児希望乳癌患者の妊孕性温存に向き合った経験が担当チームにもたらした成長\n\n- 演題番号: P1-87-9\n- 演題名: 実務実習生とともに挙児希望乳癌患者の妊孕性温存に向き合った経験が担当チームにもたらした成長\n- 所属施設: 1 NHO 横浜医療センター 薬剤部、2 NHO 箱根病院 薬剤科\n- 筆頭演者: 佐藤 公彦（さとう きみひこ） 1\n- 筆頭演者の所属: NHO 横浜医療センター 薬剤部\n- 演者名: 佐藤 公彦（さとう きみひこ） 1、 串田 祐亮（くしだ ゆうすけ） 2、塩 田 桃子（しおた ももこ） 1、 志保 美月（しほ みづき） 1、 関口 華乃（せきぐち かの） 1、 小井土 啓一（こいど けいいち） 1、 秋元 朝行（あきもと ともゆき） 1\n- 原本: [PDF 282ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=282>)\n- 冊子ページ: 526\n\n## 抄録本文\n\n### 目的\n\n挙児希望を持つ乳癌患者の妊孕性温存は、薬剤師が関与する機会の少ない課題である。今回我々は、実習配属されていた実務実習生とともに本症例に向き合い、調査・議論・指導を多角的に経験した。担当チームが得た学びと行動変容を Kirkpatrick（KP）モデルで記述的に整理した。\n\n### 症例\n\n34 歳の閉経前女性。浸潤性乳管癌（pStageIA）に対し右乳房部分切除術・センチネルリンパ節生検を施行。低再発リスクと判定され、術後のタモキシフェン内服が予定された。自然妊娠による第二子出産を希望しており、休薬期間を含む妊孕性温存への対応が課題となった。\n\n### 取り組み\n\n担当チーム全員で文献収集・批判的吟味を行い、薬学的エビデンスを整理した。担当医と複数回の協議、患者本人との面談を経て方針を決定した。今回の経緯をまとめて症例報告会で発表した。発表後、薬剤師 4 名に学びと行動変容について自由記述で回答を求めた。\n\n### 結果\n\n自由記述の分析から、KP モデルにおける Level 2（学習）および Level 3（行動変容）に相当する内容が確認された。薬剤師の臨床的視点は薬物治療中心から患者背景・価値観を含む全人的評価へと拡張され、実務における薬学的介入の変化が認められた。また、実習指導においても知識伝達から実務実習生の思考を引き出す指導へという変容が示された。\n\n### 考察\n\n普段関与する機会の少ない妊孕性温存という課題に実務実習生とともにチームで向き合う中で、薬剤師自身の臨床的視点の拡張と指導観の変容が同時にもたらされた。難易度の高い症例を実務実習生と共に経験することは、薬剤師が自らの実践を問い直す契機となり、教育と学習が双方向に生じる場となりうると考えられた。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 乳癌患者の妊孕性温存を実習生と共に検討した経験を、担当薬剤師の学び・行動変容から評価。\n- 文献の批判的吟味と患者の価値観を含む意思決定が特徴。症例経験をチーム教育へつなぐ方法に関心がある人向け。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P1-91-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P1-91", "session_name": "心不全SGLT2阻害薬導入提案", "title": "心不全患者における SGLT2 阻害薬使用率向上に向けた取り組み", "authors": "甲斐 七海（かい ななみ） 1、黒 原 健（くろはら けん） 1、 賀来 和泉（かく いずみ） 1、 岡部 浩祐（おかべ こうすけ） 2、 大石 博史（おおいし ひろふみ） 1、 藤瀬 陽子（ふじせ ようこ） 1、 高野 豪（たかの たけし） 1、 山脇 一浩（やまわき かずひろ） 1", "first_author": "甲斐 七海（かい ななみ） 1", "affiliations": "1 NHO 九州医療センター 薬剤科、2 山口赤十字病院 循環器内科", "first_affiliation": "NHO 九州医療センター 薬剤科", "printed_pages": "534", "pdf_pages": "290", "features": ["心不全でSGLT2阻害薬未導入の患者を抽出し、医師主導の導入に薬剤師提案を加える取り組み。", "提案10名中6名が導入に至り、非導入理由も整理。適応判断と除外基準を共有する仕組みが参考となる。"], "issues": [], "sections": [{"heading": "背景・目的", "content": "2025 年の心不全診療ガイドライン改訂により、SGLT2 阻害薬は左室駆出率を問わず使用が推奨されるようになった。当院循環器内科医師による先行調査では、2024年度に当院に入院した eGFR≧20mL/min/1.73m2 の HFrEF 患者における SGLT2 阻害薬の使用率は 60％程度にとどまっていた。今回、循環器内科医師からの依頼を契機に、循環器内科病棟入院の心不全患者のうち SGLT2 阻害薬未導入の患者（禁忌、eGFR ＜20mL/min/1.73m2、非導入理由の記載があるものは除外した）に対して、病棟薬剤師がSGLT2 阻害薬導入の提案を行う取り組みを開始したので報告する。"}, {"heading": "方法", "content": "2025 年 8 月から 2026 年 2 月までで、取り組みの対象とした症例で、入院前 SGLT2 阻害薬未使用の患者数、医師主導導入件数、薬剤師による導入提案件数および提案後の導入件数を調査した。また、除外基準の患者を含めた非導入理由について調査した。"}, {"heading": "結果", "content": "除外基準を除いた入院前SGLT2 阻害薬未使用患者は 54 名で、そのうち医師主導で導入されたのは 41 名（75.9％）であった。薬剤師による導入提案は 10 名に実施され、うち 6 名で導入に至り、最終的な導入率は 87.0％だった。また、除外基準を含む非導入患者 21 名の理由は、尿路感染症 8 件、高齢 5 件、食事摂取不安定 2 件などだった。"}, {"heading": "考察", "content": "医師主導の SGLT2 阻害薬新規導入率は 75.9％であり、ガイドライン改訂に伴う導入に対する医師の意識向上が推察された。一方で導入漏れ症例は一定数存在しており、薬剤師介入はこれらの補完に有用であったと考える。しかし、薬剤師未介入の症例も少数存在しており今後の課題である。"}], "body_text": "### 背景・目的\n\n2025 年の心不全診療ガイドライン改訂により、SGLT2 阻害薬は左室駆出率を問わず使用が推奨されるようになった。当院循環器内科医師による先行調査では、2024年度に当院に入院した eGFR≧20mL/min/1.73m2 の HFrEF 患者における SGLT2 阻害薬の使用率は 60％程度にとどまっていた。今回、循環器内科医師からの依頼を契機に、循環器内科病棟入院の心不全患者のうち SGLT2 阻害薬未導入の患者（禁忌、eGFR ＜20mL/min/1.73m2、非導入理由の記載があるものは除外した）に対して、病棟薬剤師がSGLT2 阻害薬導入の提案を行う取り組みを開始したので報告する。\n\n### 方法\n\n2025 年 8 月から 2026 年 2 月までで、取り組みの対象とした症例で、入院前 SGLT2 阻害薬未使用の患者数、医師主導導入件数、薬剤師による導入提案件数および提案後の導入件数を調査した。また、除外基準の患者を含めた非導入理由について調査した。\n\n### 結果\n\n除外基準を除いた入院前SGLT2 阻害薬未使用患者は 54 名で、そのうち医師主導で導入されたのは 41 名（75.9％）であった。薬剤師による導入提案は 10 名に実施され、うち 6 名で導入に至り、最終的な導入率は 87.0％だった。また、除外基準を含む非導入患者 21 名の理由は、尿路感染症 8 件、高齢 5 件、食事摂取不安定 2 件などだった。\n\n### 考察\n\n医師主導の SGLT2 阻害薬新規導入率は 75.9％であり、ガイドライン改訂に伴う導入に対する医師の意識向上が推察された。一方で導入漏れ症例は一定数存在しており、薬剤師介入はこれらの補完に有用であったと考える。しかし、薬剤師未介入の症例も少数存在しており今後の課題である。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P1-91-3\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [290]\nstatus: \"imported\"\n---\n\n# 心不全患者における SGLT2 阻害薬使用率向上に向けた取り組み\n\n- 演題番号: P1-91-3\n- 演題名: 心不全患者における SGLT2 阻害薬使用率向上に向けた取り組み\n- 所属施設: 1 NHO 九州医療センター 薬剤科、2 山口赤十字病院 循環器内科\n- 筆頭演者: 甲斐 七海（かい ななみ） 1\n- 筆頭演者の所属: NHO 九州医療センター 薬剤科\n- 演者名: 甲斐 七海（かい ななみ） 1、黒 原 健（くろはら けん） 1、 賀来 和泉（かく いずみ） 1、 岡部 浩祐（おかべ こうすけ） 2、 大石 博史（おおいし ひろふみ） 1、 藤瀬 陽子（ふじせ ようこ） 1、 高野 豪（たかの たけし） 1、 山脇 一浩（やまわき かずひろ） 1\n- 原本: [PDF 290ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=290>)\n- 冊子ページ: 534\n\n## 抄録本文\n\n### 背景・目的\n\n2025 年の心不全診療ガイドライン改訂により、SGLT2 阻害薬は左室駆出率を問わず使用が推奨されるようになった。当院循環器内科医師による先行調査では、2024年度に当院に入院した eGFR≧20mL/min/1.73m2 の HFrEF 患者における SGLT2 阻害薬の使用率は 60％程度にとどまっていた。今回、循環器内科医師からの依頼を契機に、循環器内科病棟入院の心不全患者のうち SGLT2 阻害薬未導入の患者（禁忌、eGFR ＜20mL/min/1.73m2、非導入理由の記載があるものは除外した）に対して、病棟薬剤師がSGLT2 阻害薬導入の提案を行う取り組みを開始したので報告する。\n\n### 方法\n\n2025 年 8 月から 2026 年 2 月までで、取り組みの対象とした症例で、入院前 SGLT2 阻害薬未使用の患者数、医師主導導入件数、薬剤師による導入提案件数および提案後の導入件数を調査した。また、除外基準の患者を含めた非導入理由について調査した。\n\n### 結果\n\n除外基準を除いた入院前SGLT2 阻害薬未使用患者は 54 名で、そのうち医師主導で導入されたのは 41 名（75.9％）であった。薬剤師による導入提案は 10 名に実施され、うち 6 名で導入に至り、最終的な導入率は 87.0％だった。また、除外基準を含む非導入患者 21 名の理由は、尿路感染症 8 件、高齢 5 件、食事摂取不安定 2 件などだった。\n\n### 考察\n\n医師主導の SGLT2 阻害薬新規導入率は 75.9％であり、ガイドライン改訂に伴う導入に対する医師の意識向上が推察された。一方で導入漏れ症例は一定数存在しており、薬剤師介入はこれらの補完に有用であったと考える。しかし、薬剤師未介入の症例も少数存在しており今後の課題である。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- 心不全でSGLT2阻害薬未導入の患者を抽出し、医師主導の導入に薬剤師提案を加える取り組み。\n- 提案10名中6名が導入に至り、非導入理由も整理。適応判断と除外基準を共有する仕組みが参考となる。\n\n", "rec_grade": "C", "rec_perspective": "心不全GDMT推進", "rec_reason": "2025年心不全ガイドライン改訂を踏まえ、未導入患者をスクリーニングして病棟薬剤師が提案（10名中6名導入、最終導入率87.0%）。非導入理由（尿路感染等）の整理も有用。"}, {"id": "P2-102-2", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-102", "session_name": "神経免疫・ALS薬物療法", "title": "当院におけるラブリズマブの使用実態の検討", "authors": "駒形 菜穂（こまがた なお）", "first_author": "駒形 菜穂（こまがた なお）", "affiliations": "国立研究開発法人 国立精神・神経医療研究センター 薬剤部", "first_affiliation": "国立研究開発法人 国立精神・神経医療研究センター 薬剤部", "printed_pages": "645", "pdf_pages": "401", "features": ["ラブリズマブの年度別利用、対象疾患、切替・併用など導入背景を集計する実態調査。", "視神経脊髄炎スペクトラム障害と既存治療への併用が中心。抄録では具体的な患者数が示されず、発表で詳細を確認したい。"], "issues": [], "sections": [{"heading": "目的", "content": "抗補体（C5）モノクローナル抗体製剤であるラブリズマブの適応拡大に伴い、実臨床における使用機会は増加している。本検討では、当院におけるラブリズマブの使用状況を集計ベースで把握し、疾患別の導入傾向および運用実態を明らかにすることを目的とした。"}, {"heading": "方法", "content": "当院においてラブリズマブが投与された症例について、電子カルテを後方視的に調査した。なお、本検討は個人を特定しない集計データのみを用いて解析を行った。評価項目は使用患者数、年度別推移、対象疾患内訳（視神経脊髄炎スペクトラム障害、全身型重症筋無力症など）、導入背景（新規導入または他剤からの切替および併用）、投与継続状況とした。"}, {"heading": "結果", "content": "ラブリズマブの使用患者数は年々増加傾向を示した。対象疾患としては視神経脊髄炎スペクトラム障害が大半を占めていた。導入背景としては既存治療への併用例が多く認められた。"}, {"heading": "考察", "content": "今回の検討では、当院におけるラブリズマブの使用は年々増加傾向を示しており、特に視神経脊髄炎スペクトラム障害において導入が進んでいることが明らかになった。近年、補体阻害薬は神経免疫疾患領域における新たな治療選択肢として位置づけられており、今後補体阻害薬の使用拡大に伴い、投与継続支援や安全管理に加え、ステロイド等免疫抑制剤の適正使用を含めた薬学的介入の重要性はさらに高まると考えられる。今後は実臨床における免疫抑制剤使用状況の変化についても検討していきたい。"}], "body_text": "### 目的\n\n抗補体（C5）モノクローナル抗体製剤であるラブリズマブの適応拡大に伴い、実臨床における使用機会は増加している。本検討では、当院におけるラブリズマブの使用状況を集計ベースで把握し、疾患別の導入傾向および運用実態を明らかにすることを目的とした。\n\n### 方法\n\n当院においてラブリズマブが投与された症例について、電子カルテを後方視的に調査した。なお、本検討は個人を特定しない集計データのみを用いて解析を行った。評価項目は使用患者数、年度別推移、対象疾患内訳（視神経脊髄炎スペクトラム障害、全身型重症筋無力症など）、導入背景（新規導入または他剤からの切替および併用）、投与継続状況とした。\n\n### 結果\n\nラブリズマブの使用患者数は年々増加傾向を示した。対象疾患としては視神経脊髄炎スペクトラム障害が大半を占めていた。導入背景としては既存治療への併用例が多く認められた。\n\n### 考察\n\n今回の検討では、当院におけるラブリズマブの使用は年々増加傾向を示しており、特に視神経脊髄炎スペクトラム障害において導入が進んでいることが明らかになった。近年、補体阻害薬は神経免疫疾患領域における新たな治療選択肢として位置づけられており、今後補体阻害薬の使用拡大に伴い、投与継続支援や安全管理に加え、ステロイド等免疫抑制剤の適正使用を含めた薬学的介入の重要性はさらに高まると考えられる。今後は実臨床における免疫抑制剤使用状況の変化についても検討していきたい。", "raw_markdown": "---\nconference: \"第80回国立病院総合医学会（2026）\"\nabstract_id: \"P2-102-2\"\ncategory: \"一般演題（ポスター）\"\nsource_pdf: \"C:\\\\Users\\\\dora2\\\\Obsidian_Vault\\\\10_学会プログラムまとめ\\\\国病学会_2026\\\\第80回国立病院総合医学会抄録集noPW_抄録のみ.pdf\"\npdf_pages: [401]\nstatus: \"imported\"\n---\n\n# 当院におけるラブリズマブの使用実態の検討\n\n- 演題番号: P2-102-2\n- 演題名: 当院におけるラブリズマブの使用実態の検討\n- 所属施設: 国立研究開発法人 国立精神・神経医療研究センター 薬剤部\n- 筆頭演者: 駒形 菜穂（こまがた なお）\n- 筆頭演者の所属: 国立研究開発法人 国立精神・神経医療研究センター 薬剤部\n- 演者名: 駒形 菜穂（こまがた なお）\n- 原本: [PDF 401ページ](<../../%E7%AC%AC80%E5%9B%9E%E5%9B%BD%E7%AB%8B%E7%97%85%E9%99%A2%E7%B7%8F%E5%90%88%E5%8C%BB%E5%AD%A6%E4%BC%9A%E6%8A%84%E9%8C%B2%E9%9B%86noPW_%E6%8A%84%E9%8C%B2%E3%81%AE%E3%81%BF.pdf#page=401>)\n- 冊子ページ: 645\n\n## 抄録本文\n\n### 目的\n\n抗補体（C5）モノクローナル抗体製剤であるラブリズマブの適応拡大に伴い、実臨床における使用機会は増加している。本検討では、当院におけるラブリズマブの使用状況を集計ベースで把握し、疾患別の導入傾向および運用実態を明らかにすることを目的とした。\n\n### 方法\n\n当院においてラブリズマブが投与された症例について、電子カルテを後方視的に調査した。なお、本検討は個人を特定しない集計データのみを用いて解析を行った。評価項目は使用患者数、年度別推移、対象疾患内訳（視神経脊髄炎スペクトラム障害、全身型重症筋無力症など）、導入背景（新規導入または他剤からの切替および併用）、投与継続状況とした。\n\n### 結果\n\nラブリズマブの使用患者数は年々増加傾向を示した。対象疾患としては視神経脊髄炎スペクトラム障害が大半を占めていた。導入背景としては既存治療への併用例が多く認められた。\n\n### 考察\n\n今回の検討では、当院におけるラブリズマブの使用は年々増加傾向を示しており、特に視神経脊髄炎スペクトラム障害において導入が進んでいることが明らかになった。近年、補体阻害薬は神経免疫疾患領域における新たな治療選択肢として位置づけられており、今後補体阻害薬の使用拡大に伴い、投与継続支援や安全管理に加え、ステロイド等免疫抑制剤の適正使用を含めた薬学的介入の重要性はさらに高まると考えられる。今後は実臨床における免疫抑制剤使用状況の変化についても検討していきたい。\n\n## 本演題の特徴\n\n以下は抄録に基づくAIによる整理です。\n\n- ラブリズマブの年度別利用、対象疾患、切替・併用など導入背景を集計する実態調査。\n- 視神経脊髄炎スペクトラム障害と既存治療への併用が中心。抄録では具体的な患者数が示されず、発表で詳細を確認したい。\n\n", "rec_grade": "", "rec_perspective": "", "rec_reason": ""}, {"id": "P2-102-3", "category": "一般演題（ポスター）", "cat_code": "poster", "cat_short": "ポスター", "session": "P2-102", "session_name": "神経免疫・ALS薬物療法", "title": "ラジカット点滴静注からラジカット内用懸濁液切り替えによる有害事象発現状況調査", "authors": "松本 淳（まつもと じゅん）、 田中 誠（たなか まこと）、 井上 大奨（いのうえ たいしょう）", "first_author": "松本 淳（まつもと じゅん）", "affiliations": "NHO 熊本再春医療センター 薬剤部薬剤科", "first_affiliation": "NHO 熊本再春医療センター 薬剤部薬剤科", "printed_pages": "645", "pdf_pages": "401", "features": ["エダラボンの注射から内用懸濁液への切替19例を、前後の検査値と消化器症状等から評価。", "下痢による中止例を含み、投与経路変更後の生活上の利点と忍容性の両面を考えられる。少数例としての評価範囲も確認したい。"], "issues": [], "sections": [{"heading": "目的", "content": "熊本再春医療センター（以下、当院）では神経難病の 1 つである筋萎縮性側索硬化症（以下、ALS）の治療が多く行われており、ラジカットの注射剤から内用懸濁液への変更が行われている。臨床試験ではラジカット注射薬から内用懸濁液へ切り替えた患者の副作用等のデータは含まれていない。そこで、当院にてラジカット注射剤から内用懸濁液へ切り替えた患者を対象に、副作用の発現状況、副作用に関する検査値の変化について調査を行った。"}, {"heading": "方法", "content": "2023 年 4 月から 2026 年 5 月までの期間に当院にて、ラジカット注射剤から内用懸濁液へ切り替えた患者を対象に切り替え前後 3 か月間の腎機能、肝機能、下痢、電解質異常のイベント発生について電子カルテを用いて後方視的に調査を行った。"}, {"heading": "結果", "content": "対象は 19症例であり、肝機能障害、腎機能障害、血小板、顆粒球減少といった症例はみられなかった。しかし、嘔吐や便秘、下痢といった消化器症状や電解質異常などがみられた。ラジカット内用懸濁液の投与中止は 2 症例（10.5％）であり、中止理由は下痢（1 症例）と、本人による希望（1 例）であった。"}, {"heading": "考察", "content": "今回の調査では切り替え後に肝機能障害、腎機能障害、血球減少となる症例は見られなかった。しかし、ラジカット内用懸濁液切り替え後、消化器症状により投与中止となった症例が見られた。ラジカット内用懸濁液へ切り替え後は消化器症状が現れる可能性があり、下痢や悪心等の副作用を意識したフォローが重要であると考える。また、電解質異常を呈し、薬剤による電解質補正を受けた患者もみられた。このため、ラジカット内用懸濁液においても、定期的な検査値の確認が必要であると考える。"}], "body_text": "### 目的\n\n熊本再春医療センター（以下、当院）では神経難病の 1 つである筋萎縮性側索硬化症（以下、ALS）の治療が多く行われており、ラジカットの注射剤から内用懸濁液への変更が行われている。臨床試験ではラジカット注射薬から内用懸濁液へ切り替えた患者の副作用等のデータは含まれていない。そこで、当院にてラジカット注射剤から内用懸濁液へ切り替えた患者を対象に、副作用の発現状況、副作用に関する検査値の変化について調査を行った。\n\n### 方法\n\n2023 年 4 月から 2026 年 5 月までの期間に当院にて、ラジカット注射剤から内用懸濁液へ切り替えた患者を対象に切り替え前後 3 か月間の腎機能、肝機能、下痢、電解質異常のイベント発生について電子カルテを用いて後方視的に調査を行った。\n\n### 結果\n\n対象は 19症例であり、肝機能障害、腎機能障害、血小板、顆粒球減少といった症例はみられなかった。しかし、嘔吐や便秘、下痢といった消化器症状や電解質異常などがみられた。ラジカット内用懸濁液の投与中止は 2 症例（10.5％）であり、中止理由は下痢（1 症例）と、本人による希望（1 例）であった。\n\n### 考察\n\n今回の調査では切り替え後に肝機能障害、腎機能障害、血球減少となる症例は見られなかった。しかし、ラジカット内用懸濁液切り替え後、消化器症状により投与中止となった症例が見られた。ラジカット内用懸濁液へ切り替え後は消化器症状が現れる可能性があり、下痢や悪心等の副作用を意識したフォローが重要であると考える。また、電解質異常を呈し、薬剤による電解質補正を受けた患者もみられた。このため、ラジカット内用懸濁液においても、定期的な検査値の確認が必要であると考える。", "raw_markdown"
